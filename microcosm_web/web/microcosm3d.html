<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microcosm 3D — 하나의 규칙으로 굴러가는 3D 세계</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0a0a10; color:#e8e6df; font-family:-apple-system,"Noto Sans KR",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px; }
  h1 { font-size:18px; font-weight:500; margin:2px 0 0; }
  p.sub { margin:0; color:#9a988f; font-size:13px; text-align:center; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button { background:#17171f; color:#e8e6df; border:1px solid #2e2e38; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button:hover { background:#20202a; border-color:#4a4a58; }
  button.k { border-color:#534AB7; }
  .stagewrap { position:relative; width:100%; max-width:880px; }
  #stage { width:100%; border-radius:12px; overflow:hidden; border:1px solid #24242c; }
  #hud { position:absolute; left:12px; top:10px; font-size:13px; color:#cfcabf; background:rgba(13,13,20,0.55); padding:4px 9px; border-radius:7px; pointer-events:none; }
  .legend { display:flex; gap:14px; font-size:12px; color:#9a988f; flex-wrap:wrap; justify-content:center; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .tip { font-size:12px; color:#74726b; }
</style>
</head>
<body>
<h1>microcosm 3D — 하나의 규칙으로 굴러가는 세계</h1>
<p class="sub">2D와 같은 식 dx/dt = f + ΣW·g + I − γx, 위치만 3-벡터로. 좌클릭 드래그=회전, 휠=줌, 바닥 위 고리=조준점.</p>
<div class="bar">
  <button id="bHero">캐릭터 소환</button>
  <button id="bFire" class="k">파이어볼 🔥 (클릭/F)</button>
  <button id="bBolt" class="k">벼락 ⚡ (L)</button>
  <button id="bMail" class="k">사슬갑옷 🛡 (C)</button>
  <button id="bReset">리셋 (R)</button>
</div>
<div class="stagewrap"><div id="stage"></div><div id="hud"></div></div>
<div class="legend">
  <span><span class="dot" style="background:#1D9E75"></span>캐릭터</span>
  <span><span class="dot" style="background:#EF9F27"></span>파이어볼</span>
  <span><span class="dot" style="background:#cfc9ff"></span>벼락</span>
  <span><span class="dot" style="background:#9aa0a6"></span>사슬갑옷</span>
</div>
<p class="tip">파이어볼을 갑옷에 맞히면 결합이 융해돼 뚫리고, 벼락을 캐릭터에 떨구면 HP가 깎입니다.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* microcosm 3D engine - 통합 기질의 3D 포팅. 규칙은 동일, 차원만 3D.

        this.fy[i] += buoy * Math.max(this.T[i] - buoyThr, 0);

        this.fx[i] -= dragC * this.vx[i]; this.fy[i] -= dragC * this.vy[i]; this.fz[i] -= dragC * this.vz[i]; }
      const meltT = 0.85, stretch = 2.3, dampB = 0.5, keep = [];
      for (const b of this.bonds) { const i = b.i, j = b.j;
        let dx = this.px[j] - this.px[i], dy = this.py[j] - this.py[i], dz = this.pz[j] - this.pz[i];
        let L = Math.hypot(dx, dy, dz) + 1e-9, ux = dx / L, uy = dy / L, uz = dz / L;

        this.fx[i] += f * ux; this.fy[i] += f * uy; this.fz[i] += f * uz;
        this.fx[j] -= f * ux; this.fy[j] -= f * uy; this.fz[j] -= f * uz; keep.push(b); }
      this.bonds = keep;
      for (let i = 0; i < n; i++) { if (!this.alive[i]) continue;
        if (this.fixed[i]) { this.vx[i] = 0; this.vy[i] = 0; this.vz[i] = 0; }
        else { this.vx[i] += this.fx[i] / this.M[i] * dt; this.vy[i] += this.fy[i] / this.M[i] * dt; this.vz[i] += this.fz[i] / this.M[i] * dt;
          this.px[i] += this.vx[i] * dt; this.py[i] += this.vy[i] * dt; this.pz[i] += this.vz[i] * dt; }

  const Forms = {
    character(w, cx, cy, cz, opt = {}) {

      const core = w.spawn({ x: cx, y: cy, z: cz, T: temp, M: 1.6, kind: KIND.CHARACTER, homeoT: temp, hp });
      const pts = [];
      for (let i = 0; i < ns; i++) {                       // 피보나치 구 분포
        const phi = Math.acos(1 - 2 * (i + 0.5) / ns), theta = Math.PI * (1 + Math.sqrt(5)) * i;
        pts.push(w.spawn({ x: cx + radius * Math.sin(phi) * Math.cos(theta), y: cy + radius * Math.cos(phi),

      }

      for (let a = 0; a < pts.length; a++) {               // 가까운 3개와 결합 -> 구 껍질
        const da = [];

          const dx = w.px[pts[a]] - w.px[pts[b]], dy = w.py[pts[a]] - w.py[pts[b]], dz = w.pz[pts[a]] - w.pz[pts[b]];

      }

    },
    fireball(w, ox, oy, oz, tx, ty, tz, opt = {}) {
      const speed = opt.speed || 40, count = opt.count || 46, spread = opt.spread || 2.2, temp = opt.temp || 2.0;
      let dx = tx - ox, dy = ty - oy, dz = tz - oz, d = Math.hypot(dx, dy, dz) + 1e-9; dx /= d; dy /= d; dz /= d;

        x: ox + (Math.random() - 0.5) * spread * 2, y: oy + (Math.random() - 0.5) * spread * 2, z: oz + (Math.random() - 0.5) * spread * 2,
        vx: dx * speed + (Math.random() - 0.5) * 8, vy: dy * speed + (Math.random() - 0.5) * 8, vz: dz * speed + (Math.random() - 0.5) * 8,
        T: temp * (0.7 + Math.random() * 0.6), M: 0.5, kind: KIND.FIRE }));

    },
    lightning(w, tx, tz, opt = {}) {

      const segs = [], units = []; let stack = [[tx, topY, tz]], budget = maxP;
      while (stack.length && budget > 0) { let [x, y, z] = stack.pop();
        while (y > groundY && budget > 0) { budget--;

          segs.push([x, y, z, nx, ny, nz]); units.push(w.spawn({ x, y, z, T: temp * (0.8 + Math.random() * 0.4), M: 0.3, kind: KIND.LIGHTNING, fixed: true }));
          if (Math.random() < branch && y > groundY + step * 3 && stack.length < maxB) stack.push([x, y, z]);
          x = nx; y = ny; z = nz; } }

      for (let i = 0; i < w.n; i++) { if (!w.alive[i] || w.kind[i] === KIND.LIGHTNING) continue; let near = false;
        for (const s of segs) { if (ptSeg3(w.px[i], w.py[i], w.pz[i], s[0], s[1], s[2], s[3], s[4], s[5]) < hitR2) { near = true; break; } }
        if (near) { w.T[i] += 1.4; if (w.hpMax[i] > 0) { w.hp[i] -= boltDmg; if (w.hp[i] <= 0) w.killUnit(i); } } }

    },
    chainmail(w, cx, topY, cz, opt = {}) {        // x-y 평면 수직 시트
      const cols = opt.cols || 12, rows = opt.rows || 9, sp = opt.spacing || 4, k = 45, hp = opt.hp || 40, ox = cx - (cols - 1) * sp / 2, grid = [];

    }

})(typeof window !== 'undefined' ? window : globalThis);
/* UI3D (색 수정2): THREE.Points + vertexColors 로 입자 색을 항상 표시.

(function () {
  const KIND = MC3.KIND, W = 160, H = 100, D = 160, OX = 80, OZ = 80;
  const stage = document.getElementById('stage');
  const hud = document.getElementById('hud');
  const ww = stage.clientWidth || 760, hh = 500;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(ww, hh); renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setClearColor(0x0d0d14, 1); stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  scene.add(new THREE.GridHelper(220, 22, 0x44475a, 0x24242c));

  points.frustumCulled = false; scene.add(points);

  const MAXB = 4000, bgeo = new THREE.BufferGeometry(), bpos = new Float32Array(MAXB * 2 * 3);

  const MAXBO = 2400, lgeo = new THREE.BufferGeometry(), lpos = new Float32Array(MAXBO * 2 * 3);

  let world, hero; const mouseT = new THREE.Vector3(16, 0, 0);
  function reset() { world = new MC3.World({ W, H, D, gravity: 9 }); hero = MC3.Forms.character(world, 62, 12, 80); MC3.Forms.chainmail(world, 96, 46, 80, { cols: 12, rows: 9 }); }
  function heroCore() { return (hero && world.alive[hero.core]) ? hero.core : null; }

  function castBolt() { MC3.Forms.lightning(world, mouseT.x + OX, mouseT.z + OZ, { dmg: 55 }); }

  cv.addEventListener('mousedown', e => { dragging = true; moved = false; lx = e.clientX; ly = e.clientY; aim(e); });

  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  bind('bHero', spawnHero); bind('bFire', castFire); bind('bBolt', castBolt); bind('bMail', dropMail); bind('bReset', reset);

  function writeColor(k, i, o) {
    let r, g, b;
    if (k === KIND.FIRE) { const t = Math.min(1, world.T[i] / 2); r = Math.min(1, 0.7 + t * 0.3); g = Math.min(1, 0.2 + t * 0.75); b = Math.max(0.02, t - 0.5); }
    else if (k === KIND.CHARACTER) { const f = world.hpMax[i] > 0 ? Math.max(0, world.hp[i] / world.hpMax[i]) : 1; r = 0.2 + (1 - f) * 0.75; g = 0.55 + f * 0.35; b = 0.45; }
    else if (k === KIND.ARMOR) { if (world.T[i] > 0.4) { const t = Math.min(1, world.T[i] / 2); r = 0.7 + t * 0.3; g = 0.2 + t * 0.6; b = 0.05; } else { r = 0.72; g = 0.75; b = 0.8; } }
    else if (k === KIND.LIGHTNING) { r = 0.92; g = 0.9; b = 1; }
    else { r = 0.5; g = 0.5; b = 0.5; }
    pcol[o] = r; pcol[o + 1] = g; pcol[o + 2] = b;
  }
  function frame() {
    world.step(0.04); world.step(0.04);
    let cnt = 0; const n = Math.min(world.n, CAP);
    for (let i = 0; i < n; i++) {
      if (!world.alive[i]) continue; const o = cnt * 3;
      ppos[o] = world.px[i] - OX; ppos[o + 1] = world.py[i]; ppos[o + 2] = world.pz[i] - OZ;
      writeColor(world.kind[i], i, o); cnt++;
    }
    pgeo.setDrawRange(0, cnt);
    pgeo.attributes.position.needsUpdate = true; pgeo.attributes.color.needsUpdate = true;
    let bc = 0;
    for (const b of world.bonds) { if (!world.alive[b.i] || !world.alive[b.j] || bc >= MAXB) continue;
      bpos[bc * 6] = world.px[b.i] - OX; bpos[bc * 6 + 1] = world.py[b.i]; bpos[bc * 6 + 2] = world.pz[b.i] - OZ;
      bpos[bc * 6 + 3] = world.px[b.j] - OX; bpos[bc * 6 + 4] = world.py[b.j]; bpos[bc * 6 + 5] = world.pz[b.j] - OZ; bc++; }
    bgeo.setDrawRange(0, bc * 2); bgeo.attributes.position.needsUpdate = true;
    let lc = 0;
    for (const bolt of world.bolts) for (const s of bolt.segs) { if (lc >= MAXBO) break;
      lpos[lc * 6] = s[0] - OX; lpos[lc * 6 + 1] = s[1]; lpos[lc * 6 + 2] = s[2] - OZ;
      lpos[lc * 6 + 3] = s[3] - OX; lpos[lc * 6 + 4] = s[4]; lpos[lc * 6 + 5] = s[5] - OZ; lc++; }
    lgeo.setDrawRange(0, lc * 2); lgeo.attributes.position.needsUpdate = true;
    if (hud) { let alive = 0; for (let i = 0; i < world.n; i++) if (world.alive[i]) alive++;
      const c = heroCore(); hud.textContent = (c != null ? ('HP ' + Math.max(0, world.hp[c]).toFixed(0)) : '캐릭터 쓰러짐 (R)') + '   ·   units ' + alive + '   ·   bonds ' + world.bonds.length; }
    renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  reset(); frame();
})();
</script>
