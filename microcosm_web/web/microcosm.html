<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microcosm — 하나의 규칙으로 굴러가는 게임 세계</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0a10; color: #e8e6df;
    font-family: -apple-system, "Noto Sans KR", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px; }
  h1 { font-size: 18px; font-weight: 500; margin: 4px 0 0; }
  p.sub { margin: 0; color: #9a988f; font-size: 13px; }
  .wrap { position: relative; }
  canvas { background: #0d0d14; border-radius: 12px; border: 1px solid #24242c; display: block; cursor: crosshair; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { background: #17171f; color: #e8e6df; border: 1px solid #2e2e38;
    border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #20202a; border-color: #4a4a58; }
  button.k { border-color: #534AB7; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #9a988f; flex-wrap: wrap; justify-content:center; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<h1>microcosm — 하나의 규칙으로 굴러가는 게임 세계</h1>
<p class="sub">캐릭터·파이어볼·벼락·사슬갑옷이 모두 같은 식 dx/dt = f + ΣW·g + I − γx 의 다른 배치. 마우스로 조준하세요.</p>
<div class="bar">
  <button id="bHero">캐릭터 소환</button>
  <button id="bFire" class="k">파이어볼 🔥 (클릭/F)</button>
  <button id="bBolt" class="k">벼락 ⚡ (L)</button>
  <button id="bMail" class="k">사슬갑옷 🛡 (C)</button>
  <button id="bReset">리셋 (R)</button>
</div>
<div class="wrap"><canvas id="mc" width="800" height="500"></canvas></div>
<div class="legend">
  <span><span class="dot" style="background:#1D9E75"></span>캐릭터(결합+항상성)</span>
  <span><span class="dot" style="background:#EF9F27"></span>파이어볼(열장)</span>
  <span><span class="dot" style="background:#bcb6f5"></span>벼락(프랙탈)</span>
  <span><span class="dot" style="background:#9aa0a6"></span>사슬갑옷(네트워크)</span>
</div>
<script>
/* microcosm engine - 통합 기질의 JS 포팅. Node와 브라우저 양쪽에서 동작.
   하나의 규칙: dx/dt = f(x) + Σ W·g + I - γx. 모든 요소가 같은 step()으로 굴러간다. */
(function (global) {
  'use strict';
  const KIND = { VOID: 0, CHARACTER: 1, FIRE: 2, LIGHTNING: 3, ARMOR: 4 };

  function ptSeg2(px, py, ax, ay, bx, by) {
    let dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    let t = L2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    let cx = ax + t * dx, cy = ay + t * dy, ex = px - cx, ey = py - cy;
    return ex * ex + ey * ey;
  }

  class World {
    constructor(opts = {}) {
      this.W = opts.W || 160; this.H = opts.H || 100;
      this.gravity = opts.gravity != null ? opts.gravity : 9.0;
      this.cap = opts.cap || 4000;
      const c = this.cap;
      this.px = new Float64Array(c); this.py = new Float64Array(c);
      this.vx = new Float64Array(c); this.vy = new Float64Array(c);
      this.fx = new Float64Array(c); this.fy = new Float64Array(c);
      this.T = new Float64Array(c); this.dT = new Float64Array(c);
      this.M = new Float64Array(c); this.hp = new Float64Array(c); this.hpMax = new Float64Array(c);
      this.gScale = new Float64Array(c); this.homeoT = new Float64Array(c);
      this.kind = new Int32Array(c); this.fixed = new Uint8Array(c);
      this.homeo = new Uint8Array(c); this.alive = new Uint8Array(c);
      this.n = 0; this.bonds = []; this.bolts = []; this.time = 0;
    }
    spawn(o) {
      const i = this.n++;
      this.px[i] = o.x; this.py[i] = o.y;
      this.vx[i] = o.vx || 0; this.vy[i] = o.vy || 0;
      this.T[i] = o.T || 0; this.M[i] = o.M || 1;
      this.kind[i] = o.kind || 0; this.fixed[i] = o.fixed ? 1 : 0;
      this.gScale[i] = o.gScale || 0; this.alive[i] = 1;
      this.hp[i] = o.hp || 0; this.hpMax[i] = o.hp || 0;
      if (o.homeoT != null) { this.homeo[i] = 1; this.homeoT[i] = o.homeoT; }
      return i;
    }
    addBond(i, j, k, rest) {
      if (rest == null) rest = Math.hypot(this.px[i] - this.px[j], this.py[i] - this.py[j]);
      this.bonds.push({ i, j, rest, k });
    }
    killUnit(i) {
      this.alive[i] = 0; this.kind[i] = KIND.VOID;
      this.bonds = this.bonds.filter(b => b.i !== i && b.j !== i);
    }
    step(dt) {
      const n = this.n;
      for (let i = 0; i < n; i++) { this.fx[i] = 0; this.fy[i] = 0; this.dT[i] = 0; }
      // 쌍 상호작용: 열 확산 + 근거리 반발
      const rTh2 = 49, diff = 0.16, rRep = 3, rRep2 = 9, repK = 90;
      for (let i = 0; i < n; i++) {
        if (!this.alive[i]) continue;
        for (let j = i + 1; j < n; j++) {
          if (!this.alive[j]) continue;
          let dx = this.px[j] - this.px[i], dy = this.py[j] - this.py[i];
          let d2 = dx * dx + dy * dy;
          if (d2 > rTh2) continue;
          let dTji = diff * (this.T[j] - this.T[i]);
          this.dT[i] += dTji; this.dT[j] -= dTji;
          if (d2 < rRep2) {
            let d = Math.sqrt(d2) + 1e-9, f = repK * (rRep - d) / rRep / d;
            this.fx[i] -= f * dx; this.fy[i] -= f * dy;
            this.fx[j] += f * dx; this.fy[j] += f * dy;
          }
        }
      }
      // 단위별 장: 부력·중력·냉각·항상성·소산
      const buoy = 26, buoyThr = 0.3, cool = 0.5, dragC = 0.35, homeoG = 2.5;
      for (let i = 0; i < n; i++) {
        if (!this.alive[i]) continue;
        this.fy[i] += buoy * Math.max(this.T[i] - buoyThr, 0);
        this.fy[i] -= this.gravity * this.gScale[i] * this.M[i];
        this.dT[i] -= cool * this.T[i];
        if (this.homeo[i]) this.dT[i] += homeoG * (this.homeoT[i] - this.T[i]);
        this.fx[i] -= dragC * this.vx[i]; this.fy[i] -= dragC * this.vy[i];
      }
      // 결합: 스프링 + 파괴(융해 또는 과신장) -> 파이어볼이 사슬갑옷을 녹여 관통
      const meltT = 0.85, stretch = 2.3, dampB = 0.5, keep = [];
      for (const b of this.bonds) {
        const i = b.i, j = b.j;
        let dx = this.px[j] - this.px[i], dy = this.py[j] - this.py[i];
        let L = Math.hypot(dx, dy) + 1e-9, ux = dx / L, uy = dy / L;
        if (0.5 * (this.T[i] + this.T[j]) > meltT || L > b.rest * stretch) continue;
        let f = b.k * (L - b.rest);
        f += dampB * ((this.vx[j] - this.vx[i]) * ux + (this.vy[j] - this.vy[i]) * uy);
        this.fx[i] += f * ux; this.fy[i] += f * uy;
        this.fx[j] -= f * ux; this.fy[j] -= f * uy;
        keep.push(b);
      }
      this.bonds = keep;
      // 적분 + 경계
      for (let i = 0; i < n; i++) {
        if (!this.alive[i]) continue;
        if (this.fixed[i]) { this.vx[i] = 0; this.vy[i] = 0; }
        else {
          this.vx[i] += this.fx[i] / this.M[i] * dt;
          this.vy[i] += this.fy[i] / this.M[i] * dt;
          this.px[i] += this.vx[i] * dt;
          this.py[i] += this.vy[i] * dt;
        }
        this.T[i] = Math.max(0, this.T[i] + this.dT[i] * dt);
        if (this.px[i] < 0) { this.px[i] = 0; this.vx[i] *= -0.5; }
        if (this.px[i] > this.W) { this.px[i] = this.W; this.vx[i] *= -0.5; }
        if (this.py[i] < 0) { this.py[i] = 0; this.vy[i] *= -0.5; }
        if (this.py[i] > this.H) { this.py[i] = this.H; this.vy[i] *= -0.5; }
      }
      // 상호작용: 연소 피해 + 불·번개 소멸
      const burnK = 22, burnThr = 0.5;
      for (let i = 0; i < n; i++) {
        if (!this.alive[i]) continue;
        const kd = this.kind[i];
        if (kd === KIND.FIRE) { if (this.T[i] < 0.16) this.killUnit(i); continue; }
        if (kd === KIND.LIGHTNING) { if (this.T[i] < 0.2) this.killUnit(i); continue; }
        if (this.hpMax[i] > 0 && this.T[i] > burnThr) {
          this.hp[i] -= burnK * (this.T[i] - burnThr) * dt;
          if (this.hp[i] <= 0) this.killUnit(i);
        }
      }
      for (const bolt of this.bolts) bolt.life -= dt;
      this.bolts = this.bolts.filter(b => b.life > 0);
      this.time += dt;
    }
  }

  const Forms = {
    character(w, cx, cy, opt = {}) {
      const radius = opt.radius || 5, nring = opt.nring || 12, temp = 0.12, k = 18, hp = opt.hp || 100;
      const core = w.spawn({ x: cx, y: cy, T: temp, M: 1.6, kind: KIND.CHARACTER, homeoT: temp, hp });
      const ring = [];
      for (let a = 0; a < nring; a++) {
        const ang = 2 * Math.PI * a / nring;
        ring.push(w.spawn({ x: cx + radius * Math.cos(ang), y: cy + radius * Math.sin(ang), T: temp, M: 1, kind: KIND.CHARACTER, homeoT: temp, hp }));
      }
      for (const i of ring) w.addBond(core, i, k);
      for (let a = 0; a < nring; a++) w.addBond(ring[a], ring[(a + 1) % nring], k);
      return { core, units: [core, ...ring] };
    },
    fireball(w, ox, oy, tx, ty, opt = {}) {
      const speed = opt.speed || 36, count = opt.count || 40, spread = opt.spread || 2.2, temp = opt.temp || 1.7;
      let dx = tx - ox, dy = ty - oy, d = Math.hypot(dx, dy) + 1e-9; dx /= d; dy /= d;
      const units = [];
      for (let c = 0; c < count; c++) {
        units.push(w.spawn({
          x: ox + (Math.random() - 0.5) * spread * 2, y: oy + (Math.random() - 0.5) * spread * 2,
          vx: dx * speed + (Math.random() - 0.5) * 8, vy: dy * speed + (Math.random() - 0.5) * 8,
          T: temp * (0.7 + Math.random() * 0.6), M: 0.5, kind: KIND.FIRE
        }));
      }
      return { units };
    },
    lightning(w, tx, opt = {}) {
      const topY = w.H - 2, groundY = opt.groundY || 4, step = opt.step || 4, branch = 0.2, temp = 2.4, maxP = opt.maxP || 160, maxB = 6;
      const segs = [], units = []; let stack = [[tx, topY, 0]], budget = maxP;
      while (stack.length && budget > 0) {
        let [x, y, heading] = stack.pop();
        while (y > groundY && budget > 0) {
          budget--;
          let nh = heading + (Math.random() - 0.5);
          let nx = x + Math.sin(nh) * step * (0.7 + Math.random() * 0.6);
          let ny = y - step * (0.7 + Math.random() * 0.6);
          segs.push([x, y, nx, ny]);
          units.push(w.spawn({ x, y, T: temp * (0.8 + Math.random() * 0.4), M: 0.3, kind: KIND.LIGHTNING, fixed: true }));
          if (Math.random() < branch && y > groundY + step * 3 && stack.length < maxB)
            stack.push([x, y, heading + (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.6)]);
          x = nx; y = ny; heading = nh * 0.6;
        }
      }
      const boltDmg = opt.dmg || 55, hitR2 = (opt.hitR || 6) ** 2;
      for (let i = 0; i < w.n; i++) {
        if (!w.alive[i] || w.kind[i] === KIND.LIGHTNING) continue;
        let near = false;
        for (const s of segs) { if (ptSeg2(w.px[i], w.py[i], s[0], s[1], s[2], s[3]) < hitR2) { near = true; break; } }
        if (near) { w.T[i] += 1.4; if (w.hpMax[i] > 0) { w.hp[i] -= boltDmg; if (w.hp[i] <= 0) w.killUnit(i); } }
      }
      w.bolts.push({ segs, life: 0.45, maxlife: 0.45 });
      return { units, segs };
    },
    chainmail(w, cx, topY, opt = {}) {
      const cols = opt.cols || 12, rows = opt.rows || 8, sp = opt.spacing || 4, k = 45, hp = opt.hp || 40;
      const ox = cx - (cols - 1) * sp / 2, grid = [];
      for (let r = 0; r < rows; r++) {
        grid.push([]);
        for (let c = 0; c < cols; c++) {
          const fixed = (r === 0 && (c === 0 || c === cols - 1));
          grid[r].push(w.spawn({ x: ox + c * sp, y: topY - r * sp, M: 0.8, kind: KIND.ARMOR, gScale: 1, fixed, hp }));
        }
      }
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (c + 1 < cols) w.addBond(grid[r][c], grid[r][c + 1], k);
        if (r + 1 < rows) w.addBond(grid[r][c], grid[r + 1][c], k);
      }
      return { grid };
    }
  };

  const MC = { KIND, World, Forms, ptSeg2 };
  global.MC = MC;
  if (typeof module !== 'undefined' && module.exports) module.exports = MC;
})(typeof window !== 'undefined' ? window : globalThis);
/* UI: 실시간 canvas 렌더 + 컨트롤. 엔진(window.MC)을 그대로 사용. */
(function () {
  const cv = document.getElementById('mc');
  const ctx = cv.getContext('2d');
  const W = 160, H = 100, scale = cv.width / W;
  let world, hero, mouse = { x: 80, y: 50 };
  const hint = '클릭/F = 파이어볼 🔥   ·   L = 벼락 ⚡   ·   C = 사슬갑옷 🛡   ·   R = 리셋';

  function reset() {
    world = new MC.World({ W, H, gravity: 9 });
    hero = MC.Forms.character(world, 26, 46);
    MC.Forms.chainmail(world, 104, 70, { cols: 12, rows: 8 });
  }
  function heroCore() { return (hero && world.alive[hero.core]) ? hero.core : null; }
  function toWorld(e) {
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (cv.width / r.width);
    const my = (e.clientY - r.top) * (cv.height / r.height);
    return { x: mx / scale, y: H - my / scale };
  }
  function castFire() {
    const c = heroCore(); if (c == null) return;
    MC.Forms.fireball(world, world.px[c], world.py[c], mouse.x, mouse.y, { count: 46, temp: 2.0, speed: 44 });
  }
  function castBolt() { MC.Forms.lightning(world, mouse.x, { dmg: 55 }); }
  function dropMail() { MC.Forms.chainmail(world, mouse.x, Math.min(mouse.y + 16, H - 2), { cols: 10, rows: 7 }); }
  function spawnHero() { if (heroCore() == null) hero = MC.Forms.character(world, 26, 46); }

  cv.addEventListener('mousemove', e => { mouse = toWorld(e); });
  cv.addEventListener('mousedown', e => { mouse = toWorld(e); castFire(); });
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'f') castFire(); else if (k === 'l') castBolt();
    else if (k === 'c') dropMail(); else if (k === 'r') reset();
  });
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  bind('bHero', spawnHero); bind('bFire', castFire); bind('bBolt', castBolt);
  bind('bMail', dropMail); bind('bReset', reset);

  function fireColor(T) {
    const t = Math.max(0, Math.min(1, T / 2));
    const r = Math.min(255, 120 + t * 135) | 0;
    const g = Math.min(255, t * 235) | 0;
    const b = Math.min(255, Math.max(0, (t - 0.6) * 380)) | 0;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function charColor(i) {
    const f = world.hpMax[i] > 0 ? Math.max(0, world.hp[i] / world.hpMax[i]) : 1;
    const r = Math.round(40 + (1 - f) * 205), g = Math.round(70 + f * 90), b = 80;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }

  function draw() {
    ctx.fillStyle = '#0d0d14'; ctx.fillRect(0, 0, cv.width, cv.height);
    const sx = x => x * scale, sy = y => (H - y) * scale;
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(120,122,140,0.35)';
    ctx.beginPath();
    for (const b of world.bonds) {
      if (!world.alive[b.i] || !world.alive[b.j]) continue;
      ctx.moveTo(sx(world.px[b.i]), sy(world.py[b.i]));
      ctx.lineTo(sx(world.px[b.j]), sy(world.py[b.j]));
    }
    ctx.stroke();
    for (let i = 0; i < world.n; i++) {
      if (!world.alive[i]) continue;
      const k = world.kind[i], x = sx(world.px[i]), y = sy(world.py[i]);
      if (k === MC.KIND.FIRE) { ctx.globalAlpha = 0.85; ctx.fillStyle = fireColor(world.T[i]); circle(x, y, 6); ctx.globalAlpha = 1; }
      else if (k === MC.KIND.CHARACTER) { ctx.fillStyle = charColor(i); circle(x, y, 4.5); }
      else if (k === MC.KIND.ARMOR) { ctx.fillStyle = world.T[i] > 0.4 ? fireColor(world.T[i]) : '#9aa0a6'; circle(x, y, 3.5); }
      else if (k === MC.KIND.LIGHTNING) { ctx.fillStyle = '#e9e6ff'; circle(x, y, 2.2); }
    }
    for (const bolt of world.bolts) {
      const a = bolt.life / bolt.maxlife;
      ctx.strokeStyle = 'rgba(190,182,245,' + a + ')'; ctx.lineWidth = 2.2;
      ctx.shadowColor = '#bcb6f5'; ctx.shadowBlur = 12; ctx.beginPath();
      for (const s of bolt.segs) { ctx.moveTo(sx(s[0]), sy(s[1])); ctx.lineTo(sx(s[2]), sy(s[3])); }
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    // HUD
    let alive = 0; for (let i = 0; i < world.n; i++) if (world.alive[i]) alive++;
    ctx.fillStyle = '#cfcabf'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(hint, 12, cv.height - 12);
    ctx.fillText('units ' + alive + '   bonds ' + world.bonds.length, 12, 20);
    const c = heroCore();
    if (c != null) {
      const f = Math.max(0, world.hp[c] / world.hpMax[c]);
      ctx.fillStyle = '#2a2a32'; ctx.fillRect(12, 28, 160, 11);
      ctx.fillStyle = f > 0.5 ? '#1D9E75' : (f > 0.25 ? '#EF9F27' : '#E24B4A');
      ctx.fillRect(12, 28, 160 * f, 11);
      ctx.fillStyle = '#cfcabf'; ctx.fillText('HP ' + Math.max(0, world.hp[c]).toFixed(0), 180, 38);
    } else {
      ctx.fillStyle = '#E24B4A'; ctx.fillText('캐릭터 쓰러짐 — [캐릭터 소환] 또는 R', 180, 38);
    }
  }

  let last = performance.now();
  function loop(now) {
    last = now;
    world.step(0.04); world.step(0.04);
    draw();
    requestAnimationFrame(loop);
  }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
