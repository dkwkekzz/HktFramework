# =====================================================================
# 세계 구성 — 지역·요소 배치의 정본 (Design-WorldComposition 의 데이터)
# ---------------------------------------------------------------------
# 목적 그래프(objective-graph.yaml)의 demand 에 세계가 "어디서, 무엇으로"
# 응답하는지를 배치한다. 검증은 test/world-composition.test.js:
#   ① 모든 무대는 정확히 한 지역에 배치된다 (그래프 무대 ⊆ 배치, 중복 금지)
#   ② 지역 인접은 대칭이고 존재하는 지역만 가리킨다
#   ③ 재료 아키타입의 속성명은 사전에 있고, 수치01 대역은 0..1 안에서 min≤max
#   ④ 배치 원칙 ㉠: 물질·생명체 demand 속성마다 공급 무대 ≥ 2
#      (예외는 supply_exceptions 에 사유와 함께 명시 — 침묵하는 구멍 금지)
#   ⑤ 주기는 이름 유일, 주기 > 창 > 0
# 수치는 전부 초기값 — 콘텐츠 단계(C1~C7) 실행에서 튜닝한다.
# =====================================================================

meta:
  version: 0.1
  graph: objective-graph.yaml
  note: 지역 좌표계는 추상 그래프(인접+이동 비용 틱) — 기하 좌표는 월드 렌더 트랙에서

# =====================================================================
# 지역 — 각 지역은 환경 + 배치(무대·재료·생명체·세력)를 가진다
# =====================================================================
regions:

  - id: R1
    name: 잿빛 평원
    danger: 1
    adjacent: [R2, R3, R5, R0]
    move_cost: {R2: 3, R3: 3, R5: 2, R0: 8}     # R0 은 월식 창에만 통행 가능 (cycles.월식)
    environment: {신성방사: 0.3, 기온: 10, 독기: 0}
    stages: [S-0045, S-0102, S-0103]
    substances:
      - {archetype: 조직조각, props: {신성잔향보존율: [0.5, 0.9], 오염도: [0.0, 0.3]},
         note: 신의 순행 경로 잔흔 위 — 소멸타이머有, 순행 주기로 재생성}
      - {archetype: 권속심장, props: {생체촉매활성: [0.5, 0.8], 신성잔향보존율: [0.4, 0.7]},
         note: 촉매이자 표본 — DAG 교차의 실물. 사후 활성 급감}
      - {archetype: 평원짐승가죽, props: {내한성: [0.2, 0.4]},
         note: 저급 재료 — 내한 문턱(0.6) 미달을 몸으로 배우는 교보재}
    creatures:
      - {name: 권속 무리, stage: S-0102, behavior: 흔적 주변 서식·무리분산 주기}
      - {name: 평원 초식 짐승, behavior: 저위험 연습 상대 — 식량·가죽}
    npcs:
      - {name: 떠돌이 생존자, role: 목격 정보 보유 — 소액 거래로 첫 관계 튜토리얼}

  - id: R2
    name: 붉은 협곡
    danger: 2
    adjacent: [R1, R4]
    move_cost: {R1: 3, R4: 4}
    environment: {신성방사: 0.0, 기온: 25, 독기: 0, 협곡풍: true}   # 협곡풍 = 공명 실험 간섭
    stages: [S-0201]
    substances:
      - {archetype: 수정질광석-표층, props: {공명전달률: [0.5, 0.65], 에너지손실률: [0.3, 0.5]},
         note: 실험급(H1.1 문턱 0.5) — 안전 채굴}
      - {archetype: 수정질광석-심부, props: {공명전달률: [0.7, 0.9], 에너지손실률: [0.1, 0.3]},
         note: 무기급(문턱 0.7) — 심부 정밀 채굴만이 닿는다 (배치 원칙 ㉢)}
    creatures:
      - {name: 동굴 서식 생물, behavior: 채굴 진동에 몰려듦 — 소음의 위험 비용}

  - id: R3
    name: 검은 숲
    danger: 2
    adjacent: [R1, R6]
    move_cost: {R1: 3, R6: 5}
    environment: {신성방사: 0.0, 기온: 15, 독기: 0.4}    # 독기는 심부 기준 — 가장자리 0
    stages: [S-0301, S-0302, S-0303]
    substances:
      - {archetype: 마수뼈, props: {공명전달률: [0.65, 0.8], 에너지손실률: [0.2, 0.4]},
         note: 상위 대역만 무기급 문턱(0.7)을 넘는다 — 전투 방식이 순도를 정하는 도박}
      - {archetype: 발광균류, props: {생체촉매활성: [0.35, 0.55], 독성: [0.2, 0.6]},
         note: 심장의 대체 — 배양 지식(G-0.3.1.2)으로 활성 +0.1 가공 가능 (지식이 품질을 올린다)}
      - {archetype: 균류단열재, props: {내한성: [0.5, 0.6]},
         note: 압착 가공품 — 빙원 첫 진입용. 상한이 문턱(0.6)에 아슬 (성격 다른 대체 해법)}
    creatures:
      - {name: 마수 무리, stage: S-0301, behavior: 둥지 중심 — 위협이자 뼈 공급원}
      - {name: 대형 운반 생물 무리, stage: S-0303, behavior: 개체별 신성내성 0.3~0.6 편차 — 관찰 선별}

  - id: R4
    name: 고대 유적
    danger: 3
    adjacent: [R2]
    move_cost: {R2: 4}
    environment: {신성방사: 0.1, 기온: 15, 독기: 0}
    stages: [S-0202, S-0401, S-0402]
    substances:
      - {archetype: 고대공명부품, props: {공명전달률: [0.75, 0.95], 에너지손실률: [0.05, 0.15]},
         note: 최고 품질 — 문(접근권) 안쪽. 위험 대신 앎이 가격 (R2 와 같은 속성, 다른 화폐)}
      - {archetype: 축전결정, props: {에너지저장밀도: [0.5, 0.8], 신성내성: [0.4, 0.7]},
         note: G-0.1.1.3.3 의 응답 — 의도적 단일 공급 (supply_exceptions 참조)}
    creatures:
      - {name: 수호 기구, behavior: 문전 간헐 순찰·문 안쪽 밀집 — 문명이 남긴 장애물}

  - id: R5
    name: 회색 시장
    danger: 1                       # 시장 자체는 안전 — 수송로 습격(S-0501)은 별개
    adjacent: [R1]
    move_cost: {R1: 2}
    environment: {신성방사: 0.0, 기온: 12, 독기: 0}
    stages: [S-0501, S-0502]
    substances:
      - {archetype: 보존유물, props: {신성잔향보존율: [0.6, 0.9]},
         note: 숭배단이 보존 처리한 잔향 — 수송로(강탈) 또는 시장(거래)으로 닿는다}
    factions:
      - {name: 자유민, stance: 중립→우호, via: 거래 실적·의뢰 수행 (신뢰단계)}
      - {name: 숭배단, stance: 중립→적대, via: 수송 습격·시장 감시망 — 신에게 힘을 공급하는 세력}

  - id: R6
    name: 흰 빙원
    danger: 3
    adjacent: [R3]
    move_cost: {R3: 5}
    environment: {신성방사: 0.0, 기온: -10, 독기: 0}    # 한파 창에는 -30 (cycles.한파)
    stages: [S-0601]
    substances:
      - {archetype: 빙수짐승가죽, props: {내한성: [0.6, 0.85]},
         note: 고품질 내한 — 사냥 자체가 한랭 체류를 요구하는 순환 (첫 진입은 균류 단열재로)}
    creatures:
      - {name: 빙수 짐승, stage: S-0601, behavior: 은신·한파 창에 활동 — 가죽과 저온 실험의 이웃}

  - id: R0
    name: 신의 거처
    danger: 4
    adjacent: [R1]
    move_cost: {R1: 8}
    environment: {신성방사: 0.9, 기온: 5, 독기: 0}
    stages: []                      # 결전 무대는 C7 에서 설계·배치 (엔드 콘텐츠)
    substances: []
    note: 월식 창에만 길이 드러난다 — H1(월식 주기) 확인이 이 정보를 준다. C7 전까지 미배치.

# =====================================================================
# 주기 — 상태형 재료(환경 상태·시간과 기회)의 실체. 서로 소로 잡아
# 창의 드문 겹침(월식+한파 등)이 자연 발생 이벤트가 되게 한다 (§6).
# =====================================================================
cycles:
  - {name: 순행, period: 600, window: 20, affects: [R1],
     effect: S-0045/S-0103 재생성·신선도 회복 — 통과 직후가 골든 타임}
  - {name: 월식, period: 1200, window: 60, affects: [R0, R1],
     effect: R0 길 개방(world.주기.월식=true)·잔향 활성 상승 — H1 관측 창(G-0.1.1.1.H1.2)}
  - {name: 한파, period: 200, window: 60, affects: [R6],
     effect: 기온 -30 도달(world.환경.기온<0) — H2 실험 유효 창(G-0.1.1.2.H2.1), 이동 위험 급증}
  - {name: 호송, period: 150, window: 30, affects: [R5, R1],
     effect: 수송대가 길 위에(world.주기.호송=true) — S-0501 습격 창(G-0.1.1.6.2)}
  - {name: 무리분산, period: 100, window: 20, affects: [R1],
     effect: 권속 무리 흩어짐(world.권속.무리분산=true) — S-0102 사냥 창(G-0.2.3.2.1)}

# =====================================================================
# 배치 원칙 ㉠ 의 문서화된 예외 — 물질·생명체 demand 속성 중 공급 무대가
# 2 미만인 것. 예외 없는 구멍은 테스트가 실패시킨다.
# =====================================================================
supply_exceptions:
  - {property: 에너지저장밀도, sources: 1,
     reason: 의도적 단일 공급(S-0402) — 무기 완성이 반드시 "앎의 문"(R4 접근권)을 지나게
             하는 설계. C4 이후 두 번째 공급원(권속 심장 가공 등) 배치가 백로그.}
  - {property: 공명출력, sources: 0,
     reason: 제작 산출 속성 — 무대가 아니라 결합(변환 동사)이 공급한다. 무대 공급 금지가 정상.}
