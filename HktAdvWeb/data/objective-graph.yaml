    verb: 협상
    serves: [G-0.1.1.1]
    alternatives: [시장에서 증언 기록을 산다(S-0502), 떠돌이 생존자를 호위해 신뢰를 얻는다]
    epistemic: 추정
    evidence: 교차 확인된 증언 2건 이상
    stages: [S-0502]

