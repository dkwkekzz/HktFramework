    done_when: {has: {kind: 정보, property: {name: 주제, op: "==", value: 신.행동주기}, min_count: 1}}
    demand:
      - {kind: 환경 상태, when: {state: {path: stage.S-0103.신선도, op: ">", value: 0}},
         note: 흔적이 풍화되기 전 — 신의 순행 주기가 신선도를 되채운다 (상태형 재료)}
    verb: 관찰
    serves: [G-0.1.1.1]
    epistemic: 확인
    evidence: 흉터 분포 기록(정보 재료)
    stages: [S-0103]

  - id: G-0.1.1.1.2
    title: 생존자의 증언을 확보한다
    desired: 목격 증언이 교차 확인된 행동 주기 정보를 보유한 상태
    current: 생존자들이 입을 열지 않는다
    done_when: {has: {kind: 정보, property: {name: 주제, op: "==", value: 신.행동주기}, min_count: 2}}
    demand:
