stages:

  - id: S-0045                                             # ★ Slice-1 무대
    source: 거대 신이 지나간 자리에 남은 조직 조각
    supplies:
      - {property: 신성잔향보존율, rule: 시간 경과 시 소멸(잔여시간 틱), purity: 채취 정밀도에 따라}
      - {property: 오염도, rule: 채취가 거칠수록 상승, purity: 부산물 — 원치 않아도 얻는다}
    obstacles: [신성 방사(접촉 오염), 수호 생명체, 경쟁 세력, 접촉 시 신체 변이 위험]
    interactions: [흔적 추적, 오염 측정, 채취, 보존, 운반]
    choices:
      - 다량 신속 채취(오염 감수) ↔ 소량 정밀 채취
      - 전체 운반 ↔ 현장 보존 처리 ↔ 생명체에 이식해 운반
    outcomes: [고순도 잔향 표본, 오염된 잔향 표본, 신의 새 특성 발견(정보), 신체 변형, 추적당함]
    discovered: true

  - id: S-0102
    source: 권속 무리의 서식지 — 심장이 촉매이자 표본이 되는 이중 공급원
    supplies:
      - {property: 생체촉매활성, rule: 살아있는 개체에서 적출 시 최고 — 사후 활성 급감, purity: 적출 속도에 따라}
      - {property: 신성잔향보존율, rule: 심장에 잔향이 응축 — 표본 대체 경로, purity: 개체의 신 근접 이력에 따라}
    obstacles: [무리 방어, 신의 감시, 서식지의 신성 방사 미약 오염]
    interactions: [탐색, 관찰, 전투, 포획, 채취, 보존]
    choices:
      - 무리 전면 교전(다수 확보·추적 위험) ↔ 낙오 개체 사냥(안전·소량)
      - 즉시 적출(고활성) ↔ 생포 후 운반(활성 저하·재사용 가능)
    outcomes: [고활성 심장, 저활성 심장, 무리 행동 정보, 신의 감시에 노출]
    discovered: true

