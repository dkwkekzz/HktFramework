# =====================================================================
# 무대(기회) — 세계의 응답 (§4.5). 생성하지 않는다 — 재해석한다 (원칙 ④)
# 지역 배치·인접·주기는 world-composition.yaml 이 정본.
# =====================================================================
stages:

  # ── R1 잿빛 평원 ──

  - id: S-0045                                             # ★ Slice-1 무대
    source: 거대 신이 지나간 자리에 남은 조직 조각
    supplies:
