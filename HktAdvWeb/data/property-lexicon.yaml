# =====================================================================
# 속성 사전 — demand·supplies·done_when 이 쓰는 속성명의 정본
# ---------------------------------------------------------------------
# objective-graph.yaml 에 나오는 속성이 여기 없으면 로더(step B1)가 거부한다.
# 새 속성 추가 = 여기 등재가 먼저다 (Design-StepPlan §9.3-3).
# 값형: 수치01(0..1 실수) / 수치(0 이상 실수) / 불리언 / 열거
# =====================================================================

properties:

  # ── 물질 속성 ──
  - {name: 신성잔향보존율, 값형: 수치01, 단위: 비율,
     설명: 신성 에너지의 잔향이 물질에 보존된 정도 — 표본·촉매 판정의 축}
  - {name: 오염도, 값형: 수치01, 단위: 비율,
     설명: 신성 방사 등에 의한 오염 진행률 — 채취 방식의 부산물}
  - {name: 소멸타이머, 값형: 수치, 단위: 틱,
     설명: 물질이 소멸까지 남은 시간 — 0 이 되면 세계에서 사라진다 (상태형 압박의 원천)}
  - {name: 공명전달률, 값형: 수치01, 단위: 비율,
     설명: 진동·공명을 손실 없이 전달하는 정도 — 진동 무기 재료의 축}
  - {name: 에너지손실률, 값형: 수치01, 단위: 비율,
     설명: 전달 과정에서 에너지가 새는 비율 — 낮을수록 좋다}
  - {name: 에너지저장밀도, 값형: 수치01, 단위: 비율,
     설명: 단위 부피당 에너지 저장 능력}
  - {name: 신성내성, 값형: 수치01, 단위: 비율,
     설명: 신성 방사 아래에서 변질되지 않는 정도}
  - {name: 생체촉매활성, 값형: 수치01, 단위: 비율,
     설명: 생체 반응을 촉진하는 활성 — 약물 촉매 판정의 축, 사후 시간에 따라 감소}
  - {name: 공명출력, 값형: 수치01, 단위: 비율,
     설명: 결합체(도구·무기)가 내는 공명 진동의 출력 — 제작 결과의 판정 축}
  - {name: 내한성, 값형: 수치01, 단위: 비율,
     설명: 한랭 환경에서 체온·기능을 유지하는 정도 — 빙원(R6) 체류 장비의 축}
  - {name: 독성, 값형: 수치01, 단위: 비율,
     설명: 생체에 축적되는 독의 강도 — 균류 채취의 부산물이자 위험 고지의 축}

  # ── 정보·지식 재료의 메타 속성 ──
  - {name: 주제, 값형: 열거, 단위: 없음,
     설명: 정보·지식 재료가 다루는 대상 (신.에너지순환, 진동반응, 저온반응, 공격원리, 신.약점, 무기유효성 …),
     값목록: [신.에너지순환, 진동반응, 저온반응, 공격원리, 신.약점, 신.정체, 무기유효성,
              신.행동주기, 신.거처위치, 고대문자, 둥지위치, 균류배양]}

  # ── 관계·접근권·능력 재료의 메타 속성 ──
  - {name: 신뢰단계, 값형: 수치, 단위: 단계,
     설명: 관계 재료의 신뢰 수준 (0=인지, 1=거래 가능, 2=동행 가능)}
  - {name: 대상, 값형: 열거, 단위: 없음,
     설명: 접근권 재료가 여는 대상 (신.거처, 유적.문 …),
     값목록: [신.거처, 유적.문]}
  - {name: 계열, 값형: 열거, 단위: 없음,
     설명: 능력 재료의 계열 (§4.3 동사 가족과 대응),
     값목록: [인식, 수급, 변환, 전투]}

  # ── 에너지 재료의 메타 속성 ──
  - {name: 잔고, 값형: 수치, 단위: 에너지,
     설명: 에너지 원장 계좌 잔고 — has 술어가 원장(A3)을 읽는 통로}
