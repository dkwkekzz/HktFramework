# =====================================================================
# 속성 → 시각 채널 대응표 (step D1) — Design-Visualization §4.2 의 데이터화
# ---------------------------------------------------------------------
# ViewModel 이 세계 속성을 이 표로 시각 채널로 번역한다. 렌더러는 채널만 읽는다
# (불변 원칙 ⑥: 세계 속성 → ViewModel → 렌더). 최소 2채널로 시작한다.
#   GLOW   0..1 — 발광 세기 (신성 잔향 등 "힘"의 시각화)
#   JITTER 0..1 — 떨림/노이즈 (오염·불안정의 시각화)
# =====================================================================
channels:
  - {property: 신성잔향보존율, channel: GLOW,   map: 값 그대로}
  - {property: 공명출력,       channel: GLOW,   map: 값 그대로}
  - {property: 오염도,         channel: JITTER, map: 값 그대로}
