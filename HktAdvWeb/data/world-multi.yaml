# =====================================================================
# 다중 행위자 세계 픽스처 (step F1) — 봇 2기 + 유한 공급 경쟁 + aftermath 연쇄
# ---------------------------------------------------------------------
# 봇 A·B 가 같은 무대(S-0045)의 유한 공급을 두고 경쟁한다(선착 소진). A 의 완료
# aftermath 가 세계를 바꿔(추적 시작 + 추적자 흔적 실존) E3 플래너를 깨우고,
# 그 결과가 봇 B 의 새 목적이 된다 (§5 원칙 5 — 한 완료가 다른 행위자의 씨앗).
# =====================================================================

target: G-0.1.1.2.1     # 두 봇의 공통 활성 말단 (경쟁)

stage:
  id: S-0045
  supply_count: 1       # 유한 공급 — 한 번 채취되면 소진

source:
  id: 조직조각-A
  archetype: 조직조각
  tags: [신.조직]
  properties: {신성잔향보존율: 0.8, 오염도: 0.1, 소멸타이머: 8}

bots:
  - {id: bot-A, energy: 20, 정밀도: 0.9}
  - {id: bot-B, energy: 20, 정밀도: 0.9}

# 완료 → 세계 변화 → 신규 목적. aftermath 는 세계를 바꾸고 사건으로 감사된다.
aftermath:
  G-0.1.1.2.1:
    state: {path: world.세력.추적, value: true}   # 적대 세력의 추적 시작
    reveals:                                        # 추적으로 세계에 드러난 요소(스폰 아님 — aftermath 결과)
      - {id: 추적자흔적, archetype: 흔적, kind: 물질, properties: {생체촉매활성: 0.6}}
    wake_goal: G-0.1.4        # "적대 세력을 약화시킨다" — 봇 B 에게 발견되는 신규 위협
    obstacles: [신앙형]        # 드러난 위협의 유형 → E3 분해 템플릿 선택
