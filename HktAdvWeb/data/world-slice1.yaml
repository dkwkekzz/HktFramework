# =====================================================================
# Slice-1 세계 픽스처 (step B4) — 최소 수직 절편의 무대
# ---------------------------------------------------------------------
# 봇 1기가 동기(G-0) → 세부 목적(G-0.1.1.2) → 말단(G-0.1.1.2.1) → 절차(S-0045 채취)
# 사슬을 자동 실행한다. 시간 압박: 소멸타이머가 다 되기 전에 채취해야 성공.
# 절편은 그래프의 부분집합 뷰다 — 여기서 검증된 노드는 전체 그래프에서 그대로 유효.
# =====================================================================

target_goal: G-0.1.1.2.1   # slice-1 말단
정밀도: 0.9                # 채취 정밀도(0..1) — 순도=정밀도 함수 (A5 채취 법칙)

bot:
  id: bot-1
  energy: 20              # 초기 에너지 계좌 (채취 비용 지불용)
  move_cost: 1            # 무대까지 추상 이동에 드는 틱

# S-0045 의 조직 조각 개체 — 신성 잔향을 보존한 표본 원천
source:
  id: 조직조각-A
  stage: S-0045
  archetype: 조직조각
  tags: [신.조직]
  properties:
    신성잔향보존율: 0.8
    오염도: 0.1
    소멸타이머: 3          # 매 틱 감소, 0 이 되면 세계에서 소멸 (상태형 "시간과 기회")
