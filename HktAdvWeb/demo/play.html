<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HktAdvWeb — 플레이</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1017; color: #cfd6e4; font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: #131826; border-bottom: 1px solid #232b3d; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; color: #e8edf7; }
  .chip { padding: 2px 9px; border-radius: 10px; background: #1b2233; border: 1px solid #2a3450; font-size: 12px; }
  .chip.open { background: #14351f; border-color: #2e7d4f; color: #8fe3ae; }
  main { display: grid; grid-template-columns: 300px 1fr 320px; gap: 10px; padding: 10px; max-width: 1280px; margin: 0 auto; }
  .panel { background: #131826; border: 1px solid #232b3d; border-radius: 10px; padding: 10px 12px; }
  .panel h2 { font-size: 12px; margin: 0 0 8px; color: #8ea0c0; letter-spacing: .06em; }
  canvas { width: 100%; background: #0f1420; border-radius: 8px; }
  .stage { border: 1px solid #26304a; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: #161d2e; }
  .stage b { color: #e8edf7; }
  .timers { font-size: 12px; color: #7f9cc4; margin: 2px 0 6px; }
  button { background: #24406b; color: #dbe6ff; border: 1px solid #33538a; border-radius: 6px; padding: 4px 10px; margin: 2px 4px 2px 0; cursor: pointer; font-size: 12.5px; }
  button:hover { background: #2d5088; }
  button:disabled { opacity: .35; cursor: default; }
  button.warn { background: #5b3320; border-color: #8a5433; }
  .goal { border: 1px solid #3b3564; background: #191830; border-radius: 8px; padding: 8px 10px; }
  .goal .title { color: #cfc7ff; font-weight: 600; }
  .cond { font-size: 12px; margin: 3px 0; }
  .cond.met { color: #8fe3ae; } .cond.unmet { color: #c8a15f; }
  .inv { font-size: 12px; color: #a9b6cf; }
  .inv li { margin: 2px 0; }
  #feed { height: 170px; overflow-y: auto; font-size: 12px; }
  #feed div { padding: 1px 0; border-bottom: 1px dotted #1d2537; }
  .f-ripple { color: #ffd479; } .f-cycle { color: #7fb7ff; } .f-gain { color: #8fe3ae; }
  .f-discover { color: #d7a2ff; } .f-world { color: #6d7a95; } .f-reopen { color: #ff9d9d; }
  #joinWrap { position: fixed; inset: 0; background: #0d1017ee; display: flex; align-items: center; justify-content: center; }
  #joinWrap .panel { width: 330px; text-align: center; }
  input { background: #0f1420; color: #e8edf7; border: 1px solid #2a3450; border-radius: 6px; padding: 6px 10px; width: 70%; }
  #err { color: #ff9d9d; min-height: 18px; font-size: 12.5px; padding: 0 14px; }
  select { background: #0f1420; color: #cfd6e4; border: 1px solid #2a3450; border-radius: 6px; padding: 4px; width: 100%; }
  .others { font-size: 12px; color: #7f9cc4; }
  footer { text-align: center; color: #4b5570; font-size: 11.5px; padding: 6px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>HktAdvWeb — 목적의 세계</h1>
  <span class="chip" id="tick">t0</span>
  <span id="cycles"></span>
  <span class="chip" id="energy">에너지 –</span>
</header>
<div id="err"></div>
<main>
  <section class="panel">
    <h2>세계 지도 — 지역을 눌러 이동</h2>
    <canvas id="map" width="280" height="300"></canvas>
    <div class="others" id="travel"></div>
  </section>
  <section class="panel">
    <h2 id="regionTitle">지역</h2>
    <div id="stages"></div>
    <div class="others" id="others"></div>
  </section>
  <section class="panel">
    <h2>활성 목적 — 카드가 세계를 다르게 보이게 한다</h2>
    <div class="goal" id="goalCard"></div>
    <h2 style="margin-top:10px">목적 전환</h2>
    <select id="goalSel"></select>
    <h2 style="margin-top:10px">소지품</h2>
    <ul class="inv" id="inv"></ul>
  </section>
</main>
<section class="panel" style="max-width:1260px;margin:0 auto 10px">
  <h2>세계의 소리 — 파문·주기·타인</h2>
  <div id="feed"></div>
</section>
<footer>서버가 권위 — 이 화면은 상태를 그릴 뿐이다. 같은 주소를 다른 탭/기기에서 열면 같은 세계에 함께 선다.</footer>

<div id="joinWrap">
  <div class="panel">
    <h2>세계에 들어가기</h2>
    <p style="font-size:12.5px;color:#8ea0c0">거대 신이 순행하는 세계. 목적을 세우고, 흔적을 읽고, 창을 포착하라.</p>
    <input id="name" placeholder="이름 (예: 길잃은자)" maxlength="12">
    <div style="margin-top:10px"><button id="joinBtn">입장</button></div>
  </div>
</div>
<script src="play.js"></script>
</body>
</html>
