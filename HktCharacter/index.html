<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HktCharacter — 뼈·근육·피부 파이프라인</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14161a; }
  #app { position: absolute; inset: 0; }
  canvas { display: block; }

  .hud {
    position: absolute; top: 12px; left: 14px; color: #dfe3ea;
    font: 13px/1.5 system-ui, 'Segoe UI', sans-serif; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .hud b { font-size: 15px; }
  #status { color: #9fb4d0; max-width: 46ch; }

  .panel {
    position: absolute; top: 12px; right: 12px; width: 224px;
    background: rgba(22,26,32,.88); border: 1px solid #2c333d; border-radius: 10px;
    padding: 12px; color: #cfd6df; font: 12px/1.5 system-ui, 'Segoe UI', sans-serif;
    backdrop-filter: blur(4px); max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .panel h3 { font-size: 11px; letter-spacing: .08em; color: #8b95a3;
    text-transform: uppercase; margin: 12px 0 6px; }
  .panel h3:first-child { margin-top: 0; }
  .panel button {
    background: #232a33; color: #cfd6df; border: 1px solid #37404c;
    border-radius: 6px; padding: 4px 9px; margin: 2px 3px 2px 0;
    font-size: 12px; cursor: pointer;
  }
  .panel button:hover { background: #2d3641; }
  .panel button.on { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .panel select {
    width: 100%; background: #232a33; color: #cfd6df; border: 1px solid #37404c;
    border-radius: 6px; padding: 5px 8px; margin-top: 2px; font-size: 12px; cursor: pointer;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { flex: 0 0 auto; color: #8b95a3; min-width: 52px; }
  .row input[type=range] { flex: 1; }
  .row .val { flex: 0 0 auto; color: #6f7a88; width: 30px; text-align: right; }
  .steps { color: #7f8a99; font-size: 11px; line-height: 1.7; }
  .steps b { color: #cfd6df; }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <b>HktCharacter</b> — 뼈 → 근육 → 피부<br />
  <span id="status">초기화 중…</span>
</div>

<div class="panel">
  <h3>모델 (골격 소스)</h3>
  <select id="model"></select>

  <h3>체형 (근육·지방 파라미터)</h3>
  <select id="body"></select>

  <h3>레이어</h3>
  <div>
    <button id="btnBone">① 뼈</button>
    <button id="btnMuscle">② 근육</button>
    <button id="btnSkin" class="on">③ 피부</button>
  </div>
  <div class="steps">
    <b>①</b> X/Y Bot 스켈레톤 로드<br />
    <b>②</b> 해부학 근육 아틀라스 부착<br />
    <b>③</b> 근육 위 음함수 피부 → 스키닝 굽기
  </div>

  <h3>애니메이션</h3>
  <div id="anims"></div>

  <h3>재생 속도</h3>
  <div class="row">
    <label>속도</label>
    <input id="spd" type="range" min="0" max="2" step="0.05" value="1" />
    <span id="spdVal" class="val">1.0</span>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
