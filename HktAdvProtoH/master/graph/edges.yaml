# Master Graph Edges
# 노드 안에서 표현되지 않는 관계만 여기 둔다. 같은 관계를 양쪽에 중복 기록하지 않는다.
#
# 기본        CAUSES MOTIVATES WANTS BELIEVES KNOWS ACHIEVES REQUIRES
#             SUPPORTS OPPOSES CHANGES REVEALS REFRAMES CREATES_GOAL
# Constraint  CONSTRAINS SUPPORTS_CONSTRAINT CONFLICTS_WITH
#
# REQUIRES   Possibility 가 성립하기 위해 필요한 것
# CONSTRAINS 해당 Node 가 어떤 설계 원칙 아래 존재해야 하는지
# 형식: ../SCHEMA.md
version: 1
edges: []

# ACHIEVES / REQUIRES / SUPPORTS / OPPOSES / REVEALS 는 Possibility 노드 안에 있다.
# CAUSES / MOTIVATES / KNOWS / BELIEVES 는 아직 없다 — World Cause(MW-*)가 비어 있기 때문이다.
# CONSTRAINS / SUPPORTS_CONSTRAINT 도 없다 — Constraint 가 하나도 없다 (constraints/ 참조).
