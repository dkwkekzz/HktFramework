# Master Capability — MC-*
# 여러 Goal/Possibility 가 공통으로 재사용하는 플레이/World 의 의미 있는 능력.
# 구현 모듈명이 아니다. 왜 필요한지는 쓰지 않는다 — Goal/Possibility 경로가 설명한다.
# 구현 상태(overlay)의 근거는 ../overlay.md 가 소유한다.
# 형식: ../SCHEMA.md
version: 1
nodes:

  # ── 이미 세계에 있는 것 (C001~C007) ───────────────────────────────────

  - id: MC-COMBAT-STRIKE
    type: capability
    semantic: >
      휘두른 몸이 닿은 상대의 생명을 정해진 만큼 덜어내고, 맞은 몸은 하던 행동이 끊기고 밀려난다.
    required_by: [MP-BREAK-THE-GUARD, MP-EXPLOIT-OPEN-BODY, MP-STRIKE-THE-VULNERABLE-SPOT, MP-MATCH-WEAPON-TO-ARMOR]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 정해진 만큼 덜어낸다 — 난수 없는 고정 피해 (C007 실측)
    overlay: IMPLEMENTED

  - id: MC-CP-ECONOMY
    type: capability
    semantic: >
      하나의 기력 예산이 공격·방어·기동·폭발을 함께 묶는다. 어디에 쓸지 고르는 순간
      다른 곳에 쓸 것이 줄어든다.
    required_by: [MP-READ-AND-COUNTER, MP-BREAK-THE-GUARD, MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-TRADE-BODY-FOR-RESOURCE, MP-EVADE-BY-MOVING-THE-BODY, MP-HOLD-FORTIFIED]
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 의미 자체가 한 예산이다 — 아직 안 쓰는 쪽이 있는 것은
                                               # overlay PARTIAL(구현 공백)이지 Constraint 위반이 아니다 (정책 §16)
    overlay: PARTIAL                           # C010 방어 소비 · C011 방어 획득까지 왔다.
                                               # 남은 공백은 회피(MC-EVADE)·자세 유지(MC-FORTIFY)·서약(MC-VOW)

  - id: MC-BODY-FACING
    type: capability
    semantic: >
      몸이 향한 방향이 세계의 판정에 쓰인다 — 어느 쪽에서 들어온 공격인지가 의미를 가진다.
    required_by: [MP-STRIKE-THE-VULNERABLE-SPOT, MP-TRADE-BODY-FOR-RESOURCE]
    constraints: []
    constraint_evaluation: {}
    overlay: IMPLEMENTED

  - id: MC-COMBAT-CAUSE-READING
    type: capability
    semantic: >
      큰 결과가 나왔을 때 그것을 만든 원인과 배율을 전부 되짚어 읽을 수 있다.
      플레이어는 이것으로 배우고, 만든 사람은 이것으로 고친다.
    required_by: [MP-EXPLOIT-OPEN-BODY]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # explainable_result 요구를 직접 실현하는 능력이다 (원본 §15.1)
    overlay: PARTIAL                           # C010 이 방어 내역을, C011 이 시점·조건 내역을 열었다
                                               # (StrikeEvent 11값). 배율 일반(Flow·Matchup)은 아직 없다

  # ── 아직 세계에 없는 것 ───────────────────────────────────────────────

  - id: MC-DEFENSE-MITIGATION
    type: capability
    semantic: >
      맞은 피해를 줄인다. 공격을 빗나가게 하지 않으며, 아무리 두꺼워도 피해를 0 으로
      만들지는 못한다.
    required_by: [MP-TRADE-BODY-FOR-RESOURCE, MP-HOLD-FORTIFIED]
    # 이 Capability 를 목적으로 삼는 Possibility 는 없다 — 원본이 "그냥 두껍게 버틴다" 를
    # 플레이 방법으로 제시하지 않기 때문이다 (§5.2 — 일반 방어만으로 피해 0 에 도달하지 않는다).
    # 대신 막기와 자세가 딛는 바닥으로서 그 둘에 요구된다 (원본 §5.2 · §7).
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # C010 실측 — 감쇄가 맞은 뒤에만 걸리고 바닥이 있다
                                               # (08-verification "방어력의 바닥")
    overlay: IMPLEMENTED                       # C010

  - id: MC-GUARD
    type: capability
    semantic: >
      앞을 향해 막는 행동으로 들어온 공격을 생명 대신 자원과 균형 부담으로 받아낸다.
      막을 자원이 다하면 방어 자체가 무너진다.
    required_by: [MP-READ-AND-COUNTER, MP-TRADE-BODY-FOR-RESOURCE]
    constraints: [DC-COMBAT-DEFENSE-IS-ACTIVE, DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-DEFENSE-IS-ACTIVE: SATISFIED   # C010 실측 — 막기는 고르는 행동이고 고르는 대가가 있다
                                               # (requires[defense_as_player_action])
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # C010 실측 — 전용 게이지 없이 같은 기력으로 받아낸다.
                                               # 막은 뒤 고급 스킬이 insufficient-cp 로 막힌다
    overlay: IMPLEMENTED                       # C010
    # semantic 의 "균형 부담" 은 아직 세계에 없다 — 지금 막기가 치르는 것은 자원 하나뿐이며
    # 무너짐도 자원 고갈로만 온다. 균형 쪽은 MC-BREAK 이 들어오는 Cycle 이 채운다.

  - id: MC-PERFECT-GUARD
    type: capability
    semantic: >
      정확한 시점의 방어로 피해를 받지 않고 상대를 노출시켜 공격권을 뒤집는다.
      성패는 확률이 아니라 방어를 시작한 시각과 공격이 닿은 시각의 관계로 갈린다.
    required_by: [MP-READ-AND-COUNTER]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-DEFENSE-IS-ACTIVE]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # C011 실측 — 두 시각의 차(GuardElapsed)가 관찰되고
                                               # 같은 세계 두 번이 같은 결과를 낸다 (toEqual)
      DC-COMBAT-DEFENSE-IS-ACTIVE: SATISFIED   # C011 실측 — 막아 낸 것이 자원과 상대의 틈을 함께 만든다
                                               # (requires[defense_success_creates_offense_opportunity])
    overlay: IMPLEMENTED                       # C011

  - id: MC-EVADE
    type: capability
    semantic: >
      무적이 되는 것이 아니라 실제로 몸을 옮겨 충돌을 벗어난다.
    required_by: [MP-EVADE-BY-MOVING-THE-BODY]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 무적·확률이 아니라 실제 위치 이동이다 (원본 §8.3)
    overlay: MISSING

  - id: MC-COUNTER
    type: capability
    semantic: >
      상대가 열린 순간을 읽고 되받아쳐 더 큰 피해와 더 큰 균형 부담을 만든다.
    required_by: [MP-READ-AND-COUNTER]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-DEFENSE-IS-ACTIVE]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # C011 실측 — 노출 조건이 성립할 때만 커지고
                                               # 키운 몫(CounterBonus)이 내역에 실린다
      DC-COMBAT-DEFENSE-IS-ACTIVE: SATISFIED   # C011 실측 — 읽은 방어가 만든 틈을 되받아친다
    overlay: IMPLEMENTED                       # C011
    # 균형 부담(Break) 쪽 의미는 아직 없다 — semantic 의 "더 큰 균형 부담" 은
    # MC-BREAK 이 들어오는 Cycle 이 채운다 (C011 은 피해 증폭만 닫았다).

  - id: MC-BREAK
    type: capability
    semantic: >
      압박을 이어 상대의 균형을 누적으로 무너뜨리고, 무너진 동안의 짧은 폭발 구간을 연다.
      압박이 끊기면 쌓인 것은 풀린다.
    required_by: [MP-BREAK-THE-GUARD]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 누적과 붕괴가 관찰 가능한 상태로 드러난다 (원본 §9)
    overlay: MISSING

  - id: MC-COMBAT-FLOW
    type: capability
    semantic: >
      지금 몸의 힘을 공격과 방어 중 어디에 얼마나 몰았는지가 상태로 드러나고,
      한쪽에 몰수록 반대쪽이 실제로 빈다. 그 빈 구간은 상대가 읽을 수 있다.
    required_by: [MP-EXPLOIT-OPEN-BODY, MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-HOLD-FORTIFIED]
    constraints: [DC-COMBAT-POWER-HAS-COST]
    constraint_evaluation:
      DC-COMBAT-POWER-HAS-COST: SATISFIED      # 한쪽에 몰수록 반대쪽이 실제로 빈다 (원본 §3.3 · §7)
    overlay: MISSING

  - id: MC-FORTIFY
    type: capability
    semantic: >
      자원을 계속 흘리며 방어 쪽에 힘을 몰아 둔 자세를 유지한다.
    required_by: [MP-HOLD-FORTIFIED]
    constraints: [DC-COMBAT-POWER-HAS-COST, DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-POWER-HAS-COST: SATISFIED      # 안정성은 지속 비용과 약해진 공격으로 산다 (원본 §7)
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 흘리는 자원이 같은 기력 예산이다 (원본 §11)
    overlay: MISSING

  - id: MC-ATTACK-ARMOR-MATCHUP
    type: capability
    semantic: >
      무엇으로 무엇을 때렸는지가 결과를 바꾼다. 상성의 이득은 제한되며,
      강한 감각은 피해량보다 균형을 무너뜨리는 효율 쪽에 실린다.
    required_by: [MP-MATCH-WEAPON-TO-ARMOR]
    constraints: [DC-COMBAT-MATCHUP-SOFT, DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-MATCHUP-SOFT: SATISFIED        # semantic 이 이미 이득 제한과 균형 붕괴 쪽 배치를 담는다 (원본 §6.2)
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 조합이면 같은 결과 — 결정적 상성이다 (원본 §6)
    overlay: MISSING

  - id: MC-WEAK-POINT
    type: capability
    semantic: >
      몸의 특정 자리나 특정 세계 조건에 실제로 닿았을 때 더 큰 결과가 나온다.
    required_by: [MP-STRIKE-THE-VULNERABLE-SPOT]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률형 약점이 아니라 실제 닿음이 조건이다 (원본 §13.1)
    overlay: MISSING

  - id: MC-REAR-ATTACK
    type: capability
    semantic: >
      방어가 향하지 않은 쪽에서 들어간 공격은 막히기 어렵고 조금 더 아프다.
    required_by: [MP-STRIKE-THE-VULNERABLE-SPOT]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 위치라는 관찰 가능한 원인이 보상을 만든다 (원본 §13.2)
    overlay: MISSING

  - id: MC-CONDITION-STACKING
    type: capability
    semantic: >
      플레이어가 만들어 낸 조건들이 겹칠수록 결과가 커진다. 상한이 있고,
      각 조건이 무엇이었는지 결과에서 그대로 읽힌다.
    required_by: [MP-STAKE-EVERYTHING-ON-ONE-BLOW]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 명시 조건의 합성이고 상한이 있으며 결과에서 읽힌다 (원본 §10)
    overlay: MISSING

  - id: MC-VOW
    type: capability
    semantic: >
      세계가 참·거짓을 판정할 수 있는 제약을 스스로 걸어 더 큰 위력과 바꾼다.
      제약을 어기거나 실패하면 정의된 대가를 즉시 치른다.
    required_by: [MP-STAKE-EVERYTHING-ON-ONE-BLOW]
    constraints: [DC-COMBAT-POWER-HAS-COST, DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-POWER-HAS-COST: SATISFIED      # 검증 가능한 제약·수용한 위험·즉시 대가 — 이 Constraint 의 정면 사례 (원본 §12)
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 제약 완수는 세계가 판정하는 사건이다 (원본 §12)
    overlay: MISSING

# 주입 근거: design/Design-Combat-OffenseDefense-R0.md §6~§13 · §19 Intent Specification
#
# 이 문서의 §5·§6·§8·§9·§17 수치(DEFENSE_K · PERFECT_GUARD_WINDOW · BREAK_DECAY_RATE ·
# 상성 표 · 판정 순서 19단계)는 여기에 올리지 않았다 — Cycle 의 03-world-semantic.md 가
# 소유한다 (Master-Intent-Graph-Policy §22 · §26.3). 원본은 위 design/ 문서에 남아 있다.
