# Region R001 — 돌과 도구
#
# 이 Region 은 이미 세계에 있는 것(광맥·곡괭이·채굴)이 왜 존재하는지를 설명하고,
# 같은 목적에 이르는 다른 길들을 펼친다. C001 이 만든 C_MINE_DEPOSIT 은 여기서
# 여러 Possibility 중 하나의 requires 로 재사용된다 (Policy §27.4).
#
# Capability 는 여기서 정의하지 않는다 — master/graph/capabilities.yaml 이 단일 출처다.

kind: region
region: R001
title: 돌과 도구
summary: >-
  광맥은 캘수록 줄어든다. 마을 가까운 것이 먼저 마르면 돌을 구하는 방법이 사람마다 갈라지고,
  같은 광맥을 두고 사는 사람과 지나가는 사람의 목적이 부딪친다.

nodes:
  # ── 세계 원인 ──────────────────────────────────────────────────────
  - id: W-R001-DEPOSIT-DRAIN
    type: worldstate
    text: 광맥은 캘 때마다 자원이 줄고, 다 캐면 마른다.
    causes:
      - W-R001-NEAR-EXHAUSTED
    note: 이미 구현되어 있다 — RULE-MINE-COMPLETE-001 이 ResourceAmount 를 줄인다.

  - id: W-R001-NEAR-EXHAUSTED
    type: worldstate
    text: 사람이 모여 사는 곳 가까운 광맥이 먼저 마른다.
    causes:
      - W-R001-STONE-SCARCE

  - id: W-R001-STONE-SCARCE
    type: worldstate
    text: 쓸 만한 돌을 얻으려면 더 멀리 가거나, 남이 가진 것을 얻어야 한다.
    motivates:
      - G-R001-PLAYER-STONE
      - G-R001-ARIN-LIVELIHOOD
      - G-R001-BOR-SUPPLY

  - id: W-R001-TOOL-GATE
    type: worldstate
    text: 맨손으로는 광맥에서 돌이 나오지 않는다 — 캐는 도구를 지녀야 한다.
    note: 이미 구현되어 있다 — RULE-MINE-001 의 no-mining-tool 판정.

  - id: W-R001-DEEP-SEAM
    type: worldstate
    text: 마른 광맥 아래로 더 깊은 갱도가 이어져 있는지는 아직 아무도 확인하지 않았다.
    note: 세계에 없는 상태다. P-R001-DEEP-SEAM 이 이것을 요구한다.

  # ── 주체 ───────────────────────────────────────────────────────────
  - id: A-R001-ARIN
    type: actor
    text: 아린 — 이 근처 광맥을 캐서 먹고사는 광부.
    wants:
      - G-R001-ARIN-LIVELIHOOD
    believes:
      - B-R001-ARIN-DEEPER

  - id: A-R001-BOR
    type: actor
    text: 보르 — 마을의 대장장이. 남이 캐 온 돌로 도구를 만든다.
    wants:
      - G-R001-BOR-SUPPLY
    knows:
      - K-R001-TOOLCRAFT

  # ── 앎과 믿음 ──────────────────────────────────────────────────────
  - id: K-R001-DEPOSIT-WHERE
    type: knowledge
    text: 아직 마르지 않은 광맥이 어디에 있는지.
    true_in_world: true

  - id: K-R001-TOOLCRAFT
    type: knowledge
    text: 돌과 나무를 들여 캐는 도구를 만드는 방법.
    holder: A-R001-BOR
    true_in_world: true

  - id: B-R001-ARIN-DEEPER
    type: belief
    text: 아린은 마른 광맥 아래에 아직 돌이 남아 있다고 믿는다.
    holder: A-R001-ARIN
    true_in_world: unknown
    creates_goal:
      - G-R001-ARIN-LIVELIHOOD
    note: 참인지 거짓인지 세계가 아직 정하지 않았다. P-R001-DEEP-SEAM 이 그것을 드러낸다.

  - id: K-R001-SEAM-TRUTH
    type: knowledge
    text: 마른 광맥 아래에 실제로 무엇이 있는지 (있다 / 없다).
    true_in_world: unknown
    reframes:
      - G-R001-ARIN-LIVELIHOOD

  # ── 목적 ───────────────────────────────────────────────────────────
  - id: G-R001-PLAYER-STONE
    type: goal
    owner: A-PLAYER
    desired_state: 지금 필요한 만큼의 돌을 자기 소지로 가진다.
    motivation:
      - 도구를 만들거나 값을 치르려면 먼저 재료가 있어야 한다
    belief_context:
      - K-R001-DEPOSIT-WHERE
    stakes:
      - 돌이 없으면 도구가 없고, 도구가 없으면 캐지도 못한다

  - id: G-R001-ARIN-LIVELIHOOD
    type: goal
    owner: A-R001-ARIN
    desired_state: 자기가 캐는 광맥에서 계속 돌이 나온다.
    motivation:
      - 이것으로 먹고산다. 이 광맥이 마르면 살 길이 끊긴다
    belief_context:
      - B-R001-ARIN-DEEPER
    stakes:
      - 생계

  - id: G-R001-BOR-SUPPLY
    type: goal
    owner: A-R001-BOR
    desired_state: 대장간에 재료가 끊기지 않는다.
    motivation:
      - 재료가 없으면 도구를 만들 수 없고, 도구가 없으면 아무도 캐지 못한다
    stakes:
      - 마을 전체의 도구 공급

  # ── 가능성 ─────────────────────────────────────────────────────────
  - id: P-R001-MINE-DIRECT
    type: possibility
    name: 직접 캔다
    achieves:
      - G-R001-PLAYER-STONE
    requires:
      capabilities: [C_MOVE, C_MINE_DEPOSIT, C_CARRY_ITEM]
      knowledge: [K-R001-DEPOSIT-WHERE]
      world: [W-R001-TOOL-GATE]
    opposes:
      - G-R001-ARIN-LIVELIHOOD
    changes:
      - W-R001-DEPOSIT-DRAIN
      - 소지한 돌이 늘어난다
    note: >-
      지금 플레이할 수 있는 유일한 길이다 (C001). 이 길만 있으면 광맥은 그저 자판기가 된다 —
      아래 다른 Possibility 들이 열릴 때 비로소 선택이 된다.

  - id: P-R001-BUY-FROM-MINER
    type: possibility
    name: 캐는 사람에게서 산다
    achieves:
      - G-R001-PLAYER-STONE
    requires:
      capabilities: [C_MOVE, C_TALK, C_TRADE, C_CARRY_ITEM]
    supports:
      - G-R001-ARIN-LIVELIHOOD
      - G-R001-BOR-SUPPLY
    changes:
      - 아린의 소지가 돌에서 값으로 바뀐다
      - 아린과의 관계가 좋아진다
    note: 직접 캐는 것보다 느리지만 광맥을 마르게 하지 않는다. 비용과 관계가 다른 길이다.

  - id: P-R001-DEEP-SEAM
    type: possibility
    name: 마른 광맥 아래로 들어간다
    achieves:
      - G-R001-PLAYER-STONE
      - G-R001-ARIN-LIVELIHOOD
    requires:
      capabilities: [C_MOVE, C_MINE_DEPOSIT, C_KNOW]
      knowledge: [K-R001-DEPOSIT-WHERE]
      world: [W-R001-DEEP-SEAM]
    supports:
      - G-R001-ARIN-LIVELIHOOD
    changes:
      - W-R001-DEEP-SEAM 의 참/거짓이 정해진다
    reveals:
      - K-R001-SEAM-TRUTH
    note: >-
      아린의 믿음이 맞는지 세계가 대답하는 길이다. 틀렸다면 아린의 목적이 다시 해석된다
      (K-R001-SEAM-TRUTH reframes).

  - id: P-R001-TAKE-BY-FORCE
    type: possibility
    name: 캔 사람에게서 빼앗는다
    achieves:
      - G-R001-PLAYER-STONE
    requires:
      capabilities: [C_MOVE, C_MELEE_STRIKE, C_LOOT]
    opposes:
      - G-R001-ARIN-LIVELIHOOD
      - G-R001-BOR-SUPPLY
    changes:
      - 아린이 지녔던 돌이 내 소지로 넘어온다
      - 아린과의 관계가 끊어진다
      - 마을이 나를 대하는 방식이 달라진다
    note: 가장 빠르고 가장 많은 것을 닫는 길이다. 이후 P-R001-BUY-FROM-MINER 가 막힌다.

  - id: P-R001-MAKE-OWN-TOOL
    type: possibility
    name: 도구를 스스로 만들어 남의 도구에 매이지 않는다
    achieves:
      - G-R001-BOR-SUPPLY
    requires:
      capabilities: [C_CRAFT, C_CARRY_ITEM, C_KNOW]
      knowledge: [K-R001-TOOLCRAFT]
      goals: [G-R001-PLAYER-STONE]
    supports:
      - G-R001-PLAYER-STONE
    changes:
      - 재료가 줄고 도구가 생긴다
      - 보르에게 의존하지 않아도 캘 수 있다
    creates_goal:
      - G-R001-PLAYER-STONE
    note: >-
      requires 에 Goal 이 들어가는 예다 — 만들려면 먼저 재료가 있어야 하므로
      이 Possibility 는 다시 G-R001-PLAYER-STONE 을 필요로 한다 (Policy §15).
