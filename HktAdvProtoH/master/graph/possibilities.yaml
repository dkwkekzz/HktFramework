# Master Possibility — MP-*
# Goal 을 달성·진전시키는 의미 있게 다른 후보 방법. Goal→Possibility 는 OR,
# Possibility→Requirements 는 AND 다.
# Gameplay/Cost/Risk/Relationship/Consequence 중 하나 이상이 실질적으로 달라야
# 별도 Possibility 다. 동의어를 늘리지 않는다.
# 형식: ../SCHEMA.md
#
# 인용 표기 — 원본 design/Design-Combat-OffenseDefense-R0.md 는 2026-08-17 R1 로 전면
# 개정되었다. R1 §x 는 현행 문서, 구판 §x 는 git history 의 R0 을 가리킨다.
version: 1
nodes:

  # ── MG-OVERCOME-SUPERIOR-OPPONENT 를 달성하는 방법들 (OR) ──────────────

  - id: MP-OUTGROW-THE-OPPONENT
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      다른 경로가 전투 중의 실행(정확한 시점·위치·이어 가는 압박)으로 이기는 데 비해,
      이것은 전투 밖에서 기른 공격·방어 능력치로 정면 교환 자체를 유리하게 만든다.
      손의 정확함이 아니라 축적을 요구하고, 같은 행동이 성장 전후로 다른 결과를 낸다 —
      전투가 시작되기 전에 이미 절반이 결정되는 유일한 경로다.
    requires:
      goals: []
      capabilities: [MC-ATTACK-POWER, MC-SKILL-SCALING, MC-DEFENSE-MITIGATION, MC-COMBAT-STRIKE, MC-CP-ECONOMY]
      # 기본 공격이 기력을 벌고 고급 공격이 쓰는 기존 루프 위에서 성장이 작동해야 한다 (R1 §11 · §16)
      knowledge: []
      world_state: []
      relationship: []
      resource: [능력치를 올릴 장비·성장의 원천]
    supports: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 방어 능력치 절반이 같은 성장에서 나온다 (R1 §8 · §12)
    opposes: []
    changes:
      - 같은 스킬·같은 상대에 대한 교환비가 성장 전후로 달라진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 능력치·같은 스킬·같은 상대면 항상 같은 피해 — 난수 없음 (R1 §6)

  - id: MP-READ-AND-COUNTER
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대의 공격을 피하거나 견디는 것이 아니라 그 공격 자체를 자원으로 바꾼다.
      비용은 낮고(성공하면 자원을 오히려 얻는다) 요구되는 것은 정확한 시점이다 —
      실패하면 그대로 맞는 고위험 저비용 경로다. 다른 어떤 경로보다 상대의 행동에 의존한다.
    requires:
      goals: []
      capabilities: [MC-GUARD, MC-PERFECT-GUARD, MC-COUNTER, MC-CP-ECONOMY]
      knowledge: [MK-OPPONENT-FLOW-PATTERN]
      world_state: []
      relationship: []
      resource: []
    supports: [MG-SURVIVE-ENEMY-OFFENSIVE]
    opposes: []
    changes:
      - 공격권이 상대에서 나에게 넘어온다
      - 상대가 잠시 취약해진다
    reveals: [MK-OPPONENT-FLOW-PATTERN]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-DEFENSE-IS-ACTIVE]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 성패가 확률이 아니라 시점 관계로 갈린다 (구판 §8.2 · C011 실측)
      DC-COMBAT-DEFENSE-IS-ACTIVE: SATISFIED   # 방어 성공이 공격권 탈취로 이어진다 (구판 §3.2 · C011 실측)

  - id: MP-BREAK-THE-GUARD
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      한 번의 정확함이 아니라 끊기지 않는 압박으로 이긴다. 시간이 걸리고 접근을 유지해야 하며
      중간에 물러나면 쌓은 것이 풀린다. 대신 상대의 대응에 덜 의존하고, 성공하면 짧지만
      확실한 폭발 구간을 스스로 만든다 — 파티가 함께 쓸 수 있는 유일한 경로다.
    requires:
      goals: []
      capabilities: [MC-BREAK, MC-COMBAT-STRIKE, MC-CP-ECONOMY]
      knowledge: []
      world_state: []
      relationship: []
      resource: [축적된 CP]
    supports: []
    opposes: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 압박을 유지하려면 방어에 쓸 자원과 거리를 포기해야 한다
    changes:
      - 상대의 방어 구조가 일시적으로 무너진다
      - 짧은 폭발 구간이 열린다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 폭발 구간은 난수가 아니라 이어간 압박의 누적으로 열린다 (구판 §9)
    # R1 §13·§14 로 이연 — 기본 공식 검증 전에는 Frontier 후보로 세우지 않는다.

  - id: MP-EXPLOIT-OPEN-BODY
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대가 스스로 만든 취약 구간을 노린다. 자원도 위치도 요구하지 않고 오직 관찰과 대기가
      비용이다 — 기다리는 동안 아무것도 얻지 못한다. 되받아치기와 달리 상대의 공격을 받아낼
      필요가 없다.
    requires:
      goals: []
      capabilities: [MC-COMBAT-FLOW, MC-COMBAT-STRIKE, MC-COMBAT-CAUSE-READING]
      knowledge: [MK-OPPONENT-FLOW-PATTERN]
      world_state: []
      relationship: []
      resource: []
    supports: [MP-READ-AND-COUNTER]
    opposes: []
    changes:
      - 상대가 힘을 몰았던 순간의 대가를 실제로 치른다
    reveals: [MK-OPPONENT-FLOW-PATTERN]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-POWER-HAS-COST]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 열림은 배분 상태라는 관찰 가능한 원인이다 (구판 §7)
      DC-COMBAT-POWER-HAS-COST: SATISFIED      # 상대의 집중이 반대쪽을 비운 대가를 노린다 (구판 §3.3 · §7)
    # R1 §14 C014(Aura / Nen — 집중) 로 이연 — Flow 의 형태가 재설계된다.

  - id: MP-STRIKE-THE-VULNERABLE-SPOT
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      타이밍이 아니라 위치로 이긴다. 상대의 행동과 무관하게 성립하지만 몸을 옮겨 붙어야 하므로
      이동 비용과 반격 위험을 진다. 보상은 작고 대신 언제나 쓸 수 있다.
    requires:
      goals: []
      capabilities: [MC-WEAK-POINT, MC-REAR-ATTACK, MC-BODY-FACING, MC-COMBAT-STRIKE]
      knowledge: []
      world_state: []
      relationship: []
      resource: []
    supports: [MP-BREAK-THE-GUARD]
    opposes: []
    changes:
      - 방어가 향하지 않은 쪽으로 피해가 들어간다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률 약점이 아니라 실제로 닿은 위치·조건으로 성립한다 (구판 §13)
    # R1 §13·§14 로 이연.

  - id: MP-MATCH-WEAPON-TO-ARMOR
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      전투 중의 실행이 아니라 전투 전의 선택으로 이긴다. 준비 단계에서 결정되며 교전 중에는
      바꿀 수 없다. 성장의 축적(MP-OUTGROW-THE-OPPONENT)과 달리 상대별로 다시 고르는
      판단이다 — 같은 능력치로도 상대에 따라 결과가 달라진다.
    requires:
      goals: []
      capabilities: [MC-ATTACK-ARMOR-MATCHUP, MC-COMBAT-STRIKE]
      knowledge: [MK-OPPONENT-DEFENSE-SHAPE]
      world_state: []
      relationship: []
      resource: []
    supports: [MP-BREAK-THE-GUARD]
    opposes: []
    changes:
      - 같은 스킬이 상대에 따라 다른 효율을 낸다
    reveals: [MK-OPPONENT-DEFENSE-SHAPE]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-MATCHUP-SOFT]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 상성은 결정적이다 — 같은 조합이면 같은 효율 (구판 §6)
      DC-COMBAT-MATCHUP-SOFT: SATISFIED        # 피해 폭은 작게, 강한 감각은 균형 붕괴 효율 쪽 (구판 §6.2 · §6.3)
    # R1 §14 C011(Damage Type — Physical/Magic · Armor/Resistance) 로 재편 예정.

  - id: MP-STAKE-EVERYTHING-ON-ONE-BLOW
    type: possibility
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      다른 모든 경로가 반복 가능한 데 비해 이것은 한 번이다. 스스로 제약을 걸어 조건을
      좁히고 실패하면 정의된 대가를 즉시 치른다. 위험을 자원처럼 지불하는 유일한 경로다.
    requires:
      goals: []
      capabilities: [MC-VOW, MC-COMBAT-FLOW, MC-CP-ECONOMY, MC-CONDITION-STACKING]
      knowledge: []
      world_state: []
      relationship: []
      resource: [축적된 CP, 제약이 요구하는 자기 상태]
    supports: []
    opposes: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 제약이 대개 자기 방어를 포기하게 만든다
    changes:
      - 규칙 안의 상한을 넘는 한 번의 결과가 나온다
      - 실패하면 방어권·자원 등 정의된 것을 잃는다
    reveals: []
    creates_goal:
      - MG-SURVIVE-ENEMY-OFFENSIVE
      # 실패의 대가(예: 한동안 막을 수 없다)가 곧바로 다음 국면을 만든다 — 구판 §12 Failure
    constraints: [DC-COMBAT-POWER-HAS-COST, DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-POWER-HAS-COST: SATISFIED      # 세계가 판정 가능한 제약과 즉시 적용되는 실패 대가 (구판 §12)
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 큰 결과는 스스로 만든 조건들의 합이지 난수가 아니다 (구판 §10 · §18.3)
    # R1 §14 C014(조건·제약·서약) 로 이연.

  # ── MG-SURVIVE-ENEMY-OFFENSIVE 를 달성하는 방법들 (OR) ─────────────────

  - id: MP-TRADE-BODY-FOR-RESOURCE
    type: possibility
    achieves: [MG-SURVIVE-ENEMY-OFFENSIVE]
    meaningful_difference: >
      피해를 피하지 않고 받되 생명이 아닌 자원으로 받는다. 즉시 성립하고 정확함을 요구하지
      않지만, 계속 쓰면 자원이 말라 더 나쁜 붕괴로 끝난다 — 시간을 사는 선택이다.
    requires:
      goals: []
      capabilities: [MC-GUARD, MC-DEFENSE-MITIGATION, MC-CP-ECONOMY, MC-BODY-FACING]
      # 막기는 피해를 0 으로 만들지 않고 줄인다 — 줄일 대상인 피해 감쇄가 먼저 있어야 한다 (구판 §5.2 · §8.1)
      knowledge: []
      world_state: []
      relationship: []
      resource: [남은 CP]
    supports: []
    opposes: [MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-BREAK-THE-GUARD]   # 같은 CP 를 놓고 경쟁한다
    changes:
      - 생명 대신 자원이 줄어든다
      - 자원이 바닥나면 방어 자체가 무너진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-DEFENSE-IS-ACTIVE, DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-DEFENSE-IS-ACTIVE: SATISFIED   # 막기는 선택하는 행동이다 — 공격 기회 전환은 같은 행동 위의
                                               # 정확한 시점 경로(MP-READ-AND-COUNTER)가 이어받는다 (구판 §8.1 · C010 실측)
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 생명 대신 같은 기력 예산으로 받아 마르면 무너진다 (구판 §8.1 · §11 · C010 실측)

  - id: MP-EVADE-BY-MOVING-THE-BODY
    type: possibility
    achieves: [MG-SURVIVE-ENEMY-OFFENSIVE]
    meaningful_difference: >
      막지 않고 그 자리에 없다. 자원을 쓰고 위치가 바뀌므로 다음 공격 거리도 함께 잃거나 얻는다.
      막기와 달리 상대의 압박을 누적시키지 않는다.
    requires:
      goals: []
      capabilities: [MC-EVADE, MC-CP-ECONOMY]
      knowledge: []
      world_state: []
      relationship: []
      resource: [남은 CP]
    supports: [MP-STRIKE-THE-VULNERABLE-SPOT]   # 옮긴 위치가 곧 후방일 수 있다
    opposes: []
    changes:
      - 내 위치가 바뀐다
      - 상대의 공격이 빗나가되 상대는 대가를 치르지 않는다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률 회피가 아니라 실제 위치 이동으로 벗어난다 (구판 §8.3)
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 기동도 같은 기력 예산을 쓴다 (구판 §11)
    # R1 §13(Dodge 미구현 명시) 로 이연.

  - id: MP-HOLD-FORTIFIED
    type: possibility
    achieves: [MG-SURVIVE-ENEMY-OFFENSIVE]
    meaningful_difference: >
      한 번의 방어가 아니라 자세를 유지한다. 매 순간 자원을 흘리는 대신 판정마다 정확할
      필요가 없다 — 손이 아니라 자원으로 사는 안정성이다. 그동안 내 공격은 약해진다.
    requires:
      goals: []
      capabilities: [MC-FORTIFY, MC-DEFENSE-MITIGATION, MC-COMBAT-FLOW, MC-CP-ECONOMY]
      # 자세는 방어력에 배율을 건다 — 곱할 방어력이 없으면 자세도 의미가 없다 (구판 §5.1 · §7)
      knowledge: []
      world_state: []
      relationship: []
      resource: [지속 공급되는 CP]
    supports: []
    opposes: [MG-OVERCOME-SUPERIOR-OPPONENT]   # 버티는 동안 상대를 넘어서지는 못한다
    changes:
      - 버티는 동안 안정되지만 공격이 약해진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-POWER-HAS-COST, DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-POWER-HAS-COST: SATISFIED      # 방어에 몰면 공격이 실제로 약해진다 (구판 §3.3 · §7)
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 자세 유지가 같은 기력 예산을 흘린다 (구판 §11)
    # R1 §14 C014(방어 집중) 로 이연.

# 주입 근거: design/Design-Combat-OffenseDefense-R0.md
#   R1 (2026-08-17 전면 개정) §0~§5 · §8 · §11 · §12 · §16 → MP-OUTGROW-THE-OPPONENT
#   구판(R0) 유래 노드는 유지하되 R1 §13·§14 이연을 주석으로 표시 — 삭제하지 않는 이유는
#   R1 §14·§15 가 같은 층들을 확장 순서로 여전히 예고하기 때문이다. 각 층의 세부 재설계가
#   나오면 그때 노드를 개정한다.
#
# 탐색하지 않은 Dimension — 이 문서는 Combat 안에서만 대안을 제시한다.
# 같은 Goal(상대를 넘어선다)을 Exploration / Economy / Social / Faction / Knowledge 로
# 달성하는 경로는 이 문서의 범위 밖이며, 여기에 억지로 만들어 넣지 않았다.
# 그 폭은 World Cause 와 Root Goal 이 정해진 뒤 M2 확장이 다룬다.
