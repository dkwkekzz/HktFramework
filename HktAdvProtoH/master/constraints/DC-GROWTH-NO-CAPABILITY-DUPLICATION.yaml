# 원본 근거: design/Master-Intent-Graph-Growth.md (GR)
#   §33 (Capability 자체는 Source 별로 복제하지 않는다 — MC-COUNTER 하나에
#        Class/Item/Actor 가 grants 로 연결된다) ·
#   §35 (Class 와 Item 은 동일한 Capability Network 에 연결된다) ·
#   §42 Anti-pattern (Class 마다 같은 Capability 를 복제한다)
# 2026-08-18 Inject — 같은 날 Human 일괄 승인 (Q13 → HISTORY.md).
id: DC-GROWTH-NO-CAPABILITY-DUPLICATION
type: constraint

statement: >
  같은 플레이 의미의 Capability 를 획득 Source(Class / Item / Actor)별로
  복제하지 않는다. 하나의 MC-* 에 여러 획득 경로가 grants 로 연결된다.
rationale: >
  Source 별 복제(BerserkerCounter · ItemCounter …)는 같은 의미를 이름만 바꿔
  늘리며, 하나의 Capability 를 여러 방법으로 얻는 교차 성장(GR §35 —
  배우거나 · 장착하거나 · 적응하거나 · Class Change 하거나)을 불가능하게 만든다.

scope:
  - GROWTH

requires:
  - one_capability_many_acquisition_routes   # MC-* 하나 ← 복수 CL-*/IT-*/MA-* grants (GR §33)
prohibits:
  - per_source_capability_clone              # Source 별 MC-* 복제 (GR §33 BAD · §42)
prefers: []

status: APPROVED
provenance:
  - HUMAN_DESIGN          # 2026-08-18 Human 지시로 GR 주입

relations:
  supports: []
  conflicts_with: []
