# 원본 근거: design/Master-Intent-Graph-Growth.md (GR)
#   §28 (Item Definition 과 Item Instance 를 분리한다 — Master 는 Type·Property·
#        Modifier·Composition Rule, Runtime 은 실제 생성된 Instance) ·
#   §28.3 (단순 수치 옵션은 Growth Node 가 아니다) ·
#   §29 (II-* 는 Runtime Entity) · §31 (모든 조합 결과를 사전에 Node 로 만들지 않는다) ·
#   §32 (Schema 유한 · Runtime Graph 유한 · 가능한 Growth 무한) ·
#   §30 · §41 (obtained_from / composed_from 으로 provenance 추적 가능)
# 2026-08-18 Inject — 같은 날 Human 일괄 승인 (Q13 → HISTORY.md).
id: DC-GROWTH-DEFINITION-INSTANCE-SPLIT
type: constraint

statement: >
  Master 는 유한한 Definition(Class · Item Type · Property · Modifier · 조합 규칙)만
  소유한다. 실제 생성된 Item Instance(II-*)와 조합 결과는 Runtime World 가 소유하며,
  가능한 조합을 사전에 Node 로 생성하지 않는다.
rationale: >
  무한한 아이템 조합을 Master 에 미리 만들면 Registry 가 폭발하고 세계 인과와
  무관한 정적 목록이 된다. Schema 와 Rule 을 유한하게 유지하고 실제 사건이
  발생할 때만 Instance 가 생기게 해야 "가능한 Growth 는 사실상 무한"이
  성립한다 (GR §32). Instance 는 어디서 왔는지(획득·조합) 역추적 가능해야
  세계 상태의 결과로 존재한다 (GR §30).

scope:
  - GROWTH

requires:
  - master_holds_finite_definitions_only   # CL/IT/IP/IM + 조합 규칙까지만 (GR §28 · §32)
  - runtime_instance_provenance_traceable  # obtained_from / composed_from 추적 (GR §30 · §41)
prohibits:
  - item_instance_as_master_node           # II-* 를 master/ 정적 Node 로 (GR §29 · §37)
  - pregenerated_combination_nodes         # 검×속성×Prefix×… 사전 생성 (GR §31 · §42)
  - plain_numeric_option_as_growth_node    # "공격력 +13" 을 IM-*/IP-* 로 (GR §28.3)
prefers: []

status: APPROVED
provenance:
  - HUMAN_DESIGN          # 2026-08-18 Human 지시로 GR 주입

relations:
  supports: []
  conflicts_with: []
