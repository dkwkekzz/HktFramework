# 원본 근거: design/Design-Combat-OffenseDefense-R0.md
#   §1 Design Pillar · §1.1 · §2 보존 원칙 · §5.1 · §10 · §15.1 · §22 · §23 R0 Philosophy
# 2026-08-15 Human 지시로 원본 기획서의 명시 원칙을 반영. 원본보다 세게 쓰지 않았다.
id: DC-COMBAT-PLAYER-CAUSALITY
type: constraint

statement: >
  전투의 중요한 결과는 관찰 가능한 세계 상태와 플레이어의 선택·행동에서 나오며,
  같은 상태·같은 조건·같은 행동이면 언제나 같은 결과가 나온다.
rationale: >
  랜덤이 크리티컬을 만드는 것이 아니라 플레이어의 선택이 크리티컬을 만든다 (§23).
  플레이어는 왜 그 결과가 나왔는지 이해하고 학습할 수 있어야 하며,
  만든 사람은 같은 기록으로 고칠 수 있어야 한다 (§1.1 · §15.1).

scope:
  - COMBAT

requires:
  - observable_cause                            # 강한 결과에는 반드시 관찰 가능한 원인 (§1)
  - explainable_result                          # 결과를 만든 원인과 배율을 되짚어 추적할 수 있다 (§15.1)
  - deterministic_resolution_under_same_state   # 같은 상태·조건·행동 → 언제나 같은 결과 (§1 · §5.1)
prohibits:
  # 넷 모두 원본이 명시적으로 "추가하지 않는다" 고 못 박은 것 (§2 보존 원칙 · §22 Out of Scope)
  - random_hit
  - random_evade
  - random_damage
  - random_critical
prefers: []

status: APPROVED
provenance:
  - HUMAN_DESIGN          # design/Design-Combat-OffenseDefense-R0.md · 2026-08-15 Human 지시로 반영

relations:
  supports: []
  conflicts_with: []
