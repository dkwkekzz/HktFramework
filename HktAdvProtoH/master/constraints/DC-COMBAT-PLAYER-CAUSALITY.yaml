id: DC-COMBAT-PLAYER-CAUSALITY
type: constraint

statement: >
  전투의 중요한 결과는 관찰 가능한 세계 상태와 플레이어의 선택에서 나와야 한다.
  랜덤이 결정적 순간을 만들지 않는다.

rationale: >
  큰 결과가 나왔을 때 플레이어가 "왜 그렇게 됐는가" 를 재구성할 수 있어야 학습이 성립한다.
  원인이 우연이면 배울 것이 없고, 같은 상황을 다시 만들 수도 없다.
  디버깅 가능성도 같은 근거에서 나온다 — 세계가 결과의 원인을 전부 공개할 수 있어야 한다.

scope:
  - COMBAT

requires:
  - observable_cause                          # 결과를 만든 원인이 세계에서 관찰된다
  - explainable_result                        # 최종 수치를 만든 모든 배율을 되짚을 수 있다
  - deterministic_resolution_under_same_state # 같은 상태·같은 조건·같은 행동이면 같은 결과
  - fixed_resolution_order                    # 판정 순서가 고정되어 결과가 순서에 흔들리지 않는다

prohibits:
  - random_hit          # 명중률
  - random_evade        # 회피율
  - random_critical     # 확률 Critical
  - random_damage       # 피해 난수

prefers:
  - condition_stacking_over_chance   # 큰 피해는 겹친 조건의 결과로 만든다

status: APPROVED
provenance:
  - HUMAN_DESIGN                 # Design-Combat-OffenseDefense-R0.md 핵심 명제 · §2 보존 원칙 · §5.1 · §23
  - CYCLE:C007                   # R1 에서 INTENT-WORLD-CHANCE-001 폐기 — 세계가 이미 이 형태다

relations:
  supports: []
  conflicts_with: []
