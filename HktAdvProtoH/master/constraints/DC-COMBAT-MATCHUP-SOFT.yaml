# 원본 근거: design/Design-Combat-DamageType-R0.md §7 소프트 상성 원칙 (원칙 1~5) ·
#   §4 (타입 대응표는 보너스 배율표가 아니다) · §5 (양의 Raw Damage 는 최소 1) ·
#   §14 수용 기준 7·10 · §17 (이 층이 추가하는 것은 선택 하나다)
#
# 2026-08-18 Q12 — 재승인(APPROVED). 보류 사유였던 "근거 층이 아직 없다" 가 사라졌다:
#   근거 층 = Damage Type → C012-damage-type-chooses-the-defense 로 닫혔고
#   그 Cycle 의 08-verification 이 세 원칙을 실측으로 확인했다
#   (면역 없음 · 타입 배율표 없음 · 틀린 타입도 작동).
# 같은 결정으로 구판(R0) 유래 문안을 제거했다 — statement 는 DT §7 이 직접 제시한
# 재해석 문장으로 교체하고, prefers 의 break_efficiency 는 삭제했다.
# DT §7 이 명시한다: "구판 Constraint 의 break_efficiency 는 이 층에 Break 가 없으므로
# 채택하지 않는다. Break 가 실제로 설계되는 층에서 다시 판단한다."
id: DC-COMBAT-MATCHUP-SOFT
type: constraint

statement: >
  공격 형태와 방어 형태의 상성은 선택을 만들되 결과를 지배하지 않는다.
  상성은 별도 피해 배율이 아니라 대응 공격·방어 능력치의 차이로 표현한다.
rationale: >
  하드 카운터는 "이 무기 없으면 못 잡는다" 를 만들고 준비 선택을 강요로 바꾼다.
  목표는 틀린 타입을 고른 쪽도 계속 싸울 수 있되, 맞는 타입을 고른 쪽이 더 나은
  결과를 얻는 것이다 (DT §0 · §7). 차이는 오직 대응 능력치의 분포에서만 나온다.

scope:
  - COMBAT

requires:
  - matchup_expressed_only_by_stat_difference   # 상성은 대응 공격·방어 능력치 차이로만 생긴다 (DT §7-3 · §17)
  - positive_damage_always_lands_at_least_one   # 양의 Raw Damage 는 방어가 아무리 높아도 최소 1 (DT §7-1 · §5 · §14-7)
  - weakness_is_observable                      # 플레이어가 대응 방어 능력이나 그 차이를 알 수 있다 (DT §7-4 · §10)
prohibits:
  - type_bonus_multiplier_table                 # 타입별 보너스·페널티 배율표, 무기 가위바위보 표 (DT §7-2 · §4 · §14-10)
  - damage_immunity_by_type                     # 특정 타입 피해를 0 으로 만드는 면역 (DT §7-1 · §13)
prefers:
  - 타입만으로 승패가 확정되지 않는 것          # Base Damage · Ratio · 능력치 · 실행 성공이 계속 중요하다 (DT §7-5)

status: APPROVED
provenance:
  - HUMAN_DESIGN          # 구판 반영 2026-08-15 · DRAFT 보류 2026-08-17 · DT §7 기준 재작성과 재승인 2026-08-18 — 모두 Human 지시

relations:
  supports:
    - DC-COMBAT-ONE-FORMULA        # 상성이 배율표가 아니라 입력 선택이면 공식은 하나로 남는다
  conflicts_with: []
