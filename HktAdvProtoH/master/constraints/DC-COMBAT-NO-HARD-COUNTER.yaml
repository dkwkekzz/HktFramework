id: DC-COMBAT-NO-HARD-COUNTER
type: constraint

statement: >
  상성은 선택을 만들되 해법을 하나로 강제하지 않는다. 상성의 강한 감각은
  피해량이 아니라 기회(방어를 무너뜨리는 효율) 쪽에 싣는다.

rationale: >
  캐릭터 중심 전투에서 하드 카운터는 "이 무기가 없으면 못 잡는다" 가 되어 플레이 경험을
  억압하고, 하나의 Goal 에 하나의 Possibility 만 남긴다. 상성이 피해 배율로 크게 갈리면
  다른 접근(위치·타이밍·제약)이 전부 무의미해진다.

scope:
  - COMBAT

requires:
  - multiple_valid_approaches      # 같은 상대를 넘어서는 실질적으로 다른 방법이 하나 이상 더 있다
  - matchup_advantage_is_bounded   # 상성 이득의 폭이 제한된다

prohibits:
  - required_weapon_gate           # 특정 공격 형태 없이는 불가능한 대상

prefers:
  - matchup_as_opportunity         # 상성을 피해량보다 Break 효율 등 기회로 표현한다

status: DRAFT
provenance:
  - HUMAN_DESIGN     # Design-Combat-OffenseDefense-R0.md §3.1 · §6.3 설계 포인트

relations:
  supports: []
  conflicts_with: []
  # 잠재 긴장 — 상성 감각을 Break 로 옮기면 Break 축적 경로가 하나의 지배 전략이 될 수 있다.
  # 현재 근거로는 충돌로 단정할 수 없어 UNRESOLVED 로 둔다. Human 판단 대상.
