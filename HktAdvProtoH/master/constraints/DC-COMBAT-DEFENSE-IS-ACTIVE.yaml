# 원본 근거: design/Design-Combat-OffenseDefense-R0.md 구판(R0) §1.1 · §3.2 · §8
# 2026-08-15 Human 지시로 반영. 수동 피해 감쇄는 이 Constraint 의 금지 대상이 아니다 —
# 그 위에 능동층이 있어야 한다는 요구다.
#
# 2026-08-17 Human 지시(R1 재작성 + C010·C011 롤백)로 **보류(DRAFT)** —
# R1 §8 은 현 단계의 방어를 능력치로 정의하고, 능동 방어(Guard · Perfect Guard · Counter)는
# §14 의 C010/C013 확장 층으로 이연했다. 근거 층이 아직 설계되지 않았으므로 이 Constraint 는
# 지금 Active 가 아니며, 해당 층의 재설계 문서가 나올 때 문안을 재검토하고 재승인한다.
# 문안은 보존한다 — 방향(방어는 수치로 끝나지 않는다)은 R1 §14 C010/C013 과 일치한다.
id: DC-COMBAT-DEFENSE-IS-ACTIVE
type: constraint

statement: >
  방어는 단순 피해 감소 수치로 끝나지 않는다 — 방어가 플레이어가 선택하는 행동으로
  존재하고, 잘한 방어의 성공은 상대의 공격권을 빼앗거나 다음 공격 기회로 이어질 수 있다.
rationale: >
  방어가 수치이기만 하면 전투에 공방 심리전이 생기지 않는다 (§1.1).
  좋은 방어는 피해를 덜 받는 행위로 끝나지 않고 상대의 공격권을 빼앗아
  다음 폭딜 창을 만든다 (§3.2).

scope:
  - COMBAT

requires:
  - defense_as_player_action                      # 방어가 선택 가능한 행동으로 존재한다 (§8)
  - defense_success_creates_offense_opportunity   # 방어 성공이 공격 기회로 전환될 수 있다 (§3.2)
prohibits: []
prefers: []

status: DRAFT             # 2026-08-17 Human 지시 — R1 이연 층(§14 C010/C013) 재설계 시까지 보류
provenance:
  - HUMAN_DESIGN          # 구판 반영 2026-08-15 · R1 에 따른 보류 2026-08-17 — 모두 Human 지시

