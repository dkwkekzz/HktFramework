# 원본 근거: design/Design-Combat-OffenseDefense-R0.md **R1 (2026-08-17 전면 개정)**
#   §1 (CP 는 기본 능력치) · §11 (기본 공격 CP Charge · 고급 공격 CP Cost) ·
#   §16-3 (기본 공격으로 모으고 강한 공격으로 쓰는 루프가 그대로 동작해야 성공)
# 2026-08-15 Human 지시로 구판(R0)에서 최초 반영 → 2026-08-17 Human 지시로 R1 기준 재정합.
# "행동별 전용 게이지 신설 금지" 의 근거는 R1 §14 Aura/Nen 층과 핵심 원칙이다 —
# 새 층의 예시가 새 게이지가 아니라 기존 CP 를 소비하고(공격 집중 CP -5/sec),
# 핵심 원칙이 새 시스템은 기존 값(Attack · Defense · CP · Skill Ratio)을 변화시키는
# 상위 규칙이어야 한다고 못 박는다.
# 2026-08-18 Q12 — 구판(R0) 인용을 제거하고 현행 문서로만 재근거했다.
id: DC-COMBAT-SHARED-BUDGET
type: constraint

statement: >
  전투 행동은 하나의 공통 기력(CP) 예산을 나눠 쓴다.
  행동별 전용 게이지를 신설하지 않는다.
rationale: >
  기본 공격으로 CP 를 모으고 강한 공격으로 CP 를 쓰는 루프가 전투의 바닥이며,
  이 루프가 그대로 동작하는 것이 성공 조건이다 (R1 §11 · §16-3).
  새 층은 새 자원을 만들지 않고 기존 CP 를 쓴다 (R1 §14 Aura/Nen · 핵심 원칙).
  예산이 쪼개지면 각 행동이 자기 게이지 안에서 공짜가 된다.

scope:
  - COMBAT

requires:
  - combat_actions_share_one_budget   # 전투 행동이 한 CP 예산을 나눈다 (R1 §1 · §11)
prohibits:
  - per_action_dedicated_gauge        # 행동별 별도 게이지 신설 (R1 §14 Aura/Nen · 핵심 원칙)
prefers: []

status: APPROVED
provenance:
  - HUMAN_DESIGN          # 구판 반영 2026-08-15 · R1 재정합 2026-08-17 — 모두 Human 지시

relations:
  supports: []
  conflicts_with: []
