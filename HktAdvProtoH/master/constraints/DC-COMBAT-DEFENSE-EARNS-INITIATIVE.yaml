id: DC-COMBAT-DEFENSE-EARNS-INITIATIVE
type: constraint

statement: >
  방어는 피해를 덜 받는 것으로 끝나지 않는다. 잘 된 방어는 공격권을 가져오고,
  버티기만 하는 방어는 자원이 말라 스스로 무너진다.

rationale: >
  방어가 단순 피해 감소 수치이면 플레이어의 선택이 되지 못하고 "얼마나 큰 숫자를 가졌는가" 로
  환원된다. 방어 성공이 다음 공격 기회로 전환될 때에만 공방이 서로를 읽는 심리전이 된다.
  동시에 방어가 무한히 안전하면 교환 자체가 사라지므로, 지속 방어에는 값이 있어야 한다.

scope:
  - COMBAT

requires:
  - defense_is_an_action                # 방어는 상태가 아니라 시작하고 끝나는 행동이다
  - defense_success_transfers_initiative # 성공한 방어는 공격권 전환으로 이어진다
  - sustained_defense_has_cost          # 계속 막는 선택에는 지속되는 대가가 있다

prohibits:
  - defense_as_pure_damage_number       # 방어를 피해 감소 수치만으로 표현하는 것
  - unconditional_invulnerability       # 조건 없이 피해를 무효화하는 방어

prefers:
  - timing_over_magnitude               # 방어의 성패를 크기보다 시점으로 가른다

status: DRAFT
provenance:
  - HUMAN_DESIGN     # Design-Combat-OffenseDefense-R0.md §3.2 · §8 · §11

relations:
  supports:
    - DC-COMBAT-PLAYER-CAUSALITY   # 방어 성공의 원인이 타이밍이면 결과가 설명 가능해진다
  conflicts_with: []
