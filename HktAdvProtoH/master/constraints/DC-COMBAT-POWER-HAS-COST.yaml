# 2026-08-17 Human 지시(R1 재작성)로 **보류(DRAFT)** — 집중(Flow)·제약·서약 층은
# R1 §14 Aura/Nen 층으로 이연되었다. R1 의 해당 층 예시(공격 집중 Attack ×1.3 ·
# Defense ×0.7 · CP -5/sec)가 같은 원리를 예고하므로 문안은 보존하되, 그 층의 재설계
# 문서가 나올 때 재검토하고 재승인한다. 지금 Active 가 아니다.
id: DC-COMBAT-POWER-HAS-COST
type: constraint

statement: >
  더 강한 결과는 공짜가 아니다 — 힘을 한쪽에 집중할수록 다른 쪽이 실제로 비고,
  더 큰 위력은 세계가 참·거짓을 판정할 수 있는 제약과 위험의 수용과 교환되며,
  정의된 실패 사건이 발생하면 그 대가가 즉시 적용된다.
rationale: >
  힘은 집중과 제약에서 나온다 (§3.3 — 한쪽에 집중할수록 다른 쪽이 비며, 더 큰 위험과
  제약을 받아들일수록 더 강한 결과를 얻는다). 제약은 어려운 척하는 설명이 아니라
  실제 위험이어야 한다 (§12 중요). 검증 질문: 강한 스킬이 무료로 강하지 않은가 (§21).

scope:
  - COMBAT

requires:
  - concentration_opens_the_other_side   # 집중은 반대쪽을 실제로 비운다 (§3.3 · §7)
  - power_traded_for_accepted_risk       # 위력은 수용한 위험·제약과 교환된다 (§3.3 · §12)
  - restriction_world_verifiable         # 제약은 세계가 참/거짓을 판정할 수 있는 조건이다 (§12)
  - failure_consequence_applies          # 실패 사건 발생 시 정의된 Consequence 즉시 적용 (§12)
prohibits:
  - text_only_unverifiable_restriction   # 세계가 판정할 수 없는 텍스트 설정만의 제약 (§12)
prefers: []

status: DRAFT             # 2026-08-17 Human 지시 — R1 이연 층(§14 Aura/Nen) 재설계 시까지 보류
provenance:
  - HUMAN_DESIGN          # 구판 반영 2026-08-15 · R1 에 따른 보류 2026-08-17 — 모두 Human 지시

relations:
  supports:
    - DC-COMBAT-PLAYER-CAUSALITY   # 검증 가능한 제약과 정의된 실패 대가는 강한 결과의 원인을 관찰 가능하게 만든다
  conflicts_with: []
