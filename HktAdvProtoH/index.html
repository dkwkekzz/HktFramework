<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HktAdvProtoH — C003 World Server Separation</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #game { position: relative; width: 100%; height: 100%; }
    #game canvas { display: block; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    .hud-panel {
      position: absolute; top: 14px; left: 14px;
      display: flex; align-items: center; gap: 14px;
      background: rgba(28, 34, 46, 0.82); color: #f2f4f8;
      padding: 9px 16px; border-radius: 10px;
      font-size: 17px; font-weight: 700; letter-spacing: 0.2px;
    }
    .hud-item { white-space: nowrap; }
    .hud-flag[data-on="false"] { opacity: 0.45; }
    .hud-bar {
      display: inline-block; vertical-align: middle; margin-left: 8px;
      width: 62px; height: 7px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.22); overflow: hidden;
    }
    .hud-bar i { display: block; height: 100%; background: #7fd4ff; }
    .hud-keys {
      position: absolute; top: 12px; right: 14px;
      color: rgba(40, 48, 60, 0.75); font-size: 12.5px; text-align: right; line-height: 1.7;
      text-shadow: 0 1px 2px rgba(255,255,255,0.35);
    }
    .hud-label {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(20, 22, 28, 0.85); color: #fff;
      padding: 3px 8px; border-radius: 5px; font-size: 13px; font-weight: 700;
      white-space: nowrap;
    }
    .hud-toast {
      position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
      color: #f4c93c; font-size: 21px; font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.35s;
    }
    .hud-hint {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 8px; font-size: 16px; font-weight: 700;
    }
    .hud-hint[data-state="available"] { background: rgba(34, 38, 48, 0.85); color: #fff; }
    .hud-hint[data-state="unavailable"] { background: rgba(66, 66, 74, 0.6); color: #e2e2e8; }
    .hud-hint:empty { display: none; }
    .hud-link {
      position: absolute; top: 62px; left: 14px;
      padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 700;
      background: rgba(120, 60, 40, 0.85); color: #ffe9d8;
    }
    .hud-link[data-state="connecting"] { background: rgba(120, 96, 40, 0.85); }
    .hud-link:empty { display: none; }
    /* 끊긴 동안 보는 세계는 현재가 아닐 수 있다 — 화면 전체로 그 사실을 표시한다 */
    #hud[data-stale="true"] ~ canvas, #game[data-stale="true"] canvas { filter: grayscale(0.55); }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/app/main.ts"></script>
</body>
</html>
