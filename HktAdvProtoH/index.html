<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HktAdvProtoH — C007 Basic Combat Policy</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #game { position: relative; width: 100%; height: 100%; }
    #game canvas { display: block; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    .hud-panel {
      position: absolute; top: 14px; left: 14px;
      display: flex; align-items: center; gap: 14px;
      background: rgba(28, 34, 46, 0.82); color: #f2f4f8;
      padding: 9px 16px; border-radius: 10px;
      font-size: 17px; font-weight: 700; letter-spacing: 0.2px;
    }
    .hud-item { white-space: nowrap; }
    .hud-flag[data-on="false"] { opacity: 0.45; }
    .hud-bar {
      display: inline-block; vertical-align: middle; margin-left: 8px;
      width: 62px; height: 7px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.22); overflow: hidden;
    }
    .hud-bar i { display: block; height: 100%; background: #7fd4ff; }
    .hud-keys {
      position: absolute; top: 12px; right: 14px;
      color: rgba(40, 48, 60, 0.75); font-size: 12.5px; text-align: right; line-height: 1.7;
      text-shadow: 0 1px 2px rgba(255,255,255,0.35);
    }
    .hud-label {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(20, 22, 28, 0.85); color: #fff;
      padding: 3px 8px; border-radius: 5px; font-size: 13px; font-weight: 700;
      white-space: nowrap;
    }
    /* 존재 HUD (C007) — 이름과 생명은 그 몸 위에 늘 붙어 있다.
       속성 관찰(V)을 켜면 그 아래로 나머지 속성이 펼쳐진다. */
    .hud-plate {
      position: absolute; transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      pointer-events: none; white-space: nowrap;
    }
    .hud-plate-name {
      color: #fff; font-size: 12.5px; font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .hud-plate-bar {
      width: 62px; height: 6px; border-radius: 3px;
      background: rgba(10, 12, 16, 0.65); overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
    }
    .hud-plate-bar i { display: block; height: 100%; background: #6fd07f; }
    .hud-plate-hp {
      color: #e8ecf4; font-size: 10.5px; font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .hud-plate-inspect {
      margin-top: 2px; padding: 4px 7px; border-radius: 5px;
      background: rgba(14, 16, 22, 0.78); color: #b9c3d6;
      font-size: 10.5px; line-height: 1.5; font-variant-numeric: tabular-nums;
    }
    /* 쓰러진 존재는 살아 있는 존재와 구분되어야 한다 */
    .hud-plate[data-downed="true"] { opacity: 0.55; }
    .hud-plate[data-downed="true"] .hud-plate-name { color: #ff9d90; }
    .hud-plate[data-downed="true"] .hud-plate-bar i { background: #6b3b3b; }
    /* 타격 결과 (C007) — 맞은 자리에서 떠올랐다 옅어진다 */
    .hud-strike {
      position: absolute; transform: translate(-50%, -100%);
      color: #ffe9a8; font-size: 18px; font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.65);
      pointer-events: none;
    }
    .hud-strike[data-emphasis="true"] { color: #ffd05a; font-size: 26px; }
    /* 자기 정보 (C007) — 내 자원·능력치·배율. 늘 눈앞에 있다. */
    .hud-self {
      position: absolute; left: 14px; bottom: 14px;
      display: flex; flex-direction: column; gap: 4px;
      padding: 10px 13px; border-radius: 10px;
      background: rgba(24, 28, 38, 0.8); color: #e9edf5;
      font-size: 12.5px; font-variant-numeric: tabular-nums; pointer-events: none;
    }
    .hud-self:empty { display: none; }
    .hud-self[data-downed="true"] { background: rgba(70, 26, 24, 0.82); }
    .hud-self-row { display: flex; align-items: center; gap: 8px; }
    .hud-self-row b { width: 22px; color: #97a2b8; font-size: 11px; }
    .hud-self-row em { font-style: normal; font-size: 11.5px; }
    .hud-self-bar {
      width: 132px; height: 9px; border-radius: 5px;
      background: rgba(255,255,255,0.16); overflow: hidden;
    }
    .hud-self-bar i { display: block; height: 100%; }
    .hud-self-bar[data-kind="hp"] i { background: #6fd07f; }
    .hud-self-bar[data-kind="cp"] i { background: #7fb0ff; }
    .hud-self-mode { color: #ffd98a; font-weight: 700; font-size: 11.5px; }
    .hud-self-line { color: #9fa9bd; font-size: 11px; }
    .hud-toast {
      position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
      color: #f4c93c; font-size: 21px; font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.35s;
    }
    .hud-hint {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 8px; font-size: 16px; font-weight: 700;
    }
    .hud-hint[data-state="available"] { background: rgba(34, 38, 48, 0.85); color: #fff; }
    .hud-hint[data-state="unavailable"] { background: rgba(66, 66, 74, 0.6); color: #e2e2e8; }
    .hud-hint:empty { display: none; }
    .hud-link {
      position: absolute; top: 62px; left: 14px;
      padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 700;
      background: rgba(120, 60, 40, 0.85); color: #ffe9d8;
    }
    .hud-link[data-state="connecting"] { background: rgba(120, 96, 40, 0.85); }
    .hud-link:empty { display: none; }
    /* 이어짐 패널 (C005) — 정상일 때도 보인다. 좋을 때의 값을 알아야 나빠진 것을 안다.
       게임 진행을 가리지 않도록 오른쪽 아래에 작게 둔다. */
    .hud-linkpanel {
      position: absolute; right: 12px; bottom: 12px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(18, 20, 26, 0.62); color: #cfd4e0;
      font-size: 11.5px; line-height: 1.5; font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .hud-linkpanel:empty { display: none; }
    .hud-linkpanel[data-state="disconnected"] { background: rgba(70, 26, 20, 0.72); }
    .hud-linkline b { color: #8d94a6; font-weight: 600; margin-right: 6px; }
    .hud-linkline[data-grade="good"] { color: #7fd18f; }
    .hud-linkline[data-grade="warn"] { color: #e8c467; }
    .hud-linkline[data-grade="bad"] { color: #ef8b7a; }
    /* 끊긴 동안 보는 세계는 현재가 아닐 수 있다 — 화면 전체로 그 사실을 표시한다 */
    #hud[data-stale="true"] ~ canvas, #game[data-stale="true"] canvas { filter: grayscale(0.55); }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/app/main.ts"></script>
</body>
</html>
