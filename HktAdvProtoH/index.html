<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HktAdvProtoH — C001 Stone Mining</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #game { position: relative; width: 100%; height: 100%; }
    #game canvas { display: block; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    .hud-panel {
      position: absolute; top: 14px; left: 14px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(28, 34, 46, 0.82); color: #f2f4f8;
      padding: 9px 16px; border-radius: 10px;
      font-size: 17px; font-weight: 700; letter-spacing: 0.2px;
    }
    .hud-icon { font-size: 18px; }
    .hud-keys {
      position: absolute; top: 12px; right: 14px;
      color: rgba(40, 48, 60, 0.75); font-size: 12.5px; text-align: right; line-height: 1.7;
      text-shadow: 0 1px 2px rgba(255,255,255,0.35);
    }
    .hud-label {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(20, 22, 28, 0.85); color: #fff;
      padding: 3px 8px; border-radius: 5px; font-size: 13px; font-weight: 700;
      white-space: nowrap;
    }
    .hud-toast {
      position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
      color: #f4c93c; font-size: 21px; font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.35s;
    }
    .hud-hint {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 8px; font-size: 16px; font-weight: 700;
    }
    .hud-hint[data-state="available"] { background: rgba(34, 38, 48, 0.85); color: #fff; }
    .hud-hint[data-state="unavailable"] { background: rgba(66, 66, 74, 0.6); color: #e2e2e8; }
    .hud-hint:empty { display: none; }

    /* Cycle Scope 배지 — 게임 UI 가 아니라 실행 도구 표시다 */
    #cycle-badge {
      position: absolute; bottom: 12px; left: 14px; z-index: 10;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: rgba(28, 34, 46, 0.7); color: #e8ecf4;
      padding: 6px 10px; border-radius: 8px; font-size: 12.5px;
    }
    #cycle-badge[data-mode="past"] { background: rgba(120, 78, 20, 0.85); color: #fff6e2; }
    #cycle-badge select {
      font: inherit; font-weight: 700; color: inherit;
      background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px; padding: 2px 4px; cursor: pointer;
    }
    #cycle-badge .cycle-note { opacity: 0.9; }
    #cycle-error {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 4px;
      background: #1c222e; color: #f2f4f8; font-size: 15px; text-align: center;
    }
    #cycle-error h1 { font-size: 20px; margin: 0 0 6px; }
    #cycle-error ul { list-style: none; padding: 0; }
    #cycle-error a { color: #7fc4ff; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/app/main.ts"></script>
</body>
</html>
