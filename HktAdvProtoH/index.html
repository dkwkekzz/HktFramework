<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HktAdvProtoH — C001 Stone Mining</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #game { position: relative; width: 100%; height: 100%; }
    #game canvas { display: block; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    .hud-panel {
      position: absolute; top: 12px; left: 12px;
      background: rgba(20, 24, 32, 0.72); color: #f2f4f8;
      padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.6;
    }
    .hud-hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px; font-size: 15px; font-weight: 600;
    }
    .hud-hint[data-state="available"] { background: rgba(46, 125, 50, 0.85); color: #fff; }
    .hud-hint[data-state="unavailable"] { background: rgba(66, 66, 74, 0.85); color: #d8d8de; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/app/main.ts"></script>
</body>
</html>
