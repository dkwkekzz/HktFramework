# 원본 근거: design/Design-Combat-SkillForm-R0.md (SF) §28.5 (시스템보다 조합을
#   우선한다) · §29 (새 Primitive 추가 기준 다섯) · §23 (Delivery 는 다음 Delivery 를
#   낳는다) · §30 (필요한 만큼만 구현하고 검증한 것을 재사용한다) · §34-2·§34-3
id: DC-SKILL-COMBINE-BEFORE-NEW-FORM
type: constraint

statement: >
  새 스킬 요구는 먼저 기존 형태의 조합으로 표현한다. 새 전달 형태는 조합으로도
  파라미터로도 표현할 수 없고, 세계에 다른 생명주기나 판정이 필요할 때만 추가한다.
rationale: >
  ❌ 흔한 실패는 요구가 이름으로 들어오는 것이다 — "폭발하는 파이어볼을 넣자" 를 받으면
  폭발하는 파이어볼이라는 것을 만들게 된다. SF §34-1 은 그 앞에 분해를 세운다:
  발동은 Cast, 지목은 방향, 전달은 투사체 다음 순간 영역, 효과는 피해. 그러면 새로 만들
  것은 "투사체 다음에 영역이 온다" 라는 연결 하나뿐이다 (SF §23).

  ✅ 이 세계는 이미 그 방식으로 커졌다. C019 는 "큰 기술은 선딜이 길다" 를 새 형태로
  만들지 않고, 모든 기술이 공유하던 전역 상수(`SWING_BEGIN`)를 기술 정의가 지닌
  값으로 내리는 것으로 풀었다 — 파라미터 한 칸이 층 하나를 대신했다. C012 는 오라 방식을
  더하면서 값을 하나도 바꾸지 않았다: "값이 다르면 결과 차이가 방식 때문인지 값 때문인지
  갈리지 않는다" 가 그 정의 주석에 남아 있다.

  지켜서 얻는 것은 검증의 재사용이다. 이미 플레이로 닫힌 형태를 다시 쓰면 그 형태의
  실측이 그대로 살아 있다. 어겼을 때 잃는 것은 검증되지 않은 형태가 스킬 수만큼 늘어나는
  것이다 — 각각은 한 번씩만 쓰이므로 어느 것도 충분히 검증되지 않는다.

  가장 안 읽히는 조각은 "파라미터로도 표현할 수 없어야 한다" 다. 조합으로 안 된다는 것은
  비교적 쉽게 보이지만, 크기·부착 대상·틱 간격 같은 값 하나를 더하면 되는 것을 새 형태로
  세우는 실수는 잘 보이지 않는다. 값 한 칸으로 되는 것은 값 한 칸으로 한다.

  경계 — 이것은 새 형태를 금지하지 않는다. 다섯 조건을 모두 만족하면 세우는 것이 맞고,
  그때 무엇을 세울지는 Frontier 와 Cycle 이 정한다. 이 원칙이 요구하는 것은 그 앞에
  분해와 재사용 검토가 있었다는 사실뿐이다.

scope:
  - SKILL

requires:
  - 새 스킬 요구를 형태의 조합으로 먼저 분해한다                       # SF §34-1
  - 새 전달 형태는 기존 조합·파라미터로 표현할 수 없음을 먼저 보인다     # SF §29-1 · §29-2
  - 새 전달 형태는 세계에 다른 생명주기 또는 판정 규칙을 요구한다        # SF §29-3
  - 새 전달 형태는 둘 이상의 스킬에서 재사용되고 관찰 가능한 차이를 만든다 # SF §29-4 · §29-5
prohibits:
  - 하나의 스킬 이름을 위해 전달 형태를 추가하는 것                     # SF §28.5
prefers:
  - 한 Cycle 에 형태 하나                                            # SF §30

status: DRAFT
