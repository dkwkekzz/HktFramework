# 원본 근거: content/proto-adventure/design/Master-Fairy-Growth-System.md (GS) §17 캐릭터간 차이는 능력치가 아니라
#   행동에서 보여야 한다 · §2 · §21-3 · §21-4
id: DC-GROWTH-DIFFERENCE-IS-BEHAVIOR
type: constraint

statement: >
  캐릭터 사이의 차이는 능력치 값의 차이가 아니라 전투에서 반복하는 행동의 차이로
  드러나야 한다.
rationale: >
  ❌ 흔한 형태는 수치표다 — A 는 공격력 120, B 는 100. 그러면 캐릭터 선택은 표를 비교하는
  일이 되고, 실제로 손에 쥐었을 때의 경험은 거의 같다.
  ✅ GS 는 계열마다 반복하는 네 동작을 적는다 — 백왕계는 "맞는다 · 버틴다 · 힘을 모은다 ·
  한 방으로 부순다", 역락계는 "달린다 · 사라진다 · 방향을 바꾼다 · 등 뒤에서 공격한다",
  태양심계는 "빼앗는다 · 저장한다 · 과열 직전까지 버틴다 · 폭발시킨다" (GS §17).
  이 정도로 플레이하는 손맛 자체가 달라야 한다는 것이 이 원칙의 요구다.

  지켜서 얻는 것은 **선택이 값어치를 갖는다**는 것이다. 무엇을 고르든 세지고 약해지는
  것이 아니라 하는 일이 달라지므로, 어느 하나가 수치로 앞서면 나머지가 죽는 구조가 되지
  않는다. 어겼을 때 잃는 것: 최적 캐릭터가 하나 정해지고 나머지는 취향으로 밀려난다.
  이 세계에서 그 손실은 특히 크다 — 플레이어의 역할·방식을 고정하지 않는다는 원칙
  (DC-WORLD-PLAYER-UNFIXED-PATH)이 실제로 참이려면 고를 갈래마다 다른 플레이가 있어야 한다.

  가장 안 읽히는 조각은 **"반복하는 행동"** 이다. 특수기 하나가 다른 것이 아니라, 그 캐릭터가
  전투 내내 되풀이하는 기본 순환이 달라야 한다는 뜻이다 (GS §17 의 네 줄이 그 순환이다).

  경계 — 이것은 능력치를 없애라는 뜻이 아니다. 캐릭터의 정체성을 능력치 차이로 만들지
  말라는 뜻이며, 같은 행동에 능력치가 얹혀 결과가 달라지는 것은 이 원칙이 다루지 않는다.

scope:
  - GROWTH

requires:
  - 형태마다 전투에서 반복하는 기본 순환이 다르다                             # GS §17
  - 그 순환이 그 형태의 원리에서 나온다                                       # GS §1 · §17
prohibits:
  - 같은 행동 순환에 값만 다르게 얹은 캐릭터 구분                             # GS §17
prefers:
  - 한 문장으로 구분되는 능력 판타지를 형태마다 갖는 것                       # GS §2 · §21-1

status: DRAFT
provenance:
