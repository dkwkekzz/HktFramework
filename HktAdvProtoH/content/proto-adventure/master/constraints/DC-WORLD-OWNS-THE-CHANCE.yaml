# 원본 근거: candidates/CC-WORLD-OWNS-THE-CHANCE.md
#   C015 (세계에 우연이 처음 들어온 Cycle — RULE-CRITICAL-STRIKE-001)
# 관찰 1회로 승격했다. 근거는 반복이 아니라 **비가역성**이다 —
# "이미 정해진 일에 우연을 쓰지 않는다"(prohibits 3번)는 두 번째 우연이 들어온 뒤에
# 세우면 그 시점까지의 모든 재현이 깨진다. 2026-08-19 Human 승인.
id: DC-WORLD-OWNS-THE-CHANCE
type: constraint

statement: >
  우연의 원천은 세계가 지니는 상태이고, 그 상태는 관찰에 실리지 않으며, 그럼에도
  결과는 끝까지 설명된다. 이미 결과가 정해진 판정에서는 그 원천을 소비하지 않는다.
rationale: >
  우연은 한 번 허용되면 조용히 번진다 — 회피·조우·산출 편차로. 번지는 자리마다 형태가
  다르면 "같은 조건이면 같은 결과" 라는 이 세계의 성질이 어디까지 살아 있는지 아무도
  말할 수 없게 된다. 원천이 세계 상태이면 같은 뿌리·같은 순서에서 같은 이야기가 나와
  세이브 재생·버그 재현·서버 간 일치가 성립하고, 그것을 관찰에 싣지 않으면 보는 쪽이
  앞날을 미리 계산할 수 없다. 결과가 이미 정해진 판정에서 원천을 소비하지 않는 것은
  편의가 아니라 회귀의 조건이다 — 그래야 새 우연 층이 들어와도 그 층을 쓰지 않는 세계가
  이전과 완전히 같게 남는다 (C015 가 확률 0 인 세계에서 실측했다).

scope:
  - GLOBAL              # 전투에 한정되지 않는다 — 세계에 우연이 들어오는 모든 자리

requires:
  - 우연의 원천이 세계 상태로 존재하고, 같은 뿌리와 같은 순서면 같은 결과가 재생된다
  - 결과의 경위(가능성·발생 여부·크기·적용 전 값)가 관찰 계약에 실린다
prohibits:
  - 우연의 원천 자체를 관찰에 싣는 것 — 실으면 앞날이 읽힌다
  - 경위 없이 결과만 바뀌는 것 — 숨은 주사위
  - 결과가 이미 정해진 판정(확률의 양 끝)에서 원천을 소비하는 것
prefers:
  - 우연을 읽는 규칙이 세계에 한 자리로 유지되는 것 — 여러 규칙이 각자 원천을
    소비하기 시작하면 결정성이 사실상 관측 불가능해진다

# 경계 — 이 Constraint 는 "우연을 어떻게 다루는가"(형태)만 정한다.
# "우연을 어디에 허용하는가"(범위)는 DC-COMBAT-PLAYER-CAUSALITY(REVISED)의 몫이다.
# 둘을 섞으면 범위를 넓히는 판단과 형태를 지키는 판단이 한 문안에 엉킨다.

status: APPROVED
