# 원본 근거: content/proto-adventure/design/Design-Combat-UpperLayer-R0.md **UL**
#   §20 ("Contract 는 Damage Modifier 를 얻기 위한 패널티가 아니라 새로운 Capability 를
#        허용하기 위한 대가다" — 나쁜 예/좋은 예를 문서가 직접 대비시킨다)
#   §21 (Restriction → Capability Permission → Violation Result 세 부분)
#   §41.3 (Contract = Stat Penalty 만 반복 → 능력 다양성을 만들지 못함)
#   §44 Aura/Nen 성공 조건 3 · 4
# 2026-08-26 UL 주입으로 신설 · 같은 날 Human 승인 (전투 상층 DC 7종 일괄).
id: DC-COMBAT-CONTRACT-BUYS-CAPABILITY
type: constraint

statement: >
  스스로 건 제약이 사는 것은 수치가 아니라 새로 허용되는 행동이다. 제약 · 그 대가로
  열리는 것 · 어겼을 때 치르는 것 세 부분이 모두 정의되어야 계약이며, 세계가 그
  성립과 위반을 판정할 수 있어야 한다.
rationale: >
  ❌ 흔한 구현은 계약을 수치 교환으로 만든다 — "HP -20% → 피해 +30%".
  UL 은 이것이 가능하다는 것은 인정하되 그것만으로 이 층을 구성하지 않는다고 적었고
  (§20), 그것만 반복하면 능력 다양성이 만들어지지 않는다고 이유까지 붙였다 (§41.3).

  좋은 형태는 대가가 **행동의 종류**를 연다. "오직 나를 먼저 공격한 대상에게만 쓸 수 있다"
  는 제약이 "그 대상의 이동 능력을 봉인할 수 있다" 를 연다 (§20). 피해 배율은 한 줄도
  움직이지 않았는데 전투가 완전히 달라진다 — 이것이 UL 이 §2 에서 말한 Rule Variation 이다.

  무엇이 달라지나 — 지켰을 때: 계약이 실제 세계 규칙이 된다. 사슬로 묶인 동안 다른
  대상을 공격할 수 없다는 제약은 상대에게 **공략 지점**이 된다 — 다른 적을 앞세워
  위반을 유도하면 사슬이 풀린다 (§21 · §24). 즉 제약이 곧 상대의 대응책이 되어
  강한 능력에 자동으로 약점이 붙는다. 어겼을 때: 계약이 수치 창구로만 쓰이면 최적해가
  하나로 수렴하고(가장 이득이 큰 페널티를 켠다), 상대는 그 계약을 알아도 할 수 있는 것이
  없다 — §39 의 정보 전투가 통째로 죽는다.

  가장 안 읽히는 조각 — "세계가 그 성립과 위반을 판정할 수 있어야 한다". 판정할 수 없는
  선언은 계약이 아니라 문구다. "정정당당하게 싸운다" 는 계약이 될 수 없고 "이 전투 동안
  지정한 대상 외에는 공격하지 않는다" 는 될 수 있다 — 차이는 세계가 그 참·거짓을
  매 순간 계산할 수 있는가다. 이 세계는 이미 그 판정의 실물을 하나 갖고 있다:
  `world/semantic/combat.ts` 의 `isGuardBroken` 은 상태를 적어 두는 대신 시각에서 매번
  다시 계산해 참·거짓을 답한다.

  경계 — 수치를 바꾸는 계약을 금지하지 않는다 (§20 이 "가능은 하지만" 이라고 적었다).
  금지되는 것은 이 층 **전체**가 수치 교환만으로 이루어지는 것이다. 또한 이것은 장비나
  성장의 대가 구조에 대한 규칙이 아니다 — 전투 중 Actor 가 스스로 거는 제약에만 걸린다.

scope:
  - COMBAT

requires:
  - 계약은 제약 · 허용되는 것 · 위반의 대가 셋을 모두 정의한다
  - 세계가 그 제약의 성립과 위반을 매 순간 판정할 수 있다
  - 위반의 대가가 즉시 치러진다
prohibits:
  - 상층 전투의 계약을 오직 수치 페널티 ↔ 수치 보너스 교환으로만 구성하는 것
  - 세계가 참·거짓을 판정할 수 없는 선언을 계약으로 두는 것
prefers:
  - 제약이 그 자체로 상대의 공략 지점이 되는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # UL 주입 2026-08-26 — 같은 날 Human 승인 (7종 일괄)

relations:
  supports:
    - DC-COMBAT-STRONG-RULE-HAS-COUNTERPLAY   # 제약이 곧 상대의 대응 지점이 된다
    - DC-COMBAT-PLAYER-CAUSALITY              # 성립·위반이 관찰 가능한 세계 상태로 판정된다
  conflicts_with: []
