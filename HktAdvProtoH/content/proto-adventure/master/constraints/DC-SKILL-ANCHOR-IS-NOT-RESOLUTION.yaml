# 원본 근거: content/proto-adventure/design/Skill/Skill-System.md (SK) §3 (Target Anchor 와 Target Resolution 은
#   다르다) · §7 (구현에서 금지할 구조 — 단일/범위를 Skill Type 으로 고정하지 않는다) ·
#   §5 (단일 공격 = 기준 + 단일 결정 · 범위 공격 = 공간 결정) · §12 수용 기준 6 · 15 ·
#   핵심 원칙 1~3
# 주입(Inject)으로 세운 뒤 2026-08-21 Human 승인 (HISTORY Q45).
id: DC-SKILL-ANCHOR-IS-NOT-RESOLUTION
type: constraint

statement: >
  어디를 기준으로 쓰는가와 결과적으로 누가 효과를 받는가는 서로 다른 질문이다.
  하나를 다른 하나로 대신하지 않고, 한 명이냐 여럿이냐를 스킬의 종류로 만들지 않는다.
rationale: >
  ❌ 흔한 구현은 지목 하나로 둘을 다 처리하는 것이다 — "이 스킬은 대상을 고른다" 를
  "그러므로 고른 그 하나만 맞는다" 로 읽는다. 그러면 고른 적을 중심으로 주변이 함께
  터지는 스킬을 만들 수 없고, 결국 SingleTarget · AoE 라는 종류를 세워 스킬마다 둘 중
  하나를 고르게 된다 (SK §7 의 금지 예).

  ✅ 지금 세계는 이미 둘을 갈라 놓았다. 고른 것은 있다 — C017 의 `CurrentTarget`
  (`world/semantic/target-selection.ts`)이고, 살펴봄·채집·던지기가 그것을 읽는다
  (`world/rules/observe.ts` · `mine.ts` · `item-use.ts` 의 `selectedEntityId`).
  그런데 휘두름은 그것을 읽지 않는다 — `world/rules/attack.ts` 주석이 그대로 말한다:
  "무엇이 맞는지는 완료 순간이 아니라 접촉이 정한다." 맞는 것을 정하는 것은 칼끝이 쓸고
  지나간 호(`world/semantic/collision.ts`)이지 플레이어가 고른 대상이 아니다. 즉 기준과
  결정은 이 세계에서 이미 다른 자리에 있고, 이 원칙은 그것을 규칙으로 굳힐 뿐이다.

  지켜서 얻는 것은 조합이 곱해진다는 것이다. 기준 네 가지(자기 · 고른 것 · 방향 ·
  세계의 한 자리)와 결정 두 가지(하나 · 공간)를 따로 두면 여덟 가지가 공짜로 생기고,
  그중 "고른 적을 중심으로 주변이 맞는다" 같은 것이 별도 설계 없이 표현된다. 어겼을 때
  잃는 것은 그 곱셈이다 — 종류를 세면 새 조합마다 종류가 하나씩 더 필요해진다.

  가장 안 읽히는 조각은 "근접 공격도 여럿을 칠 수 있다" 다. 기준이 방향 하나여도 닿은
  것이 여럿이면 여럿이 맞는다 — 지금 세계의 호 판정이 이미 그렇게 되어 있다. 여럿이
  맞는 것은 스킬의 종류가 아니라 **결정의 결과**다.

  경계 — 이것은 기준이 결정에 아무 영향도 주지 않는다는 말이 아니다. 기준은 공간 조회의
  출발 자리를 주고, 대상이 없으면 스킬이 시작조차 하지 않게 한다. 금지는 기준이 곧 효과
  대상이라고 **가정**하는 것과, 그 결과 수를 스킬의 종류로 고정하는 것이다.

scope:
  - SKILL

requires:
  - 실행의 기준과 효과 대상의 결정을 따로 정한다                      # SK §3
  - 같은 기준이 다른 결정 방식과 결합할 수 있다                       # SK §3 · §5
  - 여럿이 맞는 것은 결정의 결과로만 생긴다                           # SK §5 · §12-6
prohibits:
  - 한 명이냐 여럿이냐를 스킬 종류로 고정하는 것                       # SK §7 · §12-15
  - 기준으로 고른 것이 곧 효과 대상이라고 가정하는 것                   # SK §3
prefers: []

status: APPROVED
