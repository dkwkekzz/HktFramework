# 원본 근거: design/Master-World-Beira.md (BW)
#   §6 (위험과 보물은 같은 세계압의 서로 다른 결과) · §11 자원의 설계 원칙 (GOOD/BAD) ·
#   §12 (세계압은 가능성을 증가시키지 Loot 를 보장하지 않는다) ·
#   §33 (Resource 설계 시 반드시 묻는 여섯 질문) · §34 절대 피해야 할 Resource 설계
# 2026-08-19 Human 지시(BW 주입)로 신설 — DRAFT, 승인 대기 (open-questions.md Q17).
id: DC-WORLD-RESOURCE-ADAPTATION-TRACE
type: constraint

statement: >
  중요한 베이라 Resource 는 World Pressure → Environment → Survival Pressure →
  Adaptation → Special Property → Resource 의 인과 Trace 로 설명할 수 있어야 하며,
  좋은 아이템을 위험한 곳에 배치하는 방향으로 만들지 않는다.
rationale: >
  위험과 보물이 같은 세계 법칙에서 나와야 자원이 세계의 결과가 된다 (BW §6 · §9).
  "전설의 약초 → 암흑대륙에 배치" 방향은 자원을 세계와 무관한 보상 목록으로 만든다
  (BW §11 · §34). 세계압은 가능성을 늘릴 뿐 Loot 를 보장하지 않으므로
  위험도가 곧 아이템 등급이 되어서도 안 된다 (BW §12 · §34).

scope:
  - WORLD

requires:
  - important_resource_trace_answerable   # BW §33 의 여섯 질문(어디서·왜·무엇이 고정·왜 가치·어떤 Gameplay·어떤 Capability)에 답할 수 있다
prohibits:
  - resource_placed_without_world_cause   # 좋은 자원을 위험 지역에 "배치" 하는 설계 (BW §11 · §34 BAD)
  - grade_scales_with_pressure            # "세계압이 높다 → 아이템 등급이 높다" 직결 (BW §34 BAD)
  - danger_guarantees_loot                # 위험 지역이 가치 있는 Resource 를 보장하는 것 (BW §12)
prefers:
  - 전체 Trace 가 실제 노드로 존재하는 것   # BW §11 은 "가능하면" 이라고 말한다 — 요구가 아니라 방향이다

status: DRAFT
provenance:
  - HUMAN_DESIGN          # 2026-08-19 Human 지시로 BW 주입

relations:
  supports: []
  conflicts_with: []
