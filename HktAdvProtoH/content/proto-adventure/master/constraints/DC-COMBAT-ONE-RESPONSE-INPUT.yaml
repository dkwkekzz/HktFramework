# 원본 근거: content/proto-adventure/design/Design-Combat-UpperLayer-R0.md **UL**
#   §3.1 (전투 중 직접 조작해야 하는 것을 제한한다 — 기본 입력에 Active Response 하나)
#   §4.2 (각 Actor 는 기본적으로 하나의 Active Response Slot 을 가진다 ·
#         "UI에는 모두 동일하게 Response 버튼 하나만 존재할 수 있다")
#   §7 ("Perfect Guard 버튼 / Counter 버튼 / Dodge 버튼 / Parry 버튼 을 각각 만들 필요가 없다")
#   §31 (모바일 입력 원칙 — 하지 않는다 목록) · §41.2 (모든 Active Defense 별도 버튼 → 입력 과부하)
#   §44 Active Defense 성공 조건 1 · 4
# 2026-08-26 UL 주입으로 신설 · 같은 날 Human 승인 (전투 상층 DC 7종 일괄).
id: DC-COMBAT-ONE-RESPONSE-INPUT
type: constraint

statement: >
  공격을 받는 순간의 대응은 입력 하나다. 막기 · 피하기 · 받아넘기기 · 되받아치기를
  각각의 입력으로 늘리지 않고, 그 하나가 무엇이 되는지는 지금 무엇을 끼워 두었는가가 정한다.
rationale: >
  ❌ 흔한 구현은 대응의 종류마다 버튼을 하나씩 더한다 — Guard · Parry · Dodge · Counter
  넷이 서면 손가락이 넷 필요하고, 다섯째 캐릭터가 여섯째 대응을 가지면 또 하나가 는다.
  UL 은 그것을 명시적으로 하지 않을 것으로 적었다 (§31 · §41.2).

  대신 자리를 하나로 고정하고 **그 자리에 무엇이 들어가는가**를 캐릭터가 정하게 한다.
  기사는 그 하나가 막기이고 결투가는 받아넘기기이며 수호자는 가로채기다 (§4.2).
  플레이어의 손은 언제나 같고, 그 손이 무엇을 하는지는 빌드가 답한다 (§31 마지막 줄).

  무엇이 달라지나 — 지켰을 때: 상층 전투가 아무리 깊어져도 모바일 화면의 버튼 수가
  늘지 않는다. 새 대응을 하나 설계하는 일이 "화면에 자리를 어떻게 마련할까" 를
  건드리지 않으므로, 규칙의 다양성과 조작 부담이 분리된다. 어겼을 때: 대응을 하나
  더할 때마다 HUD 와 입력 배치가 함께 흔들리고, 결국 조작 부담이 상한이 되어 캐릭터의
  전투 법칙이 서로 달라질 수 없게 된다 — UL 이 §2 에서 세운 목표(Rule Variation)가
  입력 설계에 막힌다.

  가장 안 읽히는 조각 — "그 하나가 무엇이 되는지는 지금 무엇을 끼워 두었는가가 정한다".
  이것은 UI 를 접어 두라는 말이 아니라, 대응의 **의미**가 입력이 아니라 상태에 있다는 말이다.
  같은 자리를 눌러도 지금 끼운 것이 흡수면 저장이 늘고 관찰이면 상대 능력이 기록된다 (§9).
  세계 쪽에서는 "지금 이 몸의 응답 슬롯에 무엇이 있는가" 가 관찰 가능한 상태여야 한다.

  경계 — 이것은 **공격을 받는 순간의 대응**에 대한 규칙이다. 스킬 슬롯 넷(§3.1)이나
  이동 · 기본 공격을 하나로 합치라는 말이 아니고, 대응의 종류를 줄이라는 말도 아니다.
  종류는 늘어도 좋다 — 늘지 않아야 하는 것은 그것을 부르는 입력의 수다.
  이미 이 세계는 같은 방향을 한 번 골랐다: `view/key-registry.ts` 의 `guard` 는 하나의
  키가 상황에 따라 다른 것을 가리도록(`shadows: 'guard-begin'`) 세워져 있다.

scope:
  - COMBAT

requires:
  - 대응 입력은 Actor 당 하나다 (Active Response Slot)
  - 그 자리에 무엇이 들어 있는지가 세계에서 관찰 가능하다
prohibits:
  - 대응의 종류마다 전용 입력을 신설하는 것
prefers:
  - 같은 입력이 캐릭터에 따라 다른 세계 변화를 만드는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # UL 주입 2026-08-26 — 같은 날 Human 승인 (7종 일괄)

relations:
  supports:
    - DC-COMBAT-SHARED-BUDGET   # 같은 뿌리 — 늘리지 않는다 (게이지 ↔ 입력)
  conflicts_with: []
