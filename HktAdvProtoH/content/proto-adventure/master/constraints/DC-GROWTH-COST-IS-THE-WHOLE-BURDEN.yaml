# 원본 근거: content/proto-adventure/design/Design-Growth-Balance-R0.md (GB) §1 목적 · §3 성장의 비용은 Resource 개수가 아니다 ·
#   §4 Cost Profile · §36 핵심 원칙(첫 문장)
id: DC-GROWTH-COST-IS-THE-WHOLE-BURDEN
type: constraint

statement: >
  성장의 비용은 소비한 자원의 개수가 아니라 그 성장을 얻기까지 치른 전체 플레이 부담이다 —
  시간 · 위험 · 실력 · 앎 · 자원 · 기회 · 반복 가능성이 함께 비용이다.
rationale: >
  ❌ 흔한 형태는 교환비다 — "경계결정 10개 = 공격력 +5". 그러면 성장의 값은 상점의 가격표가
  되고, 같은 물건을 열 개 모으는 두 사람이 서로 다른 일을 겪었다는 사실이 사라진다.
  ✅ GB 는 "경계결정 10개 필요" 만으로는 비용을 알 수 없다고 못박고 (§3), 실제 부담에
  찾는 시간 · 그 지역의 위험 · 채집 난이도 · 필요한 실력 · 필요한 세계 지식 · 선행 능력 ·
  다른 성장에 쓸 기회비용 · 다시 얻을 수 있는가를 함께 센다 (§3 · §4).

  이 세계에서 이것이 특히 참인 이유는 자원이 상품이 아니기 때문이다. 자원은 그 땅이 남긴
  적응이고 (DC-WORLD-RESOURCE-ADAPTATION-TRACE), 그것을 얻는 일은 그 땅을 감당하는 일이다.
  그래서 "몇 개" 는 그 성장을 얻은 사람이 무엇을 겪었는지에 대해 거의 아무것도 말하지 않는다.

  지켜서 얻는 것은 **같은 값의 성장을 서로 다른 방식으로 살 수 있게** 된다는 것이다.
  위험을 치르거나, 시간을 치르거나, 실력을 치르거나 — 무엇으로 치를지가 플레이어의 선택이
  된다. 어겼을 때 잃는 것: 비용이 자원 개수 하나로 환원되면 가장 싸게 자원을 모으는 경로
  하나가 모두의 정답이 되고, 나머지 경로는 존재만 남는다.

  가장 안 읽히는 조각은 **기회비용**이다. 희귀한 것을 이 성장에 쓰면 저 성장을 못 하게
  되는데, 그 못 하게 된 것도 지금 치른 값의 일부라는 뜻이다 (§4.6).

  경계 — 이것은 점수 체계를 강제하지 않는다. 무엇이 비용에 들어가는가까지가 이 원칙이고,
  그것을 몇 점으로 세는지는 각 Cycle 과 검증 도구가 정한다.

scope:
  - GROWTH

requires:
  - 성장의 비용을 자원 외의 부담과 함께 밝힌다                                # GB §3 · §4
  - 같은 성장에 이르는 경로가 여럿이면 각 경로의 부담이 서로 다르게 읽힌다     # GB §3 · §17
prohibits:
  - 성장 비용을 자원 개수 하나로 환산해 정하는 것                             # GB §3 · §15
prefers:
  - 다시 얻을 수 있는가(반복 가능성)를 비용의 항으로 함께 두는 것              # GB §4.7

status: APPROVED
