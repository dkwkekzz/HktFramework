# 원본 근거: candidates/CC-CONDITION-OPENS-WITHOUT-RECORDING.md
#   C016 (통찰이 연 자리를 기록하지 않아 되돌림 규칙이 한 줄도 바뀌지 않았다)
#   C015 는 다른 영역의 같은 종류 — 확률의 양 끝에서 우연의 원천을 소비하지 않는다
# 관찰 1회로 승격했다. 근거는 반복이 아니라 **되돌릴 수 없음**이다 —
# 한 번 기록형으로 만든 뒤 조건형으로 되돌리려면 저장된 데이터의 이전이 따라붙는다.
# 2026-08-19 Human 승인.
id: DC-CONDITION-OPENS-WITHOUT-RECORDING
type: constraint

statement: >
  지금의 조건으로 열리는 것은 어디에도 기록하지 않는다. 조건이 사라지면 저절로 닫혀야
  하고, 그것을 되돌리는 규칙이 따로 있어서는 안 된다.
rationale: >
  상태를 하나 늘릴 때마다 그것을 세우는 규칙과 지우는 규칙과 둘이 어긋났을 때의 규칙이
  따라온다. 조건에서 매번 다시 계산하면 그 셋이 아예 필요 없다 — C016 이 통찰이라는
  두 번째 앎의 경로를 세우면서 되돌림 규칙을 한 줄도 고치지 않은 것이 그 증거다.
  기록하면 "장부에는 열림인데 지금 조건은 닫힘" 이라는 어긋남의 자리가 생기고, 그 어긋남은
  버그가 되기 전까지 보이지 않는다.

scope:
  - GLOBAL              # 세계 상태를 늘릴지 말지의 판단 전반
  # 경계 — "지금 내가 이런 상태라서" 열리는 것에만 적용된다 (통찰·버프·자세·착용 중·
  # 특정 지역 안). "과거에 이런 일이 있어서" 열린 것은 여전히 기록한다 (살펴봄·배운 것·
  # 만난 적 있음). 한 번 안 것을 잊지 않는 앎을 조건에서 재계산하려 들면 세계가 얕아진다.

requires:
  - 지금의 조건으로 열리는 것은 그 조건에서 매번 다시 계산한다
  - 조건이 사라지면 열렸던 것이 별도 규칙 없이 닫힌다
prohibits:
  - 조건이 연 것을 상태로 적어 두고 나중에 지우는 규칙을 따로 두는 것
  - 같은 사실이 조건과 기록 두 곳에 살아 서로 어긋날 수 있게 두는 것
prefers:
  - 되돌림이 규칙이 아니라 부작용의 부재로 성립하는 것

status: APPROVED
provenance:
  - CANDIDATE:CC-CONDITION-OPENS-WITHOUT-RECORDING
  - HUMAN_DESIGN        # 2026-08-19 승인

