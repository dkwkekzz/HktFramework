# 원본 근거: content/proto-adventure/design/Master-World-Beira-Terrain.md (BT)
#   §1 대지형의 정의 · §15.1 매질 · §15.2 지배 원리 · §15.3 대지 순환 · §16 최종 골격
# BW(Master-World-Beira.md)가 세계압과 깊이를 공급하고, BT 는 그 압력이 대륙 규모로
# 무엇에 결속되는가를 공급한다 — 같은 세계(WORLD) 영역의 두 문서다.
id: DC-WORLD-TERRAIN-IS-A-PRINCIPLE
type: constraint

statement: >
  대지형은 기후와 식생으로 구분되는 배경이 아니라, 하나의 World Principle 이 어떤
  매질에 대륙 규모로 결속되어 형성된 자연 시스템이다. 새 대지형은 무엇에 결속되었고
  어떤 상태를 어떤 조건에서 반복적으로 변화시키는가로 정의한다.
rationale: >
  ❌ 흔한 형태는 "숲 · 사막 · 설원" 이다. 기후와 식생으로 땅을 나누고 그 위에 어울리는
  몬스터와 채집물을 얹는다. 그러면 지형은 배경이 되고, 그 땅에서 무슨 일이 일어나는지는
  배치표가 정한다. ✅ BT 는 반대로 간다 — 눈과 비, 더위와 추위는 대지형의 정체성이
  아니라 더 근본적인 법칙이 표면에 드러난 결과다 (BT §1). 빙원이 추운 것은 위도가
  높아서가 아니라 대지가 살아 있는 모든 것으로부터 열을 거두어 가기 때문이다 (BT §5.1).

  지금 세계에는 땅이라는 것이 없다. 장소에 대해 세계가 아는 것은 사각형 하나의 경계뿐이고
  (`content/proto-adventure/world/semantic/position.ts#WorldBounds` — minX·maxX·minZ·maxZ),
  그 안 어디에 서 있든 성질이 같다. 그래서 이 원칙은 지금 무엇을 금지하는 것이 아니라,
  땅이 처음 들어올 때 어느 방향으로 들어올지를 정한다.

  지켜서 얻는 것은 **지형 하나가 그 자체로 탐험거리가 된다**는 것이다. 법칙이 먼저 있으면
  그 법칙에서 위험도 나오고 자원도 나오고 사람이 사는 방식도 나오므로, 플레이어가 그 땅을
  이해하는 과정 자체가 진행이 된다 (BT §16). 어겼을 때 잃는 것: 지형이 배경으로 내려가면
  그 위에 얹을 것이 몬스터 목록과 채집물 목록뿐이고, 지역을 늘리는 일이 목록을 늘리는
  일이 된다.

  가장 안 읽히는 조각은 **"어떤 조건에서 반복적으로 변화시키는가"** 다. World Principle 은
  테마가 아니다 (BT §15.2). "죽음의 땅" 은 원리가 아니라 분위기이고, "혈화수는 죽은 생물의
  상태를 분해하지 않고 꽃 안에 보존한다" 는 원리다 — 뒤엣것만이 조건과 결과를 가지므로
  관찰되고 예측되고 이용될 수 있다.

  경계 — 이것은 대지형이 커야 한다거나 기이해야 한다는 요구가 아니다. 규모와 기이함은
  그 결속의 결과이지 목표가 아니다. 그리고 이것은 자원의 유래를 요구하지 않는다 —
  그쪽은 DC-WORLD-RESOURCE-ADAPTATION-TRACE 가 이미 소유한다.

scope:
  - WORLD

requires:
  - 각 대지형이 어떤 매질에 세계압이 결속되었는지로 정의된다                # BT §15.1
  - 지배 원리가 어떤 상태를 어떤 조건에서 반복 변화시키는지로 적힌다        # BT §15.2
  - 산맥·수계·대기·생태가 그 원리의 반복 결과로 설명된다                    # BT §1 · §15.3
prohibits:
  - 기후·식생으로 구분한 배경을 대지형으로 세우는 것                       # BT §1
  - 조건과 결과가 없는 테마를 지배 원리로 두는 것                          # BT §15.2
  - 난이도 순으로 배치된 지형 목록                                         # BT §16
prefers:
  - 새 대지형이 BT §15 의 열 항(매질 → 다음 탐험)에 답할 수 있는 것        # BT §15

