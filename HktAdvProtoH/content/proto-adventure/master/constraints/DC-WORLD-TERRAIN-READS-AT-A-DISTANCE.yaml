# 원본 근거: content/proto-adventure/design/Master-World-Beira-Terrain.md (BT) §14 만화적 시각 설계 규칙
#   각 지형의 한 장면은 §4.3 · §5.4 · §6.4 · §7.4 · §8.4 · §9.3 · §10.4 · §11.4 의 풍경에서 온다.
id: DC-WORLD-TERRAIN-READS-AT-A-DISTANCE
type: constraint

statement: >
  각 대지형은 멀리서 보았을 때 한 장면만으로 다른 대지형과 구분되어야 한다.
rationale: >
  ❌ 흔한 형태는 지형을 이름과 색으로 구분하는 것이다 — 미니맵의 색, 지역명 표시, 로딩
  화면의 문구. 그러면 어디에 있는지는 UI 가 알려주고 눈앞의 풍경은 아무것도 말하지 않는다.
  ✅ BT 는 지형마다 한 장면을 지정한다 — 하늘을 가르는 흰 갈비뼈와 그 사이에 매달린 성,
  하늘로 흐르는 폭포와 거꾸로 매달린 호수, 수평선 전체가 일어나 걷는 산맥 (BT §14).

  이것이 취향이 아닌 이유는 그 한 장면이 **법칙의 결과**이기 때문이다. 흰 갈비뼈는
  세계압을 결속하던 골격이고 (BT §4.1), 거꾸로 매달린 호수는 방향결속 광맥의 종점이다
  (BT §8.1). 그래서 멀리서 지형을 알아본다는 것은 곧 그 땅의 법칙을 한 눈에 짐작한다는
  뜻이 된다 — 앞선 원칙(DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE)의 가장 먼 거리 판이다.

  지켜서 얻는 것은 **이동 자체가 정보**가 된다는 것이다. 지평선에 무엇이 보이는지로
  다음에 무엇을 만날지 짐작할 수 있으면, 어디로 갈지가 화면의 지명이 아니라 눈으로 정해진다.
  어겼을 때 잃는 것: 지형이 서로 비슷해지면 세계의 넓이는 이동 시간으로만 체감되고,
  그것은 넓은 것이 아니라 먼 것이다.

  가장 안 읽히는 조각은 **"한 장면"** 이다. 특징이 여럿이면 안 된다는 뜻이 아니라, 그중
  하나가 멀리서도 그 지형을 확정할 만큼 커야 한다는 뜻이다.

  경계 — 이것은 미술 지시가 아니다. 무엇을 그릴지가 아니라 그 형상이 그 지형의 법칙에서
  나와야 한다는 것까지가 이 원칙이고, 색·양식·연출은 이 원칙이 정하지 않는다.

scope:
  - WORLD

requires:
  - 대지형마다 멀리서 한 장면으로 읽히는 형상이 있다                        # BT §14
  - 그 형상이 그 지형의 법칙에서 나온다                                     # BT §4.1 · §8.1 · §14
prohibits:
  - 가까이 가야만 다른 대지형과 구분되는 지형                               # BT §14
prefers: []

status: DRAFT
