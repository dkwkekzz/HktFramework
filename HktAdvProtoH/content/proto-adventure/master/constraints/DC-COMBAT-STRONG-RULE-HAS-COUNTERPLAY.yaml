# 원본 근거: content/proto-adventure/design/Design-Combat-UpperLayer-R0.md **UL**
#   §24 ("강한 World Operation 은 최소 하나 이상의 Counterplay 를 가져야 한다" —
#        가장 위험한 것은 "상대 입장에서 아무것도 할 수 없는 능력")
#   §16 · §36 (Ability 정의에 counterplay 칸이 있다) · §41.5 (Counterplay 없는 강제 Rule)
#   §39 (강력한 능력일수록 Condition · Contract · Tell · Counterplay 가 중요하다)
#   §44 Aura/Nen 성공 조건 5
# 2026-08-26 UL 주입으로 신설 · 같은 날 Human 승인 (전투 상층 DC 7종 일괄).
id: DC-COMBAT-STRONG-RULE-HAS-COUNTERPLAY
type: constraint

statement: >
  상대의 행동 가능 범위를 줄이는 능력에는 상대가 알아내고 실행할 수 있는 대응책이
  최소한 하나 있어야 한다. 대응책은 그 능력의 설명에 함께 정의되며, 세계 안에서
  발견 가능해야 한다.
rationale: >
  ❌ 흔한 구현은 강한 능력을 "확정 효과 + 긴 재사용 대기" 로 만든다 — 맞으면 끝이고
  대기 시간이 끝나면 또 맞는다. 걸린 쪽이 할 수 있는 것은 기다리는 것뿐이다.
  UL 은 이것을 상층 전투에서 가장 위험한 것으로 지목한다 (§24 · §41.5).

  대신 강한 조작마다 붙는 것이 대응책이다 — 사슬은 실체가 있어 부술 수 있고, 봉인은
  시전자에게서 멀어지면 풀리며, 저장 중인 상대를 때리면 저장량이 샌다 (§24).
  그래서 능력의 정의 자체에 `counterplay` 칸이 들어간다 (§16 · §36).

  무엇이 달라지나 — 지켰을 때: 강한 능력이 전투를 끝내는 대신 **다음 수를 만든다**.
  묶인 쪽은 사슬을 부술지 시전자를 계약 위반으로 몰지 고를 것이 생기고, 건 쪽은 그
  둘을 막을 자리를 지켜야 한다 — 한쪽의 강함이 양쪽의 선택으로 바뀐다. 어겼을 때:
  이 세계의 결정론(같은 상태·같은 행동이면 같은 결과)이 오히려 독이 된다. 확률로도
  빠져나갈 수 없으므로 대응책 없는 확정 조작은 문자 그대로 아무것도 할 수 없는 시간이 된다.

  가장 안 읽히는 조각 — "세계 안에서 발견 가능해야 한다". 대응책이 있다는 것만으로는
  모자라고, 당한 쪽이 그것을 **알아낼 경로**가 있어야 한다. 처음 당했을 때 이유를 볼 수
  있고 (§35), 관찰을 쌓으면 조건과 계약과 대응책까지 읽히는 (§25) 구조가 그 경로다.
  그래서 이 제약은 관찰 쪽 규칙과 한 몸이다 — 읽을 수 없는 대응책은 없는 것과 같다.

  경계 — 큰 피해에는 이 제약이 걸리지 않는다. 피해는 이미 방어 · 회피 · 위치라는 대응책을
  세계 전체가 공유하고 있기 때문이다. 걸리는 것은 상대가 할 수 있는 일 자체를 줄이는 것 —
  이동 봉인 · 스킬 봉인 · 대상 강제 · 위치 고정 같은 조작이다.
  또한 "약하게 만들라" 는 말이 아니다. 강해도 좋다. 답이 있어야 할 뿐이다.

scope:
  - COMBAT

requires:
  - 상대의 행동 가능 범위를 줄이는 능력은 최소 하나의 대응책을 함께 정의한다
  - 그 대응책이 세계 안에서 발견 가능하다
prohibits:
  - 상대가 이해하거나 대응할 방법이 없는 확정 조작을 두는 것
prefers:
  - 대응책이 그 능력의 조건 · 계약에서 자연히 나오는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # UL 주입 2026-08-26 — 같은 날 Human 승인 (7종 일괄)

relations:
  supports:
    - DC-COMBAT-UNAVAILABLE-HAS-A-REASON   # 대응책은 읽힐 때만 대응책이다
