# 원본 근거: design/Design-Targeting-R0.md (TG)
#   §0 한 문장 설계 · §2.1 관찰자별 관계 · §2.3 선택과 앎의 분리 ·
#   §3.4 R0 판정 원칙 1~6 · §9 결정론과 플레이어 인과 · §10 하지 않을 것 · §14 요약
# 문서가 같은 원칙을 다섯 자리에서 반복해 명시한다 — 삽화가 아니라 설계 원칙이다.
# 주입(Inject)으로 세운 후보이며 Human 승인 전에는 DRAFT 다.
id: DC-TARGET-IS-INTENT-NOT-AIM
type: constraint

statement: >
  대상을 지목하는 것은 플레이어가 지금 누구에게 의도를 두었는지를 세계에 밝히는
  관계일 뿐이다. 지목 자체는 명중·피해·정보·위협을 만들지 않으며, 세계가
  플레이어를 대신해 다가가거나 따라가지 않는다.
rationale: >
  지목이 성공을 보장하기 시작하면 그 순간부터 결과를 만든 것은 플레이어의 접근과
  거리 판단이 아니라 "골랐다" 는 사실이 된다 (TG §0 · §9). 반대로 지목을 의도의
  표명으로만 두면, 플레이어는 "골랐고 다가갔고 시작할 때 그쪽을 향했지만 휘두르는
  동안 상대가 빠져나가 맞지 않았다" 로 결과를 설명할 수 있다 — 지금 세계가 이미
  가지고 있는 공간·접촉 인과가 그대로 보존된다 (TG §3.4 · §9). 지목은 편의이므로
  한 번 계산에 손을 대기 시작하면 되돌리기 어렵다: 자동 추적과 자동 접근이 붙는
  순간 위치는 판단이 아니라 연출이 된다 (TG §10).

scope:
  - GLOBAL              # 전투에 한정되지 않는다 — 살펴봄·채집 등 대상 지정 행동 전반의 성질이다

requires:
  - 지목한 뒤에도 성공 여부는 기존 거리·상태·접촉 판정이 정한다      # TG §3.4-4 · §9
  - 지목이 만드는 실패는 언제나 관찰 가능한 사유로 돌아온다          # TG §7
  - 지목은 관찰자마다 따로 성립하고, 대상은 골라졌다는 이유만으로 달라지지 않는다  # TG §2.1
prohibits:
  - 지목에 따른 피해·명중·치명 보정                                  # TG §3.4-6 · §10
  - 지목한 대상을 향한 자동 이동·자동 사거리 진입·자동 추적          # TG §3.4-2 · §3.4-3 · §10
  - 지목만으로 가려진 정보가 열리는 것                               # TG §2.3
prefers:
  - 행동을 시작하는 순간 한 번 대상 쪽으로 몸을 맞추는 것            # TG §13-2 권장안 — 문서가 결정이 아니라 권장으로 남긴 자리다

# 경계 — 이 Constraint 는 "지목이 무엇을 만들지 않는가" 만 정한다.
# 지목을 어떻게 하고(클릭·순환·해제) 무엇을 고를 수 있는가는 판정의 형태이므로
# Cycle 의 03-world-semantic.md 가 소유한다 (정책 §7.2).

