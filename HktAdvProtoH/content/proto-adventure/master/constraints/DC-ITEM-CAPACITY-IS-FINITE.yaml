# 원본 근거: design/Design-Inventory-Equipment-D1.md (IE)
#   §0 소유 경계 · §3.1 가방 용량 · §6 획득 우선순위 · §10 장착 자리 · §49 P2·P3 · §50
# IS §10 이 "무게 · 칸수 등 소지 제한" 을 범위 밖으로 남기고 후속 문서에 넘긴 영역이다.
id: DC-ITEM-CAPACITY-IS-FINITE
type: constraint

statement: >
  가진 것을 담을 자리도, 몸에 적용할 자리도 유한하다. 적용할 자리는 담을 자리보다
  훨씬 좁고, 그 좁음이 무엇을 들고 나갈지를 선택으로 만든다. 몇 개인가는 Cycle 이
  소유한다.
rationale: >
  ❌ 흔한 형태는 둘이다. 하나는 가방을 무한으로 두고 자리만 제한하는 것이고, 다른
  하나는 반대로 "가방 30칸 · 자리 6개" 를 원칙과 규칙 코드에 박는 것이다. 앞의 것은
  캐는 일을 멈출 이유를 없애고, 뒤의 것은 가방 확장(IE §3.1 의 30 → 48)과 자리
  잠금·해금(IE §40)이 들어오는 순간 스스로를 위반한다. ✅ 유한하다는 성질만 원칙으로
  올리고 값은 Cycle 에 두면 둘 다 사라진다.

  지금 세계에는 한도라는 개념이 아예 없다 — 몸이 지닌 것은 종류별 숫자 하나이고
  (`world/rules/observer-body.ts` 의 `Partial<Record<'stone' | 'pickaxe', number>>`),
  얼마를 지니든 아무 일도 일어나지 않는다. 그래서 지금은 "무엇을 버릴까" 가 판단이
  되지 않는다.

  지켜서 얻는 것은 **선택이 두 번 생긴다**는 것이다. 담을 자리가 유한하면 세계에서
  무엇을 가지고 나올지가 선택이 되고, 적용할 자리가 그보다 훨씬 좁으면 가지고 온 것
  중 무엇을 지금 쓸지가 다시 선택이 된다. 어겼을 때 잃는 것: 두 층 중 하나라도 무한이
  되면 그 층의 선택이 통째로 사라진다 — 다 담고 다니거나 다 걸고 다니면 되기 때문이다.

  가장 안 읽히는 조각은 **"몇 개인가는 Cycle 이 소유한다"** 다. 30 과 6 은 이 원칙의
  내용이 아니라 첫 Cycle 의 제안값이다. 그 값을 원칙으로 올리는 순간 이 Constraint 는
  확장을 금지하는 것이 되어 버리고, 그것은 IE 자신이 예고한 방향과 어긋난다.

  경계 — 이것은 무게나 부피 시스템을 요구하지 않는다. 칸 하나에 같은 것이 몇 개까지
  들어가는지(Stack 한도)도 이 원칙이 아니라 아이템 정의가 소유한다 (IS §5.1).

scope:
  - ITEM

requires:
  - 담을 자리의 수가 유한하고 관찰에 실린다                        # IE §3.1 · §27
  - 적용할 자리의 수가 담을 자리보다 뚜렷하게 적다                 # IE §10 · §49 P3
  - 자리 수를 바꿔도 규칙 코드가 바뀌지 않는다                     # IE §3.1 · §48
prohibits:
  - 특정 칸 수·자리 수를 규칙이나 원칙에 고정하는 것               # IE §49 P2 · §50
  - 소지에 한도가 없는 형태                                        # IE §6
prefers:
  - 한도에 걸렸을 때 왜 받을 수 없는지가 사유로 함께 오는 것       # IE §29

status: APPROVED
provenance:
