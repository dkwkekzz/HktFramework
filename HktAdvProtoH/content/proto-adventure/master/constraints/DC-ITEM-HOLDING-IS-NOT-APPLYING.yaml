# 원본 근거: design/Design-Item-System-R0.md (IS)
#   §5.4 장착 층 (자리 · 장착/해제 · 능력치 변경 · 능력 부여) · §7 P3 · §8 장착 층 완료 기준
# 주입(Inject)으로 세운 뒤 2026-08-20 Human 승인 (HISTORY Q30).
# REVISED — design/Design-Inventory-Equipment-D1.md (IE) §38 이 공급한 **계산 방식**을
#   prefers 로 더했다 (HISTORY Q33). requires/prohibits 는 손대지 않았다 —
#   원본이 "권장한다" 로 썼으므로 금지로 올리지 않는다.
id: DC-ITEM-HOLDING-IS-NOT-APPLYING
type: constraint

statement: >
  아이템을 가지고 있는 것만으로는 몸이 달라지지 않는다. 능력치와 가능한 행동이
  달라지는 것은 지금 적용된 것 때문이며, 적용을 풀면 정확히 원래대로 돌아온다.
rationale: >
  ❌ 가장 쉬운 구현은 소지품을 훑어 능력치를 더하는 것이다. 그러면 "무엇을 들고
  나갈까" 라는 선택이 사라진다 — 다 넣고 다니면 되기 때문이다. ✅ 보유와 적용을
  가르면 그 순간 소지품이 선택지가 되고, 자리 수가 곧 비용이 된다.

  지켜서 얻는 것은 되돌릴 수 있다는 성질이다. 장착으로 생긴 변화는 해제로 정확히
  사라져야 하고, 그 대칭이 무너지면 세계에 값이 새는 구멍이 생긴다 — 끼웠다 뺐다를
  반복해 능력치가 자라는 형태가 대표적이다. 어겼을 때 잃는 것: 지금 이 몸이 왜 이만큼
  강한지를 설명할 수 없게 된다. 기여의 출처가 소지품 전체가 되면 인과가 흐려진다.

  가장 안 읽히는 조각은 "정확히 원래대로" 다. 근사치가 아니라 같은 값이어야 한다는
  뜻이며, 이것이 장착 층 검증의 핵심 관찰이다 (IS §8).

  그 "정확히" 를 무엇으로 담보하는가는 IE §38 이 공급했다. ❌ 장착에 `+5`, 해제에 `-5`
  를 하는 누적 수정은 한 번만 어긋나도 되돌릴 수 없다 — 교체 도중의 중단, 저장된 상태의
  재적용, 같은 것을 두 번 얹는 로드가 모두 그 어긋남을 굳힌다. ✅ 언제나 기본값과 지금
  적용된 것들의 기여로 **다시 계산**하면 어긋날 자리 자체가 없어진다. 다만 원본이 이것을
  "권장한다" 로 썼으므로 prefers 에 둔다 — 같은 결과를 다른 방법으로 담보하는 구현을
  금지하지는 않는다.

  경계 — 소모품을 **쓴 결과**는 이 원칙의 대상이 아니다. 회복이나 지속 효과는
  적용이 아니라 사건의 결과이므로 해제로 되돌아오지 않는 것이 정상이다.

scope:
  - ITEM

requires:
  - 유효 능력치는 기본값과 지금 적용된 것들의 기여로 계산한다        # IS §5.4
  - 장착으로 생긴 변화는 해제로 정확히 원복된다                      # IS §8
  - 장착이 여는 행동 가능성은 해제와 함께 닫힌다                     # IS §5.4
prohibits:
  - 보유하고 있다는 사실만으로 능력치·가능 행동이 달라지는 것        # IS §7 P3
  - 장착과 해제를 반복해 값이 누적되는 형태                          # IS §8
prefers:
  - 유효 값을 기본값과 지금 적용된 것들의 기여로 다시 계산하는 것 —
    장착·해제 시점에 값을 가감하지 않는다                          # IE §38 · §39

