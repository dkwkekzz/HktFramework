# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §26 (숙련의 핵심은 정답 암기가 아니다 — 특정 Boss 에게 Knowledge A 만 끼면 정답이
#        되어서는 안 된다. 하나의 상황에 여러 대응 지식이 존재할 수 있어야 한다)
#   §21 (희귀한 지식은 숫자 상승이 아니라 더 희귀한 상황·Counterplay 를 이해한다)
#   §28 (관련 지식이 없어도 기본 능력으로 버티고 관찰해 새 지식을 발견한다)
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-HAS-NO-SINGLE-ANSWER
type: constraint

statement: >
  한 상황에 통하는 전투 지식이 하나뿐이지 않다. 그 지식이 없으면 그 상대를 상대할 수
  없게 만들지 않는다.
rationale: >
  ❌ 흔한 구현은 보스마다 정답 하나를 둔다. 그러면 준비 플레이가 사라지고 공략을
  찾아보는 일만 남는다 — 고르는 것이 아니라 **맞추는 것**이 되기 때문이다.
  §11 이 세운 Collection → Selection → Build 는 갈래가 여럿일 때만 성립한다.

  §26 은 반사 능력을 가진 적 하나에 대해 대응 다섯을 나란히 적는다 — 접근해서 붙거나,
  반사되는 공격을 안 쓰거나, 반사 자체를 봉인하거나, 반사를 역이용해 다른 대상을
  치거나, 그 상태가 끝날 때까지 기력을 아끼거나. 다섯 다 통하고, 어느 것이 좋은지는
  그 몸이 가진 능력이 정한다 (DC-KNOWLEDGE-RUNS-CAPABILITY-NEVER-CREATES-IT).

  무엇이 달라지나 — 지켰을 때: 같은 적을 여러 방식으로 상대할 수 있으므로 §41 의
  순환("같은 적을 다른 방식으로 상대 → 더 깊은 약점 발견")이 실제로 돈다.
  그리고 지식을 하나 더 설계하는 일이 기존 지식을 낡게 만들지 않는다.
  어겼을 때: 지식 목록이 곧 체크리스트가 되고, 없으면 못 가는 문이 생겨
  §28 이 말한 "예상하지 못한 상황에서 버티며 배운다" 가 성립하지 않는다.

  가장 안 읽히는 조각 — "그 지식이 없으면 상대할 수 없게 만들지 않는다".
  이것은 지식의 효과를 약하게 두라는 말이 아니다. 희귀한 지식은 더 강해도 되며,
  다만 그 강함이 **더 희귀한 상황을 이해하거나 더 복잡한 대응을 여는 형태**여야 한다
  (§21). 없으면 막히는 문이 아니라 있으면 열리는 길이어야 한다.

  경계 — 갈래가 여럿이라는 것은 전부 같은 값이라는 뜻이 아니다. 상황에 더 맞는
  지식이 더 나은 것은 정상이며, 이 규칙이 막는 것은 나머지가 **무의미해지는** 경우다.

scope:
  - COMBAT

requires:
  - 하나의 상황에 통하는 대응 지식이 둘 이상 존재한다
  - 관련 지식이 없어도 기본 능력으로 버티며 배울 여지가 있다
prohibits:
  - 특정 지식 없이는 성립하지 않는 상대·상황을 두는 것
prefers:
  - 희귀한 지식의 값어치를 더 넓은 이해와 대응으로 주는 것

status: DRAFT
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27

