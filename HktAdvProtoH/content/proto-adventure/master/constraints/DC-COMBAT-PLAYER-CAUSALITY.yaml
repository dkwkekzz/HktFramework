# 원본 근거: design/Design-Combat-OffenseDefense-R0.md **R1 (2026-08-17 전면 개정)**
#   §0 설계 방향 · §6 RNG 없음 · §9 (난수를 사용하지 않는다) · §10 INTENT-DAMAGE-CALCULATE-001
# 2026-08-15 Human 지시로 구판(R0)에서 최초 반영 → 2026-08-17 Human 지시로 R1 기준 재정합.
# 교차 근거: design/Design-Combat-DamageType-R0.md §8 (결정론과 플레이어 인과) ·
#   §10 관찰 계약 · §14-5 · §14-9 수용 기준
# R1 은 이 원칙을 단순하게 말한다 — "같은 Attack · 같은 Skill · 같은 Defense 면 항상 같은
# Final Damage" (§6). 관찰·설명 요구는 DT §10 과 §14-9 가 공급한다 — 세계는 선택된
# 능력치와 계산 경위를 관찰에 실어야 한다.
# 2026-08-18 Q12 — 구판(R0) 인용을 제거하고 현행 두 문서로만 재근거했다.
id: DC-COMBAT-PLAYER-CAUSALITY
type: constraint

statement: >
  전투의 중요한 결과는 관찰 가능한 세계 상태와 플레이어의 선택·행동에서 나오며,
  같은 상태·같은 조건·같은 행동이면 언제나 같은 결과가 나온다.
rationale: >
  같은 Attack, 같은 Skill, 같은 Defense 라면 항상 같은 Final Damage 가 나온다 (R1 §6).
  Swing Collider 가 실제로 닿았다면 공격은 성공한다 — 판정에 확률이 없다 (R1 §6).
  관찰 결과만으로 스킬 타입, 선택된 공격·방어 능력치, 최종 피해의 계산 경위를
  설명할 수 있어야 한다 (DT §10 · §14-9).

scope:
  - COMBAT

requires:
  - observable_cause                            # 강한 결과에는 관찰 가능한 원인이 있다
  - explainable_result                          # 결과를 만든 원인과 값을 되짚어 읽을 수 있다 (DT §10 · §14-9)
  - deterministic_resolution_under_same_state   # 같은 상태·조건·행동 → 언제나 같은 결과 (R1 §6 · §9)
prohibits:
  # 넷 모두 R1 이 명시적으로 "만들지 않는다" 고 못 박은 것 (R1 §6 · §13)
  - random_hit          # Miss / Accuracy
  - random_evade        # Dodge
  - random_damage       # Random Damage
  - random_critical     # Critical (R1 §14 Critical 층은 이 금지와 충돌 — open-questions.md Q11)
prefers: []

status: APPROVED
provenance:
  - HUMAN_DESIGN          # 구판 반영 2026-08-15 · R1 재정합 2026-08-17 — 모두 Human 지시

relations:
  supports: []
  conflicts_with: []
