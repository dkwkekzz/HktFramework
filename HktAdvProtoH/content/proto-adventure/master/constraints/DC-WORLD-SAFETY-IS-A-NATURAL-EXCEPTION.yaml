# 원본 근거: content/proto-adventure/design/Master-World-Beira-Terrain.md (BT)
#   §3 안전과 위험의 기준 · §4.2 왜 안전한가 · §5.3 · §6.3 · §7.3 · §8.3 · §10.3 · §11.3 ·
#   §13 대지형 내부의 안전 구조
id: DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION
type: constraint

statement: >
  사람이 머무는 자리가 안전한 것은 위험이 낮게 설정되어서가 아니라, 그 대지형의 법칙이
  안정되거나 다른 성질과 균형을 이루는 자연적 예외가 그 자리에 있기 때문이다. 사람의
  문화와 건축은 그 예외를 확대하는 방식으로 발전한다.
rationale: >
  ❌ 흔한 형태는 안전지대를 규칙으로 두는 것이다 — 마을 안에서는 적이 나오지 않고 피해를
  입지 않는다. 그러면 안전은 세계의 사실이 아니라 시스템의 예외 처리가 되고, 왜 하필
  거기에 마을이 있는지 아무도 답하지 못한다. ✅ BT 는 안전을 세계의 결과로 둔다.
  백왕의 갈비뼈가 주변의 급격한 세계압 변화를 흡수하기 때문에 그 안쪽에서 강과 숲과
  토양이 유지되고, 그래서 사람이 모였다 — 도시가 이곳을 안전하게 만든 것이 아니라
  백왕의 유해가 허용한 안정 위에 도시가 자라났다 (BT §4.2).

  지금 세계에는 안전한 곳과 위험한 곳의 구분이 없다 — 무대가 하나이고
  (`content/proto-adventure/world/semantic/position.ts#WorldBounds`), 그 안 어디서든
  같은 규칙이 돈다. 그래서 이 원칙이 지금 막는 것은 없다. 막는 것은 다음이다: 지역이
  들어올 때 "여기는 안전 구역" 이라는 플래그로 안전을 만드는 길.

  지켜서 얻는 것은 **안전한 자리가 그 자체로 관찰거리가 된다**는 것이다. 해숨구멍
  주변이 따뜻한 이유(포화된 광맥이 열을 분출한다 — BT §5.3)를 이해한 사람은 해숨구멍
  사이를 이어 길을 만들 수 있고, 온모수의 등을 따라가는 것도 같은 이해의 다른 쓰임이 된다.
  어겼을 때 잃는 것: 안전이 플래그가 되면 그 자리를 이해할 것이 없어지고, 예외를 확대해
  살아가는 사람들(얼음굴 마을 · 명목수 마을 · 정박암 절벽 마을)의 방식도 설명을 잃는다.

  가장 안 읽히는 조각은 **"확대"** 다. 사람은 안전을 만들지 못하지만 이미 있는 예외를
  넓힐 수는 있다 — 명목수의 가지에 진명을 묶고 그 주변에 마을을 세우는 것이 그것이다
  (BT §6.3). 이 구분이 없으면 문명은 다시 세계를 이기는 힘이 된다.

  경계 — 이것은 안전지대가 절대 안전해야 한다는 뜻이 아니다. 예외가 사라지거나
  (유랑대지가 방향을 바꾼다 — BT §9.2) 조건이 어긋나면 그 자리도 위험해진다. 그리고
  이것은 위험한 곳을 무조건 위험하게 두라는 요구도 아니다 — 하나의 대지형 안에 안전한
  마을과 극단적으로 위험한 심부가 함께 존재하는 것이 정상이다 (BT §3).

scope:
  - WORLD

requires:
  - 사람이 머무는 자리마다 그 지형의 법칙을 막거나 균형 잡는 자연적 사유가 있다   # BT §3 · §13
  - 정착과 건축이 그 예외를 이용·확대하는 형태로 설명된다                        # BT §13 · §4.2
prohibits:
  - 세계 법칙 밖의 사유로 안전한 자리를 두는 것                                   # BT §3 · §4.2
  - 안전을 지역에 붙은 설정값으로 두는 것                                         # BT §3
prefers:
  - 하나의 대지형 안에 안전한 자리와 극단적으로 위험한 심부가 함께 있는 것        # BT §3
  - 예외가 사라질 수 있는 것 — 조건이 어긋나면 그 자리도 위험해진다              # BT §9.2

status: DRAFT
