# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §12 (Combat Knowledge 가 Actor 에게 존재하지 않는 능력을 만들어내지는 않는다 —
#        「견고한 수호」를 배웠다고 Intercept 없는 Mage 가 Intercept 를 쓰지 못한다)
#   §13 (같은 지식, 다른 캐릭터 — 실행 방식은 캐릭터가 가진 Capability 에서 나온다)
#   §26 (Knowledge 역시 Character Capability 와 조합되어 다른 전략을 만든다)
#   §39-4 · §39-5
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-RUNS-CAPABILITY-NEVER-CREATES-IT
type: constraint

statement: >
  전투 지식은 그 몸이 이미 가진 능력을 더 잘 쓰게 할 뿐, 없는 능력을 만들어내지 않는다.
  같은 지식이라도 실행되는 모습은 그 몸이 가진 능력에서 나온다.
rationale: >
  ❌ 흔한 구현은 지식을 능력 해금으로 쓴다 — 배우면 새 행동이 생긴다. 그러면 지식이
  스킬의 다른 이름이 되고, 지식을 많이 모은 캐릭터가 곧 능력을 많이 가진 캐릭터가 된다.

  CK 는 둘을 끝까지 갈라 둔다. 「위험한 동료를 우선 보호한다」는 하나의 지식이지만
  수호자에게는 접근 → 가로채기 → 막기가 되고, 방벽술사에게는 방벽으로 길을 끊는 것이
  되며, 공간술사에게는 위치 교환이 되고, 묶는 자에게는 표식 후 이동 봉쇄가 된다 (§13).
  지식이 주는 것은 **목적과 판단법**이고 실행은 캐릭터가 한다.

  무엇이 달라지나 — 지켰을 때: 캐릭터의 개성이 지식 수집으로 희석되지 않는다.
  같은 지식을 배운 둘이 여전히 다르게 싸우므로 (§13) 클래스의 의미가 유지되고,
  지식 하나를 설계하는 일이 클래스마다 다른 장면을 한꺼번에 만든다.
  어겼을 때: 지식이 능력을 주기 시작하면 "이 지식이 없으면 못 하는 것" 이 생기고,
  결국 필수 지식 목록이 만들어져 §11 의 선택(Build)이 정답 암기로 무너진다.

  가장 안 읽히는 조각 — "더 잘 쓰게 할 뿐". 이것은 지식이 수치를 올린다는 말이 아니다.
  §15 의 예가 그 차이를 보여 준다 — 「대형 공격 흘려내기」를 배운 몸은 큰 공격에
  그냥 막기를 대는 대신 피해와 자원 손실이 적은 쪽으로 대응을 **운용**한다.
  쓸 수 있는 것의 목록은 그대로이고 무엇을 언제 쓰는가가 달라진다.

  경계 — 클래스 성장이 지식과 능력을 함께 주는 것은 위반이 아니다 (§34).
  그때 능력을 준 것은 클래스 성장이지 지식이 아니다 — 같은 보상 꾸러미에 담겼을 뿐
  둘의 출처가 다르다는 것이 이 규칙이 지키는 것이다.

scope:
  - COMBAT

requires:
  - 지식이 지시하는 운용이 그 몸에 없는 능력이면 그 지시는 성립하지 않는다
  - 같은 지식이 다른 능력을 가진 몸에서 다른 행동으로 나타난다
prohibits:
  - 전투 지식 습득만으로 새 Capability 가 생기게 하는 것
prefers:
  - 지식을 목적과 판단법으로 쓰고 실행은 몸의 능력에 맡기는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27 · 같은 날 Human 승인 (전투 지식 DC 9종 일괄)

relations:
  supports:
    - DC-GROWTH-NO-CAPABILITY-DUPLICATION
    - DC-ITEM-CAPABILITY-COMES-FROM-GRANTS
  conflicts_with: []
