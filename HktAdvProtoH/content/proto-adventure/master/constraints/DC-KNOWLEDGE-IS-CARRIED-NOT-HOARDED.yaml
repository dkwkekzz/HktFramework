# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §10 (Actor 는 제한된 Combat Knowledge Slot 을 가진다 — 전투 전에 준비한다)
#   §11 (모든 지식이 항상 적용되면 많이 모은 플레이어가 아무 선택 없이 우월해진다 —
#        Collection → Selection → Build)
#   §27 (전투 준비 플레이 — 보유 지식이 슬롯보다 많을 때 선택이 실질적 Build 다)
#   §39-8 · §42
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-IS-CARRIED-NOT-HOARDED
type: constraint

statement: >
  획득한 전투 지식이 모두 동시에 작동하지 않는다. 이번 전투에 가져갈 것을 골라야 하고,
  그 선택이 곧 그 캐릭터가 이 싸움에서 무엇인가를 정한다.
rationale: >
  ❌ 흔한 구현은 배운 것을 전부 켜 둔다. 그러면 오래 한 플레이어가 아무 판단 없이
  모든 상황에서 우월해지고, 지식은 수집 목록이 되며, 새 지식을 하나 추가하는 일이
  모두를 조금씩 강하게 만드는 인플레이션이 된다 (§11).

  자리를 제한하면 같은 캐릭터가 준비에 따라 달라진다. §11 의 예에서 같은 수호자가
  공격대용 · 대인전용 · 탐험용으로 전혀 다른 넷을 들고 나가고, §27 은 지역에 들어가기 전
  알려진 위협과 보유 지식을 견주는 것을 **실질적인 Build 선택**이라고 부른다.

  무엇이 달라지나 — 지켰을 때: 전투 전 준비가 의미 있는 플레이가 되고 (§27),
  지식을 더 모으는 일이 강해지는 것이 아니라 **고를 수 있는 폭이 넓어지는 일**이 된다.
  그래서 콘텐츠를 늘려도 밸런스가 위로 밀리지 않는다. 어겼을 때: 지식 총량이 곧 전투력이
  되어 신규 플레이어와의 격차가 되돌릴 수 없이 벌어지고, §26 이 막으려던 "정답 하나"가
  자연히 생긴다 — 전부 켜져 있으면 고를 것이 없으므로.

  가장 안 읽히는 조각 — "그 캐릭터가 이 싸움에서 무엇인가를 정한다". 자리 제한은
  불편을 주려는 장치가 아니라 **정체성을 만드는 장치**다. 무엇을 가져왔는가가 곧
  이번 판의 그 캐릭터이며, 그래서 준비를 잘못한 것도 플레이의 일부가 된다 (§28).

  경계 — 자리의 수는 이 규칙이 정하지 않는다 (§10 의 4 는 예시다). 수치는 그것을
  세우는 Cycle 의 몫이며, 이 규칙이 요구하는 것은 **보유가 곧 적용이 아니다**는 형태뿐이다.
  또한 이것은 자리를 늘리는 성장을 금지하지 않는다 — 늘어도 보유보다 적으면 선택은 남는다.

scope:
  - COMBAT

requires:
  - 보유한 지식과 지금 작동하는 지식이 구분된다
  - 작동하는 자리가 보유량보다 적어 선택이 강제된다
prohibits:
  - 획득한 지식이 전부 자동으로 적용되게 하는 것
prefers:
  - 전투 전 준비를 플레이의 한 단계로 세우는 것

status: DRAFT
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27

