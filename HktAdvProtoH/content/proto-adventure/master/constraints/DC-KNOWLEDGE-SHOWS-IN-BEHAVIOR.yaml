# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §38 (첫 번째 검증 시나리오 — 같은 캐릭터에 지식을 갈아 끼우면 명확하게 다르게 싸운다)
#   §37 (첫 구현 범위 — 네 지식이 각각 Response · Aura · Enemy Counterplay · Ability 를
#        실제로 변화시키는지만 검증한다)
#   §39-6
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-SHOWS-IN-BEHAVIOR
type: constraint

statement: >
  어떤 지식을 가져왔는가가 실제 전투 행동의 차이로 나타난다. 보이지 않는 보정만 주는
  지식은 지식이 아니다.
rationale: >
  ❌ 흔한 구현은 이런 층을 숨은 보정으로 만든다 — 배우면 어떤 값이 조금 좋아진다.
  그러면 플레이어는 자기가 무엇을 바꿨는지 볼 수 없고, 지식을 고르는 일이 수치표를
  읽는 일이 되어 §11 이 만들려던 Build 감각이 사라진다.

  CK 는 이 층의 1차 성공 조건을 아예 검증 시나리오로 못박는다 (§38) — 같은 캐릭터에
  아무 지식도 없을 때, 「견고한 수호」를 끼웠을 때, 「기력 보존」을 끼웠을 때,
  「악마의 날개 파훼법」을 끼웠을 때가 서로 **명확하게 다르게 싸우면** 1차 성공이다.
  플레이어가 규칙을 한 줄도 쓰지 않았는데도 그렇게 되는 것이 이 시스템의 증명이다.

  무엇이 달라지나 — 지켰을 때: 지식을 갈아 끼우는 일이 곧 눈에 보이는 실험이 되어,
  플레이어가 문서를 읽지 않고도 무엇을 가져왔는지 배운다. 그리고 이 층을 만드는
  Cycle 은 자기가 성공했는지를 수치가 아니라 장면으로 판정할 수 있다.
  어겼을 때: 지식이 늘어도 전투가 같아 보이고, 결국 "무엇을 끼든 비슷하다" 가 되어
  준비 플레이(§27)가 형식만 남는다.

  가장 안 읽히는 조각 — "행동의 차이". 피해량이 달라지는 것은 여기서 말하는 차이가
  아니다. §38 의 셋은 각각 **아군 위협에 대한 대응이 달라지는 것** · **기력 소비
  패턴이 달라지는 것** · **반사 능력 앞에서 무엇을 고르는가가 달라지는 것**이며,
  셋 다 무엇을 하는가가 달라지는 것이지 얼마가 들어가는가가 아니다.

  경계 — 모든 지식이 매 순간 눈에 띄어야 한다는 뜻은 아니다. 적용 상황이 오지 않은
  지식은 아무것도 하지 않는 것이 옳다 (§6 의 Applicable Situation). 요구하는 것은
  **그 상황이 왔을 때 차이가 보인다**는 것이다.

scope:
  - COMBAT

requires:
  - 같은 몸이 다른 지식을 지녔을 때 관찰 가능한 행동 차이가 난다
  - 그 차이가 값의 크기가 아니라 무엇을 하는가에서 난다
prohibits:
  - 지식의 효과를 관찰 불가능한 내부 보정으로만 두는 것
prefers:
  - 지식마다 그 차이가 드러나는 장면을 함께 정의하는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27 · 같은 날 Human 승인 (전투 지식 DC 9종 일괄)

relations:
  supports:
    - DC-GROWTH-DIFFERENCE-IS-BEHAVIOR
    - DC-GROWTH-REWARD-IS-NEW-REACH
