# 원본 근거: design/Skill/Skill-System.md (SK) 핵심 원칙 6 (Actor 가 아닌 공간 존재가
#   필요하면 Skill 내부에 임시 개념을 만들지 않고 먼저 World Spatial Presence 를
#   확장한다) · §12 수용 기준 18 ·
#   design/Skill/World-Spatial-Presence.md §1 (왜 먼저 필요한가) · §3 (전투 전용이
#   아니다) · §10 (Observation 경계) · §13 (금지 구조)
# 주입(Inject)으로 세운 뒤 2026-08-21 Human 승인 (HISTORY Q45).
id: DC-SKILL-PRESENCE-IS-WORLD-NOT-SKILL
type: constraint

statement: >
  몸이 아닌 것이 세계의 한 자리를 차지하는 일은 세계의 능력이다. 스킬이 자기 안에
  그런 존재를 임시로 만들지 않는다.
rationale: >
  ❌ 흔한 구현은 필요해진 스킬이 각자 만드는 것이다 — 파이어볼이 "날아가는 것" 을,
  장판이 "남아 있는 것" 을, 함정이 "기다리는 것" 을 각각 세운다. 셋은 사실 같은 것이다:
  세계에 자리를 가지고, 얼마간 존재하다가, 어떤 사건에 사라지는 몸 아닌 존재. 따로 만들면
  같은 의미가 세 벌 생기고 관찰 방식도 셋이 다르다.

  ✅ 지금 세계에는 그런 존재가 **아직 하나도 없다**. C020 의 던지기는 날아가지 않는다 —
  `world/rules/item-use.ts` 의 전달은 사거리를 확인하고 곧바로 피해의 길로 들어간다.
  그래서 이 원칙은 지금 아무것도 금지하지 않는 대신, 처음 필요해질 때 어디에 세울지를
  미리 정해 둔다. 그리고 그 요구는 전투에서만 오지 않는다 — Frontier 의 "물건이 몸 밖에
  놓인다"(누구의 것도 아닌 채 세계의 한 자리에 있는 아이템)가 요구하는 것이 정확히 같은
  자리다. 둘 중 어느 쪽이 먼저 열리든 뒤에 오는 쪽은 그 자리를 다시 쓴다.

  지켜서 얻는 것은 한 번 세운 것이 전부에 쓰인다는 것이다. 투사체 · 장판 · 함정 ·
  떨어진 물건 · 설치물이 같은 생명주기와 같은 관찰 계약을 공유하면, 그중 하나를 고칠 때
  나머지가 함께 고쳐진다. 어겼을 때 잃는 것은 그 공유다 — 스킬이 만든 임시 개념은 스킬
  밖에서 쓸 수 없고, 세계가 나중에 제대로 세우면 둘이 공존하며 어긋난다.

  가장 안 읽히는 조각은 "존재하는 것과 보이는 것은 다르다" 는 부분이다. 그 존재가 무엇이고
  어디 있는지는 세계가 소유하지만, 누가 그것을 볼 수 있는지는 관찰 규칙이 소유한다.
  숨겨 둔 함정은 보이지 않는 채로 실제로 밟힌다 — 화면이 그리지 않았다는 이유로 판정이
  사라지지 않는다.

  경계 — 스스로 판단하고 행동하는 것은 이 자리가 아니라 Actor 다. 소환된 것은 몸 아닌
  존재가 아니라 자기 스킬을 가진 존재이며, 그래서 소환은 전달 형태가 아니라 존재를 하나
  더 세우는 일이다. 또한 이 원칙은 스킬 쪽 설계만 구속한다 — 세계가 다른 이유(몸 밖의
  물건)로 그 자리를 먼저 세우는 것은 이 원칙의 대상이 아니라 그 Cycle 의 몫이다.

scope:
  - SKILL

requires:
  - 몸 아닌 공간 존재는 세계가 소유한다 — 정체 · 자리 · 형태 · 수명       # SK-SP §2
  - 그 자리는 전투 밖 쓰임에도 같은 것을 쓴다                          # SK-SP §3
  - 그 존재의 소멸 사유가 관찰된다                                    # SK-SP §8 · §12
prohibits:
  - 투사체 · 영역 · 함정을 각각 독립한 세계 타입으로 세우는 것            # SK-SP §3 · §13
  - 스킬 안에만 존재하는 임시 공간 존재 개념을 만드는 것                 # SK 핵심 원칙 6
  - 그 존재가 피해량 · 공식 · 관찰 가능성을 소유하는 것                  # SK-SP §2 · §10
