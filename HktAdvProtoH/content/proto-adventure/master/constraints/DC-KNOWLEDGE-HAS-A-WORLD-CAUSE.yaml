# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §8 (UI 메뉴에서 구매하는 추상적인 Perk 가 아니다 — 가능하면 세계 안의 원인을 통해 습득)
#   §9 (발견 → 이해 → 습득 — Encounter → Observation → Fact → Knowledge → Combat Knowledge)
#   §19 (지식 성장은 실제 경험과 연결한다) · §23 (전수) · §24 (Item 으로부터의 획득)
#   §29 (실패 역시 지식의 원천) · §39-3
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-HAS-A-WORLD-CAUSE
type: constraint

statement: >
  전투 지식은 세계 안에서 일어난 일 때문에 생긴다 — 관찰 · 반복 · 실패 · 전수 · 연구 ·
  소속. 메뉴에서 점수로 사는 항목이 되지 않는다.
rationale: >
  ❌ 흔한 구현은 성장 요소를 성장 창의 목록으로 만든다 — 점수가 모이면 항목이 열리고
  누르면 배운다. 그러면 그 항목은 세계와 아무 관계가 없고, 무엇을 배웠는가가 그
  캐릭터가 어디에 다녀왔는지를 말해 주지 않는다.

  CK 는 지식 자체를 세계 콘텐츠의 보상으로 둔다 (§8). 백왕 기사단에서 수련해야
  「견고한 수호」가 생기고, 거대 악마의 공격을 반복 관찰해야 「악마의 날개」라는 사실이
  생기며, 그 사실을 사냥꾼에게 물어야 「악마의 날개 파훼법」이 된다 (§8 · §9).
  실패도 원천이다 — 전멸한 자리에서 "세 번째 포효 뒤에 항상 기력 폭발" 이라는 관찰이
  남는다 (§29).

  무엇이 달라지나 — 지켰을 때: 강한 캐릭터를 보면 그가 무엇을 겪었는지가 읽힌다.
  그리고 교관 · 길드 · 기사단 · 유파가 장식이 아니라 실제 성장 경로가 된다 (§23).
  탐험과 전투가 곧 성장이므로 (§41) 콘텐츠를 하나 만들면 성장 하나가 함께 생긴다.
  어겼을 때: 지식은 캐릭터 시트의 숫자가 되고, 세계는 그 숫자를 벌러 가는 장소로
  줄어든다 — CK 가 §22 에서 세우려던 "조직의 차이를 싸우는 사고방식으로 표현" 이
  설 자리를 잃는다.

  가장 안 읽히는 조각 — "가능하면" (§8 원문). 문서는 모든 지식에 세계 안의 원인을
  **강제**하지 않는다. 그래서 이 규칙도 금지의 자리를 좁게 잡는다 — 막는 것은
  세계와 무관한 점수 구매이고, 요구하는 것은 각 지식이 자기 유래를 지니는 것이다.
  Class 성장으로 얻는 지식(§34)도 세계 안의 원인이다 — 그 형태가 되었다는 사실이 원인이다.

  경계 — 이것은 지식을 사고팔 수 없다는 말이 아니다. 책은 지식을 전달하는 아이템이고
  (§24) 스승은 전수한다 (§23). 사거나 배울 수 있되 **그 거래가 세계 안의 일**이어야
  한다는 것이며, 세계 밖 메뉴에서 점수로 여는 것과 갈리는 지점이 거기다.

scope:
  - COMBAT
  - GLOBAL

requires:
  - 각 전투 지식이 어떻게 얻어지는가를 세계 안의 사건으로 답할 수 있다
  - 실패와 반복 경험이 지식으로 이어지는 길이 있다
prohibits:
  - 세계와 무관한 점수·재화만으로 지식을 여는 것
prefers:
  - 지식의 획득처가 세계의 조직·장소·존재와 묶이는 것

status: DRAFT
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27

