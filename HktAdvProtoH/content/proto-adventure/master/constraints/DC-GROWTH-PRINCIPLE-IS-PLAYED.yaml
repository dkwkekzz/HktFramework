# 원본 근거: content/proto-adventure/design/Master-Fairy-Growth-System.md (GS) §1 캐릭터의 기본 정의 ·
#   §2 요정 디자인의 핵심 · §21 최종 캐릭터 디자인 규칙(마지막 문단)
id: DC-GROWTH-PRINCIPLE-IS-PLAYED
type: constraint

statement: >
  캐릭터가 지닌 세계의 원리는 설정 문구가 아니라 그 캐릭터가 실제로 하는 행동으로
  화면 위에 있어야 한다.
rationale: >
  ❌ 흔한 형태는 원리를 소개문에 두는 것이다 — "Identity 의 원리를 다루는 존재",
  "결속의 힘을 지닌 요정". 그러면 플레이어가 손으로 겪는 것은 평범한 공격 버튼이고,
  원리는 로딩 화면과 도감에만 산다.
  ✅ GS 는 같은 캐릭터를 이렇게 적으라고 요구한다 — "적에게 이름을 새기고, 이름이 새겨진
  적의 움직임을 읽으며, 다른 존재의 모습을 훔쳐 침투하는 가면술사" (GS §2). 원리에서
  전투 방식과 탐험 능력과 외형까지 내려오는 사슬이 있어야 한다는 뜻이다 (GS §1).

  이 세계에서 이것이 취향이 아닌 이유는, 대지형이 이미 같은 방식으로 서 있기 때문이다.
  땅은 하나의 원리가 매질에 결속된 결과이고 (DC-WORLD-TERRAIN-IS-A-PRINCIPLE), 그 법칙은
  설명이 아니라 보이는 증거로 먼저 드러난다 (DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE).
  캐릭터는 같은 현상이 하나의 인격에 집중된 것이므로 (GS §1), 땅에 적용한 기준을 몸에는
  적용하지 않을 이유가 없다.

  지켜서 얻는 것은 **세계관이 읽히지 않아도 전해진다**는 것이다. 문서를 한 줄도 읽지 않은
  플레이어가 주먹으로 낙석을 받아내는 것만으로 그 캐릭터가 무엇에 기대어 서 있는지 안다.
  어겼을 때 잃는 것: 원리는 캐릭터 목록의 분류표가 되고, 실제로 남는 차이는 수치뿐이다.

  가장 안 읽히는 조각은 **"화면 위에"** 다. 능력 설명창에 원리를 적는 것으로는 이 조건을
  채우지 못한다는 뜻이다 — 원리는 행동의 결과(무엇이 부서지고 무엇이 열리는가)로 보여야 한다.

  경계 — 이것은 모든 캐릭터가 화려한 연출을 가져야 한다는 뜻이 아니고, 원리마다 전용
  시스템을 만들라는 뜻도 아니다. 어떤 능력이 왜 그 캐릭터에게 있는지를 원리로 답할 수
  있어야 한다는 것까지가 이 원칙이다.

scope:
  - GROWTH

requires:
  - 캐릭터의 능력이 그 캐릭터의 원리에서 유도된다                             # GS §1
  - 원리가 전투 방식 · 탐험 능력 · 외형 중 하나 이상에서 관찰된다             # GS §1 · §2
prohibits:
  - 원리가 설명 문구에만 존재하고 행동으로 나타나지 않는 캐릭터               # GS §2 · §21
prefers:
  - 한 문장으로 말할 수 있는 능력 판타지 ("엄청나게 힘이 세다")               # GS §21-1

status: DRAFT
provenance:
  - HUMAN_DESIGN        # content/proto-adventure/design/Master-Fairy-Growth-System.md 주입 — Human 승인 대기 (open-questions Q52)

relations:
