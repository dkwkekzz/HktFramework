# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §32 (Knowledge 충돌 — 플레이어가 Rule Priority 를 직접 편집하게 만들지 않는다.
#        각 Knowledge 는 설계된 중요도와 Situation Specificity 를 가진다.
#        Specific Counter Knowledge > General Combat Knowledge)
#   §33 (지식 조합 — 게임이 정의한 의미 있는 조합을 발견하는 방식으로 한다)
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-CONFLICT-IS-DESIGNED
type: constraint

statement: >
  두 지식이 서로 다른 판단을 요구할 때 그 우선순위는 지식 자신이 지닌다 —
  플레이어가 순위를 매기지 않고, 상황에 더 구체적인 쪽이 일반적인 쪽을 이긴다.
rationale: >
  ❌ 흔한 구현은 충돌을 사용자에게 넘긴다 — 규칙 목록에 순서를 매기게 하는 것이다.
  그것은 곧 편집기이며 (DC-KNOWLEDGE-IS-NOT-A-SCRIPT 가 막는 그것), 게다가 순서를
  잘 매기는 일이 새로운 숙련 축이 되어 이 시스템이 피하려던 자리로 돌아간다.

  §32 의 예가 충돌의 실물이다 — 「기력 보존」은 기력 소비를 억제하라 하고
  「악마의 날개 파훼법」은 접근을 위해 기력 이동 기술을 쓰라 한다. 둘 다 옳고,
  지금 상황에서는 후자가 더 구체적이다. 그래서 규칙은 하나다:
  **특정 대상을 겨냥한 지식이 일반적인 운용 지식을 이긴다.**

  무엇이 달라지나 — 지켰을 때: 지식을 여럿 끼우는 것이 예측 가능한 일이 되어
  플레이어가 조합을 실험할 수 있다. 그리고 새 지식을 설계할 때 정해야 할 것이
  "이것은 얼마나 구체적인가" 하나로 줄어 콘텐츠가 늘어도 규칙이 늘지 않는다.
  어겼을 때: 지식을 더 끼울수록 행동이 예측 불가능해지고, 결국 플레이어는 하나만
  끼우게 되어 §11 의 Build 가 죽는다.

  가장 안 읽히는 조각 — "지식 자신이 지닌다". 우선순위가 전역 표에 있는 것이 아니라
  각 지식이 자기 중요도와 적용 상황의 좁음을 지닌다는 뜻이다. 그래야 새 지식을
  하나 더해도 기존 지식들의 순서를 다시 매기지 않아도 된다.

  경계 — §32 는 필요하면 특정 지식끼리 함께 장착할 수 없게 하는 `Conflict` 관계를
  설계적으로 정의할 수 있다고 적는다. 그것도 설계가 정하는 것이며 플레이어가
  푸는 문제가 아니다. 마찬가지로 조합(§33)도 게임이 정의한 것을 **발견**하는 것이지
  플레이어가 엮는 것이 아니다.

scope:
  - COMBAT

requires:
  - 각 지식이 자기 중요도와 적용 상황의 구체성을 지닌다
  - 충돌 시 더 구체적인 지식의 판단이 선다
prohibits:
  - 플레이어가 지식 사이의 우선순위를 편집하게 하는 것
prefers:
  - 함께 설 수 없는 지식은 장착 단계에서 갈라 두는 것

status: DRAFT
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27

