# 원본 근거: content/proto-adventure/design/Design-Combat-UpperLayer-R0.md **UL**
#   §3.2 (능동 방어는 필수가 아니라 선택적 숙련이어야 한다 — "못하면 게임을 할 수 없는
#         시스템이 아니라 잘하면 새로운 가능성이 열리는 시스템")
#   §5 (Response 결과 세 단계 — NONE 은 기존 Damage Pipeline 그대로)
#   §32 (AUTO 는 Normal, MANUAL 은 Precision) · §44 Active Defense 성공 조건 2 · 3
# 2026-08-26 UL 주입으로 신설 — DRAFT.
id: DC-COMBAT-RESPONSE-IS-OPTIONAL-MASTERY
type: constraint

statement: >
  대응하지 않아도 기본 전투는 그대로 성립한다. 능동 방어는 살아남기 위한 요구가 아니라
  잘했을 때 다른 것이 열리는 숙련이며, 일반 공격을 넘기기 위해 정확한 시점을 요구하지 않는다.
rationale: >
  ❌ 흔한 구현은 능동 방어를 세우는 순간 그것을 생존의 전제로 만든다 — 적의 평타조차
  정확히 막지 못하면 녹아내리게 균형을 잡는 식이다. 그러면 상층이 얹힌 것이 아니라
  하층이 무효가 된다. UL 은 기본 생존을 Defense · 장비 · 위치 · 일반 막기가 담당하고
  (§3.2), 능동 방어는 그 **위**라고 못박는다.

  세 단계 중 첫째 칸이 이 원칙의 실물이다 — NONE(대응하지 않았다)은 예외 처리가 아니라
  정상 경로이고, 그대로 기존 피해 파이프라인으로 간다 (§5). 즉 상층은 기본값이
  "아무것도 하지 않음" 이며 그때도 세계가 온전히 굴러간다.

  무엇이 달라지나 — 지켰을 때: 손이 느린 사람도, 지금 다른 것을 보고 있던 사람도
  전투를 계속할 수 있고, 정밀하게 맞춘 사람은 그 대가로 피해 0 과 상대의 노출을 얻는다
  (§6). 숙련이 **차이**를 만들되 **자격**을 만들지 않는다. 어겼을 때: 상층 하나를 얹을
  때마다 감당 가능한 플레이어의 폭이 좁아지고, 결국 MMORPG 의 기본 플레이가 액션 게임의
  숙련 시험이 된다 — 이 세계가 이미 세운 "막기는 켜 두면 되는 자세" (`world/semantic/combat.ts`
  의 `GuardOutcome` · 막힌 타격이 남기는 비율)가 쓸모를 잃는다.

  가장 안 읽히는 조각 — "일반 공격을 넘기기 위해 정확한 시점을 요구하지 않는다".
  이것은 정밀 대응의 보상을 줄이라는 말이 아니다. 오히려 반대로, 보상은 크게 두되
  **그 보상이 없어도 죽지 않게** 수치의 바닥을 잡으라는 요구다. 판정의 어느 쪽을
  건드리는지가 다르다 — 정밀 쪽의 상한이 아니라 무대응 쪽의 하한이다.

  경계 — 특별히 강한 공격(예고된 큰 기술)이 무대응에게 치명적인 것은 이 원칙 위반이
  아니다. 이 원칙이 지키는 것은 **일반 공격**이며, 예고를 읽고 피하는 것이 그 자체로
  하나의 대응이다. 또한 이것은 "자동 전투를 만들라" 는 요구가 아니다 — 지금 세계에
  자동 전투는 없고, UL §32 의 AUTO/MANUAL 구분은 그것이 생길 때의 이야기다.

scope:
  - COMBAT

requires:
  - 대응하지 않은 경우(NONE)가 정상 경로로 기존 피해 계산을 그대로 지난다
  - 기본 생존은 방어 능력치 · 장비 · 위치 · 일반 막기로 성립한다
prohibits:
  - 일반 공격을 감당하기 위해 정밀 대응을 요구하도록 균형을 잡는 것
prefers:
  - 숙련의 보상을 피해 감소가 아니라 새로 열리는 선택지로 주는 것

status: DRAFT
