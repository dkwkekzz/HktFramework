# 원본 근거: content/proto-adventure/design/Design-Fairy-Class-Layer0-R0.md (FC) §2 Origin Class 전투 공통 구조 —
#   "모든 캐릭터는 하나의 Response 입력을 가지며, Class에 따라 같은 Response 버튼이 전혀 다른 행동을 수행한다" ·
#   §3.6 버티기 · §4.6 역보 · §5.6 열방출 · §6.6 판독 · §7.6 기막 · §8.6 역맥 · §9 비교표
id: DC-GROWTH-CLASS-OWNS-THE-RESPONSE
type: constraint

statement: >
  공격에 대응하는 입력은 하나뿐이고, 그 자리에 무엇이 들어 있는가는 그 캐릭터의
  Class 가 정한다. 같은 입력이 Class 마다 전혀 다른 행동이 된다.
rationale: >
  ❌ 흔한 형태는 버튼을 늘리는 것이다 — 막기 버튼, 구르기 버튼, 패링 버튼, 반격 버튼을
  차례로 붙이고 캐릭터가 늘 때마다 하나씩 더 붙인다. 그러면 손가락이 먼저 늘고 캐릭터의
  차이는 그 버튼들의 수치 차이로 쪼그라든다.
  ✅ FC 는 입력을 하나로 고정한 채 **그 하나가 무엇이 되는지를 Class 에 넘긴다**.
  같은 자리에서 골완투사는 왕골봉을 지면에 박아 버티고(버티기), 역락검사는 자신의 낙하
  방향을 옆으로 꺾고(역보), 열술사는 저장한 열을 터뜨려 밀어내고(열방출), 명각사는 그
  공격 자체를 읽고(판독), 숨결술사는 앞에 탄성막을 세우고(기막), 맥동사는 충격을 연결된
  지면으로 흘려보낸다(역맥). 입력은 하나인데 여섯 개의 다른 행동이 나온다 (FC §2 · §9).

  지켜서 얻는 것은 **캐릭터를 갈아타도 손이 다시 배우지 않는다**는 것이다. 배워야 하는
  것은 조작이 아니라 "이 몸은 맞는 순간 무엇을 하는가" 하나이고, 그것이 곧 그 Class 의
  정체다. 어겼을 때 잃는 것: 대응이 Class 와 무관한 공용 행동이 되면 여섯 계열이 전부
  같은 순간에 같은 일을 하게 되어, 계열의 차이가 스킬 목록 안으로만 숨는다.
  반대로 Class 마다 대응 버튼을 따로 주면 계열이 늘 때마다 입력이 늘어 UL 이 자리를
  하나로 고정한 이유가 사라진다 (UL §4.2).

  가장 안 읽히는 조각은 **"Class 가 정한다"** 다. Class 가 대응의 수치를 정한다는 뜻이
  아니라 그 자리에 들어가는 행동 자체를 소유한다는 뜻이다 — 골완투사의 버티기와
  역락검사의 역보는 같은 행동의 강약이 아니라 서로 다른 일이며, 하나는 그 자리에 서서
  받아내고 다른 하나는 그 자리를 떠난다.

  경계 — 이것은 대응을 Class 만 가질 수 있다는 뜻이 아니다. 아이템이나 지식이 그 자리에
  무엇을 얹을 수 있는지는 여기서 정하지 않는다. 정하는 것은 **기본값의 소유**뿐이다.

scope:
  - COMBAT
  - GROWTH

requires:
  - 모든 Class 가 그 자리에 넣을 자기 대응을 하나 정의한다                    # FC §2 · §9
  - 같은 입력이 Class 마다 관찰 가능하게 다른 행동으로 나타난다               # FC §9
prohibits:
  - Class 마다 별도의 대응 입력을 추가하는 것                                 # FC §2
  - 모든 Class 가 같은 대응 행동을 공유하고 수치만 달라지는 것                # FC §9
prefers:
  - 그 대응이 잘 되었을 때 열리는 기회도 Class 고유의 것이 되는 형태          # FC §2 Precision Response

