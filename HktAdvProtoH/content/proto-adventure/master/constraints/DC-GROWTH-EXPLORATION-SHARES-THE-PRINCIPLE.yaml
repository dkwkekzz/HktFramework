# 원본 근거: content/proto-adventure/design/Master-Fairy-Growth-System.md (GS) §8 모든 Class 가 가져야 하는 능력(탐험 절) ·
#   §9~§16 각 계열의 전투/탐험 대응 · §21-5
id: DC-GROWTH-EXPLORATION-SHARES-THE-PRINCIPLE
type: constraint

statement: >
  탐험 능력은 전투와 별개로 주어지는 별도의 기능이 아니라, 같은 원리를 다른 방식으로
  쓰는 것이어야 한다.
rationale: >
  ❌ 흔한 형태는 탐험용 스킬 슬롯이다 — 전투 스킬과 무관한 채집·등반·수영 스킬을 따로
  두고 지형마다 요구 스킬을 건다. 그러면 탐험은 전투 사이에 끼워 넣은 미니게임이 되고,
  캐릭터의 원리는 전투 안에서만 산다.
  ✅ GS 는 같은 능력의 두 얼굴을 요구한다 — 방향을 바꾸는 힘은 전투에서 적의 돌진 방향을
  옆으로 바꾸고, 탐험에서 자신의 낙하 방향을 바꾸어 천장을 걷는다 (GS §8).
  열을 다루는 힘은 전투에서 적의 열을 빼앗고 탐험에서 얼음을 녹이고 열 흔적으로 생물을
  추적한다 (GS §11).

  이 세계에서 이것이 잘 맞는 이유는 땅이 이미 그렇게 서 있기 때문이다. 대지형은 각자
  자기 법칙이 요구하는 대응을 가지며 (MW-TERRAIN-* 의 demands), 그 대응은 전투 능력과
  탐험 능력으로 나뉘어 있지 않다 — 열이 어디로 흐르는지 읽는 것 하나가 살아남는 방법이자
  싸우는 방법이다.

  지켜서 얻는 것은 **캐릭터를 고르는 일이 세계를 고르는 일**이 된다는 것이다. 방향을 다루는
  캐릭터는 하늘로 떨어지는 산맥에서 다른 사람이 못 가는 곳에 가고, 그것이 곧 그 캐릭터의
  전투 방식이다. 어겼을 때 잃는 것: 탐험 능력이 전투와 무관해지면 그것은 열쇠 목록이 되고,
  지형은 그 열쇠를 요구하는 자물쇠가 된다.

  가장 안 읽히는 조각은 **"다른 방식으로"** 다. 같은 버튼을 지형에서도 누르라는 뜻이 아니라,
  두 쓰임이 하나의 원리에서 유도된다는 것이 설명되어야 한다는 뜻이다.

  경계 — 이것은 탐험 전용 행동을 금지하지 않는다. 그 행동이 어느 원리에서 나왔는지 답할 수
  있어야 한다는 것까지가 이 원칙이다.

scope:
  - GROWTH

requires:
  - 각 형태의 탐험 능력이 그 형태의 전투 능력과 같은 원리에서 유도된다        # GS §8
prohibits:
  - 원리와 무관하게 부여되는 탐험 전용 능력                                   # GS §8
prefers:
  - 한 능력이 전투와 탐험에서 서로 다른 결과를 내도록 쓰이는 형태             # GS §8 · §21-5

status: APPROVED
