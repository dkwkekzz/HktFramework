# 원본 근거: design/Design-Inventory-Equipment-D1.md (IE)
#   §13.1 저장소 분리 · §24 · §25 · §41 개체화 · §44 Invariant 2·3 · §49 P4·P9
id: DC-ITEM-LIVES-IN-ONE-PLACE
type: constraint

statement: >
  아이템은 정확히 한 곳에 있다. 저장소가 아이템을 직접 담고, 다른 저장소의 자리를
  가리키지 않는다.
rationale: >
  ❌ 가장 자연스러워 보이는 구현은 적용 자리에 담긴 곳의 번호를 넣는 것이다 —
  `Equipment.E4 = ItemRef(가방 12번 칸)`. 그러면 가방을 정렬하는 순간 12번 칸의
  내용이 바뀌고 적용된 것이 다른 물건을 가리킨다. IE §31 의 정렬은 플레이어가 수시로
  누르는 버튼이므로 이 사고는 예외가 아니라 일상이 된다. ✅ 자리가 물건을 담게 하면
  가방 인덱스가 어떻게 뒤섞여도 적용 상태는 아무 영향이 없다.

  ❌ 두 번째 흔한 형태는 두 곳을 구분하려고 모든 아이템에 식별자를 붙이는 것이다.
  IS §2.1 이 이미 그것을 금지했다 — "출처를 답할 수 없는 식별자는 개체가 아니라 그냥
  번호다". 위치를 구분하겠다고 개체 모델을 앞당기면 아직 필요하지도 않은 것을 세계
  전체에 얹게 된다.

  지켜서 얻는 것은 **불변식이 검사가 아니라 구조에서 나온다**는 점이다. "한 물건이 두
  곳에 동시에 있다" 는 상태를 규칙으로 막는 것이 아니라 애초에 표현할 수 없게 된다.
  어겼을 때 잃는 것: 두 곳이 어긋나는 순간을 저장·복구가 그대로 굳혀 버린다 — 로드
  뒤에 가방에도 있고 몸에도 적용된 물건이 생기고, 그것을 사후에 고칠 방법이 없다.

  가장 안 읽히는 조각은 **"개체 모델이 없어도 성립한다"** 다. 같은 곡괭이 두 자루를
  서로 구분할 필요가 없다는 뜻이다 — 하나는 자리에 있고 하나는 가방에 있으므로,
  위치가 곧 구분이다.

  경계 — 개체(Instance)를 영원히 만들지 말라는 원칙이 아니다. 개체는 위치를 구분하려고
  도입하는 것이 아니라, 같은 종류 사이에 상태 차이(내구도 · 강화 · 귀속)가 필요해질 때
  도입한다 (IS §2.1 · IE §41). 그때에도 이 형태는 그대로 남는다.

scope:
  - ITEM

requires:
  - 저장소가 아이템을 직접 담는다                                          # IE §13.1 · §24 · §25
  - 아이템의 위치가 INVENTORY · EQUIPPED · WORLD · CONTAINER 중 하나로 정해진다  # IE §2 · §44
prohibits:
  - 한 저장소가 다른 저장소의 자리를 가리키는 참조로 적용을 표현하는 것     # IE §13.1
  - 위치를 구분하려고 개체 식별자를 도입하는 것                            # IE §41 · IS §2.1
prefers:
  - 겹칠 수 있는 아이템을 적용 자리에 두지 않는 것 — 자리 하나에 수량 여럿을 만들지 않는다  # IE §13.1

