# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §42 (핵심 원칙 — "Response 숙련은 반사 신경의 향상이 아니라 더 나은 대응법을
#        습득하는 것이다" · "Aura 숙련은 세밀한 게이지 조작이 아니라 더 나은 힘의
#        운용법을 습득하는 것이다" · "손이 빨라진다" 가 아니라 "더 많이 안다")
#   §15 (숙련은 Response 버튼 추가가 아니라 Response를 사용하는 지능의 증가다)
#   §14 (Aura 숙련은 숫자 조작 증가가 아니라 운용법의 종류 증가로 성장한다)
#   §25 (플레이어 숙련의 네 단계 — 어느 단계에도 조작 속도가 없다)
# UL = content/proto-adventure/design/Design-Combat-UpperLayer-R0.md
#   §32 (AUTO → Normal Response 가능) — 같은 곳을 가리키는 UL 쪽 문장이다
# 2026-08-27 CK 주입으로 신설.
id: DC-MASTERY-IS-KNOWING-NOT-REFLEX
type: constraint

statement: >
  전투 숙련은 손이 빨라지는 것이 아니라 더 많이 아는 것이다. 플레이어가 정확한 시점에
  맞춰 누르는 것으로 결과가 갈리는 층을 세우지 않는다.
rationale: >
  ❌ 흔한 구현은 깊이를 조작 정밀도로 만든다 — 좁은 구간에 맞춰 누르면 완벽한 방어,
  어긋나면 반쪽. 그러면 전투의 깊이가 세계에 대한 이해가 아니라 손의 속도에 얹히고,
  MMORPG 의 기본 플레이가 액션 게임의 숙련 시험이 된다.

  CK 는 숙련을 넷으로 다시 정의한다 (§25) — 내 캐릭터가 무엇을 할 수 있는가 ·
  세계와 상대가 어떤 규칙으로 움직이는가 · 그 상황을 상대할 전투법을 아는가 ·
  이번 전투에 무엇을 가져갈 것인가. **넷 중 어느 것도 조작 속도가 아니다.**
  그래서 §42 는 대응 숙련을 "반사 신경의 향상" 이 아니라 "더 나은 대응법을 습득하는
  것" 이라고 못박고, §15 는 그것을 "Response 를 사용하는 지능의 증가" 라고 적는다.

  무엇이 달라지나 — 지켰을 때: 손이 느린 사람과 빠른 사람이 같은 전투를 하고, 차이는
  누가 더 알고 왔는가에서 난다. 그러면 전투의 깊이를 늘리는 일이 곧 세계의 지식을
  늘리는 일이 되어 (§41 의 순환) 전투·탐험·연구·전수가 하나의 성장 구조로 묶인다.
  어겼을 때: 층 하나를 얹을 때마다 감당 가능한 플레이어의 폭이 좁아지고, 자동 전투가
  그 층을 쓸 수 없게 되며 (UL §32 는 NORMAL Response 가 AUTO 로 가능해야 한다고 적는다),
  결국 지식으로 이길 수 있어야 할 상대를 손가락으로 이기게 된다.

  가장 안 읽히는 조각 — "정확한 시점에 맞춰 누르는 것으로 **결과가 갈리는 층**".
  이것은 시간이 전투에서 사라진다는 말이 아니다. 예고를 보고 물러나거나 접근하는 것,
  상대의 자세가 바뀐 뒤에 치는 것은 여전히 시간의 판단이며 이 규칙이 막지 않는다.
  막는 것은 **누른 시각과 판정 시각의 차이가 곧 결과의 차이가 되는 구조**다.
  선을 재는 자리는 UL §32 가 준다 — 그 층을 자동 전투가 수행할 수 있으면 지식이고,
  사람의 손이어야만 되면 반사신경이다.

  경계 — 이것은 캐릭터가 정확한 시점에 대응하지 못하게 하라는 요구가 아니다.
  「대형 공격 흘려내기」를 배운 몸은 큰 공격을 정확히 흘려낸다 (§15). 다만 그 정확함은
  **배운 지식의 몫이지 플레이어 손의 몫이 아니다.** 실행의 주체가 바뀌는 것이지
  정교함이 사라지는 것이 아니다.

scope:
  - COMBAT
  - GLOBAL

requires:
  - 전투 숙련의 차이가 아는 것과 준비한 것에서 나온다
  - 어떤 대응 층이든 자동 전투가 그 기본 형태를 수행할 수 있다 (UL §32)
prohibits:
  - 플레이어가 누른 시각과 판정 시각의 차이로 결과가 갈리는 층을 세우는 것
  - 조작 속도·정밀도를 성장이나 보상의 축으로 삼는 것
prefers:
  - 정교한 대응을 배운 지식이 수행하게 하는 것

status: DRAFT
provenance:
