# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §42 (핵심 원칙 — "Response 숙련은 반사 신경의 향상이 아니라 더 나은 대응법을
#        습득하는 것이다" · "Aura 숙련은 세밀한 게이지 조작이 아니라 더 나은 힘의
#        운용법을 습득하는 것이다" · "손이 빨라진다" 가 아니라 "더 많이 안다")
#   §15 (숙련은 Response 버튼 추가가 아니라 Response를 사용하는 지능의 증가다)
#   §14 (Aura 숙련은 숫자 조작 증가가 아니라 운용법의 종류 증가로 성장한다)
#   §25 (플레이어 숙련의 네 단계 — 어느 단계에도 조작 속도가 없다)
# UL = content/proto-adventure/design/Design-Combat-UpperLayer-R0.md
#   §4.1 · §4.2 · §5 · §9 · §31 · §32 · §44 — **Response 층의 형태는 UL 이 소유한다**
#
# 2026-08-27 CK 주입으로 신설 · 같은 날 Q63(Human)으로 개정.
# Q63 개정의 요지: 처음 판에서 이 Constraint 는 "누른 시각과 판정 시각의 차이로 결과가
# 갈리는 층" 자체를 금지했다. 그것은 UL §5(NONE · NORMAL · PRECISION)와 §32(MANUAL →
# Precision Response 가능)를 정면으로 무효화하는 것이고, 원본보다 세게 쓴 것이었다
# (master-inject.md MUST NOT). Human 이 "충돌되는 부분은 UL 과 자율 행동 기획을
# 전적으로 따른다" 고 정했으므로, 이 Constraint 는 **무엇을 세우지 말라**에서
# **숙련의 축을 어디에 두라**로 좁힌다.
id: DC-MASTERY-IS-KNOWING-NOT-REFLEX
type: constraint

statement: >
  전투 숙련의 축은 조작 속도가 아니라 아는 것과 준비한 것이다. Response 층의 정교함은
  캐릭터가 배운 것이 수행하며, 그것을 플레이어의 손이 대신해야만 성립하게 만들지 않는다.
rationale: >
  ❌ 흔한 구현은 깊이를 조작 정밀도로 만든다 — 좁은 구간에 맞춰 누르면 완벽한 방어,
  어긋나면 반쪽. 그러면 전투의 깊이가 세계에 대한 이해가 아니라 손의 속도에 얹히고,
  MMORPG 의 기본 플레이가 액션 게임의 숙련 시험이 된다.

  CK 는 숙련을 넷으로 다시 정의한다 (§25) — 내 캐릭터가 무엇을 할 수 있는가 ·
  세계와 상대가 어떤 규칙으로 움직이는가 · 그 상황을 상대할 전투법을 아는가 ·
  이번 전투에 무엇을 가져갈 것인가. **넷 중 어느 것도 조작 속도가 아니다.**
  그래서 §42 는 대응 숙련을 "반사 신경의 향상" 이 아니라 "더 나은 대응법을 습득하는
  것" 이라고 못박고, §15 는 그것을 "Response 를 사용하는 지능의 증가" 라고 적는다.

  **이 규칙이 무효로 만들지 않는 것을 먼저 적는다.** UL 이 세운 Response 층은 그대로다 —
  대응 자리 하나(§4.2) · 세 단계(NONE · NORMAL · PRECISION, §5) · 정밀 막기가 곧
  완벽한 막기라는 정의(§6) · 좋은 대응이 기회를 낳는 것(§7) · 자동 전투가 NORMAL 을
  하고 사람이 PRECISION 을 여는 것(§32). 그 층의 **형태는 UL 이 소유한다** —
  이 Constraint 는 그 위에서 **숙련의 축이 어디에 있는가**만 정한다 (Q63).

  무엇이 달라지나 — 지켰을 때: 손이 느린 사람도 배워 온 것으로 같은 층을 쓸 수 있다.
  그러면 전투의 깊이를 늘리는 일이 곧 세계의 지식을 늘리는 일이 되어 (§41 의 순환)
  전투·탐험·연구·전수가 하나의 성장 구조로 묶인다. 어겼을 때: 층 하나를 얹을 때마다
  감당 가능한 플레이어의 폭이 좁아지고, 결국 지식으로 이길 수 있어야 할 상대를
  손가락으로 이기게 된다 — 그러면 CK 라는 문서 전체가 설 자리를 잃는다.

  가장 안 읽히는 조각 — "플레이어의 손이 대신해야만 성립하게". 정밀 대응이 존재하는
  것과, 정밀 대응이 **오직 사람의 손으로만** 열리는 것은 다르다. 앞의 것은 UL 이
  세운 것이고 뒤의 것이 이 규칙이 막는 것이다. 선을 재는 자리도 UL 이 준다 (§32) —
  그 층의 기본 형태를 자동 전투가 수행할 수 있으면 이 규칙을 지킨 것이다.

  경계 — 이것은 캐릭터가 정확한 시점에 대응하지 못하게 하라는 요구가 아니다.
  「대형 공격 흘려내기」를 배운 몸은 큰 공격을 정확히 흘려낸다 (CK §15). 정교함이
  사라지는 것이 아니라 **실행의 주체가 배운 것 쪽으로 옮겨 간다.**
  그리고 사람이 직접 누르는 것을 금지하지도 않는다 (UL §32 의 MANUAL) —
  다만 그것이 **유일한 길**이면 안 된다.

scope:
  - COMBAT
  - GLOBAL

requires:
  - 전투 숙련의 차이가 아는 것과 준비한 것에서 난다
  - 어떤 대응 층이든 그 기본 형태를 자동 전투 또는 배운 지식이 수행할 수 있다 (UL §32)
prohibits:
  - 플레이어의 입력 정밀도로만 열리는 층을 두는 것 — 배운 것으로는 닿을 수 없는 자리
  - 조작 속도·정밀도 자체를 성장이나 보상의 축으로 삼는 것
prefers:
  - 정교한 대응을 배운 지식이 수행하게 하는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27 · 같은 날 Human 승인 (전투 지식 DC 9종 일괄)

