# 원본 근거: content/proto-adventure/design/Master-World-Beira-Terrain.md (BT)
#   §2 기묘하지만 일관된 법칙 · 각 절의 "관찰 가능한 풍경" 표(§4.3 · §5.4 · §6.4 · §7.4 ·
#   §8.4 · §9.3 · §10.4 · §11.4) · §15.8 관찰 · §15.9 행동
id: DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE
type: constraint

statement: >
  대지형의 법칙은 설명 없이 볼 수 있는 증거로 먼저 드러나고, 관찰할수록 반복되는 조건과
  결과가 드러난다. 그 증거를 이해한 사람에게 열리는 행동은 하나가 아니다.
rationale: >
  ❌ 흔한 형태는 법칙을 글로 알리는 것이다 — 지역 설명문, 퀘스트 로그, 툴팁이 "이곳에서는
  주기적으로 냉기 피해를 입습니다" 라고 적는다. 그러면 관찰이라는 행위가 사라지고 남는
  것은 읽었는가뿐이다. ✅ BT 는 법칙마다 눈으로 보이는 증거를 먼저 둔다 — 얼음 아래에서
  타오르는 검은 빛, 원형으로 퍼지는 서리 무늬, 살아 있는 모습 그대로 얼어붙은 거수
  (BT §5.4). 아무도 설명하지 않아도 세 번째 것을 본 사람은 첫 번째 것을 피하게 된다.

  이 세계에는 그 형태의 선례가 이미 있다. 살펴보기 전에는 상대의 겨루는 힘을 모르고
  (`content/proto-adventure/world/semantic/acquaintance.ts` — 항목이 없는 관찰자는
  아무것도 모른다), 계산의 경위는 결과와 함께 관찰에 실린다. 이 원칙은 그 형태를 존재에서
  **땅**으로 넓힌 것이다.

  지켜서 얻는 것은 **같은 증거에서 서로 다른 대응이 나온다**는 것이다. 열이 어디로
  빠져나가는지를 읽은 사람은 피할 수도, 따라갈 수도, 분출을 기다릴 수도, 그 열을 자기
  쪽으로 돌릴 수도 있다 (BT §15.9 의 열한 가지 행동). 어겼을 때 잃는 것: 이해의 결과가
  정해진 하나의 대응이면 그 지형은 정답이 있는 퍼즐이 되고, 두 번째 방문부터는 아무것도
  관찰할 필요가 없어진다.

  가장 안 읽히는 조각은 **"관찰할수록"** 이다. 한 번 보고 아는 것이 아니라 반복해서 볼수록
  조건과 결과가 드러난다는 뜻이다 (BT §2). 처음에는 이해할 수 없어야 하고, 그 이해할 수
  없음이 부당하게 느껴지지 않을 만큼 증거가 일관되어야 한다.

  경계 — 이것은 모든 정보를 감추라는 요구가 아니다. 감추는 것은 법칙이지 지금 보이는
  풍경이 아니다. 그리고 이것은 관찰 계약이 무엇을 실어야 하는지를 정하지 않는다 —
  그쪽은 DC-WORLD-OWNS-THE-SURFACE-LIST 와 각 Cycle 의 GameView Spec 소유다.

scope:
  - WORLD

requires:
  - 각 법칙마다 설명 없이 볼 수 있는 증거가 세계에 있다                     # BT §15.8
  - 반복 관찰로 조건과 결과가 드러난다                                      # BT §2
  - 증거를 이해한 뒤 열리는 행동이 하나가 아니다                            # BT §15.9
prohibits:
  - 증거 없이 설명문만으로 성립하는 법칙                                    # BT §15.8
  - 이해의 결과가 정해진 하나의 대응뿐인 것                                 # BT §15.9
prefers:
  - 위험을 만든 법칙과 자원을 만든 법칙이 같은 증거로 읽히는 것             # BT §2 · §12

status: DRAFT
