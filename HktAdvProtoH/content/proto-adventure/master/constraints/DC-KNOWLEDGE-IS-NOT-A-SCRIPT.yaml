# 원본 근거: content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md **CK**
#   §1 (IF/THEN 을 플레이어가 구성하게 하면 전투 시스템이 스크립트 편집기가 된다)
#   §2 (하나의 완성된 객체로 존재한다 · 내부 판단은 시스템이 소유한다)
#   §6 (내부 구조를 Rule Editor 형태로 공개하지 않는다 — 의미 중심으로 표시한다)
#   §30 (UI 원칙 — 내부 Rule Script 를 노출하지 않는다)
#   §32 (Rule Priority 를 직접 편집하게 만들지 않는다) · §39-1 · §39-2 · §42
# 2026-08-27 CK 주입으로 신설.
id: DC-KNOWLEDGE-IS-NOT-A-SCRIPT
type: constraint

statement: >
  플레이어는 전투 판단 규칙을 쓰거나 고치지 않는다. 전투 지식은 내부를 열 수 없는
  하나의 완성된 판단법으로 존재하고, 플레이어가 다루는 것은 그것을 고르는 일뿐이다.
rationale: >
  ❌ 흔한 구현은 깊이를 원하면 편집기를 준다 — 조건과 행동을 플레이어가 엮게 하는
  것이다. CK §1 은 그것이 어디로 가는지 먼저 적는다: 조건 몇 줄을 엮게 하는 순간
  전투 시스템이 사실상 스크립트 편집기가 되고, 게임을 잘하는 일이 규칙을 잘 짜는 일이 된다.

  반대쪽 실패도 §1 이 함께 적는다 — 모든 판단을 캐릭터에게 기본으로 주면 처음부터
  모든 상황에 최적으로 대응하게 되어 플레이어가 배울 영역이 사라진다.
  전투 지식은 그 둘 사이의 중간 계층이며, **완성된 채로 획득된다**는 것이 그 성립 조건이다.

  무엇이 달라지나 — 지켰을 때: 플레이어가 보는 것은 「견고한 수호」라는 이름 하나와
  그것이 무엇을 하는지의 설명이고 (§30), 고민은 "조건을 어떻게 짤까" 가 아니라
  "이번 상대에게 무엇을 가져갈까" 가 된다. 지식을 만드는 일은 콘텐츠 제작으로 남아
  세계가 그것을 문화·조직·전수로 표현할 수 있다 (§22 · §23). 어겼을 때: 최적 스크립트가
  하나로 수렴하고 그것이 공유되는 순간 모든 플레이어의 전투가 같아진다 — 지식의
  다양성이 만들려던 차이가 편집의 정답 하나로 무너진다.

  가장 안 읽히는 조각 — "내부를 열 수 없는". 이것은 내부가 없어도 된다는 말이 아니다.
  §6 은 전투 지식이 내부적으로 적용 상황 · 해석 · 선호 의도 · 각종 운용 지침 · 종료
  조건을 갖는다고 적고, §31 은 그 내부 판단이 **관찰 가능해야** 한다고 요구한다.
  숨기는 것은 편집 권한이지 정보가 아니다 — 무엇을 왜 했는지는 보이되, 그것을 고쳐
  쓰는 손잡이는 주지 않는다.

  경계 — 지식끼리 부딪칠 때의 우선순위도 플레이어가 정하지 않는다 (§32).
  그것은 각 지식이 지닌 설계된 중요도와 상황 구체성이 정한다
  (DC-KNOWLEDGE-CONFLICT-IS-DESIGNED).

scope:
  - COMBAT

requires:
  - 전투 지식이 획득 시점에 이미 완성된 하나의 객체다
  - 플레이어에게 보이는 것은 그 지식이 무엇을 하는가의 의미다
prohibits:
  - 플레이어가 판단 조건·행동·우선순위를 작성하거나 편집하게 하는 것
  - 내부 규칙을 편집 가능한 형태로 노출하는 것
prefers:
  - 지식을 아이템·스킬 장착과 같은 형태로 다루게 하는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # CK 주입 2026-08-27 · 같은 날 Human 승인 (전투 지식 DC 9종 일괄)

