# 원본 근거: content/proto-adventure/design/Design-Combat-UpperLayer-R0.md **UL**
#   §3.3 (Aura 는 실시간 수치 조절 UI 가 아니다 — 플레이어는 의미 있는 상태만 선택한다)
#   §14 (Aura Profile — 미리 만들고 전투 중에는 바꾸기만 한다)
#   §30 (전투 HUD 에는 현재 Profile 하나) · §41.1 (실시간 Aura Slider → 조작 부담)
#   §44 Aura/Nen 성공 조건 1
# 2026-08-26 UL 주입으로 신설 · 같은 날 Human 승인 (전투 상층 DC 7종 일괄).
id: DC-COMBAT-AURA-IS-A-PROFILE-NOT-A-DIAL
type: constraint

statement: >
  힘의 배분은 전투 중에 수치를 조절하는 일이 아니라 미리 만들어 둔 상태 하나를 고르는
  일이다. 내부의 배분이 아무리 복잡해도 전투 중 입력은 "지금 어느 상태인가" 한 번이다.
rationale: >
  ❌ 흔한 구현은 배분을 슬라이더로 준다 — 오른팔 73%, 몸 17%, 시야 10% 처럼.
  설정으로는 깊지만 전투 중에 그것을 만지는 사람은 없고, 만져야 최적인 게임은
  만지지 않는 사람을 벌한다. UL 은 이 형태를 이름 붙여 금지한다 (§41.1).

  대신 배분은 **프로필**이라는 이름 붙은 상태로 굳는다 — 균형 · 강화 · 발현 · 사냥꾼
  같은 것들이고 (§14), 전투 중 플레이어가 하는 일은 그중 하나를 고르는 것뿐이다.
  복잡성은 사라지지 않고 규칙 안으로 들어간다.

  무엇이 달라지나 — 지켰을 때: 배분이 관찰 가능한 **하나의 값**이 되므로 상대도 그것을
  읽을 수 있고 (§40 — 프로필에 따라 다른 겉모습), 읽히니까 대응이 생긴다 (§28 축적자를
  프로필에 묶어 두고 강한 공격을 피하는 수) — 즉 이 제약이 오히려 상층의 심리전을
  가능하게 한다. 어겼을 때: 배분이 연속값이면 상태를 요약할 수 없고, 요약할 수 없으면
  상대가 읽을 것이 없어져 §39 의 "내가 아는 상대의 규칙" 자체가 성립하지 않는다.

  가장 안 읽히는 조각 — "내부의 배분이 아무리 복잡해도". 이것은 내부를 단순하게 만들라는
  말이 **아니다.** BODY / ABILITY / AWARENESS 세 축이 각각 무엇을 여닫는지는 얼마든지
  복잡해도 좋고 (§15 — 배분은 수치뿐 아니라 지금 쓸 수 있는 능력 자체를 가른다),
  제약되는 것은 오직 **플레이어가 전투 중에 하는 입력의 수**다.

  경계 — 전투 밖에서 프로필을 만들고 다듬는 화면은 이 제약이 막지 않는다. 이것은 준비의
  깊이가 아니라 실행 중의 조작 부담에 관한 규칙이다. 또한 "프로필은 셋뿐" 같은 개수
  제한도 아니다 — 몇 개든 좋고, 고르는 것이 한 번이면 된다.

scope:
  - COMBAT

requires:
  - 배분은 이름 붙은 상태(Profile)로 미리 정의된다
  - 전투 중 배분을 바꾸는 입력은 그 상태를 고르는 하나다
  - 지금의 배분이 관찰 가능한 하나의 값으로 드러난다
prohibits:
  - 전투 중 연속 수치(비율 · 슬라이더)로 힘을 배분하게 하는 것
prefers:
  - 배분이 수치뿐 아니라 지금 쓸 수 있는 능력의 목록을 바꾸는 것

status: APPROVED
provenance:
  - HUMAN_DESIGN        # UL 주입 2026-08-26 — 같은 날 Human 승인 (7종 일괄)

relations:
