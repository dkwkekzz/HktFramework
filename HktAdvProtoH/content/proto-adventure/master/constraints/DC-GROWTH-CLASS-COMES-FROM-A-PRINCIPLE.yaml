# 원본 근거: content/proto-adventure/design/Design-Fairy-Class-Layer0-R0.md (FC) §11 이후 Layer 의 생성 규칙 —
#   "새 Class 이름을 먼저 만들고 능력을 끼워 맞추지 않는다" 와 그 아래의 생성 순서 ·
#   §1 Layer 방식(기초 Principle + 새로운 Principle → 새 Class)
id: DC-GROWTH-CLASS-COMES-FROM-A-PRINCIPLE
type: constraint

statement: >
  새 Class 는 이름에서 시작하지 않는다. 먼저 새 Principle 이 있고, 거기서 새 Rule 과
  새 행동, 전투 방식의 변화, 탐험 방식의 변화, 외형의 변화가 차례로 나온 뒤에야
  그것이 Class 다.
rationale: >
  ❌ 흔한 형태는 이름이 먼저다 — "룬나이트" 를 정해 놓고 룬처럼 들리는 능력을 끼워
  맞춘다. 그러면 능력들 사이에 서로를 요구하는 이유가 없어 목록이 되고, 그 목록은
  숫자로만 자란다.
  ✅ FC 는 순서를 못박는다 — 새 Principle → 새로운 Rule → 새로운 행동 → 전투 방식 변화 →
  탐험 방식 변화 → 외형 변화 → Class (FC §11). Layer 0 의 여섯이 그 순서로 만들어졌다:
  결속이라는 원리가 있어서 받아낸 충격이 쌓이고(왕골격), 쌓였기 때문에 대형 대상을
  밀 수 있고, 그래서 정면에서 버티는 실루엣과 백색 골격의 연출이 나온다 (FC §3).

  지켜서 얻는 것은 **한 Class 의 모든 조각이 하나의 이유를 공유한다**는 것이다.
  골완투사의 버티기와 밀기와 부수기는 각각 고른 기술이 아니라 결속이라는 원리가
  전투에서 취하는 세 가지 모습이며, 그래서 새 상황에서도 "이 캐릭터라면 무엇을 할까" 에
  답할 수 있다. 어겼을 때 잃는 것: 원리 없이 이름으로 묶인 Class 는 확장할 때마다
  기획자가 매번 새로 고민해야 하고, 결국 "강한 기술" 을 더하는 것 외에 자랄 방법이 없다.

  가장 안 읽히는 조각은 **"새 Principle"** 이 무엇이냐다. 세계에 이미 있는 원리
  (결속 · 방향 · 축적 · 정체성 · 대기 · 공명) 중 하나가 기존 원리에 결합되는 것이지,
  이 Class 를 위해 만들어 낸 설정이 아니다 (FC §1). 그래서 상위 Layer 를 세우는 일은
  세계에 어떤 원리가 있는가를 먼저 묻는 일이 된다.

  경계 — 이것은 이름을 나중에 짓는다는 뜻이 아니다. 이 프로젝트에서 Class Line 의
  이름은 이미 성장 기획 문서가 소유한다 (HISTORY Q55(b)). 이 원칙이 금지하는 것은
  **이름을 근거로 능력을 정하는 일**이지 이름이 먼저 존재하는 일이 아니다.

scope:
  - GROWTH

requires:
  - 모든 Class 가 자기 Principle 을 하나 밝힌다                               # FC §1 · §3.1
  - 그 Class 의 전투 · 탐험 · 외형이 그 Principle 에서 나온 것으로 읽힌다     # FC §11
prohibits:
  - 이름이나 역할군을 먼저 정하고 능력을 채워 넣는 방식                       # FC §11
prefers:
  - 하나의 Principle 결합이 여러 갈래를 낳을 수 있는 형태                     # FC §1 분기

status: DRAFT
provenance:
