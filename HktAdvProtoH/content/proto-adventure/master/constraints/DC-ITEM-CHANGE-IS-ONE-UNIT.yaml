# 원본 근거: design/Design-Item-System-R0.md (IS)
#   §5.5 사용과 소모의 한 단위 · 원자적 제작 · §5.6 줍기 · 버리기 · 동시 획득 · §7 P4
# 주입(Inject)으로 세웠다 — Human 승인 대기.
id: DC-ITEM-CHANGE-IS-ONE-UNIT
type: constraint

statement: >
  아이템이 관련된 변화는 하나의 성공 단위다. 효과와 수량은 함께 변하거나 함께
  변하지 않으며, 실패한 시도는 세계에 아무 흔적도 남기지 않는다.
rationale: >
  ❌ 순서대로 처리하는 구현은 반쪽 상태를 만든다 — 수량을 먼저 줄이고 효과 적용이
  실패하면 아이템만 사라지고, 반대로 하면 효과만 얻고 아이템은 남는다. 제작에서는
  재료 일부만 사라진 상태가 되고, 줍기에서는 둘이 동시에 집어 같은 것이 둘이 된다.
  ✅ 검증 → 결과 계산 → 반영을 하나의 단위로 묶으면 이 셋이 모두 사라진다.

  지켜서 얻는 것: 실패한 시도의 값이 0 이라는 것이 보장되어, 플레이어가 "된 것인가
  안 된 것인가" 를 묻지 않아도 된다. 어겼을 때 잃는 것은 신뢰다 — 자원이 새는 세계는
  한 번만 새도 그 뒤로 모든 수량을 의심하게 만든다.

  가장 안 읽히는 조각은 "흔적도 남기지 않는다" 다. 실패해도 쿨다운은 돌거나 시간은
  흘렀다는 식의 부분 반영이 여기 걸린다. 소모되지 않았다면 제한도 걸리지 않아야 한다.

  경계 — 이것은 원자성의 요구이지 성공률의 요구가 아니다. 제작이 실패할 수 있는
  세계인가는 이 원칙이 정하지 않는다. 다만 실패하기로 했다면 그 실패가 반쪽이 아니어야
  한다는 것만 정한다.

scope:
  - ITEM

requires:
  - 수량 검증이 변경보다 먼저 일어난다                               # IS §5.5
  - 효과 적용과 수량 변경이 하나의 성공 단위로 처리된다              # IS §5.5
  - 세계와 몸 사이의 이동에서 양쪽이 하나의 단위로 바뀐다            # IS §5.6
prohibits:
  - 효과만 발생하거나 수량만 변하는 반쪽 성공                        # IS §7 P4
  - 실패한 시도가 수량·제한·상태에 부분 반영되는 것                  # IS §5.5
  - 같은 아이템이 두 곳에 동시에 존재하게 되는 이전                  # IS §5.6
prefers: []

