# 원본 근거: content/proto-adventure/design/Master-Fairy-Growth-System.md (GS) §5 Class Mastery ·
#   §19 성장 원천 표(Class Mastery · Skill Mastery · Exploration Mastery 행)
id: DC-GROWTH-MASTERY-FROM-OWN-BEHAVIOR
type: constraint

statement: >
  숙련은 무엇을 얼마나 반복했는가가 아니라 그 형태 고유의 행동을 수행했는가에서 오르며,
  같은 상황에서도 캐릭터마다 오르는 행동이 다르다.
rationale: >
  ❌ 흔한 형태는 처치 수다 — 같은 몬스터를 백 번 잡으면 누구든 같은 만큼 자란다. 그러면
  캐릭터의 차이는 자라는 속도의 차이로만 남고, 무엇을 하며 자랐는지는 아무 데도 기록되지
  않는다.
  ✅ GS 는 괴력 캐릭터와 속도 캐릭터의 숙련이 서로 다른 행동에서 오른다고 적는다 —
  앞쪽은 강한 적과 힘겨루기 · 공격을 정면으로 받아내기 · 거대한 구조물 파괴에서, 뒤쪽은
  연속 이동 성공 · 공격 직전 위치 변경 · 투사체 방향 변경에서 오른다 (GS §5).
  그래서 같은 몬스터를 반복해 잡아도 캐릭터마다 성장하는 행동이 다르다 (GS §5 마지막 문장).

  지켜서 얻는 것은 **성장이 그 캐릭터를 연습시킨다**는 것이다. 잘 자라려면 그 형태가
  잘하는 일을 실제로 해야 하므로, 숙련이 오르는 동안 플레이어의 손도 같은 방향으로 자란다.
  어겼을 때 잃는 것: 가장 빨리 도는 사냥터 하나가 모든 캐릭터의 정답이 되고, 캐릭터 선택은
  외형 선택으로 축소된다.

  가장 안 읽히는 조각은 **"고유의 행동"** 이다. 스킬을 몇 번 눌렀는가가 아니라 그 형태가
  세계에 대해 하는 일(버텨 냈다 · 방향을 바꿨다 · 열을 빼앗았다)이 기준이라는 뜻이다.
  그래서 이 조건은 전투 안에만 있지 않다 — 환경 문제를 그 원리로 푼 것도 같은 자리에서 센다
  (GS §19 Exploration Mastery).

  경계 — 이것은 반복을 금지하지 않는다. 반복이 성장의 유일한 축이 되는 것을 막을 뿐이며,
  얼마나 올라가는가의 값은 이 원칙이 정하지 않는다.

scope:
  - GROWTH

requires:
  - 숙련이 오르는 조건이 형태(Class)마다 다르다                               # GS §5
  - 그 조건이 그 형태의 원리에서 나온 행동이다                                # GS §5 · §19
prohibits:
  - 모든 형태에 동일하게 적용되는 처치 수·시간 누적만의 숙련                  # GS §5
prefers:
  - 전투와 탐험 양쪽에서 같은 원리의 행동을 세는 것                           # GS §8 · §19

status: DRAFT
