# 원본 근거: content/proto-adventure/design/Design-Combat-UpperLayer-R0.md **UL**
#   §3.4 (강력한 능력에는 읽을 수 있는 이유가 존재해야 한다 — "왜 봉인되었는가?")
#   §33 (관찰 가능한 Combat State — ability.available · ability.unavailableReason)
#   §34 (Combat Event) · §35 (설명 가능한 전투 결과 — WHY 를 따라 올라간다)
#   §44 Aura/Nen 성공 조건 6
# 2026-08-26 UL 주입으로 신설 — DRAFT.
id: DC-COMBAT-UNAVAILABLE-HAS-A-REASON
type: constraint

statement: >
  일어난 일뿐 아니라 **일어나지 않은 일**도 세계가 사유를 답한다. 능력을 쓸 수 없거나
  행동이 막힌 상태는 그 원인이 되는 세계 상태를 함께 드러내며, 상층이 만든 상태
  (계약 · 표식 · 관계 · 기회 · 관찰한 것)는 전부 관찰 가능하다.
rationale: >
  ❌ 흔한 구현은 못 쓰는 능력을 회색으로 칠하고 끝낸다. 왜 회색인지는 문서를 뒤지거나
  실험해서 알아내야 한다. 상층이 얹히면 그 회색의 이유가 폭발적으로 늘어난다 —
  계약을 위반해서, 표식이 없어서, 배분이 모자라서, 관찰한 적이 없어서. UL 은 그래서
  결과에는 반드시 원인이 존재해야 한다고 적고 (§3.4), 관찰 대상 목록을 직접 나열한다 (§33).

  이 세계는 이미 그 방향을 골랐다 — `view/skill-presentation.ts` 의 `unavailableReason` 은
  "못 쓰는 사유 코드 — 세계가 고른 **하나**다" 로 정의되어 있고, 인벤토리 · 장비 쪽도
  같은 칸을 쓴다 (`view/inventory-presentation.ts` · `equipment-presentation.ts`).
  이 제약은 그 자리를 상층 전투까지 넓히는 것이다.

  무엇이 달라지나 — 지켰을 때: §35 의 되짚기가 성립한다. "적이 움직이지 못한다 → 사슬
  관계가 있다 → 그 능력이 성공했다 → 조건(그 적이 나를 먼저 공격했다)이 참이었다 →
  31.2 초에 그 일이 있었다." 사람도 AI 도 같은 경로로 원인에 닿는다. 어겼을 때: 상층은
  실력의 층이 아니라 **운의 층으로 보이게** 된다 — 실제로는 결정론인데도 이유가 보이지
  않으므로 플레이어에게는 무작위와 구별되지 않는다. 그러면 DC-COMBAT-PLAYER-CAUSALITY 가
  코드에서는 지켜지고 경험에서는 깨진다.

  가장 안 읽히는 조각 — "일어나지 않은 일". 기존 관찰 규칙은 발생한 결과의 경위를 다루고
  (MC-COMBAT-CAUSE-READING — 이 피해가 왜 이 값인가), 이 제약은 **발생하지 않은 것**을
  다룬다. 둘은 자리가 다르다. 못 쓰는 이유는 계산 경위에 나타나지 않는다 — 계산 자체가
  일어나지 않았기 때문이다.

  경계 — 상대의 모든 것을 보여 주라는 말이 아니다. 상대의 능력이 무엇인지는 관찰로
  알아내는 것이고 (§25 — 그것이 정보 전투의 내용이다), 이 제약이 요구하는 것은
  **내가 겪은 일의 사유**가 나에게 보이는 것이다. 내가 왜 움직일 수 없는지는 즉시
  보여야 하고, 그것을 건 상대가 어떤 계약을 지고 있는지는 알아내야 한다.

scope:
  - COMBAT

requires:
  - 능력을 쓸 수 없을 때 세계가 그 사유를 하나 답한다
  - 상층이 만든 상태(계약 · 표식 · 관계 · 기회 · 관찰한 것)가 관찰 가능하다
  - 상층의 주요 변화가 사건으로 남아 원인을 되짚을 수 있다
prohibits:
  - 원인을 드러내지 않은 채 행동만 막는 것
prefers:
  - 사유를 문구가 아니라 코드로 두고 표현은 표시 층이 고르는 것

status: DRAFT
