# 원본 근거: RC §14.11 (BW §6 · §25 "기억을 물질에 보존하는 생물")
id: IP-MEMORY-BEARING
type: item_property

semantic: >
  겪은 것을 물질에 새겨 두고, 그 새김은 주변이 바뀌어도 바뀌지 않는다.
detail: >
  자기 안에 두면 함께 바뀌기 때문에 몸 밖의 물질에 새긴다. 정박정(IP-SELF-IDENTICAL)
  과의 구분: 그쪽은 **내가 무엇이었는지**(정체)를 붙들고, 이쪽은 **무엇이
  있었는지**(사실)를 붙든다. 둘 다 UNKNOWN 층의 답이지만 지키는 대상이 다르고,
  둘을 함께 지녀야 그 층이 온전히 감당된다. (RC §14.11)
world_shape: >
  주변의 인식·기억이 바뀌어도 이 물질의 새김만 그대로여야 한다.

origin_trace:
  world_state: [MW-ZONE-UNKNOWN]
  pressure: >
    인식과 정체가 흔들리는 층. 자기가 무엇을 겪었는지조차 남지 않는다. (BW §25)
  why_it_remains: >
    기억을 몸 안에 둔 것은 기억과 함께 바뀌었고, 밖의 물질에 새긴 것만
    사실을 지켰다.
  human_value: >
    지금 보는 것이 실재인지 대조할 바깥의 기준.
