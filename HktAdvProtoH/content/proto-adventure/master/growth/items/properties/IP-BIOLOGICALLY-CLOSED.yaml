# HUMAN_DIRECTED 확장 (Q22). 유래는 BW §24 가 서술한 DEEP 의 공생 Network 다.
id: IP-BIOLOGICALLY-CLOSED
type: item_property

semantic: >
  어떤 생체 연결도 받아들이지 않는다 — 무엇도 여기에 뿌리내리거나 이어 붙지 못한다.
detail: >
  살아 있는 것이 서로를 자기 일부로 삼는 곳에서 남은 방식이다. 이 성질은 생물을
  해치지 않는다. 다만 생물이 이것을 자기 것으로 만들지 못할 뿐이다. 그래서
  이것을 사이에 두면 이어져 있던 것이 이어져 있지 못하게 된다 — 자르는 것이
  아니라 **끼어드는** 방식으로 연결을 끝낸다.
world_shape: >
  생체 연결이 뻗어 나가는 상황에서 이 성질을 가진 것만 연결의 대상이 되지 않아야 한다.

origin_trace:
  world_state: [MW-ZONE-DEEP]
  pressure: >
    공생 Network 와 생체 영역이 주변의 것을 끌어들여 자기 체계의 일부로 삼는다. (BW §24)
  why_it_remains: >
    끌어들여진 것은 그 체계의 일부가 되어 더 이상 독립된 물질이 아니게 되고,
    끌어들여지지 않은 것만 광물로 잔존했다.
  human_value: >
    묶여 있는 것을 낱개로 되돌린다 — 여럿이 하나처럼 움직이는 상대에 대한 답이다.
