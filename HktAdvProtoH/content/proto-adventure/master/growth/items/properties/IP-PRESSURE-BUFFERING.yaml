# 원본 근거: BT §4.1 · §4.2 · §4.4 (백왕의 뼈 · 왕골) — Q74(a): BT 가 자연 자원 이름의 정본
id: IP-PRESSURE-BUFFERING
type: item_property
semantic: >
  주변의 급격한 세계압 변화를 흡수해 완충한다.
detail: >
  백왕이 살아 있을 때부터 과도한 세계압을 몸 안에 결속해 형태를 유지하던 기관의
  성질이다 (BT §4.1). 갈비분지가 안전한 이유 그 자체가 이 성질이다 — 완충이 큰
  규모로 일어나는 곳이 분지이고, 작은 조각으로 남은 것이 왕골이다.
world_shape: >
  세계압이 급격히 변하는 자리에서 이것을 지닌 쪽만 그 변화를 덜 겪어야 한다.
origin_trace:
  world_state: [MW-TERRAIN-BAIWANG-BASIN]
  pressure: >
    떠돌던 초거대 생명체가 과도한 세계압 속에서 형태를 유지해야 했다. (BT §4.1)
  why_it_remains: >
    결속하지 못한 몸은 형태를 잃었고, 결속하는 골격만 유해로 남았다.
  human_value: >
    장비 보관함 · 부적 · 성벽의 핵심 재료 — 변화를 완충하는 유일한 소재. (BT §4.4)
