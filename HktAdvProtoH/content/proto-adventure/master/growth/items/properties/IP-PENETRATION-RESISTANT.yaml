# 원본 근거: RC §14.3 (BW §22 "특수 갑각")
id: IP-PENETRATION-RESISTANT
type: item_property

semantic: >
  파고드는 힘을 여러 겹으로 나누어 붙잡는다.
detail: >
  두께가 아니라 **겹**이다. 얇은 층을 여러 겹 두어 파고드는 것을 층마다 붙잡는다.
  산격석(IP-SHOCK-DISPERSING)과 반대쪽이다 — 그쪽은 큰 한 번을 흩어 보내고 작은
  것에 약하며, 이쪽은 파고드는 것을 붙잡고 넓게 오는 충격에는 그대로 흔들린다.
  서로 반대쪽에 강해야 둘 다 존재할 이유가 있다 (RC §14.3).
world_shape: >
  관통에는 이것만 통하고, 넓은 충격에는 산격석 쪽만 통해야 한다. 같은 자리에
  쓰이면 선택이 사라진 것이다.

origin_trace:
  world_state: [MW-ZONE-WILD]
  pressure: >
    서로의 몸을 뚫는 것이 일상이다. 한 겹으로 막는 몸은 뚫린 한 번에 끝난다. (BW §22)
  why_it_remains: >
    한 겹으로 버티던 것은 사라지고, 겹으로 나누어 붙잡는 형태만 잔존했다.
  human_value: >
    관통에 대응하는 유일한 형태의 방어구 재료. (C013 이 세운 관통이 이미 세계에 있다)
