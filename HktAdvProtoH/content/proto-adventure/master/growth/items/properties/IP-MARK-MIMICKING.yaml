# 원본 근거: BT §6.5 (가면열매 — "특정 생물의 표식을 일시적으로 모방한다")
id: IP-MARK-MIMICKING
type: item_property
semantic: >
  다른 존재의 표식을 일시적으로 모방한다 — 숲과 생물에게 다른 존재로 인식된다.
detail: >
  뿌리망이 개체를 표식으로 구분하는 숲에서, 표식을 빌리는 것이 곧 통행이다 (BT §6.1).
  자기 표식을 숨기는 것이 아니라 **남의 것을 두르는** 것이다.
world_shape: >
  이것을 쓴 동안 숲·생물의 판정이 다른 존재를 향해야 한다.
origin_trace:
  world_state: [MW-TERRAIN-NAME-EATING-FOREST]
  pressure: >
    기록되지 않은 생명을 숲이 외부 자원으로 판단해 흡수한다. (BT §6.1 · §6.2)
  why_it_remains: >
    표식을 속이지 못한 것은 편입되었고, 모방하는 열매를 맺은 식물이 잔존했다.
  human_value: >
    임시 이름으로 숲을 통과한다 — 다른 존재의 이름으로 문과 생물을 속인다. (BT §6.7)
