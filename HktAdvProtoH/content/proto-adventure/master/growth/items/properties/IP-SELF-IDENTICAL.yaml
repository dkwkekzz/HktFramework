# HUMAN_DIRECTED 확장 (Q22). 유래는 BW §25 가 서술한 UNKNOWN 의 성질이다 —
# 세계압이 기억·감각·인식·Identity·공간까지 변화시킨다.
id: IP-SELF-IDENTICAL
type: item_property

semantic: >
  무엇이 무엇인지가 흔들리는 곳에서도 자기가 무엇인지를 바꾸지 않는다.
detail: >
  가장 깊은 곳에서 남은 방식이다. 구조를 유지하는 것(IP-BOUNDARY-STABLE)과
  헷갈리면 안 된다. 그것은 형태가 이어지는 것이고 이것은 **정체가 이어지는** 것이다.
  형태가 부서져도 조각마다 여전히 자기가 무엇인지를 안다. 그래서 이것을 지닌
  사람은 자기가 무엇이었는지를 잃지 않는 기준점을 하나 갖게 된다.
world_shape: >
  인식·정체가 뒤바뀌는 상황에서 이 성질을 가진 것만 이전과 같은 것으로 남아야 하고,
  그것을 기준으로 무엇이 바뀌었는지 알 수 있어야 한다.

origin_trace:
  world_state: [MW-ZONE-UNKNOWN]
  pressure: >
    세계압이 기억·감각·인식·Identity·공간까지 변화시켜, 무엇이 무엇인지가
    고정되지 않는다. (BW §25)
  why_it_remains: >
    정체가 흔들린 것은 더 이상 그것이 아니게 되어 셀 수 없고,
    자기 동일성을 잃지 않은 것만 같은 것으로 잔존했다.
  human_value: >
    자기를 붙들어 두는 닻. 이 층에서 인간이 잃는 것은 생명이 아니라 자기 자신이다.
