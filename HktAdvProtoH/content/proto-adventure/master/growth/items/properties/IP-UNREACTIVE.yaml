# HUMAN_DIRECTED 확장 (Q22) — BW 가 명명한 광물은 경계결정 하나뿐이다.
# 이 노드는 Human 지시로 세운 것이며, BW §11 자원 설계 원칙과 §33 여섯 질문을
# 통과시키기 위해 유래를 먼저 세우고 성질을 그 결과로 두었다.
id: IP-UNREACTIVE
type: item_property

semantic: >
  다른 어떤 것과도 섞이거나 반응하지 않는다 — 삭지도, 녹지도, 물들지도 않는다.
detail: >
  독이 흔한 곳에서 남은 방식이 그대로 성질이 되었다. 강한 것이 아니라 **무관한**
  것이라는 점이 핵심이다. 단단해서 버틴 것이 아니라 애초에 어떤 반응에도 참여하지
  않아서 남았다. 그래서 이 성질은 공격에 쓰이지 않는다 — 무엇을 담고 옮기고
  다루는 데 쓰인다.
world_shape: >
  다른 것을 삭이거나 녹이는 환경·물질에 닿아도 이 성질을 가진 것만 변하지 않아야 한다.

origin_trace:
  world_state: [MW-ZONE-WILD]
  pressure: >
    독을 가진 생물이 흔해 땅과 물에 삭이는 것이 늘 섞여 있다. (BW §22)
  why_it_remains: >
    반응하는 물질은 오래 남지 못하고, 아무것과도 반응하지 않는 것만 잔존했다.
  human_value: >
    독과 삭이는 것을 담아 문명권으로 옮길 수 있게 한다 — 베이라의 산물을 가지고
    나오는 일 자체가 여기에 걸려 있다.

grants_note: >
  여는 Capability 없음. 지금 어떤 Possibility 도 "삭임을 견딘다" 를 요구하지 않기
  때문이다. 자원이 있다는 이유로 Capability 를 만들지 않는다
  (DC-GROWTH-NEED-FROM-POSSIBILITY · BW §18). 요구하는 경로가 생기면 그때 잇는다.
