# 원본 근거: design/Master-World-Beira.md (BW) §10 — 문서가 이 yaml 을 직접 제시했다.
id: IP-BOUNDARY-STABLE
type: item_property

semantic: >
  주변 공간의 경계가 변화하더라도 자신의 구조적 연속성을 유지한다.
detail: >
  공간이 어긋나는 곳에서 살아남은 방식이 그대로 성질이 된 경우다. 주변이 무엇으로
  바뀌든 이 물질은 자기가 무엇으로 이어져 있는지를 놓지 않는다. 그래서 반대로,
  다른 물질의 이어짐에 개입할 수 있다 — 자기 연속성을 유지하는 것과 남의 연속성을
  끊는 것이 같은 성질의 앞뒷면이다 (BW §10).
world_shape: >
  주변이 변형되는 상황에서 이 성질을 가진 것만 형태를 유지하는 것이 관찰되어야 한다.

origin_trace:
  world_state: [MW-SPATIAL-SHEAR]
  pressure: >
    공간의 경계가 반복해서 어긋나 대부분의 물질이 구조를 잃고 소멸한다. (BW §10)
  why_it_remains: >
    공간 변화 속에서도 자기 구조의 연속성을 유지하는 것만 잔존했다.
  human_value: >
    다른 물질의 구조적 연결을 절단하거나 비정상적인 방어 구조에 작용하는 무기 소재.

