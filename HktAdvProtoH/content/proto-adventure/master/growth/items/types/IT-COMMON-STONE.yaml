# HUMAN_DIRECTED 확장 (Q22) — 지금 world/ 에서 실제로 캐고 있는 그 돌이다.
# 이 노드의 목적은 "좋은 자원" 을 늘리는 것이 아니라, 이미 세계에 있는 채집물에
# 세계 유래를 주어 DC-WORLD-RESOURCE-ADAPTATION-TRACE 를 만족시키는 것이다.
id: IT-COMMON-STONE
type: item_type

semantic: >
  문명권과 그 언저리에서 캐는 평범한 돌. 특별한 성질(IP-*)이 없다.
detail: >
  이 돌에 아무 성질이 없다는 것이 이 노드의 내용이다. 없어서 빠뜨린 것이 아니라
  **없는 것이 맞다.** 문명권은 세계압이 이미 굳어 조용해진 땅이고 (MW-SAFE-FRONTIER),
  그런 곳에서는 기적적인 물질이 태어나지 않는다 (BW §4 — 안전하지만 가능성의 폭이 좁다).
  그러므로 평범한 돌은 세계 법칙의 예외가 아니라 그 법칙이 낳은 정확한 결과다.
  베이라의 광물들과 나란히 두면 이 돌이 기준선 노릇을 한다 — 저쪽이 왜 특별한지가
  이쪽과 견주어야 보인다.
world_shape: >
  캘 수 있고, 만드는 데 쓰이며, 어떤 특별한 일도 하지 않아야 한다.
  이것으로 만든 것이 베이라 광물로 만든 것과 질적으로 달라야 한다.

origin_trace:
  world_state: [MW-SAFE-FRONTIER]
  pressure: >
    없음 — 굳지 않은 세계압이 적어 물질의 상태가 안정적이다. (BW §4 · §13)
  why_it_remains: >
    변화시키는 압력이 없으므로 그냥 남아 있다. 살아남은 것이 아니라 겪은 일이 없다.
  human_value: >
    건축·도구의 바탕 재료. 기적은 없고 양이 있다.

# 세계 구현 정합: 현재 world/ 의 채집물(광맥에서 캐는 돌)이 이 노드다.
# 지금은 개수만 세어지고 아무 데도 쓰이지 않는다 — growth/growth-graph.md 판정 참조.
