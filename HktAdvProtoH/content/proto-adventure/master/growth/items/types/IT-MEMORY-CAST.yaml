# 원본 근거: RC §14.11 (BW §6 · §25 "기억을 물질에 보존하는 생물")
id: IT-MEMORY-CAST
type: item_type

semantic: >
  겪은 것이 새겨진 물질. 지니는 것만으로 작용한다.
detail: >
  정박정(내가 무엇이었는지 — 정체)과 이것(무엇이 있었는지 — 사실)을 함께 지녀야
  UNKNOWN 층이 온전히 감당된다. (RC §14.11)
world_shape: >
  주변의 인식이 바뀌어도 이것의 새김만 그대로여서, 지금 보는 것이 실재인지
  이것과 대조해 알 수 있어야 한다.

