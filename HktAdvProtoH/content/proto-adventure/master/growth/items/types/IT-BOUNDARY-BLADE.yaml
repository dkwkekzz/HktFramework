# 원본 근거: design/Master-World-Beira.md (BW) §10 · §17 — 문서가 ID 를 직접 명명했다.
id: IT-BOUNDARY-BLADE
type: item_type

semantic: >
  경계결정으로 제작한 무기. 다른 물질의 구조적 연결을 절단하거나 비정상적인 방어
  구조에도 영향을 줄 수 있다.
detail: >
  "공격력 +1000 검이 아니다" 가 BW §10 이 이 무기에 대해 가장 강조하는 점이다.
  세기가 늘어나는 것이 아니라 **통하지 않던 것에 통하게** 된다. 그래서 평범한
  상대에게는 좋은 무기가 아닐 수도 있고, 그것이 이 무기의 성격이다.
world_shape: >
  일반적인 공격이 통하지 않는 구조에 이 무기만 작용해야 한다.
  단순히 피해량이 큰 무기면 이 노드가 아니다.

