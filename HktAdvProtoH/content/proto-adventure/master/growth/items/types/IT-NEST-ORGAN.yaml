# 원본 근거: RC §14.12 (BW §25 "공간을 둥지로 사용하는 생명")
id: IT-NEST-ORGAN
type: item_type

semantic: >
  변형된 공간의 안팎을 오가는 기관. 쓰면 없어진다 — 한 번의 탈출.
detail: >
  세 축의 "대상 없음" 칸을 채우는 첫 소모품이다 (RC §17) — 이것과 독(고른 대상)이
  서면 IS §5.3 대상 정책 세 갈래가 실물로 다 있게 된다.
world_shape: >
  변형된 공간에 갇힌 몸이 이것으로만 나올 수 있어야 한다.

