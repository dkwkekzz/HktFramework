# 원본 근거: BT §11.5 (마지막 씨앗)
id: IT-LAST-SEED
type: item_type
semantic: >
  한 존재의 마지막 감각과 기억을 보존한 씨앗.
detail: >
  성질은 기억을 뜬 것과 같은 것을 공유한다 (P2 — 겪은 것이 물질에 새겨져 바뀌지
  않는다) — 다른 것은 새겨진 내용이다: 사실의 기록이 아니라 한 존재의 **마지막**이다.
world_shape: >
  지닌 사람이 그 존재의 마지막 감각·기억에 닿을 수 있어야 한다.
origin_trace:
  world_state: [MW-TERRAIN-BLOODBLOOM-FOREST]
  property:    [IP-MEMORY-BEARING]
  human_value: >
    실종자의 마지막을 유족에게 전한다 (BT §11.6 장송원) — 값이 아니라 뜻이 큰 자원.
grants_note: >
  없음 — 기억·증언이라는 세계 상태가 아직 없다.
