  - id: MW-NATURAL-SETTLEMENT
    type: world_state
    statement: 사람과 지성 생명은 그 순환이 만든 예외 자리를 이용해 그 땅에서 살아간다 — 정착은 자연을 이긴 것이 아니라 예외에 얹힌 것이다. (BT §15.6 · §16)
    source: BT §15.6 · §16 · BT §15.6
    world_shape: 사람이 모여 사는 자리가 그 땅의 법칙이 멎는 곳과 겹쳐야 하고, 그 겹침이 우연이 아니어야 한다. 예외가 사라지면 그 자리의 삶도 흔들려야 한다.
    implemented: ABSENT
    implemented_note: 사람도 문화도 없다 — 세계에 있는 존재는 순회하는 방랑자 둘뿐이고 어디에도 정착하지 않는다
    arises_from: [ MW-NATURAL-REFUGE ]
    causes: []
    changed_by: []
  - id: MW-CIRCULATION-EVIDENCE
    type: world_state
    statement: 순환은 설명 없이 볼 수 있는 증거를 표면에 남긴다 — 읽을 줄 아는 사람은 그것으로 다음에 무엇이 일어날지 안다. (BT §15.8 · §5.4)
    source: BT §15.8 · §5.4 · BT §15.8 · BT §5.2 · §5.4
    world_shape: 무언가가 일어나기 전에 그 자리에 표시가 먼저 나타나야 하고, 그 표시와 일어남 사이에 읽고 움직일 만한 시간이 있어야 한다. 표시를 보고 움직인 쪽과
      그러지 않은 쪽의 결과가 달라야 한다.
    implemented: ABSENT
    implemented_note: 자리의 범위가 화면에 보이지만 그것은 법칙의 경계이지 순환이 남긴 증거가 아니다 — 아직 일어나지 않은 것을 가리키는 것이 세계에 하나도 없다.
      TERRAIN 트랙의 다음 후보(FR-THE-LAND-SHOWS-BEFORE-IT-TAKES)가 이 노드를 연다
    arises_from: [ MW-TERRAIN-CIRCULATION ]
    causes: []
    changed_by: []
  - id: MW-TERRAIN-BAIWANG-BASIN
    type: world_state
    statement: 백왕의 갈비분지 — 죽은 초거대 생명체의 골격이 주변 세계압을 흡수해, 하늘을 떠받치는 흰 갈비뼈 안쪽에 도시와 강과 숲이 자라난 땅이다. (BT §4)
    source: BT §4 · BT §4.1 · BT §4.2 · BT §4.6
    world_shape: 위험을 흡수하는 자연의 구조가 눈에 보이고, 그 구조 안쪽에서만 사람이 오래 머물 수 있어야 한다. 그리고 그곳에서 하는 일(원정 준비 · 거래 · 감별 ·
      증언 수집)이 바깥에 다녀온 사람이 있어야 성립해야 한다 — 혼자 다 되면 이 지형이 아니다.
    implemented: ABSENT
