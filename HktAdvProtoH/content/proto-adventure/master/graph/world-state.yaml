    # 그것이 여는 능력은 MC-CUT-ABNORMAL-STRUCTURE (capabilities.yaml).

  # ══ 대지형 — 법칙이 대륙 규모로 결속된 땅 (BT §1 · §4~§11) ══════════════
  # BT = content/proto-adventure/design/Master-World-Beira-Terrain.md.
  # 여덟은 순서가 없다 — 난이도 순으로 배치된 목록이 아니다 (BT §16).
  # 각 지형의 demands 가 그 절의 "왜 위험한가" 와 "주요 경험" 에서 온다.
  # 깊이 층(MW-ZONE-*)과 이 여덟은 직교한다 (HISTORY Q47(a)) — 한 대지형 안에 안전한
  # 마을과 극단적으로 위험한 심부가 함께 있다 (BT §3).

  - id: MW-MACRO-TERRAIN
    type: world_state
    statement: >
      베이라의 대지는 하나의 원리가 어떤 매질에 대륙 규모로 결속되어 형성된
      대지형들로 나뉜다. (BT §1)
    detail: >
      대지형은 기후와 식생으로 구분되는 배경이 아니다. 어떤 매질 하나 — 암석·물·대기·
      열·생명·공간·기억·Identity·소리·관계 중 하나 — 에 세계압이 대륙 규모로 결속되면,
      그 결속이 수천 년 반복되며 산맥과 수계와 대기와 생태를 함께 만든다 (BT §1 · §15).
      아직 굳지 않은 몫은 대지를 계속 변화시켜 위험이 되고, 굳은 몫은 광물·식물·기관·
      소재 같은 안정된 성질이 되어 사람에게 자원이 된다. 그래서 한 지형의 위험과 그
      지형의 보물은 언제나 같은 법칙에서 나온다 — 눈과 비, 더위와 추위는 그 법칙이
      표면에 드러난 결과일 뿐 정체성이 아니다. 여덟이 문서에 서 있고 (BT §4~§11),
      그 여덟은 난이도 순으로 늘어선 목록이 아니다 (BT §16).
    world_shape: >
      서로 다른 법칙을 가진 땅이 여럿 존재하고, 각 땅에서 위험한 것과 값진 것이 같은
      법칙으로 설명되어야 한다. 그리고 어느 땅에 갈 수 있는가가 수치가 아니라 무엇을
      감당할 수 있게 되었는가로 정해져야 한다 (BT §12). 한 땅 안에 머물 수 있는 자리와
      감당할 수 없는 심부가 함께 있어야 한다 — 깊이와 직교한다는 것이 그 뜻이다
      (BT §3 · HISTORY Q47(a)).
    implemented: PARTIAL
    implemented_note: >-
      땅이 자리로 나뉘고 그 자리가 법칙을 지닌다 (C-TERRAIN-001 — World.GroundZones · GroundLawDefinition).
      남은 것은 world_shape 의 나머지다: 법칙이 하나뿐이고, 그 법칙이 낳는 자원이 없으며,
      어디에 갈 수 있는가가 감당으로 정해지지 않고, 깊이와의 직교도 아직 없다
    arises_from: [MW-FREE-PRESSURE, MW-BOUND-PRESSURE]
    # 위험 쪽과 자원 쪽이 한 땅에서 만나는 자리다 — BT §1 이 둘을 함께 든다.
    causes: []
    # BT 는 대지형 일반이 어떤 Goal 을 낳는지를 명명하지 않는다 — 각 지형이 따로 낳는다.
    changed_by: []

  # ══ 대지 순환과 그 아래 (BT §15.3~§15.6 · §16 · BW §11) ═══════════════════
  # 아래 넷은 **여덟 대지형이 각자 하나씩 지니는 층**이다 — 여덟의 부모가 아니라
  # 여덟이 공통으로 인스턴스화하는 자리다. BT §16 의 세계 골격이 이 순서를 정했다:
  #
  #     세계압 → Principle Manifestation → 기이한 자연 순환 → 압도적인 지형
  #     → 생존 압력 → 생명과 물질의 적응 → 위험과 기적적인 자원
  #     → 자연적 피난처 → 사람과 문화 → 관찰과 추론 → 다양한 행동 가능성
  #
  # 이 넷이 노드로 서기 전에는 그 사슬이 MW-MACRO-TERRAIN 의 detail 산문에만
  # 있었다 — 간선이 없으므로 Overlay 도 Frontier 도 그것을 볼 수 없었고,
  # 순환을 여는 Cycle 이 자기 이유를 Constraint 부기로 번역하게 되었다
  # (C-TERRAIN-002 01-cycle.md).

  - id: MW-TERRAIN-CIRCULATION
    type: world_state
    statement: >
      한 대지형의 지배 원리는 수천 년 반복되며, 그 땅이 무언가를 거두고 쌓고 되돌리는
      되풀이를 만든다 — 그것이 대지 순환이다. (BT §15.3 · §16)
    detail: >
      지배 원리는 "어떤 상태를 어떤 조건에서 반복적으로 변화시키는가" 이고 (BT §15.2),
      그 반복이 한 번으로 끝나지 않기 때문에 땅에 시간이 생긴다. 거두어 간 것이 어딘가에
      쌓이고, 쌓인 것이 넘치면 어딘가로 되돌아가고, 그 되돌아감이 다시 다음 거둠의
      조건이 된다. 이 층이 없으면 **그 아래의 모든 것을 놓는 수밖에 없다** — 위험도
      예외 자리도 자원도 생명도, 세계를 적는 사람이 좌표에 찍은 것이 된다. BT §15 가
      대지형을 정의하는 아홉 질문에서 이것이 셋째이고, 넷째(위험)부터 일곱째(자원)까지가
      전부 "그 순환이 …" 로 시작한다. 여덟 대지형이 각자 하나씩 지니며, 이 노드는 그
      여덟이 공통으로 인스턴스화하는 층이다.
    world_shape: >
      같은 자리를 다른 시각에 보면 달라야 하고, 그 다름이 무작위가 아니라 그 사이에
      무슨 일이 있었는가로 설명되어야 한다. 그 땅이 거두어 간 것이 지금 어디에 있는지를
      물을 수 있어야 하고, 세계가 그 물음에 답을 지녀야 한다.
    implemented: PRESENT
    implemented_note: >-
      C-TERRAIN-002 — 자리가 거둔 것을 지니고(kept), 넘치면 뿜고, 그 안의 몸에게
      돌려주고, 다 쓰면 닫혀 도로 거둔다. 같은 자리를 다른 시각에 보면 다르고 그 다름이
      "그 사이에 누가 거기서 얼마나 빼앗겼는가" 로 설명된다 — 주기는 세계가 정한 것이
      아니다
    arises_from: [MW-MACRO-TERRAIN]
    causes: [MG-EXPLORE-BEIRA]
    # Q64(b) — Human 이 정했다 (HISTORY.md). BT §5.7 이 빙원의 핵심 경험을 "대지가 열을
    # 어디에서 빼앗고 어디에 저장하는지를 **읽는 것**" 이라 했고, 읽어서 감당하게 되는
    # 것이 곧 대응 범위의 확장(MG-EXPLORE-BEIRA)이다. 이 간선이 없는 동안 순환 계열은
    # 어떤 Goal 도 낳지 않아, 그 층을 여는 Cycle 이 자기 이유를 Constraint 부기로
    # 번역하게 되었다 (C-TERRAIN-002).
    changed_by: []

  - id: MW-SHAPED-LANDFORM
    type: world_state
    statement: >
      순환이 수천 년 되풀이되면 산맥과 수계와 대기가 그 순환의 모양으로 빚어진다 —
      지형의 생김새는 법칙이 남긴 자국이다. (BT §15.3 · §16)
    detail: >
      §16 의 골격에서 순환 다음 고리가 "압도적인 지형" 이다. 여기서 지형은 대지형
      여덟(MW-TERRAIN-*)을 뜻하지 않는다 — 그 여덟은 §15 의 아홉 질문을 한 벌로 지닌
      **묶음**이고, 이 노드는 그 안에서 순환이 실제로 깎아 놓은 **생김새**다. 산이
      거기 있는 것도, 물이 그리로 흐르는 것도, 대기가 그렇게 도는 것도 법칙의 결과여야
      한다는 주장이며, 그래서 지형은 배경 그림이 아니라 **읽을 수 있는 증거의 표면**이
      된다. 이것이 없으면 순환은 눈에 보이는 자국을 남기지 못하고 수치로만 존재한다.
    world_shape: >
      땅의 생김새를 보고 그 땅의 법칙을 짐작할 수 있어야 한다. 같은 법칙이 도는 곳은
      비슷하게 생기고, 법칙이 다른 곳은 다르게 생겨야 한다.
    implemented: ABSENT
    implemented_note: >-
      무대가 평면 하나다 — 산도 물길도 대기도 없고, 자리의 경계는 원으로 그려진 범위이지
      순환이 빚은 생김새가 아니다
    arises_from: [MW-TERRAIN-CIRCULATION]
    causes: []
    changed_by: []

  - id: MW-SURVIVAL-PRESSURE
    type: world_state
    statement: >
      대지 순환은 그 땅에 있는 몸과 인식과 이동에 끊임없이 작용한다 — 그것이 생존
      압력이다. (BT §15.4 · §16 · BW §11)
    detail: >
      위험은 그 땅에 배치된 강한 것이 아니라 **순환이 몸에 닿는 방식**이다 — BT §15.4 가
      위험을 "그 순환이 인간의 몸·인식·관계·이동에 어떤 방식으로 작용하는가" 로 묻는다.
      빙원이 위험한 것은 거기 사나운 것이 살아서가 아니라 대지가 열을 거두어 가기
      때문이고, 그래서 그 위험은 읽을 수도 피할 수도 이용할 수도 있다 — 배치된 위험은
      그럴 수 없다. 이 층이 세계압의 자유로운 몫(MW-FREE-PRESSURE)과 다른 것은 규모다:
      그쪽은 왜 이 땅이 위험한가를 말하고, 이쪽은 지금 이 몸에 무엇이 일어나는가를 말한다.
    world_shape: >
      그 땅에서 겪는 나쁜 일이 그 땅의 법칙으로 설명되어야 하고, 법칙을 읽은 사람과
      읽지 못한 사람이 같은 자리에서 다른 결과를 내야 한다. 아무것도 하지 않고 서 있기만
      해도 무언가가 일어나야 한다.
    implemented: PARTIAL
    implemented_note: >-
      C-TERRAIN-002 로 압력이 순환에서 나온다 — 어디가 거두고 어디가 돌려주는지가
      내가 한 일의 결과이므로 읽어서 이용할 거리가 생겼다. 남은 절반은 world_shape 의
      "읽은 사람과 읽지 못한 사람이 다른 결과를 낸다" 다: **지금 상태는 읽히나 앞으로
      일어날 일은 읽히지 않는다** (MW-CIRCULATION-EVIDENCE 가 그 자리다)
    arises_from: [MW-TERRAIN-CIRCULATION, MW-SHAPED-LANDFORM]
    causes: []
    changed_by: []

  - id: MW-ADAPTED-LIFE
    type: world_state
    statement: >
      생존 압력 아래에서 생명과 물질은 그 압력에 적응한 형태로만 남는다 — 무엇이 어디에
      있는가는 순환의 결과다. (BT §16 · BW §11)
    detail: >
      이 층이 이 세계와 보통의 게임이 갈리는 자리다. 보통은 지역마다 어울리는 것을
      배치하지만, 여기서는 그 땅의 순환이 무엇을 허용하는가가 무엇이 사는가를 정한다.
      BT §5.3 이 빙원에서 살 수 있는 자리로 해숨구멍 주변과 거대 털짐승이 지나간 자리를
      드는데, 그 둘은 모두 순환이 열을 되돌려 놓은 자리다. BW §11 이 같은 사슬을
      세계압 → 환경 → 생존 압력 → 적응 → Property → 자원 으로 적는다. 적응이 남긴
      Property 가 곧 사람에게 자원이 되므로(MW-BOUND-PRESSURE), 이 층은 위험 쪽과
      자원 쪽이 다시 만나는 자리이기도 하다.
    world_shape: >
      어떤 생명이나 물질이 왜 하필 거기 있는지를 그 땅의 법칙으로 답할 수 있어야 한다.
      순환이 달라지면 무엇이 어디에 있는지도 따라 달라져야 한다 — 그러지 않으면 그것은
      적응이 아니라 배치다.
    implemented: ABSENT
    implemented_note: >-
      세계에 있는 것은 좌표로 놓인 방랑자 둘과 광맥 하나뿐이고 셋 다 땅의 법칙과 무관한
      자리에 있다. 놓는 것 말고 다른 길이 세계에 없다
    arises_from: [MW-SURVIVAL-PRESSURE]
    causes: []
    changed_by: []

  - id: MW-NATURAL-REFUGE
    type: world_state
    statement: >
      순환은 자기 법칙이 멎는 자리를 스스로 만든다 — 자연적 예외는 법칙에 저항하는 것이
      아니라 법칙이 낳은 것이다. (BT §15.5 · §16)
    detail: >
      BT §15.5 는 자연적 예외를 "무엇이 그 법칙에 저항하거나 균형을 이루는가" 로 묻는다.
      빙원의 해숨구멍은 포화된 광맥이 흡수한 열을 도로 뿜는 자리이므로(BT §5.3), 그것은
      안전지대가 아니라 **순환의 한 국면**이다. 이 구분이 중요한 이유는, 예외가 순환에서
      나오지 않으면 그것은 세계를 적는 사람이 "여기는 안전한 곳" 이라고 선언한 것이 되고,
      그 순간 왜 하필 거기가 안전한가에 세계가 답하지 못하기 때문이다. 그리고 순환에서
      나온 예외는 생겨나고 사라진다 — 사람과 지성 생명이 그 예외를 이용해 살아가는 일
      (BT §15.6) 도 그래서 영구한 것이 아니다.
    world_shape: >
      법칙이 멎는 자리가 있어야 하고, 그 자리가 왜 하필 거기인가에 세계가 답해야 한다.
      그리고 조건이 달라지면 그 자리가 옮겨 가거나 사라져야 한다.
    implemented: PRESENT
    implemented_note: >-
      C-TERRAIN-002 — 예외를 놓을 형이 사라졌다(GroundZone.role 삭제). 법칙이 멎는
      자리는 넘쳐서 뿜는 중인 맥뿐이므로 "왜 하필 거기가 안전한가" 에 세계가 답한다 —
      거기에 열이 모였기 때문이고, 모인 것은 누군가 거기서 빼앗겼기 때문이다.
      그리고 생겨나고 사라진다
    arises_from: [MW-TERRAIN-CIRCULATION]
    causes: []
    changed_by: []

  - id: MW-TERRAIN-RESOURCE
    type: world_state
    statement: >
      그 땅의 위험을 만든 것과 **같은 법칙**이 인간 세계에 없는 Property 를 남긴다 —
      그것이 그 땅의 자원이다. (BT §15.7 · BW §11)
    detail: >
      BT §15.7 은 자원을 "이 위험을 만든 동일한 법칙이 어떤 기적적인 Property 를
      만드는가" 로 묻는다. 그러므로 자원은 그 땅에 숨겨 둔 보물이 아니라 순환과 적응이
      남긴 찌꺼기이며, 위험과 같은 뿌리를 갖는다는 이 세계의 핵심 주장(BW §6 · §36)이
      지형 층에서 다시 나타나는 자리다. 세계 전체 규모의 MW-BOUND-PRESSURE 와 다른
      것은 크기다 — 그쪽은 "세계압 중 굳은 몫" 이라는 성질이고, 이쪽은 "이 땅의 이
      법칙이 낳은 이 물건" 이다. `Design-Resource-Catalog-R0.md` §4 가 모든 자원에
      요구하는 질문("왜 여기에서만 생기는가 → 어떤 Principle 때문인가 → 그 상태가 오랜
      시간 반복되면 무엇이 만들어지는가")이 답해지는 곳이 이 노드다.
    world_shape: >
      어떤 물건이 왜 하필 그 땅에서만 나는지를 그 땅의 법칙으로 답할 수 있어야 한다.
      그리고 그것을 캐어 가는 일이 그 땅의 순환에 되돌아가야 한다 — 되돌아가지 않으면
      그것은 자원이 아니라 채집물이다.
    implemented: ABSENT
    implemented_note: >-
      캘 수 있는 것은 광맥의 돌 하나뿐이고, 그것은 어떤 법칙이 낳은 것이 아니라 좌표에
      놓인 것이다. 캐어도 세계에 아무 되돌림이 없다
    arises_from: [MW-SURVIVAL-PRESSURE, MW-ADAPTED-LIFE]
    causes: []
    changed_by: []

  - id: MW-NATURAL-SETTLEMENT
    type: world_state
    statement: >
      사람과 지성 생명은 그 순환이 만든 예외 자리를 이용해 그 땅에서 살아간다 —
      정착은 자연을 이긴 것이 아니라 예외에 얹힌 것이다. (BT §15.6 · §16)
    detail: >
      BT §15.6 은 정착을 "사람과 지성 생명은 그 예외를 어떻게 이용해 살아가는가" 로
      묻는다. 순서가 요점이다 — 사람이 안전을 만든 것이 아니라, 순환이 허용한 안전
      위에 사람이 자란다. 백왕의 갈비분지가 그 실물이며(MW-TERRAIN-BAIWANG-BASIN),
      그 노드의 detail 이 "도시가 이곳을 안전하게 만든 것이 아니라 백왕의 유해가 허용한
      안정 위에 도시가 자라났다" 로 같은 말을 한다. 이 노드는 그 하나를 일반화한 층이며,
      예외가 옮겨 다니면 정착도 영구할 수 없다는 결과를 함께 지닌다.
    world_shape: >
      사람이 모여 사는 자리가 그 땅의 법칙이 멎는 곳과 겹쳐야 하고, 그 겹침이 우연이
      아니어야 한다. 예외가 사라지면 그 자리의 삶도 흔들려야 한다.
    implemented: ABSENT
    implemented_note: >-
      사람도 문화도 없다 — 세계에 있는 존재는 순회하는 방랑자 둘뿐이고 어디에도
      정착하지 않는다
    arises_from: [MW-NATURAL-REFUGE]
    causes: []
    changed_by: []

  - id: MW-CIRCULATION-EVIDENCE
    type: world_state
    statement: >
      순환은 설명 없이 볼 수 있는 증거를 표면에 남긴다 — 읽을 줄 아는 사람은 그것으로
      다음에 무엇이 일어날지 안다. (BT §15.8 · §5.4)
    detail: >
      BT §15.8 은 관찰을 "플레이어가 설명 없이 볼 수 있는 증거는 무엇인가" 로 묻는다.
      빙원에서는 얼음 아래의 검은 빛, 땅에 퍼지는 원형 서리 무늬, 걷던 자세 그대로
      얼어붙은 거수가 그것이다 (BT §5.2 · §5.4). 증거는 화면의 친절이 아니라 **세계에
      실재하는 것**이며, 그래서 읽은 사람과 읽지 못한 사람이 같은 길에서 다른 결과를
