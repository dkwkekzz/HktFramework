# Master WorldState — MW-*
# 세계에서 현재 참인 의미 있는 상태. Goal 과 Possibility 를 발생시키는 원인이 될 수 있다.
# 자료구조가 아니다 — 자료구조는 Cycle 의 03-world-semantic.md 가 소유한다.
# 형식: ../SCHEMA.md
#
# 인용 표기 — BW §x = design/Master-World-Beira.md (2026-08-19 Human 지시로 주입).
# MW-PRIMAL-WORLD · MW-WORLD-PRESSURE · MW-HYPER-PREDATION · MW-SPATIAL-SHEAR ·
# MW-SAFE-FRONTIER 의 ID 는 문서가 직접 명명한 것이다.
version: 1
nodes:

  # ── 상위 Root Cause (BW §30) ──────────────────────────────────────────
  # 이 둘은 상태라기보다 성질(Premise)에 가깝다 — root.md WORLD PREMISE 와 겹친다.
  # 그러나 BW §30 이 "베이라 Graph 의 최상위 인과" 로 직접 노드 명명했으므로 번역해 둔다.

  - id: MW-PRIMAL-WORLD
    type: world_state
    statement: >
      세계는 본래 높은 변화 가능성을 가진다. (BW §30)
    causes: []
    changed_by: []

  - id: MW-WORLD-PRESSURE
    type: world_state
    statement: >
      세계압이 생명과 물질의 변화 가능성을 증가시키고 있다. 같은 Root 에서
      Free Pressure(환경 변화 → 생존 압력 → 극단 적응 → 위험한 생태)와
      Bound Pressure(안정된 Property → 희귀 자원)가 동시에 발생한다. (BW §3 · §5 · §30)
    causes: []
    changed_by: []

  # ── 베이라의 구조 (BW §14 · §19) ──────────────────────────────────────

  - id: MW-SAFE-FRONTIER
    type: world_state
    statement: >
      Player 가 출발하는 문명권은 Free World Pressure 가 낮아 평범한 생태와 기본적인
      Resource 위에서 휴식·교역·제작·정보 획득·Actor 관계·전투 훈련·Item 거래·
      Growth Route 탐색·탐험 준비가 가능하다. 그러나 세계압이 낮아 문명권 내부에서는
      얻기 어려운 것들이 존재한다. (BW §4 · §7 · §14 · §20)
    causes: [MG-EXPLORE-BEIRA]   # 문명권의 한계가 베이라로 나가는 이유를 만든다 (BW §7 · §15)
    changed_by: []

  - id: MW-DEPTH-GRADIENT
    type: world_state
    statement: >
      베이라는 SAFE FRONTIER → FRINGE → WILD → DANGER → DEEP → UNKNOWN → ? 의 위험
      Gradient 를 가지며 일반적으로 깊어질수록 Free World Pressure 가 높아진다 —
      더 위험해지는 동시에 더 기적적인 발견의 가능성도 커진다. 단 세계압은 가능성을
      늘릴 뿐 모든 위험 지역이 가치 있는 Resource 를 보장하지는 않는다 (BW §12).
      정확한 수치적 거리 공식이 아니다 — 지역마다 Local WorldState 가 다를 수 있고,
      UNKNOWN 너머(?)는 문서도 열어 둔다. (BW §19)
    causes: []
    changed_by: []
    # 각 층의 생태는 아래 MW-ZONE-* 5종이, 각 층이 요구하는 Capability 사다리
    # (BW §20~§25)는 capabilities.yaml 의 "베이라 사다리" 절이 소유한다.
    # SAFE FRONTIER 층은 위 MW-SAFE-FRONTIER 가 그 자리다 (BW §14 · §20).

  # ── 깊이별 층 (BW §21~§25 — 각 층이 한 절씩 서술된 세계 사실) ─────────
  # 각 층의 causes 는 비워 둔다 — 이 층들이 만드는 구체 Local Goal 은 BW 가
  # 명명하지 않았다 (§16 은 "발견 → Local Goal" 순환만 공급). WHY 확장 몫이다.
  # 층 진입은 possibilities.yaml 의 MP-VENTURE-INTO-* 가 담당한다.

  - id: MW-ZONE-FRINGE
    type: world_state
    statement: >
      변화 가능성이 조금 높아 강한 토착 포식자가 있는 베이라의 바깥 층. (BW §21)
    causes: [MG-OVERCOME-SUPERIOR-OPPONENT, MG-SURVIVE-ENEMY-OFFENSIVE, MG-HOLD-HUNTING-GROUND]
    # 포식자가 길을 막고 침입자를 사냥한다 → Player 의 전투 Goal 2종.
    # 층의 생존 경쟁 → 포식자 자신의 Goal 1종. (Q2(a) WHY 확장 — BW §21 · §26 · §27)
    changed_by: []

  - id: MW-ZONE-WILD
    type: world_state
    statement: >
      특수 갑각·독·비정상적 감각·특수 이동을 가진 생물이 사는 층. 동시에 인간에게
      가치 있는 특수 생물 소재가 본격적으로 등장하기 시작한다. (BW §22)
    causes: [MG-ACQUIRE-RARE-ORGAN]   # 가치 있는 특수 소재의 존재가 획득 Goal 을 만든다 (BW §22 · §27)
    changed_by: []

  - id: MW-ZONE-DANGER
    type: world_state
    statement: >
      생물과 환경을 독립적으로 볼 수 없는 층 — Hazard 와 Creature 와 Terrain 이
      결합해 있다. Resource 역시 특정 환경 Property 를 가지기 시작한다. (BW §23)
    causes: []
    changed_by: []

  - id: MW-ZONE-DEEP
    type: world_state
    statement: >
      인간의 전투 상식이 무너지기 시작하는 층 — 극단적인 재생·신체 구조 변경·
      공생 Network·생체 영역·공격 Adaptation 이 존재한다. 특히 강력한 Resource 가
      등장할 수 있다. (BW §24)
    causes: []
    changed_by: []

  - id: MW-ZONE-UNKNOWN
    type: world_state
    statement: >
      세계압이 생명과 물질뿐 아니라 인간이 추상적이라 여기는 영역 — 기억·감각·인식·
      Identity·공간·관계·행동 Pattern — 까지 변화시키는 층. 이들의 적응 기관은
      인간에게 상상을 초월하는 Resource 가 될 수 있다. (BW §25)
    causes: []
    changed_by: []
    # "기억을 먹는 생명 · 관찰자를 추적하는 생명" 등 §25 의 생명 목록은 예시다 —
    # 개체 노드는 세우지 않는다 (지어내지 않는다 · Q14 삽화 선례와 동일 기준).

  # ── 대표 지역 상태 — 극단 환경과 자원이 같은 인과에서 (BW §8~§10) ─────

  - id: MW-HYPER-PREDATION
    type: world_state
    statement: >
      어떤 베이라 지역에서는 극단적인 포식 경쟁으로 생명체가 일상적으로 치명적인
      육체 손상을 입는다. 그 생존 압력에 대한 적응으로, 안정되어 있던 이전 생체
      상태를 유지하는 방향으로 적응한 식물(회귀초)이 존재한다. (BW §8 · §9)
    causes: []
    changed_by: []
    # 회귀초의 Capability 는 MC-RESTORE-BIOLOGICAL-STATE (capabilities.yaml).
    # 이 지역이 어떤 Goal 을 발생시키는지는 WHY/OPTIONS 탐색 몫이다 — 지어내지 않는다.

  - id: MW-SPATIAL-SHEAR
    type: world_state
    statement: >
      어떤 지역에서는 공간 자체의 경계가 반복적으로 어긋나 대부분의 물질이 소멸하고,
      공간 변화 속에서도 자신의 구조를 유지하는 광물(경계결정)만 잔존한다. (BW §10)
    causes: []
    changed_by: []
    # 경계결정의 Property 는 growth/items/properties/IP-BOUNDARY-STABLE.yaml,
    # 제작물은 growth/items/types/IT-BOUNDARY-BLADE.yaml.

# 전투 Goal 의 caused_by 배선은 Q2(a) WHY 확장으로 닫았다 (2026-08-19) —
# MW-ZONE-FRINGE 가 전투 Goal 의 World Cause 다. 위 causes 필드 참조.
