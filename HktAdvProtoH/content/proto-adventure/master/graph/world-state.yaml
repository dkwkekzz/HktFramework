# Master WorldState — MW-*
# 노드는 의미의 주소다 — 전문·이유는 source 의 기획서가 소유한다 (../SCHEMA.md "모든 Node 공통").
# 형식: ../SCHEMA.md · 관찰: npm run master:graph (뷰어) — 이 파일을 사람이 통독하지 않는다.
#
# 인용 표기 — BW §x = content/proto-adventure/design/Master-World-Beira.md
#              BT §x = content/proto-adventure/design/Master-World-Beira-Terrain.md (대지형)

version: 1
nodes:
  - id: MW-PRIMAL-WORLD
    type: world_state
    statement: 세계는 본래 높은 변화 가능성을 가진다. (BW §30)
    source: BW §30
    world_shape: 직접 관찰되는 상태가 아니다 — 세계의 전제이므로 다른 모든 MW-* 가 이것에서 내려온다는 사실로만 확인된다. 게임 안에 이것을 보여주는 표면은 없어야 한다.
    implemented: PRESENT
    implemented_note: 전제이므로 어긋나는 규칙이 없으면 성립
    arises_from: []
    causes: []
    changed_by: []
  - id: MW-WORLD-PRESSURE
    type: world_state
    statement: 세계압이 생명과 물질을 현재 상태 너머로 변화시킬 수 있도록 밀고 있다. (BW §3)
    source: BW §3
    world_shape: 세계압 자체가 수치로 노출될 필요는 없다. 대신 지역마다 "여기는 얼마나 변할 수 있는 곳인가" 가 그 지역의 생태·자원·위험으로 일관되게 드러나야 하고,
      위험이 큰 곳에서 나온 것일수록 인간 세계에 없는 성질을 지녀야 한다.
    implemented: PARTIAL
    implemented_note: 세계가 만들어질 때 에너지의 분포(씨앗의 표본열)가 먼저 서고 자리들이 그 결과다 — "표현될 자리가 없다" 던 그 자리가 생겼다
      (C-TERRAIN-003). 발현 하나(heat-binding)에 한하며, 지역 개념 · 여러 법칙 · Free/Bound 의 세계 표현은 남아 있다
    arises_from: [ MW-PRIMAL-WORLD ]
    causes: []
    changed_by: []
  - id: MW-FREE-PRESSURE
    type: world_state
    statement: 아직 어떤 생명이나 물질의 안정된 성질로도 굳지 않은 세계압이 남아 있다. (BW §5)
    source: BW §5
    world_shape: 같은 지역이라도 시간·상황에 따라 무엇을 만날지, 그것이 어떤 성질을 지녔을지가 고정되어 있지 않아야 한다. 플레이어가 "이 지역에는 이것이 나온다" 를 한
      번 외워 영구히 해결되면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: 지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    arises_from: [ MW-WORLD-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-BOUND-PRESSURE
    type: world_state
    statement: 일부 세계압은 생명이나 물질의 특수한 성질로 굳어 안정적으로 정착해 있다. (BW §5)
    source: BW §5
    world_shape: 가치 있는 자원마다 그것이 어떤 환경의 어떤 압력을 견딘 결과인지가 세계 안에서 추적 가능해야 한다. 자원의 효과가 그 유래와 무관한 수치 보너스(공격력
      +N)로만 드러나면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: 지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    arises_from: [ MW-WORLD-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-SAFE-FRONTIER
    type: world_state
    statement: 플레이어가 출발하는 문명권은 굳지 않은 세계압이 적어 생태가 예측 가능하다. (BW §14)
    source: BW §14 · BW §13 · BW §7
    world_shape: 플레이어가 위험 없이 머물며 준비할 수 있는 장소가 존재하고, 그곳에서 할 수 있는 일(거래·제작·정보·훈련)과 그곳에서는 결코 얻을 수 없는 것이 명확히
      갈려야 한다. "여기서도 결국 다 되는데 밖이 효율만 좋다" 면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: 안전한 곳과 위험한 곳의 구분이 없다 — 무대가 하나다
    arises_from: [ MW-BOUND-PRESSURE ]
    causes: [ MG-EXPLORE-BEIRA ]
    changed_by: []
    demands: [ MC-COMBAT-STRIKE, MC-GUARD, MC-EVADE, MC-REPOSITION ]
  - id: MW-DEPTH-GRADIENT
    type: world_state
    statement: 베이라는 깊이 들어갈수록 굳지 않은 세계압이 높아지는 기울기를 가진다. (BW §19)
    source: BW §19 · BW §12
    world_shape: 깊이가 다른 영역이 여럿 존재하고, 각 영역이 요구하는 대응이 질적으로 달라야 한다 (같은 대응의 난이도만 올라가는 것이 아니다). 그리고 깊은 곳에 갔는데
      아무것도 얻지 못하는 일이 정상적으로 일어나야 한다.
    implemented: ABSENT
    implemented_note: 깊이도 층도 없다
    arises_from: [ MW-FREE-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-ZONE-FRINGE
    type: world_state
    statement: 베이라의 바깥 층에는 변화 가능성이 조금 높아 강해진 토착 포식자가 산다. (BW §21)
    source: BW §21 · BW §27
    world_shape: 플레이어보다 정면 전투력이 우위인 존재가 있고, 그 우위를 힘이 아니라 관찰·예측· 위치 선택으로 뒤집을 수 있어야 한다. 스탯을 올려야만 이길 수 있으면
      이 층이 아니다.
    implemented: PARTIAL
    implemented_note: 정면 전투력이 우위인 적대 존재는 있다. 그것이 사는 층이 없고, 우위를 힘 아닌 것으로 뒤집을 수단도 없다
    arises_from: [ MW-DEPTH-GRADIENT ]
    causes: [ MG-OVERCOME-SUPERIOR-OPPONENT, MG-SURVIVE-ENEMY-OFFENSIVE, MG-HOLD-HUNTING-GROUND ]
    changed_by: []
    demands: [ MC-OBSERVE, MC-PREDICT, MC-USE-TERRAIN ]
  - id: MW-ZONE-WILD
    type: world_state
    statement: 그 안쪽 층에는 특수 갑각·독·비정상적 감각·특수 이동을 가진 생물이 산다. (BW §22)
    source: BW §22 · BW §27
    world_shape: 기본 공격이 통하지 않는 방어 형태를 가진 존재가 있고, 그 존재의 몸에서 인간이 쓸 수 있는 것이 나와야 한다. 그리고 그 소재의 쓸모가 그 생물의 적응과
      이어져야 한다.
    implemented: ABSENT
    implemented_note: 깊이도 층도 없다
    arises_from: [ MW-DEPTH-GRADIENT ]
    causes: [ MG-ACQUIRE-RARE-ORGAN ]
    changed_by: []
    demands: [ MC-BREAK, MC-DISCOVER-WEAKNESS, MC-PRECISE-TARGETING, MC-CONTROL-SPACE ]
  - id: MW-ZONE-DANGER
    type: world_state
    statement: 더 안쪽에서는 생물과 환경을 따로 떼어 볼 수 없다 — 위험·생물·지형이 한 덩어리다. (BW §23)
    source: BW §23
    world_shape: 플레이어와 상대 모두에게 작용하는 환경 위험이 존재하고, 그것을 누가 더 잘 쓰는가가 승패를 가를 수 있어야 한다. 환경이 그냥 장식이거나 플레이어에게만
      불리하면 이 층이 아니다.
    implemented: ABSENT
    arises_from: [ MW-DEPTH-GRADIENT ]
    causes: []
    changed_by: []
    demands: [ MC-READ-ENVIRONMENT, MC-FORCE-MOVEMENT, MC-USE-HAZARD, MC-INTERRUPT ]
  - id: MW-ZONE-DEEP
    type: world_state
    statement: 더 깊은 곳에서는 인간의 전투 상식이 무너진다. (BW §24)
    source: BW §24
    world_shape: 단순히 체력을 0 으로 만드는 것으로는 해결되지 않는 상대가 있어야 하고, 그 상대를 무력화하는 방법이 상대의 구조를 이해한 결과여야 한다.
    implemented: ABSENT
    arises_from: [ MW-DEPTH-GRADIENT ]
    causes: []
    changed_by: []
    demands:
      [
        MC-DISCOVER-WEAKNESS,
        MC-DISRUPT-ABILITY,
        MC-MAINTAIN-PRESSURE,
        MC-TARGET-SPECIFIC-PART,
        MC-READ-CREATURE-SYSTEM
      ]
  - id: MW-ZONE-UNKNOWN
    type: world_state
    statement: 가장 깊은 곳에서는 세계압이 기억·감각·인식·정체성·공간까지 변화시킨다. (BW §25)
    source: BW §25
    world_shape: 플레이어가 보고 있는 정보 자체가 훼손될 수 있어야 하고, 그것을 의심하고 검증하는 수단이 있어야 한다. 표현만 기괴하고 판정은 여전히 체력 깎기면 이 층이 아니다.
    implemented: ABSENT
    arises_from: [ MW-DEPTH-GRADIENT ]
    causes: []
    changed_by: []
    demands:
      [
        MC-PROTECT-PERCEPTION,
        MC-VERIFY-REALITY,
        MC-IDENTITY-ANCHOR,
        MC-RESIST-INFLUENCE,
        MC-BREAK-BIOLOGICAL-LINK,
        MC-ESCAPE-ALTERED-SPACE
      ]
  - id: MW-HYPER-PREDATION
    type: world_state
    statement: 어떤 베이라 지역에서는 포식 경쟁이 극단적이어서 생명체가 일상적으로 치명적인 육체 손상을 입는다. (BW §8)
    source: BW §8 · BW §9
    world_shape: 이 지역의 존재들이 일상적으로 심각한 손상을 주고받는 것이 관찰되어야 하고, 거기서 나오는 자원의 효과가 그 손상 압력에 대한 답으로 읽혀야 한다. 좋은
      회복 아이템이 위험한 지역에 놓여 있는 것으로 보이면 실패다.
    implemented: ABSENT
    implemented_note: 대표 지역 둘 다 없다
    arises_from: [ MW-FREE-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-SPATIAL-SHEAR
    type: world_state
    statement: 어떤 지역에서는 공간 자체의 경계가 반복적으로 어긋나 대부분의 물질이 소멸한다. (BW §10)
    source: BW §10
    world_shape: 이 지역에서 일반 물질이 실제로 소멸하는 것이 관찰되어야 하고, 살아남은 광물의 쓸모가 "구조를 유지한다" 는 그 성질에서 곧바로 나와야 한다.
    implemented: ABSENT
    implemented_note: 대표 지역 둘 다 없다
    arises_from: [ MW-FREE-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-MACRO-TERRAIN
    type: world_state
    statement: 베이라의 대지는 하나의 원리가 어떤 매질에 대륙 규모로 결속되어 형성된 대지형들로 나뉜다. (BT §1)
    source: BT §1 · BT §12 · BT §3 · · BT §1 · §15 · BT §4~§11 · BT §16
    world_shape: 서로 다른 법칙을 가진 땅이 여럿 존재하고, 각 땅에서 위험한 것과 값진 것이 같은 법칙으로 설명되어야 한다. 그리고 어느 땅에 갈 수 있는가가 수치가
      아니라 무엇을 감당할 수 있게 되었는가로 정해져야 한다 (BT §12). 한 땅 안에 머물 수 있는 자리와 감당할 수 없는 심부가 함께 있어야 한다 — 깊이와 직교한다는
      것이 그 뜻이다 (BT §3 · HISTORY Q47(a)).
    implemented: PARTIAL
    implemented_note: "땅이 자리로 나뉘고 그 자리가 법칙을 지닌다 (C-TERRAIN-001 — World.GroundZones ·
      GroundLawDefinition). 남은 것은 world_shape 의 나머지다: 법칙이 하나뿐이고, 그 법칙이 낳는 자원이 없으며, 어디에 갈 수 있는가가 감당으로
      정해지지 않고, 깊이와의 직교도 아직 없다"
    arises_from: [ MW-FREE-PRESSURE, MW-BOUND-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-TERRAIN-CIRCULATION
    type: world_state
    statement: 한 대지형의 지배 원리는 수천 년 반복되며, 그 땅이 무언가를 거두고 쌓고 되돌리는 되풀이를 만든다 — 그것이 대지 순환이다. (BT §15.3 · §16)
    source: BT §15.3 · §16 · BT §15.2 · BT §15
    world_shape: 같은 자리를 다른 시각에 보면 달라야 하고, 그 다름이 무작위가 아니라 그 사이에 무슨 일이 있었는가로 설명되어야 한다. 그 땅이 거두어 간 것이 지금
      어디에 있는지를 물을 수 있어야 하고, 세계가 그 물음에 답을 지녀야 한다.
    implemented: PRESENT
    implemented_note: C-TERRAIN-002 — 자리가 거둔 것을 지니고(kept), 넘치면 뿜고, 그 안의 몸에게 돌려주고, 다 쓰면 닫혀 도로 거둔다. 같은 자리를
      다른 시각에 보면 다르고 그 다름이 "그 사이에 누가 거기서 얼마나 빼앗겼는가" 로 설명된다 — 주기는 세계가 정한 것이 아니다
    arises_from: [ MW-MACRO-TERRAIN ]
    causes: [ MG-EXPLORE-BEIRA ]
    changed_by: []
  - id: MW-SHAPED-LANDFORM
    type: world_state
    statement: 순환이 수천 년 되풀이되면 산맥과 수계와 대기가 그 순환의 모양으로 빚어진다 — 지형의 생김새는 법칙이 남긴 자국이다. (BT §15.3 · §16)
    source: BT §15.3 · §16
    world_shape: 땅의 생김새를 보고 그 땅의 법칙을 짐작할 수 있어야 한다. 같은 법칙이 도는 곳은 비슷하게 생기고, 법칙이 다른 곳은 다르게 생겨야 한다.
    implemented: PARTIAL
    implemented_note: 자리의 배치가 손이 아니라 순환의 원리(씨앗·법칙)에서 나온다 — 맥은 흩어진 점이 아니라 이웃으로 뻗은 밭이다 (C-TERRAIN-003). 남은
      것은 생김새 자체 — 산맥·수계· 대기가 없고 무대는 여전히 평면이며, 선 것은 자리의 분포까지다
    arises_from: [ MW-TERRAIN-CIRCULATION ]
    causes: []
    changed_by: []
  - id: MW-SURVIVAL-PRESSURE
    type: world_state
    statement: 대지 순환은 그 땅에 있는 몸과 인식과 이동에 끊임없이 작용한다 — 그것이 생존 압력이다. (BT §15.4 · §16 · BW §11)
    source: BT §15.4 · §16 · · BW §11 · BT §15.4
    world_shape: 그 땅에서 겪는 나쁜 일이 그 땅의 법칙으로 설명되어야 하고, 법칙을 읽은 사람과 읽지 못한 사람이 같은 자리에서 다른 결과를 내야 한다. 아무것도 하지
      않고 서 있기만 해도 무언가가 일어나야 한다.
    implemented: PARTIAL
    implemented_note: 'C-TERRAIN-002 로 압력이 순환에서 나온다 — 어디가 거두고 어디가 돌려주는지가 내가 한 일의 결과이므로 읽어서 이용할 거리가 생겼다.
      남은 절반은 world_shape 의 "읽은 사람과 읽지 못한 사람이 다른 결과를 낸다" 다: 지금 상태는 읽히나 앞으로 일어날 일은 읽히지 않는다
      (MW-CIRCULATION-EVIDENCE 가 그 자리다)'
    arises_from: [ MW-TERRAIN-CIRCULATION, MW-SHAPED-LANDFORM ]
    causes: []
    changed_by: []
  - id: MW-ADAPTED-LIFE
    type: world_state
    statement: 생존 압력 아래에서 생명과 물질은 그 압력에 적응한 형태로만 남는다 — 무엇이 어디에 있는가는 순환의 결과다. (BT §16 · BW §11)
    source: BT §16 · · BW §11 · BT §5.3
    world_shape: 어떤 생명이나 물질이 왜 하필 거기 있는지를 그 땅의 법칙으로 답할 수 있어야 한다. 순환이 달라지면 무엇이 어디에 있는지도 따라 달라져야 한다 — 그러지
      않으면 그것은 적응이 아니라 배치다.
    implemented: ABSENT
    implemented_note: 세계에 있는 것은 좌표로 놓인 방랑자 둘과 광맥 하나뿐이고 셋 다 땅의 법칙과 무관한 자리에 있다. 놓는 것 말고 다른 길이 세계에 없다
    arises_from: [ MW-SURVIVAL-PRESSURE ]
    causes: []
    changed_by: []
  - id: MW-NATURAL-REFUGE
    type: world_state
    statement: 순환은 자기 법칙이 멎는 자리를 스스로 만든다 — 자연적 예외는 법칙에 저항하는 것이 아니라 법칙이 낳은 것이다. (BT §15.5 · §16)
    source: BT §15.5 · §16 · BT §15.5 · BT §5.3 · BT §15.6
    world_shape: 법칙이 멎는 자리가 있어야 하고, 그 자리가 왜 하필 거기인가에 세계가 답해야 한다. 그리고 조건이 달라지면 그 자리가 옮겨 가거나 사라져야 한다.
    implemented: PRESENT
    implemented_note: C-TERRAIN-002 — 예외를 놓을 형이 사라졌다(GroundZone.role 삭제). 법칙이 멎는 자리는 넘쳐서 뿜는 중인 맥뿐이므로 "왜
      하필 거기가 안전한가" 에 세계가 답한다 — 거기에 열이 모였기 때문이고, 모인 것은 누군가 거기서 빼앗겼기 때문이다. 그리고 생겨나고 사라진다
    arises_from: [ MW-TERRAIN-CIRCULATION ]
    causes: []
    changed_by: []
  - id: MW-TERRAIN-RESOURCE
    type: world_state
    statement: 그 땅의 위험을 만든 것과 같은 법칙이 인간 세계에 없는 Property 를 남긴다 — 그것이 그 땅의 자원이다. (BT §15.7 · BW §11)
    source: BT §15.7 · · BW §11 · BT §15.7 · BW §6 · §36
    world_shape: 어떤 물건이 왜 하필 그 땅에서만 나는지를 그 땅의 법칙으로 답할 수 있어야 한다. 그리고 그것을 캐어 가는 일이 그 땅의 순환에 되돌아가야 한다 —
      되돌아가지 않으면 그것은 자원이 아니라 채집물이다.
    implemented: ABSENT
    implemented_note: 캘 수 있는 것은 광맥의 돌 하나뿐이고, 그것은 어떤 법칙이 낳은 것이 아니라 좌표에 놓인 것이다. 캐어도 세계에 아무 되돌림이 없다
    arises_from: [ MW-SURVIVAL-PRESSURE, MW-ADAPTED-LIFE ]
    causes: []
