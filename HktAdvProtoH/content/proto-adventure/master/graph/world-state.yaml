      하늘로 떨어지는 산맥 — 은빛 광맥이 물과 느슨한 물체의 낙하 방향을 세계압의 흐름에
      결속해, 강이 하늘로 떨어지고 정상에 바다가 매달린 땅이다. (BT §8)
    detail: >
      이곳에서 아래쪽은 하나가 아니다. 광맥의 방향에 따라 절벽도, 하늘도, 동굴 천장도
      각각 아래가 될 수 있다 (BT §8.1). 광맥을 넘는 순간 낙하 방향이 바뀌므로 절벽 아래로
      떨어지던 존재가 갑자기 하늘로 추락하고, 상향 폭포가 경로를 바꾸면 계곡 전체가
      휩쓸린다. 방향의 변화는 눈에 직접 보이지 않아서 물방울과 풀잎과 먼지와 작은 생물의
      움직임으로 먼저 알아내야 한다 (BT §8.2). 살 수 있는 자리는 주변 방향을 하나로
      고정하는 검은 정박암 곁이고, 그래서 집은 땅 위가 아니라 절벽 옆과 천장과 바닥을
      함께 쓰는 입체가 된다 (BT §8.3). 핵심 경험은 높은 곳을 오르는 것이 아니라 세계가
      정한 아래쪽을 바꾸는 것이다 (BT §8.7).
    world_shape: >
      낙하 방향이 장소마다 다르고 그 경계가 작은 것들의 움직임으로 읽혀야 한다. 그리고
      그 방향을 사람이 국소적으로 고정하거나 바꿀 수 있어야 하며, 그것이 상대와 날아가는
      것에도 같은 규칙으로 작용해야 한다 (BT §8.7).
