      강을 등에 지고 이동하는 땅이다. (BT §9)
    detail: >
      압력이 풍부한 장소를 찾아 움직이는 구조를 얻은 암반이 느린 이동 능력을 갖추고,
      그 등에 토양과 수계가 쌓여 하나의 생명체가 대지형으로 자랐다 (BT §9.1). 등껍질의
      골과 움푹한 지대에는 물과 흙이 고여 사람이 산다. 그러나 방향 전환, 탈피, 수면에서
      깨어남, 다른 유랑대지와의 충돌, 기생 생물의 침입, 세계압이 부족한 지역에서의 굶주림이
      한순간에 그 자리를 위험하게 만든다 (BT §9.2). 지도가 바뀌는 것이 아니라 지도 자체가
      살아 움직이므로, 먼 산의 위치가 매일 달라지고 계곡 전체가 천천히 열리고 닫힌다
