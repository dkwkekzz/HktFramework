  - id: MW-TERRAIN-NAME-EATING-FOREST
    type: world_state
    statement: >
      이름을 먹는 수해 — 하나의 뿌리망으로 이어진 나무들이 서로를 구분하려고 Identity 를
      기록하고, 기록되지 않은 생명을 자기 일부로 삼는 땅이다. (BT §6)
    detail: >
      초기의 나무들은 서로를 구별하지 못해 같은 숲의 생명까지 흡수했고, 살아남은 쪽은
      개체를 구분하는 표식을 뿌리에 새기기 시작했다 (BT §6.1). 그래서 이 숲은 발을 들인
      것의 이름과 존재 표식을 천천히 읽고, 숲에 등록되지 않은 존재는 점차 주변에서
      인식되지 않게 된다. 위험은 죽는 것이 아니라 세상에서 개인으로 구분되지 않게 되는
      것이다 — 동료가 이름을 잊고, 얼굴을 기억하지 못하고, 소지품의 주인을 알 수 없게
      되다가, 마침내 숲이 그 존재를 자기 일부로 흡수한다 (BT §6.2). 살 수 있는 자리는
      수천 년 동안 자기 Identity 를 지킨 명목수 주변과 뿌리가 닿지 못하는 부유암 위다
      (BT §6.3). 이 땅이 보이는 것은 세계압이 몸과 물질뿐 아니라 기억·인식·Identity
      같은 것에도 작용한다는 사실이다 (BT §6.1).
    world_shape: >
      존재가 단계적으로 지워지는 과정이 관찰되어야 한다 — 지워진 글자, 기록마다 다른
      동료의 수, 나무껍질에 겹친 얼굴. 그리고 자신이 누구인지를 계속 증명하는 수단이
      있어야 한다. 즉시 죽거나 아무 일도 없거나 둘뿐이면 이 지형이 아니다.
    implemented: ABSENT
    implemented_note: >-
      존재의 신원이라는 것이 세계에 없다
    arises_from: [MW-MACRO-TERRAIN]
