      world_shape 가 요구하는 풍경이 없다: 열이 어디로 이동하는지의 증거(검은 빛 · 서리 무늬 · 얼어붙은 거수)가 하나도 없고, 거둔 열이 어디에도 저장되지
      않아 해숨구멍이 원인 없이 놓여 있다"
