    # MC-BREAK 는 전투 노드 재사용이다 (semantic 을 방어 구조 전반으로 넓혀 둔 것).

  - id: MW-ZONE-DANGER
    type: world_state
    statement: >
      더 안쪽에서는 생물과 환경을 따로 떼어 볼 수 없다 — 위험·생물·지형이 한 덩어리다. (BW §23)
    detail: >
      앞의 두 층에서는 "상대" 가 있고 "장소" 가 배경이었다. 이 층에서는 장소가 상대의
      일부다. 지형 자체가 해를 입히고, 생물이 그 지형을 자기 편으로 쓰고 있으며,
      플레이어도 그것을 자기 편으로 쓸 수 있다. 그래서 필요한 것은 환경을 읽고,
      위험 요소를 자기 수단으로 쓰고, 상대를 그리로 몰고, 상대의 행동을 끊는 능력이다.
      자원도 이때부터 특정 환경의 성질을 몸에 지닌 채로 나온다 (BW §23).
    world_shape: >
      플레이어와 상대 모두에게 작용하는 환경 위험이 존재하고, 그것을 누가 더 잘 쓰는가가
      승패를 가를 수 있어야 한다. 환경이 그냥 장식이거나 플레이어에게만 불리하면 이 층이 아니다.
    implemented: ABSENT
