  - id: MW-TERRAIN-SUNEATER-ICEFIELD
    type: world_state
    statement: 해를 삼킨 빙원 — 대지 아래의 검은 광맥이 주변의 열을 결정 안에 결속해, 얼음 속에 수천 개의 작은 태양이 갇힌 땅이다. (BT §5)
