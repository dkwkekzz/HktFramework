      흰 갈비뼈 안쪽에 도시와 강과 숲이 자라난 땅이다. (BT §4)
    detail: >
      먼 옛날 베이라를 떠돌던 거대한 생명체가 이곳에서 죽었고, 살아 있을 때 제 몸의
      형태를 유지하려고 주변의 과도한 세계압을 몸 안에 결속하던 골격이 그대로 남았다
      (BT §4.1). 그 뼈가 지금도 급격한 변화를 흡수하기 때문에 갈비뼈 안쪽에서는 변화의
      폭이 좁아지고, 강과 토양과 숲이 오래 유지된다. 들어오는 길이 척추 사이의 몇 개
      협곡뿐이라는 것과 뼈가 내는 낮은 울림을 견디지 못하는 외래 생물이 있다는 것이
      그 안정을 지킨다 (BT §4.2). 도시가 이곳을 안전하게 만든 것이 아니라 백왕의 유해가
      허용한 안정 위에 도시가 자라났다는 순서가 이 지형의 요점이다. 평범한 시작 마을이
      아니라 원정을 꾸리고, 돌아온 자의 증언을 모으고, 바깥에서 가져온 것을 감별하고
      거래하는 자리다 (BT §4.6).
    world_shape: >
