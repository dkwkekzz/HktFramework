  - id: MW-TERRAIN-SUNEATER-ICEFIELD
    type: world_state
    statement: >
      해를 삼킨 빙원 — 대지 아래의 검은 광맥이 주변의 열을 결정 안에 결속해, 얼음 속에
      수천 개의 작은 태양이 갇힌 땅이다. (BT §5)
    detail: >
      이곳이 추운 것은 위도가 높아서가 아니라 대지가 살아 있는 모든 것으로부터 열을
      거두어 가기 때문이다 (BT §5.1). 광맥은 일정한 속도로 흡수하지 않는다 — 굵기와
      포화 상태와 지하 흐름에 따라 어느 순간 주변의 열을 한꺼번에 빼앗고, 멀쩡히 걷던
      생물이 그대로 얼어붙는다. 얼어 죽는 것보다 위험한 것은 열을 잃었다는 사실을 즉시
      느끼지 못하는 것이고, 일부 구역에서는 차갑다는 감각까지 함께 결속된다 (BT §5.2).
      살 수 있는 자리는 포화된 광맥이 흡수한 열을 도로 뿜는 해숨구멍 주변과, 빙원을
      횡단하는 거대한 털짐승이 지나간 자리다 (BT §5.3). 그래서 이 땅의 핵심 경험은
      추위를 버티는 것이 아니라 대지가 열을 어디에서 빼앗고 어디에 저장하는지를 읽는
      것이다 (BT §5.7).
    world_shape: >
      열이 어디로 이동하는지가 풍경으로 보여야 한다 — 얼음 아래의 검은 빛, 원형 서리
      무늬, 그 자세 그대로 얼어붙은 거수. 그리고 그것을 읽은 사람과 읽지 못한 사람이
      같은 길에서 다른 결과를 내야 한다.
    implemented: PARTIAL
    implemented_note: >-
