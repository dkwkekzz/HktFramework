# Master WorldState — MW-*
# 세계에서 현재 참인 의미 있는 상태. Goal 과 Possibility 를 발생시키는 원인이 될 수 있다.
# 자료구조가 아니다 — 자료구조는 Cycle 의 03-world-semantic.md 가 소유한다.
# 형식: ../SCHEMA.md
#
# 인용 표기 — BW §x = design/Master-World-Beira.md.
#
# ── 이 파일을 읽는 법 ────────────────────────────────────────────────────
# arises_from 이 세계의 인과 척추다. 위에서 아래로 읽으면 BW §30 의
# "베이라 Graph 의 최상위 인과" 가 그대로 나온다.
#
#   MW-PRIMAL-WORLD                     세계는 본래 변할 수 있다
#     └ MW-WORLD-PRESSURE               그 변화 가능성이 지금도 밀고 있다
#         ├ MW-FREE-PRESSURE            아직 아무것으로도 굳지 않은 몫  → 위험
#         │   ├ MW-DEPTH-GRADIENT       깊이별로 이 몫이 다르다
#         │   │   ├ MW-ZONE-FRINGE ─ WILD ─ DANGER ─ DEEP ─ UNKNOWN
#         │   ├ MW-HYPER-PREDATION      극단적인 포식 경쟁이 벌어지는 지역
#         │   └ MW-SPATIAL-SHEAR        공간의 경계가 어긋나는 지역
#         ├ MW-BOUND-PRESSURE           무언가의 성질로 굳은 몫      → 자원
#         └ MW-SAFE-FRONTIER            굳어서 조용해진 영역          → 문명
#
# 위험(FREE)과 자원(BOUND)이 같은 부모(MW-WORLD-PRESSURE)를 갖는 것이
# 이 세계의 핵심 주장이다 (BW §6 · §36). 그래서 둘을 형제로 세웠다.
version: 1
nodes:

  # ══ 최상위 전제 (BW §30) ═══════════════════════════════════════════════
  # 이 둘은 "상태" 라기보다 세계의 성질이다 — root.md 의 WORLD PREMISE 와 겹친다.
  # 그럼에도 노드로 두는 이유는 BW §30 이 이 둘을 그래프의 뿌리로 직접 명명했고,
  # 아래 모든 노드가 여기에 arises_from 으로 매달려야 인과가 추적되기 때문이다.

  - id: MW-PRIMAL-WORLD
    type: world_state
    statement: >
      세계는 본래 높은 변화 가능성을 가진다. (BW §30)
    detail: >
      이 세계의 기본값은 안정이 아니라 변화다. 생명과 물질이 지금의 모습에 머무는 것이
      자연스러운 것이 아니라, 무언가가 그것을 붙잡고 있을 때만 머문다. 인간이 사는
      문명권이 조용한 것은 세계가 원래 조용해서가 아니라 그 지역의 변화 가능성이
      이미 다 쓰이고 굳었기 때문이다. 이 전제가 무너지면 베이라는 그냥 "몬스터가 센
      지역" 이 되고, 위험과 보물이 같은 뿌리라는 이 게임의 주장도 함께 무너진다.
    world_shape: >
      직접 관찰되는 상태가 아니다 — 세계의 전제이므로 다른 모든 MW-* 가 이것에서
      내려온다는 사실로만 확인된다. 게임 안에 이것을 보여주는 표면은 없어야 한다.
    implemented: PRESENT
    implemented_note: >-
      전제이므로 어긋나는 규칙이 없으면 성립
    # 전제는 구현 대상이 아니다 — 어긋나는 규칙이 없으면 성립한 것으로 본다.
    arises_from: []
    causes: []
    changed_by: []

  - id: MW-WORLD-PRESSURE
    type: world_state
    statement: >
      세계압이 생명과 물질을 현재 상태 너머로 변화시킬 수 있도록 밀고 있다. (BW §3)
    detail: >
      세계압은 마나 같은 에너지 자원이 아니다. 쓰거나 모으거나 발사하는 것이 아니라,
      "이 생명은 지금과 다른 것이 될 수 있다" 는 가능성의 크기다. 세계압이 높은 곳에서는
      환경이 극단으로 치닫고, 그래서 생존 경쟁이 극단이 되고, 그래서 인간의 상식으로는
      불가능한 성질을 가진 것들이 태어난다 (BW §3). 중요한 것은 이 하나의 압력이
      갈라져서 위험과 자원 **양쪽**을 만든다는 점이다 — 아래 두 자식 노드가 그 갈래다.
    world_shape: >
      세계압 자체가 수치로 노출될 필요는 없다. 대신 지역마다 "여기는 얼마나 변할 수
      있는 곳인가" 가 그 지역의 생태·자원·위험으로 일관되게 드러나야 하고,
      위험이 큰 곳에서 나온 것일수록 인간 세계에 없는 성질을 지녀야 한다.
    implemented: ABSENT
    implemented_note: >-
      지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    # 지역이라는 개념 자체가 세계에 없다 — overlay.md 탐험 영역 참조.
    arises_from: [MW-PRIMAL-WORLD]
    causes: []
    changed_by: []

  # ══ 세계압의 두 갈래 (BW §5) ═══════════════════════════════════════════
  # BW §5 가 "세계압을 두 상태로 구분한다" 고 직접 나눈 것이다.
  # 이 둘이 형제라는 사실이 BW §6 "위험과 보물은 같은 세계압의 서로 다른 결과다" 다.

  - id: MW-FREE-PRESSURE
    type: world_state
    statement: >
      아직 어떤 생명이나 물질의 안정된 성질로도 굳지 않은 세계압이 남아 있다. (BW §5)
    detail: >
      굳지 않은 세계압(Free World Pressure)은 계속 무언가를 바꾸고 있는 몫이다.
      환경이 가만히 있지 않으니 생물도 가만히 있을 수 없고, 그래서 생태가 안정되지
      못한 채 적응 경쟁이 끝나지 않는다. 이것이 베이라의 위험을 만드는 쪽이다.
      주의할 것은 이것이 "몬스터가 강함" 을 뜻하지 않는다는 점이다 — 강한 것이 아니라
      **예측할 수 없는** 것이 위험의 정체다. 무엇이 나올지 세계 자신도 정하지 않았다.
    world_shape: >
      같은 지역이라도 시간·상황에 따라 무엇을 만날지, 그것이 어떤 성질을 지녔을지가
      고정되어 있지 않아야 한다. 플레이어가 "이 지역에는 이것이 나온다" 를 한 번 외워
      영구히 해결되면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: >-
      지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    arises_from: [MW-WORLD-PRESSURE]
    causes: []
    changed_by: []

  - id: MW-BOUND-PRESSURE
    type: world_state
    statement: >
      일부 세계압은 생명이나 물질의 특수한 성질로 굳어 안정적으로 정착해 있다. (BW §5)
    detail: >
      굳은 세계압(Bound World Pressure)은 어떤 생명이나 물질이 극단적인 압력을 견디는
      과정에서 하나의 성질로 붙잡아 고정시킨 몫이다. 특수한 생물 기관, 특수한 식물,
      특수한 광물이 전부 이 결과다. 인간 입장에서 자원이 되는 것은 정확히 이쪽이다
      (BW §5). 그러므로 자원은 세계가 뿌려 둔 보상이 아니라 **누군가가 살아남은 흔적**
      이고, 그 자원이 무엇을 할 수 있는지는 그것이 무엇을 견디고 살아남았는지로 정해진다.
    world_shape: >
      가치 있는 자원마다 그것이 어떤 환경의 어떤 압력을 견딘 결과인지가 세계 안에서
      추적 가능해야 한다. 자원의 효과가 그 유래와 무관한 수치 보너스(공격력 +N)로만
      드러나면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: >-
      지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    arises_from: [MW-WORLD-PRESSURE]
    causes: []
    changed_by: []

  # ══ 인간이 사는 쪽 (BW §13 · §14 · §20) ════════════════════════════════

  - id: MW-SAFE-FRONTIER
    type: world_state
    statement: >
      플레이어가 출발하는 문명권은 굳지 않은 세계압이 적어 생태가 예측 가능하다. (BW §14)
    detail: >
      문명권은 세계압이 없는 곳이 아니다. 그 지역의 변화 가능성이 이미 대부분 쓰이고
      굳어서 더 이상 크게 변하지 않는 상태다 (BW §13). 그래서 장기 예측이 가능하고
      정착이 가능하고 문명이 생겼다 — 인간이 세계를 안전하게 만든 것이 아니라,
      안정된 세계였기 때문에 인간의 문명이 가능했다는 순서다. 여기서는 휴식·교역·제작·
      정보 획득·관계·훈련·거래·성장 경로 탐색·탐험 준비를 할 수 있다 (BW §14).
      그리고 바로 그 안정 때문에, 여기서 아무리 기술을 발전시켜도 얻을 수 없는 것들이
      있다 (BW §7). 그 결핍이 플레이어를 밖으로 내보낸다.
    world_shape: >
      플레이어가 위험 없이 머물며 준비할 수 있는 장소가 존재하고, 그곳에서 할 수 있는
      일(거래·제작·정보·훈련)과 그곳에서는 결코 얻을 수 없는 것이 명확히 갈려야 한다.
      "여기서도 결국 다 되는데 밖이 효율만 좋다" 면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: >-
      안전한 곳과 위험한 곳의 구분이 없다 — 무대가 하나다
    # 현재 세계는 무대 하나짜리 전투 프로토타입이라 "안전한 장소" 라는 구분이 없다.
    arises_from: [MW-BOUND-PRESSURE]
    causes: [MG-EXPLORE-BEIRA]
    changed_by: []
    demands: [MC-COMBAT-STRIKE, MC-GUARD, MC-EVADE, MC-REPOSITION]
    # BW §20 — 평범한 생태·예측 가능한 전투를 감당하는 기본기.
    # 앞의 셋은 기존 전투 노드 재사용이다 (MC-ATTACK ≙ MC-COMBAT-STRIKE ·
    # MC-DEFEND ≙ MC-GUARD · MC-EVADE 그대로) — HISTORY Q18(a).

  # ══ 베이라의 깊이 (BW §19) ═════════════════════════════════════════════

  - id: MW-DEPTH-GRADIENT
    type: world_state
    statement: >
      베이라는 깊이 들어갈수록 굳지 않은 세계압이 높아지는 기울기를 가진다. (BW §19)
    detail: >
      바깥에서 안쪽으로 FRINGE · WILD · DANGER · DEEP · UNKNOWN 순으로 깊어지고,
      그 너머에는 이름조차 붙지 않은 영역이 남아 있다. 깊어질수록 위험해지지만 동시에
      더 기적적인 것이 태어날 가능성도 커진다 — 하나의 축이 양쪽을 함께 올린다.
      두 가지를 헷갈리면 안 된다. 첫째, 이것은 거리 공식이 아니다. 지역마다 국지적인
      사정이 달라서 얕은 곳에 이상한 것이 있을 수도 있다 (BW §19). 둘째, 세계압은
      가능성을 늘릴 뿐 전리품을 보장하지 않는다 — 위험한 곳에 갔다고 반드시 값진 것을
      얻는 것이 아니다 (BW §12). 깊이를 보상 등급표로 만들면 이 노드는 배신당한다.
    world_shape: >
      깊이가 다른 영역이 여럿 존재하고, 각 영역이 요구하는 대응이 질적으로 달라야 한다
      (같은 대응의 난이도만 올라가는 것이 아니다). 그리고 깊은 곳에 갔는데 아무것도
      얻지 못하는 일이 정상적으로 일어나야 한다.
    implemented: ABSENT
    implemented_note: >-
      깊이도 층도 없다
    arises_from: [MW-FREE-PRESSURE]
    causes: []
    changed_by: []
    # 각 층의 생태와 그 층이 요구하는 것(demands)은 아래 MW-ZONE-* 5종이 소유한다 —
    # BW §21~§25 의 "필요:" 목록이 그 원본이다.
    # SAFE FRONTIER 층은 MW-SAFE-FRONTIER 가 그 자리다 (BW §14 · §20).

  # ══ 깊이별 층 (BW §21~§25) ═════════════════════════════════════════════
  # BW 가 한 절씩 서술한 세계 사실이다. 각 층의 demands 가 그 절의 "필요:" 목록이다.
  #
  # demands 는 "그곳을 감당하려면 무엇이 필요한가" 이지 "어떻게 가는가" 가 아니다.
  # 어떻게 감당할 것인가는 MG-EXPLORE-BEIRA 아래의 방법 3종이 소유한다
  # (익힌다 · 자원으로 빌린다 · 문명권에서 준비한다). 같은 층을 여러 방법으로
  # 감당할 수 있다는 것이 이 분리의 요점이다.

  - id: MW-ZONE-FRINGE
    type: world_state
    statement: >
      베이라의 바깥 층에는 변화 가능성이 조금 높아 강해진 토착 포식자가 산다. (BW §21)
    detail: >
      가장 얕은 층이다. 여기의 위협은 이상한 성질이 아니라 그냥 강한 짐승이다 —
      인간의 전투 상식이 아직 통한다. 다만 정면으로 힘을 겨루면 진다. 그래서 이 층이
      요구하는 것은 더 센 공격이 아니라 보고·읽고·지형을 쓰는 정보의 능력이다.
      이 층의 포식자는 자기 사냥터에 들어온 것을 사냥감으로 본다. 그래서 플레이어에게
      "길을 막는 상대" 와 "나를 쫓는 상대" 라는 두 종류의 문제가 동시에 생긴다 (BW §27).
    world_shape: >
      플레이어보다 정면 전투력이 우위인 존재가 있고, 그 우위를 힘이 아니라 관찰·예측·
      위치 선택으로 뒤집을 수 있어야 한다. 스탯을 올려야만 이길 수 있으면 이 층이 아니다.
    implemented: PARTIAL
    implemented_note: >-
      정면 전투력이 우위인 적대 존재는 있다. 그것이 사는 **층**이 없고, 우위를 힘 아닌 것으로 뒤집을 수단도 없다
    # 적대 존재와 정면 전투는 있다 (C007~C013). 관찰·예측·지형이라는 뒤집는 수단이 없고,
    # 이 층이 지역으로 존재하지도 않는다. 근거는 overlay.md.
    arises_from: [MW-DEPTH-GRADIENT]
    causes: [MG-OVERCOME-SUPERIOR-OPPONENT, MG-SURVIVE-ENEMY-OFFENSIVE, MG-HOLD-HUNTING-GROUND]
    changed_by: []
    demands: [MC-OBSERVE, MC-PREDICT, MC-USE-TERRAIN]
    # BW §21 — 힘이 아니라 정보로 우위를 뒤집는 층이다.

  - id: MW-ZONE-WILD
    type: world_state
    statement: >
      그 안쪽 층에는 특수 갑각·독·비정상적 감각·특수 이동을 가진 생물이 산다. (BW §22)
    detail: >
      여기서부터 정보만으로는 부족해진다. 상대가 인간의 무기 상식에 맞지 않는 몸을
      가지고 있어서, 보고 예측해도 때릴 방법이 없는 경우가 생긴다. 그래서 방어를 깨고,
      약점을 찾아내고, 노린 곳에 정확히 넣고, 상대가 쓸 공간을 좁히는 개입의 능력이
      필요해진다 (BW §22). 동시에 이 층이 인간에게 값진 특수 생물 소재가 본격적으로
      등장하는 첫 층이다 — 이 생물들을 그렇게 만든 적응이 곧 자원이기 때문이다.
      그래서 여기서 "저 기관이 필요하다" 는 목적이 처음 생긴다 (BW §27).
    world_shape: >
      기본 공격이 통하지 않는 방어 형태를 가진 존재가 있고, 그 존재의 몸에서 인간이
      쓸 수 있는 것이 나와야 한다. 그리고 그 소재의 쓸모가 그 생물의 적응과 이어져야 한다.
    implemented: ABSENT
    implemented_note: >-
      깊이도 층도 없다
    arises_from: [MW-DEPTH-GRADIENT]
    causes: [MG-ACQUIRE-RARE-ORGAN]
    changed_by: []
    demands: [MC-BREAK, MC-DISCOVER-WEAKNESS, MC-PRECISE-TARGETING, MC-CONTROL-SPACE]
    # BW §22 — 관찰만으로는 부족해지고 개입이 필요해진다.
    # MC-BREAK 는 전투 노드 재사용이다 (semantic 을 방어 구조 전반으로 넓혀 둔 것).

  - id: MW-ZONE-DANGER
    type: world_state
    statement: >
      더 안쪽에서는 생물과 환경을 따로 떼어 볼 수 없다 — 위험·생물·지형이 한 덩어리다. (BW §23)
    detail: >
      앞의 두 층에서는 "상대" 가 있고 "장소" 가 배경이었다. 이 층에서는 장소가 상대의
      일부다. 지형 자체가 해를 입히고, 생물이 그 지형을 자기 편으로 쓰고 있으며,
      플레이어도 그것을 자기 편으로 쓸 수 있다. 그래서 필요한 것은 환경을 읽고,
      위험 요소를 자기 수단으로 쓰고, 상대를 그리로 몰고, 상대의 행동을 끊는 능력이다.
      자원도 이때부터 특정 환경의 성질을 몸에 지닌 채로 나온다 (BW §23).
    world_shape: >
      플레이어와 상대 모두에게 작용하는 환경 위험이 존재하고, 그것을 누가 더 잘 쓰는가가
      승패를 가를 수 있어야 한다. 환경이 그냥 장식이거나 플레이어에게만 불리하면 이 층이 아니다.
    implemented: ABSENT
    arises_from: [MW-DEPTH-GRADIENT]
    causes: []
    # 이 층이 만드는 구체 Goal 을 BW 가 명명하지 않았다 — WHY 확장 몫이다.
    changed_by: []
    demands: [MC-READ-ENVIRONMENT, MC-FORCE-MOVEMENT, MC-USE-HAZARD, MC-INTERRUPT]
    # BW §23 — 장소가 상대의 일부이므로 환경을 다루는 능력이 요구된다.

  - id: MW-ZONE-DEEP
    type: world_state
    statement: >
      더 깊은 곳에서는 인간의 전투 상식이 무너진다. (BW §24)
    detail: >
      극단적인 재생, 몸 구조를 바꾸는 적응, 여러 개체가 하나처럼 묶인 공생 관계,
      생물이 자기 영역으로 만들어 버린 공간, 공격 자체가 적응해 오는 상대가 여기 있다
      (BW §24). 앞 층까지는 "어떻게 때리는가" 가 문제였다면 여기서는 "때린다는 것이
      무슨 의미인가" 가 흔들린다. 죽여도 돌아오고, 부위를 부숴도 다른 부위가 대신한다.
      그래서 상대를 하나의 체계로 읽고, 그 체계가 성립하는 조건 자체를 끊고, 끊긴 동안
      압박을 유지하고, 특정 부위를 노려야 한다. 특히 강력한 자원이 나오는 층이기도 하다.
    world_shape: >
      단순히 체력을 0 으로 만드는 것으로는 해결되지 않는 상대가 있어야 하고,
      그 상대를 무력화하는 방법이 상대의 구조를 이해한 결과여야 한다.
    implemented: ABSENT
    arises_from: [MW-DEPTH-GRADIENT]
    causes: []
    changed_by: []
    demands: [MC-DISCOVER-WEAKNESS, MC-DISRUPT-ABILITY, MC-MAINTAIN-PRESSURE, MC-TARGET-SPECIFIC-PART, MC-READ-CREATURE-SYSTEM]
    # BW §24 — 상대를 체계로 읽고 그 성립 조건을 끊어야 한다.
    # MC-DISCOVER-WEAKNESS 는 WILD 와 공유한다 (§22 · §24 가 같은 이름을 두 번 든다).

  - id: MW-ZONE-UNKNOWN
    type: world_state
    statement: >
      가장 깊은 곳에서는 세계압이 기억·감각·인식·정체성·공간까지 변화시킨다. (BW §25)
    detail: >
      여기서는 몸이 아닌 것이 공격면이 된다. 인간이 추상적이라고 여기던 것들 —
      기억, 감각, 인식, 자기 자신이라는 감각, 공간, 관계, 행동의 습관 — 이 이 층에서는
      생존을 위해 먹고 뺏고 바꿀 수 있는 대상이다 (BW §25). 그래서 필요한 것은
      지각을 지키고, 지금 보는 것이 실재인지 검증하고, 자기를 붙들어 두고, 간섭에
      저항하고, 생체적으로 묶인 연결을 끊고, 변형된 공간에서 빠져나오는 능력이다.
      그리고 이런 것들을 견디도록 적응한 기관은 인간에게 상상을 초월하는 자원이 된다.
    world_shape: >
      플레이어가 보고 있는 정보 자체가 훼손될 수 있어야 하고, 그것을 의심하고 검증하는
      수단이 있어야 한다. 표현만 기괴하고 판정은 여전히 체력 깎기면 이 층이 아니다.
    implemented: ABSENT
    arises_from: [MW-DEPTH-GRADIENT]
    causes: []
    changed_by: []
    demands: [MC-PROTECT-PERCEPTION, MC-VERIFY-REALITY, MC-IDENTITY-ANCHOR, MC-RESIST-INFLUENCE, MC-BREAK-BIOLOGICAL-LINK, MC-ESCAPE-ALTERED-SPACE]
    # BW §25 — 지켜야 하는 것이 몸이 아니라 지각·정체다.
    # §25 의 "기억을 먹는 생명 · 관찰자를 추적하는 생명" 등은 예시다 — 개체 노드로
    # 세우지 않는다 (지어내지 않는다 · HISTORY Q14 삽화 선례).

  # ══ 대표 지역 — 위험과 자원이 같은 인과에서 나오는 실례 (BW §8~§10) ════
  # 이 두 노드가 BW 전체의 논증 사례다. arises_from 은 위험 쪽(FREE)이고,
  # 각 노드가 낳은 자원은 굳은 쪽(BOUND)이다 — 하나의 지역이 둘을 동시에 만든다.

  - id: MW-HYPER-PREDATION
    type: world_state
    statement: >
      어떤 베이라 지역에서는 포식 경쟁이 극단적이어서 생명체가 일상적으로 치명적인
      육체 손상을 입는다. (BW §8)
    detail: >
      이 지역에서는 몸이 부서지는 것이 사고가 아니라 일상이다. 보통 속도의 회복으로는
      아무도 살아남지 못한다. 그래서 어떤 식물은 "상처를 빨리 낫게 한다" 가 아니라
      전혀 다른 방향으로 적응했다 — **안정되어 있던 이전의 생체 상태를 유지한다**
      는 방향이다 (BW §8). 그 결과물이 회귀초다. 인과의 방향을 뒤집어 읽으면 안 된다.
      회귀초가 특별해서 위험한 곳에 있는 것이 아니라, 그렇게 끔찍한 생태였기 때문에
      회귀초 같은 것이 태어날 수 있었다 (BW §9).
    world_shape: >
      이 지역의 존재들이 일상적으로 심각한 손상을 주고받는 것이 관찰되어야 하고,
      거기서 나오는 자원의 효과가 그 손상 압력에 대한 답으로 읽혀야 한다.
      좋은 회복 아이템이 위험한 지역에 놓여 있는 것으로 보이면 실패다.
    implemented: ABSENT
    implemented_note: >-
      대표 지역 둘 다 없다
    arises_from: [MW-FREE-PRESSURE]
    causes: []
    # 이 지역이 어떤 Goal 을 만드는지는 BW 가 명명하지 않았다 — WHY/OPTIONS 몫.
    changed_by: []
    # 회귀초가 준 능력은 MC-RESTORE-BIOLOGICAL-STATE (capabilities.yaml).

  - id: MW-SPATIAL-SHEAR
    type: world_state
    statement: >
      어떤 지역에서는 공간 자체의 경계가 반복적으로 어긋나 대부분의 물질이 소멸한다. (BW §10)
    detail: >
      공간에 단층이 생기고 어긋나면서 그 안에 있던 것 대부분이 구조를 잃고 사라진다.
      살아남는 것은 공간이 변하는 동안에도 자기 구조의 연속성을 유지하는 특수한 구조뿐이다.
      그렇게 남은 광물이 경계결정이다 (BW §10). 이 광물로 만든 무기는 공격력이 큰 검이
      아니라, 다른 물질의 구조적 연결을 끊거나 정상적이지 않은 방어 구조에도 작용할 수
      있는 무기가 된다 — 그것이 이 광물이 살아남은 방식 그 자체이기 때문이다.
    world_shape: >
      이 지역에서 일반 물질이 실제로 소멸하는 것이 관찰되어야 하고, 살아남은 광물의
      쓸모가 "구조를 유지한다" 는 그 성질에서 곧바로 나와야 한다.
    implemented: ABSENT
    implemented_note: >-
      대표 지역 둘 다 없다
    arises_from: [MW-FREE-PRESSURE]
    causes: []
    changed_by: []
    # 경계결정의 성질은 growth/items/properties/IP-BOUNDARY-STABLE.yaml,
    # 제작물은 growth/items/types/IT-BOUNDARY-BLADE.yaml,
    # 그것이 여는 능력은 MC-CUT-ABNORMAL-STRUCTURE (capabilities.yaml).
