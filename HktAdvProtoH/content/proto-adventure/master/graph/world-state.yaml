# Master WorldState — MW-*
# 세계에서 현재 참인 의미 있는 상태. Goal 과 Possibility 를 발생시키는 원인이 될 수 있다.
# 자료구조가 아니다 — 자료구조는 Cycle 의 03-world-semantic.md 가 소유한다.
# 형식: ../SCHEMA.md
#
# 인용 표기 — BW §x = content/proto-adventure/design/Master-World-Beira.md
#              BT §x = content/proto-adventure/design/Master-World-Beira-Terrain.md (대지형)
#
# ── 이 파일을 읽는 법 ────────────────────────────────────────────────────
# arises_from 이 세계의 인과 척추다. 위에서 아래로 읽으면 BW §30 의
# "베이라 Graph 의 최상위 인과" 가 그대로 나온다.
#
#   MW-PRIMAL-WORLD                     세계는 본래 변할 수 있다
#     └ MW-WORLD-PRESSURE               그 변화 가능성이 지금도 밀고 있다
#         ├ MW-FREE-PRESSURE            아직 아무것으로도 굳지 않은 몫  → 위험
#         │   ├ MW-DEPTH-GRADIENT       깊이별로 이 몫이 다르다
#         │   │   ├ MW-ZONE-FRINGE ─ WILD ─ DANGER ─ DEEP ─ UNKNOWN
#         │   ├ MW-HYPER-PREDATION      극단적인 포식 경쟁이 벌어지는 지역
#         │   └ MW-SPATIAL-SHEAR        공간의 경계가 어긋나는 지역
#         ├ MW-BOUND-PRESSURE           무언가의 성질로 굳은 몫      → 자원
#         └ MW-SAFE-FRONTIER            굳어서 조용해진 영역          → 문명
#
#   FREE 와 BOUND 가 한 땅에서 만나는 자리가 하나 더 있다 (BT 주입):
#
#     MW-MACRO-TERRAIN                  하나의 원리가 매질에 대륙 규모로 결속된 땅
#       ├ MW-TERRAIN-CIRCULATION        그 원리의 반복이 만든 되풀이 — 땅의 시간
#       │   ├ MW-SHAPED-LANDFORM        그 되풀이가 빚은 생김새 (산맥·수계·대기)
#       │   │   └ MW-SURVIVAL-PRESSURE  (아래와 같은 노드 — 부모가 둘이다)
#       │   ├ MW-SURVIVAL-PRESSURE      그 되풀이가 몸·인식·이동에 닿는 방식 → 위험
#       │   │   ├ MW-ADAPTED-LIFE       그 압력에 적응한 것만 남는다 → 무엇이 어디 사는가
#       │   │   └ MW-TERRAIN-RESOURCE   같은 법칙이 남긴 Property → 그 땅의 자원
#       │   ├ MW-NATURAL-REFUGE         순환이 스스로 만드는, 법칙이 멎는 자리
#       │   │   └ MW-NATURAL-SETTLEMENT 그 예외에 얹혀 사는 사람과 문화
#       │   └ MW-CIRCULATION-EVIDENCE   설명 없이 볼 수 있는 증거 → 읽고 대응한다
#       └ MW-TERRAIN-* 8종              갈비분지 · 빙원 · 수해 · 무호흡해 · 산맥 ·
#                                       걷는 대륙 · 사막 · 혈화수해 (BT §4~§11)
#
#   가운데 일곱은 여덟의 **부모가 아니라** 여덟이 각자 한 벌씩 지니는 층이다
#   (Q63(a) — Human 결정, HISTORY.md). 이 층들이 노드로 서기 전에는 그 사슬이
#   MW-MACRO-TERRAIN 의 detail 산문에만 있었고, 간선이 없으므로 Overlay 도 Frontier 도
#   그것을 보지 못했다.
#
# ── BT §16 세계 골격 대조표 — 열한 고리가 어디에 있는가 ──────────────────
#
#   ①  세계압                     MW-WORLD-PRESSURE                       (BW 주입)
#   ②  Principle Manifestation    MW-MACRO-TERRAIN                        (BT 주입)
#   ③  기이한 자연 순환            MW-TERRAIN-CIRCULATION
#   ④  압도적인 지형               MW-SHAPED-LANDFORM
#   ⑤  생존 압력                  MW-SURVIVAL-PRESSURE
#   ⑥  생명과 물질의 적응          MW-ADAPTED-LIFE
#   ⑦  위험과 기적적인 자원        MW-SURVIVAL-PRESSURE (위험) · MW-TERRAIN-RESOURCE (자원)
#   ⑧  자연적 피난처               MW-NATURAL-REFUGE
#   ⑨  사람과 문화                 MW-NATURAL-SETTLEMENT
#   ⑩  관찰과 추론                 MW-CIRCULATION-EVIDENCE (세계 쪽 증거) +
#                                 MK-* (아는 쪽) — MK-LOCAL-WORLDSTATE 가 그 자리다
#   ⑪  다양한 행동 가능성          **MW 가 아니다** — possibilities.yaml 의 MP-* 가 소유한다.
#                                 BT §15.9 의 행동 열하나(피한다·따라간다·기다린다 …)는
#                                 Capability 이므로 capabilities.yaml 이 받는다
#
#   깊이(MW-ZONE-*)와 대지형(MW-TERRAIN-*)은 **직교한다** (Human 결정 — HISTORY Q47(a)).
#   대지형은 "어떤 법칙의 땅인가" 이고 깊이는 "그 땅 안에서 얼마나 들어갔는가" 다.
#   그래서 한 지역은 둘을 함께 가지며, 그 형태(지역 노드가 둘을 어떻게 적는가)는
#   땅을 세우는 첫 Cycle 의 03-world-semantic.md 가 정한다 (정책 §7.2).
#
# 위험(FREE)과 자원(BOUND)이 같은 부모(MW-WORLD-PRESSURE)를 갖는 것이
# 이 세계의 핵심 주장이다 (BW §6 · §36). 그래서 둘을 형제로 세웠다.
version: 1
nodes:

  # ══ 최상위 전제 (BW §30) ═══════════════════════════════════════════════
  # 이 둘은 "상태" 라기보다 세계의 성질이다 — root.md 의 WORLD PREMISE 와 겹친다.
  # 그럼에도 노드로 두는 이유는 BW §30 이 이 둘을 그래프의 뿌리로 직접 명명했고,
  # 아래 모든 노드가 여기에 arises_from 으로 매달려야 인과가 추적되기 때문이다.

  - id: MW-PRIMAL-WORLD
    type: world_state
    statement: >
      세계는 본래 높은 변화 가능성을 가진다. (BW §30)
    detail: >
      이 세계의 기본값은 안정이 아니라 변화다. 생명과 물질이 지금의 모습에 머무는 것이
      자연스러운 것이 아니라, 무언가가 그것을 붙잡고 있을 때만 머문다. 인간이 사는
      문명권이 조용한 것은 세계가 원래 조용해서가 아니라 그 지역의 변화 가능성이
      이미 다 쓰이고 굳었기 때문이다. 이 전제가 무너지면 베이라는 그냥 "몬스터가 센
      지역" 이 되고, 위험과 보물이 같은 뿌리라는 이 게임의 주장도 함께 무너진다.
    world_shape: >
      직접 관찰되는 상태가 아니다 — 세계의 전제이므로 다른 모든 MW-* 가 이것에서
      내려온다는 사실로만 확인된다. 게임 안에 이것을 보여주는 표면은 없어야 한다.
    implemented: PRESENT
    implemented_note: >-
      전제이므로 어긋나는 규칙이 없으면 성립
    # 전제는 구현 대상이 아니다 — 어긋나는 규칙이 없으면 성립한 것으로 본다.
    arises_from: []
    causes: []
    changed_by: []

  - id: MW-WORLD-PRESSURE
    type: world_state
    statement: >
      세계압이 생명과 물질을 현재 상태 너머로 변화시킬 수 있도록 밀고 있다. (BW §3)
    detail: >
      세계압은 마나 같은 에너지 자원이 아니다. 쓰거나 모으거나 발사하는 것이 아니라,
      "이 생명은 지금과 다른 것이 될 수 있다" 는 가능성의 크기다. 세계압이 높은 곳에서는
      환경이 극단으로 치닫고, 그래서 생존 경쟁이 극단이 되고, 그래서 인간의 상식으로는
      불가능한 성질을 가진 것들이 태어난다 (BW §3). 중요한 것은 이 하나의 압력이
      갈라져서 위험과 자원 **양쪽**을 만든다는 점이다 — 아래 두 자식 노드가 그 갈래다.
    world_shape: >
      세계압 자체가 수치로 노출될 필요는 없다. 대신 지역마다 "여기는 얼마나 변할 수
      있는 곳인가" 가 그 지역의 생태·자원·위험으로 일관되게 드러나야 하고,
      위험이 큰 곳에서 나온 것일수록 인간 세계에 없는 성질을 지녀야 한다.
    implemented: ABSENT
    implemented_note: >-
      지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    # 지역이라는 개념 자체가 세계에 없다 — overlay.md 탐험 영역 참조.
    arises_from: [MW-PRIMAL-WORLD]
    causes: []
    changed_by: []

  # ══ 세계압의 두 갈래 (BW §5) ═══════════════════════════════════════════
  # BW §5 가 "세계압을 두 상태로 구분한다" 고 직접 나눈 것이다.
  # 이 둘이 형제라는 사실이 BW §6 "위험과 보물은 같은 세계압의 서로 다른 결과다" 다.

  - id: MW-FREE-PRESSURE
    type: world_state
    statement: >
      아직 어떤 생명이나 물질의 안정된 성질로도 굳지 않은 세계압이 남아 있다. (BW §5)
    detail: >
      굳지 않은 세계압(Free World Pressure)은 계속 무언가를 바꾸고 있는 몫이다.
      환경이 가만히 있지 않으니 생물도 가만히 있을 수 없고, 그래서 생태가 안정되지
      못한 채 적응 경쟁이 끝나지 않는다. 이것이 베이라의 위험을 만드는 쪽이다.
      주의할 것은 이것이 "몬스터가 강함" 을 뜻하지 않는다는 점이다 — 강한 것이 아니라
      **예측할 수 없는** 것이 위험의 정체다. 무엇이 나올지 세계 자신도 정하지 않았다.
    world_shape: >
      같은 지역이라도 시간·상황에 따라 무엇을 만날지, 그것이 어떤 성질을 지녔을지가
      고정되어 있지 않아야 한다. 플레이어가 "이 지역에는 이것이 나온다" 를 한 번 외워
      영구히 해결되면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: >-
      지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    arises_from: [MW-WORLD-PRESSURE]
    causes: []
    changed_by: []

  - id: MW-BOUND-PRESSURE
    type: world_state
    statement: >
      일부 세계압은 생명이나 물질의 특수한 성질로 굳어 안정적으로 정착해 있다. (BW §5)
    detail: >
      굳은 세계압(Bound World Pressure)은 어떤 생명이나 물질이 극단적인 압력을 견디는
      과정에서 하나의 성질로 붙잡아 고정시킨 몫이다. 특수한 생물 기관, 특수한 식물,
      특수한 광물이 전부 이 결과다. 인간 입장에서 자원이 되는 것은 정확히 이쪽이다
      (BW §5). 그러므로 자원은 세계가 뿌려 둔 보상이 아니라 **누군가가 살아남은 흔적**
      이고, 그 자원이 무엇을 할 수 있는지는 그것이 무엇을 견디고 살아남았는지로 정해진다.
    world_shape: >
      가치 있는 자원마다 그것이 어떤 환경의 어떤 압력을 견딘 결과인지가 세계 안에서
      추적 가능해야 한다. 자원의 효과가 그 유래와 무관한 수치 보너스(공격력 +N)로만
      드러나면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: >-
      지역이라는 개념이 없어 "여기는 얼마나 변할 수 있는 곳인가" 가 표현될 자리가 없다
    arises_from: [MW-WORLD-PRESSURE]
    causes: []
    changed_by: []

  # ══ 인간이 사는 쪽 (BW §13 · §14 · §20) ════════════════════════════════

  - id: MW-SAFE-FRONTIER
    type: world_state
    statement: >
      플레이어가 출발하는 문명권은 굳지 않은 세계압이 적어 생태가 예측 가능하다. (BW §14)
    detail: >
      문명권은 세계압이 없는 곳이 아니다. 그 지역의 변화 가능성이 이미 대부분 쓰이고
      굳어서 더 이상 크게 변하지 않는 상태다 (BW §13). 그래서 장기 예측이 가능하고
      정착이 가능하고 문명이 생겼다 — 인간이 세계를 안전하게 만든 것이 아니라,
      안정된 세계였기 때문에 인간의 문명이 가능했다는 순서다. 여기서는 휴식·교역·제작·
      정보 획득·관계·훈련·거래·성장 경로 탐색·탐험 준비를 할 수 있다 (BW §14).
      그리고 바로 그 안정 때문에, 여기서 아무리 기술을 발전시켜도 얻을 수 없는 것들이
      있다 (BW §7). 그 결핍이 플레이어를 밖으로 내보낸다.
    world_shape: >
      플레이어가 위험 없이 머물며 준비할 수 있는 장소가 존재하고, 그곳에서 할 수 있는
      일(거래·제작·정보·훈련)과 그곳에서는 결코 얻을 수 없는 것이 명확히 갈려야 한다.
      "여기서도 결국 다 되는데 밖이 효율만 좋다" 면 이 상태는 세계에 없는 것이다.
    implemented: ABSENT
    implemented_note: >-
      안전한 곳과 위험한 곳의 구분이 없다 — 무대가 하나다
    # 현재 세계는 무대 하나짜리 전투 프로토타입이라 "안전한 장소" 라는 구분이 없다.
    # 이곳은 베이라 **밖**이다 (Human 결정 — HISTORY Q48(a)). 베이라 안쪽의 자연적
    # 안전지대는 MW-TERRAIN-BAIWANG-BASIN 이며 안전한 사유가 다르다 — 여기는 변화
    # 가능성이 이미 굳어서 조용하고, 그쪽은 백왕의 뼈가 변화를 흡수해서 조용하다.
    arises_from: [MW-BOUND-PRESSURE]
    causes: [MG-EXPLORE-BEIRA]
    changed_by: []
    demands: [MC-COMBAT-STRIKE, MC-GUARD, MC-EVADE, MC-REPOSITION]
    # BW §20 — 평범한 생태·예측 가능한 전투를 감당하는 기본기.
    # 앞의 셋은 기존 전투 노드 재사용이다 (MC-ATTACK ≙ MC-COMBAT-STRIKE ·
    # MC-DEFEND ≙ MC-GUARD · MC-EVADE 그대로) — HISTORY Q18(a).

  # ══ 베이라의 깊이 (BW §19) ═════════════════════════════════════════════

  - id: MW-DEPTH-GRADIENT
    type: world_state
    statement: >
      베이라는 깊이 들어갈수록 굳지 않은 세계압이 높아지는 기울기를 가진다. (BW §19)
    detail: >
      바깥에서 안쪽으로 FRINGE · WILD · DANGER · DEEP · UNKNOWN 순으로 깊어지고,
      그 너머에는 이름조차 붙지 않은 영역이 남아 있다. 깊어질수록 위험해지지만 동시에
      더 기적적인 것이 태어날 가능성도 커진다 — 하나의 축이 양쪽을 함께 올린다.
      두 가지를 헷갈리면 안 된다. 첫째, 이것은 거리 공식이 아니다. 지역마다 국지적인
      사정이 달라서 얕은 곳에 이상한 것이 있을 수도 있다 (BW §19). 둘째, 세계압은
      가능성을 늘릴 뿐 전리품을 보장하지 않는다 — 위험한 곳에 갔다고 반드시 값진 것을
      얻는 것이 아니다 (BW §12). 깊이를 보상 등급표로 만들면 이 노드는 배신당한다.
      이 기울기는 대지형과 직교한다 (HISTORY Q47(a)) — 어느 법칙의 땅이든 그 안에서
      깊어질 수 있고, 깊이가 지형의 순서를 정하지는 않는다.
    world_shape: >
      깊이가 다른 영역이 여럿 존재하고, 각 영역이 요구하는 대응이 질적으로 달라야 한다
      (같은 대응의 난이도만 올라가는 것이 아니다). 그리고 깊은 곳에 갔는데 아무것도
      얻지 못하는 일이 정상적으로 일어나야 한다.
    implemented: ABSENT
    implemented_note: >-
      깊이도 층도 없다
    arises_from: [MW-FREE-PRESSURE]
    causes: []
    changed_by: []
