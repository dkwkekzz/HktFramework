  - id: MW-ZONE-DEEP
    type: world_state
    statement: >
      더 깊은 곳에서는 인간의 전투 상식이 무너진다. (BW §24)
    detail: >
      극단적인 재생, 몸 구조를 바꾸는 적응, 여러 개체가 하나처럼 묶인 공생 관계,
      생물이 자기 영역으로 만들어 버린 공간, 공격 자체가 적응해 오는 상대가 여기 있다
      (BW §24). 앞 층까지는 "어떻게 때리는가" 가 문제였다면 여기서는 "때린다는 것이
      무슨 의미인가" 가 흔들린다. 죽여도 돌아오고, 부위를 부숴도 다른 부위가 대신한다.
      그래서 상대를 하나의 체계로 읽고, 그 체계가 성립하는 조건 자체를 끊고, 끊긴 동안
      압박을 유지하고, 특정 부위를 노려야 한다. 특히 강력한 자원이 나오는 층이기도 하다.
    world_shape: >
      단순히 체력을 0 으로 만드는 것으로는 해결되지 않는 상대가 있어야 하고,
      그 상대를 무력화하는 방법이 상대의 구조를 이해한 결과여야 한다.
