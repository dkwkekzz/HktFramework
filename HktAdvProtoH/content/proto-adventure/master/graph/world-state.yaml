    statement: >
      무호흡해 — 투명한 암초가 주변 대기를 결정 안에 결속해, 공기가 물처럼 밀물과 썰물로
      흐르는 땅이다. (BT §7)
    detail: >
      분지를 채운 기체결속 암초가 산소와 수증기와 바람을 흡수해 평상시에는 공기가 거의
      없고, 암초가 포화되는 날에는 저장된 공기가 거대한 조수처럼 계곡을 휩쓴다 (BT §7.1).
      그래서 숨을 쉴 수 없고, 소리가 전달되지 않고, 불꽃이 존재할 수 없고, 조수가 지나간
      뒤 남겨질 수 있고, 암초가 몸과 장비 안의 공기까지 흡수한다 (BT §7.2). 같은 장소도
      조수 시점에 따라 살 수 있는 곳이 되었다가 아니게 된다. 살 수 있는 자리는 공기를
      저장했다 천천히 내뿜는 숨나무 아래, 등에 공기주머니를 지고 이동하는 공각수 주변,
      암초가 닿지 않는 검은 암반 속 동굴이다 (BT §7.3). 핵심 경험은 숨을 참는 것이 아니라
      호흡 가능한 공간을 찾아 만들고 운반하는 것이다 (BT §7.7).
    world_shape: >
      공기가 자원처럼 흐르고 고이고 사라지는 것이 관찰되어야 하며, 그것을 지니고 나누고
      옮길 수 있어야 한다. 그리고 소리가 전달되지 않는다는 사실이 표현이 아니라 판정에
      닿아야 한다 — 전투와 붕괴가 무음으로 진행된다 (BT §7.4).
