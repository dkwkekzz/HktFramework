  - id: MW-TERRAIN-UNHAPPENED-DESERT
    type: world_state
    statement: >
      아직 일어나지 않은 사막 — 모래가 일어난 사건뿐 아니라 선택되지 않은 상태까지 결속해,
      수천 개의 미래가 도시와 괴물과 사람의 모습으로 나타나는 땅이다. (BT §10)
    detail: >
      이 사막은 거짓 환영을 보여 주는 것이 아니라 짧은 시간 동안 다른 가능성을 실제로
      현실로 만든다 (BT §10.2). 존재하지 않는 길이 실제 길처럼 나타나고, 죽었을 가능성의
      자신이 눈앞에 서고, 선택하지 않은 행동의 결과가 현재를 공격한다. 하나의 가능성을
      선택하면 다른 경로가 사라지고, 오래 머물면 자신이 어떤 결과에서 온 존재인지
      혼동하게 된다. 살 수 있는 자리는 가능성 변화에 반응하지 않는 검은 확정암 위이며,
      그 위에서는 한 가지 상태만 유지된다 (BT §10.3). 이 땅은 베이라의 가장 상위 원리 —
      현재 상태가 최종 상태가 아니라는 가능성 — 가 안정되지 못하고 지형 전체에 쌓인
      자리다 (BT §10.1). 핵심 경험은 올바른 길을 찾는 것이 아니라 어떤 길을 현실로 만들지
      고르는 것이다 (BT §10.7).
    world_shape: >
      지금 보이는 것이 실재인지 아닌지가 갈릴 수 있어야 하고, 그것을 의심하고 검증하는
      수단이 있어야 한다. 그리고 여러 결과 중 하나를 골라 현실로 만드는 행위가 있어야
      하며, 고르는 순간 나머지가 닫혀야 한다.
    implemented: ABSENT
    implemented_note: >-
      세계에 가능성이라는 상태가 없다 — 지금 참인 것 하나뿐이다
    arises_from: [MW-MACRO-TERRAIN]
    causes: []
    # BT 는 이 지형이 어떤 Goal 을 낳는지 명명하지 않는다 — WHY 확장 몫이다.
    changed_by: []
    demands: [MC-VERIFY-REALITY, MC-ANCHOR-LOCAL-LAW, MC-REALIZE-ONE-POSSIBILITY]
    # BT §10.4 확정암 위에서는 모든 신기루가 사라진다 · §10.5 가능유리(선택되지 않은 상태
    # 하나를 짧게 현실화한다) · §10.7 여러 Route 의 결과 미리 관찰.

  - id: MW-TERRAIN-BLOODBLOOM-FOREST
    type: world_state
    statement: >
      사람을 꽃피우는 혈화수해 — 혈화수가 죽은 생물의 마지막 상태를 꽃 안에 보존하고,
      살아 있는 것에게 그 종결 상태를 유도하는 땅이다. (BT §11)
    detail: >
      처음에는 주변의 시체에서 영양과 생체 정보를 얻던 식물이 세계압에 오래 노출되면서
      죽음과 개화를 하나의 번식 과정으로 결속했다 (BT §11.1). 숲이 사람을 미워해서 죽이는
      것이 아니라, 혈화수에게 죽음은 꽃이 피기 위해 필요한 자연 상태다. 꽃가루가 상처와
      약한 생체 상태를 추적하고, 뿌리가 목표의 마지막 모습을 미리 만들기 시작하며, 꽃이
      완성되면 대상의 생명 상태가 꽃으로 옮겨간다 (BT §11.2). 쓰러진 존재의 기억과 목소리는
      꽃에서 반복되고, 일부 나무는 자신이 피워 낸 사람꽃의 목소리로 다른 사람을 부른다.
      살 수 있는 자리는 화재로 뿌리망이 소실된 회색재 지대, 꽃과 꽃가루를 먹는 거대 초식
      생물의 주변, 생체 상태가 식물로 전달되는 것을 막는 장송석 곁이다 (BT §11.3).
      핵심 경험은 죽음과 보존을 구분하고 무엇을 되돌리며 무엇을 남길지 고르는 것이다.
    world_shape: >
      약해진 생체 상태가 세계에 읽히고 그것이 추적의 근거가 되어야 하며, 그 신호를 가리는
      수단이 있어야 한다. 그리고 완성되기 전에 개입할 수 있는 진행이 있어야 한다 —
      한 번에 죽는 것이면 이 지형이 아니다.
    implemented: ABSENT
    implemented_note: >-
      몸의 상태가 세계에 읽히지 않는다 — 남은 생명은 관찰에 실리지만 그것을 좇는 것이 없다
    arises_from: [MW-MACRO-TERRAIN]
    causes: [MG-RESCUE-THE-TAKEN]
