  - id: MW-ZONE-UNKNOWN
    type: world_state
    statement: >
      가장 깊은 곳에서는 세계압이 기억·감각·인식·정체성·공간까지 변화시킨다. (BW §25)
    detail: >
      여기서는 몸이 아닌 것이 공격면이 된다. 인간이 추상적이라고 여기던 것들 —
      기억, 감각, 인식, 자기 자신이라는 감각, 공간, 관계, 행동의 습관 — 이 이 층에서는
      생존을 위해 먹고 뺏고 바꿀 수 있는 대상이다 (BW §25). 그래서 필요한 것은
      지각을 지키고, 지금 보는 것이 실재인지 검증하고, 자기를 붙들어 두고, 간섭에
      저항하고, 생체적으로 묶인 연결을 끊고, 변형된 공간에서 빠져나오는 능력이다.
      그리고 이런 것들을 견디도록 적응한 기관은 인간에게 상상을 초월하는 자원이 된다.
    world_shape: >
      플레이어가 보고 있는 정보 자체가 훼손될 수 있어야 하고, 그것을 의심하고 검증하는
      수단이 있어야 한다. 표현만 기괴하고 판정은 여전히 체력 깎기면 이 층이 아니다.
