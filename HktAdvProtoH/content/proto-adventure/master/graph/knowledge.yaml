# Master Knowledge / Belief — MK-* / MB-*
# knowledge  Actor 가 확보한 정보
# belief     Actor 가 사실이라 믿지만 틀릴 수도 있는 정보
# belief 와 MW-* 의 차이가 Mystery · Investigation · Reversal 을 만든다.
# 형식: ../SCHEMA.md
version: 1
nodes:
  - id: MK-OPPONENT-FLOW-PATTERN
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대가 어느 구간에서 힘을 공격에 몰아 방어가 낮아지는지를 안다.
      외운 스킬 이름이 아니라 관찰로 얻는 지식이며, 이것이 있어야 되받아치는 순간을 고른다.
    contradicts: []
    revealed_by:
      - MP-EXPLOIT-OPEN-BODY
      - MP-READ-AND-COUNTER

  - id: MK-OPPONENT-DEFENSE-SHAPE
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대가 어떤 형태의 방어를 지녔고 어떤 공격 형태에 그 방어가 덜 버티는지를 안다.
      이 지식이 없으면 무기 선택은 취향이고, 있으면 선택이 된다.
    contradicts: []
    revealed_by:
      - MP-MATCH-WEAPON-TO-ARMOR
      - MP-PIERCE-THE-HARD-DEFENSE

# 근거 문서는 둘뿐이다 (2026-08-18 Human 결정) —
#   R1  design/Design-Combat-OffenseDefense-R0.md · DT  design/Design-Combat-DamageType-R0.md
#
# Belief(MB-*)는 도입하지 않는다 — Q3 결정 (2026-08-19 Human): 플레이어에게 필요한
# 개념이 아니고 NPC 인지 모델도 현재 범위 밖이다. 전투 정보는 틀리게 믿는 것(Belief)이
# 아니라 상황에 따라 부분적으로 보이거나 가려지는 것(관찰 범위)으로 다룬다 —
# 무엇이 언제 관찰에 실리는가는 각 Cycle 의 관찰 계약(GameView Spec) 소유다.
# MK-OPPONENT-DEFENSE-SHAPE 는 2026-08-18 C012 로 세계에 세워졌다 (Actor 의 방어 형태가
# 모든 관찰에 실린다 — DT §10 Actor 관찰 계약).
# MK-OPPONENT-FLOW-PATTERN 이 읽는 대상(힘의 배분)은 R1 §14 Aura/Nen 층이 예고한다 —
# 그 층의 설계 문서가 나올 때 노드를 개정한다.
