# Master Knowledge / Belief — MK-* / MB-*
# 노드는 의미의 주소다 — 전문·이유는 source 의 기획서가 소유한다 (../SCHEMA.md "모든 Node 공통").
# 형식: ../SCHEMA.md · 관찰: npm run master:graph (뷰어) — 이 파일을 사람이 통독하지 않는다.
#
# 인용 — BW = content/proto-adventure/design/Master-World-Beira.md · R1 = content/proto-adventure/design/Design-Combat-OffenseDefense-R0.md
#        DT = content/proto-adventure/design/Design-Combat-DamageType-R0.md
#        GS = content/proto-adventure/design/Master-Fairy-Growth-System.md (성장)
#        CK = content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md (전투 지식)

version: 1
nodes:
  - id: MK-LOCAL-WORLDSTATE
    type: knowledge
    holder: [ MA-PLAYER ]
    statement: 어떤 지역에서 지금 무엇이 참인가 — 무엇이 살고, 무엇이 위험하고, 무엇을 얻을 수 있는가를 안다. (BW §16 의 "NEW WORLDSTATE")
    source: BW §16
    world_shape: 플레이어가 어떤 지역에 대해 아는 것과 모르는 것이 구분되어 있고, 들어가서 겪는 것으로 아는 쪽이 늘어나야 한다. 그리고 그 앎이 늘어난 결과로 이전에
      없던 목적이 플레이어에게 생겨야 한다.
    implemented: ABSENT
    implemented_note: 지역이 없다. 다만 "모르는 상태" 라는 것 자체는 C014 로 세계에 생겼다 (살펴봄 이전) — 얹힐 바닥은 섰다
    contradicts: []
    revealed_by: [ MP-LEARN-TO-HANDLE-THE-LAYER, MP-PREPARE-IN-CIVILIZATION ]
  - id: MK-WITNESSED-WORLD-PHENOMENON
    type: knowledge
    holder: [ MA-PLAYER ]
    statement: 자신의 원리와 관련된 강력한 세계 현상을 직접 겪었다 — 그 자리에 있었고 그것이 무엇이었는지 안다. (GS §6 World Experience)
    source: GS §6
    world_shape: 세계에 드물게 일어나는 큰 현상이 있고, 그 자리에 있었다는 사실이 몸에 남으며, 남에게 사거나 대신 얻어 올 수 없어야 한다. 어디서나 얻을 수 있으면 이
      지식이 아니다.
    implemented: ABSENT
    implemented_note: 드물게 일어나는 세계 현상이 없다 — 세계에서 일어나는 일은 존재들의 행동뿐이고 그 자리에 있었다는 사실도 남지 않는다
    contradicts: []
    revealed_by: [ MP-LEARN-TO-HANDLE-THE-LAYER ]
  - id: MK-OPPONENT-FLOW-PATTERN
    type: knowledge
    holder: [ MA-PLAYER ]
    statement: 상대가 지금 힘을 어디에 몰아 두었고 그래서 어느 쪽이 비어 있는지를 안다.
    source: UL §13 · §14
    world_shape: 상대의 힘 배분이 시간에 따라 달라지고 그 변화가 관찰 가능해야 하며, 그 구간을 노린 행동이 노리지 않은 행동보다 실제로 유리해야 한다.
    implemented: ABSENT
    implemented_note: 힘을 배분하는 상태가 없다
    contradicts: []
    revealed_by: [ MP-EXPLOIT-OPEN-BODY, MP-READ-AND-COUNTER ]
  - id: MK-OPPONENT-DEFENSE-SHAPE
    type: knowledge
    holder: [ MA-PLAYER ]
    statement: 상대가 어떤 형태의 방어를 지녔고 어떤 공격 형태에 그 방어가 덜 버티는지를 안다.
    source: DT (§ 미지정 — 주입기 이전 번역)
    world_shape: 상대마다 방어의 형태가 다르고, 그 형태가 무엇인지 알 수 있어야 하며, 알고 고른 공격이 모르고 고른 공격보다 유리해야 한다.
    implemented: PARTIAL
    implemented_note: 방어 형태와 관통 반영값이 관찰에 실리고 (C012 · C013), 그것을 알게 되는 과정이 생겼다 — 살펴보기 전에는 가려져 있고 (C014),
      통찰을 기르면 자리별로 열린다 (C016)
    contradicts: []
    revealed_by: [ MP-MATCH-WEAPON-TO-ARMOR, MP-PIERCE-THE-HARD-DEFENSE ]
  - id: MK-OPPONENT-ABILITY-RULE
    type: knowledge
    holder: [ MA-PLAYER ]
    statement: 상대의 능력이 언제 성립하고 무엇으로 풀리는지를 안다 — 날개를 펼친 동안에만 되돌아온다는 것, 먼저 친 상대에게만 걸린다는 것 같은 사실이다. (CK §4)
    source: CK §4 · CK §5 · CK §6
    world_shape: 상대의 능력이 처음에는 무엇인지 알 수 없는 것으로 있고, 겪거나 지켜본 만큼 그 성립 조건과 해제 조건이 드러나며, 알아낸 것이 판을 넘어 남아야 한다.
    implemented: ABSENT
    implemented_note: 알아낼 대상이 없다 — 적대 존재에게 규칙 있는 능력이 없다. 다만 "모르는 상태" 와 그것이 열리는 길은 C014 · C016 으로 섰다
    contradicts: []
    revealed_by: [ MP-KNOW-THE-OPPONENT-RULE, MP-LEARN-HOW-TO-FIGHT-IT ]
