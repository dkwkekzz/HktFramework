# Master Knowledge / Belief — MK-* / MB-*
# knowledge  Actor 가 확보한 정보
# belief     Actor 가 사실이라 믿지만 틀릴 수도 있는 정보
# 형식: ../SCHEMA.md
#
# 인용 — BW = design/Master-World-Beira.md · R1 = design/Design-Combat-OffenseDefense-R0.md
#        DT = design/Design-Combat-DamageType-R0.md
version: 1
nodes:

  # ── 탐험이 만들어내는 지식 (BW §16 · §32) ──────────────────────────────

  - id: MK-LOCAL-WORLDSTATE
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      어떤 지역에서 지금 무엇이 참인가 — 무엇이 살고, 무엇이 위험하고, 무엇을 얻을 수
      있는가를 안다. (BW §16 의 "NEW WORLDSTATE")
    detail: >
      탐험 루프의 핵심 산물이다. BW §16 은 탐험을 "들어간다 → 발견한다 → 새로운 세계
      상태를 알게 된다 → 거기서 목적이 생긴다 → 필요한 것이 생긴다 → 능력을 얻는다 →
      더 깊이 간다" 의 순환으로 정의하는데, 이 노드가 그 순환의 세 번째 칸이다.
      이것이 없으면 탐험은 지역을 순서대로 밟는 사다리일 뿐 순환이 되지 않는다.
      한 덩어리의 지식이 아니라 지역마다 따로 얻는 지식이다 — FRINGE 를 안다고 WILD 를
      아는 것이 아니다. 그리고 굳지 않은 세계압 때문에 이 지식은 완결되지 않는다
      (MW-FREE-PRESSURE) — 한 번 외우면 끝나는 정답표가 되면 이 노드는 배신당한다.
    world_shape: >
      플레이어가 어떤 지역에 대해 아는 것과 모르는 것이 구분되어 있고, 들어가서 겪는
      것으로 아는 쪽이 늘어나야 한다. 그리고 그 앎이 늘어난 결과로 이전에 없던 목적이
      플레이어에게 생겨야 한다.
    implemented: ABSENT
    # 지역이 없고, 세계는 모든 정보를 모든 관찰자에게 전부 보낸다 — 모르는 상태가 없다.
    contradicts: []
    revealed_by:
      - MP-VENTURE-INTO-FRINGE
      - MP-VENTURE-INTO-WILD
      - MP-VENTURE-INTO-DANGER
      - MP-VENTURE-INTO-DEEP
      - MP-VENTURE-INTO-UNKNOWN

  # ── 전투에서 얻는 지식 (R1 · DT) ───────────────────────────────────────

  - id: MK-OPPONENT-FLOW-PATTERN
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대가 어느 구간에서 힘을 공격에 몰아 방어가 낮아지는지를 안다.
    detail: >
      외운 스킬 이름이 아니라 관찰로 얻는 지식이다. 상대의 몸이 공격 쪽으로 기울면
      그동안은 지키는 쪽이 얇아지는데, 그 구간이 언제인지를 아는 사람만 되받아치는
      순간을 고를 수 있다. 이것이 없으면 반격은 운이고, 있으면 판단이 된다.
    world_shape: >
      상대의 힘 배분이 시간에 따라 달라지고 그 변화가 관찰 가능해야 하며,
      그 구간을 노린 행동이 노리지 않은 행동보다 실제로 유리해야 한다.
    implemented: ABSENT
    # 공격/방어에 힘을 배분하는 상태 자체가 세계에 없다 (MC-COMBAT-FLOW MISSING).
    contradicts: []
    revealed_by:
      - MP-EXPLOIT-OPEN-BODY
      - MP-READ-AND-COUNTER

  - id: MK-OPPONENT-DEFENSE-SHAPE
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대가 어떤 형태의 방어를 지녔고 어떤 공격 형태에 그 방어가 덜 버티는지를 안다.
    detail: >
      이 지식이 없으면 무기 선택은 취향이고, 있으면 선택이 된다. 상대의 몸이 물리적인
      단단함으로 버티는지 다른 방식으로 버티는지에 따라 같은 힘으로 때려도 들어가는
      양이 달라지기 때문이다 (DT). 주의할 것은 이것이 "약점 부위" 가 아니라는 점이다 —
      어디를 때리는가가 아니라 무엇으로 때리는가의 지식이다.
    world_shape: >
      상대마다 방어의 형태가 다르고, 그 형태가 무엇인지 알 수 있어야 하며,
      알고 고른 공격이 모르고 고른 공격보다 유리해야 한다.
    implemented: PARTIAL
    # 방어 형태 판정과 관통 반영값까지 모든 관찰에 실린다 (C012 · C013). 다만 "알게 된다"
    # 가 아니라 처음부터 전부 보인다 — 지식을 얻는 과정이 없다. 근거는 overlay.md.
    contradicts: []
    revealed_by:
      - MP-MATCH-WEAPON-TO-ARMOR
      - MP-PIERCE-THE-HARD-DEFENSE

# Belief(MB-*)는 도입하지 않는다 (HISTORY Q3) — 전투 정보는 틀리게 믿는 것이 아니라
# 상황에 따라 부분적으로 보이거나 가려지는 것(관찰 범위)으로 다룬다. 무엇이 언제
# 관찰에 실리는가는 각 Cycle 의 관찰 계약(GameView Spec) 소유다.
#
# MK-OPPONENT-FLOW-PATTERN 이 읽는 대상(힘의 배분)은 R1 §14 Aura/Nen 층이 예고한다 —
# 그 층의 설계 문서가 나올 때 노드를 개정한다.
