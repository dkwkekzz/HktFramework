# Master Knowledge / Belief — MK-* / MB-*
# knowledge  Actor 가 확보한 정보
# belief     Actor 가 사실이라 믿지만 틀릴 수도 있는 정보
# 형식: ../SCHEMA.md
#
# 인용 — BW = content/proto-adventure/design/Master-World-Beira.md · R1 = content/proto-adventure/design/Design-Combat-OffenseDefense-R0.md
#        DT = content/proto-adventure/design/Design-Combat-DamageType-R0.md
#        GS = content/proto-adventure/design/Master-Fairy-Growth-System.md (성장)
#        CK = content/proto-adventure/design/Design-Combat-Knowledge-Extension-R0.md (전투 지식)
version: 1
nodes:

  # ── 탐험이 만들어내는 지식 (BW §16 · §32) ──────────────────────────────

  - id: MK-LOCAL-WORLDSTATE
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      어떤 지역에서 지금 무엇이 참인가 — 무엇이 살고, 무엇이 위험하고, 무엇을 얻을 수
      있는가를 안다. (BW §16 의 "NEW WORLDSTATE")
    detail: >
      탐험 루프의 핵심 산물이다. BW §16 은 탐험을 "들어간다 → 발견한다 → 새로운 세계
      상태를 알게 된다 → 거기서 목적이 생긴다 → 필요한 것이 생긴다 → 능력을 얻는다 →
      더 깊이 간다" 의 순환으로 정의하는데, 이 노드가 그 순환의 세 번째 칸이다.
      이것이 없으면 탐험은 지역을 순서대로 밟는 사다리일 뿐 순환이 되지 않는다.
      얻는 길이 둘이라는 점이 중요하다 — 직접 겪어서 알거나, 겪은 사람에게 사서 안다.
      뒤쪽이 성립하려면 앞쪽을 먼저 한 누군가가 있어야 하므로, 이 지식이 세계에
      경제와 사회가 생기는 자리이기도 하다.
      한 덩어리의 지식이 아니라 지역마다 따로 얻는 지식이다 — FRINGE 를 안다고 WILD 를
      아는 것이 아니다. 그리고 굳지 않은 세계압 때문에 이 지식은 완결되지 않는다
      (MW-FREE-PRESSURE) — 한 번 외우면 끝나는 정답표가 되면 이 노드는 배신당한다.
    world_shape: >
      플레이어가 어떤 지역에 대해 아는 것과 모르는 것이 구분되어 있고, 들어가서 겪는
      것으로 아는 쪽이 늘어나야 한다. 그리고 그 앎이 늘어난 결과로 이전에 없던 목적이
      플레이어에게 생겨야 한다.
    implemented: ABSENT
    implemented_note: >-
      지역이 없다. 다만 "모르는 상태" 라는 것 자체는 C014 로 세계에 생겼다 (살펴봄 이전) — 얹힐 바닥은 섰다
    # 지역이 없고, 세계는 모든 정보를 모든 관찰자에게 전부 보낸다 — 모르는 상태가 없다.
    contradicts: []
    revealed_by:
      - MP-LEARN-TO-HANDLE-THE-LAYER    # 들어가서 겪어 안다
      - MP-PREPARE-IN-CIVILIZATION      # 다녀온 사람에게 사서 안다

  - id: MK-WITNESSED-WORLD-PHENOMENON
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      자신의 원리와 관련된 강력한 세계 현상을 직접 겪었다 — 그 자리에 있었고 그것이
      무엇이었는지 안다. (GS §6 World Experience)
    detail: >
      Class Change 의 네 문턱 중 하나이며, 넷 가운데 **살 수 없는 유일한 것**이다
      (GS §6). Catalyst 는 남에게서 얻거나 거래할 수 있지만 이것은 그 현상이 일어나는
      자리에 자기 몸으로 있어야 생긴다. 그래서 상위 형태의 캐릭터를 보면 그가 어디에
      다녀왔는지가 읽힌다.
      지역에 대한 앎(MK-LOCAL-WORLDSTATE)과 다르다 — 저쪽은 "그곳에 지금 무엇이
      참인가" 이고 이쪽은 "그 일이 일어날 때 내가 거기 있었다" 다. 앞의 것은 겪은 사람에게
      사서 알 수 있고 뒤의 것은 그럴 수 없다.
      무엇이 그 현상인지는 계열마다 다르다 — 자기 원리와 관련된 것이어야 하기 때문이다
      (GS §6). 어느 현상이 어느 계열의 문턱인지는 계열별 설계 문서와 그 땅이 정한다.
    world_shape: >
      세계에 드물게 일어나는 큰 현상이 있고, 그 자리에 있었다는 사실이 몸에 남으며,
      남에게 사거나 대신 얻어 올 수 없어야 한다. 어디서나 얻을 수 있으면 이 지식이 아니다.
    implemented: ABSENT
    implemented_note: >-
      드물게 일어나는 세계 현상이 없다 — 세계에서 일어나는 일은 존재들의 행동뿐이고 그 자리에 있었다는 사실도 남지 않는다
    contradicts: []
    revealed_by:
      - MP-LEARN-TO-HANDLE-THE-LAYER    # 들어가서 겪는 갈래가 이 앎에 이르는 유일한 길이다 (GS §6)

  # ── 전투에서 얻는 지식 (R1 · DT) ───────────────────────────────────────

  - id: MK-OPPONENT-FLOW-PATTERN
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대가 지금 힘을 어디에 몰아 두었고 그래서 어느 쪽이 비어 있는지를 안다.
    detail: >
      외운 스킬 이름이 아니라 관찰로 얻는 지식이다. 상대가 한쪽에 힘을 몰면 그동안
      다른 쪽이 얇아지는데, 지금 어느 쪽이 얇은지를 아는 사람만 때릴 순간을 고를 수
      있다. 이것이 없으면 반격은 운이고, 있으면 판단이 된다.
      **읽는 대상이 Q59(a) 로 바뀌었다** — 예전에는 공격과 방어 둘 사이의 기울기였고
      지금은 몸 · 능력 · 인지 셋 사이의 배분이다 (UL §13 · §14). 상대가 몸에 몰아
      두었으면 그 상대는 나를 잘 읽지 못하고, 능력이나 인지에 몰아 두었으면 몸이 얇다.
    world_shape: >
      상대의 힘 배분이 시간에 따라 달라지고 그 변화가 관찰 가능해야 하며,
      그 구간을 노린 행동이 노리지 않은 행동보다 실제로 유리해야 한다.
    implemented: ABSENT
    implemented_note: >-
      힘을 배분하는 상태가 없다
    contradicts: []
    revealed_by:
      - MP-EXPLOIT-OPEN-BODY
      - MP-READ-AND-COUNTER

  - id: MK-OPPONENT-DEFENSE-SHAPE
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대가 어떤 형태의 방어를 지녔고 어떤 공격 형태에 그 방어가 덜 버티는지를 안다.
    detail: >
      이 지식이 없으면 무기 선택은 취향이고, 있으면 선택이 된다. 상대의 몸이 물리적인
      단단함으로 버티는지 다른 방식으로 버티는지에 따라 같은 힘으로 때려도 들어가는
      양이 달라지기 때문이다 (DT). 주의할 것은 이것이 "약점 부위" 가 아니라는 점이다 —
      어디를 때리는가가 아니라 무엇으로 때리는가의 지식이다.
    world_shape: >
      상대마다 방어의 형태가 다르고, 그 형태가 무엇인지 알 수 있어야 하며,
      알고 고른 공격이 모르고 고른 공격보다 유리해야 한다.
    implemented: PARTIAL
    implemented_note: >-
      방어 형태와 관통 반영값이 관찰에 실리고 (C012 · C013), 그것을 **알게 되는 과정**이 생겼다 — 살펴보기 전에는 가려져 있고 (C014), 통찰을
      기르면 자리별로 열린다 (C016)
    # 방어 형태 판정과 관통 반영값까지 모든 관찰에 실린다 (C012 · C013). 다만 "알게 된다"
    # 가 아니라 처음부터 전부 보인다 — 지식을 얻는 과정이 없다. 근거는 overlay.md.
    contradicts: []
    revealed_by:
      - MP-MATCH-WEAPON-TO-ARMOR
      - MP-PIERCE-THE-HARD-DEFENSE

  # ── 전투 지식 (CK 주입 2026-08-27) ─────────────────────────────────────

  - id: MK-OPPONENT-ABILITY-RULE
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      상대의 능력이 언제 성립하고 무엇으로 풀리는지를 안다 — 날개를 펼친 동안에만
      되돌아온다는 것, 먼저 친 상대에게만 걸린다는 것 같은 사실이다. (CK §4)
    detail: >
      사실의 층이다. 그 사실을 어떻게 써먹을지는 아직 여기 없다 — CK §5 가 그 둘을
      갈라 둔다. "악마의 피는 독성이 있다" 를 아는 것과 "피 흘리는 악마와 싸우는 법"
      을 아는 것은 다르며, 앞의 것이 이 노드이고 뒤의 것이 MK-HOW-TO-FIGHT-IT 이다.
      이것이 왜 따로 서야 하는가 — CK §6 은 전투 지식마다 **필요 지식(Required
      Knowledge)** 이라는 자리를 두고, §9 는 사실이 충분히 쌓여야 전투법이 생긴다고
      적는다. 그 앞칸이 없으면 전투법이 세계의 어디에서 오는지가 끊긴다.
      상대의 배분을 읽는 것(MK-OPPONENT-FLOW-PATTERN)이나 방어 형태를 아는 것
      (MK-OPPONENT-DEFENSE-SHAPE)과 갈린다 — 저 둘은 지금 그 몸이 어떤 상태인가이고,
      이것은 그 몸이 지닌 **규칙**이 무엇인가다. 한 번 알면 다음 판에도 남는다.
    world_shape: >
      상대의 능력이 처음에는 무엇인지 알 수 없는 것으로 있고, 겪거나 지켜본 만큼
      그 성립 조건과 해제 조건이 드러나며, 알아낸 것이 판을 넘어 남아야 한다.
    implemented: ABSENT
    implemented_note: >-
      알아낼 대상이 없다 — 적대 존재에게 규칙 있는 능력이 없다. 다만 "모르는 상태" 와 그것이 열리는 길은 C014 · C016 으로 섰다
    contradicts: []
    revealed_by:
      - MP-KNOW-THE-OPPONENT-RULE
      - MP-LEARN-HOW-TO-FIGHT-IT

  - id: MK-HOW-TO-FIGHT-IT
    type: knowledge
    holder:
      - MA-PLAYER
    statement: >
      알아낸 사실을 실제 전투 운용으로 바꾸는 법을 안다 — 무엇을 억제하고 무엇을
      우선하며 언제 그것을 그만두는지가 하나의 완성된 판단법으로 몸에 남아 있다. (CK §2)
    detail: >
      이 문서 전체가 세우는 것이 이 노드다. 「악마의 날개 파훼법」은 "날개를 펼친
      동안 원거리 능력을 억제하고 접근해 붙으며 날개가 접히면 원래 운용으로 돌아간다"
      는 한 덩어리이고, 플레이어는 그 안을 열어 고치지 않는다 (CK §2 · §6 · §30).
      사실(MK-OPPONENT-ABILITY-RULE)과 다르다는 것이 CK §4 · §5 의 요점이다 —
      사실을 안다고 싸우는 법을 아는 것이 아니며, 전투법은 그 사실 위에서 따로 얻는다
      (관찰 · 반복 · 실패 · 전수 · 연구).
      스킬과도 다르다. 스킬은 습득한 **행동**이고 이것은 습득한 **판단법**이다 (CK §3).
      그래서 이것을 배워도 할 수 있는 일의 목록은 늘지 않고, 언제 무엇을 하는가가 달라진다.
      아는 것과 지금 쓰는 것도 다르다 — 얻은 전투법 전부가 동시에 작동하지 않고
      이번 싸움에 가져간 것만 선다 (CK §10 · §11).
    world_shape: >
      전투법이 사실과 구분되어 따로 획득되고, 그 획득에 세계 안의 원인이 있으며,
      지녔을 때와 지니지 않았을 때 같은 몸의 전투 행동이 달라져야 한다.
      내부를 편집할 수 없으면서도 그것이 무엇을 보고 무엇을 정했는지는 읽혀야 한다.
    implemented: ABSENT
    implemented_note: >-
      판단법이라는 것이 세계에 없다 — 자율 존재의 행동은 고정된 규칙 하나이고 (RULE-NPC-DECIDE-001), 사람의 몸은 판단하지 않는다
    contradicts: []
    revealed_by:
      - MP-LEARN-HOW-TO-FIGHT-IT
      - MP-PREPARE-THE-RIGHT-KNOWLEDGE

# Belief(MB-*)는 도입하지 않는다 (HISTORY Q3) — 전투 정보는 틀리게 믿는 것이 아니라
# 상황에 따라 부분적으로 보이거나 가려지는 것(관찰 범위)으로 다룬다. 무엇이 언제
# 관찰에 실리는가는 각 Cycle 의 관찰 계약(GameView Spec) 소유다.
#
# MK-OPPONENT-DEFENSE-SHAPE 는 C012 로 세계에 세워졌고 (Actor 의 방어 형태가 모든 관찰에
# 실린다 — DT §10 Actor 관찰 계약), C013 이 그것을 넓혔다 — "상대가 어떤 방어를 지녔는가" 에
# "그 방어가 나에게 얼마인가" 가 더해졌다 (같은 지식의 관계 형태).
# MK-OPPONENT-FLOW-PATTERN 이 읽는 대상(힘의 배분)은 UL §13 · §14 가 정의했고
# 그 상태는 MC-AURA-ALLOCATION 이다 (Q59(a) — HISTORY).
