    meaningful_difference: 전투 중의 실행이 아니라 전투 전의 선택으로 이긴다. 준비 단계에서 결정되며 교전 중에는 바꿀 수 없다. 성장의
      축적(MP-OUTGROW-THE-OPPONENT)과 달리 상대별로 다시 고르는 판단이다 — 같은 능력치로도 상대에 따라 결과가 달라진다.
