  - id: MP-OUTGROW-THE-OPPONENT
    type: possibility
    overlay_missing: MC-ATTACK-POWER(PARTIAL) + 전투 밖의 원천
    overlay_note: C-GROWTH-001 로 자라는 축이 섰다 — 세계 안에서 한 일이 몸에 쌓이고 문턱을 넘으면 겨루는 값이 오르며, 같은 상대·같은 기술의 결과가 실제로
      달라진다. world_shape 의 마지막 문장("세계 안의 행위로 올릴 수 있어야 한다")이 닫혔다. 그러나 이 갈래가 말하는 것은 전투 밖에서 기른 값으로 정면
      교환을 이기는 것인데, 선 원천 넷 중 전투 밖의 것은 캐는 일 하나뿐이고(4/회 · 첫 문턱까지 다섯 번) 한 단계의 폭이 작아(한 대에 2) 그것만으로 판이 뒤집히지
      않는다. 없는 것은 이제 축이 아니라 전투 밖의 원천이다
    achieves: [ MG-OVERCOME-SUPERIOR-OPPONENT ]
    meaningful_difference: 다른 경로가 전투 중의 실행(정확한 시점·위치·이어 가는 압박)으로 이기는 데 비해, 이것은 전투 밖에서 기른 공격·방어 능력치로 정면
      교환 자체를 유리하게 만든다. 손의 정확함이 아니라 축적을 요구하고, 같은 행동이 성장 전후로 다른 결과를 낸다 — 전투가 시작되기 전에 이미 절반이 결정되는 유일한
      경로다.
    source: R1 (§ 미지정 — 주입기 이전 번역)
    world_shape: 능력치를 올리면 같은 스킬·같은 상대에 대한 결과가 실제로 좋아지고, 그 변화가 계산 내역으로 설명되어야 한다. 그리고 그 능력치를 세계 안의 행위로 올릴
      수 있어야 한다 — 올릴 방법이 세계 밖에 있으면 이 경로는 열린 것이 아니다.
    implemented: PARTIAL
    requires:
