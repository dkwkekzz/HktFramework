      DC-COMBAT-ONE-FORMULA: SATISFIED         # 새 공식이 아니라 Final Damage 를 증폭하는 결과값 수정이다 (R1 핵심 원칙)

  # ── Q18(a) OPTIONS 산출 — BW §28 분기 중 기존에 없던 3종 (2026-08-19) ──
