  - id: MP-PREPARE-THE-RIGHT-KNOWLEDGE
    type: possibility
    achieves: [ MG-OVERCOME-SUPERIOR-OPPONENT, MG-SURVIVE-ENEMY-OFFENSIVE ]
    meaningful_difference: 새로 배우지 않는다 — 이미 아는 것들 중에서 이번 상대에 맞는 것을 골라 이긴다. 비용이 들지 않고 위험도 없으나, 고를 것이 있으려면
      먼저 모아 두었어야 하고 무엇이 올지 틀리게 읽으면 그대로 진다 (CK §28). 싸움 전에 끝나는 유일한 갈래다.
    source: CK §28 · CK §27 · CK §11
    world_shape: 배운 전투법이 자리보다 많고, 들어가기 전에 무엇을 가져갈지 고를 수 있으며, 무엇을 골랐는가에 따라 같은 상대 앞에서 다르게 싸워야 한다. 그리고 무엇이
      올지 미리 어느 정도 알 수 있어야 고르는 일이 판단이 된다.
