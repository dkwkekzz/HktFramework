# 주입 근거 — 영역별로 분리된다 (근거는 영역을 넘지 않는다 — HISTORY Q15)
#   탐험: BW  design/Master-World-Beira.md  §27 (MG-ACQUIRE-RARE-ORGAN 의 대안 5종)
#
#   BW §28 범용 Combat Graph 매핑 — Q18(a) 확정 (2026-08-19 Human 승인).
#   MP-DEFEAT-BY-COMBAT 는 별도 노드가 아니라 MG-OVERCOME-SUPERIOR-OPPONENT 아래의
#   기존 전투 Possibility 서브트리 전체다. 8분기 매핑:
#     MP-BREAK-DEFENSE     ≙ MP-BREAK-THE-GUARD
#     MP-READ-AND-PUNISH   ≙ MP-READ-AND-COUNTER
#     MP-OVERWHELM         ≙ MP-OUTGROW-THE-OPPONENT
#     MP-EXPLOIT-WEAKNESS  ≙ MP-EXPLOIT-OPEN-BODY / MP-MATCH-WEAPON-TO-ARMOR (분산)
#     MP-OUTLAST           ≙ MP-HOLD-FORTIFIED
#     MP-CONTROL-MOVEMENT · MP-INTERRUPT · MP-WEAPONIZE-ENVIRONMENT — 신규 노드 (위 OPTIONS 절)
#   BW 는 매핑된 전투 노드의 보조 근거로 허용된다 (Q15 영역 규칙의 예외 — Q18(a)).
#
#   MG-EXPLORE-BEIRA 의 Possibility 는 MP-VENTURE-INTO-* 5종으로 세웠다 —
#   §16 탐험 Loop 와 §21~§25 의 층별 "필요:" 를 배선으로 옮긴 것이다 (ID 만 Agent 명명).
#   층 진입 밖의 탐험 방식(안내인 · 교역로 · 정보 구매 등)은 문서에 없다 — OPTIONS 몫.
#
# 전투 영역 주입 근거 (2026-08-18 Q12 결정 상태 유지)
#   R1  design/Design-Combat-OffenseDefense-R0.md
#       §0~§5 · §8 · §11 · §12 · §16 → MP-OUTGROW-THE-OPPONENT
#       §13 하지 않을 것 · §14 확장 순서 · §15 층 그림 → 아직 열리지 않은 경로들
#   DT  design/Design-Combat-DamageType-R0.md
#       §0 · §6 · §7 · §17 → MP-MATCH-WEAPON-TO-ARMOR · §15 Penetration → MP-PIERCE-THE-HARD-DEFENSE
