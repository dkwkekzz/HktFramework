      사람이 더 잘 찾아야 한다. 그래야 탐색이 도박이 아니라 지식의 행사가 된다.
    world_shape: >
      플레이어의 개입 없이도 세계에서 생물이 죽고 그 흔적이 남으며, 그것이 어디에
      생기는지가 세계의 규칙과 이어져 있어 알 수 있어야 한다.
