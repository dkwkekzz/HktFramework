  - id: MP-STOP-THE-TRANSFER
    type: possibility
    overlay_missing: MC-HOLD-BIOLOGICAL-STATE · MC-OBSERVE
    overlay_note: 진행이라는 것이 세계에 없어 붙들 대상이 없다 — 존재는 멀쩡하거나 쓰러지거나 둘뿐이다
    achieves: [ MG-RESCUE-THE-TAKEN ]
    meaningful_difference: 셋 중 유일하게 아무것도 해결하지 않는 갈래다 — 시간을 산다. 붙잡은 것을 끊지도 않고 거기까지 가지도 않고, 옮겨 가는 과정을 그
      자리에 세워 두고 나머지를 나중에 한다. 즉시 성립하고 실력을 거의 요구하지 않지만 붙들고 있는 동안 다른 것을 하지 못하며, 놓는 순간 다시 진행된다.
    source: BT §11.2 · BT §11.7
    world_shape: 다른 것이 되어 가는 진행이 세계에 값으로 있고, 그 값이 멈춘 동안 아무 일도 일어나지 않으며, 붙들기를 놓으면 멈춘 자리에서 다시 이어져야 한다.
