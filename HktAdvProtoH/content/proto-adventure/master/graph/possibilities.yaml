      DC-COMBAT-MATCHUP-SOFT: SATISFIED
  - id: MP-PIERCE-THE-HARD-DEFENSE
    type: possibility
    overlay_missing: 없음
    overlay_note: "C013 로 닫혔다 — 지금 플레이 가능하다. 다만 아직 좁다: 플레이어가 관통을 얻는 경로가 세계에 없다 (종류가 정한 값과 디버그뿐 —
      growth/growth-graph.md)"
    achieves: [ MG-OVERCOME-SUPERIOR-OPPONENT ]
    meaningful_difference: 고를 무른 쪽이 없을 때 남는 유일한 길이다. 상성 선택(MP-MATCH-WEAPON-TO-ARMOR)이 상대의 무른 쪽으로 피해 가는
      것이라면 이것은 마주한 단단한 쪽을 깎아 통과한다 — 상대가 한쪽으로 극단으로 굳혔거나 양쪽이 모두 두꺼워 피할 곳이 없을 때 성립한다. 내 세기를 키우는 것이 아니라
      상대 방어의 값어치를 떨어뜨리므로, 두껍게 굳힌 상대일수록 이득이 커지고 무른 상대에게는 거의 의미가 없다 — 상대에 따라 값이 달라지는 투자다.
    source: R1 (§ 미지정 — 주입기 이전 번역)
    world_shape: 같은 상대·같은 스킬인데 관통을 지닌 쪽이 더 큰 피해를 넣고, 그 차이가 계산 내역으로 설명되며, 두꺼운 상대일수록 그 몫이 커져야 한다. 관통이 아무리
      커도 방어가 완전히 사라지지는 않아야 한다.
    implemented: PRESENT
