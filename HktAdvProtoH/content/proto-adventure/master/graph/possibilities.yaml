# Master Possibility — MP-*
# Goal 을 달성·진전시키는 의미 있게 다른 후보 방법. Goal→Possibility 는 OR,
# Possibility→requires 는 AND 다.
# Gameplay/Cost/Risk/Relationship/Consequence 중 하나 이상이 실질적으로 달라야
# 별도 Possibility 다. 동의어를 늘리지 않는다.
# 형식: ../SCHEMA.md
#
# 인용 — BW = content/proto-adventure/design/Master-World-Beira.md (탐험) ·
#        R1 = content/proto-adventure/design/Design-Combat-OffenseDefense-R0.md · DT = content/proto-adventure/design/Design-Combat-DamageType-R0.md (전투)
#        TG = content/proto-adventure/design/Design-Targeting-R0.md (지목)
#        GS = content/proto-adventure/design/Master-Fairy-Growth-System.md (성장)
#
# ── 이 파일을 읽는 법 ────────────────────────────────────────────────────
# Goal 하나에 매달린 여러 MP-* 는 "둘 다 해야 하는 단계" 가 아니라 "골라서 하는 갈래" 다.
# 그러니 한 Goal 아래를 세로로 읽으면서 "나라면 어느 쪽을 고를까" 를 물으면 된다.
# 각 노드의 meaningful_difference 가 그 선택의 근거이고, detail 이 그것을 풀어 쓴 것이다.
#
#   MG-OVERCOME-SUPERIOR-OPPONENT   앞을 막는 강한 상대를 넘어선다      → 갈래 10
#   MG-SURVIVE-ENEMY-OFFENSIVE      밀리는 국면을 버티고 되돌린다        → 갈래 3
#   MG-EXPLORE-BEIRA                대응 가능한 세계를 넓힌다            → 갈래 3
#   MG-ACQUIRE-RARE-ORGAN           특정 생물의 기관을 얻는다            → 갈래 5
version: 1
nodes:

  # ══════════════════════════════════════════════════════════════════════
  # MG-OVERCOME-SUPERIOR-OPPONENT — 넘을 수 없어 보이는 상대를 넘어서는 갈래들
  # ══════════════════════════════════════════════════════════════════════

  - id: MP-OUTGROW-THE-OPPONENT
    type: possibility
    overlay_missing: >-
      MC-ATTACK-POWER(PARTIAL) + 성장의 원천
    overlay_note: >-
      능력치가 결과를 바꾸는 것은 닫혔고, **C023 으로 그 값을 플레이로 바꾸는 첫 경로가 열렸다**(걸면 오르고 풀면 돌아온다). 그러나 이 갈래가 말하는 것은
      *압도*이므로 **자라는 축**이 여전히 없다 — 걸고 푸는 것은 값을 오르내리게 할 뿐 키우지 않는다. **GS 주입으로 그 축이 이름을 얻었다**
      (MC-GAIN-LEVEL — 전투·탐험·발견·사건 해결이 기본값을 키운다). 없는 것은 이제 이름이 아니라 세계 쪽이다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      다른 경로가 전투 중의 실행(정확한 시점·위치·이어 가는 압박)으로 이기는 데 비해,
      이것은 전투 밖에서 기른 공격·방어 능력치로 정면 교환 자체를 유리하게 만든다.
      손의 정확함이 아니라 축적을 요구하고, 같은 행동이 성장 전후로 다른 결과를 낸다 —
      전투가 시작되기 전에 이미 절반이 결정되는 유일한 경로다.
    detail: >
      가장 단순한 갈래다. 더 세게 때리고 더 잘 버티는 몸이 되어서 이긴다.
      플레이어가 전투 중에 특별히 잘할 필요가 없고, 대신 그 몸을 만들기까지의 축적이
      필요하다. 이 갈래의 값어치는 그것이 쉬워서가 아니라 **다른 갈래들의 기준선**이기
      때문이다 — "성장만으로도 되는데 왜 굳이 읽고 깨고 고르는가" 에 답할 수 있어야
      나머지 아홉 갈래가 존재 이유를 갖는다. 그래서 이 갈래는 언제나 성립하되
      가장 비싸야 한다.
    world_shape: >
      능력치를 올리면 같은 스킬·같은 상대에 대한 결과가 실제로 좋아지고, 그 변화가
      계산 내역으로 설명되어야 한다. 그리고 그 능력치를 **세계 안의 행위로** 올릴 수
      있어야 한다 — 올릴 방법이 세계 밖에 있으면 이 경로는 열린 것이 아니다.
    implemented: PARTIAL
    requires:
      goals: []
      capabilities: [MC-ATTACK-POWER, MC-SKILL-SCALING, MC-DEFENSE-MITIGATION, MC-COMBAT-STRIKE, MC-CP-ECONOMY,
                     MC-GAIN-LEVEL]
      # 마지막 하나가 GS 주입으로 들어왔다 — 이 갈래가 "자라는 축이 없다" 고 적어 두던 그
      # 자리이며, GS §19 가 그 축을 명명한다 (전투·탐험·발견·사건 해결 → 기본값).
      knowledge: []
      world_state: []
      relationship: []
      resource: [능력치를 올릴 장비 — 성장의 원천은 이제 MC-GAIN-LEVEL 이 소유한다 (GS §19)]
    supports: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 방어 능력치 절반이 같은 성장에서 나온다 (R1 §8 · §12)
    opposes: []
    changes:
      - 같은 스킬·같은 상대에 대한 교환비가 성장 전후로 달라진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-GROWTH-NO-DOMINATED-ROUTE,
                  DC-GROWTH-POWER-PAYS-IN-REACH-OR-CONSTRAINT]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 능력치·같은 스킬·같은 상대면 항상 같은 피해 — 난수 없음 (R1 §6)
      DC-GROWTH-NO-DOMINATED-ROUTE: SATISFIED  # 이 갈래의 detail 이 "언제나 성립하되 가장 비싸야 한다" 를 이미 적는다 — 그것이 이 원칙의 요구다 (GB §17)
      DC-GROWTH-POWER-PAYS-IN-REACH-OR-CONSTRAINT: UNRESOLVED   # 가장 넓은 갈래이므로 한 단계의 폭이 작아야 한다 — 그 폭은 Cycle 이 정한다 (GB §20)

  - id: MP-MATCH-WEAPON-TO-ARMOR
    type: possibility
    overlay_missing: >-
      **없음**
    overlay_note: >-
      **C012 로 닫혔다** — 지금 플레이 가능하다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      전투 중의 실행이 아니라 전투 전의 선택으로 이긴다. 준비 단계에서 결정되며 교전 중에는
      바꿀 수 없다. 성장의 축적(MP-OUTGROW-THE-OPPONENT)과 달리 상대별로 다시 고르는
      판단이다 — 같은 능력치로도 상대에 따라 결과가 달라진다.
    detail: >
      상대의 방어에는 형태가 있고, 그 형태마다 덜 버티는 공격 형태가 있다. 그래서
      싸우기 전에 상대를 보고 무엇을 들고 갈지 고른다. 이 갈래가 성립하려면 두 가지가
      필요하다 — 상대의 방어 형태를 알 수 있어야 하고(MK-OPPONENT-DEFENSE-SHAPE),
      고른 것이 실제로 결과를 바꿔야 한다. 주의할 것은 이것이 "약점 부위 때리기" 가
      아니라는 점이다. 어디를 때리는가가 아니라 **무엇으로** 때리는가의 선택이다.
      그리고 상성은 배율표가 아니라 대응 능력치 차이로 생겨야 한다 (DT §4 · §7) —
      표로 만들면 외우면 끝나는 정답이 되고 선택이 사라진다.
    world_shape: >
      상대마다 방어 형태가 다르고, 같은 스킬 값이 상대에 따라 다른 결과를 내며,
      그 차이가 계산 내역으로 설명되어야 한다. 그리고 어느 한쪽이 완전 면역이 아니어야 한다.
    implemented: PRESENT
    requires:
      goals: []
      capabilities: [MC-ATTACK-ARMOR-MATCHUP, MC-COMBAT-STRIKE]
      knowledge: [MK-OPPONENT-DEFENSE-SHAPE]
      world_state: []
      relationship: []
      resource: []
    supports: [MP-BREAK-THE-GUARD]
    opposes: []
    changes:
      - 같은 스킬이 상대에 따라 다른 효율을 낸다
    reveals: [MK-OPPONENT-DEFENSE-SHAPE]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-MATCHUP-SOFT]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 상성은 결정적이다 — 같은 조합이면 같은 결과 (DT §8)
      DC-COMBAT-MATCHUP-SOFT: SATISFIED        # 배율표·면역 없이 대응 능력치 차이로만 상성이 생긴다 (DT §4 · §7)

  - id: MP-PIERCE-THE-HARD-DEFENSE
    type: possibility
    overlay_missing: >-
      **없음**
    overlay_note: >-
      **C013 로 닫혔다** — 지금 플레이 가능하다. 다만 아직 좁다: 플레이어가 관통을 **얻는** 경로가 세계에 없다 (종류가 정한 값과 디버그뿐 —
      growth/growth-graph.md)
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      고를 무른 쪽이 없을 때 남는 유일한 길이다. 상성 선택(MP-MATCH-WEAPON-TO-ARMOR)이 상대의
      무른 쪽으로 피해 가는 것이라면 이것은 마주한 단단한 쪽을 깎아 통과한다 — 상대가 한쪽으로
      극단으로 굳혔거나 양쪽이 모두 두꺼워 피할 곳이 없을 때 성립한다. 내 세기를 키우는 것이
      아니라 상대 방어의 값어치를 떨어뜨리므로, 두껍게 굳힌 상대일수록 이득이 커지고 무른
      상대에게는 거의 의미가 없다 — 상대에 따라 값이 달라지는 투자다.
    detail: >
      상성 선택과 헷갈리기 쉬우니 나란히 두고 보면 좋다. 상성은 "저 사람은 이쪽이 무르니
      이쪽으로 가자" 이고, 관통은 "무른 쪽이 없으니 단단한 쪽을 얇게 만들자" 다.
      그래서 관통은 상대가 방어에 투자를 많이 했을수록 이득이 커진다 — 방어를 두껍게
      굳히는 것만으로는 안전하지 않다는 규칙을 세계에 세우는 갈래다.
      관통은 방어를 없애지 못하고, 마주한 쪽에만 작용하며, 확률로 무시하는 것이 아니라
      언제나 같은 몫을 걷어낸다.
    world_shape: >
      같은 상대·같은 스킬인데 관통을 지닌 쪽이 더 큰 피해를 넣고, 그 차이가 계산 내역으로
      설명되며, 두꺼운 상대일수록 그 몫이 커져야 한다. 관통이 아무리 커도 방어가
      완전히 사라지지는 않아야 한다.
    implemented: PRESENT
    requires:
      goals: []
      capabilities: [MC-PENETRATION, MC-ATTACK-ARMOR-MATCHUP, MC-DEFENSE-MITIGATION, MC-COMBAT-STRIKE]
      knowledge: [MK-OPPONENT-DEFENSE-SHAPE]
      world_state: []
      relationship: []
      resource: []
    supports: [MP-OUTGROW-THE-OPPONENT]
    opposes: []
    changes:
      - 두껍게 굳힌 방어가 그만큼 값어치를 잃는다
      - 방어를 올리는 것만으로는 더 이상 안전이 보장되지 않는다
    reveals: [MK-OPPONENT-DEFENSE-SHAPE]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 방어를 확률로 무시하는 것이 아니라 결정적으로 깎는다 (R1 §6 · §14 Penetration)

  - id: MP-BREAK-THE-GUARD
    type: possibility
    overlay_missing: >-
      MC-BREAK(PARTIAL)
    overlay_note: >-
      무너지는 상태는 있고 무너뜨리는 행동만 없다 (R1 §14 Active Defense 층)
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대의 실수를 기다리지 않고 상대의 방어 자체를 무너뜨려 이긴다. 방어가 성립하지 않는
      구간을 스스로 만들므로 상대의 대응에 덜 의존한다 — 파티가 함께 쓸 수 있는 경로다.
    detail: >
      되받아치기(MP-READ-AND-COUNTER)가 상대가 열리기를 기다리는 것이라면, 이것은
      열리지 않는 상대를 열리게 만드는 것이다. 기다림이 필요 없으니 여럿이 함께
      압박을 넣을 때 특히 강하고, 대신 무너뜨리는 동안 내가 자원과 거리를 내준다.
      무너뜨리는 조건은 명시적이어야 한다 — 확률로 뚫리면 이 갈래는 도박이 되고
      "스스로 구간을 만든다" 는 성격을 잃는다.
    world_shape: >
      상대의 방어가 성립하지 않게 되는 구간이 존재하고, 그 구간이 플레이어의 행동으로
      만들어져야 한다. 그리고 무엇 때문에 무너졌는지가 관찰 가능해야 한다.
    implemented: PARTIAL
    requires:
      goals: []
      capabilities: [MC-BREAK, MC-COMBAT-STRIKE, MC-CP-ECONOMY]
      knowledge: []
      world_state: []
      relationship: []
      resource: [축적된 CP]
    supports: []
    opposes: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 압박을 유지하려면 방어에 쓸 자원과 거리를 포기해야 한다
    changes:
      - 상대의 방어가 일시적으로 성립하지 않는다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 무너뜨리는 조건이 명시적이다 — 난수가 아니다 (R1 §6)
    # R1 §14 Active Defense 층이 이름만 예고한다 (Guard Break) — 그 층의 설계 문서 대기.

  - id: MP-READ-AND-COUNTER
    type: possibility
    overlay_missing: >-
      MC-PERFECT-GUARD · MC-COUNTER
    overlay_note: >-
      R1 §15 층 그림에서 Active Defense 는 Penetration 위이고 그 아래층은 C013 으로 섰다 — 이제 그 층의 설계 문서만 없다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대의 공격을 피하거나 견디는 것이 아니라 그 공격 자체를 자원으로 바꾼다.
      비용은 낮고(성공하면 자원을 오히려 얻는다) 요구되는 것은 정확한 시점이다 —
      실패하면 그대로 맞는 고위험 저비용 경로다. 다른 어떤 경로보다 상대의 행동에 의존한다.
    detail: >
      상대가 때리러 오는 그 순간에 맞춰 받아넘기면 피해를 치르지 않을 뿐 아니라
      공격권이 이쪽으로 넘어온다. 자원을 거의 쓰지 않으므로 잘하는 플레이어에게는
      가장 값싼 갈래이고, 시점을 놓치면 그대로 맞으므로 가장 위험한 갈래이기도 하다.
      이 갈래는 상대의 행동에 완전히 의존한다 — 상대가 공격해 오지 않으면 아무것도
      할 수 없다. 그래서 상대의 힘이 언제 공격 쪽으로 몰리는지를 아는 지식이 전제다.
    world_shape: >
      막기가 성립하는 좁은 시점이 따로 있고, 그 시점에 맞추면 피해를 치르지 않으며
      상대가 잠시 취약해져야 한다. 그리고 그 시점이 확률이 아니라 관계로 판정되어야 한다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-GUARD, MC-PERFECT-GUARD, MC-COUNTER, MC-CP-ECONOMY]
      knowledge: [MK-OPPONENT-FLOW-PATTERN]
      world_state: []
      relationship: []
      resource: []
    supports: [MG-SURVIVE-ENEMY-OFFENSIVE]
    opposes: []
    changes:
      - 공격권이 상대에서 나에게 넘어온다
      - 상대가 잠시 취약해진다
    reveals: [MK-OPPONENT-FLOW-PATTERN]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 성패가 확률이 아니라 시점 관계로 갈린다 (R1 §6)

  - id: MP-EXPLOIT-OPEN-BODY
    type: possibility
    overlay_missing: >-
      MC-COMBAT-FLOW
    overlay_note: >-
      R1 §14 Aura/Nen 층
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대가 스스로 만든 취약 구간을 노린다. 자원도 위치도 요구하지 않고 오직 관찰과 대기가
      비용이다 — 기다리는 동안 아무것도 얻지 못한다. 되받아치기와 달리 상대의 공격을 받아낼
      필요가 없다.
    detail: >
      되받아치기와 나란히 두면 차이가 분명하다. 되받아치기는 상대의 공격을 **받아내면서**
      뒤집는 것이고, 이것은 상대가 공격에 힘을 몰아 방어가 얇아진 구간을 **옆에서**
      때리는 것이다. 그래서 맞을 필요가 없다. 대신 그 구간이 올 때까지 기다려야 하고,
      기다리는 동안은 아무 이득도 없다. 상대가 힘을 어디에 몰고 있는지가 보여야
      성립하므로, 공격·방어 배분이라는 상태가 세계에 있어야 한다.
    world_shape: >
      상대가 공격에 힘을 몰면 방어 쪽이 실제로 얇아지고, 그 상태가 관찰 가능하며,
      그 구간에 넣은 공격이 다른 때보다 잘 들어가야 한다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-COMBAT-FLOW, MC-COMBAT-STRIKE, MC-COMBAT-CAUSE-READING]
      knowledge: [MK-OPPONENT-FLOW-PATTERN]
      world_state: []
      relationship: []
      resource: []
    supports: [MP-READ-AND-COUNTER]
    opposes: []
    changes:
      - 상대가 힘을 몰았던 순간의 대가를 실제로 치른다
    reveals: [MK-OPPONENT-FLOW-PATTERN]
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 열림은 배분 상태라는 관찰 가능한 원인이다 (R1 §6)
    # R1 §14 Aura/Nen 층이 예고한다.

  - id: MP-INTERRUPT
    type: possibility
    overlay_missing: >-
      **없음**
    overlay_note: >-
      **C019 로 닫혔다** — 지금 플레이 가능하다. 상대의 선딜을 노려 끊고, 늦으면 이미 나간 칼을 무르지 못한다. 요구는 MC-INTERRUPT 하나뿐이었고
      그것이 섰다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대의 행동이 완성되기 전에 끊는다. 완성된 공격을 받아내는 모든 경로와 달리
      결과 자체를 존재하지 않게 만들며, 요구되는 것은 상대 행동의 시작을 읽는
      시점 판단이다. (BW §28)
    detail: >
      막기·회피·감쇄는 모두 "이미 날아온 것" 을 처리하는 갈래다. 이것만 유일하게
      날아오지 못하게 한다. 그래서 상대가 크고 느린 행동을 준비할수록 값어치가 커진다.
      되받아치기와 다른 점은 맞을 필요가 없고 정확한 한 순간이 아니라 상대 행동의
      진행 중이면 성립한다는 것이다 — 시점의 폭이 다르다.
    world_shape: >
      상대의 행동에 시작과 완성 사이의 진행 구간이 있고, 그 구간에 개입하면 행동이
      완성되지 못해야 한다. 그리고 무엇이 끊겼는지가 관찰 가능해야 한다.
    implemented: PRESENT
    requires:
      goals: []
      capabilities: [MC-INTERRUPT]
      knowledge: []
      world_state: []
      relationship: []
      resource: []
    supports: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 끊긴 공세는 받아낼 필요가 없다
    opposes: []
    changes:
      - 상대의 행동이 완성되지 못한다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 시점 관계로 판정된다 — 난수가 아니다

  - id: MP-CONTROL-MOVEMENT
    type: possibility
    overlay_missing: >-
      MC-CONTROL-SPACE + MC-FORCE-MOVEMENT·MC-REPOSITION(둘 다 PARTIAL)
    overlay_note: >-
      셋 중 둘이 절반 서 있다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      상대를 이기는 것이 아니라 상대의 위치 선택을 빼앗아 이긴다. 피해 교환 없이
      상대를 불리한 자리로 강제하는 것이 수단이며, 세기·시점·상성 어느 것도 아닌
      공간이 승부 축이다. (BW §28)
    detail: >
      다른 갈래들이 "어떻게 때릴 것인가" 를 다룬다면 이것은 "어디서 싸울 것인가" 를
      다룬다. 상대를 원하지 않는 자리로 밀어 넣고, 상대가 쓰고 싶은 공간을 좁히고,
      나는 유리한 자리를 잡는다. 피해를 한 점도 주지 않고도 판을 유리하게 만들 수
      있다는 것이 이 갈래의 성격이다. 위험 지형이 있는 곳에서는 다음 갈래
      (MP-WEAPONIZE-ENVIRONMENT)와 결합해 훨씬 강해진다.
    world_shape: >
      위치가 결과를 실제로 가르고(어디에 서 있는지가 판정을 바꾸고), 상대의 위치를
      내 행동으로 바꿀 수 있으며, 상대가 쓸 수 있는 공간을 좁히는 수단이 있어야 한다.
    implemented: PARTIAL
    requires:
      goals: []
      capabilities: [MC-FORCE-MOVEMENT, MC-CONTROL-SPACE, MC-REPOSITION]
      knowledge: []
      world_state: []
      relationship: []
      resource: []
    supports: [MP-WEAPONIZE-ENVIRONMENT]   # 몰아넣을 곳이 위험 요소면 두 경로가 결합한다
    opposes: []
    changes:
      - 상대가 원하지 않는 자리에서 싸우게 된다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 강제 이동은 명시 조건의 결과다 — 난수가 아니다

  - id: MP-WEAPONIZE-ENVIRONMENT
    type: possibility
    overlay_missing: >-
      MC-READ-ENVIRONMENT · MC-USE-HAZARD + MW-ZONE-DANGER
    overlay_note: >-
      환경 위험 개념 자체가 없다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      내 힘이 아니라 환경의 위험을 무기로 쓴다. 내 능력치와 무관하게 환경이 낼 수
      있는 결과를 빌리므로, 나보다 강한 상대에게도 성립하는 유일한 전투 경로다 —
      대신 그 환경이 있는 곳에서만 가능하다. (BW §28)
    detail: >
      이 갈래만 유일하게 내 능력치를 거치지 않는다. 그래서 성장이 한참 뒤처진 플레이어도
      지형만 맞으면 강한 상대를 처리할 수 있다 — 대신 그 지형이 없는 곳에서는
      아무 쓸모가 없다. 장소에 완전히 의존하는 것이 비용이다.
      이것이 성립하려면 환경 위험이 플레이어와 상대 **양쪽에** 작용해야 한다.
      플레이어만 피해를 입는 장애물이면 그냥 불편함이고, 상대만 걸리면 퍼즐이다.
    world_shape: >
      스스로 피해를 주는 환경 요소가 존재하고, 그것이 플레이어와 상대 모두에게 같은
      규칙으로 작용하며, 누가 그것을 더 잘 쓰는가가 승패를 가를 수 있어야 한다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-READ-ENVIRONMENT, MC-USE-HAZARD]
      knowledge: []
      world_state: [MW-ZONE-DANGER]
      relationship: []
      resource: []
    supports: []
    opposes: []
    changes:
      - 환경의 위험이 상대에게 작용한다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 환경 위험의 발동 조건은 세계의 관찰 가능한 규칙이다

  - id: MP-BET-ON-THE-CRITICAL-BLOW
    type: possibility
    overlay_missing: >-
      요구 Capability 는 **없음** · `requires.resource` 미충족
    overlay_note: >-
      **C015 로 절반 닫혔다** — 증폭이 터지는 것과 그 경위가 다 보인다. 그러나 "준비로 기대값을 올린다" 는 나머지 절반이 남았다: Critical 성질을
      올릴 성장·장비가 세계에 없어 경로가 종류 초기값과 디버그뿐이다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      다른 모든 경로가 확실한 결과를 쌓는 데 비해, 이것은 확률적으로 터지는 큰 증폭에
      기대를 건다. 준비(Critical 확률·증폭을 키우는 성장·장비)로 기대값을 올리되
      개별 결과는 확률이 정한다 — 전투 전체에서 유일하게 분산(variance)이 축인 경로다.
    detail: >
      이 세계의 전투는 원칙적으로 난수를 쓰지 않는다 — 같은 조건이면 같은 결과다.
      이 갈래만 그 원칙의 유일한 예외로 열려 있다 (Human 결정). 그래서 다른 갈래와
      성격이 근본적으로 다르다. 나머지는 "이렇게 하면 이렇게 된다" 를 배우는 것이고,
      이것은 "여러 번 하면 평균적으로 이득" 을 고르는 것이다. 예외인 만큼 조건이
      붙는다 — 터졌는지 여부와 얼마나 증폭됐는지가 계산 내역에 반드시 드러나야 한다.
      숨은 주사위는 허용되지 않는다.
    world_shape: >
      같은 조건을 반복하면 대부분 같은 피해가 나오다가 이따금 증폭된 피해가 나오고,
      그 타격의 계산 내역에 증폭 여부와 배율이 찍혀야 한다. 그리고 증폭 관련 성질을
      올리면 빈도와 크기가 달라지는 것이 보여야 한다.
    implemented: PARTIAL
    requires:
      goals: []
      capabilities: [MC-CRITICAL-STRIKE, MC-COMBAT-STRIKE, MC-ATTACK-POWER]
      knowledge: []
      world_state: []
      relationship: []
      resource: [Critical 성질을 올릴 성장·장비의 원천]
    supports: [MP-OUTGROW-THE-OPPONENT]   # 같은 성장 축 위에서 작동한다 (R1 §12)
    opposes: []
    changes:
      - 같은 교환에서 이따금 상한을 넘는 결과가 터진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-FORMULA]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # REVISED 예외 — Critical 만 확률 허용 · 발생 여부와 증폭이 계산 경위에 드러난다
      DC-COMBAT-ONE-FORMULA: SATISFIED         # 새 공식이 아니라 Final Damage 를 증폭하는 결과값 수정이다

  - id: MP-STAKE-EVERYTHING-ON-ONE-BLOW
    type: possibility
    overlay_missing: >-
      MC-VOW · MC-COMBAT-FLOW + MC-CONDITION-STACKING(PARTIAL)
    overlay_note: >-
      Aura/Nen 층 — 가장 멀다
    achieves: [MG-OVERCOME-SUPERIOR-OPPONENT]
    meaningful_difference: >
      다른 모든 경로가 반복 가능한 데 비해 이것은 한 번이다. 스스로 제약을 걸어 조건을
      좁히고 실패하면 정의된 대가를 즉시 치른다. 위험을 자원처럼 지불하는 유일한 경로다.
    detail: >
      스스로에게 제약을 건다. "이 싸움에서 물러나지 않는다", "이 조건이 아니면 쓰지
      않는다" 처럼 자기 선택지를 좁히고, 그 대가로 규칙 안의 상한을 넘는 한 번의 결과를
      얻는다. 실패하면 걸었던 것을 잃는다. 중요한 것은 큰 결과가 운이 아니라
      **스스로 만든 조건들의 합**이라는 점이다 — 그래서 이것은 도박이 아니라 설계다.
      전투 사다리의 가장 위층이라 아래가 다 서야 의미가 생긴다.
    world_shape: >
      플레이어가 스스로 제약을 선언할 수 있고, 그 제약이 실제로 자기 선택지를 좁히며,
      대가로 얻는 결과가 제약의 무게에 비례해야 한다. 그리고 실패의 대가가 즉시 치러져야 한다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-VOW, MC-COMBAT-FLOW, MC-CP-ECONOMY, MC-CONDITION-STACKING]
      knowledge: []
      world_state: []
      relationship: []
      resource: [축적된 CP, 제약이 요구하는 자기 상태]
    supports: []
    opposes: [MG-SURVIVE-ENEMY-OFFENSIVE]   # 제약이 대개 자기 방어를 포기하게 만든다
    changes:
      - 규칙 안의 상한을 넘는 한 번의 결과가 나온다
      - 실패하면 방어권·자원 등 정의된 것을 잃는다
    reveals: []
    creates_goal:
      - MG-SURVIVE-ENEMY-OFFENSIVE   # 실패의 대가가 곧바로 다음 국면을 만든다
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 큰 결과는 스스로 만든 조건들의 합이지 난수가 아니다
    # R1 §14 Aura/Nen 층이 이름만 예고한다 — 그 층의 설계 문서 대기.

  # ══════════════════════════════════════════════════════════════════════
  # MG-SURVIVE-ENEMY-OFFENSIVE — 밀리는 국면을 버티고 되돌리는 갈래들
  # ══════════════════════════════════════════════════════════════════════

  - id: MP-TRADE-BODY-FOR-RESOURCE
    type: possibility
    overlay_missing: >-
      **없음**
    overlay_note: >-
      **C011 로 닫혔다** — 지금 플레이 가능하다
    achieves: [MG-SURVIVE-ENEMY-OFFENSIVE]
    meaningful_difference: >
      피해를 피하지 않고 받되 생명이 아닌 자원으로 받는다. 즉시 성립하고 정확함을 요구하지
      않지만, 계속 쓰면 자원이 말라 더 나쁜 붕괴로 끝난다 — 시간을 사는 선택이다.
    detail: >
      막기다. 정확한 시점을 요구하지 않으므로 누구나 즉시 쓸 수 있고, 그래서 가장
      기본적인 생존 수단이다. 대가는 명확하다 — 막을 때마다 기력이 줄고, 기력이 마르면
      방어가 무너지면서 그 타격을 온전히 맞는다. 즉 막기는 문제를 해결하는 것이 아니라
      **미루는** 것이다. 그 미룬 시간 동안 무엇을 할지가 이 갈래의 실제 내용이다.
      그리고 막는 데 쓰는 기력은 공격에 쓰는 기력과 같은 예산이라, 방어를 많이 할수록
      반격할 밑천이 준다.
    world_shape: >
      피해를 줄이는 행동이 있고 그것이 자원을 쓰며, 자원이 마르면 그 방어가 무너져야 한다.
      그리고 그 자원이 공격에 쓰는 것과 같은 예산이어야 한다.
    implemented: PRESENT
    requires:
      goals: []
      capabilities: [MC-GUARD, MC-DEFENSE-MITIGATION, MC-CP-ECONOMY, MC-BODY-FACING]
      knowledge: []
      world_state: []
      relationship: []
      resource: [남은 CP]
    supports: []
    opposes: [MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-BREAK-THE-GUARD]   # 같은 CP 를 놓고 경쟁한다
    changes:
      - 생명 대신 자원이 줄어든다
      - 자원이 바닥나면 방어 자체가 무너진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 생명 대신 같은 기력 예산으로 받아 마르면 무너진다 (R1 §1 · §11)

  - id: MP-EVADE-BY-MOVING-THE-BODY
    type: possibility
    overlay_missing: >-
      MC-EVADE
    overlay_note: >-
      R1 §13 이 이후 확장으로만 지정
    achieves: [MG-SURVIVE-ENEMY-OFFENSIVE]
    meaningful_difference: >
      막지 않고 그 자리에 없다. 자원을 쓰고 위치가 바뀌므로 다음 공격 거리도 함께 잃거나 얻는다.
      막기와 달리 상대의 압박을 누적시키지 않는다.
    detail: >
      막기와 나란히 두면 성격이 갈린다. 막기는 제자리에서 받아내는 것이라 위치가
      그대로지만 자원이 계속 깎인다. 회피는 자원을 쓰되 위치가 바뀌어서, 잘 쓰면
      다음 공격에 좋은 자리를 얻고 잘못 쓰면 반격 거리를 잃는다. 중요한 것은 이것이
      확률 회피가 아니라는 점이다 — 주사위로 빗나가는 것이 아니라 실제로 그 자리에
      없어서 안 맞는다. 그래야 플레이어의 판단이 결과를 만든다.
    world_shape: >
      공격이 특정 공간에만 닿고, 그 공간에서 몸을 빼면 실제로 맞지 않아야 한다.
      빗맞음이 확률 판정으로 결정되면 이 갈래가 아니다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-EVADE, MC-CP-ECONOMY]
      knowledge: []
      world_state: []
      relationship: []
      resource: [남은 CP]
    supports: []
    opposes: []
    changes:
      - 내 위치가 바뀐다
      - 상대의 공격이 빗나가되 상대는 대가를 치르지 않는다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률 회피가 아니라 실제 위치 이동으로 벗어난다 (R1 §6)
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 기동도 새 게이지가 아니라 같은 기력 예산을 쓴다 (R1 §1 · §11)
    # R1 §13 이 Dodge 를 이후 확장으로만 지정한다 — §14 확장 순서에는 아직 자리가 없다.

  - id: MP-HOLD-FORTIFIED
    type: possibility
    overlay_missing: >-
      MC-FORTIFY · MC-COMBAT-FLOW
    overlay_note: >-
      Aura/Nen 층
    achieves: [MG-SURVIVE-ENEMY-OFFENSIVE]
    meaningful_difference: >
      한 번의 방어가 아니라 자세를 유지한다. 매 순간 자원을 흘리는 대신 판정마다 정확할
      필요가 없다 — 손이 아니라 자원으로 사는 안정성이다. 그동안 내 공격은 약해진다.
    detail: >
      막기가 타격 하나하나에 대응하는 것이라면, 이것은 아예 방어 쪽으로 몸을 기울여
      두는 것이다. 매 순간 자원이 새지만 그동안은 판정마다 잘할 필요가 없다.
      대가는 공격이다 — 방어에 힘을 몰아 두면 그만큼 때리는 쪽이 약해진다.
      그래서 이 갈래는 "지금은 못 이기니 상황이 바뀔 때까지 안전하게 있는다" 를
      고르는 것이고, 상황을 바꿀 다른 수가 없으면 그냥 지는 길이기도 하다.
    world_shape: >
      방어 쪽으로 기울인 자세가 상태로 존재하고, 유지하는 동안 자원이 지속적으로 들며,
      그 대가로 공격이 실제로 약해져야 한다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-FORTIFY, MC-DEFENSE-MITIGATION, MC-COMBAT-FLOW, MC-CP-ECONOMY]
      knowledge: []
      world_state: []
      relationship: []
      resource: [지속 공급되는 CP]
    supports: []
    opposes: [MG-OVERCOME-SUPERIOR-OPPONENT]   # 버티는 동안 상대를 넘어서지는 못한다
    changes:
      - 버티는 동안 안정되지만 공격이 약해진다
    reveals: []
    creates_goal: []
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 자세 유지가 새 게이지가 아니라 같은 기력 예산을 흘린다 (R1 §1 · §11)
    # R1 §14 Aura/Nen 층이 예고한다.

  # ══════════════════════════════════════════════════════════════════════
  # MG-EXPLORE-BEIRA — 대응 가능한 세계를 넓히는 갈래들
  # ══════════════════════════════════════════════════════════════════════
  # 여기 있는 셋은 **어떻게 넓히는가**다. 어디로 가는가는 여기 없다 —
  # 층(MW-ZONE-*)은 세계 상태이고, 각 층이 무엇을 요구하는지는 그 노드의
  # demands 가 소유한다. 같은 층을 세 방법 중 무엇으로든 감당할 수 있다는 것이
  # 이 분리의 요점이다.
  #
  #   익힌다        그 층이 요구하는 대응을 스스로 배워 감당한다      BW §32
  #   빌린다        세계가 만든 적응을 자원으로 가져와 감당한다        BW §17
  #   준비해 간다   문명권에서 미리 갖추고 들어간다                    BW §14
  #
  # 셋은 배타적이지 않다 — 섞어 쓸 수 있고, 무엇에 얼마나 기대는지가 플레이어마다
  # 다른 것이 정상이다. 그러나 비용과 위험이 서로 달라서 고르는 일이 생긴다.

  - id: MP-LEARN-TO-HANDLE-THE-LAYER
    type: possibility
    overlay_missing: >-
      **MC-PREDICT 하나** (+ MC-OBSERVE 는 PARTIAL — 같은 자리다)
    overlay_note: >-
      **네 칸 중 셋이 닫혔다.** C014·C016 이 살펴봄과 그것에 이르는 두 길을, C017 이 지목 둘(MC-DESIGNATE-TARGET ·
      MC-WATCH-TARGET)을, C018 이 관계(MC-RELATION-STANCE)를 세웠다. 남은 것은 **예측 하나**이며 그것이 MC-OBSERVE 의
      마지막 결손과 같은 자리다 — 닫히면 이 갈래가 통째로 선다 — 다만 **보류(Human)** (AI 기획서 대기 · frontier "지금 열 수 없는 것").
      탐험의 기본 갈래이자 다른 둘의 앞이다 (먼저 겪은 사람이 없으면 살 정보도 가져올 자원도 없다)
    achieves: [MG-EXPLORE-BEIRA]
    meaningful_difference: >
      들어가서 겪으며 그 층이 무엇을 요구하는지 알아내고, 그 대응을 스스로 익혀
      감당한다. 셋 중 유일하게 미리 갖추지 않고 시작하며, 그래서 가장 위험하고
      가장 싸다 — 치르는 것은 자원이 아니라 시간과 실패다. (BW §32)
    detail: >
      이 게임의 기본 진행 방식이다. BW §32 가 진행을 "관찰한다 → 이해한다 →
      대응 방법을 발견한다 → 능력을 얻는다" 로 정의하는데, 그 네 칸이 통째로
      이 갈래다. 준비물이 없어도 시작할 수 있다는 점이 값어치이고, 알아낼 때까지
      계속 죽는다는 점이 비용이다. 그리고 알아낸 것은 그 층에 대한 앎으로 남아
      다음에 그 층을 훨씬 싸게 감당하게 한다 (MK-LOCAL-WORLDSTATE).
      나머지 두 갈래와 결정적으로 다른 점은, 이것만이 **새로운 층에 처음 들어갈 때**
      쓸 수 있다는 것이다 — 아직 아무도 모르는 곳에는 살 정보도 빌릴 자원도 없다.
    world_shape: >
      플레이어가 모르는 상태로 들어갈 수 있고, 겪은 것으로부터 그 층이 무엇을
      요구하는지 알아낼 수 있으며, 알아낸 대응을 익혀 다음에는 감당할 수 있어야 한다.
      알아내는 과정 없이 처음부터 요구 목록이 주어지면 이 갈래가 아니다.
    implemented: PARTIAL
    requires:
      goals: []
      capabilities: [MC-OBSERVE, MC-PREDICT, MC-DESIGNATE-TARGET, MC-WATCH-TARGET,
                     MC-RELATION-STANCE]
      # 무엇을 익힐지는 층마다 다르지만(각 층의 demands), 익히는 행위 자체가 요구하는
      # 것은 보는 것과 읽는 것이다 — BW §32 의 첫 두 칸.
      # 지목·주시·태도 셋은 그 조건이다 (TG §3.2 · §3.3 · §4.2 · BW §21 — 배선 확정은
      # HISTORY Q27(a) · Q24(b)). 지목은 이 갈래의 조건이고, 전투는 지목 없이도 성립한다.
      knowledge: []
      world_state: [MW-DEPTH-GRADIENT]
      relationship: []
      resource: []
    supports: [MP-ADAPT-BY-RESOURCE, MP-PREPARE-IN-CIVILIZATION]
    # 먼저 겪어 본 사람이 있어야 살 정보도 가져올 자원도 생긴다 — 이 갈래가 다른 둘의 앞이다.
    opposes: []
    changes:
      - 이해·대응 가능한 세계의 범위가 그 층까지 넓어진다 (BW §32)
    reveals: [MK-LOCAL-WORLDSTATE]
    creates_goal:
      - MG-OVERCOME-SUPERIOR-OPPONENT   # 길을 막는 것을 만난다 (BW §21 · §27)
      - MG-SURVIVE-ENEMY-OFFENSIVE      # 사냥당한다 (BW §21 · §27)
      - MG-ACQUIRE-RARE-ORGAN           # 값진 것을 가진 생물을 본다 (BW §22 · §27)
    constraints: [DC-WORLD-PROGRESSION-IS-REACH, DC-WORLD-PLAYER-UNFIXED-PATH]
    constraint_evaluation:
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED    # 관찰 → 이해 → 대응 → 도달이 그대로 이 노드다 (BW §32)
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED     # 무엇을 익힐지 세계가 지시하지 않는다 — 겪은 것에서 나온다

  - id: MP-ADAPT-BY-RESOURCE
    type: possibility
    overlay_missing: >-
      MC-RESTORE-BIOLOGICAL-STATE · MC-CUT-ABNORMAL-STRUCTURE + **MC-EQUIP-ITEM(IMPLEMENTED)** +
      **MC-CRAFT-FROM-MATERIALS** + MK-LOCAL-WORLDSTATE + 자원
    overlay_note: >-
      **이 갈래의 문장이 세계에서 통째로 참이 되었다** — "물건이 대신해 주고, **물건을 잃으면 도로 못 하게 된다**"(BW §17). 앞 절반은
      C020(쓰면 없어진다)이, 뒤 절반은 **C023**(풀면 캘 수 없게 된다)이 세웠고, **C024** 가 그 둘 사이를 오가는 길(교체)을 냈다. 걸 물건이
      둘이 되어 **갈래가 처음으로 둘**이다 — 공격을 얹을지 방어를 얹을지. 다만 자리가 여섯이라 아직 둘 다 걸 수 있으므로 그것이 진짜 선택이 되려면 자리가 걸
      것보다 좁아져야 한다. 쓸 물건은 여전히 한 종류뿐이고, 남은 것은 제작이며 그것이 회복·절단 앞을 막고 있다
    achieves: [MG-EXPLORE-BEIRA]
    meaningful_difference: >
      그 층이 요구하는 대응을 스스로 익히는 대신, 세계가 이미 만들어 낸 적응을
      자원으로 가져와 대신하게 한다. 실력도 시간도 아닌 **먼저 다녀온 자리에서
      얻은 것**이 조건이며, 그래서 탐험의 결과가 다음 탐험의 조건이 되는 유일한
      경로다. (BW §17)
    detail: >
      BW §17 이 "Capability Gate" 라고 부른 것이다. 독에 적응한 생물의 정화 기관을
      얻으면 더 강한 독성 지역에 들어갈 수 있게 되고, 공간이 어긋나는 지역에서
      경계결정을 얻어 무기를 만들면 전에는 부술 수 없던 것을 상대할 수 있게 된다.
      익히는 갈래와 견주면 성격이 분명하다 — 저쪽은 내가 할 줄 알게 되는 것이고
      이쪽은 물건이 대신해 주는 것이다. 그래서 물건을 잃으면 도로 못 하게 된다.
      방향을 뒤집으면 안 된다 (BW §18): 자원이 있으니 능력을 만드는 것이 아니라,
      그 층을 넘으려면 그 능력이 필요하고 그 획득 경로 중 하나가 자원인 것이다.
    world_shape: >
      어떤 지역에서 얻은 것이 다른 지역을 감당할 수 있게 만들어야 한다. 그 자원의
      효과가 그것이 견디고 살아남은 것과 이어져야 하고, 단순한 수치 상승이면 안 된다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-RESTORE-BIOLOGICAL-STATE, MC-CUT-ABNORMAL-STRUCTURE,
                     MC-USE-ITEM, MC-EQUIP-ITEM, MC-CRAFT-FROM-MATERIALS]
      # BW §8 · §10 이 직접 명명한 두 자원 유래 능력이다. 다른 게이트(독 적응 등)는
      # 삽화라 노드로 세우지 않았다 (HISTORY Q14).
      # 뒤의 셋은 이 갈래가 이미 전제하던 공통 앞칸이다 — "물건이 대신해 준다" 는 쓰는
      # 개념을, "물건을 잃으면 도로 못 하게 된다" 는 적용/해제를, "얻어 무기를 만들면"
      # 은 제작을 요구한다 (IS §4 주입).
      knowledge: [MK-LOCAL-WORLDSTATE]
      # 어디서 무엇이 나는지를 모르면 가져올 수 없다 — 익히는 갈래가 앞선다.
      world_state: []
      relationship: []
      resource: [베이라에서 얻은 Bound Pressure 유래 자원]
    supports: []
    opposes: []
    changes:
      - 전에는 감당할 수 없던 층을 감당할 수 있게 된다
      - 자원이 판매용 전리품이 아니라 다음 탐험의 조건이 된다 (BW §17)
    reveals: []
    creates_goal: []
    constraints: [DC-WORLD-PROGRESSION-IS-REACH, DC-WORLD-RESOURCE-ADAPTATION-TRACE]
    constraint_evaluation:
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED         # 자원이 Capability 획득 Route 가 되는 것이 이 Constraint 의 requires 다
      DC-WORLD-RESOURCE-ADAPTATION-TRACE: SATISFIED    # 두 자원 모두 Trace 를 문서가 공급한다 (BW §8~§10)

  - id: MP-PREPARE-IN-CIVILIZATION
    type: possibility
    overlay_missing: >-
      **MC-CRAFT-FROM-MATERIALS** + MK-LOCAL-WORLDSTATE + MW-SAFE-FRONTIER + 관계·대가
    overlay_note: >-
      BW §14 가 열거한 활동 중 제작만 근거 문서를 얻어 배선되었다 (IS §4). 나머지(정보·교역·훈련)는 여전히 이름을 댄 문서가 없다. 막는 것은 능력만이
      아니라 문명권·거래라는 세계 기반이다
    achieves: [MG-EXPLORE-BEIRA]
    meaningful_difference: >
      들어가기 전에 문명권에서 갖춘다 — 다녀온 사람에게 정보를 사고, 필요한 것을
      교역으로 구하고, 만들고, 훈련한다. 셋 중 유일하게 베이라 밖에서 이루어지고
      유일하게 돈과 관계를 비용으로 치른다. 위험이 가장 낮고 값이 가장 비싸다. (BW §14)
    detail: >
      BW §14 가 안전권에서 가능한 활동으로 든 것들 — 휴식·교역·제작·정보 획득·
      Actor 관계·전투 훈련·Item 거래·성장 경로 탐색·탐험 준비 — 이 전부 이 갈래다.
      이것이 있어야 문명권이 "시작 지점" 이 아니라 계속 돌아올 이유가 있는 곳이 된다.
      그리고 다른 플레이어와 NPC 가 의미를 갖는 유일한 탐험 경로이기도 하다 —
      정보를 파는 사람이 있으려면 먼저 겪은 사람이 있어야 하므로, 이 갈래는
      익히는 갈래 위에 얹혀 세계에 경제와 사회를 만든다.
      한계도 분명하다. 아무도 가 본 적 없는 층에 대해서는 살 정보도 만들 장비도 없다.
    world_shape: >
      베이라 밖에서 준비하는 행위가 존재하고(정보·교역·제작·훈련), 준비한 쪽과
      준비하지 않은 쪽이 같은 층에서 다른 결과를 내야 한다. 그리고 그 준비의
      원천이 다른 주체여야 한다 — 혼자 다 되면 이 갈래가 아니다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-CRAFT-FROM-MATERIALS]
      # BW §14 는 활동을 열거하고 Capability 를 명명하지 않는다 — 배선은 OPTIONS 몫이다.
      # 그중 제작만 근거 문서를 얻어 배선되었다 (IS §4 주입). 정보 획득·교역·훈련은
      # 아직 이름을 댄 문서가 없어 비워 둔다.
      knowledge: [MK-LOCAL-WORLDSTATE]
      world_state: [MW-SAFE-FRONTIER]
      # 이 갈래가 서는 자리는 둘이다 (HISTORY Q48(a)) — 문명권과 백왕의 갈비분지.
      # requires 는 AND 이므로 두 곳을 함께 적지 않는다: 어느 한 곳이 서면 성립한다.
      # 파는 것이 다르다 — 밖에서는 평범한 것을, 분지에서는 베이라에서 나온 것과
      # 다녀온 자의 증언을 얻는다 (BT §4.6).
      relationship: [정보·물자를 내줄 Actor 와의 관계]
      resource: [거래 대가]
    supports: []
    opposes: []
    changes:
      - 들어가기 전에 이미 그 층의 요구 일부가 채워져 있다
    reveals: [MK-LOCAL-WORLDSTATE]
    # 겪어서 아는 것이 아니라 사서 아는 것 — 같은 앎에 이르는 다른 경로다.
    creates_goal: []
    constraints: [DC-WORLD-PROGRESSION-IS-REACH, DC-WORLD-PLAYER-UNFIXED-PATH]
    constraint_evaluation:
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED    # 준비의 결과도 "감당 가능한 범위" 로 나타난다 (BW §14 · §32)
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED     # 무엇을 준비할지는 플레이어가 고른다

  - id: MP-BECOME-A-HIGHER-FORM
    type: possibility
    overlay_missing: >-
      다섯 축 전부 (MC-GAIN-LEVEL · MC-GROW-CLASS-MASTERY · MC-MASTER-A-SKILL ·
      MC-GROW-EXPLORATION-MASTERY · MC-CHANGE-CLASS) + MK-WITNESSED-WORLD-PHENOMENON + Catalyst 자원
    overlay_note: >-
      **한 칸도 서 있지 않다.** 다만 이 갈래가 서면 overlay 의 둘째 구멍("성장이 세계 밖에 있다")이 통째로 닫힌다 — 지금 능력치를 바꾸는
      유일한 경로는 디버그 명령이고, GS 주입이 처음으로 그 값이 **어디에서** 올라오는지를 명명했다. 다섯 축 중 **장비 하나만 이미 서 있고**
      (MC-EQUIP-ITEM — C023 · C024), 그것도 이 갈래가 아니라 자원으로 감당하는 갈래에 매달려 있다
    achieves: [MG-EXPLORE-BEIRA]
    meaningful_difference: >
      다른 세 갈래가 **바깥에서** 감당할 것을 구해 오는 데 비해 — 겪어서 익히거나, 자원이
      대신하게 하거나, 문명권에서 사서 준비하거나 — 이것은 **몸 자체가 상위 형태가 되어**
      감당한다. 그래서 잃어버릴 수 없고 되돌아가지도 않는다 (물건은 잃으면 도로 못 하게
      되지만 형태는 남는다). 대신 문턱이 넷이고 그중 둘은 세계에서만 온다 — 자기 원리와
      관련된 강력한 현상을 직접 겪은 것과, 그 형태를 유지하는 세계의 Property (GS §6).
    detail: >
      GS §20 의 플레이 루프가 이 노드다 — 고유한 능력을 체험하고, 전투와 탐험으로 값을
      올리고, 그 형태 고유의 행동으로 숙련을 올리고, 더 위험한 대지형에 들어가 자기 힘과
      관계된 세계 현상을 겪고, Catalyst 를 얻어 상위 형태가 되고, 그래서 이전에는 상대할 수
      없던 적과 지역에 도전한다. 마지막 칸이 이 갈래가 탐험의 갈래인 이유다: 형태가 바뀌는
      것 자체가 목적이 아니라 **닿지 못하던 곳에 닿는 방법**이다 (DC-GROWTH-GOAL-FIRST).
      익히는 갈래와 겹치지 않는다. 저쪽은 그 층이 무엇을 요구하는지 알아내 대응을 익히는
      일이고, 이쪽은 그렇게 익힌 것이 몸에 쌓여 형태가 되는 일이다 — 그래서 이 갈래는
      혼자 서지 못하고 앞선 갈래들이 만든 축적 위에서만 성립한다.
      바뀌는 것이 값이 아니라는 점도 이 갈래의 성격이다: 외형과 실루엣이 바뀌고, Signature 가
      강해지고, 새 Skill 과 Ultimate 와 **새 탐험 Capability** 가 함께 온다 (GS §20).
    world_shape: >
      몸이 형태를 가지고, 세계에서 한 일이 그 형태의 축을 키우며, 축이 차면 상위 형태가
      되고, 그 뒤에 이전에는 감당할 수 없던 곳을 감당할 수 있어야 한다. 그리고 그 변화가
      멀리서 보아도 읽혀야 한다 (GS §7). 형태가 바뀌어도 갈 수 있는 곳이 그대로면
      이 갈래는 열린 것이 아니다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-CHANGE-CLASS, MC-GAIN-LEVEL, MC-GROW-CLASS-MASTERY,
                     MC-MASTER-A-SKILL, MC-GROW-EXPLORATION-MASTERY]
      # 앞의 하나가 문턱을 넘는 자리이고, 뒤의 넷이 그 문턱을 채우는 축이다 (GS §5 · §6 · §19).
      # 다섯째 축(Equipment)은 이미 MC-EQUIP-ITEM 으로 서 있어 여기 다시 적지 않는다 —
      # 그 노드가 MS-GROWTH-SOURCE 의 EQUIPMENT 자리에 함께 속한다.
      knowledge: [MK-WITNESSED-WORLD-PHENOMENON]
      world_state: []
      relationship: []
      resource: [Class Catalyst — 그 강한 형태를 유지하기 위해 필요한 세계의 Property (GS §6)]
    supports: [MG-OVERCOME-SUPERIOR-OPPONENT]
    # 형태가 오르면 정면으로 넘는 갈래(MP-OUTGROW-THE-OPPONENT)의 값도 함께 오른다 —
    # 다만 그 갈래는 값으로 압도하는 일이고 이쪽은 감당하는 범위를 넓히는 일이다.
    opposes: []
    changes:
      - 이전에는 감당할 수 없던 대지형·깊이를 감당하게 된다 (GS §20)
      - 같은 능력이 전투와 탐험 양쪽에서 더 넓은 범위에 미치게 된다 (GS §4)
      - 그 캐릭터가 어느 단계인지가 멀리서 보아도 읽힌다 (GS §7)
    reveals: []
    creates_goal: []
    constraints: [DC-WORLD-PROGRESSION-IS-REACH, DC-GROWTH-GOAL-FIRST, DC-WORLD-PLAYER-UNFIXED-PATH,
                  DC-GROWTH-CLASS-CHANGE-NEEDS-THE-WORLD, DC-GROWTH-CLASS-CHANGE-KEEPS-THE-PAST,
                  DC-GROWTH-EXPLORATION-SHARES-THE-PRINCIPLE, DC-GROWTH-COST-IS-THE-WHOLE-BURDEN,
                  DC-GROWTH-REWARD-IS-NEW-REACH, DC-GROWTH-NO-DOMINATED-ROUTE]
    constraint_evaluation:
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED    # 이 갈래의 결과가 "닿을 수 있는 범위" 로 정의된다 (GS §20 마지막 줄)
      DC-GROWTH-GOAL-FIRST: SATISFIED             # 성장이 Goal 이 아니라 MG-EXPLORE-BEIRA 를 이루는 갈래로 서 있다
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED     # 플레이어가 요정 역할을 수행하되 어느 계열을 고를지도 무엇을 하러 갈지도 강제되지 않는다 (HISTORY Q54(a))
      DC-GROWTH-COST-IS-THE-WHOLE-BURDEN: SATISFIED   # 문턱이 넷이고 그중 둘은 자원으로 살 수 없다 (GS §6 · GB §22)
      DC-GROWTH-REWARD-IS-NEW-REACH: SATISFIED        # 이 갈래의 값이 수치가 아니라 감당할 수 있게 되는 범위다 (GB §9)
      DC-GROWTH-NO-DOMINATED-ROUTE: SATISFIED         # meaningful_difference 가 앞의 세 갈래와 다른 장단점을 적는다 — 잃을 수 없는 대신 문턱이 넷이다
      DC-GROWTH-CLASS-CHANGE-NEEDS-THE-WORLD: SATISFIED       # 문턱 넷 중 둘이 세계에서만 온다 (GS §6)
      DC-GROWTH-CLASS-CHANGE-KEEPS-THE-PAST: SATISFIED        # 이전 형태가 기반으로 남는다 (GS §3.1)
      DC-GROWTH-EXPLORATION-SHARES-THE-PRINCIPLE: SATISFIED   # 형태가 오르면 전투와 탐험 능력이 같은 원리로 함께 넓어진다 (GS §4 · §8)

  # ══════════════════════════════════════════════════════════════════════
  # MG-ACQUIRE-RARE-ORGAN — 특정 생물의 기관을 얻는 갈래들
  # ══════════════════════════════════════════════════════════════════════
  # BW §27 이 다섯을 직접 명명했다. 이 절 전체가 "전투는 Goal 이 아니라 다섯 중
  # 하나의 방법일 뿐" 이라는 주장의 실물이다 — DC-WORLD-COMBAT-IS-ONE-POSSIBILITY 의 원형.
  #
  # 다섯 중 넷은 requires 가 비어 있다. BW 는 대안의 **구조**만 공급하고 각 경로가
  # 무엇을 요구하는지는 말하지 않기 때문이다. 배선은 OPTIONS/NEED 탐색 몫이며,
  # 그때까지 이 넷은 Overlay 판정 대상이 아니다 (없는 것이 아니라 아직 재지 않은 것).

  - id: MP-KILL-CREATURE
    type: possibility
    overlay_missing: >-
      **MC-TRANSFER-ITEM**
    overlay_note: >-
      쓰러뜨리는 것까지는 된다. **쓰러진 몸에서 아무것도 나오지 않고** 그 몸은 치워지지도 않아 영구 장애물로 남는다 — IS 주입으로 그 결손이 이름을 얻었다
    achieves: [MG-ACQUIRE-RARE-ORGAN]
    meaningful_difference: >
      Creature 를 죽여 기관을 얻는다. 다섯 대안 중 유일하게 전투를 요구하고,
      기다림·관계·탐색 대신 위험을 비용으로 치른다. (BW §27)
    detail: >
      가장 직접적이고 가장 비싼 길이다. 확실하지만 죽을 수도 있고, 성공하면 그 개체가
      세계에서 사라진다 — 되돌릴 수 없다. 어떻게 죽일 것인가는 이 노드가 정하지 않는다.
      상대를 넘어서는 갈래 열 가지(MG-OVERCOME-SUPERIOR-OPPONENT 아래)가 그것을
      소유하고, 이 노드는 그중 무엇이든 하나가 성립하면 된다고만 말한다.
    world_shape: >
      생물을 쓰러뜨릴 수 있고, 쓰러진 생물의 몸에서 그 생물이 지녔던 것을 얻을 수
      있어야 한다. 쓰러뜨려도 아무것도 남지 않으면 이 경로는 열린 것이 아니다.
    implemented: PARTIAL
    requires:
      goals: [MG-OVERCOME-SUPERIOR-OPPONENT]
      capabilities: [MC-TRANSFER-ITEM]
      # world_shape 의 "쓰러진 생물의 몸에서 얻을 수 있어야 한다" 가 몸 밖의 물건을
      # 요구한다 (IS §4 주입).
      knowledge: []
      world_state: []
      relationship: []
      resource: []
    supports: []
    opposes: []
    changes:
      - 그 Creature 가 세계에서 사라진다
    reveals: []
    creates_goal: []
    constraints: [DC-WORLD-COMBAT-IS-ONE-POSSIBILITY]
    constraint_evaluation:
      DC-WORLD-COMBAT-IS-ONE-POSSIBILITY: SATISFIED    # Goal 의 원인이 세계 상태이고 대안 4종이 병렬로 서 있다 (BW §27)

  - id: MP-TAKE-SHED-ORGAN
    type: possibility
    overlay_missing: >-
      **MC-TRANSFER-ITEM** + 각자의 세계 기반 (탈락을 만드는 자율 행동 · 거래 상대)
    overlay_note: >-
      IS §4 로 공통 앞칸 하나가 배선되었다. 몸 밖에 물건이 놓이지 않는 한 셋 다 열리지 않는다
    achieves: [MG-ACQUIRE-RARE-ORGAN]
    meaningful_difference: >
      Creature 가 탈락시킨 기관을 줍는다. 죽이지 않으므로 전투 위험이 없지만
      탈락이 일어나는 때와 곳을 알아야 한다 — 관찰과 대기가 비용이다. (BW §27)
    detail: >
      싸우지 않고 얻는 길이다. 위험이 없는 대신 지식이 든다 — 그 생물이 언제 어디서
      무엇을 떨구는지 알아야 하고, 그때까지 기다려야 한다. 전투를 아예 못 하는
      플레이어에게도 열려 있다는 점이 이 갈래의 값어치이고, 급할 때 쓸 수 없다는 것이
      한계다. 이 경로가 성립하려면 생물이 플레이어와 무관하게 자기 생활을 하고 있어야
      한다 — 관찰할 대상이 있어야 관찰이 의미를 갖는다.
    world_shape: >
      생물이 플레이어와 무관하게 시간에 따라 무언가를 하고, 그 결과로 세계에 남는
      것이 있으며, 그 시점과 장소를 알아낼 수 있어야 한다.
    implemented: ABSENT
    requires:
      goals: []
      capabilities: [MC-TRANSFER-ITEM]
