    world_shape: 상대마다 방어 형태가 다르고, 같은 스킬 값이 상대에 따라 다른 결과를 내며, 그 차이가 계산 내역으로 설명되어야 한다. 그리고 어느 한쪽이 완전 면역이 아니어야 한다.
    implemented: PRESENT
