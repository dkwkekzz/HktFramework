  - id: MP-REACH-THE-UNREACHABLE
    type: possibility
    overlay_missing: MC-REDEFINE-DOWN · MC-PLACE-FOOTING · MC-REDIRECT-FALLING-THING · MC-CARRY-LIFE-SUPPORT
    overlay_note: 넷 다 MISSING 이다. 무대가 한 평면이라 닿을 수 없는 자리라는 것 자체가 세계에 없다
    achieves: [ MG-RESCUE-THE-TAKEN ]
    meaningful_difference: 붙잡은 것을 어찌하지 않는다 — 거기까지 간다. 하늘로 추락하는 동료와 공기가 사라진 자리에 고립된 사람은 붙들려서 못 오는 것이 아니라
      사람이 갈 수 없는 자리에 있다. 셋 중 유일하게 법칙을 건드리지 않으며, 대신 도달 수단을 미리 갖춰야 한다 — 현장에서 배울 수 없는 유일한 갈래다.
    source: BT (§ 미지정 — 구조의 갈래)
    world_shape: 사람이 그냥은 닿을 수 없는 자리가 세계에 있고(뒤집힌 낙하 · 숨 쉴 수 없음), 그 자리에 도달하는 수단이 존재하며, 도달한 뒤 대상을 데리고 돌아오는
