    type: possibility
    overlay_missing: MC-DRAIN
    overlay_note: 상대가 유한하게 가진 것이 세계에 없다 — 옮길 것이 없다
    achieves: [ MG-OVERCOME-SUPERIOR-OPPONENT ]
    meaningful_difference: 열다섯 갈래 중 유일하게 격차를 양쪽에서 좁힌다 — 내가 커지는 동시에 상대가 작아진다. 미리 키워 두는
      갈래(MP-OUTGROW-THE-OPPONENT)와 달리 이 판 안에서 벌고, 받아낸 것을 버는 갈래(MP-STORE-AND-RELEASE)와 달리 맞지 않고도 번다.
      대신 빼앗으려면 닿거나 곁에 있어야 하므로 거리를 포기하고, 상대에게 빼앗을 것이 없으면 아무 일도 일어나지 않는다.
    source: BT §5.1
    world_shape: 상대가 유한하게 가진 것이 세계에 값으로 있고, 그것이 이쪽으로 옮겨 오며, 옮겨 간 만큼 상대가 이전만큼 하지 못하고, 그 사실이 양쪽 모두에게 보여야 한다.
