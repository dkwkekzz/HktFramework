      knowledge: []
      world_state: []
      relationship: []
      resource: []
    supports: []
    opposes: []
    changes: []
    reveals: []
    creates_goal: []
    constraints: [DC-WORLD-COMBAT-IS-ONE-POSSIBILITY]
    constraint_evaluation:
      DC-WORLD-COMBAT-IS-ONE-POSSIBILITY: SATISFIED    # 전투 없는 대안으로서 병렬 성립 (BW §27)

  - id: MP-TRADE-WITH-ACTOR
    type: possibility
    overlay_missing: >-
      **MC-TRANSFER-ITEM** + 각자의 세계 기반 (탈락을 만드는 자율 행동 · 거래 상대)
    overlay_note: >-
      IS §4 로 공통 앞칸 하나가 배선되었다. 몸 밖에 물건이 놓이지 않는 한 셋 다 열리지 않는다
    achieves: [MG-ACQUIRE-RARE-ORGAN]
    meaningful_difference: >
      그 기관을 가진 다른 Actor 와 거래한다. 유일하게 전투도 현장 탐색도 요구하지
      않고 관계와 대가를 비용으로 치른다. (BW §27)
    detail: >
      베이라에 직접 들어가지 않고도 그 산물을 얻는 길이다. 대신 대가를 치러야 하고,
      그 대가를 마련하는 과정이 또 다른 플레이가 된다. 그리고 거래할 상대가 있어야
      하므로 관계가 자원이 된다. 다섯 갈래 중 유일하게 다른 사람을 필요로 한다는
      점에서, 이 경로가 열리면 세계에 경제와 사회가 생긴다.
    world_shape: >
      플레이어 외의 주체가 물건을 가지고 있고, 대가를 주고받아 소유가 옮겨질 수
      있어야 한다. 그리고 그 상대와의 관계가 거래 조건에 영향을 주어야 한다.
    implemented: ABSENT
