  - id: MP-CUT-WHAT-HOLDS-THEM
    type: possibility
    overlay_missing: MC-BREAK-BIOLOGICAL-LINK · MC-DISCOVER-WEAKNESS
    overlay_note: 셋 중 유일하게 새 Capability 를 요구하지 않는다 — 이미 선 둘로 성립한다. 다만 그 둘이 모두 MISSING 이다
    achieves: [ MG-RESCUE-THE-TAKEN ]
    meaningful_difference: 과정을 늦추는 것이 아니라 붙잡고 있는 것 자체를 끊는다. 한 번에 끝나지만 무엇이 붙잡고 있는지 먼저 알아내야 하고, 잘못 끊으면 붙들려
      있던 쪽이 함께 무너진다. 비용은 시간이 아니라 앎이며, 셋 중 유일하게 새 능력 없이 이미 선 것들로 성립한다.
    source: BT §6.2 · BT §11.2 · BT §6.6
    world_shape: 법칙이 대상을 붙잡고 있다는 사실이 세계에 실체로 있고(연결·표식·뿌리), 그것을 찾아 끊을 수 있으며, 끊긴 뒤에는 진행이 이어지지 않아야 한다.
