    detail: >
      베이라는 끊임없이 무언가가 죽는 곳이다 (MW-FREE-PRESSURE). 그러니 찾아다니면
      이미 죽은 것을 만날 수 있다. 위험도 대가도 없는 대신 확실하지 않다.
