  - id: MP-FORCE-CREATURE-TO-RELEASE
    type: possibility
    overlay_missing: >-
      **판정 불가 — requires 미배선**
    overlay_note: >-
      BW §27 은 대안 구조만 공급했다. IS §4 가 이름을 댄 셋에 이 둘은 포함되지 않아 배선하지 않았다 — 요구 배선(OPTIONS/NEED)이 끝나야
      판정된다
    achieves: [MG-ACQUIRE-RARE-ORGAN]
    meaningful_difference: >
      죽이지 않고 Creature 가 기관을 내놓게 만든다. 전투 압박·환경·유인 무엇으로든
      개체를 살려 둔 채 목적만 달성한다 — 죽이기보다 어렵지만 생태를 소모하지 않는다. (BW §27)
    detail: >
      가장 어려운 길이고 세계에 가장 친절한 길이다. 상대를 살려 두면 그 개체가 계속
      존재하므로 다음에 또 얻을 수 있다 — 죽이는 길이 한 번으로 끝나는 것과 대비된다.
      압박해서 뱉게 하든, 환경으로 몰아 떨구게 하든, 유인해서 벗게 하든 수단은 열려
      있다. 이 갈래가 성립하면 플레이어가 생태를 관리하는 선택을 할 수 있게 된다.
    world_shape: >
      생물이 죽지 않고도 지녔던 것을 잃을 수 있고, 그렇게 만드는 수단이 여럿이며,
      살려 둔 개체가 세계에 남아 계속 자기 일을 해야 한다.
