# Master System Registry — MS-*
# part_of 가 가리키는 "전체" 의 목록. Capability 는 조각이고, 여기가 그 조각이 속한
# 시스템(척추)의 단일 출처다. system 은 지어내지 않는다 — 근거 문서가 이미 가진
# 구조(층 · 사슬 · 게이트)만 등록한다.
#
# status  DEFINED  근거 문서가 그 전체를 정의한다
#         DRAFT    문서 초안은 있으나 Human 승인 대기 — 이 시스템에 결손의 반쪽을 맡긴
#                  노드는 grounded: false 로 남는다
#         PLANNED  이름만 예고되었고 문서가 없다
#
# segments 는 그 시스템 안의 순서 있는 자리다 (사다리의 층 · 사슬의 칸).
# 아래에서 위로 적는다 — 첫 항목이 바닥이다. 순서가 없으면 segments 를 생략한다.
version: 1
systems:

  - id: MS-COMBAT-LADDER
    name: 전투 사다리
    source: R1 §14 · §15 · DT · UL §0 · §1 (위 두 칸의 설계)
    status: DEFINED
    semantic: >
      전투 Capability 가 쌓이는 층 구조. 아래층이 서야 위층이 의미를 갖는다.
      층에 속하지 않는 조각(기력 예산 · 능력치 축 · 계산 경위 관찰 · 공간 판정)은
      모든 층이 공유하는 바닥이다 — segment 없이 이 시스템에 속한다.
    segments:
      - { id: BASIC-DAMAGE,   name: Basic Damage }
      - { id: DEFENSE-ACTION, name: Defense Action }
      - { id: DAMAGE-TYPE,    name: Damage Type }
      - { id: PENETRATION,    name: Penetration }
      - { id: CRITICAL,       name: Critical }
      - { id: ACTIVE-DEFENSE, name: Active Defense }
      - { id: AURA-NEN,       name: Aura / Nen }

  - id: MS-ACTIVE-DEFENSE
    name: 능동 방어
    parent: MS-COMBAT-LADDER
    source: UL §4~§10 · §42 F1~F3
    status: DEFINED
    semantic: >
      공격이 자신에게 닿는 순간 무엇을 할 수 있는가의 자리들. R1 이 이름만 댔던
      전투 사다리의 ACTIVE-DEFENSE 칸 안을 UL 이 열어 셋으로 나눴다.
      막기 · 피하기 · 받아넘기기 · 되받아치기를 각각의 시스템으로 만들지 않는다 —
      전부 하나의 응답이라는 공통 구조를 쓰고, 무엇이 일어나는지는 그 자리에
      무엇을 끼웠는가가 정한다 (UL §4.1).
    segments:
      - { id: RESPONSE,    name: 응답 — 닿는 순간 하나를 고른다 }
      - { id: PRECISION,   name: 정밀 — 언제 골랐는가가 결과를 가른다 }
      - { id: OPPORTUNITY, name: 기회 — 잘 된 응답이 다음 수를 연다 }

  - id: MS-AURA-NEN
    name: 기력 배분과 계약
    parent: MS-COMBAT-LADDER
    source: UL §11~§24 · §42 F4~F7
    status: DEFINED
    semantic: >
      개인의 능력이 어떤 규칙으로 작동하는지를 바꾸는 최상층. R1 이 이름만 댔던
      전투 사다리의 AURA-NEN 칸 안을 UL 이 열어 넷으로 나눴다. 새로운 피해 타입이
      아니라, 지금 힘을 어디에 몰아 두었고 어떤 조건과 제약 아래 쓰는가가
      **무엇을 할 수 있는가** 자체를 바꾸는 자리다 (UL §11).
      마지막 자리(세계 조작)가 이 층의 실제 확장 공간이며, UL §22 가 그 지도를
      열두 영역(생명 · 위치 · 행동 · 관계 · 대상 · 정보 · 자원 · 피해 · 개체 ·
      Skill · 영역 · 시간)으로 그려 두었다. 처음 여는 것은 그중 다섯뿐이다 (UL §42 F7).
    segments:
      - { id: ALLOCATION, name: 배분 — 지금 힘을 어디에 몰아 두었는가 }
      - { id: CONDITION,  name: 조건 — 세계가 어떠해야 그것이 가능한가 }
      - { id: CONTRACT,   name: 계약 — 무엇을 포기하고 무엇을 허락받는가 }
      - { id: OPERATION,  name: 세계 조작 — 피해 말고 무엇을 하는가 }

  - id: MS-BEIRA-LADDER
    name: 베이라 층 사다리
    source: BW §19~§25
    status: DEFINED
    semantic: >
      세계의 깊이 층. 층마다 살아남기 위해 요구하는 대응이 다르다 — 각 층의 요구는
      MW-ZONE-* 의 demands 가 거울이다. BW 는 층마다 이름과 "필요:" 목록만 공급하므로
      이 사다리에 속한 조각 대부분은 grounded: false 다.
      대지형(MS-BEIRA-TERRAIN)과 **직교한다** (HISTORY Q47(a)) — 어느 땅이든 그 안에서
      깊어질 수 있고, 한 지역은 "어느 대지형의 어느 깊이" 를 함께 가진다.
    segments:
      - { id: SAFE,    name: SAFE FRONTIER }
      - { id: FRINGE,  name: FRINGE }
      - { id: WILD,    name: WILD }
      - { id: DANGER,  name: DANGER }
      - { id: DEEP,    name: DEEP }
      - { id: UNKNOWN, name: UNKNOWN }

  - id: MS-KNOWING-CHAIN
    name: 앎의 사슬
    source: BW §32 (관찰 → 이해 → 대응 → 도달)
    status: DEFINED
    semantic: >
      정보가 관문 뒤에 있고, 플레이어가 대가를 치러 아는 범위를 넓히는 진행 구조.
      관찰이 "지금 무엇인가" 를, 예측이 "다음에 무엇을 하는가" 를 연다.
    segments:
      - { id: OBSERVE, name: 관찰 — 지금 무엇인가 }
      - { id: PREDICT, name: 예측 — 다음에 무엇을 하는가 }

  - id: MS-RESOURCE-GATE
    name: 자원 유래 Capability Gate
    source: BW §8~§10 · §17
    status: DEFINED
    semantic: >
      탐험 → 자원 → 능력 → 더 깊은 탐험의 순환. 세계가 만든 적응을 자원으로 가져와
      전에는 감당할 수 없던 층을 감당하게 한다.

  - id: MS-TARGETING
    name: 지목
    source: TG (content/proto-adventure/design/Design-Targeting-R0.md)
    status: DEFINED
    semantic: >
      어느 층에도 속하지 않는 자리 — "지금 누구에게 하는가" 를 세계에 둔다.

  - id: MS-RELATION
    name: 관계 태도
    source: BW §21 · §26
    status: DEFINED
    semantic: >
      존재와 존재 사이의 태도(적대·중립·우호)가 세계의 사실로 있고, 칠 수 있는가와
      자율 존재가 다가온 것을 어떻게 대하는가를 가른다.

  - id: MS-CREATURE-BEHAVIOR
    name: 자율 존재 행동
    source: content/proto-adventure/design/Design-Creature-Behavior-R0.md (초안 — Human 승인 대기)
    status: DRAFT
    semantic: >
      목적(Drive) · 영역 · 인지 · 국면 — 자율 존재가 자기 목적으로 움직이는 시스템.
      이것이 서야 예측(MC-PREDICT)의 읽을 거리와 습성 관찰(MC-OBSERVE 의 남은 결손)이
      생긴다 — 그 두 조각의 반쪽을 이 시스템이 소유한다.

  - id: MS-ITEM-SYSTEM
    name: 아이템
    source: IS (content/proto-adventure/design/Design-Item-System-R0.md) §4 · §5 · §6 ·
      IE (content/proto-adventure/design/Design-Inventory-Equipment-D1.md) §0 · §48 — CARRY·EQUIP 자리의 운용
    status: DEFINED
    semantic: >
      물건이 세계의 자원으로 성립하는 여섯 자리. 세계가 아이템을 정의하고, 몸이
      그것을 지니고, 써서 상태를 바꾸고, 적용해 능력을 얻고, 재료를 다른 것으로
      바꾸고, 몸 밖에서 주고받는다. 앞의 둘(정의 · 소지)은 능력이 아니라 나머지
      넷의 바닥이다. 자원이 능력이 되는 순환(BW §17)과 정의/개체 분리(GR §28~§32)를
      세계 쪽에서 받는 자리이며, 희귀 기관을 얻는 세 갈래(BW §27)도 이 시스템의
      마지막 자리를 전제한다.
    segments:
      - { id: DEFINITION, name: 정의 — 세계가 아이템을 안다 }
      - { id: CARRY,      name: 소지 — 가진 것이 하나의 계약으로 보인다 }
      - { id: USE,        name: 사용 — 가진 것이 세계를 바꾼다 }
      - { id: EQUIP,      name: 장착 — 가진 것과 적용된 것이 갈린다 }
      - { id: CRAFT,      name: 제작 — 재료가 다른 것이 된다 }
      - { id: WORLD,      name: 세계 개체화 — 아이템이 몸 밖에 존재한다 }

  - id: MS-SKILL-FORM
    name: 스킬 실행 형태
    source: SK (content/proto-adventure/design/Skill/Skill-System.md) §4 · §5 · §6
    status: DRAFT
    semantic: >
      효과가 세계에 나타나 대상에게 닿는 방식의 목록. 스킬은 이름이 아니라 발동 ·
      대상 기준 · 실행 · 대상 결정 · 효과의 조합이며, 그중 **실행**만이 세계에 새로운
      생명주기와 판정을 요구하므로 자리를 가진다 (나머지 네 축은 조합의 항이지 사다리가
      아니다). 전투 사다리(MS-COMBAT-LADDER)와 직교한다 — 그쪽은 피해가 어떻게
      계산되는가의 층이고 이쪽은 그 효과가 어떻게 전달되는가의 자리다. 어느 자리든
      피해 효과는 같은 피해 공식을 지난다.
    segments:
      - { id: CONTACT,          name: 접촉 — 휘두른 몸이 닿는다 }
      - { id: DIRECT,           name: 대상 직접 — 전달체 없이 이미 정해진 것에 바로 미친다 }
      - { id: SPATIAL-QUERY,    name: 공간 조회 — 한 자리를 기준으로 공간을 물어 대상을 고른다 }
      - { id: SPATIAL-PRESENCE, name: 공간 존재 — 몸이 아닌 것이 세계에 자리를 가진다 }
      - { id: TRIGGER,          name: 사건 — 세계에서 일어난 일이 다음 실행을 부른다 }
      - { id: COMPOSITION,      name: 연결 — 하나의 실행이 다음 실행을 낳는다 }

  - id: MS-BEIRA-TERRAIN
    name: 베이라 대지형
    source: BT (content/proto-adventure/design/Master-World-Beira-Terrain.md) §1 · §4~§11 · §13 · §15
    status: DEFINED
    semantic: >
      하나의 원리가 매질(암석·물·대기·열·생명·공간·기억·Identity·소리·관계)에 대륙 규모로
      결속되어 형성된 자연 시스템의 목록. 여덟이 문서에 서 있고, 각 지형은 자기 법칙이
      요구하는 대응을 따로 가진다 — 그 요구는 MW-TERRAIN-* 의 demands 가 거울이다.
      자리를 순서로 두지 않는다: 여덟은 난이도 순으로 배치된 목록이 아니며 (BT §16),
      어디에 갈 수 있는지는 무엇을 감당하게 되었는가가 정한다 (BT §12).
      깊이 사다리(MS-BEIRA-LADDER)와 **직교한다** (Human 결정 — HISTORY Q47(a)):
      이쪽은 어떤 법칙의 땅인가이고 그쪽은 그 땅 안에서 얼마나 들어갔는가다.
      한 대지형 안에 안전한 마을과 극단적으로 위험한 심부가 함께 있다 (BT §3).
