# Master Actor — MA-*
# 노드는 의미의 주소다 — 전문·이유는 source 의 기획서가 소유한다 (../SCHEMA.md "모든 Node 공통").
# 형식: ../SCHEMA.md · 관찰: npm run master:graph (뷰어) — 이 파일을 사람이 통독하지 않는다.
#
# 인용 표기 — BW §x = content/proto-adventure/design/Master-World-Beira.md · R1 = content/proto-adventure/design/Design-Combat-OffenseDefense-R0.md
#        GS = content/proto-adventure/design/Master-Fairy-Growth-System.md (성장 — 플레이어가 수행하는 역할)

version: 1
nodes:
  - id: MA-PLAYER
    type: actor
    kind: PLAYER
    perspective: 안전한 문명권에서 출발해 베이라를 탐험하고, 발견한 세계 상태에 따라 자신의 목적과 해결 방법과 성장 경로를 스스로 고르는 존재. 플레이어는 요정의 역할을
      수행한다 — 하나의 세계 원리가 한 인격에 집중되어 태어난 존재이며 (GS §1), 여덟 계열 중 어느 갈래인지는 고르는 것이다 (HISTORY Q54(a)).
    source: GS §1 · BW §1
    world_shape: 플레이어가 시작할 때 무엇을 하러 갈지를 강요받지 않고, 같은 상황에서 서로 다른 대응을 골라도 둘 다 성립해야 한다. 그리고 무엇을 할지 세계가 지시하는
      표면(퀘스트 지시문)이 진행의 주 경로가 아니어야 한다. 몸을 고르는 자리가 있다면 그 갈래들이 수치가 아니라 하는 일로 갈려야 한다.
    implemented: PARTIAL
    implemented_note: 몸이 한 종류로 고정이라 고를 갈래 자체가 없다 — 요정 계열 여덟(MS-FAIRY-LINEAGE)이 그 자리이고 아직 비어 있다
    wants:
      [
        MG-EXPLORE-BEIRA,
        MG-ACQUIRE-RARE-ORGAN,
        MG-OVERCOME-SUPERIOR-OPPONENT,
        MG-SURVIVE-ENEMY-OFFENSIVE
      ]
    knows: []
    believes: []
  - id: MA-HOSTILE-COMBATANT
    type: actor
    kind: CREATURE
    perspective: 베이라 바깥 층(FRINGE)의 강한 토착 포식자 — 자기 사냥터에 들어온 것은 사냥감이다. (BW §21)
    source: BW §21 · BW §26
    world_shape: 플레이어가 아닌 존재가 스스로 판단해 움직이고, 그 존재에게 적용되는 전투 규칙이 플레이어의 것과 같아야 한다. 그리고 그 존재의 행동이 자기 영역을 지키는
      것으로 읽혀야 한다.
    implemented: PRESENT
    implemented_note: C018 로 마지막 칸이 닫혔다 — 스스로 순찰·추격·공격하고, 플레이어와 같은 관문을 지나며(몬스터 전용 규칙 없음), 이제 지킬 자리를 지녀 그
      행동이 자기 영역을 지키는 것으로 읽힌다. 같은 종류 두 개체가 하나는 적대하고 하나는 하지 않는다 — 적대가 종류가 아니라 사정의 결과다
    wants: [ MG-HOLD-HUNTING-GROUND ]
    knows: []
    believes: []
