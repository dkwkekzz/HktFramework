# Master Actor — MA-*
# 자기 관점·이해관계·Goal 을 가질 수 있는 주체.
# PLAYER | NPC | CREATURE | FACTION | GUILD | SETTLEMENT | ORGANIZATION
# 형식: ../SCHEMA.md
#
# 인용 표기 — BW §x = design/Master-World-Beira.md · R1 = design/Design-Combat-OffenseDefense-R0.md
version: 1
nodes:

  - id: MA-PLAYER
    type: actor
    kind: PLAYER
    perspective: >
      안전한 문명권에서 출발해 베이라를 탐험하고, 발견한 세계 상태에 따라 자신의 목적과
      해결 방법과 성장 경로를 스스로 고르는 사람. (BW §1)
    detail: >
      이 게임의 플레이어에게는 정해진 직업도, 소속도, 싸우는 방식도, 파견 임무도 없다
      (BW §1). 무엇을 하러 왔는지를 세계가 정해 주지 않고, 세계를 보고 나서 정한다.
      그래서 같은 지역에 들어간 두 플레이어가 서로 다른 목적을 갖는 것이 정상이다.
      전투에서는 자기 몸의 자원과 행동 길이는 알지만, 상대가 무엇을 하려는지는
      관찰로만 읽는다 — 숙련될수록 외운 스킬 이름이 아니라 힘이 지금 어디에 몰려 있는지를
      본다 (R1 유래). 이 관점 때문에 "정답 빌드" 를 세계가 알려주는 설계는 이 노드와 충돌한다.
    world_shape: >
      플레이어가 시작할 때 직업·진영·전투 방식을 고르도록 강요받지 않고, 같은 상황에서
      서로 다른 대응을 골라도 둘 다 성립해야 한다. 그리고 무엇을 할지 세계가 지시하는
      표면(퀘스트 지시문)이 진행의 주 경로가 아니어야 한다.
    implemented: PARTIAL
    implemented_note: >-
      몸이 한 종류로 고정이라 고를 갈래 자체가 없다
    # 플레이어의 몸이 한 종류로 고정이라 고를 것 자체가 없다 — 경로가 열려 있다기보다
    # 아직 갈래가 없는 상태다. 근거는 overlay.md.
    wants:
      - MG-EXPLORE-BEIRA
      - MG-ACQUIRE-RARE-ORGAN
      - MG-OVERCOME-SUPERIOR-OPPONENT
      - MG-SURVIVE-ENEMY-OFFENSIVE
    knows: []
    believes: []

  - id: MA-HOSTILE-COMBATANT
    type: actor
    kind: CREATURE
    perspective: >
      베이라 바깥 층(FRINGE)의 강한 토착 포식자 — 자기 사냥터에 들어온 것은 사냥감이다.
      (BW §21)
    detail: >
      이 존재는 플레이어를 노리는 악역이 아니라 자기 층에서 살아남고 있는 생물이다.
      그 층의 생존 경쟁이 이런 몸과 이런 행동을 만들었고, 사냥터를 지키는 것이 그 결과다
      (BW §26). 중요한 것은 이 존재가 플레이어와 **같은 전투 규칙 아래** 있다는 점이다 —
      공격에 힘을 몰면 똑같이 몸이 열리고, 공격권을 뺏기면 똑같이 무너진다. 예외를 갖지
      않는다. 몬스터 전용 규칙을 주는 순간 "세계압이 만든 적응" 이라는 근거가 사라지고
      그냥 수치가 높은 적이 된다.
    world_shape: >
      플레이어가 아닌 존재가 스스로 판단해 움직이고, 그 존재에게 적용되는 전투 규칙이
      플레이어의 것과 같아야 한다. 그리고 그 존재의 행동이 자기 영역을 지키는 것으로
      읽혀야 한다.
    implemented: PRESENT   # C018 — 지킬 자리를 지녀 행동이 자기 영역을 지키는 것으로 읽힌다. 플레이어와 같은 관문을 지난다 (예외 없음)
    implemented_note: >-
      **C018 로 마지막 칸이 닫혔다** — 스스로 순찰·추격·공격하고, 플레이어와 **같은 관문**을 지나며(몬스터 전용 규칙 없음), 이제 지킬 자리를 지녀 그
      행동이 자기 영역을 지키는 것으로 읽힌다. 같은 종류 두 개체가 하나는 적대하고 하나는 하지 않는다 — 적대가 종류가 아니라 사정의 결과다
    # C018 로 마지막 칸이 닫혔다 — 지킬 자리(Actor.GuardedGround)를 지니고 그 안을 순회하며,
    # 그 자리에 든 것을 사냥감으로 대한다. 같은 종류 두 개체가 하나는 적대하고 하나는
    # 하지 않는다 — 적대가 종류에 붙은 성질이 아니라 사정의 결과라는 것이 코드에서 보인다.
    # 전투 규칙의 공유도 더 강해졌다: 관문(RULE-HARM-GATE-001)이 양쪽에 똑같이 서므로
    # 몬스터 전용 예외가 한 곳도 없다. 근거는 overlay.md.
    wants:
      - MG-HOLD-HUNTING-GROUND
    knows: []
    believes: []
    # Belief 는 도입하지 않는다 — NPC 인지 모델은 현재 범위 밖이다 (HISTORY Q3).
