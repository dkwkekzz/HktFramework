# Master Graph Edges
# 노드 안에서 표현되지 않는 관계만 여기 둔다. 같은 관계를 양쪽에 중복 기록하지 않는다.
#
# 기본        CAUSES MOTIVATES WANTS BELIEVES KNOWS ACHIEVES REQUIRES
#             SUPPORTS OPPOSES CHANGES REVEALS REFRAMES CREATES_GOAL
# Constraint  CONSTRAINS SUPPORTS_CONSTRAINT CONFLICTS_WITH
# 형식: ../SCHEMA.md
version: 1
edges: []

# ── 이 파일이 비어 있는 이유 ─────────────────────────────────────────────
# 모든 관계가 노드 안 필드로 표현되어 있어서다. 어디에 무엇이 있는지:
#
#   World → World   world-state.yaml 의 arises_from     세계의 인과 척추 (BW §30)
#   World → Goal    world-state.yaml 의 causes
#   Goal → Goal     goals.yaml 의 motivation
#   World → Goal    goals.yaml 의 caused_by             (causes 의 반대 방향 조회용이 아니라
#                                                        Goal 쪽에서 원인을 밝히는 자리다)
#   Goal ← Poss.    possibilities.yaml 의 achieves       OR 갈래
#   Poss. → 요구    possibilities.yaml 의 requires       AND 조건
#   Poss. → 결과    possibilities.yaml 의 changes · reveals · creates_goal
#   Poss. ↔ Poss.   possibilities.yaml 의 supports · opposes
#   Cap. ← Poss.    capabilities.yaml 의 required_by
#   Know. ← Poss.   knowledge.yaml 의 revealed_by
#   Actor → Goal    actors.yaml 의 wants
#   Node → DC       각 노드의 constraints
#   DC → DC         constraints/DC-*.yaml 의 relations
#
# 노드 필드로 표현할 수 없는 관계가 생기면 그때 여기에 적는다. 지금은 없다.
# 특히 arises_from 을 여기에 옮기지 않는다 — 인과는 그 상태를 읽는 자리에서
# 바로 보여야 하고, 노드에서 떼어 내면 다시 "따로 찾아봐야 하는 것" 이 된다.
