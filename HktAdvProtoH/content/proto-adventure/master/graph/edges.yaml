# MW-SAFE-FRONTIER → MG-EXPLORE-BEIRA). MOTIVATES 는 goals.yaml 의 motivation 필드에 있다.
# CONSTRAINS 는 각 노드의 constraints 필드에, SUPPORTS_CONSTRAINT 는 DC 파일의 relations 에
