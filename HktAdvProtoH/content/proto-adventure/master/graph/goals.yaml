# Master Goal — MG-*
# 노드는 의미의 주소다 — 전문·이유는 source 의 기획서가 소유한다 (../SCHEMA.md "모든 Node 공통").
# 형식: ../SCHEMA.md · 관찰: npm run master:graph (뷰어) — 이 파일을 사람이 통독하지 않는다.
#
# 인용 — BW = content/proto-adventure/design/Master-World-Beira.md (탐험) ·
#        BT = content/proto-adventure/design/Master-World-Beira-Terrain.md (대지형) ·
#        R1 = content/proto-adventure/design/Design-Combat-OffenseDefense-R0.md · DT = content/proto-adventure/design/Design-Combat-DamageType-R0.md (전투)

version: 1
nodes:
  - id: MG-EXPLORE-BEIRA
    type: goal
    owner: MA-PLAYER
    desired_state: 자신이 이해하고 대응할 수 있는 세계의 범위가 지금보다 넓다 — 이전에는 갈 수 없던 베이라의 영역에 닿는다. (BW §1 · §32)
    source: BW §1 · §32 · BW §1 · BW §32 · BW §15 · §31
    world_shape: 플레이어가 지금 대응할 수 있는 영역과 아직 대응할 수 없는 영역이 구분되고, 그 경계가 레벨 수치가 아니라 "무엇을 할 줄 아는가" 로 정해져야 한다.
      그리고 경계를 넘은 뒤에는 이전 영역이 실제로 쉬워져 있어야 한다.
    implemented: ABSENT
    motivation:
      - 불치병을 치료할 방법을 찾는다 — 문명권 의료의 한계를 넘는 것이 베이라에 있다 (BW §7 · §15)
      - 문명권에서 만들 수 없는 희귀 소재를 찾는다 (BW §15)
      - 전설적인 무기를 원한다 (BW §15)
      - 알려지지 않은 생물을 발견한다 (BW §15)
      - 새로운 전투 능력을 얻는다 (BW §15)
      - 특정 인물을 찾는다 (BW §15)
      - 돈을 번다 (BW §15 · §31)
      - 강해지고 싶다 (BW §15 · §31)
      - 새로운 성장 경로를 찾는다 (BW §15)
      - 세계의 비밀을 알고 싶다 (BW §15)
      - 자신만의 발견을 하고 싶다 — 저 너머에 무엇이 있는지 알고 싶다 (BW §15 · §31)
    belief_context: []
    stakes:
      [
        나가지 않으면 문명권의 한계 안에 머문다 — 그 안에서 얻을 수 없는 것에 닿지 못한다 (BW §7),
        위 motivation 중 무엇을 품었든 그것이 영영 해결되지 않는다
      ]
    caused_by: [ MW-SAFE-FRONTIER, MW-TERRAIN-CIRCULATION ]
    constraints: [ DC-WORLD-PLAYER-UNFIXED-PATH, DC-WORLD-PROGRESSION-IS-REACH ]
    constraint_evaluation:
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED
  - id: MG-ACQUIRE-RARE-ORGAN
    type: goal
    owner: MA-PLAYER
    desired_state: 특정 생물의 희귀한 기관을 손에 넣는다. (BW §27)
    source: BW §27
    world_shape: 생물의 몸에서 나오는 것이 존재하고, 그것을 얻는 방법이 하나가 아니어야 한다. 죽이는 것만이 유일한 경로면 이 Goal 은 세계에서 성립하지 않는다.
    implemented: ABSENT
    motivation: [ MG-EXPLORE-BEIRA ]
    belief_context: []
    stakes:
      - 얻지 못하면 그 기관이 있어야 풀리는 일이 풀리지 않는다 — 무엇이 걸려 있는지는 그것을 원한 motivation 이 정한다 (병 치료인지 · 무기 재료인지 · 거래
        대금인지)
      - 죽여서 얻는 길을 고르면 그 개체가 세계에서 사라진다 — 되돌릴 수 없는 비용이다
    caused_by: [ MW-ZONE-WILD ]
    constraints: [ DC-WORLD-COMBAT-IS-ONE-POSSIBILITY ]
    constraint_evaluation:
      DC-WORLD-COMBAT-IS-ONE-POSSIBILITY: SATISFIED
  - id: MG-OVERCOME-SUPERIOR-OPPONENT
    type: goal
    owner: MA-PLAYER
    desired_state: 정면으로 자원을 맞바꾸는 것만으로는 넘을 수 없는 상대가 더 이상 앞을 막지 못한다.
    source: BW §28
    world_shape: 같은 힘으로 정면 교환하면 지는 상대가 있고, 그 상대를 힘이 아닌 다른 방법으로 넘어설 수 있어야 한다. 그리고 넘어선 결과가 "그 상대가 더 이상 앞을
      막지 않는다" 로 나타나야 한다.
    implemented: PARTIAL
    motivation: [ MG-EXPLORE-BEIRA ]
    belief_context: []
    stakes: [ 넘지 못하면 FRINGE 너머의 더 깊은 베이라에 닿지 못한다 ]
    caused_by: [ MW-ZONE-FRINGE ]
    constraints: [ DC-WORLD-COMBAT-IS-ONE-POSSIBILITY ]
    constraint_evaluation:
      DC-WORLD-COMBAT-IS-ONE-POSSIBILITY: SATISFIED
  - id: MG-SURVIVE-ENEMY-OFFENSIVE
    type: goal
    owner: MA-PLAYER
    desired_state: 상대가 공세를 쥔 국면에서 살아남고, 잃은 공격권을 되찾는다.
    source: R1 (§ 미지정 — 주입기 이전 번역)
    world_shape: 방어하는 데에도 자원이 들고, 그 자원이 마르면 방어가 무너져야 한다. 그리고 공세를 되돌려 받는 수단이 있어서 "버티기" 가 끝이 아니어야 한다.
    implemented: PARTIAL
    motivation: [ MG-OVERCOME-SUPERIOR-OPPONENT ]
    belief_context: []
    stakes: [ 버티지 못하면 쓰러진다, 버티기만 하면 자원이 말라 결국 무너진다 ]
    caused_by: [ MW-ZONE-FRINGE ]
    constraints: []
    constraint_evaluation: {}
  - id: MG-HOLD-HUNTING-GROUND
    type: goal
    owner: MA-HOSTILE-COMBATANT
    desired_state: 자기 사냥터에 들어온 침입자가 사냥감이 되거나 물러난다.
    source: BW §26
    world_shape: 플레이어가 아닌 존재가 지키는 범위를 갖고, 그 범위에 들어오면 반응하고 나가면 더 쫓지 않아야 한다. 그리고 그 존재가 플레이어의 유무와 무관하게 자기
      일을 하고 있어야 한다.
    implemented: PRESENT
    motivation: []
    belief_context: []
    stakes: [ 사냥터를 지키지 못하면 먹이와 영역을 잃는다 ]
    caused_by: [ MW-ZONE-FRINGE ]
    constraints: [ DC-WORLD-CREATURE-FROM-PRESSURE ]
    constraint_evaluation:
      DC-WORLD-CREATURE-FROM-PRESSURE: SATISFIED
  - id: MG-RESCUE-THE-TAKEN
    type: goal
    owner: MA-PLAYER
    desired_state: 대지형의 법칙에 붙들려 사라지는 중인 존재가 그 법칙 밖으로 돌아온다. (BT §6.6 · §7.7 · §8.7 · §11.7)
    source: BT §6.6 · §7.7 · §8.7 · §11.7 · BT §6.6 · BT §7.7 · BT §8.7 · BT §11.7 · BT §6.2 · BT §11.2
    world_shape: 존재가 지형의 법칙에 붙들려 단계적으로 사라지는 과정이 세계에 있고, 그 과정이 끝나기 전에 개입해 되돌릴 수 있어야 한다. 즉시 죽거나 아무 일도 없거나
      둘뿐이면 이 Goal 은 세계에서 성립하지 않는다.
    implemented: ABSENT
    motivation: []
    belief_context: []
    stakes:
      [
        늦으면 그 존재는 죽는 것이 아니라 세상에서 개인으로 구분되지 않게 된다 (BT §6.2),
        꽃이 완성되면 생명 상태가 꽃으로 옮겨가고 목소리만 반복된다 (BT §11.2)
      ]
    caused_by:
      [
        MW-TERRAIN-NAME-EATING-FOREST,
        MW-TERRAIN-BREATHLESS-SEA,
        MW-TERRAIN-SKYFALL-RANGE,
        MW-TERRAIN-BLOODBLOOM-FOREST
      ]
    constraints: [ DC-WORLD-PLAYER-UNFIXED-PATH ]
    constraint_evaluation:
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED
