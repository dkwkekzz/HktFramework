      MS-ACTIVE-DEFENSE · MS-AURA-NEN 이 소유한다. 빈 칸을 막는 것은 형상이 아니라 그것을
      요구하는 Possibility 의 부재다 (open-questions Q35). 아군 보호 조작은 세계에 아군이
      없어 세우지 못했다 (Q60).
