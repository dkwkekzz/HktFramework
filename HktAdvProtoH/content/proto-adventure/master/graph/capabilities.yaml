  - id: MC-CRITICAL-STRIKE
    type: capability
    semantic: >
      공격이 확률적으로 더 크게 증폭되어 터진다. 발생 확률과 증폭 크기는 Actor 의
      성질이며 성장·장비로 자란다. Critical 발생 여부와 그 증폭은 계산 경위에
      그대로 드러난다.
    detail: >
      이 세계에서 난수가 허용되는 유일한 자리다 (Human 결정). 그래서 조건이 붙는다 —
      터졌는지와 얼마나 커졌는지가 반드시 보여야 한다. 숨은 주사위는 허용되지 않는다.
      그 조건을 지키는 한 이것은 기존 공식을 바꾸지 않고 최종 결과에 배율 하나를
      더하는 층이다.
    world_shape: >
      같은 조건 반복에서 대부분 같은 피해가 나오다 이따금 증폭된 피해가 나오고,
      그 타격의 계산 내역에 증폭 여부와 배율이 찍혀야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: CRITICAL
          source: R1 §14 (이름) — C015 로 의미 확정
    required_by: [MP-BET-ON-THE-CRITICAL-BLOW]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-FORMULA]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # REVISED 가 명시한 단일 예외 — 관찰 요구는 그대로 진다
      DC-COMBAT-ONE-FORMULA: SATISFIED         # 새 공식이 아니라 Final Damage 증폭이다
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C015 — 같은 조건 다섯 대에서 [20, 20, 40, 40, 20] 이 실측되고, 성질을 바꾸면 빈도·크기가 각각 달라지며, 발생 여부·확률·배율·증폭 전
      값 넷이 모든 타격의 계산 경위에 실린다
    overlay_gap: >-
