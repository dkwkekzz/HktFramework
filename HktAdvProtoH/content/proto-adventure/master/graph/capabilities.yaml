  # ══════════════════════════════════════════════════════════════════════
  # 자원 유래 Capability (BW §8 · §10 · §17)
  #
  # BW §17 의 Capability Gate — 탐험에서 얻은 자원이 다음 탐험의 조건이 되는 순환 —
  # 이 이 둘을 통해 성립한다. 그래서 required_by 가 MP-ADAPT-BY-RESOURCE 로 이어진다.
  # 방향을 뒤집으면 안 된다 (BW §18): 자원이 있으니 능력을 만드는 것이 아니라,
  # 그 층을 넘으려면 그 능력이 필요하고 그 획득 경로 중 하나가 자원인 것이다.
  # ══════════════════════════════════════════════════════════════════════

  - id: MC-RESTORE-BIOLOGICAL-STATE
    type: capability
    semantic: >
      생명체를 단순 치료하는 것이 아니라 최근의 안정적인 생체 상태에 가깝게 복원한다 —
      치명상·장기 손상·절단 등 기존 의료의 한계를 넘어서는 회복이다. (BW §8)
    detail: >
      회복 아이템과 근본적으로 다르다. 체력을 얼마 채우는 것이 아니라 **이전 상태로
      되돌리는** 것이다. 그래서 잃은 부위나 망가진 기관처럼 수치로 표현되지 않는
      손상에도 작용한다. 이 성질은 지어낸 것이 아니라 회귀초가 살아남은 방식 그
      자체다 — 몸이 부서지는 것이 일상인 곳에서 "빨리 낫기" 대신 "이전 상태를
      유지하기" 로 적응한 결과다 (MW-HYPER-PREDATION).
    world_shape: >
      수치 회복으로는 되돌릴 수 없는 손상이 세계에 있고, 이것이 그것을 되돌릴 수
      있어야 한다. 단순히 큰 회복량이면 이 노드가 아니다.
    part_of:
      grounded: true
      memberships:
        - system: MS-RESOURCE-GATE
          source: BW §8 · §9 · §17
    required_by: [MP-ADAPT-BY-RESOURCE]
    demanded_by: []
    constraints: [DC-WORLD-RESOURCE-ADAPTATION-TRACE]
    constraint_evaluation:
      DC-WORLD-RESOURCE-ADAPTATION-TRACE: SATISFIED    # Trace 를 문서가 공급한다 — MW-HYPER-PREDATION → 생존 압력 → 상태 보존 적응 → 회귀초 (BW §8~§9)
    overlay: MISSING
    overlay_gap: >-
      회복이라는 개념이 없다 — 생명은 줄기만 하고 되돌리는 경로는 디버그뿐이다

  - id: MC-CUT-ABNORMAL-STRUCTURE
    type: capability
    semantic: >
      다른 물질의 구조적 연결을 절단하거나 비정상적인 방어 구조에도 영향을 준다 —
      단순한 공격력 상승이 아니라 기존에는 파괴할 수 없던 생물·구조에의 대응이다. (BW §10 · §17)
    detail: >
      공격력이 큰 무기가 아니다. 아무리 세게 때려도 부술 수 없던 것을 부술 수 있게
      되는 종류의 능력이다. 이 성질 역시 경계결정이 살아남은 방식에서 곧바로 나온다 —
      공간이 어긋나도 자기 구조를 유지한 광물이므로, 반대로 다른 것의 구조적 연결에
      작용할 수 있다 (MW-SPATIAL-SHEAR). BW §17 이 이것을 "기존에는 파괴할 수 없던
      생물·구조 대응" 을 여는 문으로 든다.
    world_shape: >
      일반적인 공격으로는 어떻게 해도 통하지 않는 구조가 세계에 있고,
      이것을 지녀야만 그 구조에 작용할 수 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-RESOURCE-GATE
          source: BW §10 · §17
    required_by: [MP-ADAPT-BY-RESOURCE]
    demanded_by: []
    constraints: [DC-WORLD-RESOURCE-ADAPTATION-TRACE]
    constraint_evaluation:
      DC-WORLD-RESOURCE-ADAPTATION-TRACE: SATISFIED    # Trace: MW-SPATIAL-SHEAR → 물질 소멸 → IP-BOUNDARY-STABLE → IT-BOUNDARY-BLADE (BW §10)
    overlay: MISSING
    overlay_gap: >-
      제작·장착이 없고, 통하지 않는 구조라는 개념도 없다

