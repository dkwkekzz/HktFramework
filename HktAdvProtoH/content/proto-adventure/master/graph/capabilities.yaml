      DC-CONDITION-OPENS-WITHOUT-RECORDING: SATISFIED # 태도를 저장하지 않아 "물러나면 풀린다" 가 파생으로 성립한다
    overlay: IMPLEMENTED
    overlay_evidence: >-
      **C018** — 태도가 방향을 가진 쌍의 값으로 서고(적대·중립·우호), 그 값이 공격 가부를 가르며(중립인 것은 닿아도 상하지 않고 사유가 함께 온다), 두
      방향이 모두 관찰에 실린다. 세계 서버 실측: 자리 중심까지 5.70 에서 적대로 갈리고 9.28 에서 풀리며 그 존재가 자기 자리로 돌아간다. **태도를
