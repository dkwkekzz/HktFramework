  # 지목 (TG §0 · §2 · §3 · §4 · §6)
  #
  # 어느 층에 속한 능력이 아니다 — 어느 층에서든 "지금 누구에게 하는가" 를 세계에
  # 두는 자리다. 그래서 demanded_by(장소가 요구하는 것)가 비어 있고 required_by 로만
  # 매달린다. 지목이 무엇을 만들지 않는가는 DC-TARGET-IS-INTENT-NOT-AIM(DRAFT)이 정한다.
