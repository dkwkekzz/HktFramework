      준비할수록 값어치가 커지며, 그래서 이 노드는 상대의 행동에 진행 구간이
      있어야만 의미를 갖는다.
    world_shape: >
      상대의 행동에 시작과 완성 사이의 구간이 있고, 그 구간에 노려서 개입하면
