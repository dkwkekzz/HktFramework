  - id: MC-READ-ENVIRONMENT
    type: capability
    semantic: >
      환경 자체를 읽는다 — 무엇이 위험 요소이고 언제 발동하는지를 생물과
      독립적으로 볼 수 없는 지역에서 파악한다.
    detail: >
      상대를 읽는 것(MC-OBSERVE)의 환경판이다. 이 층부터는 장소가 상대의 일부이므로
      상대만 읽어서는 부족해진다. 위험 요소가 언제 발동하는지 알아야 그것을 피하거나
      이용할 수 있다.
    world_shape: >
      스스로 작동하는 환경 위험이 있고, 그 발동 조건을 세계 안에서 알아낼 수 있어야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
