  - id: MC-OBSERVE
    type: capability
    semantic: >
      행동하기 전에 대상을 관찰하여 그 행동·습성·상태의 정보를 얻는다.
    detail: >
      탐험 축 전체의 첫 칸이다. 이 노드의 값어치는 정보를 주는 데 있는 것이 아니라
      **정보를 얻는 데 대가가 들게** 하는 데 있다. 모든 것이 처음부터 보이면 관찰이라는
      행위가 존재할 수 없고, "관찰 → 이해 → 대응" 이라는 진행 구조(BW §32)의 첫 칸이
      비어 버린다. 그래서 이것은 새 정보 표시가 아니라 정보 공개 시점의 규칙이다.
    world_shape: >
