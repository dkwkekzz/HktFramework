    overlay: MISSING

  # ══════════════════════════════════════════════════════════════════════
  # 지목 (TG §0 · §2 · §3 · §4 · §6)
  #
  # 어느 층에 속한 능력이 아니다 — 어느 층에서든 "지금 누구에게 하는가" 를 세계에
  # 두는 자리다. 그래서 demanded_by(장소가 요구하는 것)가 비어 있고 required_by 로만
  # 매달린다. 지목이 무엇을 만들지 않는가는 DC-TARGET-IS-INTENT-NOT-AIM(DRAFT)이 정한다.
  # ══════════════════════════════════════════════════════════════════════

  - id: MC-DESIGNATE-TARGET
    type: capability
    semantic: >
      세계 안의 존재 하나를 자기 의도의 대상으로 고르고, 세계가 그 관계를 기억한다.
      고른 뒤의 행동들은 저마다 대상을 다시 찾지 않고 같은 대상으로 나간다.
    detail: >
      이 능력이 있는 몸과 없는 몸의 차이는 무엇을 할 수 있는가가 아니라, 누구에게
      하는가가 어디에 있는가다. 없으면 살펴봄과 채집과 공격이 저마다 대상을 찾으므로
      같은 존재를 보고 있어도 행동마다 다른 상대로 나갈 수 있다 (TG §1). 있으면
      지금 누구를 상대하고 있는지가 세계가 지닌 사실이 되고 그 위에 관찰과 행동이
      함께 얹힌다. 이 관계는 보는 사람마다 따로 성립한다 — 같은 존재를 한 사람은
      고르고 다른 사람은 고르지 않을 수 있으며, 대상은 자기가 골라졌다는 이유만으로
      달라지지 않는다 (TG §2.1). 앎(MC-OBSERVE)과 헷갈리면 안 된다: 처음 보는
      존재도 고를 수 있고, 골랐다고 해서 가려진 것이 열리지 않는다 (TG §2.3).
    world_shape: >
      플레이어가 존재 하나를 골라 둘 수 있고 새로 고르기 전까지 그 선택이 유지되며,
      두 사람이 같은 세계에서 서로 다른 대상을 고른 채 서 있을 수 있어야 한다.
      멀어지거나 보이지 않게 되는 것만으로는 풀리지 않고, 대상이 세계에서 사라지면
      함께 정리되어야 한다. 그리고 고른 뒤의 행동이 바로 그 대상으로 나가는 것이
      플레이로 보여야 한다. 고르기 전에도 무엇을 고를 수 있고 그것이 나를 어떻게
      대하는지가 관찰에 드러나야 한다 — 다음 대상을 차례로 골라 나가는 것은 화면이
      하는 일이므로, 화면이 그 판단의 재료를 세계에서 받아야 한다 (Q26).
    part_of:
      grounded: true
      memberships:
        - system: MS-TARGETING
          source: TG §0 · §2 · §3
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER]
    demanded_by: []
    constraints: [DC-TARGET-IS-INTENT-NOT-AIM, DC-WORLD-OWNS-THE-SURFACE-LIST]
    constraint_evaluation:
      DC-TARGET-IS-INTENT-NOT-AIM: SATISFIED      # 고르는 것으로는 아무것도 일어나지 않는다 — 이후 행동의 대상이 정해질 뿐이다
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED   # 고를 수 있는가·지금 되는가와 그 사유를 세계가 싣는다 (TG §5.5 · §6.1)
    overlay: IMPLEMENTED

  - id: MC-WATCH-TARGET
    type: capability
    semantic: >
      고른 대상의 지금 상태와, 그 대상에게 지금 할 수 있는 것과 할 수 없는 사유를
      한자리에서 계속 읽는다. 읽히는 값은 고른 순간의 사본이 아니라 지금의 값이다.
    detail: >
      살펴봄(MC-OBSERVE)이 무엇을 알게 되는가라면 이것은 이미 알게 된 것과 늘 보이는
      것을 어디서 계속 보는가다. 둘을 섞으면 지목이 앎의 대가를 건너뛰는 문이 된다 —
      가려진 것은 여기서도 가려진 채로 있고, 가려졌다는 사실이 함께 보인다 (TG §3.2).
      값어치는 표시가 아니라 판단에 있다. 멀어져도 선택이 풀리지 않고 대신 왜 지금
      할 수 없는지가 같은 자리에서 갱신되어야, 플레이어가 다가갈지 물러설지를 고를
      수 있다 (TG §4.2). 사유가 사라지고 행동만 회색으로 남으면 이 능력이 아니다.
    world_shape: >
      고른 대상의 생명·행동·거리가 세계가 바뀌는 대로 갱신되어 보이고, 아직 가려진
      것은 가려졌다는 사실과 함께 보이며, 지금 할 수 없는 행동은 그 사유가 함께
      보여야 한다. 상황이 바뀌면 사유도 따라 바뀌어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-TARGETING
          source: TG §3.2 · §4.2
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER]
    demanded_by: []
    constraints: [DC-WORLD-OWNS-THE-SURFACE-LIST, DC-TARGET-IS-INTENT-NOT-AIM]
    constraint_evaluation:
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED   # 무엇이 되고 왜 안 되는지의 목록은 세계가 싣고 화면은 그것을 표현한다 (TG §6.1 · §6.2)
      DC-TARGET-IS-INTENT-NOT-AIM: SATISFIED      # 계속 읽는 것은 이미 열린 것뿐이다 — 지목이 가려진 것을 열지 않는다
    overlay: IMPLEMENTED

  - id: MC-RELATION-STANCE
    type: capability
    semantic: >
      존재와 존재 사이에 적대·중립·우호라는 태도가 세계의 사실로 있다. 그 태도가
      누구를 칠 수 있는지와 자율 존재가 다가온 것을 어떻게 대하는지를 가른다.
    detail: >
      지금 세계에는 이 태도가 없다 — 휘두른 자리에 닿은 것은 무엇이든 맞는다. 태도를
      세우면 처음으로 "칠 수 있는 것과 칠 수 없는 것" 이 갈리므로, 이것은 표시가 아니라
      판정이다. 세계의 사정은 이미 서 있다: FRINGE 의 포식자는 자기 사냥터에 들어온 것을
      사냥감으로 대하고(MA-HOSTILE-COMBATANT · BW §21), 그것이 그 존재의 목적이다
      (MG-HOLD-HUNTING-GROUND). 태도는 존재의 이름표가 아니라 **사이의 값**이다 —
      같은 존재라도 누구를 마주하느냐에 따라 다를 수 있어야 나중에 사람 사이의 태도와
      진영이 같은 자리에 얹힌다.
    world_shape: >
      어떤 존재는 다가온 나를 사냥감으로 대하고 어떤 존재는 그러지 않는다는 것이
      플레이 중에 드러나야 하고, 그 태도에 따라 할 수 있는 일이 실제로 달라져야 하며,
      그 태도가 어느 쪽에서 본 것인지가 관찰에 실려야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-RELATION
          source: BW §21 · §26 — C018 로 의미 확정
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER]
    demanded_by: []
    constraints:
      [
        DC-WORLD-OWNS-THE-SURFACE-LIST,
        DC-WORLD-CREATURE-FROM-PRESSURE,
        DC-WORLD-COMBAT-IS-ONE-POSSIBILITY,
        DC-CONDITION-OPENS-WITHOUT-RECORDING,
      ]
    constraint_evaluation:
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED     # 태도의 값도 무산의 사유도 세계가 싣고, 화면은 문구 표만 지닌다
      DC-WORLD-CREATURE-FROM-PRESSURE: SATISFIED    # 적대가 종류에 붙은 성질이 아니라 지킬 것이 있는가의 결과다
      DC-WORLD-COMBAT-IS-ONE-POSSIBILITY: SATISFIED # 물러나는 것이 실제 답이다 — 이 Constraint 의 첫 실체
      DC-CONDITION-OPENS-WITHOUT-RECORDING: SATISFIED # 태도를 저장하지 않아 "물러나면 풀린다" 가 파생으로 성립한다
    overlay: IMPLEMENTED
    # 적대의 사정은 목록(HOSTILITY_REASONS)이다 — 진영·결투·도발이 오면 관문·관찰 계약을
    # 고치지 않고 목록에 항목만 더한다.

  # ══════════════════════════════════════════════════════════════════════
  # 아이템 (IS §3 · §4 · §5.3~§5.6)
  #
  # 어느 층에 속한 능력이 아니다 — 몸이 무엇을 지니고 무엇을 적용하고 무엇을 주고받는지를
  # 세계에 두는 자리다. 넷은 순서가 있다: 쓰는 것이 서야 장착이 의미를 갖고, 장착이
  # 서야 만든 것이 쓸모를 가지며, 몸 안의 규칙이 다 선 뒤라야 몸 밖이 의미를 갖는다.
  # 정의(카탈로그)와 소지(관찰)는 이 넷의 바닥이며 그 자체로는 능력이 아니다 — 할 수
  # 있는 일을 늘리지 않기 때문이다 (IS §4 · §6).
  # ══════════════════════════════════════════════════════════════════════

  - id: MC-USE-ITEM
    type: capability
    semantic: >
      지닌 물건을 써서 자기 몸이나 대상의 상태를 바꾼다. 쓰면 그 물건은 줄어들고,
      쓸 수 없을 때는 왜 안 되는지가 함께 온다. (IS §5.3)
    detail: >
      물건을 가지고 있는 것과 그것을 쓰는 것은 다르다. 지금 세계에는 캐서 늘어나는 길만
      있고 쓰는 길도 줄어드는 길도 없어서, 가진 것이 무엇이든 몸에는 아무 영향이 없다.
      이 능력이 서면 처음으로 "가진 것을 써서 상황을 바꾼다" 가 가능해지고, 동시에
      세계에 처음으로 가진 것이 사라지는 경로가 생긴다. 자원으로 감당하는 갈래
      (MP-ADAPT-BY-RESOURCE)가 "물건이 대신해 준다" 라고 말할 때 그 전제가 이것이다.
      제작이나 장착과 헷갈리면 안 된다 — 이것은 한 번 쓰고 없어지는 쪽이고, 장착은
      적용해 두는 쪽이며, 제작은 재료를 다른 것으로 바꾸는 쪽이다.
    world_shape: >
      지닌 것 중에서 지금 쓸 수 있는 것과 쓸 수 없는 것이 사유와 함께 구분되어 보이고,
      쓰면 몸이나 대상의 상태가 실제로 달라지며 그만큼 수량이 줄어든다. 실패한 시도
      뒤에는 상태도 수량도 그대로다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: USE
          source: IS §5.3 · §6
    required_by: [MP-ADAPT-BY-RESOURCE]
    demanded_by: []
    constraints: [DC-ITEM-CHANGE-IS-ONE-UNIT, DC-ITEM-KIND-IS-DATA-NOT-BRANCH, DC-WORLD-OWNS-THE-SURFACE-LIST]
    constraint_evaluation:
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED         # 효과와 수량이 한 단위로 변한다 — 실패는 흔적을 남기지 않는다
      DC-ITEM-KIND-IS-DATA-NOT-BRANCH: SATISFIED    # 무엇을 쓸 수 있는지는 정의가 답하고 규칙은 종류 이름을 묻지 않는다
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED     # 지금 쓸 수 있는 것의 목록과 불가 사유를 세계가 싣는다
    overlay: IMPLEMENTED

  - id: MC-EQUIP-ITEM
    type: capability
    semantic: >
      지닌 것 중 하나를 몸에 적용해, 적용된 동안에만 그 물건이 주는 것을 쓴다.
      풀면 정확히 원래의 몸으로 돌아온다. (IS §5.4)
    detail: >
      가진 것과 지금 적용된 것을 가르는 자리다. 이것이 없으면 물건이 주는 능력은
      세계에서 실현될 곳이 없다 — 성질에서 능력으로 이어지는 사슬(IM-* 의 grants)이
      그래프에는 있어도 몸에 닿지 못한다. 그래서 이 능력은 자원으로 감당하는 갈래가
      "물건을 잃으면 도로 못 하게 된다" 라고 말할 때의 그 되돌아옴을 소유한다.
      능력치를 올리는 것만이 아니다 — 무엇을 적용했느냐에 따라 할 수 있는 행동 자체가
      달라진다. 지니고만 있는 것으로는 아무 일도 일어나지 않는다는 것이 이 능력의 핵심이다.
      적용할 자리는 지닌 것을 담을 칸보다 훨씬 좁아서, 무엇을 걸어 둘지가 그 자체로
      선택이 된다. 실제 플레이에서 더 잦은 것은 빈 자리에 거는 일이 아니라 이미 걸린
      것을 바꿔 끼우는 일이며, 그 바꿔 끼움은 플레이어에게 두 번이 아니라 한 번이다.
    world_shape: >
      같은 물건을 가지고만 있을 때와 적용했을 때 몸이 다르게 판정되고, 풀면 값과 가능한
      행동이 정확히 이전으로 돌아온다. 맞지 않는 자리에 넣으려 하면 사유와 함께 거절된다.
      이미 찬 자리에 넣으면 넣는 것과 빼내는 것이 한 번에 일어나고, 둘 중 하나가 성립하지
      않으면 아무것도 일어나지 않는다. 담을 곳이 모자라 풀 수 없을 때는 그 사유가 오지만,
      바꿔 끼우는 것은 같은 상태에서도 된다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: EQUIP
          source: IS §5.4 · IE §10~§17 · §48 (Cycle 2)
        - system: MS-RESOURCE-GATE
          source: IS §4 (BW §17 의 게이트가 몸에 닿는 지점)
          role: 성질에서 능력으로 이어지는 사슬이 실제 몸에 적용되는 자리
    required_by: [MP-ADAPT-BY-RESOURCE]
    demanded_by: []
    constraints: [DC-ITEM-HOLDING-IS-NOT-APPLYING, DC-ITEM-CAPABILITY-COMES-FROM-GRANTS, DC-GROWTH-NO-CAPABILITY-DUPLICATION, DC-ITEM-CAPACITY-IS-FINITE, DC-ITEM-LIVES-IN-ONE-PLACE]
    constraint_evaluation:
      DC-ITEM-HOLDING-IS-NOT-APPLYING: SATISFIED    # 이 노드가 그 분리 자체다 — 보유는 아무것도 바꾸지 않는다
      DC-ITEM-CAPABILITY-COMES-FROM-GRANTS: SATISFIED # 적용된 것이 주는 것을 합쳐 계산한다 — 성질 목록을 조회하지 않는다
      DC-GROWTH-NO-CAPABILITY-DUPLICATION: SATISFIED  # 장착은 기존 MC-* 를 여는 경로일 뿐 새 능력을 복제하지 않는다
      DC-ITEM-CAPACITY-IS-FINITE: SATISFIED         # 자리가 담을 칸보다 좁고, 그 수를 Cycle 이 정한다
      DC-ITEM-LIVES-IN-ONE-PLACE: SATISFIED          # 자리가 물건을 담는다 — 담긴 곳을 가리키지 않는다
    overlay: MISSING

  - id: MC-CRAFT-FROM-MATERIALS
    type: capability
    semantic: >
      가진 재료를 정해진 조합으로 다른 것으로 바꾼다. 재료는 줄고 결과물이 생기며,
      둘은 함께 일어나거나 함께 일어나지 않는다. (IS §5.5)
    detail: >
      캐 온 것이 그 자체로는 쓸모가 없고 무엇으로 바뀌어야 값을 갖는 자리다. 자원으로
      감당하는 갈래가 "그 광물을 얻어 무기를 만들면 전에는 부술 수 없던 것을 상대할 수
      있게 된다" 라고 말할 때, 그 만든다는 대목이 이 능력이다 (BW §17). 문명권에서
      준비하는 갈래도 같은 것을 요구한다 — 그쪽은 안전한 곳에서 미리 만든다는 점이
      다를 뿐이다 (BW §14). 무엇을 만들 수 있는지는 조합 데이터가 정하고, 어디서
      만들 수 있는지는 그 조합이 요구하는 자리와 도구가 정한다.
    world_shape: >
      지금 만들 수 있는 것과 무엇이 모자라 못 만드는지가 실행 전에 보이고, 만들면
      재료가 줄고 결과물이 생긴다. 실패한 제작에서는 재료가 하나도 줄지 않는다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: CRAFT
          source: IS §5.5
        - system: MS-RESOURCE-GATE
          source: IS §4 (BW §17 · §14)
          role: 층에서 얻은 재료가 다음 층을 감당할 물건이 되는 변환 지점
    required_by: [MP-ADAPT-BY-RESOURCE, MP-PREPARE-IN-CIVILIZATION]
    demanded_by: []
    constraints: [DC-ITEM-CHANGE-IS-ONE-UNIT, DC-GROWTH-DEFINITION-INSTANCE-SPLIT, DC-ITEM-KIND-IS-DATA-NOT-BRANCH]
    constraint_evaluation:
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED         # 재료 감소와 결과물 증가가 한 단위다 — 일부만 사라지는 상태가 없다
      DC-GROWTH-DEFINITION-INSTANCE-SPLIT: SATISFIED # 조합 결과를 미리 만들어 두지 않는다 — 만들 때 생긴다
      DC-ITEM-KIND-IS-DATA-NOT-BRANCH: SATISFIED    # 제작법은 데이터이고 새 항목이 규칙 코드를 열지 않는다
    overlay: MISSING

  - id: MC-TRANSFER-ITEM
    type: capability
    semantic: >
      몸 밖에 있는 물건을 주고받는다 — 세계에 놓인 것을 집고, 지닌 것을 내려놓고,
      다른 존재가 남긴 보관소에서 가져온다. 한 물건은 한 번만 옮겨진다. (IS §5.6)
    detail: >
      지금 세계에서 물건은 언제나 누군가의 몸 안에 있다. 이 능력이 서면 처음으로
      물건이 누구의 것도 아닌 채로 공간에 놓일 수 있게 되고, 그때 비로소 전리품·드롭·
      거래가 얹힐 바닥이 생긴다. 희귀 기관을 얻는 다섯 갈래 중 셋이 이것을 전제한다 —
      쓰러뜨린 몸에서 얻는 길, 떨어진 것을 줍는 길, 다른 주체에게서 넘겨받는 길이
      모두 몸 밖의 물건을 요구한다 (BW §27). 누가 가져갈 수 있는지와 언제 사라지는지도
      이 자리가 함께 정한다 — 그 둘이 없으면 세계가 물건으로 덮인다.
    world_shape: >
      물건이 특정 위치를 가진 존재로 세계에 있고, 조건을 만족하면 몸으로 옮길 수 있으며
      반대 방향도 가능하다. 권한이 없거나 멀면 사유와 함께 거절되고, 둘이 동시에 마지막
      하나를 집으면 한 쪽만 성공한다. 적용해 둔 것을 세계에 내려놓는 길은 담을 곳을
      거치지 않는다 — 담을 곳이 가득해도 내려놓을 수 있다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: WORLD
          source: IS §5.6 · IE §34~§35
    required_by: [MP-KILL-CREATURE, MP-TAKE-SHED-ORGAN, MP-TRADE-WITH-ACTOR]
    demanded_by: []
    constraints: [DC-ITEM-CHANGE-IS-ONE-UNIT, DC-WORLD-OWNS-THE-SURFACE-LIST, DC-ITEM-LIVES-IN-ONE-PLACE]
    constraint_evaluation:
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED         # 양쪽이 한 단위로 바뀐다 — 같은 물건이 두 곳에 있는 상태가 없다
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED     # 주변에 무엇이 있고 지금 왜 못 집는지를 세계가 싣는다
      DC-ITEM-LIVES-IN-ONE-PLACE: SATISFIED          # 옮겨진 물건은 옮겨간 곳이 담는다 — 양쪽에 남지 않는다
    overlay: MISSING

