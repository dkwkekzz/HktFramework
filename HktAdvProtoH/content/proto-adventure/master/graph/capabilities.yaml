      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 조합이면 같은 결과 (DT §8)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C012 — 같은 스킬 값이 상대에 따라 20/14 ↔ 17/22 로 갈리는 것이 실측

  - id: MC-PENETRATION
    type: capability
    semantic: >
      상대의 방어 중 내 공격이 마주한 쪽을 얼마간 통하지 않게 만든다. 방어를 없애지는 못하고,
      마주하지 않은 다른 방어에는 닿지 않으며, 두껍게 굳힌 상대일수록 무력화의 몫이 커진다.
    detail: >
      방어 감쇄(MC-DEFENSE-MITIGATION)가 "두꺼울수록 효율이 떨어진다" 는 곡선을 가지기
      때문에, 그 곡선에 들어가는 방어 값을 깎으면 두꺼운 상대일수록 이득이 커진다.
      즉 관통은 방어 특화 상대를 겨냥한 대응 수단이다. 세 가지 한계가 이 노드의 성격을
      정한다 — 없애지 못하고, 마주한 쪽에만 닿고, 확률이 아니다.
    world_shape: >
      관통을 지닌 쪽이 같은 스킬로 더 큰 피해를 넣고, 마주하지 않은 방어는 그대로이며,
      관통이 아무리 커도 방어가 완전히 사라지지 않아야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: PENETRATION
          source: R1 §14 · DT §15
    required_by: [MP-PIERCE-THE-HARD-DEFENSE]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-FORMULA, DC-COMBAT-MATCHUP-SOFT]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률로 무시하는 것이 아니라 결정적으로 깎는다 (R1 §14 · DT §15)
      DC-COMBAT-ONE-FORMULA: SATISFIED         # 새 공식이 아니다 — 바뀌는 것은 감쇄식이 읽는 방어 값 하나다
      DC-COMBAT-MATCHUP-SOFT: SATISFIED        # 배율표·면역 없음 — 깎이기 전후의 방어가 관찰된다
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C013 — 마주한 방어가 90 → 56.25 로 깎이고, 마주하지 않은 방어는 그대로이며(물리 20 유지), 두꺼울수록 걷어내는 양이
      커지고(0/7.5/33.75/112.5), 극단값에서도 방어가 남는다
    overlay_gap: >-
