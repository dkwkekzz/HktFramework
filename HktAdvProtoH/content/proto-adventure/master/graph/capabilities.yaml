  - id: MC-USE-ITEM
    type: capability
    semantic: >
      지닌 물건을 써서 자기 몸이나 대상의 상태를 바꾼다. 쓰면 그 물건은 줄어들고,
      쓸 수 없을 때는 왜 안 되는지가 함께 온다. (IS §5.3)
    detail: >
      물건을 가지고 있는 것과 그것을 쓰는 것은 다르다. 지금 세계에는 캐서 늘어나는 길만
      있고 쓰는 길도 줄어드는 길도 없어서, 가진 것이 무엇이든 몸에는 아무 영향이 없다.
      이 능력이 서면 처음으로 "가진 것을 써서 상황을 바꾼다" 가 가능해지고, 동시에
      세계에 처음으로 가진 것이 사라지는 경로가 생긴다. 자원으로 감당하는 갈래
      (MP-ADAPT-BY-RESOURCE)가 "물건이 대신해 준다" 라고 말할 때 그 전제가 이것이다.
      제작이나 장착과 헷갈리면 안 된다 — 이것은 한 번 쓰고 없어지는 쪽이고, 장착은
      적용해 두는 쪽이며, 제작은 재료를 다른 것으로 바꾸는 쪽이다.
    world_shape: >
      지닌 것 중에서 지금 쓸 수 있는 것과 쓸 수 없는 것이 사유와 함께 구분되어 보이고,
      쓰면 몸이나 대상의 상태가 실제로 달라지며 그만큼 수량이 줄어든다. 실패한 시도
      뒤에는 상태도 수량도 그대로다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: USE
          source: IS §5.3 · §6
    required_by: [MP-ADAPT-BY-RESOURCE]
    demanded_by: []
    constraints: [DC-ITEM-CHANGE-IS-ONE-UNIT, DC-ITEM-KIND-IS-DATA-NOT-BRANCH, DC-WORLD-OWNS-THE-SURFACE-LIST]
    constraint_evaluation:
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED         # 효과와 수량이 한 단위로 변한다 — 실패는 흔적을 남기지 않는다
      DC-ITEM-KIND-IS-DATA-NOT-BRANCH: SATISFIED    # 무엇을 쓸 수 있는지는 정의가 답하고 규칙은 종류 이름을 묻지 않는다
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED     # 지금 쓸 수 있는 것의 목록과 불가 사유를 세계가 싣는다
    overlay: IMPLEMENTED
    overlay_evidence: >-
      **C020** — 세계 프로세스 실측으로 world_shape 세 문장이 모두 닫혔다: 지금 쓸 수 있는 것과 없는 것이 사유와 함께 구분되어 오고(관찰
      계약), 고른 상대에게 돌을 던져 상태가 바뀌며 수량이 준다(타격 기록 `["stone", 3]` · 60초 16회 시도 9회 성립), 끊긴 사용은 수량도 상태도
      건드리지 않는다. 규칙은 종류 이름을 묻지 않고 정의소에 묻는다

  - id: MC-EQUIP-ITEM
    type: capability
    semantic: >
      지닌 것 중 하나를 몸에 적용해, 적용된 동안에만 그 물건이 주는 것을 쓴다.
      풀면 정확히 원래의 몸으로 돌아온다. (IS §5.4)
    detail: >
      가진 것과 지금 적용된 것을 가르는 자리다. 이것이 없으면 물건이 주는 능력은
      세계에서 실현될 곳이 없다 — 성질에서 능력으로 이어지는 사슬(IM-* 의 grants)이
      그래프에는 있어도 몸에 닿지 못한다. 그래서 이 능력은 자원으로 감당하는 갈래가
      "물건을 잃으면 도로 못 하게 된다" 라고 말할 때의 그 되돌아옴을 소유한다.
      능력치를 올리는 것만이 아니다 — 무엇을 적용했느냐에 따라 할 수 있는 행동 자체가
      달라진다. 지니고만 있는 것으로는 아무 일도 일어나지 않는다는 것이 이 능력의 핵심이다.
      적용할 자리는 지닌 것을 담을 칸보다 훨씬 좁아서, 무엇을 걸어 둘지가 그 자체로
      선택이 된다. 실제 플레이에서 더 잦은 것은 빈 자리에 거는 일이 아니라 이미 걸린
      것을 바꿔 끼우는 일이며, 그 바꿔 끼움은 플레이어에게 두 번이 아니라 한 번이다.
    world_shape: >
      같은 물건을 가지고만 있을 때와 적용했을 때 몸이 다르게 판정되고, 풀면 값과 가능한
      행동이 정확히 이전으로 돌아온다. 맞지 않는 자리에 넣으려 하면 사유와 함께 거절된다.
      이미 찬 자리에 넣으면 넣는 것과 빼내는 것이 한 번에 일어나고, 둘 중 하나가 성립하지
      않으면 아무것도 일어나지 않는다. 담을 곳이 모자라 풀 수 없을 때는 그 사유가 오지만,
      바꿔 끼우는 것은 같은 상태에서도 된다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: EQUIP
          source: IS §5.4 · IE §10~§17 · §48 (Cycle 2)
        - system: MS-RESOURCE-GATE
          source: IS §4 (BW §17 의 게이트가 몸에 닿는 지점)
          role: 성질에서 능력으로 이어지는 사슬이 실제 몸에 적용되는 자리
    required_by: [MP-ADAPT-BY-RESOURCE]
    demanded_by: []
    constraints: [DC-ITEM-HOLDING-IS-NOT-APPLYING, DC-ITEM-CAPABILITY-COMES-FROM-GRANTS, DC-GROWTH-NO-CAPABILITY-DUPLICATION, DC-ITEM-CAPACITY-IS-FINITE, DC-ITEM-LIVES-IN-ONE-PLACE, DC-ITEM-CHANGE-IS-ONE-UNIT]
    constraint_evaluation:
      DC-ITEM-HOLDING-IS-NOT-APPLYING: SATISFIED    # 이 노드가 그 분리 자체다 — 보유는 아무것도 바꾸지 않는다
      DC-ITEM-CAPABILITY-COMES-FROM-GRANTS: SATISFIED # 적용된 것이 주는 것을 합쳐 계산한다 — 성질 목록을 조회하지 않는다
      DC-GROWTH-NO-CAPABILITY-DUPLICATION: SATISFIED  # 장착은 기존 MC-* 를 여는 경로일 뿐 새 능력을 복제하지 않는다
      DC-ITEM-CAPACITY-IS-FINITE: SATISFIED         # 자리가 담을 칸보다 좁고, 그 수를 Cycle 이 정한다
      DC-ITEM-LIVES-IN-ONE-PLACE: SATISFIED          # 자리가 물건을 담는다 — 담긴 곳을 가리키지 않는다
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED          # 교체가 전부 아니면 전무다 — 실패는 자리도 수량도 값도 용도도 두지 않는다
    overlay: IMPLEMENTED
    overlay_evidence: >-
      **C023 · C024** — 세계 프로세스 실측으로 world_shape 네 문장이 모두 닫혔다. C023: 같은 곡괭이를 가지고만 있으면 캐지지 않고 걸어야
      캐지며(사유 `no-mining-tool`), 걸면 물리 공격 40 → 52 · 풀면 **정확히 40** 으로 돌아오고, 걸릴 수 없는 물건은
      `not-equippable` 로 거절되며, 담을 곳이 모자라면 풀기가 `no-room` 으로 거절되고 자리도 수량도 건드리지 않는다. C024: 가방
      **4/4** 인 그 상태에서 해제는 `no-room` 으로 막히는데 **바꿔 끼기는 성립하고 자리가 4/4 그대로다** — 밀려남과 걸림이 한 단위이고, 물리
      공격 52 → **40**(기본값) · 물리 방어 50 → 65 로 헌것의 기여가 정확히 사라지며 채집도 함께 사라진다. 실패한 교체 셋(not-enough ·
      not-equippable · unknown-slot)은 자리 · 수량 · 유효 값 · 용도 넷을 그대로 둔다
    overlay_gap: >-
      — (**곁가지 하나** — 전용 자리를 선언한 물건이 아직 없어 `slot-not-fit` 이 코드에만 서 있고 플레이에서 겪히지 않는다. 그리고 자리 여섯이
      걸 것 둘보다 여전히 넓어, 교체가 *불편을 푸는 일*이지 아직 *고르는 일*은 아니다 — C024 08 Master Gap ②)

  - id: MC-CRAFT-FROM-MATERIALS
    type: capability
    semantic: >
      가진 재료를 정해진 조합으로 다른 것으로 바꾼다. 재료는 줄고 결과물이 생기며,
      둘은 함께 일어나거나 함께 일어나지 않는다. (IS §5.5)
    detail: >
      캐 온 것이 그 자체로는 쓸모가 없고 무엇으로 바뀌어야 값을 갖는 자리다. 자원으로
      감당하는 갈래가 "그 광물을 얻어 무기를 만들면 전에는 부술 수 없던 것을 상대할 수
      있게 된다" 라고 말할 때, 그 만든다는 대목이 이 능력이다 (BW §17). 문명권에서
      준비하는 갈래도 같은 것을 요구한다 — 그쪽은 안전한 곳에서 미리 만든다는 점이
      다를 뿐이다 (BW §14). 무엇을 만들 수 있는지는 조합 데이터가 정하고, 어디서
      만들 수 있는지는 그 조합이 요구하는 자리와 도구가 정한다.
    world_shape: >
      지금 만들 수 있는 것과 무엇이 모자라 못 만드는지가 실행 전에 보이고, 만들면
      재료가 줄고 결과물이 생긴다. 실패한 제작에서는 재료가 하나도 줄지 않는다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: CRAFT
          source: IS §5.5
        - system: MS-RESOURCE-GATE
          source: IS §4 (BW §17 · §14)
          role: 층에서 얻은 재료가 다음 층을 감당할 물건이 되는 변환 지점
        - system: MS-BEIRA-TERRAIN
          source: BT §4.5
          role: 골각 장인이 왕골과 바깥에서 가져온 소재를 결합해 탐험 장비를 만든다
    required_by: [MP-ADAPT-BY-RESOURCE, MP-PREPARE-IN-CIVILIZATION]
    demanded_by: [MW-TERRAIN-BAIWANG-BASIN]
    constraints: [DC-ITEM-CHANGE-IS-ONE-UNIT, DC-GROWTH-DEFINITION-INSTANCE-SPLIT, DC-ITEM-KIND-IS-DATA-NOT-BRANCH]
    constraint_evaluation:
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED         # 재료 감소와 결과물 증가가 한 단위다 — 일부만 사라지는 상태가 없다
      DC-GROWTH-DEFINITION-INSTANCE-SPLIT: SATISFIED # 조합 결과를 미리 만들어 두지 않는다 — 만들 때 생긴다
      DC-ITEM-KIND-IS-DATA-NOT-BRANCH: SATISFIED    # 제작법은 데이터이고 새 항목이 규칙 코드를 열지 않는다
    overlay: MISSING
    overlay_evidence: >-
      코드 대조 — 재료를 다른 것으로 바꾸는 규칙이 0건이다. 재료를 **줄이는** 통로는 C020 으로 생겼다
    overlay_gap: >-
      제작법 데이터 · 가능 여부 판정 · 재료 소모와 결과물 생성의 한 단위 처리

  - id: MC-TRANSFER-ITEM
    type: capability
    semantic: >
      몸 밖에 있는 물건을 주고받는다 — 세계에 놓인 것을 집고, 지닌 것을 내려놓고,
      다른 존재가 남긴 보관소에서 가져온다. 한 물건은 한 번만 옮겨진다. (IS §5.6)
    detail: >
      지금 세계에서 물건은 언제나 누군가의 몸 안에 있다. 이 능력이 서면 처음으로
      물건이 누구의 것도 아닌 채로 공간에 놓일 수 있게 되고, 그때 비로소 전리품·드롭·
      거래가 얹힐 바닥이 생긴다. 희귀 기관을 얻는 다섯 갈래 중 셋이 이것을 전제한다 —
      쓰러뜨린 몸에서 얻는 길, 떨어진 것을 줍는 길, 다른 주체에게서 넘겨받는 길이
      모두 몸 밖의 물건을 요구한다 (BW §27). 누가 가져갈 수 있는지와 언제 사라지는지도
      이 자리가 함께 정한다 — 그 둘이 없으면 세계가 물건으로 덮인다.
    world_shape: >
      물건이 특정 위치를 가진 존재로 세계에 있고, 조건을 만족하면 몸으로 옮길 수 있으며
      반대 방향도 가능하다. 권한이 없거나 멀면 사유와 함께 거절되고, 둘이 동시에 마지막
      하나를 집으면 한 쪽만 성공한다. 적용해 둔 것을 세계에 내려놓는 길은 담을 곳을
      거치지 않는다 — 담을 곳이 가득해도 내려놓을 수 있다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ITEM-SYSTEM
          segment: WORLD
          source: IS §5.6 · IE §34~§35
        - system: MS-BEIRA-TERRAIN
          source: BT §4.5 · §4.6
          role: 원정 조합이 자원과 정보를 거래한다 — 분지가 교역 중심인 것이 이 자리다
    required_by: [MP-KILL-CREATURE, MP-TAKE-SHED-ORGAN, MP-TRADE-WITH-ACTOR]
    demanded_by: [MW-TERRAIN-BAIWANG-BASIN]
    constraints: [DC-ITEM-CHANGE-IS-ONE-UNIT, DC-WORLD-OWNS-THE-SURFACE-LIST, DC-ITEM-LIVES-IN-ONE-PLACE]
    constraint_evaluation:
      DC-ITEM-CHANGE-IS-ONE-UNIT: SATISFIED         # 양쪽이 한 단위로 바뀐다 — 같은 물건이 두 곳에 있는 상태가 없다
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED     # 주변에 무엇이 있고 지금 왜 못 집는지를 세계가 싣는다
      DC-ITEM-LIVES-IN-ONE-PLACE: SATISFIED          # 옮겨진 물건은 옮겨간 곳이 담는다 — 양쪽에 남지 않는다
    overlay: MISSING
    overlay_evidence: >-
      코드 대조 — 물건은 언제나 누군가의 몸 안에 있다. 위치를 가진 아이템 존재가 없다. 몸 **안**에서 사라지는 경로는 C020 으로 생겼다
    overlay_gap: >-
      몸 밖의 아이템 · 줍기 · 버리기 · 전리품 보관소 · 획득 권한 · 소멸. 쓰러진 몸에서 아무것도 나오지 않는 것이 이 결손이다. IE 가 더한 것: 적용해
      둔 것을 내려놓는 길이 담을 곳을 거치지 않는다는 것 (IE §35)

  # ══════════════════════════════════════════════════════════════════════
  # 대지형 — 각 땅의 법칙이 요구하는 것 (BT §4~§11)
  # ══════════════════════════════════════════════════════════════════════
  # 요구처는 전부 장소다 (demanded_by) — 방법(Possibility)이 요구하는 것이 아직 없다.
  # BT 는 각 지형이 무엇을 요구하는지를 공급하고, 그것을 어떤 경로로 갖추는지는
  # 이미 선 세 방법(익힌다 · 빌린다 · 준비해 간다)이 소유한다.
  # 이미 있는 노드를 다시 만들지 않았다 — 환경 읽기 · 살펴봄 · 예측 · 자기 붙들기 ·
  # 실재 검증 · 밀어내기 · 제작 · 주고받기는 기존 노드에 이 지형들을 요구처로 더했다.

  - id: MC-CARRY-LIFE-SUPPORT
    type: capability
    semantic: >
      살아 있게 하는 것을 몸 밖에서 얻어 지니고, 나누고, 필요한 자리로 옮긴다 —
      그 땅에서는 저절로 주어지지 않는 열이나 공기 같은 것들이다.
    detail: >
      회복이 아니다. 잃은 것을 되돌리는 것이 아니라 애초에 그 땅에 없는 것을 가지고
      들어가는 일이다. 무호흡해의 핵심 경험이 이것을 그대로 적는다 — 숨을 참는 것이
      아니라 호흡 가능한 공간을 찾아 만들고 운반하는 것 (BT §7.7). 빙원에서는 같은 일이
      열로 일어나고, 거기서 생기는 판단은 동료와 그것을 나눌지다 (BT §5.7). 유한하고
      나눌 수 있어야 이 능력이 선택이 된다 — 무제한이면 그냥 통행증이다.
    world_shape: >
      그 땅에 없는 것(열 · 공기 같은)이 세계의 유한한 자원으로 존재하고, 지니고 나누고
      옮길 수 있으며, 떨어졌을 때 몸에 실제 결과가 와야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §7.7 · §7.5 · §5.7
          role: 두 지형(빙원 · 무호흡해)이 같은 형태로 요구한다
    required_by: []
    demanded_by: [MW-TERRAIN-SUNEATER-ICEFIELD, MW-TERRAIN-BREATHLESS-SEA]
    constraints: [DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION]
    constraint_evaluation:
      DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION: SATISFIED   # 나르는 것의 출처가 자연적 예외다 — 숨나무와 해숨구멍이 만든 것을 가져갈 뿐 사람이 안전을 만들지 않는다
    overlay: MISSING
    overlay_gap: >-
      몸이 열·공기 같은 것을 요구하지 않는다 — 지금 몸이 지닌 것은 생명과 기력뿐이고, 둘 다 나눠 줄 수 없다

  - id: MC-TIME-THE-CYCLE
    type: capability
    semantic: >
      땅의 법칙이 도는 주기를 읽고, 짧게 열리는 창에 맞추어 움직인다.
    detail: >
      기다림이 행동이 되는 자리다. 세 지형이 같은 모양의 일을 각자 적는다 — 포화된
      광맥이 열을 분출하는 짧은 동안 빙하 아래로 들어가고 (BT §5.7), 암초가 포화되는
      날의 공기 조수를 세어 두고 (BT §7.7), 정해진 시기에 유랑대지에 올라타거나 탈피
      시기에 채집한다 (BT §9.6). 혈화수해에서는 그 창이 시간이 아니라 진행이다 —
      꽃이 완성되기 전까지가 창이다 (BT §11.7). BT 는 이 넷을 하나의 능력으로 부르지
      않는다. 이름과 문안은 잠정이며, 그것이 이 노드가 grounded: false 인 이유다.
    world_shape: >
      세계의 어떤 조건이 주기나 진행을 갖고 그것이 관찰로 읽히며, 창이 열린 동안과
      닫힌 동안에 같은 행동이 다른 결과를 내야 한다.
    part_of:
      grounded: false   # BT 가 각 지형의 행동으로만 적고 하나의 이름을 주지 않았다 — semantic 은 잠정이다
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §5.7 · §7.7 · §9.6 · §11.7 (행동으로만)
          role: 네 지형이 같은 모양의 기다림을 요구한다
    required_by: []
    demanded_by:
      - MW-TERRAIN-SUNEATER-ICEFIELD
      - MW-TERRAIN-BREATHLESS-SEA
      - MW-TERRAIN-WALKING-CONTINENTS
      - MW-TERRAIN-BLOODBLOOM-FOREST
    constraints: [DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE]
    constraint_evaluation:
      DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE: SATISFIED   # 창이 언제 열리는지가 풍경의 증거로 읽힌다 (밤마다 떠오르는 열기둥 · 굴절선) — 설명문이 아니다
    overlay: MISSING
    overlay_gap: >-
      세계에 주기를 가진 것이 없다 — 시간이 흐르지만 그 흐름으로 달라지는 땅의 조건이 없다

  - id: MC-FIND-SAFE-ROUTE
    type: capability
    semantic: >
      법칙이 약해지는 자리들을 이어 통과할 길을 만든다 — 짧은 거리가 아니라 살아남는
      거리를 고른다.
    detail: >
      지형을 자기 유리함으로 쓰는 것(MC-USE-TERRAIN)과 다르다. 그것은 한 자리가 가진
      성질을 쓰는 일이고, 이것은 자리와 자리 **사이**를 잇는 일이다. 네 지형이 각각
      적는다 — 해숨구멍 사이의 Route (BT §5.7), 공기 덩어리를 길처럼 연결 (BT §7.7),
      상향 폭포를 이동 Route 로 사용 (BT §8.7), 대지의 움직임으로만 열리는 Route
      (BT §9.6). 안전한 자리가 자연적 예외로 흩어져 있다는 것이 이 능력의 전제다
      (BT §13). BT 는 이 넷을 하나의 이름으로 부르지 않아 문안은 잠정이다.
    world_shape: >
      살 수 있는 자리가 땅에 흩어져 있고 그 사이가 위험해야 하며, 어디를 밟아 건널지를
      플레이어가 고를 수 있어야 한다. 최단 경로가 언제나 최선이면 이 능력은 없는 것이다.
    part_of:
      grounded: false   # BT 가 각 지형의 행동으로만 적고 하나의 이름을 주지 않았다 — semantic 은 잠정이다
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §5.7 · §7.7 · §8.7 · §9.6 (행동으로만)
          role: 네 지형이 같은 모양의 길 찾기를 요구한다
    required_by: []
    demanded_by:
      - MW-TERRAIN-SUNEATER-ICEFIELD
      - MW-TERRAIN-BREATHLESS-SEA
      - MW-TERRAIN-SKYFALL-RANGE
      - MW-TERRAIN-WALKING-CONTINENTS
    constraints: [DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION, DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE]
    constraint_evaluation:
      DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION: SATISFIED   # 이을 자리가 자연적 예외라는 것이 이 능력의 전제다 (BT §13)
      DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE: SATISFIED       # 어느 자리가 안전한지를 증거로 알아본다 — 따뜻한 짐승의 길 · 흔들리는 식물
    overlay: MISSING
    overlay_gap: >-
      땅에 안전한 자리와 위험한 자리의 구분이 없다 — 이을 것도 피할 것도 없다

  - id: MC-ANCHOR-LOCAL-LAW
    type: capability
    semantic: >
      법칙이 흔들리는 자리에 기준을 세워 그 둘레만 하나로 고정한다.
    detail: >
      세 지형이 같은 형태의 검은 돌을 따로 가진다 — 낙하 방향을 하나로 고정하는 정박암
      (BT §8.3 · §8.5), 한 가지 상태만 유지시키는 확정암 (BT §10.3), 생체 상태가 식물로
      전달되는 것을 막는 장송석 (BT §11.3). 사람이 그 곁에 마을과 사원을 세우는 것이
      안전이 자연적 예외라는 이 세계의 형태이며 (BT §13), 그것을 들고 다니며 임시 발판을
      놓는 것이 이 능력이다 (BT §8.7). 자기를 붙들어 두는 것(MC-IDENTITY-ANCHOR)과 다르다 —
      그쪽은 자신에게 걸고 이쪽은 자리에 건다. BT 는 이 셋을 하나의 이름으로 부르지 않는다.
    world_shape: >
      법칙이 흔들리는 자리가 있고, 그 위에 기준을 세우면 둘레의 흔들림이 실제로 멎어야
      하며, 그 범위가 유한해야 한다.
    part_of:
      grounded: false   # BT 가 지형마다 다른 이름의 돌로만 적고 하나의 이름을 주지 않았다 — semantic 은 잠정이다
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §8.3 · §10.3 · §11.3 · §13 (지형별 자원으로만)
          role: 세 지형이 같은 모양의 고정을 요구한다
    required_by: []
    demanded_by:
      - MW-TERRAIN-SKYFALL-RANGE
      - MW-TERRAIN-UNHAPPENED-DESERT
      - MW-TERRAIN-BLOODBLOOM-FOREST
    constraints: [DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION]
    constraint_evaluation:
      DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION: SATISFIED   # 예외를 확대하는 방식 그 자체다 — 사람은 돌을 만들지 못하고 옮겨 놓을 뿐이다
    overlay: MISSING
    overlay_gap: >-
      고정할 흔들림이 없다 — 땅이 아무 법칙도 가지지 않는다

  - id: MC-IMPERSONATE-IDENTITY
    type: capability
    semantic: >
      다른 존재의 표식을 빌려, 세계와 그 안의 생명에게 다른 존재로 인식된다.
    detail: >
      숨는 것이 아니라 다른 것으로 읽히는 것이다. 가면열매는 특정 생물의 표식을 일시적으로
      모방해 숲이나 생물이 그를 다른 존재로 인식하게 한다 (BT §6.5). 임시 이름을 골라
      숲을 통과하고, 다른 존재의 이름으로 문과 생물을 속이는 일이 이 땅의 일상이다
      (BT §6.7). 껍질도둑은 그 표식을 훔쳐 산다 (BT §6.6). 자기를 붙들어 두는 것
      (MC-IDENTITY-ANCHOR)과 반대 방향이다 — 그쪽은 자기 신원을 지키고, 이쪽은 일부러
      다르게 보이게 한다. 성립하려면 세계가 존재를 표식으로 구분하고 있어야 한다.
    world_shape: >
      세계가 존재를 표식으로 구분하고 있고, 그 표식을 빌린 존재가 실제로 다르게 대우받아야
      한다 — 문이 열리거나, 생물이 같은 편으로 여기거나, 땅이 그를 지나치거나.
    part_of:
      grounded: true
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §6.5 · §6.6 · §6.7
          role: 이름을 먹는 수해를 감당하는 두 길 중 하나 (다른 하나는 자기를 붙들어 두는 것)
    required_by: []
    demanded_by: [MW-TERRAIN-NAME-EATING-FOREST]
    constraints: [DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE]
    constraint_evaluation:
      DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE: SATISFIED   # 같은 법칙을 이해한 사람에게 열리는 행동이 둘이다 — 자기를 붙들거나(ANCHOR) 다른 것으로 읽히거나
    overlay: MISSING
    overlay_gap: >-
      존재의 신원이라는 것이 세계에 없다 — 구분되는 것은 종류와 개체 번호뿐이고 그것을 빌릴 자리가 없다

  - id: MC-COORDINATE-WITHOUT-SOUND
    type: capability
    semantic: >
      소리가 전달되지 않는 곳에서 손짓과 빛만으로 뜻을 주고받으며 함께 움직인다.
    detail: >
      무언의 잠수단이 그렇게 암초 심부를 탐사한다 (BT §7.6). 무호흡해에서는 전투와
      붕괴조차 완전한 무음으로 진행되므로 (BT §7.4) 소리로 오던 것 — 경고, 신호,
      다가오는 것의 기척 — 이 통째로 사라진다. 그래서 이것은 연출의 편의가 아니라
      그 땅에서 여럿이 함께 움직이기 위한 조건이다. 없으면 그 지형은 혼자 들어가는
      곳이 된다.
    world_shape: >
      소리로 전해지던 것이 실제로 전해지지 않아야 하고, 그 자리를 대신할 수단(몸짓 ·
      빛 같은)이 세계에 있어야 하며, 그것을 쓴 쪽과 쓰지 못한 쪽의 결과가 달라야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §7.4 · §7.6 · §7.7
          role: 무호흡해가 여럿이 함께 움직이는 데 요구하는 것
    required_by: []
    demanded_by: [MW-TERRAIN-BREATHLESS-SEA]
    constraints: [DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE]
    constraint_evaluation:
      DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE: SATISFIED   # 소리가 없다는 사실이 설명 없이 보인다 — 천과 머리카락이 움직이지 않고 붕괴가 무음이다
    overlay: MISSING
    overlay_gap: >-
      세계에 소리가 없다 — 없앨 것도 대신할 것도 아직 없다

  - id: MC-APPRAISE-UNKNOWN-MATTER
    type: capability
    semantic: >
      바깥에서 들어온 생물과 물질이 무엇이고 무엇을 하는지를 들이기 전에 가려낸다.
    detail: >
      골문지기가 척추 협곡에서 외부 생물과 탐험가를 감별하고 (BT §4.5), 분지 안에서는
      돌아온 자가 가져온 것을 감별하는 일이 일상의 하나다 (BT §4.6). 살펴봄
      (MC-OBSERVE)과 다르다 — 그쪽은 마주한 존재의 지금 상태를 읽고, 이쪽은 손에 든
      것의 정체와 유래를 가린다. 이것이 있어야 안전지대가 안전한 채로 유지되고, 없으면
      바깥의 것이 그대로 안으로 들어온다. 그리고 이것이 있어야 "정보를 사서 안다" 는
      갈래(MP-PREPARE-IN-CIVILIZATION)가 물건에도 적용된다.
    world_shape: >
      정체를 모르는 채로 얻는 것이 있고, 그것을 가려내는 행위가 따로 있으며, 가려내지
      않고 쓴 것과 가려낸 것의 결과가 달라야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §4.5 · §4.6
          role: 백왕의 갈비분지가 안전을 유지하는 데 요구하는 것
    required_by: []
    demanded_by: [MW-TERRAIN-BAIWANG-BASIN]
    constraints: [DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION]
    constraint_evaluation:
      DC-WORLD-SAFETY-IS-A-NATURAL-EXCEPTION: SATISFIED   # 분지의 안전은 뼈가 흡수하고 입구가 좁아서이고, 감별은 그 좁은 입구를 사람이 쓰는 방식이다
    overlay: MISSING
    overlay_gap: >-
      물건이 정체를 감추지 않는다 — 정의소에 있는 것은 처음부터 전부 알려져 있다

  - id: MC-REALIZE-ONE-POSSIBILITY
    type: capability
    semantic: >
      일어날 수 있었지만 선택되지 않은 상태 하나를 골라 짧게 현실로 만든다.
    detail: >
      사막은 환영을 보여 주는 것이 아니라 짧은 시간 동안 다른 가능성을 실제로 현실로
      만든다 (BT §10.2). 가능유리가 그 일을 손에 쥐여 주고 (BT §10.5), 그래서 파괴된
      길을 되살리거나 사라진 도시가 존재하는 시간으로 들어갈 수 있다 (BT §10.7).
      대가가 함께 온다 — 하나의 가능성을 선택하면 다른 경로가 사라진다 (BT §10.2).
      지금 보는 것이 실재인지 검증하는 것(MC-VERIFY-REALITY)과 짝이다: 그쪽이 읽는
      쪽이면 이쪽은 고르는 쪽이다. 핵심 경험은 올바른 길을 찾는 것이 아니라 어떤 길을
      현실로 만들지 고르는 것이다 (BT §10.7).
    world_shape: >
      일어나지 않은 상태가 세계에 남아 있고, 그중 하나를 골라 현실로 만들 수 있으며,
      고르는 순간 다른 것이 닫혀야 한다. 고르고도 잃는 것이 없으면 이 능력이 아니다.
    part_of:
      grounded: true
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §10.2 · §10.5 · §10.7
          role: 아직 일어나지 않은 사막을 감당하는 자리
    required_by: []
    demanded_by: [MW-TERRAIN-UNHAPPENED-DESERT]
    constraints: [DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE]
    constraint_evaluation:
      DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE: SATISFIED   # 여러 Route 의 결과를 먼저 보고 그중 하나를 고른다 — 증거가 먼저이고 열리는 행동이 여럿이다
    overlay: MISSING
    overlay_gap: >-
      세계에 가능성이라는 상태가 없다 — 참인 것은 지금의 하나뿐이고 선택되지 않은 것은 남지 않는다

  - id: MC-CONCEAL-BIOLOGICAL-SIGNAL
    type: capability
    semantic: >
      자신의 상처와 생체 신호를 가려, 그것을 좇는 것에게 읽히지 않는다.
    detail: >
      혈화수의 꽃가루는 상처와 약한 생체 상태를 추적하고, 상처 입은 것을 향해 꽃들이
      일제히 돌아선다 (BT §11.2 · §11.4). 꽃가면 채집단은 자신의 생체 신호를 가리는
      가면을 쓰고 회귀밀을 채집한다 (BT §11.6). 그래서 이 땅에서는 다쳤다는 것이 약해진
      것에 그치지 않고 표적이 되는 일이며, 감추는 수단이 곧 감당하는 수단이다. 정체를
      바꾸는 것(MC-IMPERSONATE-IDENTITY)과 다르다 — 이쪽은 다른 것으로 읽히는 것이
      아니라 읽히지 않는 것이다.
    world_shape: >
      몸의 약해진 상태가 세계에 읽히고 그것이 다른 존재의 판단 근거가 되어야 하며,
      그 읽힘을 가리는 수단이 있어야 한다. 가리는 데 대가가 없으면 선택이 되지 않는다.
    part_of:
      grounded: true
      memberships:
        - system: MS-BEIRA-TERRAIN
          source: BT §11.2 · §11.4 · §11.6 · §11.7
          role: 사람을 꽃피우는 혈화수해를 감당하는 자리
