nodes:
  - id: MC-COMBAT-STRIKE
    type: capability
    semantic: 휘두른 몸이 닿은 상대의 생명을 정해진 만큼 덜어내고, 맞은 몸은 하던 행동이 끊기고 밀려난다.
    source: R1 §6 · BW §20 · SK §5
    world_shape: 공격이 닿으면 상대의 생명이 줄고, 같은 조건을 반복하면 같은 값이 나오며, 맞은 쪽이 하던 행동을 잃고 물러나야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: BASIC-DAMAGE
          source: R1 §6
        - system: MS-BEIRA-LADDER
          segment: SAFE
          source: BW §20
          role: SAFE 기본기 — BW 의 MC-ATTACK 이 이 노드다 (HISTORY Q18(a))
        - system: MS-SKILL-FORM
          segment: CONTACT
          source: SK §5
          role: SK 가 말하는 접촉 실행이 이 노드다 — 휘두른 몸이 닿아서 전한다
    required_by:
