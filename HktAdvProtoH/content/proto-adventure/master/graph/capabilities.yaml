      한쪽에 몰수록 반대쪽이 실제로 빈다. 그 빈 구간은 상대가 읽을 수 있다.
    detail: >
      전투 사다리에서 가장 파급이 큰 노드다. 이것이 서면 "지금 상대가 어디에 힘을
      쏟고 있는가" 가 관찰 대상이 되고, 그 위에 열린 곳 노리기·자세 유지·서약이
      전부 얹힌다. 반대로 이것이 없으면 그 세 갈래는 얹힐 바닥이 없다.
    world_shape: >
      공격과 방어에 힘을 배분하는 상태가 존재하고, 한쪽에 몰면 반대쪽 수치가 실제로
