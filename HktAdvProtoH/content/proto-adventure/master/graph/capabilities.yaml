  # ── SAFE (BW §20) — 기존 재사용 3종 외 나머지 1종 ─────────────────────

  - id: MC-REPOSITION
    type: capability
    semantic: >
      싸움이 일어나는 자리를 스스로 고쳐 잡는다 — 벗어나는 것(MC-EVADE)이 아니라
      다음 행동에 유리한 위치를 만드는 이동이다.
    detail: >
      회피와 나란히 두면 목적이 다르다. 회피는 지금 오는 것을 피하려 움직이고,
      이것은 다음에 내가 하고 싶은 것을 하려고 움직인다. 그래서 회피는 급할 때 쓰고
      이것은 여유가 있을 때 쓴다. 위치가 판정에 쓰이는 세계에서만 의미가 있다.
    world_shape: >
      어디에 서 있는가가 다음 행동의 성패를 바꾸고, 플레이어가 그 자리를 의도적으로
      만들 수 있어야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
      memberships:
        - system: MS-BEIRA-LADDER
          segment: SAFE
          source: BW §20 (이름과 필요 목록만)
    required_by: [MP-CONTROL-MOVEMENT]
    demanded_by: [MW-SAFE-FRONTIER]
    constraints: []
    constraint_evaluation: {}
    overlay: PARTIAL
    overlay_evidence: >-
      코드 대조 — 위치가 판정에 깊이 쓰인다: 휘두른 무기 끝이 훑는 궤적 안의 몸만 맞고, 막기는 정면에서 온 것만 막으며, 채집은 거리 안에서만 된다
    overlay_gap: >-
      유리한 자리를 **빠르게·의도적으로** 잡는 전용 수단. 걸어가서 만들 수는 있다

