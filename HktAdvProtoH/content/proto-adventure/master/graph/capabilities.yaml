# Master Capability — MC-*
# 여러 Goal/Possibility 가 공통으로 재사용하는 플레이/World 의 의미 있는 능력.
# 구현 모듈명이 아니다. 왜 필요한지는 쓰지 않는다 — Goal/Possibility 경로가 설명한다.
# 형식: ../SCHEMA.md
#
# 인용 — R1 = content/proto-adventure/design/Design-Combat-OffenseDefense-R0.md · DT = content/proto-adventure/design/Design-Combat-DamageType-R0.md
#        BW = content/proto-adventure/design/Master-World-Beira.md (탐험 — Q18(a) 매핑된 전투 노드에는 보조 근거로 허용)
#        TG = content/proto-adventure/design/Design-Targeting-R0.md (지목)
#        BT = content/proto-adventure/design/Master-World-Beira-Terrain.md (대지형)
#
# ── 이 파일을 읽는 법 ────────────────────────────────────────────────────
# Capability 는 "세계가 할 줄 아는 일" 의 목록이다. 스킬 목록도 구현 모듈 목록도 아니다.
# 각 노드의 world_shape 가 "이것이 있다" 의 판정 기준이고, Cycle 이 그 칸을 닫는다.
# overlay 는 그 칸이 지금 닫혀 있는가다 — 근거는 ../overlay.md 가 소유한다.
#
#   전투 (R1 · DT)          이미 선 것 10 · 예고된 층 9
#   베이라 사다리 (BW)      SAFE 1 · FRINGE 3 · WILD 3 · DANGER 4 · DEEP 4 · UNKNOWN 6
#   자원 유래 (BW §8~§17)   2
#   지목 (TG)               2 · 관계 1 (HISTORY Q24)
#   대지형 (BT §4~§11)      9 — 요구처가 전부 장소다 (demanded_by). 기존 노드 8 개에는
#                           지형을 요구처로 더했을 뿐 새로 만들지 않았다
version: 1
nodes:

  # ══════════════════════════════════════════════════════════════════════
  # 전투 — 이미 세계에 서 있는 것
  # ══════════════════════════════════════════════════════════════════════

  - id: MC-COMBAT-STRIKE
    type: capability
    semantic: >
      휘두른 몸이 닿은 상대의 생명을 정해진 만큼 덜어내고, 맞은 몸은 하던 행동이 끊기고 밀려난다.
    detail: >
      전투의 바닥이다. 여기서 중요한 것은 "정해진 만큼" 이다 — 같은 조건이면 항상 같은
      결과가 나온다. 주사위를 굴리지 않기 때문에 플레이어가 결과를 보고 원인을 배울 수
      있고, 그 위에 나머지 모든 전투 갈래가 얹힌다. 그리고 타격은 피해만 주는 것이
      아니라 상대의 진행 중인 행동을 끊고 몸을 밀어낸다 — 이것이 전투에 시간과 공간의
      감각을 준다.
    world_shape: >
      공격이 닿으면 상대의 생명이 줄고, 같은 조건을 반복하면 같은 값이 나오며,
      맞은 쪽이 하던 행동을 잃고 물러나야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: BASIC-DAMAGE
          source: R1 §6
        - system: MS-BEIRA-LADDER
          segment: SAFE
          source: BW §20
          role: SAFE 기본기 — BW 의 MC-ATTACK 이 이 노드다 (HISTORY Q18(a))
        - system: MS-SKILL-FORM
          segment: CONTACT
          source: SK §5
          role: SK 가 말하는 접촉 실행이 이 노드다 — 휘두른 몸이 닿아서 전한다
    required_by: [MP-BREAK-THE-GUARD, MP-EXPLOIT-OPEN-BODY, MP-MATCH-WEAPON-TO-ARMOR, MP-OUTGROW-THE-OPPONENT, MP-PIERCE-THE-HARD-DEFENSE, MP-BET-ON-THE-CRITICAL-BLOW]
    demanded_by: [MW-SAFE-FRONTIER]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-SKILL-IS-COMBINATION-NOT-NAME, DC-SKILL-DELIVERY-IS-NOT-EFFECT, DC-SKILL-ANCHOR-IS-NOT-RESOLUTION]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 난수 없는 결정적 피해 (C007 실측 · R1 §6)
      DC-SKILL-IS-COMBINATION-NOT-NAME: SATISFIED   # 모양(각·길이·굵기)도 정의가 지닌다 — 값 셋만 바꿔 판정이 뒤집혔고 규칙 코드는 0줄 (C025 실측)
      DC-SKILL-DELIVERY-IS-NOT-EFFECT: SATISFIED    # C020 이 전달을 하나 더하며 피해 경로를 한 줄도 바꾸지 않았다
      DC-SKILL-ANCHOR-IS-NOT-RESOLUTION: SATISFIED  # 휘두름은 고른 대상을 읽지 않는다 — 맞는 것은 접촉이 정하고 호에 든 여럿이 각각 맞는다 (swing-strike 는 대상 수를 돌려준다)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C007 · C010 이 피해 산정을 하나의 공식으로 교체. C025 가 휘두름의 **모양**(각·길이·굵기)을 전역 상수에서 기술 정의로 내려 이 노드에 걸린
      마지막 UNRESOLVED 를 닫았다
    # BW §20 의 MC-ATTACK 은 이 노드다 (SAFE 층 기본기) — HISTORY Q18(a).

  - id: MC-CP-ECONOMY
    type: capability
    semantic: >
      하나의 기력 예산이 공격·방어·기동·폭발을 함께 묶는다. 어디에 쓸지 고르는 순간
      다른 곳에 쓸 것이 줄어든다.
    detail: >
      전투에서 선택이 생기는 이유가 이것이다. 공격에 쓰는 자원과 방어에 쓰는 자원이
      따로 있으면 둘 다 최대로 쓰면 되므로 고를 것이 없다. 하나로 묶여 있어야 "지금
      막을 것인가 아껴서 때릴 것인가" 가 질문이 된다. 그래서 방어 전용 게이지를 새로
      만드는 설계는 이 노드와 정면으로 충돌한다.
    world_shape: >
      공격·방어·기동이 모두 같은 자원을 쓰고, 한쪽에 쓰면 다른 쪽에 쓸 것이 실제로
      줄어야 한다. 그리고 그 자원이 어떻게 돌아오는지가 정해져 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: R1 §1 · §11
          role: 모든 층이 공유하는 기력 예산
    required_by: [MP-READ-AND-COUNTER, MP-BREAK-THE-GUARD, MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-TRADE-BODY-FOR-RESOURCE, MP-EVADE-BY-MOVING-THE-BODY, MP-HOLD-FORTIFIED, MP-OUTGROW-THE-OPPONENT, MP-CONCENTRATE-THE-POWER]
    demanded_by: []
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 의미 자체가 한 예산이다 (정책 §16 — 구현 공백은 위반이 아니다)
    overlay: PARTIAL
    overlay_evidence: >-
      C007 · C011 — 기력을 쓰는 자리가 셋(고급 스킬·달리기·막기)이라 공격과 방어가 실제로 경쟁한다
    overlay_gap: >-
      **기력이 스스로 돌아오지 않는다.** 회복 경로는 "타격을 성공시킨다" 하나뿐이라, 빗나가면 아무것도 벌지 못하고 쉬어도 차지 않는다

  - id: MC-BODY-FACING
    type: capability
    semantic: >
      몸이 향한 방향이 세계의 판정에 쓰인다 — 어느 쪽에서 들어온 공격인지가 의미를 가진다.
    detail: >
      방향이 판정에 들어가야 위치를 잡는 일이 의미를 갖는다. 이것이 없으면 전투는
      서로 마주 보고 숫자를 교환하는 일이 되고, 돌아 들어가거나 등을 잡는 판단이
      사라진다. 작은 능력처럼 보이지만 공간을 쓰는 모든 갈래의 전제다.
    world_shape: >
      같은 공격이라도 상대가 향한 방향에 따라 결과가 달라져야 하고,
      그 방향이 관찰 가능해야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: 없음 — C006·C011 로 의미가 세계에 섰다
          role: 공간·방향 판정 바닥
    required_by: [MP-TRADE-BODY-FOR-RESOURCE]
    demanded_by: []
    constraints: []
    constraint_evaluation: {}
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C006 — 몸이 향한 방향이 막기 판정에 쓰인다

  - id: MC-COMBAT-CAUSE-READING
    type: capability
    semantic: >
      큰 결과가 나왔을 때 그것을 만든 원인과 배율을 전부 되짚어 읽을 수 있다.
      플레이어는 이것으로 배우고, 만든 사람은 이것으로 고친다.
    detail: >
      난수를 쓰지 않는 것만으로는 부족하다. 결정적이어도 왜 그 숫자가 나왔는지
      보이지 않으면 플레이어는 배울 수 없고, 배울 수 없으면 "관찰 → 이해 → 대응" 이라는
      이 게임의 진행 구조 자체가 성립하지 않는다 (BW §32). 그래서 이 노드는 편의 기능이
      아니라 진행의 전제다.
    world_shape: >
      한 번의 타격에 대해 어떤 능력치가 골라졌고 무엇이 얼마나 기여했는지가 전부
      드러나야 하고, 플레이어가 그것을 보고 다음 선택을 바꿀 수 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: DT §10 · §14
          role: 계산 경위 관찰 — 전 층 공통
    required_by: [MP-EXPLOIT-OPEN-BODY, MP-CONCENTRATE-THE-POWER]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # explainable_result 요구를 직접 실현하는 능력이다 (DT §10 · §14-9)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      코드 대조 — 모든 타격이 고른 능력치 이름·값, 기본 피해, 공격 기여, 방어 값, 관통, 유효 방어, 감쇄 배율, 최종·적용 피해, 막기 결과까지 관찰에
      싣는다
    overlay_gap: >-
      — (승격 확인 대기 · open-questions.md)
    # 모든 타격이 고른 능력치 이름과 값, 기본 피해, 공격 기여, 방어 값, 관통,
    # 유효 방어, 감쇄 배율, 최종·적용 피해, 막기 결과까지 관찰에 싣는다 (Q20 확정).

  - id: MC-GUARD
    type: capability
    semantic: >
      앞을 향해 막는 행동으로 들어온 공격의 피해를 생명 대신 자원으로 치러 줄인다.
      막을 자원이 다하면 방어 자체가 무너진다.
    detail: >
      방어를 "받는" 것이 아니라 "치르는" 것으로 만드는 노드다. 막기가 공짜면 계속
      막으면 되므로 국면이 생기지 않는다. 자원을 치르게 하면 언제까지 막을지가 판단이
      되고, 자원이 마르면 무너지게 하면 압박이 시간을 갖는다. 앞쪽만 막힌다는 점도
      중요하다 — 그래야 위치가 여전히 의미를 갖는다.
    world_shape: >
      막는 행동이 있고, 막으면 피해가 줄되 자원이 들며, 자원이 마르면 방어가 풀리고
      그동안은 다시 세우지 못해야 한다. 그리고 정면에서 온 것만 막혀야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: DEFENSE-ACTION
          source: R1 §1 · §11
        - system: MS-BEIRA-LADDER
          segment: SAFE
          source: BW §20
          role: SAFE 기본기 — BW 의 MC-DEFEND 가 이 노드다 (HISTORY Q18(a))
    required_by: [MP-READ-AND-COUNTER, MP-TRADE-BODY-FOR-RESOURCE, MP-STORE-AND-RELEASE]
    demanded_by: [MW-SAFE-FRONTIER]
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 전용 게이지 없이 같은 기력으로 받아낸다 (R1 §1 · §11)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C011 — 막기가 행동으로 존재하고 정면 판정이 방향을 가르며, 막힌 타격이 절반으로 줄고 기력을 치르며, 기력이 마르면 방어가 무너진다
    # BW §20 의 MC-DEFEND 는 이 노드다 (SAFE 층 기본기) — HISTORY Q18(a).

  - id: MC-DEFENSE-MITIGATION
    type: capability
    semantic: >
      맞은 피해를 줄인다. 공격을 빗나가게 하지 않으며, 아무리 두꺼워도 피해를 0 으로
      만들지는 못하고, 두꺼워질수록 추가 방어의 효과는 점차 완만해진다.
    detail: >
      막기(MC-GUARD)와 헷갈리면 안 된다. 이것은 행동이 아니라 몸의 성질이다 —
      아무것도 하지 않아도 항상 작동한다. 두 가지 성격이 중요하다. 0 으로 만들지
      못하므로 무적이 없고, 두꺼워질수록 효율이 떨어지므로 방어만 올리는 전략이
      무한히 강해지지 않는다. 이 두 성질이 관통(MC-PENETRATION)이 의미를 갖는 바탕이다.
    world_shape: >
      방어 능력치가 높을수록 받는 피해가 줄되, 아무리 높여도 최소한의 피해는 들어가고,
      같은 양을 더 올려도 줄어드는 폭이 점점 작아져야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: BASIC-DAMAGE
          source: R1 §4 · §6
          role: 수동 감쇄 — 행동이 아니라 몸의 성질
    required_by: [MP-TRADE-BODY-FOR-RESOURCE, MP-HOLD-FORTIFIED, MP-OUTGROW-THE-OPPONENT, MP-PIERCE-THE-HARD-DEFENSE]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률 회피가 아니라 맞은 피해를 결정적으로 줄인다 (R1 §4 · §6)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C010 — 방어 0/100/200/300 에서 피해 26/13/9/7, 감소폭 단조 감소, 극단값에서도 최소 1
    overlay_gap: >-
      — (이것은 **수동 감쇄**다. 막는 행동은 MC-GUARD 로 별개)

  - id: MC-ATTACK-POWER
    type: capability
    semantic: >
      Actor 는 공격의 위력을 나타내는 능력치를 가진다. 같은 스킬이라도 이 값이 큰 Actor 가
      쓰면 더 아프며, 장비·성장·버프가 이 값을 올린다.
    detail: >
      성장이 결과를 바꾼다는 것을 세계에 세우는 노드다. 주의할 점은 semantic 의 뒷부분
      "장비·성장·버프가 이 값을 올린다" 가 능력치의 존재와는 다른 이야기라는 것이다 —
      값이 결과를 바꾸는 것과, 그 값을 플레이로 올릴 수 있는 것은 별개다.
      후자는 획득 경로의 문제이고 growth/growth-graph.md 가 판정한다.
    world_shape: >
      이 값이 다른 두 Actor 가 같은 스킬을 쓰면 결과가 달라야 하고, 그 차이가 계산
      내역으로 설명되어야 하며, **세계 안의 행위로** 이 값을 올릴 수 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: R1 §6
          role: 능력치 축
    required_by: [MP-OUTGROW-THE-OPPONENT, MP-BET-ON-THE-CRITICAL-BLOW]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 능력치·같은 스킬·같은 상대면 항상 같은 피해 (R1 §6 · C010 실측)
    overlay: PARTIAL
    overlay_evidence: >-
      C010 — 공격력 40→80 변경이 피해 20→35 로 실측. **C023 으로 세계 안의 첫 경로가 생겼다** — 곡괭이를 걸면 물리 공격 40 → 52 가
      플레이로 관찰되고, 풀면 정확히 40 으로 돌아온다 (C023 08 PLAYABLE ④·⑧)
    overlay_gap: >-
      **값을 키우는 축이 없다.** 물건으로 값이 *달라지는* 것은 섰으나 그것을 *키우는* 것 — 될 Class 도, 배울 상대도, 자라는 경로도 — 은 여전히
      없다. 물건 쪽은 **C024 로 둘이 되었으나**(곡괭이 물리 공격 +12 · 손방패 물리 방어 +15) 그 둘은 서로 바꿔 끼는 관계이지 쌓이는 관계가 아니다

  - id: MC-SKILL-SCALING
    type: capability
    semantic: >
      스킬은 자신의 기본 피해량과, Actor 의 공격 능력치를 얼마나 피해로 바꾸는지의 계수를
      가진다. 스킬의 강함과 Actor 의 강함이 분리되어 따로 자라며, 계수가 다른 스킬들이
      서로 다른 성격(빠르고 낮은 계수 · 무겁고 높은 계수)을 얻는다.
    detail: >
      스킬이 단순히 "더 센 것" 의 목록이 되지 않게 하는 노드다. 계수가 다르면 같은
      성장에 대해 스킬마다 자라는 속도가 달라지고, 그래서 "지금 내 몸에는 어떤 스킬이
      맞는가" 라는 질문이 생긴다. 능력치가 낮을 때와 높을 때 최선의 선택이 달라져야 한다.
    world_shape: >
      기본 피해와 계수가 스킬마다 다르고 관찰 가능하며, 공격 능력치를 올렸을 때
      계수가 큰 스킬이 더 크게 자라는 것이 보여야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: R1 §2 · §3 · §6
          role: 능력치 축
    required_by: [MP-OUTGROW-THE-OPPONENT]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 기본 피해량과 계수는 스킬의 공개된 성질이다 (R1 §2 · §3 · §6)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      C010 — 계수가 큰 스킬이 같은 공격 증가에 더 크게 자라는 것이 실측

  - id: MC-ATTACK-ARMOR-MATCHUP
    type: capability
    semantic: >
      무엇으로 무엇을 때렸는지가 결과를 바꾼다. 공격 형태에 대응하는 방어 능력만
      그 피해를 줄이며, 상성은 별도 배율이 아니라 그 대응 능력치의 차이로만 생긴다.
    detail: >
      상성을 만드는 방법은 둘이다. 상성표를 두고 배율을 곱하거나, 공격 형태마다
      대응하는 방어 능력치를 따로 두는 것이다. 이 노드는 후자를 고른다. 표가 없으므로
      외울 정답이 없고, 상대의 두 방어 중 어느 쪽이 무른지를 보고 고르는 판단만 남는다.
      그리고 어느 쪽도 면역이 아니어야 한다 — 면역이 생기면 선택이 다시 정답이 된다.
    world_shape: >
      공격 형태가 둘 이상이고 각각에 대응하는 방어가 따로 있으며, 같은 스킬 값이
      상대에 따라 다른 결과를 내되 어느 쪽도 완전히 막히지 않아야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: DAMAGE-TYPE
          source: DT §4 · §7
    required_by: [MP-MATCH-WEAPON-TO-ARMOR, MP-PIERCE-THE-HARD-DEFENSE]
    demanded_by: []
    constraints: [DC-COMBAT-MATCHUP-SOFT, DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
