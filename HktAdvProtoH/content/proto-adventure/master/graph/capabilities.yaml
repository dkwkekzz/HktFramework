    detail: >
      공간을 좁히는 것(MC-CONTROL-SPACE)이 상대의 선택지를 줄이는 것이라면,
      이것은 상대를 특정한 자리로 **보내는** 것이다. 위험 지형이 있는 곳에서
      환경을 무기로 쓰는 갈래와 결합하면 가장 강해진다.
    world_shape: >
      플레이어의 행동으로 상대의 위치가 의도한 방향으로 바뀌고,
