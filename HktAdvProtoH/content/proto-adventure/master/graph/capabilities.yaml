  - id: MC-VOW
    type: capability
    semantic: >
      세계가 참·거짓을 판정할 수 있는 제약을 스스로 걸어 더 큰 위력과 바꾼다.
      제약을 어기거나 실패하면 정의된 대가를 즉시 치른다.
    detail: >
      사다리의 꼭대기다. 플레이어가 자기 선택지를 스스로 줄이고 그 대가로 규칙 안의
      상한을 넘는다. 성립하려면 세계가 그 제약의 참·거짓을 실제로 판정할 수 있어야
      한다 — 판정할 수 없는 선언은 서약이 아니라 문구다.
    world_shape: >
      플레이어가 제약을 선언할 수 있고, 세계가 그 성립 여부를 판정하며,
      지키는 동안 실제로 강해지고 어기면 즉시 대가가 치러져야 한다.
