      Possibility 표)
  - id: MC-PERFECT-GUARD
    type: capability
    semantic: 정확한 시점에 시작한 방어는 피해를 받지 않고, 때린 쪽이 잠시 노출된다. 성패는 확률이 아니라 방어를 시작한 시각과 공격이 닿은 시각의 관계로 갈린다.
    source: UL §6 · R1 §14
    world_shape: 방어를 시작한 시각과 공격이 닿은 시각의 차이가 판정에 쓰이고, 좁은 구간에 맞추면 피해를 전혀 받지 않으며, 때린 쪽이 잠시 취약해져야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ACTIVE-DEFENSE
          segment: PRECISION
          source: UL §6 (Guard 의 Precision 결과 — 별개 행동이 아니다)
        - system: MS-COMBAT-LADDER
          segment: ACTIVE-DEFENSE
          source: R1 §14 (이름만) · UL §6 (정의)
    required_by: [ MP-READ-AND-COUNTER ]
    demanded_by: []
    constraints:
      [
        DC-COMBAT-PLAYER-CAUSALITY,
        DC-COMBAT-ONE-RESPONSE-INPUT,
        DC-COMBAT-RESPONSE-IS-OPTIONAL-MASTERY
      ]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
      DC-COMBAT-ONE-RESPONSE-INPUT: SATISFIED
      DC-COMBAT-RESPONSE-IS-OPTIONAL-MASTERY: SATISFIED
    overlay: MISSING
    overlay_gap: 막기는 있으나 시작 시각이 판정에 쓰이지 않는다. 막기는 켜 두는 자세이고 결과는 막힘/무너짐 둘뿐이다 (R1 §14 Active Defense 층). 다만
      C019 로 행동 안의 시점을 읽는 규칙이 세계에 생겨 얹힐 바닥은 섰다
  - id: MC-COUNTER
    type: capability
    semantic: 상대가 열린 순간을 읽고 되받아쳐 더 큰 피해를 만든다.
    source: UL §7 · R1 §14
    world_shape: 상대가 취약해진 상태가 존재하고, 그 상태의 상대에게 넣은 공격이 평소보다 크게 들어가야 한다. 그 공격은 새 입력이 아니라 기회를 가진 동안 기존 행동이
      다른 것으로 바뀐 것이어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ACTIVE-DEFENSE
