    detail: >
      환경 위험이 플레이어에게만 작용하면 그것은 그냥 장애물이다. 양쪽에 같은 규칙으로
      작용해야 "누가 더 잘 쓰는가" 라는 경쟁이 생기고, 그때 비로소 위험이 자원이 된다.
    world_shape: >
      환경 위험이 플레이어와 상대 모두에게 같은 규칙으로 작용하고,
      플레이어가 그것을 상대 쪽으로 돌릴 수 있어야 한다.
