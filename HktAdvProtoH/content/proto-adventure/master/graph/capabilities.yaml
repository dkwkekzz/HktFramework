      공격/방어에 힘을 배분하는 상태가 없다 (R1 §14 Aura/Nen 층)

  - id: MC-FORTIFY
    type: capability
    semantic: >
      자원을 계속 흘리며 방어 쪽에 힘을 몰아 둔 자세를 유지한다.
    detail: >
      막기가 타격 하나에 대응하는 것이라면 이것은 국면 전체에 대한 태세다.
      배분(MC-COMBAT-FLOW) 위에 얹히는 노드라 그것 없이는 성립하지 않는다.
    world_shape: >
      방어 쪽으로 기울인 자세가 유지되는 동안 자원이 지속적으로 들고,
      방어가 실제로 오르되 공격이 약해져야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
