# Master Capability — MC-*
# 여러 Goal/Possibility 가 공통으로 재사용하는 플레이/World 의 의미 있는 능력.
# 구현 모듈명이 아니다. 왜 필요한지는 쓰지 않는다 — Goal/Possibility 경로가 설명한다.
# 구현 상태(overlay)의 근거는 ../overlay.md 가 소유한다.
# 형식: ../SCHEMA.md
#
# 인용 표기 — 근거는 영역별로 분리된다 (HISTORY Q15 · Q18(a) 예외).
#   R1 §x   design/Design-Combat-OffenseDefense-R0.md   전투 (2026-08-17 R1 전면 개정판)
#   DT §x   design/Design-Combat-DamageType-R0.md        전투
#   BW §x   design/Master-World-Beira.md                 탐험 — Q18(a) 매핑된 전투 노드에는 보조 근거로 허용
# 삭제된 구판(R0)은 근거가 아니다. 구판 인용은 전부 제거했고, 구판에만 근거가 있던
# 노드(MC-WEAK-POINT · MC-REAR-ATTACK)도 삭제했다 — 두 문서는 그 의미를 이름조차 대지 않는다.
#
# C010·C011 롤백 (2026-08-17 Human 결정) — 막기·완벽한 막기·되받아침·방어력 구현을
# 되돌렸다. 산출물은 git history 에 있다. 해당 Capability 는 MISSING 으로 돌아간다.
# DC 삭제 (2026-08-18 Q12) — DEFENSE-IS-ACTIVE · POWER-HAS-COST 는 근거가 구판뿐이라
# 삭제했다. 이 노드들의 해당 constraints · constraint_evaluation 항목도 함께 제거했다.
version: 1
nodes:

  # ── 이미 세계에 있는 것 (C001~C009) ───────────────────────────────────

  - id: MC-COMBAT-STRIKE
    type: capability
    semantic: >
      휘두른 몸이 닿은 상대의 생명을 정해진 만큼 덜어내고, 맞은 몸은 하던 행동이 끊기고 밀려난다.
    required_by: [MP-BREAK-THE-GUARD, MP-EXPLOIT-OPEN-BODY, MP-MATCH-WEAPON-TO-ARMOR, MP-OUTGROW-THE-OPPONENT, MP-PIERCE-THE-HARD-DEFENSE, MP-BET-ON-THE-CRITICAL-BLOW]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 정해진 만큼 덜어낸다 — 난수 없는 결정적 피해 (C007 실측 · R1 §6)
    overlay: IMPLEMENTED
    # BW §20 의 MC-ATTACK 은 이 노드다 — Q18(a) 매핑 확정 (SAFE 층 기본기)

  - id: MC-CP-ECONOMY
    type: capability
    semantic: >
      하나의 기력 예산이 공격·방어·기동·폭발을 함께 묶는다. 어디에 쓸지 고르는 순간
      다른 곳에 쓸 것이 줄어든다.
    required_by: [MP-READ-AND-COUNTER, MP-BREAK-THE-GUARD, MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-TRADE-BODY-FOR-RESOURCE, MP-EVADE-BY-MOVING-THE-BODY, MP-HOLD-FORTIFIED, MP-OUTGROW-THE-OPPONENT]
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 의미 자체가 한 예산이다 — 기동·자세가 아직 안 쓰는 것은
                                               # overlay PARTIAL(구현 공백)이지 Constraint 위반이 아니다 (정책 §16)
    overlay: PARTIAL

  - id: MC-BODY-FACING
    type: capability
    semantic: >
      몸이 향한 방향이 세계의 판정에 쓰인다 — 어느 쪽에서 들어온 공격인지가 의미를 가진다.
    required_by: [MP-TRADE-BODY-FOR-RESOURCE]
    constraints: []
    constraint_evaluation: {}
    overlay: IMPLEMENTED

  - id: MC-COMBAT-CAUSE-READING
    type: capability
    semantic: >
      큰 결과가 나왔을 때 그것을 만든 원인과 배율을 전부 되짚어 읽을 수 있다.
      플레이어는 이것으로 배우고, 만든 사람은 이것으로 고친다.
    required_by: [MP-EXPLOIT-OPEN-BODY]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # explainable_result 요구를 직접 실현하는 능력이다
                                               # (DT §10 관찰 계약 — Strike Event 가 선택된 능력치와
                                               #  계산 경위를 싣는다 · DT §14-9 수용 기준)
    overlay: PARTIAL

  - id: MC-GUARD
    type: capability
    semantic: >
      앞을 향해 막는 행동으로 들어온 공격의 피해를 생명 대신 자원으로 치러 줄인다.
      막을 자원이 다하면 방어 자체가 무너진다.
    required_by: [MP-READ-AND-COUNTER, MP-TRADE-BODY-FOR-RESOURCE]
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 전용 게이지 없이 같은 기력으로 받아낸다 (R1 §1 · §11)
    overlay: IMPLEMENTED
    # C011-guard-trades-body-for-resource 가 R1 §14 Defense Action 층으로 닫았다 (2026-08-17).
    # 구 C010(막기)은 2026-08-17 롤백된 다른 Cycle 이다. 근거는 ../overlay.md.
    # BW §20 의 MC-DEFEND 는 이 노드다 — Q18(a) 매핑 확정 (SAFE 층 기본기)

  - id: MC-PERFECT-GUARD
    type: capability
    semantic: >
      정확한 시점에 시작한 방어는 피해를 받지 않는다.
      성패는 확률이 아니라 방어를 시작한 시각과 공격이 닿은 시각의 관계로 갈린다.
    required_by: [MP-READ-AND-COUNTER]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률이 아니라 시각 관계라는 관찰 가능한 조건으로 판정된다 (R1 §6)
    overlay: MISSING
    # C011 로 닫혔다가 2026-08-17 Human 결정으로 롤백 — R1 §14 Active Defense 층에서 재구축한다.
    # 두 문서는 이 층의 이름만 예고한다 (R1 §14 · DT §15). 노출·공격권 전환 같은 세부는
    # 그 층의 설계 문서가 공급하기 전까지 여기에 적지 않는다 (2026-08-18 구판 유래 삭제).

  - id: MC-COUNTER
    type: capability
    semantic: >
      상대가 열린 순간을 읽고 되받아쳐 더 큰 피해를 만든다.
    required_by: [MP-READ-AND-COUNTER]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 명시된 조건이 성립할 때만 성립한다 — 난수가 아니다 (R1 §6)
    overlay: MISSING
    # C011 로 닫혔다가 2026-08-17 Human 결정으로 롤백 — R1 §14 Active Defense 층에서 재구축한다.

  - id: MC-DEFENSE-MITIGATION
    type: capability
    semantic: >
      맞은 피해를 줄인다. 공격을 빗나가게 하지 않으며, 아무리 두꺼워도 피해를 0 으로
      만들지는 못하고, 두꺼워질수록 추가 방어의 효과는 점차 완만해진다.
    required_by: [MP-TRADE-BODY-FOR-RESOURCE, MP-HOLD-FORTIFIED, MP-OUTGROW-THE-OPPONENT, MP-PIERCE-THE-HARD-DEFENSE]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 빗나가게(확률 회피) 하지 않고 맞은 피해를 결정적으로 줄인다 (R1 §4 · §6)
    overlay: IMPLEMENTED
    # C010-stats-decide-the-damage 가 R1 §4 의 체감(diminishing) 형태로 닫았다.
    # 구 C010(감산식)은 2026-08-17 롤백된 다른 Cycle 이다. 근거는 ../overlay.md.
    # 이것은 **수동 감쇄**다 — 막기 같은 능동 방어는 MC-GUARD 이며 별개 노드다 (C011 로 닫혔다).

  # ── R1 이 지정한 다음 층 (아직 세계에 없는 것) ────────────────────────

  - id: MC-ATTACK-POWER
    type: capability
    semantic: >
      Actor 는 공격의 위력을 나타내는 능력치를 가진다. 같은 스킬이라도 이 값이 큰 Actor 가
      쓰면 더 아프며, 장비·성장·버프가 이 값을 올린다.
    required_by: [MP-OUTGROW-THE-OPPONENT, MP-BET-ON-THE-CRITICAL-BLOW]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 능력치·같은 스킬·같은 상대면 항상 같은 피해 (R1 §6)
                                               # C010 실측 — 같은 조건 3회 반복이 모두 같은 값
    overlay: IMPLEMENTED
    # C010-stats-decide-the-damage. 근거는 ../overlay.md.

  - id: MC-SKILL-SCALING
    type: capability
    semantic: >
      스킬은 자신의 기본 피해량과, Actor 의 공격 능력치를 얼마나 피해로 바꾸는지의 계수를
      가진다. 스킬의 강함과 Actor 의 강함이 분리되어 따로 자라며, 계수가 다른 스킬들이
      서로 다른 성격(빠르고 낮은 계수 · 무겁고 높은 계수)을 얻는다.
    required_by: [MP-OUTGROW-THE-OPPONENT]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 기본 피해량과 계수는 스킬의 공개된 성질이다 (R1 §2 · §3 · §6)
                                               # C010 실측 — 두 값이 관찰 계약에 실린다
    overlay: IMPLEMENTED
    # C010-stats-decide-the-damage. 근거는 ../overlay.md.

  # ── 아직 세계에 없는 것 — R1 §13·§14 가 이후 확장으로 예고한 층들 ─────
  # 두 문서는 이 층들의 이름과 순서만 정하고 세부(수치·판정)를 공급하지 않는다.
  # 각 층의 설계 문서가 나오기 전에는 Frontier 후보로 세우지 않는다 (R1 §13 · §16).

  - id: MC-EVADE
    type: capability
    semantic: >
      무적이 되는 것이 아니라 실제로 몸을 옮겨 충돌을 벗어난다.
    required_by: [MP-EVADE-BY-MOVING-THE-BODY]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 무적·확률이 아니라 실제 위치 이동이다 — random_evade 금지와 양립 (R1 §6 · §13)
    overlay: MISSING
    # BW §20 도 같은 ID 로 SAFE 층 기본기로 지정한다 — Q18(a) 확정

  - id: MC-BREAK
    type: capability
    semantic: >
      상대의 방어 구조(Guard · 특수 갑각 같은 형태 전반)를 무너뜨려
      그 방어가 성립하지 않는 구간을 만든다.
    required_by: [MP-BREAK-THE-GUARD, MP-VENTURE-INTO-WILD]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 무너뜨리는 조건이 관찰 가능한 상태로 드러난다 — 난수가 아니다 (R1 §6)
    overlay: MISSING
    # R1 §14 Active Defense 층이 이름만 예고한다 (Guard Break). 누적·붕괴 지속 같은 세부는
    # 구판에만 있었으므로 2026-08-18 삭제했다 — 그 층의 설계 문서가 다시 공급해야 한다.
    # Q18(a) 확정 (2026-08-19) — semantic 을 방어 구조 전반으로 넓혔다 (CHANGED).
    # BW §22 (WILD 갑각) 가 보조 근거다. 구체 판정은 각 층의 설계 문서 소유.

  - id: MC-CRITICAL-STRIKE
    type: capability
    semantic: >
      공격이 확률적으로 더 크게 증폭되어 터진다. 발생 확률과 증폭 크기는 Actor 의
      성질이며 성장·장비로 자란다. Critical 발생 여부와 그 증폭은 계산 경위에
      그대로 드러난다.
    required_by: [MP-BET-ON-THE-CRITICAL-BLOW]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-FORMULA]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # REVISED 가 명시한 단일 예외다 — 관찰 요구(발생·증폭 노출)는 그대로 진다 (Q11(b))
      DC-COMBAT-ONE-FORMULA: SATISFIED         # Final Damage 증폭 — 기존 공식의 결과값에 한 가지 의미만 더한다 (R1 §14 C011 · 핵심 원칙)
    overlay: MISSING
    # R1 §14 C011 층 (Critical Chance · Critical Damage). Q11(b) 로 층의 유보가 닫혔다.

  - id: MC-COMBAT-FLOW
    type: capability
    semantic: >
      지금 몸의 힘을 공격과 방어 중 어디에 얼마나 몰았는지가 상태로 드러나고,
      한쪽에 몰수록 반대쪽이 실제로 빈다. 그 빈 구간은 상대가 읽을 수 있다.
    required_by: [MP-EXPLOIT-OPEN-BODY, MP-STAKE-EVERYTHING-ON-ONE-BLOW, MP-HOLD-FORTIFIED]
    constraints: [DC-COMBAT-ONE-FORMULA]
    constraint_evaluation:
      DC-COMBAT-ONE-FORMULA: SATISFIED         # 집중은 새 공식이 아니라 Attack/Defense 를 변화시키는 상위 규칙이다 (R1 §14 Aura/Nen · 핵심 원칙)
    overlay: MISSING
    # R1 §14 Aura/Nen 층이 예시로 형태를 예고한다 — 공격 집중 Attack ×1.3 · Defense ×0.7 · CP -5/sec.

  - id: MC-FORTIFY
    type: capability
    semantic: >
      자원을 계속 흘리며 방어 쪽에 힘을 몰아 둔 자세를 유지한다.
    required_by: [MP-HOLD-FORTIFIED]
    constraints: [DC-COMBAT-SHARED-BUDGET]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED       # 흘리는 자원이 새 게이지가 아니라 같은 기력 예산이다 (R1 §1 · §14 Aura/Nen)
    overlay: MISSING
    # R1 §14 Aura/Nen 층(방어 집중)이 예고한다 — 지속 CP 비용으로 방어 쪽에 힘을 몰아 둔 자세.

  - id: MC-ATTACK-ARMOR-MATCHUP
    type: capability
    semantic: >
      무엇으로 무엇을 때렸는지가 결과를 바꾼다. 공격 형태에 대응하는 방어 능력만
      그 피해를 줄이며, 상성은 별도 배율이 아니라 그 대응 능력치의 차이로만 생긴다.
    required_by: [MP-MATCH-WEAPON-TO-ARMOR, MP-PIERCE-THE-HARD-DEFENSE]
    constraints: [DC-COMBAT-MATCHUP-SOFT, DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-MATCHUP-SOFT: SATISFIED        # 배율표·면역 없이 대응 능력치 차이로만 상성이 생긴다 (DT §4 · §7)
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 같은 조합이면 같은 결과 — 결정적 상성이다 (DT §8)
    overlay: IMPLEMENTED
    # C012-damage-type-chooses-the-defense 가 R1 §14 Damage Type 층으로 닫았다 (2026-08-18).
    # 공격 형태 둘 · 방어 형태 둘이 존재하고 타입 대응이 계산의 입력을 고른다. 근거는 ../overlay.md.

  - id: MC-PENETRATION
    type: capability
    semantic: >
      상대의 방어 중 내 공격이 마주한 쪽을 얼마간 통하지 않게 만든다. 방어를 없애지는 못하고,
      마주하지 않은 다른 방어에는 닿지 않으며, 두껍게 굳힌 상대일수록 무력화의 몫이 커진다.
    required_by: [MP-PIERCE-THE-HARD-DEFENSE]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 관통은 확률로 방어를 무시하는 것이 아니라 마주한 방어를 결정적으로 깎는다 (R1 §14 Penetration · DT §15)
    overlay: MISSING
    # R1 §14 Penetration 층. 작용 지점은 DT §15 가 지정한다 —
    # 타입 대응이 고른 방어에만 작용하고 Damage Type 자체를 바꾸지 않는다.

  - id: MC-CONDITION-STACKING
    type: capability
    semantic: >
      플레이어가 만들어 낸 조건들이 겹칠수록 결과가 커진다. 상한이 있고,
      각 조건이 무엇이었는지 결과에서 그대로 읽힌다.
    required_by: [MP-STAKE-EVERYTHING-ON-ONE-BLOW]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 명시 조건의 합성이고 결과에서 읽힌다 — 난수가 아니다 (R1 §6 · §14 Aura/Nen)
    overlay: MISSING
    # R1 핵심 원칙(Condition → Modifier)과 §14 Aura/Nen 층으로 이어진다.

  - id: MC-VOW
    type: capability
    semantic: >
      세계가 참·거짓을 판정할 수 있는 제약을 스스로 걸어 더 큰 위력과 바꾼다.
      제약을 어기거나 실패하면 정의된 대가를 즉시 치른다.
    required_by: [MP-STAKE-EVERYTHING-ON-ONE-BLOW]
    constraints: [DC-COMBAT-PLAYER-CAUSALITY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 제약의 성립·위반을 세계가 판정한다 — 난수가 아니다 (R1 §6 · §14 Aura/Nen)
    overlay: MISSING
    # R1 §14 Aura/Nen 층(조건·제약·서약)으로 유지된다.

  # ═══ 베이라 사다리 (BW = design/Master-World-Beira.md — 2026-08-19 주입) ═══
  #
  # BW §20~§25 가 탐험 깊이(MW-DEPTH-GRADIENT · MW-ZONE-*)별로 예고한 Capability 층이다.
  # 문서는 층마다 이름과 "필요:" 목록을 공급한다 — semantic 은 해당 § 의 문맥 한 줄로
  # 최소 번역했고, 세부(판정·형태)는 각 영역의 설계 문서가 와야 한다.
  # required_by 는 각 층의 진입 Possibility(MP-VENTURE-INTO-*)로 배선했다 —
  # §21~§25 의 "필요:" 가 그 배선의 원본이다. MC-REPOSITION 만 비어 있다
  # (§20 SAFE 는 출발지라 진입 MP 가 없다 — 기본기 목록일 뿐이다).
  #
  # SAFE 층(BW §20)의 4종 중 3종은 기존 노드 재사용이다 — MC-ATTACK ≙ MC-COMBAT-STRIKE ·
  # MC-DEFEND ≙ MC-GUARD · MC-EVADE ≙ MC-EVADE(기존). BW §22 의 MC-BREAK 도 기존
  # MC-BREAK 재사용. 매핑은 Q18(a) 로 확정되었다 (2026-08-19 Human 승인).

  # ── SAFE (BW §20) — 나머지 1종 ────────────────────────────────────────

  - id: MC-REPOSITION
    type: capability
    semantic: >
      싸움이 일어나는 자리를 스스로 고쳐 잡는다 — 벗어나는 것(MC-EVADE)이 아니라
      다음 행동에 유리한 위치를 만드는 이동이다.
    required_by: [MP-CONTROL-MOVEMENT]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING
    # BW §20 — SAFE 층의 기본 4종 중 유일하게 기존 노드가 없는 것.

  # ── FRINGE (BW §21) — 강한 토착 포식자 ────────────────────────────────

  - id: MC-OBSERVE
    type: capability
    semantic: >
      행동하기 전에 대상을 관찰하여 그 행동·습성·상태의 정보를 얻는다.
    required_by: [MP-VENTURE-INTO-FRINGE]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-PREDICT
    type: capability
    semantic: >
      관찰한 정보로 대상이 다음에 무엇을 할지 미리 읽는다.
    required_by: [MP-VENTURE-INTO-FRINGE]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-USE-TERRAIN
    type: capability
    semantic: >
      지형을 자신의 유리함으로 쓴다 — 같은 상대라도 어디서 마주치는지가 결과를 바꾼다.
    required_by: [MP-VENTURE-INTO-FRINGE]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  # ── WILD (BW §22) — 특수 갑각·독·비정상 감각·특수 이동 ────────────────
  # MC-BREAK 는 기존 노드 재사용 (위 주석 · Q18).

  - id: MC-DISCOVER-WEAKNESS
    type: capability
    semantic: >
      비정상적인 방어·감각·이동을 가진 대상에서 통하는 지점을 스스로 찾아낸다 —
      알려진 약점을 쓰는 것이 아니라 약점을 발견하는 능력이다.
    required_by: [MP-VENTURE-INTO-WILD, MP-VENTURE-INTO-DEEP]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING
    # BW §22 (WILD) 와 §24 (DEEP) 가 같은 이름을 두 번 예고한다 — 노드는 하나다.

  - id: MC-PRECISE-TARGETING
    type: capability
    semantic: >
      몸 전체가 아니라 노린 지점에 정확히 닿게 공격한다.
    required_by: [MP-VENTURE-INTO-WILD]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-CONTROL-SPACE
    type: capability
    semantic: >
      상대가 쓸 수 있는 공간을 좁히거나 내가 쓸 공간을 확보한다 —
      특수 이동을 가진 상대에게 위치의 자유를 주지 않는다.
    required_by: [MP-VENTURE-INTO-WILD, MP-CONTROL-MOVEMENT]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  # ── DANGER (BW §23) — Hazard + Creature + Terrain 이 분리되지 않는다 ──

  - id: MC-READ-ENVIRONMENT
    type: capability
    semantic: >
      환경 자체를 읽는다 — 무엇이 위험 요소이고 언제 발동하는지를 생물과
      독립적으로 볼 수 없는 지역에서 파악한다.
    required_by: [MP-VENTURE-INTO-DANGER, MP-WEAPONIZE-ENVIRONMENT]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-FORCE-MOVEMENT
    type: capability
    semantic: >
      상대를 원하는 위치로 움직이게 강제한다.
    required_by: [MP-VENTURE-INTO-DANGER, MP-CONTROL-MOVEMENT]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-USE-HAZARD
    type: capability
    semantic: >
      환경의 위험 요소를 자신의 수단으로 쓴다 — 위험이 나에게만 위험한 것이 아니게 된다.
    required_by: [MP-VENTURE-INTO-DANGER, MP-WEAPONIZE-ENVIRONMENT]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-INTERRUPT
    type: capability
    semantic: >
      상대가 진행 중인 행동을 끊는다.
    required_by: [MP-VENTURE-INTO-DANGER, MP-INTERRUPT]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  # ── DEEP (BW §24) — 인간의 전투 상식이 무너진다 ───────────────────────

  - id: MC-DISRUPT-ABILITY
    type: capability
    semantic: >
      상대의 능력(재생·공생·적응) 자체가 작동하지 못하게 방해한다 —
      피해를 넣는 것이 아니라 능력의 성립을 끊는다.
    required_by: [MP-VENTURE-INTO-DEEP]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-MAINTAIN-PRESSURE
    type: capability
    semantic: >
      한 번의 성공이 아니라 압박을 끊기지 않게 유지한다 — 극단적인 재생·적응은
      틈을 주면 되돌아온다.
    required_by: [MP-VENTURE-INTO-DEEP]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-TARGET-SPECIFIC-PART
    type: capability
    semantic: >
      몸 전체가 아니라 특정 기관·부위를 대상으로 삼아 공격·작용한다.
    required_by: [MP-VENTURE-INTO-DEEP]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-READ-CREATURE-SYSTEM
    type: capability
    semantic: >
      생명체를 개체가 아니라 체계(신체 구조·공생 Network·생체 영역)로 읽는다 —
      무엇이 무엇을 지탱하는지를 이해해야 대응이 성립한다.
    required_by: [MP-VENTURE-INTO-DEEP]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  # ── UNKNOWN (BW §25) — 추상 영역(기억·감각·인식·Identity·공간)까지 변한다 ──

  - id: MC-PROTECT-PERCEPTION
    type: capability
    semantic: >
      자신의 감각·지각이 오염되거나 빼앗기지 않게 지킨다.
    required_by: [MP-VENTURE-INTO-UNKNOWN]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-VERIFY-REALITY
    type: capability
    semantic: >
      지금 지각하는 것이 실재인지 검증한다.
    required_by: [MP-VENTURE-INTO-UNKNOWN]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-IDENTITY-ANCHOR
    type: capability
    semantic: >
      자기 자신이 누구인지를 세계의 간섭으로부터 붙들어 둔다.
    required_by: [MP-VENTURE-INTO-UNKNOWN]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-RESIST-INFLUENCE
    type: capability
    semantic: >
      정신·행동에 대한 외부 간섭에 저항한다.
    required_by: [MP-VENTURE-INTO-UNKNOWN]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-BREAK-BIOLOGICAL-LINK
    type: capability
    semantic: >
      생명체 사이에 맺어진 생체 연결(공생·기생·Network)을 끊는다.
    required_by: [MP-VENTURE-INTO-UNKNOWN]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-ESCAPE-ALTERED-SPACE
    type: capability
    semantic: >
      변형된 공간(둥지가 된 공간·닫힌 영역)에서 빠져나온다.
    required_by: [MP-VENTURE-INTO-UNKNOWN]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  # ── 자원 유래 Capability — 대표 자원 2종 (BW §8~§10 · §17) ─────────────
  # BW §33 의 Trace 가 문서에 있다 — MW-HYPER-PREDATION · MW-SPATIAL-SHEAR 참조.
  # required_by 가 비어 있는 이유는 사다리와 같다 — 필요성 배선(어떤 Goal 의 어떤
  # Possibility 가 요구하는가)은 OPTIONS/NEED 몫이고, BW §17 은 Capability Gate
  # (자원 → Capability → 다음 지역) 패턴만 예고한다.

  - id: MC-RESTORE-BIOLOGICAL-STATE
    type: capability
    semantic: >
      생명체를 단순 치료하는 것이 아니라 최근의 안정적인 생체 상태에 가깝게 복원한다 —
      치명상·장기 손상·절단 등 기존 의료의 한계를 넘어서는 회복이다. (BW §8 원문)
    required_by: []
    constraints: [DC-WORLD-RESOURCE-ADAPTATION-TRACE]
    constraint_evaluation:
      DC-WORLD-RESOURCE-ADAPTATION-TRACE: SATISFIED    # Trace 를 문서가 공급한다 — MW-HYPER-PREDATION → 생존 압력 → 상태 보존 적응 → 회귀초 (BW §8~§9)
    overlay: MISSING

  - id: MC-CUT-ABNORMAL-STRUCTURE
    type: capability
    semantic: >
      다른 물질의 구조적 연결을 절단하거나 비정상적인 방어 구조에도 영향을 준다 —
      단순한 공격력 상승이 아니라 기존에는 파괴할 수 없던 생물·구조에의 대응이다. (BW §10 · §17)
    required_by: []
    constraints: [DC-WORLD-RESOURCE-ADAPTATION-TRACE]
    constraint_evaluation:
      DC-WORLD-RESOURCE-ADAPTATION-TRACE: SATISFIED    # Trace: MW-SPATIAL-SHEAR → 물질 소멸 → IP-BOUNDARY-STABLE → IT-BOUNDARY-BLADE (BW §10)
    overlay: MISSING

