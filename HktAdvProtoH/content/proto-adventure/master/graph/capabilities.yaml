          segment: SAFE
          source: BW §20 (이름과 필요 목록만)
    required_by: [MP-CONTROL-MOVEMENT]
    demanded_by: [MW-SAFE-FRONTIER]
    constraints: []
    constraint_evaluation: {}
    overlay: PARTIAL

  # ── FRINGE (BW §21) — 강한 토착 포식자 ────────────────────────────────

  - id: MC-OBSERVE
    type: capability
    semantic: >
      행동하기 전에 대상을 관찰하여 그 행동·습성·상태의 정보를 얻는다.
    detail: >
      탐험 축 전체의 첫 칸이다. 이 노드의 값어치는 정보를 주는 데 있는 것이 아니라
      **정보를 얻는 데 대가가 들게** 하는 데 있다. 모든 것이 처음부터 보이면 관찰이라는
      행위가 존재할 수 없고, "관찰 → 이해 → 대응" 이라는 진행 구조(BW §32)의 첫 칸이
      비어 버린다. 그래서 이것은 새 정보 표시가 아니라 정보 공개 시점의 규칙이다.
    world_shape: >
      관찰하기 전에는 대상에 대해 모르는 것이 있고, 관찰이라는 행동을 한 뒤에 그것이
      드러나며, 그 차이가 플레이어의 다음 선택을 바꿔야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-KNOWING-CHAIN
          segment: OBSERVE
          source: BW §21 · §32
        - system: MS-CREATURE-BEHAVIOR
          source: 초안 대기
          role: 남은 결손(습성 관찰)의 반쪽을 이 시스템이 소유한다
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER]
    demanded_by: [MW-ZONE-FRINGE]
    constraints: [DC-WORLD-PROGRESSION-IS-REACH, DC-COMBAT-MATCHUP-SOFT,
                  DC-WORLD-PLAYER-UNFIXED-PATH]
    constraint_evaluation:
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED   # 진행이 수치가 아니라 "고를 근거" 로 나타난다 — BW §32 사슬의 첫 칸
      DC-COMBAT-MATCHUP-SOFT: SATISFIED          # 관찰은 계산에 한 글자도 더하지 않는다
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED    # 살펴봄이 다른 행동의 조건이 아니다 — 모르는 채로도 싸운다
    overlay: PARTIAL
    # 남은 결손(행동·습성)은 보류 — 자율 존재 행동 문서 대기. 근거는 ../overlay.md · 경위는 HISTORY.

  - id: MC-PREDICT
    type: capability
    semantic: >
      관찰한 정보로 대상이 다음에 무엇을 할지 미리 읽는다.
    detail: >
      관찰(MC-OBSERVE) 위에 얹힌다. 관찰이 "지금 무엇인가" 라면 이것은 "다음에 무엇을
      할 것인가" 다. 성립하려면 상대의 행동에 예고가 있어야 한다 — 아무 예고 없이
      즉시 일어나는 행동만 있으면 읽을 것이 없다.
    world_shape: >
      상대의 행동에 시작을 알리는 구간이 있고, 그것을 읽은 플레이어가 미리 대비해
      다른 결과를 낼 수 있어야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
      memberships:
        - system: MS-KNOWING-CHAIN
          segment: PREDICT
          source: BW §21 (이름만)
        - system: MS-CREATURE-BEHAVIOR
          source: 초안 대기
          role: 읽을 거리의 반쪽을 이 시스템이 소유한다
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER]
    demanded_by: [MW-ZONE-FRINGE]
    constraints: [DC-WORLD-PROGRESSION-IS-REACH, DC-COMBAT-PLAYER-CAUSALITY,
                  DC-WORLD-PLAYER-UNFIXED-PATH]
    constraint_evaluation:
      DC-WORLD-PROGRESSION-IS-REACH: SATISFIED   # 진행이 이해의 확장으로 나타난다 — BW §32 사슬의 둘째 칸
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED      # 읽히는 것은 세계가 이미 정한 다음 행동이다 — 새 난수를 들이지 않는다
      DC-WORLD-PLAYER-UNFIXED-PATH: SATISFIED    # 읽지 않고 싸우는 길이 남는다
    overlay: MISSING
    # 보류 — semantic 은 잠정이다 (part_of.grounded 참조). 결손 근거는 ../overlay.md · 경위는 HISTORY.

  - id: MC-USE-TERRAIN
    type: capability
    semantic: >
      지형을 자신의 유리함으로 쓴다 — 같은 상대라도 어디서 마주치는지가 결과를 바꾼다.
    detail: >
      위치를 고르는 것(MC-REPOSITION)과 다르다. 그것은 상대와의 상대적 자리이고,
      이것은 장소 자체가 가진 성질을 쓰는 것이다. 성립하려면 세계에 서로 다른
      성질의 땅이 있어야 한다.
    world_shape: >
      장소마다 다른 성질이 있고, 같은 상대와 같은 행동이라도 어디서 하느냐에 따라
      결과가 달라져야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
      memberships:
        - system: MS-BEIRA-LADDER
          segment: FRINGE
          source: BW §21 (이름과 필요 목록만)
    required_by: []
    demanded_by: [MW-ZONE-FRINGE]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  # ── WILD (BW §22) — 특수 갑각·독·비정상 감각·특수 이동 ────────────────
  # MC-BREAK 는 위 전투 절의 기존 노드를 재사용한다.

  - id: MC-DISCOVER-WEAKNESS
    type: capability
    semantic: >
      비정상적인 방어·감각·이동을 가진 대상에서 통하는 지점을 스스로 찾아낸다 —
      알려진 약점을 쓰는 것이 아니라 약점을 발견하는 능력이다.
    detail: >
      "약점을 안다" 와 "약점을 찾아낸다" 의 차이가 이 노드의 전부다. 전자는 공략집을
      읽으면 끝이고, 후자는 세계 안에서 해 봐야 알 수 있다. 굳지 않은 세계압 때문에
      개체마다 다를 수 있다는 점(MW-FREE-PRESSURE)이 이 노드를 성립시킨다.
    world_shape: >
      상대마다 통하는 지점이 다르고, 그것을 세계 안의 시도와 관찰로 알아낼 수 있으며,
      알아낸 것이 다음 판에 쓸모가 있어야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
      memberships:
        - system: MS-BEIRA-LADDER
          segment: WILD
          source: BW §22 (이름만)
        - system: MS-BEIRA-LADDER
          segment: DEEP
          source: BW §24 (이름만)
          role: 두 층이 같은 이름을 요구한다 — 노드는 하나다
    required_by: []
    demanded_by: [MW-ZONE-WILD, MW-ZONE-DEEP]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-PRECISE-TARGETING
