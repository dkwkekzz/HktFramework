  # ── DEEP (BW §24) — 인간의 전투 상식이 무너진다 ───────────────────────

  - id: MC-DISRUPT-ABILITY
    type: capability
    semantic: >
      상대의 능력 자체가 작동하지 못하게 만든다 — 피해를 넣는 것이 아니라
      능력의 성립을 끊는다. 지속적으로 굴러가는 성질을 멈추는 것과 특정 능력을
      쓰지 못하게 봉인하는 것이 같은 자리다.
    detail: >
      행동을 끊는 것(MC-INTERRUPT)과 층이 다르다. 그것은 지금 하려는 한 동작을 막는
      것이고, 이것은 상대를 그 상대이게 하는 성질 자체를 멈추는 것이다. 재생하는
      상대에게 피해를 넣는 것은 무의미하고, 재생을 멈춰야 비로소 피해가 쌓인다.
      **UL 이 이 자리를 넓혔다.** BW 는 심부의 재생·공생을 끊는 쪽만 이름 댔는데,
      UL 은 같은 의미를 세계 조작의 하나(봉인)로 세우고 처음 열 다섯 중 하나로 지정한다
      (UL §22 Skill 행 · §42 F7). 봉인은 재생을 멈추는 것과 다른 시스템이 아니다 —
      둘 다 "지금부터 그 능력이 성립하지 않는다" 이며, 대상이 성질이냐 이름 붙은
      기술이냐만 다르다. 그래서 노드를 하나로 둔다.
      강한 조작이므로 대응책이 함께 있어야 한다 — UL 은 봉인의 예로 "건 쪽에서
      일정 거리 이상 멀어지면 풀린다" 를 든다 (UL §24).
    world_shape: >
      상대가 굴리는 능력(지속하는 성질이든 이름 붙은 기술이든)이 있고, 그것을
      성립하지 않게 만드는 수단이 있으며, 멈춘 동안에만 유효한 대응이 존재해야 한다.
      당한 쪽에는 왜 쓸 수 없는지가 사유로 보여야 하고, 그것을 푸는 길이 하나는 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-AURA-NEN
          segment: OPERATION
          source: UL §22 (Skill — Seal) · §26 · §42 F7 (처음 여는 다섯 중 하나)
        - system: MS-BEIRA-LADDER
          segment: DEEP
          source: BW §24 (이름만)
          role: 심부의 재생·공생을 끊는 쪽 — 같은 의미의 다른 대상
    required_by: [MP-KNOW-THE-OPPONENT-RULE]
    demanded_by: [MW-ZONE-DEEP]
    constraints: [DC-COMBAT-STRONG-RULE-HAS-COUNTERPLAY, DC-COMBAT-UNAVAILABLE-HAS-A-REASON]
    constraint_evaluation:
      DC-COMBAT-STRONG-RULE-HAS-COUNTERPLAY: UNRESOLVED   # 대응책의 형태를 UL 이 예로만 든다 (§24) — 어떤 것을 둘지는 그 Cycle 이 정한다
      DC-COMBAT-UNAVAILABLE-HAS-A-REASON: SATISFIED       # 봉인은 못 쓰는 사유로 드러난다 (UL §33)
    overlay: MISSING
    overlay_gap: >-
      재생·공생·부위라는 개념 자체가 없고, 능력을 봉인한다는 개념도 없다 — 지금 세계에서 못 쓰는 사유는 자원·거리·장착 같은 자기 조건뿐이고
      **남이 걸어 둔 것** 때문에 못 쓰는 자리가 없다

