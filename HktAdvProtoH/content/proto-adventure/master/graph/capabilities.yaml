  - id: MC-DESIGNATE-TARGET
    type: capability
    semantic: >
      세계 안의 존재 하나를 자기 의도의 대상으로 고르고, 세계가 그 관계를 기억한다.
      고른 뒤의 행동들은 저마다 대상을 다시 찾지 않고 같은 대상으로 나간다.
    detail: >
      이 능력이 있는 몸과 없는 몸의 차이는 무엇을 할 수 있는가가 아니라, 누구에게
      하는가가 어디에 있는가다. 없으면 살펴봄과 채집과 공격이 저마다 대상을 찾으므로
      같은 존재를 보고 있어도 행동마다 다른 상대로 나갈 수 있다 (TG §1). 있으면
      지금 누구를 상대하고 있는지가 세계가 지닌 사실이 되고 그 위에 관찰과 행동이
      함께 얹힌다. 이 관계는 보는 사람마다 따로 성립한다 — 같은 존재를 한 사람은
      고르고 다른 사람은 고르지 않을 수 있으며, 대상은 자기가 골라졌다는 이유만으로
      달라지지 않는다 (TG §2.1). 앎(MC-OBSERVE)과 헷갈리면 안 된다: 처음 보는
      존재도 고를 수 있고, 골랐다고 해서 가려진 것이 열리지 않는다 (TG §2.3).
    world_shape: >
      플레이어가 존재 하나를 골라 둘 수 있고 새로 고르기 전까지 그 선택이 유지되며,
      두 사람이 같은 세계에서 서로 다른 대상을 고른 채 서 있을 수 있어야 한다.
      멀어지거나 보이지 않게 되는 것만으로는 풀리지 않고, 대상이 세계에서 사라지면
      함께 정리되어야 한다. 그리고 고른 뒤의 행동이 바로 그 대상으로 나가는 것이
      플레이로 보여야 한다. 고르기 전에도 무엇을 고를 수 있고 그것이 나를 어떻게
      대하는지가 관찰에 드러나야 한다 — 다음 대상을 차례로 골라 나가는 것은 화면이
      하는 일이므로, 화면이 그 판단의 재료를 세계에서 받아야 한다 (Q26).
    part_of:
      grounded: true
      memberships:
        - system: MS-TARGETING
          source: TG §0 · §2 · §3
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER, MP-BIND-BY-CONTRACT]
    demanded_by: []
    constraints: [DC-TARGET-IS-INTENT-NOT-AIM, DC-WORLD-OWNS-THE-SURFACE-LIST]
    constraint_evaluation:
      DC-TARGET-IS-INTENT-NOT-AIM: SATISFIED      # 고르는 것으로는 아무것도 일어나지 않는다 — 이후 행동의 대상이 정해질 뿐이다
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED   # 고를 수 있는가·지금 되는가와 그 사유를 세계가 싣는다 (TG §5.5 · §6.1)
    overlay: IMPLEMENTED
    overlay_evidence: >-
      **C017** — 관찰자별로 고른 존재 하나를 세계가 지니고(`World.TargetSelections` · Id 만), 살펴봄·채집이 요청이 아니라 그
      관계에서 대상을 읽으며, 성립하지 않게 된 관계를 세계가 스스로 비운다
    overlay_gap: >-
      — (`RULE-TARGET-CLEAR-STALE-001` 은 **플레이로 도달하지 않는다** — 존재가 세계에서 사라지는 경로가 0건이다. 규칙과 단위 검증은
      섰고, 확인은 존재를 없애는 개념이 오는 Cycle 의 몫이다 — C017 08 주①)

  - id: MC-WATCH-TARGET
    type: capability
    semantic: >
      고른 대상의 지금 상태와, 그 대상에게 지금 할 수 있는 것과 할 수 없는 사유를
      한자리에서 계속 읽는다. 읽히는 값은 고른 순간의 사본이 아니라 지금의 값이다.
    detail: >
      살펴봄(MC-OBSERVE)이 무엇을 알게 되는가라면 이것은 이미 알게 된 것과 늘 보이는
      것을 어디서 계속 보는가다. 둘을 섞으면 지목이 앎의 대가를 건너뛰는 문이 된다 —
      가려진 것은 여기서도 가려진 채로 있고, 가려졌다는 사실이 함께 보인다 (TG §3.2).
      값어치는 표시가 아니라 판단에 있다. 멀어져도 선택이 풀리지 않고 대신 왜 지금
      할 수 없는지가 같은 자리에서 갱신되어야, 플레이어가 다가갈지 물러설지를 고를
      수 있다 (TG §4.2). 사유가 사라지고 행동만 회색으로 남으면 이 능력이 아니다.
    world_shape: >
      고른 대상의 생명·행동·거리가 세계가 바뀌는 대로 갱신되어 보이고, 아직 가려진
      것은 가려졌다는 사실과 함께 보이며, 지금 할 수 없는 행동은 그 사유가 함께
      보여야 한다. 상황이 바뀌면 사유도 따라 바뀌어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-TARGETING
          source: TG §3.2 · §4.2
    required_by: [MP-LEARN-TO-HANDLE-THE-LAYER]
    demanded_by: []
    constraints: [DC-WORLD-OWNS-THE-SURFACE-LIST, DC-TARGET-IS-INTENT-NOT-AIM]
    constraint_evaluation:
      DC-WORLD-OWNS-THE-SURFACE-LIST: SATISFIED   # 무엇이 되고 왜 안 되는지의 목록은 세계가 싣고 화면은 그것을 표현한다 (TG §6.1 · §6.2)
      DC-TARGET-IS-INTENT-NOT-AIM: SATISFIED      # 계속 읽는 것은 이미 열린 것뿐이다 — 지목이 가려진 것을 열지 않는다
    overlay: IMPLEMENTED
    overlay_evidence: >-
      **C017** — 고른 상대의 지금 값과, 그에게 지금 무엇이 되고 무엇이 왜 안 되는지가 한자리에서 계속 갱신된다. 사유가 사라지고 행동만 회색으로 남는
      형태가 아니라 문구로 온다

  - id: MC-RELATION-STANCE
    type: capability
    semantic: >
      존재와 존재 사이에 적대·중립·우호라는 태도가 세계의 사실로 있다. 그 태도가
      누구를 칠 수 있는지와 자율 존재가 다가온 것을 어떻게 대하는지를 가른다.
    detail: >
      지금 세계에는 이 태도가 없다 — 휘두른 자리에 닿은 것은 무엇이든 맞는다. 태도를
      세우면 처음으로 "칠 수 있는 것과 칠 수 없는 것" 이 갈리므로, 이것은 표시가 아니라
      판정이다. 세계의 사정은 이미 서 있다: FRINGE 의 포식자는 자기 사냥터에 들어온 것을
      사냥감으로 대하고(MA-HOSTILE-COMBATANT · BW §21), 그것이 그 존재의 목적이다
      (MG-HOLD-HUNTING-GROUND). 태도는 존재의 이름표가 아니라 **사이의 값**이다 —
      같은 존재라도 누구를 마주하느냐에 따라 다를 수 있어야 나중에 사람 사이의 태도와
      진영이 같은 자리에 얹힌다.
    world_shape: >
      어떤 존재는 다가온 나를 사냥감으로 대하고 어떤 존재는 그러지 않는다는 것이
      플레이 중에 드러나야 하고, 그 태도에 따라 할 수 있는 일이 실제로 달라져야 하며,
      그 태도가 어느 쪽에서 본 것인지가 관찰에 실려야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-RELATION
          source: BW §21 · §26 — C018 로 의미 확정
