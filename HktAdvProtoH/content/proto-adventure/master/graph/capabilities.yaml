  - id: MC-CRITICAL-STRIKE
    type: capability
    semantic: 공격이 확률적으로 더 크게 증폭되어 터진다. 발생 확률과 증폭 크기는 Actor 의 성질이며 성장·장비로 자란다. Critical 발생 여부와 그 증폭은 계산
      경위에 그대로 드러난다.
    source: R1 §14
    world_shape: 같은 조건 반복에서 대부분 같은 피해가 나오다 이따금 증폭된 피해가 나오고, 그 타격의 계산 내역에 증폭 여부와 배율이 찍혀야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: CRITICAL
          source: R1 §14 (이름) — C015 로 의미 확정
    required_by: [ MP-BET-ON-THE-CRITICAL-BLOW ]
    demanded_by: []
    constraints: [ DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-FORMULA ]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
      DC-COMBAT-ONE-FORMULA: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: C015 08-verification
