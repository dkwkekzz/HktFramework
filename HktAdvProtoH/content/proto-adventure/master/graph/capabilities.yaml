    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 무너뜨리는 조건이 관찰 가능한 상태로 드러난다 (R1 §6)
    overlay: PARTIAL
    overlay_evidence: >-
      코드 대조 — 막는 기력이 모자라면 방어가 풀리고 일정 시간 다시 세우지 못하며 그 타격은 그대로 들어간다 (C011)
    overlay_gap: >-
      무너뜨리기 위한 **행동**이 없다. 지금은 상대가 자원을 다 쓴 결과로만 일어나므로 플레이어가 만들어 내는 구간이 아니다

  - id: MC-COMBAT-FLOW
    type: capability
    semantic: >
      지금 몸의 힘을 공격과 방어 중 어디에 얼마나 몰았는지가 상태로 드러나고,
      한쪽에 몰수록 반대쪽이 실제로 빈다. 그 빈 구간은 상대가 읽을 수 있다.
    detail: >
      전투 사다리에서 가장 파급이 큰 노드다. 이것이 서면 "지금 상대가 어디에 힘을
      쏟고 있는가" 가 관찰 대상이 되고, 그 위에 열린 곳 노리기·자세 유지·서약이
      전부 얹힌다. 반대로 이것이 없으면 그 세 갈래는 얹힐 바닥이 없다.
    world_shape: >
      공격과 방어에 힘을 배분하는 상태가 존재하고, 한쪽에 몰면 반대쪽 수치가 실제로
      낮아지며, 그 배분이 상대에게 관찰 가능해야 한다.
    part_of:
