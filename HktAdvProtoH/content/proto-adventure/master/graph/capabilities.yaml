      Possibility 표)

  - id: MC-PERFECT-GUARD
    type: capability
    semantic: >
      정확한 시점에 시작한 방어는 피해를 받지 않고, 때린 쪽이 잠시 노출된다.
      성패는 확률이 아니라 방어를 시작한 시각과 공격이 닿은 시각의 관계로 갈린다.
    detail: >
      막기(MC-GUARD)에 시점이라는 축을 더한다. 지금의 막기는 켜 두면 되는 자세라
      숙련이 개입할 여지가 적은데, 시작 시각이 판정에 들어가면 같은 막기라도 잘하는
      사람과 못하는 사람의 결과가 갈린다. 확률이 아니라 시각 관계여야 한다는 점이 핵심이다.
      별개의 행동이 아니라는 점이 UL 이 확정한 것이다 — "완벽한 막기" 라는 버튼은 없고,
      정밀 응답(MC-PRECISION-RESPONSE)을 막기에 적용했을 때 나오는 결과가 이 노드다.
      그래서 얻는 것도 피해 0 하나가 아니라 셋이다: 피해 없음 · 때린 쪽의 노출 ·
      되받아칠 기회 (UL §6).
    world_shape: >
      방어를 시작한 시각과 공격이 닿은 시각의 차이가 판정에 쓰이고, 좁은 구간에
      맞추면 피해를 전혀 받지 않으며, 때린 쪽이 잠시 취약해져야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ACTIVE-DEFENSE
          segment: PRECISION
          source: UL §6 (Guard 의 Precision 결과 — 별개 행동이 아니다)
        - system: MS-COMBAT-LADDER
          segment: ACTIVE-DEFENSE
          source: R1 §14 (이름만) · UL §6 (정의)
    required_by: [MP-READ-AND-COUNTER]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-RESPONSE-INPUT, DC-COMBAT-RESPONSE-IS-OPTIONAL-MASTERY]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 확률이 아니라 시각 관계로 판정된다 (R1 §6)
      DC-COMBAT-ONE-RESPONSE-INPUT: SATISFIED  # 전용 입력이 아니라 막기가 낸 정밀 결과다 (UL §6)
      DC-COMBAT-RESPONSE-IS-OPTIONAL-MASTERY: SATISFIED  # 맞춰야만 사는 것이 아니라 맞추면 더 얻는다 (UL §3.2)
    overlay: MISSING
    overlay_gap: >-
      막기는 있으나 **시작 시각**이 판정에 쓰이지 않는다. 막기는 켜 두는 자세이고 결과는 막힘/무너짐 둘뿐이다 (R1 §14 Active Defense 층).
      다만 C019 로 **행동 안의 시점을 읽는 규칙**이 세계에 생겨 얹힐 바닥은 섰다

  - id: MC-COUNTER
    type: capability
    semantic: >
      상대가 열린 순간을 읽고 되받아쳐 더 큰 피해를 만든다.
    detail: >
      방어를 공격으로 전환하는 노드다. 이것이 없으면 방어는 언제나 손해를 줄이는
      일일 뿐이고, 밀리는 국면을 뒤집는 방법이 "버티다가 상대가 지치기를 기다린다"
      하나로 줄어든다. 되받아치기가 있어야 방어가 적극적인 선택이 된다.
      UL 이 확정한 것은 그 발동 경로다 — 되받아치기는 자기 버튼을 갖지 않고
      기회(MC-OPPORTUNITY)를 통해 온다. 기회를 가진 동안 평소의 빠른 베기가
      뒤집기 베기로 **바뀐다** (UL §7).
    world_shape: >
      상대가 취약해진 상태가 존재하고, 그 상태의 상대에게 넣은 공격이 평소보다
      크게 들어가야 한다. 그 공격은 새 입력이 아니라 기회를 가진 동안 기존 행동이
      다른 것으로 바뀐 것이어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-ACTIVE-DEFENSE
          segment: OPPORTUNITY
          source: UL §7 (Counter 는 별도 버튼이 아니라 기회를 통해 발동한다)
        - system: MS-COMBAT-LADDER
          segment: ACTIVE-DEFENSE
          source: R1 §14 (이름만) · UL §7 (정의)
    required_by: [MP-READ-AND-COUNTER]
    demanded_by: []
    constraints: [DC-COMBAT-PLAYER-CAUSALITY, DC-COMBAT-ONE-RESPONSE-INPUT]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED    # 명시된 조건이 성립할 때만 성립한다 (R1 §6)
      DC-COMBAT-ONE-RESPONSE-INPUT: SATISFIED  # 되받아치기 전용 입력을 만들지 않는다 — 기회가 기존 행동을 바꾼다 (UL §7)
    overlay: MISSING
    overlay_gap: >-
      취약 상태(Exposed)라는 개념이 없다 (R1 §14 Active Defense 층)

  - id: MC-BREAK
    type: capability
    semantic: >
      상대의 방어 구조(Guard · 특수 갑각 같은 형태 전반)를 무너뜨려
      그 방어가 성립하지 않는 구간을 만든다.
    detail: >
      관통(MC-PENETRATION)과 헷갈리기 쉽다. 관통은 방어를 **얇게** 만들고, 이것은
      방어를 **없는 것으로** 만든다 — 잠깐 동안. 그리고 관통은 상시 성질이지만
      이것은 만들어 내는 사건이다. 그래서 여럿이 함께 압박할 때 값어치가 커진다.
      BW §22 의 특수 갑각에도 같은 이름을 쓰므로 의미를 방어 구조 전반으로 넓혀 두었다.
    world_shape: >
      상대의 방어가 잠시 성립하지 않게 되는 상태가 있고, 그 상태가 플레이어의
      행동으로 만들어지며, 무엇 때문에 무너졌는지가 보여야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
      memberships:
        - system: MS-COMBAT-LADDER
          segment: ACTIVE-DEFENSE
          source: R1 §14 (이름만)
        - system: MS-BEIRA-LADDER
          segment: WILD
          source: BW §22
          role: 특수 갑각까지 방어 구조 전반으로 의미를 넓혀 둔 같은 노드
    required_by: [MP-BREAK-THE-GUARD]
