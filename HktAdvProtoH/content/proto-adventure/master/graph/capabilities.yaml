      "이렇게 준비해 두면 이만큼 커진다" 를 쌓을 수 있게 하는 노드다. 상한이 있어야
      무한 증폭이 되지 않고, 무엇이 기여했는지 읽혀야 플레이어가 다음 판에 재현할 수 있다.
    world_shape: >
      여러 조건이 동시에 성립할 수 있고 겹칠수록 결과가 커지되 상한이 있으며,
      결과에서 어떤 조건이 얼마나 기여했는지 읽혀야 한다.
