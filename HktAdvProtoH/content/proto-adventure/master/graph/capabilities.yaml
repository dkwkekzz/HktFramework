      몸 전체가 아니라 노린 지점에 정확히 닿게 공격한다.
    detail: >
      상대를 하나의 덩어리가 아니라 여러 부분으로 다루기 시작하는 노드다.
      부위라는 개념이 세계에 생겨야 성립하며, DEEP 층의 부위 노리기
      (MC-TARGET-SPECIFIC-PART)가 이 위에 얹힌다.
    world_shape: >
      상대의 몸에 구분되는 지점이 있고, 어디를 노렸는지가 결과를 바꿔야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
      memberships:
        - system: MS-BEIRA-LADDER
          segment: WILD
          source: BW §22 (이름만)
    required_by: []
    demanded_by: [MW-ZONE-WILD]
    constraints: []
    constraint_evaluation: {}
    overlay: MISSING

  - id: MC-CONTROL-SPACE
    type: capability
    semantic: >
      상대가 쓸 수 있는 공간을 좁히거나 내가 쓸 공간을 확보한다 —
      특수 이동을 가진 상대에게 위치의 자유를 주지 않는다.
    detail: >
      위치를 잡는 것(MC-REPOSITION)이 내 자리를 고르는 것이라면, 이것은 상대의
      자리 선택지를 줄이는 것이다. 특수한 이동 수단을 가진 상대에게는 내가 좋은
      자리를 잡는 것만으로 부족하기 때문에 필요해진다.
    world_shape: >
      상대가 갈 수 있는 곳을 제한하는 수단이 있고, 제한된 상대가 실제로 불리해져야 한다.
    part_of:
      grounded: false   # 근거 문서가 이름만 댔다 — 그 전체의 설계 문서가 서면 semantic 을 개정한다
