      DC-SKILL-DELIVERY-IS-NOT-EFFECT: SATISFIED
      DC-SKILL-ANCHOR-IS-NOT-RESOLUTION: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: C007 · C010 · C025 08-verification
  - id: MC-CP-ECONOMY
    type: capability
    semantic: 하나의 기력 예산이 공격·방어·기동·폭발을 함께 묶는다. 어디에 쓸지 고르는 순간 다른 곳에 쓸 것이 줄어든다.
    source: R1 §1 · §11
    world_shape: 공격·방어·기동이 모두 같은 자원을 쓰고, 한쪽에 쓰면 다른 쪽에 쓸 것이 실제로 줄어야 한다. 그리고 그 자원이 어떻게 돌아오는지가 정해져 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: R1 §1 · §11
          role: 모든 층이 공유하는 기력 예산
    required_by:
      - MP-READ-AND-COUNTER
      - MP-BREAK-THE-GUARD
      - MP-STAKE-EVERYTHING-ON-ONE-BLOW
      - MP-TRADE-BODY-FOR-RESOURCE
      - MP-EVADE-BY-MOVING-THE-BODY
      - MP-HOLD-FORTIFIED
      - MP-OUTGROW-THE-OPPONENT
      - MP-CONCENTRATE-THE-POWER
    demanded_by: []
    constraints: [ DC-COMBAT-SHARED-BUDGET ]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED
    overlay: PARTIAL
    overlay_evidence: C007 · C011 08-verification
    overlay_gap: 기력이 스스로 돌아오지 않는다. 회복 경로는 "타격을 성공시킨다" 하나뿐이라, 빗나가면 아무것도 벌지 못하고 쉬어도 차지 않는다
  - id: MC-BODY-FACING
    type: capability
    semantic: 몸이 향한 방향이 세계의 판정에 쓰인다 — 어느 쪽에서 들어온 공격인지가 의미를 가진다.
    source: 없음 — 문서 § 없이 C006·C011 로 세계에 섰다 (concepts 헤더 선례)
    world_shape: 같은 공격이라도 상대가 향한 방향에 따라 결과가 달라져야 하고, 그 방향이 관찰 가능해야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: 없음 — C006·C011 로 의미가 세계에 섰다
          role: 공간·방향 판정 바닥
    required_by: [ MP-TRADE-BODY-FOR-RESOURCE ]
    demanded_by: []
    constraints: []
    constraint_evaluation: {}
    overlay: IMPLEMENTED
    overlay_evidence: C006 08-verification
  - id: MC-COMBAT-CAUSE-READING
    type: capability
    semantic: 큰 결과가 나왔을 때 그것을 만든 원인과 배율을 전부 되짚어 읽을 수 있다. 플레이어는 이것으로 배우고, 만든 사람은 이것으로 고친다.
    source: DT §10 · §14 · BW §32
    world_shape: 한 번의 타격에 대해 어떤 능력치가 골라졌고 무엇이 얼마나 기여했는지가 전부 드러나야 하고, 플레이어가 그것을 보고 다음 선택을 바꿀 수 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: DT §10 · §14
          role: 계산 경위 관찰 — 전 층 공통
    required_by: [ MP-EXPLOIT-OPEN-BODY, MP-CONCENTRATE-THE-POWER ]
    demanded_by: []
    constraints: [ DC-COMBAT-PLAYER-CAUSALITY ]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: 코드 대조 — 모든 타격이 고른 능력치 이름·값, 기본 피해, 공격 기여, 방어 값, 관통, 유효 방어, 감쇄 배율, 최종·적용 피해, 막기 결과까지 관찰에 싣는다
    overlay_gap: — (승격 확인 대기 · open-questions.md)
  - id: MC-GUARD
    type: capability
    semantic: 앞을 향해 막는 행동으로 들어온 공격의 피해를 생명 대신 자원으로 치러 줄인다. 막을 자원이 다하면 방어 자체가 무너진다.
    source: R1 §1 · §11 · BW §20
    world_shape: 막는 행동이 있고, 막으면 피해가 줄되 자원이 들며, 자원이 마르면 방어가 풀리고 그동안은 다시 세우지 못해야 한다. 그리고 정면에서 온 것만 막혀야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: DEFENSE-ACTION
          source: R1 §1 · §11
        - system: MS-BEIRA-LADDER
          segment: SAFE
          source: BW §20
          role: SAFE 기본기 — BW 의 MC-DEFEND 가 이 노드다 (HISTORY Q18(a))
    required_by: [ MP-READ-AND-COUNTER, MP-TRADE-BODY-FOR-RESOURCE, MP-STORE-AND-RELEASE ]
    demanded_by: [ MW-SAFE-FRONTIER ]
    constraints: [ DC-COMBAT-SHARED-BUDGET ]
    constraint_evaluation:
      DC-COMBAT-SHARED-BUDGET: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: C011 08-verification
  - id: MC-DEFENSE-MITIGATION
    type: capability
    semantic: 맞은 피해를 줄인다. 공격을 빗나가게 하지 않으며, 아무리 두꺼워도 피해를 0 으로 만들지는 못하고, 두꺼워질수록 추가 방어의 효과는 점차 완만해진다.
    source: R1 §4 · §6
    world_shape: 방어 능력치가 높을수록 받는 피해가 줄되, 아무리 높여도 최소한의 피해는 들어가고, 같은 양을 더 올려도 줄어드는 폭이 점점 작아져야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: BASIC-DAMAGE
          source: R1 §4 · §6
          role: 수동 감쇄 — 행동이 아니라 몸의 성질
    required_by:
      [
        MP-TRADE-BODY-FOR-RESOURCE,
        MP-HOLD-FORTIFIED,
        MP-OUTGROW-THE-OPPONENT,
        MP-PIERCE-THE-HARD-DEFENSE
      ]
    demanded_by: []
    constraints: [ DC-COMBAT-PLAYER-CAUSALITY ]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: C010 08-verification
    overlay_gap: — (이것은 수동 감쇄다. 막는 행동은 MC-GUARD 로 별개)
  - id: MC-ATTACK-POWER
    type: capability
    semantic: Actor 는 공격의 위력을 나타내는 능력치를 가진다. 같은 스킬이라도 이 값이 큰 Actor 가 쓰면 더 아프며, 장비·성장·버프가 이 값을 올린다.
    source: R1 §6
    world_shape: 이 값이 다른 두 Actor 가 같은 스킬을 쓰면 결과가 달라야 하고, 그 차이가 계산 내역으로 설명되어야 하며, 세계 안의 행위로 이 값을 올릴 수 있어야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: R1 §6
          role: 능력치 축
    required_by: [ MP-OUTGROW-THE-OPPONENT, MP-BET-ON-THE-CRITICAL-BLOW ]
    demanded_by: []
    constraints: [ DC-COMBAT-PLAYER-CAUSALITY ]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
    overlay: PARTIAL
    overlay_evidence: C010 · C023 08-verification
    overlay_gap: 값을 키우는 축이 없다. 물건으로 값이 *달라지는* 것은 섰으나 그것을 *키우는* 것 — 될 Class 도, 배울 상대도, 자라는 경로도 — 은 여전히
      없다. 물건 쪽은 C024 로 둘이 되었으나(곡괭이 물리 공격 +12 · 손방패 물리 방어 +15) 그 둘은 서로 바꿔 끼는 관계이지 쌓이는 관계가 아니다
  - id: MC-SKILL-SCALING
    type: capability
    semantic: 스킬은 자신의 기본 피해량과, Actor 의 공격 능력치를 얼마나 피해로 바꾸는지의 계수를 가진다. 스킬의 강함과 Actor 의 강함이 분리되어 따로 자라며,
      계수가 다른 스킬들이 서로 다른 성격(빠르고 낮은 계수 · 무겁고 높은 계수)을 얻는다.
    source: R1 §2 · §3 · §6
    world_shape: 기본 피해와 계수가 스킬마다 다르고 관찰 가능하며, 공격 능력치를 올렸을 때 계수가 큰 스킬이 더 크게 자라는 것이 보여야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          source: R1 §2 · §3 · §6
          role: 능력치 축
    required_by: [ MP-OUTGROW-THE-OPPONENT ]
    demanded_by: []
    constraints: [ DC-COMBAT-PLAYER-CAUSALITY ]
    constraint_evaluation:
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: C010 08-verification
  - id: MC-ATTACK-ARMOR-MATCHUP
    type: capability
    semantic: 무엇으로 무엇을 때렸는지가 결과를 바꾼다. 공격 형태에 대응하는 방어 능력만 그 피해를 줄이며, 상성은 별도 배율이 아니라 그 대응 능력치의 차이로만 생긴다.
    source: DT §4 · §7
    world_shape: 공격 형태가 둘 이상이고 각각에 대응하는 방어가 따로 있으며, 같은 스킬 값이 상대에 따라 다른 결과를 내되 어느 쪽도 완전히 막히지 않아야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: DAMAGE-TYPE
          source: DT §4 · §7
    required_by: [ MP-MATCH-WEAPON-TO-ARMOR, MP-PIERCE-THE-HARD-DEFENSE ]
    demanded_by: []
    constraints: [ DC-COMBAT-MATCHUP-SOFT, DC-COMBAT-PLAYER-CAUSALITY ]
    constraint_evaluation:
      DC-COMBAT-MATCHUP-SOFT: SATISFIED
      DC-COMBAT-PLAYER-CAUSALITY: SATISFIED
    overlay: IMPLEMENTED
    overlay_evidence: C012 08-verification
  - id: MC-PENETRATION
    type: capability
    semantic: 상대의 방어 중 내 공격이 마주한 쪽을 얼마간 통하지 않게 만든다. 방어를 없애지는 못하고, 마주하지 않은 다른 방어에는 닿지 않으며, 두껍게 굳힌 상대일수록
      무력화의 몫이 커진다.
    source: R1 §14 · · DT §15
    world_shape: 관통을 지닌 쪽이 같은 스킬로 더 큰 피해를 넣고, 마주하지 않은 방어는 그대로이며, 관통이 아무리 커도 방어가 완전히 사라지지 않아야 한다.
    part_of:
      grounded: true
      memberships:
        - system: MS-COMBAT-LADDER
          segment: PENETRATION
          source: R1 §14 · DT §15
