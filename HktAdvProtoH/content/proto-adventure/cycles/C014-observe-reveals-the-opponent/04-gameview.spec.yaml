# CYCLE C014 — GameView Specification
#
# 이 Cycle 은 계약에 값을 더하지 않는다. 계약에 **없음을 더한다.**
# C007 R2 이래 이 계약의 성질은 "모든 것이 언제나 실린다" 였고, 그래서 View 는
# 어떤 자리도 비어 있을 수 있다는 것을 몰랐다. 이제 비어 있을 수 있다.
#
# 그러므로 이 계약의 중심은 **비어 있음이 값처럼 다뤄지는 것**이다.
# 자리가 그냥 없으면 View 는 "0 인가, 아직 안 왔나, 세계가 안 주나" 를 구별할 수 없고
# 결국 자기 코드에 "이 종류는 이럴 것이다" 를 적기 시작한다.
# 세계는 가린 자리마다 **가렸다는 사실과 무엇을 가렸는지의 이름**을 함께 싣는다
# (DC-WORLD-OWNS-THE-SURFACE-LIST).
id: VIEW-OBSERVE-REVEALS-THE-OPPONENT-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character                      # 위치·역할·이름·종류·모션·body·swing 그대로
    - entities.deposit
    - entityHud                               # 몸 위의 이름·생명 그대로
    - entities.character.vitality             # 생명은 가려지지 않는다
    - entities.character.attributes.energy / moveMode / control
    - entities.character.attributes.tempoStats / modifiers
    - entities.character.attributes.guard     # C011 그대로 — 막기는 가려지지 않는다
    - interactions.move / mine / moveMode / setAttribute
    - interactions.attack / skillHeavy / skillAura      # 관문도 사유도 그대로
    - interactions.*.profile                            # 내 스킬 값은 내 것이다
    - interactions.guardBegin / guardRelease
    - commandCatalog                                    # 구조 무변경 (COMMAND NOTE)
    - hud.inventory / tool / worldTime / observers
    - hud.playerAction                                  # 살펴봄의 진행이 이 자리로 보인다
    - hud.self.*                                        # 자기 것은 하나도 가려지지 않는다
    - strikeEvents.*                                    # 타격 경위는 하나도 가려지지 않는다
    - debugObserve / debugAuthority
    - observer / session / delivery / identity / telemetry
  added:
    - entities.character.attributes.acquainted          # 이 존재를 알고 있는가
    - entities.character.attributes.concealed           # 지금 가려진 항목의 이름들
    - entities.character.attributes.unacquaintedReason  # 왜 비어 있는가
    - interactions.observe                              # 존재마다 하나 — 살펴본다
    - interactions.forgetAcquaintance                   # 알게 된 것을 되돌린다
  changed:
    - entities.character.attributes.combatStats         # 남의 것은 알 때만 실린다
    - entities.character.attributes.versusObserver      # 남의 것은 알 때만 실린다
    - entities.character.attributes.defenseShape        # 남의 것은 알 때만 실린다

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# entities.character — 아는 존재와 모르는 존재
#
#   이 계약에서 한 존재는 이제 두 모습으로 온다. 어느 모습인지는 세계가 밝힌다.
#   View 는 두 모습을 모두 그릴 수 있어야 하며, 어느 쪽일지 짐작하지 않는다.
# ─────────────────────────────────────────────────────────────────
entities:
  character:
    cardinality: many
    source: World.Actors

    attributes:
      # ── 앎의 상태 (C014 ADDED) — 아는 존재에도 모르는 존재에도 언제나 실린다 ──
      acquainted:
        source: Acquaintance(Observer, Actor)
        meaning:
          - 이 관찰자가 이 존재의 겨루는 힘을 알고 있는가
          - 자기 몸은 언제나 참이다
          - 알든 모르든 **언제나 실린다.** "지금은 아무도 안 막는다" 와
            "세계가 안 알려준다" 를 가른 C011 의 원칙과 같은 이유다 —
            모른다는 것 자체가 관찰이어야 한다

      concealed:
        source: World.ConcealedKeys(Observer, Actor)
        meaning:
          - 지금 이 존재에 대해 **가려진 항목의 이름들**이다.
            모를 때는 `[combatStats, versusObserver, defenseShape]`,
            알 때는 빈 목록이다
          - 이 목록의 단일 출처는 세계다. View 가 "가려질 수 있는 것은 이 셋" 을
            자기 코드에 적지 않는다 — 세계가 가리는 항목을 늘리거나 줄이면
            View 를 고치지 않고 화면이 따라와야 한다
            (DC-WORLD-OWNS-THE-SURFACE-LIST)
          - acquainted 와 겹쳐 보이지만 답하는 질문이 다르다.
            acquainted 는 "아는가", concealed 는 "무엇이 없는가" 다.
            앞으로 앎이 부분적으로 열리는 층이 오면 acquainted 하나로는 답할 수 없다

      unacquaintedReason:
        source: World.UnacquaintedReason(Observer, Actor)
        presence: concealed 가 비어 있지 않을 때만
        values:
          - not-observed        # 아직 이 존재를 살펴보지 않았다
        meaning:
          - 비어 있는 이유를 세계가 말한다. View 가 "아마 안 봤겠지" 로 채우지 않는다
          - 지금 사유는 하나뿐이지만 자리를 사유 코드로 둔다 —
            값 하나로 굳혀 두면 다음 사유가 생길 때 계약이 깨진다

      # ── 겨루는 힘 (C010~C013) — 아는 존재에만 실린다 (C014 CHANGED) ──
      combatStats:
        presence: acquainted 가 참일 때만
        physicalAttack: { source: Actor.PhysicalAttack }
        auraAttack: { source: Actor.AuraAttack }
        armor: { source: Actor.Armor }
        resistance: { source: Actor.Resistance }
        armorPenetration: { source: Actor.ArmorPenetration }
        resistancePenetration: { source: Actor.ResistancePenetration }
        armorMultiplier: { source: Actor.ArmorMultiplier }
        resistanceMultiplier: { source: Actor.ResistanceMultiplier }
        meaning:
          - 값의 뜻은 C010·C012·C013 그대로다. 달라지는 것은 **언제 실리는가** 뿐이다
          - 알게 된 뒤에는 **그 순간의 값**이 실린다. 살펴본 때의 숫자가 아니다 —
            상대의 능력이 달라지면 달라진 값이 보인다 (03 World.Acquaintances)
          - 자기 몸의 것은 언제나 실린다

      versusObserver:
        presence: acquainted 가 참일 때만
        armor: { source: Actor.VersusObserver.Armor }
        resistance: { source: Actor.VersusObserver.Resistance }
        armorMultiplier: { source: Actor.VersusObserver.ArmorMultiplier }
        resistanceMultiplier: { source: Actor.VersusObserver.ResistanceMultiplier }
        meaning:
          - C013 그대로 — 이 존재의 방어가 보는 이의 관통에게 얼마로 읽히는가다
          - 모르는 상대에게는 실리지 않는다. 두 존재 사이의 값이므로
            한쪽을 모르는 채로는 성립하지 않는다
          - View 가 내 관통과 상대 방어를 곱해 만들어내서는 안 된다는 것도 그대로다.
            이제 그 금지가 더 중요하다 — 곱하려는 순간 가려진 자리가 뚫린다

      defenseShape:
        presence: acquainted 가 참일 때만
        source: Actor.DefenseShape
        meaning:
          - C012 그대로 — 어느 쪽이 더 단단한가를 세계가 계산한 판정이다
          - 모르는 상대에게는 실리지 않는다. 이것이 가려지지 않으면
            "무엇으로 칠지" 의 답이 그대로 새어 나가고 살펴봄이 할 일이 없어진다
          - 종류 이름으로 이 값을 짐작하지 않는다 (C012 부터의 금지 그대로).
            이제 그 금지가 실제로 시험된다 — 가려진 자리를 채우고 싶은 유혹이 생긴다

      # energy · moveMode · control · tempoStats · modifiers · guard 는 C007~C011 그대로.
      # 몸과 움직임에서 바로 읽히는 것이므로 가려지지 않는다 (03 SCOPE 의 선)

    vitality:
      # C007 그대로 — 생명은 가려지지 않는다. 남은 생명은 몸에서 보이는 것이다
      change: NONE

# ─────────────────────────────────────────────────────────────────
# interactions — 살펴보는 일과 되돌리는 일
# ─────────────────────────────────────────────────────────────────
interactions:
  observe:                                    # C014 ADDED
    role: observe-character
    cardinality: many                         # 존재마다 하나 (mine 이 광맥마다 실리는 형태)
    targetEntityId: { source: Actor.Id }
    available: { source: ObserveBegin.Availability }
    reason: { source: ObserveBegin.FailureReason }
    values:
      - out-of-range        # 너무 멀다 (World.ObserveRange 밖)
      - already-known       # 이미 알고 있다
      - action-busy         # 지금 다른 행동에 붙잡혀 있다
      - target-is-self      # 자기 몸은 살펴볼 대상이 아니다
    meaning:
      - 자기 몸에도 실린다. available 이 거짓이고 사유가 target-is-self 다 —
        왜 자기는 못 하는지도 세계가 말한다
      - 사유 넷이 그대로 화면의 안내가 된다. 특히 out-of-range 는
        "더 다가가야 안다" 를 가르치는 유일한 자리다.
        살펴봄의 대가가 거리라는 것을 플레이어가 배우는 지점이다
      - available 이 거짓인 이유를 View 가 스스로 계산하지 않는다.
        거리를 재서 판정하면 세계가 그 거리를 바꿔도 화면이 따라오지 않는다
      - 이 목록은 대상이 있는 interaction 이다 (attack 과 다르다) —
        무엇을 살펴볼지는 요청할 때 정해진다

  forgetAcquaintance:                         # C014 ADDED
    role: debug-forget-acquaintance
    target: 선택 — 없으면 알고 있는 전부
    available: { source: ForgetAcquaintance.Availability }
    reason: { source: ForgetAcquaintance.FailureReason }
    values:
      - authority-closed    # 세계가 권한을 닫아 두었다 (World.DebugAuthority)
      - no-observer
    meaning:
      - set-attribute 와 같은 자리의 요청이다. 세계가 권한을 닫으면 가용하지 않다
      - 이것이 이 Cycle 의 확인 수단이다 — 살펴보기 전과 후를 몇 번이고 견준다
      - 시간이 지나 저절로 잊는 길은 없다. 잊음은 이 요청뿐이다 (03 WORLD RULE)

  # move · mine · attack · skillHeavy · skillAura · guardBegin · guardRelease ·
  # moveMode · setAttribute 는 C007~C013 그대로. 관문도 사유 목록도 바뀌지 않는다.
  # 살펴봄이 다른 행동의 조건이 되지 않는다 — 모르는 상대도 그대로 칠 수 있다
  # (DC-WORLD-PLAYER-UNFIXED-PATH)

# ─────────────────────────────────────────────────────────────────
# hud — 새 막대도 새 자원도 없다
# ─────────────────────────────────────────────────────────────────
hud:
  playerAction:
    # C002·C007 그대로 — 지금 하는 행동과 그 진행도.
    # 살펴봄도 이 자리로 보인다. 새 항목을 만들지 않는다
    change: NONE
    meaning:
      - 살펴봄은 1.0 초짜리 행동이다. 이 자리의 진행도가 곧 "알아내는 중" 이며,
        중단되면 진행도가 사라지는 것이 "아무것도 얻지 못했다" 다
  self:
    # C007~C013 그대로. 자기 것은 하나도 가려지지 않으므로 이 자리는 변화가 없다
    change: NONE

strikeEvents:
  # C007~C013 그대로. 타격 경위는 가려지지 않는다 — 맞아 본 것은 겨뤄 본 것이다
  change: NONE
  meaning:
    - 모르는 상대를 쳐도 breakdown 은 전부 실린다.
      defenseStat 에 그 상대의 방어 값이 그대로 나온다
    - 그것으로 상대를 **알게 되지는 않는다.** 경위는 그 한 타격의 기록이고,
      entities 의 combatStats 는 여전히 비어 있다 (03 INTENT-UNSEEN-CAPABILITY-001).
      View 가 경위의 값을 모아 가려진 자리를 채워 넣어서는 안 된다 —
      그러면 세계가 정한 앎의 경계를 View 가 무너뜨린다

# ─────────────────────────────────────────────────────────────────
# COMMAND NOTE — commandCatalog 계약 모양은 바뀌지 않는다
# ─────────────────────────────────────────────────────────────────
# 세계가 싣는 요청 목록에 forget-acquaintance 가 하나 더해진다.
# C013 이 바꿀 수 있는 속성을 12개에서 14개로 늘렸을 때와 같은 일이다 —
# 목록은 세계의 것이고 View 는 읽을 뿐이므로 계약 모양은 그대로다
# (C009 · DC-WORLD-OWNS-THE-SURFACE-LIST).

# ─────────────────────────────────────────────────────────────────
# EMPTY-SLOT NOTE — 비어 있는 자리를 View 가 어떻게 다뤄야 하는가
# ─────────────────────────────────────────────────────────────────
# 이 Cycle 이 계약에 들여오는 새 성질이므로 못박아 둔다.
#
#   해야 하는 것
#     concealed 목록을 읽어 그 이름의 자리를 "모름" 으로 그린다.
#     무엇을 모르는지가 화면에서 읽혀야 한다 — 자리가 그냥 사라지면
#     플레이어는 세계에 그 값이 없다고 배운다.
#
#   해서는 안 되는 것
#     ① 가려진 자리에 0 이나 빈 문자열을 넣는 것 — 없는 값을 있는 값으로 가르친다
#     ② 종류 이름(kind)으로 가려진 값을 짐작하는 것 — C012 부터의 금지다
#     ③ strikeEvents.breakdown 의 값을 모아 가려진 자리를 채우는 것
#     ④ 가려질 수 있는 항목의 이름을 View 코드에 적어 두는 것 — concealed 가 그 목록이다
#     ⑤ 자기 관통과 상대 방어를 곱해 versusObserver 를 만들어내는 것 (C013 금지 그대로)
#
# 어떻게 그릴지(물음표인지 빈칸인지 흐린 숫자인지)는 View 의 결정이다.
# 이 계약이 정하는 것은 **모름이 그려질 수 있어야 한다**는 것까지다.

# ─────────────────────────────────────────────────────────────────
# OBSERVABLE PROJECTION NOTE
# ─────────────────────────────────────────────────────────────────
#   03 의 Observable Semantic 대응
#     존재마다
#       acquainted                     → entities.character.attributes.acquainted
#       unacquaintedReason             → entities.character.attributes.unacquaintedReason
#       combatStats (알 때만)           → entities.character.attributes.combatStats
#       versusObserver (알 때만)        → entities.character.attributes.versusObserver
#       defenseShape (알 때만)          → entities.character.attributes.defenseShape
#     가려질 수 있는 항목의 목록         → entities.character.attributes.concealed
#     할 수 있는 일
#       ObserveBegin 가용성·사유        → interactions.observe
#       ForgetAcquaintance 가용성·사유   → interactions.forgetAcquaintance
#       요청 목록                       → commandCatalog (세계가 싣는다 — COMMAND NOTE)
#     행동의 진행
#       CurrentAction = observe         → hud.playerAction (기존 자리)
#
#   투영하지 않는 것
#     World.ObserveRange = 5.0 — 세계 상수다. 관찰되는 것은 상수가 아니라
#       그 결과인 interactions.observe.reason = out-of-range 다
#       (C010 이 DefenseConstant 에, C013 이 PenetrationConstant 에 내린 판단 그대로).
#     ACTION_DEFINITIONS.observe.duration = 1.0 — 같은 이유다. 관찰되는 것은
#       hud.playerAction 의 진행도다.
#     World.Acquaintances 장부 전체 — 다른 관찰자가 무엇을 아는지는 실리지 않는다.
#       내가 아는 것만 내 관찰에 실린다 (INTENT-PER-OBSERVER-PROJECTION-001).
#       "저 사람이 이 상대를 아는가" 는 이 Cycle 의 의미가 아니다.
#
#   03 의 Observable Semantic 중 투영되지 않은 것은 없다.
#
#   Designer Observer — 이 Cycle 은 designer 관찰을 따로 열지 않는다.
#   위 계약이 이미 판정 조건(available)과 실패 사유(reason)와 비어 있음의 사유
#   (unacquaintedReason)를 모두 싣는다.

# ─────────────────────────────────────────────────────────────────
# PLAYABILITY NOTE — 이 계약만으로 Cycle Goal 이 플레이되는가
# ─────────────────────────────────────────────────────────────────
# 플레이어(관찰자의 몸 = rabbit-swordsman · resistancePenetration 60)는
# 이 계약만 받고 다음을 할 수 있다.
#   1. 세계에 들어선다. 자율 존재(wanderer)가 보인다 — 이름과 생명과 지금 하는 행동은
#      보이지만 acquainted 는 거짓이고 concealed 에 세 이름이 있다.
#      **무엇으로 쳐야 하는지 알 수 없다.** C013 까지는 이 자리에 답이 있었다
#   2. 자기 hud 를 본다. resistancePenetration 60 — 나는 오라 방어를 깎을 수 있다.
#      그러나 저 상대의 어느 쪽이 두꺼운지를 모르므로 그 능력을 쓸 곳을 모른다
#   3. 멀리서 살펴보려 한다. interactions.observe 의 available 이 거짓이고
#      사유가 out-of-range 다 — **다가가야 안다**
#   4. 다가간다. 5.0 안에 들면 available 이 참이 된다. 살펴봄을 요청한다.
#      hud.playerAction 이 observe 로 바뀌고 진행도가 오른다
#   5-a 끝까지 간다. acquainted 가 참이 되고 concealed 가 빈다.
#      combatStats 에 armor 30 · resistance 90, defenseShape 는 aura-tougher,
#      versusObserver.resistance 는 56.25 — 오라로 쳐야 한다는 답이 그 자리에 있다
#   5-b 다가가는 사이에 맞는다. hud.playerAction 이 hit 으로 갈리고 진행도가 사라진다.
#      acquainted 는 여전히 거짓이다 — 아무것도 얻지 못했다.
#      물러나 다시 하거나, 모르는 채로 싸운다
#   6. 안 다음 오라 스킬로 친다. breakdown 이 C013 과 **완전히 같은 숫자**를 낸다
#      (defenseStat 90 · penetrationStat 60 · effectiveDefense 56.25 · finalDamage 17).
#      살펴봄은 계산에 아무것도 더하지 않았다 — 고를 근거만 주었다
#   7. 모르는 채로도 친다. 다른 자율 존재를 살펴보지 않고 물리로 친다.
