# CYCLE C-TERRAIN-002 — GameView Specification
#
# C-TERRAIN-001 이 무대 자체를 이 계약에 처음 실었다. 그때 자리는 **놓인 것**이었다 —
# 어디까지가 그 자리이고 그것이 작용하는 자리인가 멎는 자리인가, 그뿐이었다.
#
# 이 계약이 자리에 **시간**을 싣는다. 같은 자리가 지금 무엇을 하고 있으며 얼마나 찼는가.
#
# 더하고 바꾸는 것은 넷뿐이다.
#
#   ① ground.zones[].phase   role 을 대신한다 — 놓인 성질이 아니라 지금의 단계다
#   ② ground.zones[].fill    지금 얼마나 찼는가 (0..1)
#   ③ ground.self.state      `warming` 이 는다 — 멎기만 하는 것과 돌려받는 것이 갈린다
#   ④ (없음)                 새 interaction 도 새 hud 줄도 없다
#
# 계산은 여전히 세계의 것이다. 화면은 fill 을 **받는다** — kept 와 saturation 을 받아
# 나누지 않는다. 나누는 순간 화면이 넘침을 스스로 판정할 수 있게 되고, 그러면 판정이
# 두 곳에 산다 (DC-WORLD-OWNS-THE-SURFACE-LIST).
id: VIEW-THE-LAND-KEEPS-WHAT-IT-TAKES-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.*                              # 몸과 관련된 모든 것이 그대로다
    - entityHud
    - inventory / inventoryRoom / equipment
    - strikeEvents / unharmedContacts / cancelEvents
    - currentTarget / commandCatalog
    - allocations
    - debugObserve / debugAuthority
    - observer / session / delivery / identity / telemetry
    - ground.zones[].id / law / center / radius
    - ground.self.law / takes
    - hud.*                                   # self.warmth · self.warmthMax 를 포함해 그대로
    - interactions.*                          # 새 interaction 이 없다 (아래 이유)
  added:
    - ground.zones[].fill                     # 지금 얼마나 찼는가 (0..1)
    - ground.self.state[warming]              # 돌려받는 중이라는 값 하나
  changed:
    - ground.zones[].phase                    # role 을 대신한다 (아래 REMOVED 와 한 몸)
    - ground.self.state[sheltered]            # 뜻이 좁아진다 — 아래 값 표
  removed:
    - ground.zones[].role                     # 놓인 성질이 세계에서 사라졌다

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# ground.zones — 무대의 자리들. 이제 **변한다**
#
#   여전히 관찰자에 딸리지 않는다 — 누가 보든 같은 자리가 거기 있다.
#   달라진 것은 **같은 자리를 다른 시각에 보면 다르다**는 것이다.
#   그래서 `id` 가 처음으로 값어치를 지닌다: 프레임 사이에 같은 자리를 이어 보아야
#   차오르는 것과 열리는 것이 하나의 자리에 일어나는 일로 읽힌다.
# ─────────────────────────────────────────────────────────────────
ground:
  zones:
    cardinality: many
    source: World.GroundZones
    fields:
      id:
        source: GroundZone.Id
        meaning: 이 자리의 이름. 같은 자리를 프레임 사이에 이어 보기 위한 것
        delta: REUSED
      law:
        source: GroundZone.Law
        meaning: >
          어느 법칙의 맥인가 — 의미 코드다. 코드가 하나 늘어나도 계약은 열리지 않는다
        values: [heat-binding]
        delta: REUSED
      phase:
        source: GroundZone.Phase
        meaning: >
          **`role` 을 대신한다.** 놓인 성질이 아니라 지금의 단계다 — 같은 자리가
          한 판 안에서 둘 사이를 오간다.

          이 자리는 이제 세계가 **답한 것**이지 세계를 적은 사람이 정한 것이 아니다.
          화면은 이 값으로 색을 고른다. 지난 계약에서 `role = respite` 가 고르던
          그 색을 이제 `phase = venting` 이 고른다 — 화면의 결정은 그대로 서 있고
          그것을 고르는 근거만 바뀐다
        values:
          binding: 거두는 중이다 — 그 안의 몸에서 법칙이 거두어 간다
          venting: 뿜는 중이다 — 그 자리에서 법칙이 멎고, 지닌 것을 내보낸다
        delta: CHANGED (was role: law | respite)
      fill:
        source: GroundZone.Kept / Law.Saturation
        meaning: >
          **지금 얼마나 찼는가 — 0 에서 1 사이의 비율이다.**

          날값(kept)과 넘침 지점(saturation)을 따로 싣지 않는다. 따로 실으면 화면이
          둘을 견주어 "곧 넘친다" 를 스스로 판정할 수 있게 되고, 그 순간 판정이 세계와
          화면 두 곳에 산다 (DC-WORLD-OWNS-THE-SURFACE-LIST). 세계가 이미 나눈 값을 준다.

          `phase = venting` 인 동안에도 실린다 — 뿜는 자리가 얼마나 남았는지가
          **그 자리가 언제 닫히는지**이기 때문이다. 이것은 예고가 아니다: 지금 지닌
          것이지 앞으로 일어날 일이 아니다
        range: [0, 1]
        delta: ADDED
      center:
        source: GroundZone.Center
        meaning: 범위의 중심 (x, z). 세계가 굴러가도 바뀌지 않는다
        delta: REUSED
      radius:
        source: GroundZone.Radius
        meaning: 범위의 반경. 범위는 원이다 — 세계에 다른 모양이 없다
        delta: REUSED
    meaning: >
      자리는 겹칠 수 있고, 겹친 채로 서로 다른 단계에 있을 수 있다 — 하나는 차오르고
      하나는 뿜는다. 화면은 겹침을 해소하지 않고 있는 그대로 그린다.

      **어느 자리가 내 열을 받고 있는지는 실리지 않는다.** 그것은 세계 안의 판정이며,
      화면이 알아야 할 것은 그 결과(자리마다의 fill)다. 알려 주면 화면이 "여기 서면
      저기가 찬다" 를 계산하게 되고 그것은 예고다.

  # ───────────────────────────────────────────────────────────────
  # ground.self — 지금 나에게 무엇이 일어나는 중인가
  #
  #   값 하나가 는다. 지난 계약에서 `sheltered` 는 "법칙의 자리 안이지만 멎어 있다"
  #   하나였고, 멎음의 이유는 하나뿐이었다(놓인 예외 자리 안이다).
  #
  #   이제 멎는 자리는 **뿜는 자리**이고, 뿜는 자리는 내게 무언가를 준다. 주는 것과
  #   멎기만 하는 것이 한 코드로 묶이면 플레이어는 **자기 열이 왜 늘었는지 알 수 없다.**
  # ───────────────────────────────────────────────────────────────
  self:
    cardinality: one
    source: 관찰자의 몸
    fields:
      law:
        source: Self.GroundLaw
        meaning: 지금 이 몸에 걸린 법칙. 어느 자리에도 들지 않았으면 없음
        nullable: true
        values: [heat-binding]
        delta: REUSED
      state:
        source: Self.GroundState
        meaning: >
          네 값이 갈리는 것이 이 항목의 전부다. 겪는 것 · 돌려받는 것 · 멎기만 하는 것 ·
          아무 일도 없는 것.
        values:
          taking: 지금 거두어 가는 중이다                                    # REUSED
          warming: >                                                        # ADDED
            뿜는 자리 안이고 **받는 중**이다. 지닌 열이 늘고 있다
          sheltered: >                                                      # CHANGED
            뿜는 자리 안이지만 받지 않는다 — 몸이 이미 가득하다.
            **가득한 몸은 분출구를 소모하지 않는다**는 것이 이 값으로 읽힌다
          none: 어떤 법칙도 걸려 있지 않다                                   # REUSED
        delta: CHANGED
      takes:
        source: Self.GroundTakes
        meaning: >
          그 법칙이 거두어 가는 것이 무엇인가 — 의미 코드다. **돌려받는 것도 같은 값이다**
          (거두어 간 것이 돌아오는 것이므로). 없으면(state = none) 없음
        nullable: true
        values: [warmth]
        delta: REUSED

# ─────────────────────────────────────────────────────────────────
# hud — 한 줄도 늘지 않는다
#
#   지닌 열은 이미 실려 있다 (self.warmth · self.warmthMax · C-TERRAIN-001).
#   이 Cycle 이 바꾼 것은 그 값이 **올라갈 수도 있다**는 것뿐이며, 화면은 받은 값을
#   옮기므로 계약이 열리지 않는다.
# ─────────────────────────────────────────────────────────────────
hud:
  change: NONE

# ─────────────────────────────────────────────────────────────────
# interactions — 없다
#
#   차오르는 것도 뿜는 것도 받는 것도 아무 요청을 요구하지 않는다. 플레이어가 하는
#   일은 여전히 걸어 들어가고 걸어 나오고 **머무는** 것뿐이다
#   (INTENT-STANDING-IS-THE-WHOLE-INPUT-001).
#
#   머무는 것이 이 Cycle 의 판단이지만 머무름은 행동이 아니다 — 아무것도 하지 않는
#   것이다. 그것을 요청으로 만들면 세계에 "머문다" 는 상태가 생기고, 몸에 아무것도
#   적지 않는다는 규율이 깨진다.
# ─────────────────────────────────────────────────────────────────
interactions:
  change: NONE

# ─────────────────────────────────────────────────────────────────
# designer — 같은 계약으로 본다. 별도의 World 접근 경로를 만들지 않는다
# ─────────────────────────────────────────────────────────────────
designer:
  goal: 어디에 서 있었는가가 다음에 어디가 안전한지를 바꾼다
  possibility: 들어가서 겪으며 알아낸다 (MP-LEARN-TO-HANDLE-THE-LAYER)
  availability:
    - ground.self.state                # 겪는가 · 받는가 · 멎어 있는가 · 밖인가
    - ground.zones[].phase             # 어느 자리가 지금 열려 있는가
  preconditions:
    - ground.self.law
    - ground.zones[].fill              # 어느 자리가 넘침에 가까운가
  before_after:
    - ground.zones[].fill              # 머무는 동안 그 자리가 차오른다
    - ground.zones[].phase             # 넘치면 binding → venting · 다 쓰면 되돌아온다
    - hud[self.warmth]                 # 거두어질 때 준다 · 받을 때 는다
    - hud[self.hp]                     # 열이 다한 뒤에 준다
  reason:
    - taking
    - warming
    - sheltered
    - none

# ─────────────────────────────────────────────────────────────────
# VIEW CLOSURE — 이 계약만으로 Cycle Goal 을 플레이할 수 있는가
# ─────────────────────────────────────────────────────────────────
closure:
  - 어느 자리가 지금 열려 있는지 본다          zones[].phase = venting
  - 어느 자리가 거두는 자리인지 본다           zones[].phase = binding
  - 내가 머무는 자리가 차오르는 것을 본다       zones[].fill 이 올라간다
  - 얼마나 남았는지 안다                      fill 이 1 에 가까워진다
  - 넘치는 순간을 본다                        같은 id 의 phase 가 binding → venting
  - 그 자리가 나를 멎게 하는 것을 본다          self.state 가 taking → warming
  - 열이 돌아오는 것을 본다                   hud[self.warmth] 가 올라간다
  - 받는 것과 멎기만 하는 것을 구분한다         warming ≠ sheltered
  - 내가 받는 만큼 그 자리가 비는 것을 본다     그 자리의 fill 이 내려간다
  - 분출구가 닫히는 것을 본다                 fill 이 0 이 되고 phase 가 binding 으로
  - 닫힌 뒤 다시 거두어지는 것을 본다          self.state 가 taking 으로 돌아온다
  - 열린 자리가 **옮겨 간** 것을 본다          어제 열려 있던 id 는 binding · 다른 id 가 venting
  - 밖에서도 내 열이 얼마인지 본다             hud[self.warmth] (자리 밖에서도 실린다)

# ─────────────────────────────────────────────────────────────────
# NOT IN THIS CONTRACT — 싣지 않는 것과 그 이유
# ─────────────────────────────────────────────────────────────────
excluded:
  넘침 지점 · 뿜는 속도 · 흩어지는 속도 (saturation · ventRate · escapeRate):
    실으면 화면이 "몇 초 뒤에 넘친다 / 몇 초 뒤에 닫힌다" 를 계산할 수 있게 된다.
    그것은 예고이며 FR-THE-LAND-SHOWS-BEFORE-IT-TAKES 의 몫이다. fill 하나면
    지금 상태를 읽는 데 족하다
  kept 의 날값:
    같은 이유. 비율만 싣는다 — 나눗셈을 화면에 넘기지 않는다
  어느 자리가 내 열을 받는가:
    세계 안의 판정이다. 실으면 화면이 "여기 서면 저기가 찬다" 를 앞질러 말하게 된다.
    플레이어는 fill 이 올라가는 것을 **보고** 알아낸다 (MP-LEARN-TO-HANDLE-THE-LAYER)
  열이 흐르는 방향 (벡터 · 화살표):
    세계에 없다. BT §5.7 의 "열이 빠져나가는 방향" 은 이 계약에서 **어느 자리가 뿜고
    있는가**로 읽힌다 — 자리 사이의 흐름은 이 Cycle 이 세우지 않았다 (01 EXCLUDED)
  남의 열 · 남이 받는 중인지:
    내 몸의 것만 실린다 (INTENT-PER-OBSERVER-PROJECTION-001). 다만 zones 는 모두의
    것이므로, **남이 어딘가를 채우고 있으면 그 자리의 fill 로 보인다** — 이것이
    이 계약에서 다른 사람의 행위가 처음으로 무대에 남는 자리다
  가장 가까운 분출구까지의 거리 · 길 안내:
    실으면 화면이 안전한 길을 잇게 된다. MC-FIND-SAFE-ROUTE 는 아직 Target 이 아니다
  법칙의 이름 문구 · 단계의 이름 문구:
    의미 코드만 싣는다. 무엇이라 부를지는 화면의 결정이다

# ─────────────────────────────────────────────────────────────────
# ENGINE 에 요구하는 것 — 없다
#
#   `SceneGroundZone` 은 이미 섰다 (C-TERRAIN-001 08 MASTER FEEDBACK — 기반 부채 해소됨).
#   이 Cycle 이 새로 그려야 하는 것 둘은 그 장치가 이미 지닌 자리로 그린다.
#
#     차오름   fill 을 색·불투명도로 옮긴다 — 팩의 결정 (view/terrain-presentation.ts)
#     뿜음     `intensity` 로 맥동시킨다. C-TERRAIN-001 이 "다음 Cycle 의 예고가 쓴다" 며
#              비워 둔 자리이며, 예고보다 먼저 **지금 뿜는 중**이 그 자리를 쓴다.
#              엔진은 열리지 않는다
#
#   그래서 이 Cycle 은 ENGINE 레인을 기다리지 않는다. 기반 부채 없음.
# ─────────────────────────────────────────────────────────────────
engine_contract:
  primitive: SceneGroundZone
  change: NONE
  uses: [id, shape, fill, edge, label, intensity]
