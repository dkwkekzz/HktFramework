# CYCLE C-COMBAT-002 — GameView Specification
#
# 이 Cycle 이 계약에 더하는 것은 넷뿐이다.
#
#   ① 모든 존재에 **대답 자리** 한 자리 — 가려지지 않는다. 무엇으로 대답하는 몸인지가
#      보여야 그 앞에서 무엇을 칠지 고를 수 있다.
#   ② 내 몸에만 **지금 대답할 수 있는가** — 가부 · 사유 하나 · 값 · 열린 구간의 수.
#   ③ **요청의 자리 하나** — 무엇에 대답할지를 싣지 않는다. 자리가 하나이므로 버튼도 하나다.
#   ④ 한 방의 경위에 **대답이 덜어낸 몫** — 대답받은 타격에만 실린다.
#
# 그 밖의 모든 값은 형태가 한 글자도 바뀌지 않는다. combatStats 도 guard 도 strikes 도
# 그대로 오고, **대답하지 않은 타격의 수는 한 톨도 달라지지 않는다.**
# 그것이 이 Cycle 의 약속이며 (DC-COMBAT-RESPONSE-IS-OPTIONAL-MASTERY),
# 계약에서도 그 약속이 읽혀야 한다 — 그래서 breakdown.response 는 **선택 항**이다.
#
# 이 계약을 받은 View 는 **대답을 한 번도 계산하지 않는다.** 지금 구간이 열렸는지도,
# 기력이 되는지도, 어느 타격에 대답이 가는지도, 얼마가 덜어졌는지도 묻지 않는다 —
# 받은 값을 옮긴다. 대답 이름이 화면의 조건이 되지 않는다.
id: VIEW-THE-BLOW-CAN-BE-ANSWERED-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character                       # 위치·역할·이름·종류·모션·body·swing·상태 그대로
    - entities.deposit
    - entities.character.vitality
    - entities.character.attributes.energy     # 기력 — 대답할 수 있는가의 근거
    - entities.character.attributes.guard      # 막기 — **한 글자도 바뀌지 않는다**
    - entities.character.attributes.allocation # 배분 (C-COMBAT-001) — 건드리지 않는다
    - entities.character.attributes.combatStats
    - entities.character.attributes.insight / concealed / acquainted
    - entities.character.attributes.stanceTowardObserver / stanceFromObserver
    - entities.character.attributes.actionPhase          # 선딜 — **대답할 순간의 눈**
    - entities.character.attributes.tempoStats / modifiers / moveMode / control
    - allocations
    - inventory / inventoryRoom / equipment
    - strikes / contacts / cancels
    - currentTarget / commandCatalog
    - observer / session / delivery / identity / telemetry
    - interactions.*                           # 기존 열여덟 — 하나도 바뀌지 않는다
  added:
    - entities.character.attributes.response             # 대답 자리 (모든 존재)
    - interactions.respond                               # 요청의 자리
    - interactions.respond.incoming                      # 지금 열린 구간의 수
    - strikes[].breakdown.response                       # 대답이 덜어낸 몫
    - hud.self.response
    - hud.self.response.incoming
  changed: []
  removed: []

  note: >
    **changed 가 비어 있다.** 이 Cycle 은 기존 계약 항목의 형태도 값도 바꾸지 않는다.
    C-COMBAT-001 이 combatStats·insight·concealed 셋을 changed 로 적어야 했던 것과
    다른 자리다 — 배분은 이미 오던 값의 출처를 넓혔고, 대답은 **새 항을 옆에 더한다.**
    대답하지 않은 타격의 breakdown 은 이 Cycle 이전과 필드 하나까지 같다.

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# entities — 모든 존재가 대답 자리를 지닌다
# ─────────────────────────────────────────────────────────────────
entities:
  character:
    reused: true
    attributes:
      response:
        added: true
        source: Actor.Response
        fields:
          id:
            source: 대답의 이름 (의미 코드)
            meaning: >
              표시 이름은 View 책임이다. **화면이 이 코드로 분기하지 않는다** —
              표에 없으면 코드 그대로 보인다 (C-COMBAT-001 의 배분 이름과 같은 태도).
              그래서 세계가 둘째 대답을 지어도 이 코드는 열리지 않는다
              (DC-WORLD-OWNS-THE-SURFACE-LIST).
        concealed: false
        meaning: >
          **모든 존재에 언제나 실린다. 가려지지 않는다.**
          상대가 무엇으로 대답하는 몸인지를 알아야 그 앞에서 무엇을 칠지 고를 수 있고,
          그것이 이 층이 여는 수다 (INTENT-RESPONSE-OBSERVABLE-001).
          배분(C-COMBAT-001) · 태도(C018) · 통찰(C016)이 가려지지 않는 자리에 나란히 선다.

          **비어 있는 값이 없다** — 어떤 몸이든 언제나 정확히 하나를 지닌다.
          "대답이 없는 몸" 이라는 갈래가 계약에 생기지 않는다.

          지금 세계에서 값은 하나뿐이다. 그래도 코드를 싣는 이유는, 둘째가 생기는 날
          이 자리가 열리지 않게 하기 위해서다.

      actionPhase:
        reused: true
        meaning: >
          **이 Cycle 이 이 값의 쓸모를 바꾼다 — 계약은 그대로다.** C019 가 세운 선딜
          표시는 지금까지 "지금 넣으면 끊을 수 있다" 를 뜻했다. 이제 같은 값이
          **"지금 대답할 수 있다"** 도 뜻한다. 상대에게 `startup` 이 떠 있는 동안이
          곧 나에게 구간이 열린 동안이며, 둘은 같은 세계 값에서 나온다.

          화면이 그것을 스스로 잇지 않아도 된다 — 가부는 아래 respond 가 실어 온다.
          다만 **왜 지금 누를 수 있는지**를 사람이 배우는 자리는 이 표시다.

  deposit: { reused: true }

# ─────────────────────────────────────────────────────────────────
# interactions — 요청의 자리 하나
# ─────────────────────────────────────────────────────────────────
interactions:
  respond:
    added: true
    id: respond
    role: respond
    request:
      fields: []
      meaning: >
        **아무것도 싣지 않는다.** 어느 대답인지는 내 몸의 상태가 답하고
        (attributes.response), 어느 타격에 가는지는 세계가 정한다
        (RULE-RESPOND-001 — 가장 먼저 닿을 것 하나).

        어느 타격에 대답할지를 요청에 실을 수 있게 하는 순간 이 계약은 대상 고르기가
        되고, 자리 하나 · 입력 하나라는 뜻이 무너진다
        (DC-COMBAT-ONE-RESPONSE-INPUT). 그 문을 **형(type) 수준에서** 닫는다.

        C-COMBAT-001 의 setAllocation 이 몫을 싣지 않은 것과 같은 판단이다.
    available:
      source: RULE-RESPOND-001 의 Precondition 평가
      meaning: >
        **판정은 세계에 한 곳뿐이다** — 규칙이 실제로 거절할 때 쓰는 그 평가를 그대로
        내보낸다. 화면이 기력과 값을 견주거나 상대의 선딜을 세어 만들지 않는다.
    unavailableReason:
      values: [downed, no-incoming-blow, already-answered, insufficient-cp]
      meaning: >
        **하나만 나간다** (DC-COMBAT-UNAVAILABLE-HAS-A-REASON).
        넷의 뜻이 서로 다르고 사람이 할 일도 다르다 —
        `no-incoming-blow` 는 기다리라는 뜻이고,
        `already-answered` 는 이미 했으니 다음 것을 기다리라는 뜻이며,
        `insufficient-cp` 는 채우라는 뜻이다. 하나로 뭉치면 이 셋이 구별되지 않는다.
    cpCost:
      source: RESPONSE_CP_COST
      meaning: >
        **정액이며 미리 알 수 있다.** 막기의 대가가 맞은 뒤에 정해지는 것과 갈리는
        자리이고, 그래서 사람이 누르기 전에 셈할 수 있다.
        화면이 이 값을 자기 표에 적어 두지 않는다 — 세계가 싣는다.
    incoming:
      source: RULE-INCOMING-SWINGS-001 이 낸 수
      meaning: >
        지금 나에게 열린 구간의 수. 0 이면 대답할 것이 없다.

        **가부와 따로 싣는 이유가 있다** — `available: false` 하나로는 "아직 아무것도
        안 온다" 와 "왔는데 못 한다" 가 구별되지 않는다. 사유가 그 둘을 가르지만,
        수까지 있어야 **둘이 동시에 다가온다**는 것이 화면에 설 수 있다.
        어느 타격에 갈지는 싣지 않는다 — 세계가 정하고 사람은 누를 뿐이다.

  attack: { reused: true }
  skillHeavy: { reused: true }
  skillAura: { reused: true }
  guardBegin:
    reused: true
    meaning: >
      **한 글자도 바뀌지 않는다.** 막기와 대답은 같은 타격에 함께 걸릴 수 있으나
      서로의 가부에 관여하지 않는다 — 막는 중에도 대답할 수 있고 그 반대도 같다.
  guardRelease: { reused: true }
  setAllocation: { reused: true }
  observe: { reused: true }
  forgetAcquaintance: { reused: true }
  selectTarget: { reused: true }
  clearTarget: { reused: true }
  move: { reused: true }
  moveMode: { reused: true }
  mine: { reused: true }
  useItem: { reused: true }
  discardItem: { reused: true }
  equipItem: { reused: true }
  unequipItem: { reused: true }
  setAttribute: { reused: true }

# ─────────────────────────────────────────────────────────────────
# strikes — 경위에 대답이 실린다
# ─────────────────────────────────────────────────────────────────
strikes:
  reused: true
  breakdown:
    response:
      added: true
      optional: true
      source: RULE-RESPONSE-DEFLECT-001 의 ResponseOutcome
      fields:
        answered: { source: 이 타격이 대답을 받았는가 (언제나 true — 아래 주) }
        response: { source: 그때 자리에 있던 대답의 이름 (의미 코드) }
        prevented: { source: 대답이 덜어낸 값 = 대답 전 - 대답 후 }
      meaning: >
        **대답받지 않은 타격에는 실리지 않는다.** 막기(guard)와 같은 태도이고,
        치명(critical)이 언제나 실리는 것과는 다른 판단이다.

        가르는 기준은 "그 사실이 사람이 할 일을 바꾸는가" 다. 터지지 않은 치명은
        가능성 0 인 몸과 이번에 운이 없던 몸을 갈라야 하므로 실린다 (C015).
        대답하지 않은 타격에는 가를 것이 없다 — 안 눌렀거나 못 눌렀고, 못 눌렀다면
        그 사유는 이미 respond.unavailableReason 이 그때 실어 보냈다.

        **그리고 이 빈자리가 곧 이 Cycle 의 약속이다** — 대답하지 않은 타격의 경위는
        C-COMBAT-001 까지와 필드 하나까지 같다 (delta.note).

        `prevented` 를 View 가 빼서 만들지 않는다. 화면이 대답 전 값을 되짚어 계산하는
        순간 세계와 화면에 두 개의 진실이 생긴다 (DC-WORLD-OWNS-THE-SURFACE-LIST).

    guard:
      reused: true
      meaning: >
        **한 글자도 바뀌지 않는다.** `prevented` 가 재는 것은 여전히 막기가 덜어낸
        몫이고, 대답은 그 뒤에 따로 잰다. 둘을 한 값에 합치지 않는다 —
        합치면 "무엇이 이 한 방을 줄였는가" 를 사람이 가를 수 없다.

# ─────────────────────────────────────────────────────────────────
# hud
# ─────────────────────────────────────────────────────────────────
hud:
  added:
    - id: self.response
      kind: label
      source: 관찰자 몸의 Actor.Response
      meaning: >
        지금 내 자리에 무엇이 있는가 — 의미 코드. 문구 변환은 View 책임.
        가부와 사유와 값은 interactions.respond 가 지닌다 — 여기 복제하지 않는다.
    - id: self.response.incoming
      kind: counter
      source: interactions.respond.incoming
      meaning: >
        지금 나에게 열린 구간의 수. **0 도 실린다** — 0 이라는 사실이 곧 "지금은
        대답할 때가 아니다" 라는 관찰이다.
  reused:
    - self.allocation 과 그 세 몫
    - self.hp / self.cp / 그 밖의 기존 줄 전부

# ─────────────────────────────────────────────────────────────────
# 투영하지 않은 Observable 과 그 사유 (guides/gameview-spec.md DONE WHEN)
# ─────────────────────────────────────────────────────────────────
not_projected:
  - what: IncomingSwing 의 attackerId · skill · timeToContact
    why: >
      **수만 싣고 내용은 싣지 않는다.** 어느 몸의 무슨 기술이 몇 초 뒤에 닿는지를
      실으면 화면이 그것으로 대상을 고르거나 시점을 재려 하게 되고, 그 순간 이 층은
      "자리 하나 · 입력 하나" 를 넘어 대상 고르기와 정밀 판정이 된다
      (01 EXCLUDED 둘 · DC-COMBAT-ONE-RESPONSE-INPUT).

      사람이 언제 누를지는 이미 화면에 있다 — 상대 이름 앞의 선딜 표시(C019)다.
      세계가 다시 실어 줄 것이 아니라 그 표시를 읽는 것이 이 층의 플레이다.

      정밀 구간이 서는 Cycle(FR-WHEN-YOU-ANSWER-DECIDES)이 timeToContact 를
      요구하게 되면 그때 이 자리가 열린다.

  - what: 남의 몸의 respond 가부 · 사유 · 열린 구간 수
    why: >
      내 몸의 것만 실린다 (INTENT-PER-OBSERVER-PROJECTION-001).
      남이 지금 대답할 수 있는지는 세계에 그 관찰이 없다.
      남이 무엇으로 대답하는 몸인지는 attributes.response 가 이미 싣고 있다.

  - what: CurrentAction.AnsweredActorIds 자체
    why: >
      세계의 자국이지 관찰이 아니다. 그것이 만든 결과는
      strikes[].breakdown.response 로 이미 나가고, 원본을 실으면 화면이
      "저 휘두름은 이미 대답받았다" 를 스스로 셈하게 된다 —
      그 판정은 respond.available · unavailableReason 이 소유한다.
