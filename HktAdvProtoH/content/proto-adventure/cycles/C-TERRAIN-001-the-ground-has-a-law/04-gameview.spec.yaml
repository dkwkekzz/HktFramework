# CYCLE C-TERRAIN-001 — GameView Specification
#
# 이 세계의 관찰은 지금까지 **몸과 몸 사이**의 것이었다. 누가 어디 있고, 누가 무엇을
# 하는 중이고, 누가 누구를 사냥감으로 보는가. 이 계약이 처음으로 **무대 자체**를 싣는다.
#
# 더하는 것은 셋뿐이다.
#
#   ① ground.zones      땅 위의 범위들 — 어디까지가 그 자리인가
#   ② ground.self       지금 나에게 무엇이 일어나는 중인가 + 그 사유
#   ③ hud self.warmth   땅이 거두어 가는 것이 얼마나 남았는가
#
# 이 계약을 받은 View 는 **한 번도 안인지 밖인지를 재지 않는다.** 범위는 그리기 위한
# 것이지 판정하기 위한 것이 아니며, 지금 걸려 있는가는 ground.self.state 가 이미 답한다
# (DC-WORLD-OWNS-THE-SURFACE-LIST).
id: VIEW-THE-GROUND-HAS-A-LAW-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character                      # 위치·역할·이름·종류·모션·body·swing·상태 그대로
    - entities.deposit
    - entityHud
    - entities.character.vitality
    - entities.character.attributes.*
    - inventory / inventoryRoom / equipment
    - interactions.*                          # 새 interaction 이 없다 (아래 이유)
    - strikeEvents / unharmedContacts / cancelEvents
    - currentTarget / commandCatalog
    - debugObserve / debugAuthority
    - observer / session / delivery / identity / telemetry
    - hud.*                                   # 기존 줄은 하나도 바뀌지 않는다
  added:
    - ground.zones                            # 무대의 자리들
    - ground.self                             # 지금 나에게 걸린 법칙과 그 상태
    - hud[self.warmth] / hud[self.warmthMax]  # 지닌 열
  changed: []
  removed: []

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# ground.zones — 무대의 자리들
#
#   **관찰자에 딸린 값이 아니다.** 세계에 있는 것이며 누가 보든 같다. 그래서
#   entities 아래가 아니라 무대와 나란한 자리에 둔다 — 몸이 아닌 것이 이 계약에
#   실리는 첫 항목이다.
#
#   **감추지 않는다.** DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE 이 감추라는 것은 법칙이지
#   지금 보이는 풍경이 아니다. "관찰할수록 드러난다" 는 반복 관찰의 층은 이 Cycle 이
#   열지 않으므로, 자리는 처음부터 땅 위에 있다.
#
#   비어 있을 수 있다. 자리가 하나도 없는 세계는 이 Cycle 이전의 세계이며,
#   그때 화면은 아무것도 그리지 않고 게임은 그대로 돈다.
# ─────────────────────────────────────────────────────────────────
ground:
  zones:
    cardinality: many
    source: World.GroundZones
    fields:
      id:
        source: GroundZone.Id
        meaning: 이 자리의 이름. 같은 자리를 프레임 사이에 이어 보기 위한 것
      law:
        source: GroundZone.Law
        meaning: >
          어느 법칙의 자리인가 — 의미 코드다. 화면은 이 코드로 색과 문구를 고르며,
          **코드가 하나 늘어나도 계약은 열리지 않는다.** 세계에 법칙이 늘면 화면의
          표에 줄이 늘 뿐이다
        values: [heat-binding]
      role:
        source: GroundZone.Role
        meaning: >
          그 법칙이 **작용하는** 범위인가 **멎는** 범위인가.
          둘은 같은 법칙에 속하며, 그래서 화면은 예외 자리를 그 법칙의 것으로
          함께 묶어 보일 수 있다
        values:
          law: 그 법칙이 작용한다
          respite: 그 법칙이 멎는다
      center:
        source: GroundZone.Center
        meaning: 범위의 중심 (x, z)
      radius:
        source: GroundZone.Radius
        meaning: 범위의 반경. 범위는 원이다 — 세계에 다른 모양이 없다
    meaning: >
      자리는 겹칠 수 있다. 예외 자리가 법칙의 자리 **안**에 있다는 것이 곧 겹침이며,
      화면은 겹침을 해소하지 않고 있는 그대로 그린다.

  # ───────────────────────────────────────────────────────────────
  # ground.self — 지금 나에게 무엇이 일어나는 중인가
  #
  #   **세계가 판정한 결과다.** 화면이 zones 와 내 위치로 다시 계산하지 않는다 —
  #   계산하는 순간 판정이 세계와 화면 두 곳에 생기고, 둘이 어긋나는 자리가 열린다.
  #
  #   값이 줄어드는 것만 실리면 그것은 버그와 구분되지 않는다. 어느 법칙이 지금
  #   나에게 걸려 있는가가 **함께** 온다.
  # ───────────────────────────────────────────────────────────────
  self:
    cardinality: one
    source: 관찰자의 몸
    fields:
      law:
        source: Self.GroundLaw
        meaning: 지금 이 몸에 걸린 법칙. 어느 자리에도 들지 않았으면 없음
        nullable: true
        values: [heat-binding]
      state:
        source: Self.GroundState
        meaning: >
          **`sheltered` 가 `none` 과 구분되는 것이 이 항목의 요점이다.** 아무 일도
          일어나지 않는 것과 법칙이 멎어서 아무 일도 일어나지 않는 것은 다르며,
          뒤엣것이 읽히지 않으면 예외 자리는 그냥 아무것도 없는 땅이 된다
        values:
          taking: 지금 거두어 가는 중이다
          sheltered: 법칙의 자리 안이지만 멎어 있다
          none: 어떤 법칙도 걸려 있지 않다
      takes:
        source: Self.GroundTakes
        meaning: >
          그 법칙이 거두어 가는 것이 무엇인가 — 의미 코드다. 화면은 이것으로
          어느 값이 줄고 있는지를 가리킬 수 있다. 없으면(state = none) 없음
        nullable: true
        values: [warmth]

# ─────────────────────────────────────────────────────────────────
# hud — 몸이 지닌 열
#
#   두 값이 **함께** 온다. 남은 양만으로는 얼마나 남았는지 읽히지 않는다.
#   self.hp / self.hpMax 가 나란히 실리는 것과 같은 자리다.
#
#   되채워지지 않는다 — 이 Cycle 에는 올리는 규칙이 없다. 그것을 화면이 알 필요는
#   없다. 화면은 받은 값을 옮긴다.
# ─────────────────────────────────────────────────────────────────
hud:
  self.warmth:
    kind: counter
    source: Self.Warmth
    meaning: 지금 지니고 있는 열
  self.warmthMax:
    kind: counter
    source: Self.WarmthMax
    meaning: 이 몸이 지닐 수 있는 열의 최대

# ─────────────────────────────────────────────────────────────────
# interactions — 없다
#
#   겪는 것도 멎는 것도 아무 요청을 요구하지 않는다. 플레이어가 하는 일은 걸어
#   들어가고 걸어 나오는 것뿐이며 그것은 이미 있는 행동이다
#   (INTENT-STANDING-IS-THE-WHOLE-INPUT-001).
#
#   그래서 이 Cycle 은 commandCatalog 에도 한 줄 더하지 않는다.
# ─────────────────────────────────────────────────────────────────
interactions:
  change: NONE

# ─────────────────────────────────────────────────────────────────
# designer — 같은 계약으로 본다. 별도의 World 접근 경로를 만들지 않는다
# ─────────────────────────────────────────────────────────────────
designer:
  goal: 어디에 서 있는가가 처음으로 결과를 바꾼다
  possibility: 들어가서 겪으며 알아낸다 (MP-LEARN-TO-HANDLE-THE-LAYER)
  availability:
    - ground.self.state              # 지금 걸려 있는가 · 멎어 있는가
  preconditions:
    - ground.self.law                # 어느 자리 안인가
    - ground.zones[].role            # 그 자리가 작용하는 자리인가 멎는 자리인가
  before_after:
    - hud[self.warmth]               # 머무는 동안 줄어든다 · 예외 자리에서 멎는다
    - hud[self.hp]                   # 열이 다한 뒤에 줄어든다
    - hud[self.downed]               # 그 끝은 이미 있는 것이다
  reason:
    - taking
    - sheltered
    - none

# ─────────────────────────────────────────────────────────────────
# VIEW CLOSURE — 이 계약만으로 Cycle Goal 을 플레이할 수 있는가
# ─────────────────────────────────────────────────────────────────
closure:
  - 땅에 자리가 있음을 본다                  ground.zones 가 범위를 싣는다
  - 어디까지가 그 자리인지 안다              center · radius
  - 그 안의 예외 자리를 구분한다             role = respite
  - 들어가면 무언가 일어남을 안다            ground.self.state = taking
  - 무엇이 일어나는지 안다                  ground.self.law · takes
  - 무엇이 줄어드는지 본다                  hud[self.warmth] 가 내려간다
  - 얼마나 남았는지 안다                    self.warmth / self.warmthMax
  - 예외 자리에서 멎는 것을 본다             state = sheltered · warmth 가 멈춘다
  - 멎은 것과 아무 일 없는 것을 구분한다      sheltered ≠ none
  - 나오면 다시 겪는 것을 본다               state 가 taking 으로 돌아온다
  - 다 하면 생명이 줄어드는 것을 본다         warmth = 0 뒤 hud[self.hp] 가 내려간다
  - 그 끝이 이미 있는 것임을 본다            hud[self.downed]

# ─────────────────────────────────────────────────────────────────
# NOT IN THIS CONTRACT — 싣지 않는 것과 그 이유
# ─────────────────────────────────────────────────────────────────
excluded:
  거두어 가는 속도(rate · lifeRate):
    실으면 화면이 "언제 다할지" 를 계산할 수 있게 된다. 그것은 예고이며
    FR-THE-LAND-SHOWS-BEFORE-IT-TAKES 의 몫이다. 필요한 것은 지금 줄고 있다는 사실이다
  앞으로 일어날 일의 예고:
    같은 이유. 이 Cycle 은 겪는 것까지만 싣는다
    (DC-WORLD-TERRAIN-LAW-IS-OBSERVABLE 은 UNRESOLVED 로 넘어간다)
  남의 열 · 남에게 걸린 법칙:
    내 몸의 것만 실린다 (INTENT-PER-OBSERVER-PROJECTION-001). 남이 얼어 가는 것이
    보여야 할 이유가 이 Cycle 에 없다
  자리 안까지의 거리 · 가장 가까운 예외 자리:
    실으면 화면이 길을 안내하게 된다. 안전한 길을 잇는 것은 MC-FIND-SAFE-ROUTE 이며
    아직 Target 이 아니다
  법칙의 이름 문구:
    의미 코드만 싣는다. 무엇이라 부를지는 화면의 결정이다
    (DC-WORLD-OWNS-THE-SURFACE-LIST 의 경계 — 목록은 세계, 표현은 화면)
  자리의 모양이 원이 아닌 것:
    세계에 없다. 생기면 그때 계약이 는다

# ─────────────────────────────────────────────────────────────────
# ENGINE 에 확정해 주는 것 — SceneGroundZone
#
#   design/Design-Terrain-Visualization.md 가 프리미티브의 최종 모양을 04 에
#   맡겼다. 이 계약이 확정하는 것은 셋이다.
#
#   ① shape 는 **원 하나면 된다.** rect 도 폴리곤도 이 계약에 실리지 않는다 —
#      세계에 없기 때문이다. 초안의 `rect` 갈래는 지금 넣지 않는다
#   ② 하나의 자리는 **채움과 테두리와 이름**을 지닐 수 있으면 족하다.
#      법칙의 자리와 예외 자리를 색으로 가르는 것이 화면의 결정이며, 프리미티브는
#      둘을 구분하지 않는다 (의미 없음 — 설계 반전 ⑤)
#   ③ `intensity` 는 **지금 넣어 둔다.** 이 Cycle 은 쓰지 않지만(맥동할 이유가
#      아직 없다) 다음 Cycle 의 예고가 그 자리를 쓴다. 넣어 두면 그때 엔진이
#      열리지 않는다
#
#   fallback 은 그대로다 — zones 가 없거나 비면 아무것도 그리지 않고 게임은 돈다.
#   그래서 ENGINE 산출이 늦어도 Stage 7 은 멈추지 않는다.
# ─────────────────────────────────────────────────────────────────
engine_contract:
  primitive: SceneGroundZone
  shape: circle only
  needs: [id, center, radius, fill, edge, label, intensity]
  drops: [rect, polygon]
