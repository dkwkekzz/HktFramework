# CYCLE C017 — GameView Specification
#
# 이 계약이 지금까지 지녀 온 모양 하나가 이 Cycle 에서 바뀐다.
#
#   지금까지  "무엇에게 무엇을 할 수 있는가" 가 **존재마다** 왔다 —
#             늑대에 붙은 살펴봄, 광맥에 붙은 채집. 그래서 화면은 대상을 짚는 순간
#             무슨 행동인지까지 함께 알았고, 고른다는 개념이 필요 없었다.
#   이 Cycle  존재마다 오는 것은 **고를 수 있는가** 하나가 되고,
#             무엇을 할 수 있는가는 고른 상대 하나에 대해 온다.
#
# 항목 수는 늘지 않는다. 자리가 옮겨진다. 그리고 그 옮김이 이 Cycle 의 전부다 —
# 새 값도 새 계산도 새 자원도 이 계약에 들어오지 않는다.
#
# View 가 이 계약에서 읽어야 하는 것은 셋이다.
#   ① 지금 무엇을 고르고 있는가 (없을 수 있다)
#   ② 각 존재를 고를 수 있는가 · 안 되면 왜인가
#   ③ 고른 상대에게 지금 무엇이 되고 · 안 되면 왜인가
# ①의 값(이름·생명·지금 행동·가려짐)은 **여기서 다시 오지 않는다.** 이미 entities 에
# 그 존재의 자리로 와 있고, Id 로 짚어 읽는다. 두 곳에서 오면 두 출처가 생긴다.
id: VIEW-TARGET-GATHERS-THE-ACTIONS-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character                      # 위치·역할·이름·종류·모션·body·swing 그대로
    - entities.deposit                        # 자리·남은 양·상태 그대로
    - entityHud                               # 몸 위의 이름·생명 그대로
    - entities.character.vitality
    - entities.character.attributes.*         # 통찰·가려짐·겨루는 힘 전부 그대로
    - interactions.move / moveMode / setAttribute / forgetAcquaintance
    - interactions.attack / skillHeavy / skillAura      # 관문도 사유도 그대로
    - interactions.*.profile
    - interactions.guardBegin / guardRelease
    - commandCatalog
    - hud.*                                   # 한 줄도 늘지 않는다
    - strikeEvents.*
    - debugObserve / debugAuthority
    - observer / session / delivery / identity / telemetry
  added:
    - currentTarget                           # 지금 무엇을 고르고 있는가 (Id 하나 · 없을 수 있다)
    - interactions.selectTarget               # 존재마다 — 고를 수 있는가
    - interactions.clearTarget                # 하나 — 언제나 가능하다
  changed:
    - interactions.observe                    # cardinality many → one · 대상이 사라진다
    - interactions.mine                       # cardinality many → one · 대상이 사라진다

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# currentTarget — 이 Cycle 이 계약에 더하는 유일한 값
#
#   Id 하나뿐이다. 관찰자마다 다르고, 늘 실린다 — 고른 것이 없다는 것도 관찰이다.
#   "지금은 아무것도 안 골랐다" 와 "세계가 안 알려준다" 를 가르는 것이
#   C011 · C014 가 세운 태도이며 여기서도 같다.
# ─────────────────────────────────────────────────────────────────
currentTarget:
  entityId:
    source: TargetSelection.TargetEntityId (this observer)
    presence: optional          # 없으면 아무것도 고르지 않은 것이다
  meaning:
    - 이 Id 는 entities 에 실린 존재 하나를 가리킨다 — character 일 수도 deposit 일 수도 있다.
      View 는 그 Id 로 entities 에서 지금 값을 읽는다
    - 고른 순간의 사본이 아니다. 대상의 생명이 줄면 다음 관찰에서 줄어든 값이 읽힌다
    - 이 자리에 이름·생명·행동·가려짐을 **다시 싣지 않는다.** 두 곳에서 오면
      어느 쪽이 세계인지 알 수 없게 되고, 사본은 반드시 낡는다 (03 NOTE ②)
    - 다른 관찰자가 무엇을 고르고 있는지는 오지 않는다. 누가 나를 고르고 있는지도
      오지 않는다 — 세계에 그런 상태가 없다 (03 OBSERVABLE — 실리지 않는 것)
    - View 는 이 값이 비어 있는 화면을 그릴 수 있어야 한다. 그것이 시작 상태다

# ─────────────────────────────────────────────────────────────────
# entities — 한 자리도 바뀌지 않는다
#
#   고른 존재에 표시가 붙지 않는다. "골라졌다" 는 세계가 대상에 대해 지닌 사실이
#   아니라 관찰자에 대해 지닌 사실이므로, entities 에는 그 흔적이 없다.
#   어느 것이 고른 것인지는 currentTarget.entityId 와 대조해서 안다 —
#   그것을 어떻게 보이게 할지(외곽선·발밑 링·아무것도 안 함)는 View 의 결정이다.
# ─────────────────────────────────────────────────────────────────
entities:
  character:
    change: NONE
  deposit:
    change: NONE

# ─────────────────────────────────────────────────────────────────
# interactions — 자리가 옮겨진다
#
#   지금까지 이 목록은 두 종류가 섞여 있었다: 대상마다 하나씩 오는 것(observe · mine)과
#   주체 하나에 대해 오는 것(attack · guard · move · …). 이 Cycle 뒤에도 두 종류지만
#   대상마다 오는 것은 **selectTarget 하나**가 된다.
#
#   그래서 화면이 존재를 짚었을 때 무슨 요청이 되는가의 답이 하나로 정해진다 —
#   고르기다. 그 뒤에 무엇을 할지는 따로 고른다 (01 PREREQUISITE ①).
# ─────────────────────────────────────────────────────────────────
interactions:
  selectTarget:                               # C017 ADDED
    role: select-target
    cardinality: many                         # entities 에 실리는 모든 존재에 하나씩
    targetEntityId: { source: Entity.Id }     # character 든 deposit 이든
    available: { source: TargetSelect.Availability }
    reason: { source: TargetSelect.FailureReason }
    values:
      - target-is-self                        # 자기 몸에도 실린다 — 왜 못 고르는지 말한다
      - no-such-target                        # 관찰에 실리지 않는 Id 를 골랐다
      - unknown-observer
    meaning:
      - 자기 몸에도 **반드시** 실린다. available 이 거짓이고 사유가 target-is-self 다 —
        빠뜨리면 "자기는 못 고른다" 를 View 가 스스로 알아야 한다
      - 광맥에도 실리고 available 이 참이다. 고를 수 있는 것과 그에게 무엇을 할 수 있는
        것은 다르다 — 무엇이 되는지는 아래 observe · mine 이 말한다
      - View 는 무엇을 고를 수 있는지를 자기 코드에 적지 않는다
        (DC-WORLD-OWNS-THE-SURFACE-LIST)
      - 이미 고른 것을 다시 골라도 된다 — available 이 그대로 참이다.
        토글 해제가 아니다 (TG §3.1)

  clearTarget:                                # C017 ADDED
    role: clear-target
    cardinality: one
    available: { source: TargetClear.Availability }   # 언제나 참이다
    meaning:
      - 조건이 없다. guardRelease 와 같은 모양이다 — 놓는 데에는 이유를 묻지 않는다
      - 고른 것이 없을 때도 실리고 가용하다. 그래야 한 번도 고른 적 없는 사람이
        푸는 길이 있다는 것을 안다

  observe:                                    # C017 CHANGED — many → one
    role: observe-character
    cardinality: one                          # CHANGED — 존재마다에서 하나로
    targetEntityId: REMOVED                   # CHANGED — 대상은 currentTarget 이 정한다
    available: { source: ObserveBegin.Availability }
    reason: { source: ObserveBegin.FailureReason }
    values:
      - no-target-selected                    # ADDED — 아무것도 고르지 않았다
      - target-kind-mismatch                  # ADDED — 고른 것이 존재가 아니다 (광맥이다)
      - out-of-range                          # REUSED
      - already-known                         # REUSED — 더 열 자리가 없다 (C016)
      - action-busy                           # REUSED
      - no-body
    meaning:
      - **늘 실린다.** 아무것도 고르지 않았을 때도 목록에서 사라지지 않고
        available 이 거짓 · 사유가 no-target-selected 다. 걸 수 있는 일은 언제나
        먼저 밝혀져 있어야 한다 (INTENT-COMMAND-CATALOG-001)
      - 고른 상대가 멀면 out-of-range 로, 다가가면 참으로 바뀐다. 그동안 고른 것은
        풀리지 않는다 — **이 갱신이 이 Cycle 의 플레이**다 (MC-WATCH-TARGET)
      - target-is-self 가 사라진다. 자기 몸을 고를 수 없으므로 이 사유가 나올 자리가
        없다 — 그 뜻은 selectTarget 으로 옮겨갔다
      - 살펴봄에 드는 시간도 거리도 중단 규칙도 바뀌지 않는다 (03 CHANGED)

  mine:                                       # C017 CHANGED — many → one
    role: mine-deposit
    cardinality: one                          # CHANGED — 광맥마다에서 하나로
    targetEntityId: REMOVED                   # CHANGED — 대상은 currentTarget 이 정한다
    available: { source: Mine.Availability }
    reason: { source: Mine.FailureReason }
    values:
      - no-target-selected                    # ADDED
      - target-kind-mismatch                  # ADDED — 고른 것이 광맥이 아니다
      - no-mining-tool                        # REUSED
      - out-of-range                          # REUSED
      - deposit-depleted                      # REUSED
      - action-busy                           # REUSED
    meaning:
      - observe 와 같다 — 늘 실리고, 고른 것에 대해 판정되며, 사유가 갱신된다
      - unknown-deposit 이 사라진다. 고르기 관문이 앞서 막으므로 없는 광맥이
        채집 요청에 실려 오는 일이 없다
      - 도구·거리·남은 양의 판정은 바뀌지 않는다

  # move · attack · skillHeavy · skillAura · guardBegin · guardRelease · moveMode ·
  # setAttribute · forgetAcquaintance 는 그대로다.
  # 공격 셋은 특히 그대로다 — 고른 것이 있든 없든 휘두름은 나가고 맞는 것은 닿은 몸이다.
  # 지목이 공격의 조건이 되면 이 Cycle 은 대상 지정 공격을 몰래 들여온 것이 된다
  # (01 EXCLUDED · DC-TARGET-IS-INTENT-NOT-AIM)

# ─────────────────────────────────────────────────────────────────
# hud — 한 줄도 늘지 않는다
# ─────────────────────────────────────────────────────────────────
hud:
  change: NONE
  meaning:
    - 고른 것은 hud 가 아니라 currentTarget 으로 온다. 값이 아니라 관계이기 때문이다
    - 고른 상대를 어디에 어떤 모양으로 띄울지는 View 의 결정이다 (Stage 7)

strikeEvents:
  change: NONE
  meaning:
    - 타격 경위 그대로 — 고른 상대의 것만 오지 않는다. 세계의 타격은 다 보인다

commandCatalog:
  change: NONE
  meaning:
    - 세계 밖에서 거는 명령의 목록은 그대로다. 고르기·풀기는 세계 안의 요청이므로
      interactions 로 오고 이 목록에 들어가지 않는다 (setAttribute 와 다른 자리다)

# ─────────────────────────────────────────────────────────────────
# VIEW ASSEMBLY NOTE — 이 계약만으로 대상 자리를 조립하는 법
#
#   이 Cycle 의 화면 값어치는 "고른 상대의 지금이 한자리에서 읽힌다" 이고,
#   그 한자리는 세계가 아니라 View 가 만든다. 세계가 보장하는 것은
#   **짐작 없이 조립할 수 있다**는 것이다. 조립은 이렇게 닫힌다.
#
#     고른 것이 무엇인가        currentTarget.entityId
#     그 존재의 지금 값          entities[그 Id]  — 이름 · 생명 · 지금 행동 · 종류 ·
#                              가려짐(concealed)과 열린 자리들
#     그에게 지금 무엇이 되는가   interactions.observe / mine 의 available 과 reason
#     왜 안 되는가              같은 자리의 reason 코드 (문구 변환은 View 책임)
#
#   빠진 것이 없다. View 가 거리를 재거나 종류를 보고 "광맥은 못 살펴본다" 를
#   스스로 판정할 필요가 없다 — 그 판정은 전부 사유 코드로 온다.
# ─────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────
# ENGINE BOUNDARY NOTE — 이 계약이 기반에 요구하는 것
#
#   이 계약은 팩의 것이고 기반은 게임 명사를 모른다. 그럼에도 두 자리가 기반에
#   열려 있어야 이 계약이 화면이 된다 (01 PREREQUISITE).
#
#     ① 화면에서 존재를 짚었을 때 **무슨 요청이 되는가** 를 팩이 정할 수 있어야 한다.
#        지금은 기반이 "짚은 존재를 대상으로 하는 첫 interaction 을 즉시 실행" 으로
#        확정한다. 이 계약에서 그 첫 interaction 은 selectTarget 이므로 결과적으로는
#        맞게 동작하지만, **맞게 동작하는 것과 팩이 정하는 것은 다르다** —
#        지형을 짚었을 때 이동인가 해제인가 같은 결정이 여전히 기반에 있다
#     ② 고른 존재를 강조해 그리고 그 자리를 띄울 **게임 명사 없는 지시**가 있어야 한다.
#        "적대는 빨강" 도 "생명 막대" 도 기반에 올리지 않는다 — 무엇을 강조하고
#        무엇을 띄울지는 이 팩의 View 가 정해 범용 지시로 내보낸다
#
#   이 계약은 그 두 자리가 어떤 모양이어야 하는지까지만 말한다. 만드는 것은
#   기반 트랙의 일이다 (승격 규칙 4).
# ─────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────
# NOT IN THIS CONTRACT — 일부러 오지 않는 것들
#
#   적대 · 중립 · 우호            세계에 그 개념이 0건이다 (다음 후보)
#   Tab 순환의 후보 목록          후보 집합이 관계를 요구한다 (TG §3.1)
#   Primary Interaction 우선순위  무엇을 먼저 할지를 고르는 규칙은 이 Cycle 밖이다
#                               (TG §3.5) — 목록과 사유를 모으는 데서 닫는다
#   고른 대상까지의 거리 값        View 는 두 자리를 이미 안다 (내 몸과 그 존재).
#                               세계가 사유로 out-of-range 를 말하므로 숫자는 필요 없다
#   내가 골라졌다는 신호           세계에 그 상태가 없다
#   지목이 만든 어떤 값            명중·피해·위협·앎 — 하나도 오지 않는다.
#                               오면 그것은 이 Cycle 의 실패다
# ─────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────
# DESIGNER OBSERVER
#
#   같은 계약을 쓴다. 별도의 World 접근 경로를 만들지 않는다.
#     goal          고른 상대 하나로 행동과 관찰이 모인다
#     possibility   존재를 고른다 · 고른 것으로 살펴본다 · 고른 것을 캔다 · 푼다
#     availability  interactions.selectTarget / clearTarget / observe / mine
#     precondition  03-world-semantic.md 의 각 Rule Preconditions
#     before/after  TargetSelection 이 없음 → 있음 → 다른 것 → 없음
#     reason        위 각 interaction 의 사유 코드
# ─────────────────────────────────────────────────────────────────
