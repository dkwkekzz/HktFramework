# CYCLE C015 — GameView Specification
#
# 이 Cycle 은 계약에 새 화면도 새 행동도 새 관문도 더하지 않는다.
# 더하는 것은 **한 숫자가 흔들렸다는 사실**과 그것을 설명하는 값들이다.
#
# 그러므로 이 계약의 중심은 하나다 — **View 는 숫자가 튄 것을 보고 짐작하지 않는다.**
# C013 이 "걷히기 전과 걷힌 뒤" 를 나란히 실어 관통을 역산하지 않게 했듯이,
# 이 Cycle 은 "커지기 전과 커진 뒤" 를 나란히 싣는다.
# 그리고 반대 방향의 금지가 하나 더 있다 — 세계가 지닌 흔들림 자체는 실리지 않는다.
# 그것이 실리면 다음 한 방이 터질지가 계산 가능해지고 이 층은 사라진다 (03 OBSERVABLE).
id: VIEW-CRITICAL-AMPLIFIES-THE-BLOW-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character                      # 위치·역할·이름·종류·모션·body·swing 그대로
    - entities.deposit
    - entityHud                               # 몸 위의 이름·생명 그대로
    - entities.character.vitality
    - entities.character.attributes.energy / moveMode / control
    - entities.character.attributes.tempoStats / modifiers
    - entities.character.attributes.guard
    - entities.character.attributes.acquainted / concealed / unacquaintedReason
    - entities.character.attributes.versusObserver     # C013 그대로 — Critical 은 여기 없다
    - entities.character.attributes.defenseShape
    - interactions.move / mine / moveMode / setAttribute
    - interactions.attack / skillHeavy / skillAura     # 관문도 사유도 그대로
    - interactions.guardBegin / guardRelease
    - interactions.observe / forgetAcquaintance        # 살펴봄 관문 그대로
    - commandCatalog                                   # 구조 무변경 (COMMAND NOTE)
    - hud.inventory / tool / worldTime / observers
    - hud.playerAction
    - debugObserve / debugAuthority
    - observer / session / delivery / identity / telemetry
  added:
    - strikeEvents.breakdown.critical                  # 이 타격이 터졌는가와 그 경위
    - hud.self.combat.criticalChance                   # 내가 얼마나 터뜨리는 몸인가
    - hud.self.combat.criticalDamage
  changed:
    - entities.character.attributes.combatStats        # 두 성질이 더해진다 (관문은 그대로)
    - strikeEvents.breakdown.finalDamage               # 의미 확장 — 증폭이 포함된 값

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# entities.character — 겨루는 힘에 두 성질이 더해진다
#
#   새 관문이 생기지 않는다. C014 가 세운 그 하나의 관문이 덮는 값이 넓어질 뿐이다.
#   View 가 고칠 것은 없다 — concealed 목록도, 그 목록을 읽는 방식도 그대로다.
# ─────────────────────────────────────────────────────────────────
entities:
  character:
    cardinality: many
    source: World.Actors

    attributes:
      combatStats:
        presence: acquainted 가 참일 때만          # C014 그대로 — 관문 무변경
        physicalAttack: { source: Actor.PhysicalAttack }
        auraAttack: { source: Actor.AuraAttack }
        armor: { source: Actor.Armor }
        resistance: { source: Actor.Resistance }
        armorPenetration: { source: Actor.ArmorPenetration }
        resistancePenetration: { source: Actor.ResistancePenetration }
        armorMultiplier: { source: Actor.ArmorMultiplier }
        resistanceMultiplier: { source: Actor.ResistanceMultiplier }
        criticalChance: { source: Actor.CriticalChance }        # C015 ADDED
        criticalDamage: { source: Actor.CriticalDamage }        # C015 ADDED
        meaning:
          - criticalChance 는 0~1 사이의 값이다 — 이 존재의 타격이 크게 터질 가능성이다
          - criticalDamage 는 1 이상의 배율이다 — 터졌을 때 최종 피해에 걸린다.
            1 이면 터져도 커지지 않는다
          - 두 값 모두 **치는 쪽의 성질**이다. 저 존재가 나를 얼마나 크게 칠 수 있는지를
            말하며, 내가 저 존재를 칠 때와는 무관하다
          - 알기 전에는 다른 여섯 능력과 함께 통째로 비어 있다. 두 성질만 따로
            가려지거나 따로 열리지 않는다 — 관문은 하나이고 한 번에 열린다
          - 종류 이름으로 이 값을 짐작하지 않는다 (C012 부터의 금지 그대로).
            "저건 토끼 검사니까 잘 터질 것" 은 View 가 만들어 낼 수 있는 값이 아니다

      versusObserver:
        change: NONE
        meaning:
          - C013 그대로다. **Critical 항목이 여기 들어가지 않는다.**
            Critical 판정에는 맞는 자의 값이 하나도 들어가지 않으므로
            "나와 저 상대 사이의 값" 이라는 것이 존재하지 않는다 (03 OBSERVABLE)
          - 저 존재가 얼마나 터뜨리는지는 저 존재의 성질이고 combatStats 의 자리다

      defenseShape:
        change: NONE
        meaning:
          - C012 그대로. Critical 은 방어를 읽지 않으므로 이 판정을 흔들지 않는다

      acquainted / concealed / unacquaintedReason:
        change: NONE
        meaning:
          - C014 그대로다. 가려질 수 있는 항목의 이름은 여전히 셋이며
            criticalChance · criticalDamage 는 그중 combatStats 안에 들어 있다.
            **View 는 이 Cycle 때문에 한 줄도 고칠 필요가 없다** —
            세계가 가리는 값이 늘었는데 화면이 저절로 따라오는 것이
            DC-WORLD-OWNS-THE-SURFACE-LIST 가 약속한 것이다

# ─────────────────────────────────────────────────────────────────
# strikeEvents — 이 Cycle 의 중심
#
#   한 방을 보고 "이 숫자가 흔들린 것인가" 에 답할 수 있어야 한다.
#   그리고 흔들리지 않은 한 방에서도 그 답이 나와야 한다.
# ─────────────────────────────────────────────────────────────────
strikeEvents:
  breakdown:
    critical:                                   # C015 ADDED — 언제나 실린다
      occurred: { source: DamageBreakdown.Critical.Occurred }
      chance: { source: DamageBreakdown.Critical.Chance }
      multiplier: { source: DamageBreakdown.Critical.Multiplier }
      damageBeforeCritical: { source: DamageBreakdown.Critical.DamageBeforeCritical }
      meaning:
        - occurred 는 이 한 방이 크게 터졌는가다
        - chance 는 그때 실제로 쓰인 가능성이다 (0~1). 치는 자의 성질을 0~1 로 묶은 값이며
          **이 타격의 사실**이다 — 그 상대의 앞날을 알려주지 않는다
        - multiplier 는 치는 자의 증폭 성질이다. 터지지 않은 타격에서도 실린다
        - damageBeforeCritical 은 커지기 전의 최종 피해다.
          finalDamage 와 나란히 읽는다 — C013 이 defenseStat.value 와 effectiveDefense 를
          나란히 두게 한 것과 같은 읽기다
      presence: 언제나 — 터지지 않은 타격에도, chance 가 0 인 타격에도 실린다
      reading:
        - occurred 가 거짓이고 chance 가 0 보다 크다   → 이번엔 운이 없었다
        - occurred 가 거짓이고 chance 가 0 이다        → 터질 리 없는 몸이다
        - occurred 가 참이다                           → damageBeforeCritical × multiplier
                                                         가 finalDamage 다
        - damageBeforeCritical == finalDamage          → 이 숫자는 흔들리지 않았다.
                                                         C013 까지의 그 숫자 그대로다

    finalDamage:
      change: CHANGED
      meaning:
        - 뜻은 그대로다 — "막지 않았다면 들어왔을 값". 이제 그 값이 증폭을 포함한다
        - 그래서 막기가 마주하는 값도 이 값이다. 크게 터진 한 방은 막아도 더 아프고
          막는 데 더 든다 (guard.cpPaid · guard.prevented 가 그 크기를 따라간다)

    # damageType · offenseStat · baseDamage · attackContribution · rawDamage ·
    # defenseStat · penetrationStat · effectiveDefense · defenseMultiplier ·
    # appliedDamage · guard 는 C010~C013 그대로. Critical 은 계산 안의 어떤 값도 건드리지 않는다.

  meaning:
    - 타격 경위는 살펴봄 관문 뒤가 아니다 (C014 그대로) —
      모르는 상대에게 크게 터진 것은 보인다.
      그 상대가 **얼마나 자주** 터뜨리는 몸인지는 여전히 살펴봐야 안다
      (combatStats.criticalChance 는 관문 안이다)
    - 이 한 타격의 chance 가 실리는 것과 그 상대의 criticalChance 를 아는 것은 다른 일이다.
      전자는 이미 일어난 한 방을 설명하는 값이고, 후자는 앞으로를 판단하는 값이다

# ─────────────────────────────────────────────────────────────────
# hud.self — 내 것은 하나도 가려지지 않는다
# ─────────────────────────────────────────────────────────────────
hud:
  self:
    combat:
      criticalChance: { source: Actor.CriticalChance }      # C015 ADDED
      criticalDamage: { source: Actor.CriticalDamage }      # C015 ADDED
      meaning:
        - 자기 두 성질은 언제나 실린다. 값을 바꾼 직후 그 변화가 즉시 읽혀야
          "빈도와 크기가 달라진다" 를 자기 눈으로 확인할 수 있다
        - 0 인 쪽도 싣는다. 없다는 것을 아는 것이 "나는 터뜨릴 수 없다" 를 아는 것이다
          (C013 이 관통 0 을 싣기로 한 판단 그대로)
      # physicalAttack · auraAttack · armor · resistance · armorPenetration ·
      # resistancePenetration · armorMultiplier · resistanceMultiplier · defenseShape 는
      # C010~C013 그대로.

  playerAction:
    change: NONE
    meaning:
      - Critical 은 새 행동을 만들지 않는다. 터진 타격도 같은 휘두름이다

  # inventory · tool · worldTime · observers 는 그대로. 새 막대도 새 자원도 없다.

# ─────────────────────────────────────────────────────────────────
# interactions — 하나도 바뀌지 않는다
# ─────────────────────────────────────────────────────────────────
interactions:
  change: NONE
  meaning:
    - attack · skillHeavy · skillAura 의 관문도 사유 목록도 그대로다.
      Critical 은 스킬을 고르는 조건이 아니다 — 고른 뒤에 일어나는 일이다
    - guardBegin · guardRelease 도 그대로다. "크게 터진 한 방은 못 막는다" 같은
      새 사유는 없다. 막을 수 있고, 다만 더 든다
    - observe 도 그대로다. 살펴봄이 여는 자리가 넓어질 뿐 관문은 그 자리에 있다
    - setAttribute 도 계약 모양이 그대로다 — 목록이 늘어난 것은 세계 쪽 일이다

# ─────────────────────────────────────────────────────────────────
# COMMAND NOTE — commandCatalog 계약 모양은 바뀌지 않는다
# ─────────────────────────────────────────────────────────────────
# 세계가 싣는 "바꿀 수 있는 속성" 목록에 criticalChance · criticalDamage 가 더해진다
# (14개 → 16개). C013 이 12개를 14개로 늘렸을 때와 같은 일이며 계약 모양은 그대로다.
#
# 다만 이 둘은 기존 항목과 다른 성질이 하나 있다 — **범위가 좁다** (0~1 · 1~100).
# 그 범위 역시 세계가 목록과 함께 싣는다. View 는 자기 코드에 "확률이니까 0~1 이겠지" 를
# 적지 않는다 (DC-WORLD-OWNS-THE-SURFACE-LIST).
# 소수를 입력할 수 있어야 한다는 것이 이 Cycle 이 명령 화면에 요구하는 전부다.

# ─────────────────────────────────────────────────────────────────
# VARIANCE NOTE — 흔들리는 숫자를 View 가 어떻게 다뤄야 하는가
# ─────────────────────────────────────────────────────────────────
# 이 Cycle 이 계약에 들여오는 새 성질이므로 못박아 둔다.
# C014 의 EMPTY-SLOT NOTE 와 같은 자리의 규칙이다.
#
#   해야 하는 것
#     critical.occurred 를 읽어 그 타격이 터졌음을 드러낸다.
#     터진 한 방과 안 터진 한 방이 화면에서 구별되어야 한다 —
#     구별되지 않으면 플레이어는 세계가 그냥 이상한 숫자를 낸다고 배운다.
#     그리고 왜 그만큼인지를 물었을 때 damageBeforeCritical 과 multiplier 가 답해야 한다.
#
#   해서는 안 되는 것
#     ① 피해 숫자가 평소보다 크다는 것으로 Critical 을 판정하는 것 —
#        occurred 가 그 답이다. 숫자로 역산하면 방어가 얇은 상대와 구별되지 않는다
#     ② damageBeforeCritical 을 finalDamage / multiplier 로 계산해 내는 것 —
#        반올림 때문에 세계의 값과 어긋난다. 세계가 실어 보낸 값을 쓴다
#     ③ 다음 타격이 터질지를 예상해 보여주는 것 — 세계가 그 정보를 주지 않는다.
#        chance 는 기대이지 예고가 아니다
#     ④ 몇 번 안 터졌으니 이번엔 터질 때가 되었다는 식의 표시 —
#        세계에 그런 규칙이 없다 (03 RULE-CRITICAL-STRIKE-001)
#     ⑤ criticalChance 를 살펴보지 않은 상대에 대해 짐작해 그리는 것 —
#        C014 의 금지 그대로다
#
# 어떻게 드러낼지(글자인지 색인지 크기인지 소리인지)는 View 의 결정이다.
# 이 계약이 정하는 것은 **터졌음이 읽힐 수 있어야 한다**는 것까지다.

# ─────────────────────────────────────────────────────────────────
# OBSERVABLE PROJECTION NOTE
# ─────────────────────────────────────────────────────────────────
#   03 의 Observable Semantic 대응
#     존재마다
#       Actor.CriticalChance (남의 것, 알 때만)   → combatStats.criticalChance
#       Actor.CriticalDamage (남의 것, 알 때만)   → combatStats.criticalDamage
#     자기
#       Actor.CriticalChance · CriticalDamage     → hud.self.combat.critical*
#     타격마다
#       CriticalOutcome 네 값                     → strikeEvents.breakdown.critical
#       증폭된 최종 피해                          → strikeEvents.breakdown.finalDamage
#     할 수 있는 일
#       바꿀 수 있는 속성 목록 + 범위             → commandCatalog (세계가 싣는다)
#
#   투영하지 않는 것 — 그리고 그것이 이 Cycle 의 설계다
#     World.ChanceSeed · World.ChanceCursor
#       실으면 다음 타격이 터질지가 계산 가능해진다. 그러면 흔들림이 사라지고
#       이 층은 "복잡한 결정론" 이 된다 (03 OBSERVABLE SEMANTIC).
#     그 타격의 Roll 값
#       연이은 Roll 은 뿌리를 되짚게 하고, 뿌리를 되짚으면 앞날이 읽힌다.
#       결과를 설명하는 데 필요하지도 않다 —
#       chance · occurred · multiplier · 커지기 전 값이면
#       "25% 였고 이번엔 터졌고 두 배가 되어 20 이 40 이 되었다" 가 완전히 읽힌다.
#     World.ChanceStep 등 세계 상수
#       C010 이 DefenseConstant 에, C013 이 PenetrationConstant 에 내린 판단 그대로다.
#       관찰되는 것은 상수가 아니라 그 결과다.
#
#   03 의 Observable Semantic 중 투영되지 않은 것은 없다.
#
#   Designer Observer — 이 Cycle 은 designer 관찰을 따로 열지 않는다.
#   위 계약이 이미 판정에 들어간 값(chance)과 그 결과(occurred)와
#   결과가 만든 차이(damageBeforeCritical ↔ finalDamage)를 모두 싣는다.

# ─────────────────────────────────────────────────────────────────
# PLAYABILITY NOTE — 이 계약만으로 Cycle Goal 이 플레이되는가
# ─────────────────────────────────────────────────────────────────
# 플레이어(관찰자의 몸 = rabbit-swordsman · criticalChance 0.25 · criticalDamage 2.0)는
# 이 계약만 받고 다음을 할 수 있다.
#   1. 자기 hud 를 본다. criticalChance 0.25 · criticalDamage 2.0 —
#      **나는 넷에 하나꼴로 두 배를 낸다.** C013 까지의 화면에는 없던 자리다
#   2. 자율 존재(wanderer)를 기본 스킬로 친다. 20 이 나온다.
#      breakdown.critical 에 occurred 거짓 · chance 0.25 ·
#      damageBeforeCritical 20 — 이번엔 운이 없었다
#   3. 계속 친다. 몇 대째에 **40** 이 나온다. occurred 참 · multiplier 2 ·
#      damageBeforeCritical 20. 20 이 두 배가 되었다는 것이 그 자리에 다 있다.
#      숫자를 견주어 짐작할 필요가 없다
#   4. 자율 존재의 생명 120 이 6대가 아니라 4~5대에 바닥난다.
#      "이따금 상한을 넘는다" 가 전투 길이로 읽힌다
#   5. 자율 존재가 나를 친다. 언제나 17 이다 — breakdown.critical 의 chance 가 0 이고
#      occurred 가 거짓이다. **터질 리 없는 몸**이라는 것이 경위에 적혀 있다.
#      내가 맞는 값은 흔들리지 않는다 (03 BALANCE)
#   6. 그 자율 존재를 살펴본다 (C014 의 살펴봄). combatStats 가 열리고
#      criticalChance 0 · criticalDamage 1 이 보인다 —
#      살펴보기 전에는 저 존재가 터뜨릴 수 있는지조차 몰랐다
#   7. 디버그 명령으로 내 criticalChance 를 1 로 올린다.
#      **매번 40 이 나온다.** occurred 가 언제나 참이다 —
#      확률의 한쪽 끝에서 세계가 다시 결정론이라는 것을 눈으로 본다
#   8. 0 으로 내린다. **매번 20 이다.** C013 까지의 그 숫자 그대로이며,
#      damageBeforeCritical 과 finalDamage 가 언제나 같다 —
#      반대쪽 끝도 결정론이다. 이 세계에 흔들림은 정확히 한 자리에만 있다
#   9. criticalDamage 를 3 으로 올리고 chance 를 0.25 로 되돌린다.
#      터질 때 60 이 나온다. 빈도와 크기가 따로 자란다는 것이 보인다
