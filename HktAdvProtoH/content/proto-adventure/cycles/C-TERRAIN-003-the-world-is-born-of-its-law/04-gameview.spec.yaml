# CYCLE C-TERRAIN-003 — GameView Specification
#
# C-TERRAIN-001 이 무대를 이 계약에 실었고, C-TERRAIN-002 가 거기에 시간을 실었다.
# 이 Cycle 은 **표면을 거의 열지 않는다** — 바뀌는 것은 자리들이 어디서 왔는가이고,
# 그 출처는 이미 실려 있는 표면(자리의 배치)으로 드러난다. 태어난 배치 자체가
# 분포의 결이다 (03 OBSERVABLE — INTENT-THE-SHAPE-IS-OBSERVED-001).
#
# 더하는 것은 하나뿐이다.
#
#   ① debug.genesisSeed   이 세계가 어느 씨앗에서 태어났는가 — designer 관찰.
#                         "같은 씨앗 → 같은 세계" 를 플레이로 검증하는 유일한 표면이다
#
# 플레이어 표면은 한 항목도 늘지 않는다. 자리의 개수가 상수(넷)에서 법칙의 항(veins)으로
# 옮겨 갔으므로, 화면은 이미 그러하듯 **받은 목록을 그린다** — 몇 개인지 세지 않는다.
id: VIEW-THE-WORLD-IS-BORN-OF-ITS-LAW-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.*
    - ground.zones[].id / law / center / radius / phase / fill
    - ground.self.*
    - hud.*
    - interactions.*
    - debugObserve / debugAuthority
    - observer / session / delivery / identity / telemetry
  added:
    - debug.genesisSeed                       # designer 관찰 — 아래 debug 절
  changed: []
  removed: []

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# ground.zones — 변경 없음. 그러나 뜻이 깊어진다
#
#   지난 계약까지 이 목록은 "세계를 적은 사람이 놓은 자리들" 이었다. 이제는
#   "법칙이 낳은 자리들" 이다 — 계약의 형태는 같고, 화면은 아무것도 다르게
#   그리지 않아도 된다. 자리의 개수는 세계마다 다를 수 있다 (cardinality: many 가
#   처음부터 그 자유를 지니고 있었다 — 계약이 열리지 않는 이유다).
#
#   "왜 여기에 이 자리가 있는가" 는 표면에 실리지 않는다 — 답은 세계(씨앗과 규칙)가
#   지니고, 화면이 보여 주는 것은 그 답의 결과(배치)다.
# ─────────────────────────────────────────────────────────────────
ground:
  change: NONE

hud:
  change: NONE

interactions:
  change: NONE

# ─────────────────────────────────────────────────────────────────
# debug — designer 관찰. 같은 계약으로 본다 (별도 World 접근 경로 없음)
#
#   C009 가 세운 debug 표면의 자리에 값 하나가 는다.
# ─────────────────────────────────────────────────────────────────
debug:
  genesisSeed:
    observer: designer
    source: World.GenesisSeed
    meaning: >
      이 세계가 어느 씨앗에서 태어났는가. 같은 씨앗으로 다시 띄우면 같은 땅이
      나온다는 것(INTENT-SAME-SEED-SAME-WORLD-001)을 검증하는 표면이다.
      플레이어 표면이 아니다 — 플레이어에게 씨앗은 세계 밖의 사실이다
    delta: ADDED

designer:
  goal: 세계의 자리들이 원리의 결과로 존재한다 — 왜 여기에 이 자리가 있는가에 세계가 답한다
  possibility: 씨앗이 다른 세계에 들어가 다른 땅을 만난다 (MP-LEARN-TO-HANDLE-THE-LAYER)
  availability:
    - ground.zones[]                   # 태어난 배치 전부 — 몇 개든, 어디든
  preconditions:
    - debug.genesisSeed                # 어느 세계인가
  before_after:
    - ground.zones[]                   # 씨앗이 다르면 이 목록이 다르다 · 같으면 같다
  reason: []                           # 거절되는 요청이 없다 — 태어남은 요청이 아니다

# ─────────────────────────────────────────────────────────────────
# VIEW CLOSURE — 이 계약만으로 Cycle Goal 을 플레이할 수 있는가
# ─────────────────────────────────────────────────────────────────
closure:
  - 태어난 배치를 본다                        ground.zones[] (기존 표면 그대로)
  - 씨앗이 다른 세계에서 다른 땅을 만난다      다른 씨앗으로 띄운다 → zones[] 가 다르다
  - 같은 씨앗이 같은 땅을 낳는 것을 본다       같은 씨앗으로 다시 띄운다 → zones[] 가 같다
  - 어느 세계인지 안다                        debug.genesisSeed (designer)
  - 태어난 자리 위에서 기존 플레이가 돈다      phase · fill · self.state 전부 그대로 돈다
  - 오늘의 해숨구멍이 계산의 결과임을 본다     어느 세계든 뿜는 맥이 하나 있고, 씨앗이
                                            다르면 그 자리가 다르다

# ─────────────────────────────────────────────────────────────────
# NOT IN THIS CONTRACT — 싣지 않는 것과 그 이유
# ─────────────────────────────────────────────────────────────────
excluded:
  에너지 분포의 날값 (자리 밖 지점의 결속 세기):
    세계에 그런 State 가 없다 (03 RATIONALE 6 — 분포의 흔적은 자리들 그 자체다).
    자리 없는 곳의 분포를 실으면 화면이 "다음 세계는 어떨까" 를 계산하게 되고
    그것은 이 Cycle 의 Goal 밖이다
  자리의 출처 표식 (이 자리는 어느 표본에서 났는가):
    "왜 여기인가" 의 답은 씨앗과 규칙이 지닌다 — 표면에 실으면 두 번째 진실이 된다
  플레이어 표면의 씨앗:
    플레이어에게 씨앗은 세계 밖의 사실이다. 플레이어가 읽는 것은 태어난 땅이지
    태어남의 번호가 아니다
  맥의 수 · 범위 · 이웃 거리 (veins · veinRadius · veinStride):
    법칙의 정의다 — saturation 등을 싣지 않는 것과 같은 이유 (C-TERRAIN-002 EXCLUDED)

# ─────────────────────────────────────────────────────────────────
# ENGINE 에 요구하는 것 — 없다
#
#   SceneGroundZone 은 자리가 어디서 왔는지 묻지 않는다. 그리는 계약 변경 없음.
# ─────────────────────────────────────────────────────────────────
engine_contract:
  primitive: SceneGroundZone
  change: NONE
  uses: [id, shape, fill, edge, label, intensity]
