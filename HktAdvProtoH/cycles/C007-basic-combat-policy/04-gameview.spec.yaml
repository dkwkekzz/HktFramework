# CYCLE C007 — GameView Specification
# R1 축소 개정 — 판정 능력치·명중/치명 결과를 제외했다. 타격 결과는 피해량 하나다.
# R2 개정 (Human Review 반영) — 모든 Actor 의 모든 속성을 싣는다(가리는 경계 없음),
#                                속성 변경 요청 경로를 더한다(세계가 허용할 때만).
id: VIEW-BASIC-COMBAT-POLICY-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character            # 위치·역할·모션·body·swing 계약 그대로 (C002~C006)
    - entities.deposit
    - debugObserve                  # C006 그대로 — 충돌체 관찰
    - observer / session / delivery / identity / telemetry   # C003~C005 그대로
    - interactions.move / interactions.mine
    - hud.inventory / hud.tool / hud.playerAction / hud.worldTime / hud.observers
  added:
    - entities.character.name       # 불러 줄 이름
    - entities.character.vitality   # 생명 현재/최대 + 쓰러짐
    - entityHud                     # 몸 위에 실리는 이름·생명 (모든 존재)
    - strikeEvents                  # 한 번의 타격 결과 (누가 누구를 얼마나)
    - interactions.skillHeavy       # 고급 스킬
    - interactions.moveMode         # 걷기 / 달리기 전환
    - hud.self                      # 자기 자원·템포 능력치·배율 (늘 눈앞에 있는 자리)
    - entities.character.attributes  # R2 — 모든 존재의 모든 속성
    - debugAuthority                 # R2 — 속성을 바꿔 볼 수 있는 세계인가 + 바꿀 수 있는 목록
    - interactions.setAttribute      # R2 — 속성 변경 요청 (기반만)
  changed:
    - entities.character.state      # 상태 값에 heavy-attack · downed 가 더해진다
    - interactions.attack           # 기본 스킬로 의미가 확정되고, 불가 사유가 늘어난다

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# entities.character — 기존 계약 + 이름·생명 (C007 ADDED)
# ─────────────────────────────────────────────────────────────────
entities:
  character:
    cardinality: many
    id: { source: Actor.Id }
    role:                           # C004 그대로
      player-character: { when: Actor.Id == Observer.ActorId }
      other-player-character:
        when: Actor.Control == player && Actor.Id != Observer.ActorId
      npc-character: { when: Actor.Control == autonomous }
    kind: { source: Actor.CharacterKind }
    position: { source: Actor.Position }

    name: { source: Actor.Name }    # C007 ADDED — 모든 존재가 가진다

    state: { source: Actor.CurrentActionKind }
      # C007 CHANGED — 값이 늘어난다:
      #   idle | move | attack(기본 스킬) | heavy-attack(고급 스킬) | mine | hit | downed
      # 구조는 그대로다. View 는 새 값에 대한 표현을 고르기만 하면 된다.
    actionProgress: { source: Actor.ActionProgress }
    actionTarget: { source: Actor.ActionTargetId }
    attended: { source: Character.Attended, appliesTo: [other-player-character] }

    vitality:                       # C007 ADDED — 누구나 관찰할 수 있다
      health: { source: Actor.Hp }
      healthMaximum: { source: Actor.HpMax }
      downed: { source: Actor.Downed }
        # 참이면 그 존재는 더 이상 행동하지 않고 타격 대상도 되지 않는다

    attributes:                     # R2 ADDED — 모든 존재의 모든 속성. 가리는 것이 없다.
      energy: { source: Actor.Cp }
      energyMaximum: { source: Actor.CpMax }
      moveMode: { source: Actor.MoveMode }              # walk | run
      control: { source: Actor.Control }                # player | autonomous
      tempoStats:
        moveSpeed: { source: Actor.TempoStats.MoveSpeed }
        runSpeedMultiplier: { source: Actor.TempoStats.RunSpeedMultiplier }
        actionSpeed: { source: Actor.TempoStats.ActionSpeed }
      modifiers:
        energyCharge: { source: Actor.Modifiers.CpCharge }
        energyConsume: { source: Actor.Modifiers.CpConsume }
        moveSpeed: { source: Actor.Modifiers.MoveSpeed }
        actionSpeed: { source: Actor.Modifiers.ActionSpeed }
      # 이 값들은 누구의 것이든 실린다. 늘 화면에 띄우라는 뜻은 아니다 —
      # 기본 표시는 entityHud(이름·체력)이고, 나머지는 hud.self 와 debugAuthority.inspect 가
      # 필요할 때 펼친다. 세계가 감추지 않을 뿐 화면을 채우지도 않는다.

    motion:                         # C002·C004 그대로
      selectedBy: [kind, state]
      progress: { withDuration: actionProgress, withoutDuration: loop }
      fallback: { order: ['kind:idle', 'anyKind:state', placeholder] }

    body:                           # C006 그대로
      radius: { source: Actor.Body.Radius }
      height: { source: Actor.Body.Height }
      mass: { source: Actor.Body.Mass }
      facing: { source: Actor.Facing }
      velocity: { source: Actor.Velocity }

    swing:                          # C006 그대로 — 스킬 종류와 무관하게 같은 계약
      center: { source: ActionCollider.Center }
      radius: { source: ActionCollider.Radius }
      active: { source: ActionCollider.Active }
      struck: { source: Attack.StruckActorIds }

  deposit:                          # C004 그대로
    cardinality: many
    id: { source: Deposit.Id }
    role: resource-deposit
    resourceKind: stone
    position: { source: Deposit.Position }
    state:
      available: { when: Deposit.ResourceAmount > 0 }
      depleted: { when: Deposit.ResourceAmount == 0 }
    remaining: { source: Deposit.ResourceAmount }

# ─────────────────────────────────────────────────────────────────
# entityHud — 존재의 몸에 실리는 관찰 (C007 ADDED)
#
# 세계의 모든 존재는 이름과 생명을 관찰할 수 있다 (INTENT-ENTITY-OBSERVE-001).
# 이것은 화면 구석의 정보창이 아니라 그 존재에 붙어 있는 관찰이다 —
# 어디에 어떻게 붙여 그릴지는 View 의 결정이다.
# ─────────────────────────────────────────────────────────────────
entityHud:
  forEach: entities.character
  always: true                      # 관찰자가 끄고 켜는 대상이 아니다 (debugObserve 와 다르다)
  shows:
    name: { source: entities.character.name }
    health:
      current: { source: entities.character.vitality.health }
      maximum: { source: entities.character.vitality.healthMaximum }
    downed: { source: entities.character.vitality.downed }
  meaning:
    - 누가 누구인지, 얼마나 남았는지를 싸우는 도중에 몸에서 바로 읽을 수 있어야 한다
    - 쓰러진 존재는 살아 있는 존재와 구분되어야 한다
  notShownByDefault:                # R2 — 감춰진 것이 아니라 "늘 띄우지 않는 것"이다
    - entities.character.attributes  # 세계는 전부 준다. 몸 위를 채우지 않기 위한 표시 선택일 뿐이며,
                                     # 필요하면 debugAuthority.inspect 로 펼쳐 본다

# ─────────────────────────────────────────────────────────────────
# strikeEvents — 한 번의 타격이 낳은 결과 (C007 ADDED)
#
# 피해는 스킬이 정한 고정값이므로 실리는 것은 값 하나뿐이다.
# 각 결과는 정해진 시간이 지나면 세계에서 사라진다.
# ─────────────────────────────────────────────────────────────────
strikeEvents:
  cardinality: many
  source: World.StrikeEvents
  attacker: { source: StrikeEvent.AttackerId }
  target: { source: StrikeEvent.TargetId }
  skill: { source: StrikeEvent.SkillKind }        # attack | heavy-attack
  amount: { source: StrikeEvent.Amount }          # 덜어낸 생명
  at: { source: StrikeEvent.Position }            # 결과가 드러나는 자리 = 맞은 몸의 중심
  since: { source: StrikeEvent.Time }             # 일어난 세계 시각 — 얼마나 지났는지 판단용
  meaning:
    - 얼마가 깎였는지 숫자로 읽을 수 있어야 한다
    - 기본 스킬과 고급 스킬의 결과가 구분되어야 한다 (skill 값으로)
    - 내가 친 것과 남이 친 것 모두 보인다 (attacker / target 으로 구분 가능)

# ─────────────────────────────────────────────────────────────────
# debugObserve — C006 계약 그대로 (변경 없음)
# ─────────────────────────────────────────────────────────────────
debugObserve:
  toggle: { owner: observer, default: off }
  shows:
    bodies:
      forEach: entities.character
      volume: { center: position, radius: body.radius, height: body.height }
      motion: { vector: body.velocity }
    actionColliders:
      forEach: entities.character (swing 이 존재하는 것)
      volume: { center: swing.center, radius: swing.radius }
      activity: swing.active
      struckMarks: swing.struck

# ─────────────────────────────────────────────────────────────────
# debugAuthority — 속성을 들여다보고 바꿔 보는 자리 (R2 ADDED)
#
# 세계는 모든 속성을 이미 보내고 있다 (entities.character.attributes).
# 이 블록은 그것을 "펼쳐 보고 바꾸는" 관찰자 쪽 자리를 계약으로 고정한다.
# 켜고 끄는 것은 관찰자의 선택이고, 바꿀 수 있는지는 세계가 정한다.
# ─────────────────────────────────────────────────────────────────
debugAuthority:
  open: { source: World.DebugAuthority.Open }   # 세계가 속성 변경을 허용하는가
  mutableAttributes:                            # 무엇을 어디까지 바꿀 수 있는가
    cardinality: many
    source: MutableAttribute
    attribute: { source: MutableAttribute.Id }  # hp | hpMax | cp | cpMax |
                                                # moveSpeed | runSpeedMultiplier |
                                                # actionSpeed | moveMode
    range: { source: MutableAttribute.Range }
  inspect:
    toggle: { owner: observer, default: off }
    forEach: entities.character
    shows: entities.character.attributes        # 지목한 존재의 모든 속성
  meaning:
    - open 이 거짓이면 값을 펼쳐 볼 수는 있어도 바꿀 수는 없다
    - 바꿀 수 있는 속성과 허용 범위는 세계가 알려 준 목록 그대로여야 한다 —
      View 가 목록을 스스로 만들지 않는다

# ─────────────────────────────────────────────────────────────────
# interactions — 스킬 2종 + 이동 모드 + 속성 변경 (C007 ADDED / CHANGED)
# ─────────────────────────────────────────────────────────────────
interactions:
  subject: observer-character
  move:                             # C004 그대로
    role: move-to
    target: terrain-position
    request: Move(ObserverCharacter, TargetPosition)
    available: { source: Move.Availability }
    unavailableReason: { source: Move.FailureReason }
  mine:                             # C004 그대로
    role: mine-deposit
    target: deposit
    request: Mine(ObserverCharacter, Deposit)
    available: { source: Mine.Availability }
    unavailableReason: { source: Mine.FailureReason }

  attack:                           # C007 CHANGED — 기본 스킬로 의미가 확정된다
    role: skill-basic
    target: none
    request: Skill(ObserverCharacter, attack)
    available: { source: Skill(attack).Availability }
    unavailableReason: { source: Skill(attack).FailureReason }
      # downed | action-busy  (기본 스킬은 소모가 없어 insufficient-cp 가 나오지 않는다)
    profile:                        # 쓰기 전에 알 수 있어야 하는 값
      damage: { source: Skill(attack).Damage }
      charge: { source: Skill(attack).CpCharge }
      cost: { source: Skill(attack).CpCost }

  skillHeavy:                       # C007 ADDED — 고급 스킬
    role: skill-heavy
    target: none
    request: Skill(ObserverCharacter, heavy-attack)
    available: { source: Skill(heavy-attack).Availability }
    unavailableReason: { source: Skill(heavy-attack).FailureReason }
      # downed | action-busy | insufficient-cp
    profile:
      damage: { source: Skill(heavy-attack).Damage }
      charge: { source: Skill(heavy-attack).CpCharge }
      cost: { source: Skill(heavy-attack).CpCost }
    meaning:
      - 쓸 기력이 모자라면 요청 자체가 받아들여지지 않으며 그 사유가 온다
      - 기본 스킬보다 크게 깎지만 기력을 잃는다는 것이 값으로 드러나야 한다

  moveMode:                         # C007 ADDED — 걷기 / 달리기
    role: set-move-mode
    target: none
    request: SetMoveMode(ObserverCharacter, walk | run)
    current: { source: ObserverCharacter.MoveMode }
    available: { source: MoveMode(run).Availability }
    unavailableReason: { source: MoveMode(run).FailureReason }
      # downed | insufficient-cp
    meaning:
      - 요청은 토글이 아니라 명시값이다 — 같은 요청이 두 번 가도 결과가 같다
      - 기력이 바닥나면 세계가 스스로 걷기로 되돌린다. View 는 current 를 따라간다

  setAttribute:                     # R2 ADDED — 속성 변경 (기반만)
    role: debug-set-attribute
    target: character               # 자기 몸이 아니라 지목한 존재가 대상이다
    request: SetAttribute(TargetEntity, AttributeId, Value)
      # 이 요청은 기존 요청 계약(대상 + 값)이 담지 못하는 항목을 가진다 —
      # 경계 타입에 속성 이름과 값을 실을 자리가 필요하다는 뜻이며,
      # 어떻게 실을지는 구현 단계가 정한다.
    available: { source: AttributeSet.Availability }      # = World.DebugAuthority.Open
    unavailableReason: { source: AttributeSet.FailureReason }
      # debug-closed | unknown-target | unknown-attribute | out-of-range
    meaning:
      - 세계가 권한을 닫아 두면 이 상호작용은 아예 가용하지 않다
      - 바꾼 결과는 다음 관찰에서 그 존재의 속성으로 확인된다
      - 이후 Cycle 의 치트 수단은 이 요청 위에 얹힌다 — 여기서는 경로 하나만 연다

  requestResult: from-next-observation

# ─────────────────────────────────────────────────────────────────
# hud — 관찰자 자신에 대한 정보 (C004 계약 + C007 self)
# ─────────────────────────────────────────────────────────────────
hud:
  inventory:                        # C004 그대로
    stone: { source: ObserverCharacter.Inventory.StoneCount }
  tool:
    hasMiningTool: { source: ObserverCharacter.Inventory.HasMiningTool }
  playerAction:
    action: { source: ObserverCharacter.CurrentActionKind }
    progress: { source: ObserverCharacter.ActionProgress }
  worldTime:
    elapsed: { source: World.Time }
  observers:
    present: { source: Observers.PresentCount }

  self:                             # C007 ADDED — 자기 몸의 값이 늘 눈앞에 있는 자리
                                    # R2 — 같은 값을 남에 대해서도 볼 수 있다
                                    #      (entities.character.attributes).
                                    #      여기가 특별한 것은 "늘 보인다"는 점뿐이다.
    vitality:
      health: { source: ObserverCharacter.Hp }
      healthMaximum: { source: ObserverCharacter.HpMax }
      energy: { source: ObserverCharacter.Cp }
      energyMaximum: { source: ObserverCharacter.CpMax }
      downed: { source: ObserverCharacter.Downed }
    moveMode: { source: ObserverCharacter.MoveMode }        # walk | run
    tempoStats:
      moveSpeed: { source: ObserverCharacter.TempoStats.MoveSpeed }
      runSpeedMultiplier: { source: ObserverCharacter.TempoStats.RunSpeedMultiplier }
      actionSpeed: { source: ObserverCharacter.TempoStats.ActionSpeed }
    modifiers:                      # 지금 나에게 걸려 있는 배율 — 1 이 아니면 무언가 걸려 있다는 뜻
      energyCharge: { source: ObserverCharacter.Modifiers.CpCharge }
      energyConsume: { source: ObserverCharacter.Modifiers.CpConsume }
      moveSpeed: { source: ObserverCharacter.Modifiers.MoveSpeed }
      actionSpeed: { source: ObserverCharacter.Modifiers.ActionSpeed }
    meaning:
      - 기력이 지금 모이는 중인지 억눌린 중인지를 배율로 알 수 있어야 한다
      - 고급 스킬을 쓸 수 있는 기력인지 수치로 판단할 수 있어야 한다

# OBSERVABLE PROJECTION NOTE
#   03 의 Observable Semantic 대응
#     모든 Actor 에 대해 (R2 — 예외 없음)
#       Actor.Name                     → entities.character.name / entityHud.name
#       Actor.Hp · HpMax               → entities.character.vitality / entityHud.health
#       Actor.Downed                   → entities.character.vitality.downed
#       Actor.Cp · CpMax               → entities.character.attributes.energy
#       Actor.MoveMode · Control       → entities.character.attributes
#       Actor.TempoStats 3             → entities.character.attributes.tempoStats
#       Actor.Modifiers 4              → entities.character.attributes.modifiers
#       CurrentActionKind(신규 값 포함) → entities.character.state
#     관찰자 자신에 대해 추가로 (늘 눈앞에 두는 자리 + 자기만 의미 있는 값)
#       위 속성 전부                    → hud.self (같은 값의 상시 표시)
#       Skill Availability/Reason      → interactions.attack · skillHeavy
#       Skill Damage/Charge/Cost       → interactions.*.profile
#       MoveMode Availability/Reason   → interactions.moveMode
#     세계
#       World.StrikeEvents             → strikeEvents
#       World.DebugAuthority.Open      → debugAuthority.open · interactions.setAttribute.available
#       MutableAttribute + Range       → debugAuthority.mutableAttributes
#       AttributeSet.FailureReason     → interactions.setAttribute.unavailableReason
#
#   투영하지 않는 것
#     없다 (R2). 03 의 Observable Semantic 은 전부 이 계약에 실린다.
#     단 시뮬레이션 상수(RUN_CP_DRAIN · RUN_CHARGE_FACTOR · STRIKE_EVENT_TTL …)는
#     관찰 대상이 아니다 — 관찰되는 것은 상수가 아니라 그 결과(배율·기력·타격)다.
