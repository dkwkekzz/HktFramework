task:
  id: C002-SCOPE-001
  cycle_id: C002
  stage: CYCLE_SCOPE
  skill: cycle-scope
  objective: >
    Cycle Goal (곡괭이를 든 캐릭터가 광맥으로 이동해 Stone 하나를 캔다) 을
    한 Cycle 로 완주 가능한 최소 플레이 범위로 확정한다.
    C001 은 DRY_RUN 이므로 재사용 Module 은 없다 — 다만 이동(광맥으로 가서)이
    이번 Goal 에 명시적으로 포함된 점이 C001 설계와 다름에 유의한다.
  allowed_inputs:
    - cycles/C002/goal.yaml
    - registry/modules.yaml
  read_scope:
    - cycles/C002/goal.yaml
    - registry/
    - skills/cycle-scope/
    - cycles/C001/artifacts/scope/   # DRY_RUN 설계 참고용 (재사용 아님)
  write_scope:
    - cycles/C002/artifacts/scope/
  forbidden_scope:
    - source/
    - modules/
    - cycles/C002/artifacts/world-design/
  required_outputs:
    - cycle_scope.yaml
    - handoff.yaml
  completion_gate:
    type: scope-verify
  routing:
    pass: INTENT_DESIGN
    fail: CYCLE_SCOPE_REWORK
