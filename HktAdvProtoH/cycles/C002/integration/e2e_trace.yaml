# S012 / C002-INTEGRATION-001 — E2E Trace (실측, §30·§36)
# 실행: npx vitest run tests/e2e.trace.test.ts → 실측값은 e2e_trace_measured.json (테스트가 생성)
e2e_trace:
  scenario: PLAY-MINING-C002
  measured_by: source/tests/e2e.trace.test.ts (headless) + source/tests/playable.driver.mjs (browser)
  chain:
    - step: client_input
      value: 이동 키 의도(조향) + 채굴 키 의도(E)
    - step: world_command
      contract: [CMD-MOVE-V1, CMD-MINE-V1]
      value: CMD-MOVE-V1 x74 (AVAILABLE 도달까지) + CMD-MINE-V1 x1
    - step: authoritative_rule
      value: [RULE-MOVE-001, RULE-MINE-001]
    - step: world_transition
      value:
        Deposit.ResourceAmount: { before: 5, after: 4 }
        Actor.Inventory.Stone: { before: 0, after: 1 }
        Actor.CurrentAction: { before: Idle, after: Mine }
    - step: observer_projection
      contract: OBS-MINING-V1
      value:
        Actor.Inventory.Stone: 1
        Deposit.ResourceAmount: 4
        Actor.CurrentAction: Mine
        MineStone.Availability(접근 후 채굴 전): { status: AVAILABLE, target: deposit-1 }
        ResourceTransition: { stoneBefore: 0, stoneAfter: 1 }
    - step: gameview_binding
      contract: VIEW-MINING-001
      value:
        hud.stoneCount: 1
        character.mining: true
        deposit.amountLabel: "돌 4"
        hud.feedbackLine: "+1 Stone 획득!"
    - step: rendering
      value: >
        브라우저 실측 (playable.driver.mjs): HUD "⛏ Stone: 1" / 피드백 "+1 Stone 획득!" /
        힌트 "[E] 채굴" DOM 확인 + playable_screenshot.png
  broken_links: []
