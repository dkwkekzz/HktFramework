  mode: REAL
  statement: >
    곡괭이를 가진 캐릭터가 광맥(Stone Deposit)으로 이동해
    Mine 을 수행하여 Stone 을 하나 캘 수 있다.
  play_experience: >
    플레이어가 웹 브라우저에서 3D 지형 위의 스프라이트 빌보드 캐릭터를 조작해
    광맥까지 걸어가 채굴하면, 광맥의 돌이 줄고 HUD 의 Stone 카운터가 1 이 되는 것을 눈으로 본다.
