# CYCLE C002 Goal — 첫 실제 Cycle (사용자 제시, 2026-08-12)
# C001(DRY_RUN) 의 Mining 설계를 재검증해 실 구현으로 대체한다 (DRYRUN-REPORT.md).
goal:
  cycle_id: C002
  mode: REAL
  statement: >
    곡괭이를 가진 캐릭터가 광맥으로 가서 Stone 을 하나 캘 수 있는 작은 게임.
  play_experience: >
    플레이어가 곡괭이를 든 캐릭터를 조작해 돌 광맥까지 이동하고,
    광맥 앞에서 채굴하면 광맥의 돌이 줄고 인벤토리에 Stone 이 늘어나는 것을
    화면에서 직접 본다.
  existing_capabilities: []   # registry/modules.yaml 조회 결과 — FROZEN 모듈 없음
                              # (mining-world-v1 / mining-view-v1 은 DRY_RUN — 재사용 금지,
                              #  설계 참고 후 실검증으로 대체한다)
  # 런타임 스택 (DRYRUN-REPORT "실제 Cycle 시작 전 남은 결정" 1·3 항 확정)
  # — Orchestrator 환경 결정. World Rule / Visual 설계가 아니라 실행 기반 제약이다.
  runtime_constraints:
    world: >
      순수 JavaScript (ES Modules, 의존성 0, Node 내장만). source/world/ 에 위치.
      deterministic — 같은 Command 열은 같은 State 를 만든다.
      gameview 를 import 하지 않는다 (Rule 7 역방향 금지).
    gameview: >
      Vanilla JavaScript + HTML5 Canvas (의존성 0). source/gameview/ 에 위치.
      world 내부를 import 하지 않고 Observable snapshot 만 소비한다.
    playable_build: >
      source/index.html — 브라우저에서 열어 즉시 플레이.
      입력 → Command → World Rule → Observable → GameView 렌더 루프.
    test: >
      scripts/test/ 의 Node 실행 테스트 (node scripts/test/run-world-tests.mjs 등).
      브라우저 없이 World Rule 단위·Observable fixture 검증 가능해야 한다.
