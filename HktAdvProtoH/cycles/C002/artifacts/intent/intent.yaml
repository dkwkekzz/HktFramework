# S002 / C002-INTENT-001 — intent-design (Stage 2)
# 각 Intent 는 "어떤 조건의 Actor 가 무엇을 할 수 있고 결과가 무엇인지"를
# 세계 의미의 언어로만 기술한다 — 자료구조·네트워크·엔진·렌더링 용어 금지.
# 모든 문장은 이후 World State / Authoritative Rule 로 표현 가능해야 한다 (Rule 2 대비).
intents:
  - id: INTENT-MOVE-001
    possibility: MoveToDeposit
    meaning: >
      Actor that has a Position in the world
      may execute Move toward a direction it chooses.
    result:
      - Actor Position changes by a bounded step in the chosen direction   # 한 번의 Move 는 유한한 거리만 이동한다
      - Actor distance to any ResourceDeposit changes accordingly          # 접근(approach_deposit)은 이 거리 변화의 누적으로 성립한다
    rejection:                                                             # 거부 조건도 세계 의미로 고정 — 이동이 "의미 있는" 행동이 되는 경계
      - Move beyond the world boundary is rejected; Actor Position does not change

  - id: INTENT-MINE-001
    possibility: MineStone
    meaning: >
      Actor that knows a ResourceDeposit,
      owns a Mining-capable Tool,
      and whose Position is within the Deposit's InteractionRange
      may execute Mine on that Deposit.
    result:
      - Deposit ResourceAmount decreases by 1        # 세계 쪽 사실 변화
      - Actor Inventory Stone count increases by 1   # Actor 쪽 사실 변화 — 두 변화는 하나의 Mine 결과로 동시에 성립한다
    rejection:                                       # 거부 시 세계는 변하지 않는다 — approach_deposit 이 의미를 갖는 근거
      - Mine outside InteractionRange is rejected; no world fact changes
      - Mine without a Mining-capable Tool is rejected; no world fact changes
      - Mine on a Deposit whose ResourceAmount is 0 is rejected; no world fact changes

  - id: INTENT-OBSERVE-001
    possibility: ObserveMiningWorld
    meaning: >
      Actor may always observe these world facts:
      its own Position, each known Deposit's Position and ResourceAmount,
      and its own Inventory Stone count.
    result:
      - Every Move and Mine is observable as Before -> After of those facts   # Rule 9 — Observable 은 State/Rule 과 동시 설계된다는 요구의 의미 차원 선언
      - A rejected action is observable as "no fact changed"                  # 거부도 관찰 가능해야 이동·조건의 인과가 플레이어에게 드러난다
