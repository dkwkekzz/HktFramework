  included:
    - movement              # 3D 지형 위에서 캐릭터 이동 (광맥 접근 수단 — 이번엔 실제 Rule 로 구현)
    - approach_deposit      # InteractionRange 진입
    - execute_mine          # Mine 명령 실행
