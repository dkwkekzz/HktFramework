    - crafting              # 별도 Capability — 이번 플레이 목표에 불필요
    - trade                 # 별도 Capability
    - deposit_respawn       # Goal 검증에 불필요 (고갈까지만 다룸)
    - multiple_resource_types   # Stone 하나로 Goal 충족
    - multiplayer           # 단일 플레이어 로컬 런타임 (논리적 Authority 경계는 유지)
    - persistence           # 저장/복구는 후속 Cycle
  reused_modules: []        # Module Registry 조회 — FROZEN 없음 (C001 은 전부 DRY_RUN, 재사용 금지)
