# S003 / C002-SEMANTIC-001 — Intent 의미 → State/Rule 추적 (Semantic Closure 입력, §21)
intent_trace:
  - intent_semantic: "Actor may express a movement intention (이동 의도를 표현한다)"
    resolved_to:
      - RULE-MOVE-001
    kind: RULE
  - intent_semantic: "the world advances the Actor's Position (세계가 위치를 전진시킨다)"
    resolved_to:
      - RULE-MOVE-001
      - Actor.Position
    kind: TRANSITION
  - intent_semantic: "bounded by the world's movement limits (세계의 이동 한계 내에서)"
    resolved_to:
      - MoveSpeed
    kind: STATE
  - intent_semantic: "Actor knows a ResourceDeposit (Deposit을 알고 있다)"
    resolved_to:
      - Actor.Knowledge
    kind: STATE
  - intent_semantic: "Actor owns a Mining-capable Tool (Mining 가능한 도구를 보유한다)"
    resolved_to:
      - Actor.Inventory
      - Tool.Capability
    kind: STATE
  - intent_semantic: "Actor can interact with the Deposit (Deposit에 접근 가능하다)"
    resolved_to:
      - Actor.Position
      - ResourceDeposit.Position
      - InteractionRange
    kind: STATE
  - intent_semantic: "may execute Mine (Mine 한다)"
    resolved_to:
      - RULE-MINE-001
    kind: RULE
  - intent_semantic: "Deposit resource decreases"
    resolved_to:
      - RULE-MINE-001
      - ResourceDeposit.ResourceAmount
    kind: TRANSITION
  - intent_semantic: "Actor inventory increases (Stone을 획득한다)"
    resolved_to:
      - RULE-MINE-001
      - Actor.Inventory
    kind: TRANSITION
