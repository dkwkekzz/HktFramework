# S005 / C002-CONTRACT-001 — Stage 4 Command Contract (Rule 4 — Client 는 의도만 보낸다)
commands:
  - id: CMD-MOVE-V1
    version: 1
    possibility: ApproachDeposit
    rule: RULE-MOVE-001
    input:
      - ActorId
      - Direction          # 정규화 의도 (dx, dz). 결과 위치가 아니다.
    prohibited_fields:
      - resulting_position
      - teleport_target
      - any_world_state_result
  - id: CMD-MINE-V1
    version: 1
    possibility: MineStone
    rule: RULE-MINE-001
    input:
      - ActorId
      - DepositId
    prohibited_fields:
      - inventory_delta
      - resulting_resource_amount
      - any_world_state_result
