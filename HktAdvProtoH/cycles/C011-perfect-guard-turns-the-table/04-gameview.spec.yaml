# CYCLE C011 — GameView Specification
#
# 입력: 03-world-semantic.md · 기존 계약 VIEW-GUARD-TRADES-BODY-FOR-RESOURCE-001 (C010)
# 이 문서는 기존 계약 위의 Delta 다 — C010 에서 그대로인 항목은 다시 적지 않고 reused 로 표기한다.
id: VIEW-PERFECT-GUARD-TURNS-THE-TABLE-001
observer: player

delta:
  reused:
    - scene.mining-field
    - entities.character            # 위치·역할·모션·body·swing·name·vitality·attributes 그대로
    - entities.deposit
    - entityHud                     # 몸 위 관찰 자리 (내용만 확장 — changed 참조)
    - debugObserve
    - observer / session / delivery / identity / telemetry
    - interactions.move / mine / attack / skillHeavy / moveMode / setAttribute
    - hud.inventory / tool / playerAction / worldTime / observers / self
    - entities.character.stance.guarding / open / facing / broken / brokenUntil   # C010 그대로
  added:
    - entities.character.stance.startedAt      # 이 자세를 언제 세웠는가
    - entities.character.stance.perfectWindow  # 아직 완벽할 수 있는 창 안인가
    - entities.character.exposure              # 지금 열려 있는가 · 언제까지인가
    - strikeEvents.timing                      # 완벽·경과·되받아침·번 기력
    - hud.self.guard.perfectWindow             # 내 창이 남았는가
    - hud.self.guard.rearmAt                   # 언제 다시 세울 수 있는가
    - hud.self.exposure                        # 나도 열릴 수 있다
  changed:
    - entityHud.shows                          # 몸 위에 "열림" 이 더해진다
    - strikeEvents.breakdown                   # base 가 되받아침으로 커질 수 있다는 뜻이 된다
    - interactions.guard                       # 불가 사유에 guard-rearming 이 더해진다
    - debugAuthority.mutableAttributes         # 목록에 exposedFor 가 실려 온다 (세계가 준다)

scene: mining-field

# ─────────────────────────────────────────────────────────────────
# entities.character — C010 계약 + 시점과 열림 (C011 ADDED)
#
# 아래는 C010 계약에 더해지는 항목만 적는다.
# id / role / kind / position / name / state / actionProgress / actionTarget /
# attended / vitality / attributes / motion / body / swing 과
# stance 의 guarding / open / facing / broken / brokenUntil 은 C010 그대로다.
# ─────────────────────────────────────────────────────────────────
entities:
  character:
    stance:
      startedAt: { source: Actor.GuardStartedAt }       # C011 ADDED
        # 마지막으로 자세를 세운 세계 시각. worldTime 과의 차이가 곧 "세운 지 얼마" 다.
        # 이 값과 strikeEvents.timing.elapsed 가 같은 시계를 쓴다
      perfectWindow: { when: Actor.Stance == guard AND Actor.PerfectWindowOpen }
        # C011 ADDED — 지금 이 자세가 아직 완벽하게 막을 수 있는 창 안인가.
        # 창의 길이(상수)는 계약에 싣지 않는다 — 열려 있는가/아닌가만 준다.
        # 얼마나 짧은지는 strikeEvents.timing.elapsed 를 여러 번 보며 배운다
      meaning:
        - 막고 있는 존재 중에서도 "방금 세운" 존재는 "세워 두고 버티는" 존재와
          구분되어야 한다 — 그 둘의 결과가 다르기 때문이다
        - 남의 창도 보인다. 상대가 방금 자세를 세웠다면 지금 때리는 것이 손해라는 것을
          읽을 수 있어야 한다 (관찰에 예외를 만들지 않는다 — C007 R2 원칙)

    exposure:                        # C011 ADDED — 이 Cycle 의 새 상태
      exposed: { source: Actor.Exposed }
        # 참이면 이 몸에 닿는 모든 타격이 되받아침이 된다
      until: { source: Actor.ExposedUntil }
        # 그 열림이 가시는 세계 시각. worldTime 과 비교하면 얼마나 남았는지 읽힌다
      meaning:
        - 열린 몸은 열리지 않은 몸과 한눈에 구분되어야 한다 —
          이것을 못 보면 되받아칠 순간을 알 수 없고, 이 Cycle 의 플레이가 없다
        - 남는 시간이 읽혀야 한다. "지금 가면 닿는가" 가 이 값과 자기 스킬 길이의 비교다
        - 열림은 관찰자와 자율 존재를 가리지 않는다 — 같은 계약으로 온다
        - 열려 있어도 하던 행동은 그대로다 (state 는 바뀌지 않는다).
          열림은 받는 결과만 바꾼다

# ─────────────────────────────────────────────────────────────────
# entityHud — 몸에 실리는 관찰 (C011 CHANGED)
#
# C010 은 이름·생명·쓰러짐·막는 중·무너짐을 실었다. 여기에 열림을 더한다.
# "지금 저 몸이 열려 있다" 는 이 Cycle 에서 이름·생명과 같은 급의 정보다 —
# 그것을 모르면 되받아칠 순간이 언제인지 알 수 없다.
# ─────────────────────────────────────────────────────────────────
entityHud:
  forEach: entities.character
  always: true
  shows:
    name: { source: entities.character.name }                    # C007
    health:                                                      # C007
      current: { source: entities.character.vitality.health }
      maximum: { source: entities.character.vitality.healthMaximum }
    downed: { source: entities.character.vitality.downed }       # C007
    guarding: { source: entities.character.stance.guarding }     # C010
    guardBroken: { source: entities.character.stance.broken }    # C010
    exposed: { source: entities.character.exposure.exposed }     # C011 ADDED
  meaning:
    - 싸우는 도중 몸에서 바로 읽혀야 하는 것 — 누구인지, 얼마나 남았는지, 쓰러졌는지,
      막고 있는지, 무너졌는지, 그리고 지금 열려 있는지
    - 열린 순간은 그 몸에서 드러나야 한다 — "지금이 때릴 때다" 를 말해 주는 자리다.
      무너짐(C010)이 상대의 실패를 알리는 표지였다면 열림은 나의 성공을 알리는 표지다
  notShownByDefault:
    - entities.character.attributes
    - entities.character.stance.startedAt      # 시각 그 자체는 몸 위를 채울 값이 아니다.
                                               # 창의 유무(perfectWindow)로 충분하다

# ─────────────────────────────────────────────────────────────────
# strikeEvents — 한 번의 타격이 낳은 결과 (C011 CHANGED — 내역 6 → 11)
#
# C010 은 "무엇이 그 값을 만들었는가" 를 실었다.
# 여기에 "시점이 무엇을 했는가" 가 더해진다. 이것이 이 Cycle 에서 플레이어가
# "왜 이번엔 하나도 안 아팠는가" 를 배우는 자리다.
# ─────────────────────────────────────────────────────────────────
strikeEvents:
  cardinality: many
  source: World.StrikeEvents
  attacker: { source: StrikeEvent.AttackerId }        # C007
  target: { source: StrikeEvent.TargetId }            # C007
  skill: { source: StrikeEvent.SkillKind }            # C007
  at: { source: StrikeEvent.Position }                # C007
  since: { source: StrikeEvent.Time }                 # C007
  amount: { source: StrikeEvent.Amount }              # C007 — 실제로 생명에서 나간 몫
  breakdown:                                          # C010 — 그 값을 만든 내역
    base: { source: StrikeEvent.BaseAmount }
      # C011 CHANGED — 되받아침이면 이 값이 이미 커져 있다.
      # 커지기 전 값은 base - timing.counterBonus 로 되짚는다
    mitigated: { source: StrikeEvent.Mitigated }      # 방어력이 걷어낸 뒤 남은 피해
    guarded: { source: StrikeEvent.Guarded }          # 막아 낸 타격인가 (완벽도 참이다)
    energyPaid: { source: StrikeEvent.CpPaid }        # 막느라 치른 기력
    guardBroken: { source: StrikeEvent.GuardBroken }  # 이 타격으로 방어가 무너졌는가
  timing:                                             # C011 ADDED — 시점이 무엇을 했는가
    perfect: { source: StrikeEvent.PerfectGuard }     # 완벽하게 막아 낸 타격인가
    elapsed: { source: StrikeEvent.GuardElapsed }
      # 자세를 세운 뒤 이 타격이 닿기까지 걸린 시간.
      # 막히지 않은 타격에는 없다(none) — 잴 대상이 없기 때문이다
    counter: { source: StrikeEvent.Counter }          # 되받아친 타격인가
    counterBonus: { source: StrikeEvent.CounterBonus }  # 되받아침이 키운 몫 (아니면 0)
    energyGained: { source: StrikeEvent.CpGained }    # 완벽하게 막아 얻은 기력 (아니면 0)
  meaning:
    - 완벽하게 막은 타격은 그냥 막은 타격과 다르게 읽혀야 한다 —
      생명도 기력도 줄지 않고 오히려 기력이 늘었다는 것이 한 자리에서 보여야 한다
    - elapsed 가 실리는 이유는 플레이어가 창의 크기를 스스로 알아내야 하기 때문이다.
      세계는 상수를 말해 주지 않지만 "이번엔 0.12 라 완벽했고 저번엔 0.31 이라 아니었다" 를
      비교할 수는 있게 한다. 이것이 우연이 아니라는 증거다
      (DC-COMBAT-PLAYER-CAUSALITY — 결과의 원인이 관찰된다)
    - 되받아침은 그것이 키운 몫과 함께 읽혀야 한다 —
      "큰 숫자가 나왔다" 가 아니라 "열려 있었기 때문에 이만큼 커졌다" 로 읽혀야 한다
    - 같은 두 시각이면 언제나 같은 내역이 나온다

# ─────────────────────────────────────────────────────────────────
# debugObserve — C006 계약 그대로 (변경 없음)
# ─────────────────────────────────────────────────────────────────
debugObserve:
  reusedFrom: VIEW-GUARD-TRADES-BODY-FOR-RESOURCE-001

# ─────────────────────────────────────────────────────────────────
# debugAuthority — C007 R2 계약 그대로 (C011 CHANGED — 목록이 길어질 뿐)
# ─────────────────────────────────────────────────────────────────
debugAuthority:
  open: { source: World.DebugAuthority.Open }
  mutableAttributes:
    cardinality: many
    source: MutableAttribute
    attribute: { source: MutableAttribute.Id }
      # C007 8종 + C010 2종 + C011 1종 — exposedFor
    range: { source: MutableAttribute.Range }
  inspect:
    toggle: { owner: observer, default: off }
    forEach: entities.character
    shows: entities.character.attributes
  meaning:
    - View 는 목록을 스스로 만들지 않는다 — 세계가 준 목록 그대로 보여 준다.
      따라서 exposedFor 가 더해져도 View 는 바뀌지 않는다
    - exposedFor 로 아무 몸이나 열어 두면 혼자서도 되받아침을 확인할 수 있다.
      "지금부터 몇 초 동안 열려 있게 한다" 는 뜻이며 0 을 넣으면 그 자리에서 닫힌다
    - 이것이 이 Cycle 의 되받아침을 자율 존재의 공격을 기다리지 않고 재현하는 길이다

# ─────────────────────────────────────────────────────────────────
# interactions — C010 계약 + 사유 하나 (C011 CHANGED)
# ─────────────────────────────────────────────────────────────────
interactions:
  subject: observer-character

  guard:                            # C011 CHANGED — 불가 사유 추가
    role: set-guard-stance
    target: none
    request: SetStance(ObserverCharacter, guard | open)
    current: { source: ObserverCharacter.Stance }
    available: { source: Guard.Availability }
    unavailableReason: { source: Guard.FailureReason }
      # downed | action-busy | insufficient-cp | guard-broken | guard-rearming (C011 ADDED)
    rearmAt: { source: ObserverCharacter.GuardRearmAt }   # C011 ADDED
      # 다시 세울 수 있게 되는 세계 시각. worldTime 과 비교하면 얼마나 남았는지 읽힌다
    meaning:
      - 요청은 여전히 토글이 아니라 명시값이다. View 는 current 를 따라간다
      - 놓는 것(open)은 여전히 언제나 된다. 세우는 것(guard)에 조건이 하나 늘었다
      - **막기를 연타해도 창이 다시 열리지 않는다** — 이미 세워 둔 자세에 같은 요청을
        보내는 것은 아무 일도 하지 않고, 놓았다가 다시 세우는 것에는 간격이 든다.
        그 간격 안에 요청하면 사유가 guard-rearming 으로 온다.
        플레이어가 "왜 지금은 안 되지" 로 남지 않게 하는 자리다
      - 이 Cycle 의 플레이는 이 상호작용을 **언제** 보내는가다.
        무엇을 보내는가는 C010 에서 이미 정해졌다

  # move / mine / attack / skillHeavy / moveMode / setAttribute 는 C010 그대로.
  # attack.profile.damage 는 여전히 "증폭 전 본래 피해" 이며,
  # 실제로 들어가는 값은 상대의 열림·방어력·자세가 정한다 —
  # 그 차이는 strikeEvents.breakdown 과 strikeEvents.timing 에서 확인된다.
  reusedFrom: VIEW-GUARD-TRADES-BODY-FOR-RESOURCE-001

  requestResult: from-next-observation

# ─────────────────────────────────────────────────────────────────
# hud — 관찰자 자신 (C010 계약 + 시점과 열림)
# ─────────────────────────────────────────────────────────────────
hud:
  # inventory / tool / playerAction / worldTime / observers 는 C004·C007 그대로
  self:
    # vitality / moveMode / tempoStats / modifiers / defense 는 C007·C010 그대로
    guard:
      stance: { source: ObserverCharacter.Stance }                 # C010
      broken: { source: ObserverCharacter.GuardBroken }            # C010
      brokenUntil: { source: ObserverCharacter.GuardBrokenUntil }  # C010
      available: { source: Guard.Availability }                    # C010
      unavailableReason: { source: Guard.FailureReason }           # C010
      startedAt: { source: ObserverCharacter.GuardStartedAt }      # C011 ADDED
      perfectWindow: { source: ObserverCharacter.PerfectWindowOpen }  # C011 ADDED
      rearmAt: { source: ObserverCharacter.GuardRearmAt }          # C011 ADDED
    exposure:                                                      # C011 ADDED
      exposed: { source: ObserverCharacter.Exposed }
      until: { source: ObserverCharacter.ExposedUntil }
    meaning:
      - 내 창이 아직 열려 있는지가 늘 눈앞에 있어야 한다.
        읽어야 할 것은 상대의 공격이지 자기 세계의 규칙이 아니다
        (INTENT-PERFECT-GUARD-OBSERVE-001)
      - 다시 세울 수 있게 되는 시각도 눈앞에 있어야 한다 —
        그것이 없으면 재세움 간격은 "가끔 안 먹히는 버튼" 으로만 느껴진다
      - 나도 열릴 수 있다. 이번 Cycle 에서 관찰자를 완벽하게 막을 존재는 없지만
        (자율 존재는 막지 않는다) 다른 관찰자는 막는다 — 계약은 그것을 이미 담는다
      - 완벽하게 막아 번 기력은 vitality.energy 가 늘어나는 것으로 보이고,
        그 원인은 strikeEvents.timing.energyGained 로 설명된다

# ─────────────────────────────────────────────────────────────────
# OBSERVABLE PROJECTION NOTE — 03 의 Observable Semantic 대응
#
#   모든 Actor 에 대해
#     Actor.GuardStartedAt      → entities.character.stance.startedAt
#     Actor.Exposed             → entities.character.exposure.exposed
#                                 · entityHud.shows.exposed
#     Actor.ExposedUntil        → entities.character.exposure.until
#     (그 외 C010·C007 항목 전부) → 각 계약 그대로
#
#   관찰자 자신에 대해 추가로
#     Guard.FailureReason(+guard-rearming) → interactions.guard · hud.self.guard
#     Self.PerfectWindowOpen    → hud.self.guard.perfectWindow
#                                 (+ 모든 몸에 대해 entities.character.stance.perfectWindow)
#     Self.GuardRearmAt         → hud.self.guard.rearmAt · interactions.guard.rearmAt
#     Self.Exposed / ExposedUntil → hud.self.exposure
#
#   세계
#     World.StrikeEvents 11종 내역 → strikeEvents.breakdown + strikeEvents.timing + amount
#     MutableAttribute(+1)         → debugAuthority.mutableAttributes
#
#   투영하지 않는 것
#     시뮬레이션 상수 5종 (PERFECT_GUARD_WINDOW · PERFECT_GUARD_CP_GAIN ·
#     EXPOSED_DURATION · COUNTER_DAMAGE_BONUS · GUARD_REARM_LOCK).
#     C007·C010 과 같은 이유다 — 관찰되는 것은 상수가 아니라 그 상수가 만든 결과다.
#     다만 C010 의 GUARD_FRONT_COS 가 남긴 아쉬움("각도를 맞아 보며 배운다")은
#     여기서 줄어든다 — 세 상수 모두 파생 관찰이 대신하기 때문이다:
#       PERFECT_GUARD_WINDOW  → stance.perfectWindow (참/거짓) + timing.elapsed (수치)
#       EXPOSED_DURATION      → exposure.until 과 worldTime 의 차
#       GUARD_REARM_LOCK      → guard.rearmAt 과 worldTime 의 차
#       PERFECT_GUARD_CP_GAIN → timing.energyGained
#       COUNTER_DAMAGE_BONUS  → timing.counterBonus
#     즉 이 Cycle 의 다섯 상수는 전부 "그 상수가 만든 결과" 로 관찰된다.
#     플레이어가 맞아 보며 배워야 하는 것은 상수가 아니라 상대의 공격 타이밍뿐이며,
#     그것이 이 Cycle 이 배우게 하려는 바로 그 대상이다.
