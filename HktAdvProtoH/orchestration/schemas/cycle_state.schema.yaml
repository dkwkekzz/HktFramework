# cycle_state.yaml 스키마 — Design-AgentExecution.md §18
# Cycle 의 현재 상태는 대화가 아니라 이 파일 하나로 복구 가능해야 한다.
schema: cycle_state
version: 1
fields:
  cycle:
    type: map
    required: true
  cycle.id:
    type: string
    required: true
    pattern: "^C[0-9]{3}$"
  cycle.goal:
    type: string
    required: true
  cycle.mode:
    type: string
    enum: [REAL, DRY_RUN]
  cycle.status:
    type: string
    required: true
    enum: [NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETE]
  cycle.current_stage:
    type: string
    required: true
  cycle.contract:
    type: map
    required: true
  cycle.contract.version:
    type: any
    required: true
  cycle.contract.frozen:
    type: bool
    required: true
  cycle.stage_status:
    type: map
    required: true
  cycle.stage_status.*:
    type: map
  cycle.stage_status.*.status:
    type: string
    required: true
    enum: [NOT_STARTED, IN_PROGRESS, PASS, FAIL, BLOCKED]
  cycle.stage_status.*.task:
    type: string
  cycle.committed_artifacts:
    type: list
    required: true
    item_type: string
  cycle.pending_failures:
    type: list
    required: true
