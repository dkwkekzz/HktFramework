# Version Migration Request 스키마 — Design-AgentExecution.md §34
# Frozen Module 의 기존 Semantic 자체가 잘못된 경우에만 사용한다.
# Extension / New Capability 로 해결 가능한 경우 이 요청은 REJECTED 되어야 한다.
schema: migration_request
version: 1
fields:
  migration_request:
    type: map
    required: true
  migration_request.id:
    type: string
    required: true
    pattern: "^MIG-[A-Z0-9-]+$"
  migration_request.module:
    type: string
    required: true
  migration_request.from_version:
    type: int
    required: true
  migration_request.to_version:
    type: int
    required: true
  migration_request.reason:
    type: string
    required: true
  migration_request.requested_by:
    type: string
    required: true
  migration_request.semantic_changes:
    type: list
    required: true
  migration_request.impact:
    type: list
    item_type: string
  migration_request.status:
    type: string
    required: true
    enum: [PROPOSED, APPROVED, REJECTED, COMPLETE]
