# Verification Result 스키마 — Design-AgentExecution.md §20
# Generator ≠ Verifier. verified_by 는 산출물을 만든 Session 이 아니어야 한다.
schema: verification_result
version: 1
fields:
  verification:
    type: map
    required: true
  verification.task_id:
    type: string
    required: true
  verification.gate:
    type: string
    required: true
  verification.result:
    type: string
    required: true
    enum: [PASS, FAIL]
  # DETERMINISTIC = script, LLM = semantic 판단, MIXED = 둘 다,
  # SIMULATED = dry run 등 실제 runtime 증거 없이 서류상 검증 (실제 Cycle 에서는 금지)
  verification.mode:
    type: string
    required: true
    enum: [DETERMINISTIC, LLM, MIXED, SIMULATED]
  verification.verified_by:
    type: string
    required: true
  verification.evidence:
    type: list
    required: true
  verification.failures:
    type: list
    required: true
  # FAIL 인 경우 orchestration/routing/failure_routes.yaml 의 키여야 한다.
  verification.failure_type:
    type: string
