# Failure Routing 표 — Design-AgentExecution.md §33
# 실패 시 단순 retry 하지 않는다. Failure Type 을 분류하고 책임 Stage 로 Routing 한다.
# verification_result.failure_type 은 이 파일의 키 중 하나여야 한다.
#
# route:  Correction Task 가 생성될 Stage
# skill:  Correction Task 에 적용할 Skill (owner 판단이 필요한 경우 후보 나열)
failure_routes:
  SCOPE_TOO_LARGE:
    route: CYCLE_SCOPE
    skill: cycle-scope
  INTENT_AMBIGUOUS:
    route: INTENT_DESIGN
    skill: intent-design
  SEMANTIC_GAP:
    route: WORLD_SEMANTIC_DESIGN
    skill: world-semantic-design
  SEMANTIC_DUPLICATION:
    route: WORLD_SEMANTIC_DESIGN
    skill: world-semantic-design
  AUTHORITY_VIOLATION:
    route: AUTHORITY_DESIGN_OR_WORLD_IMPLEMENTATION
    skill: contract-design | world-implement
  OBSERVABLE_GAP:
    route: OBSERVATION_DESIGN
    skill: contract-design
  CONTRACT_GAP:
    route: CONTRACT_REVIEW
    skill: contract-design
  WORLD_IMPLEMENTATION_BUG:
    route: WORLD_IMPLEMENTATION
    skill: world-implement
  WORLD_VERIFICATION_FAIL:
    route: WORLD_IMPLEMENTATION_OR_DESIGN_OWNER
    skill: world-implement | world-semantic-design
  VIEW_SPEC_GAP:
    route: GAMEVIEW_SPECIFICATION
    skill: contract-design
  VIEW_BINDING_BUG:
    route: GAMEVIEW_IMPLEMENTATION
    skill: gameview-implement
  GAMEVIEW_VERIFICATION_FAIL:
    route: GAMEVIEW_IMPLEMENTATION
    skill: gameview-implement
  INTEGRATION_FAILURE:
    route: INTEGRATION
    skill: integration
  PLAYABLE_GOAL_FAIL:
    route: OWNING_STAGE_FROM_E2E_TRACE
    skill: playable-verify
  REGRESSION:
    route: MODULE_OWNER_OR_MIGRATION
    skill: module-package

# Correction Flow (§33):
# FAIL → Classify → Create Correction Task → New Isolated Session
#      → Updated Artifact / Implementation → Re-run Verifier → PASS
