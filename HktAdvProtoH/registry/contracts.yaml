# Contract Registry — Versioned/Frozen Contract 의 전역 색인 (§12.3)
# 규칙:
#   - FREEZE_CONTRACT 시 여기에 path + sha256 으로 등록된다.
#   - sha256 이 있는 항목은 verify.mjs frozen 이 매 Gate 마다 불변을 강제한다.
#   - Frozen Contract 변경은 새 버전 발급(VERSION_CONTRACT) → 재검증 → Re-Freeze 로만.
#   - C001 DRY_RUN 항목은 C002 (첫 실제 Cycle) 에서 재검증 후 FROZEN 으로 승격·대체되었다.
contracts:
  CMD-MOVE-V1:
    type: COMMAND
    version: 1
    status: FROZEN
    frozen_by: C002
    path: contracts/commands/CMD-MOVE-V1.yaml
    sha256: 50cbd4a563a05ef53745367c4f79e57af85c1639e90cf13365821e1b4b123a30
  CMD-MINE-V1:
    type: COMMAND
    version: 1
    status: FROZEN
    frozen_by: C002    # C001 DRY_RUN 설계를 재검증해 승격
    path: contracts/commands/CMD-MINE-V1.yaml
    sha256: 885955ca5778b81d9a94d939e585cd3804837d232358bd41c2791f9c7542a61c
  OBS-MINING-V1:
    type: OBSERVABLE
    version: 1
    status: FROZEN
    frozen_by: C002
    path: contracts/observable/OBS-MINING-V1.yaml
    sha256: 223955d34fbb8b6352c4e8682cbd249b70f99bf2e9f93c03f570539640c3fd2a
  VIEW-MINING-001:
    type: GAMEVIEW_SPEC
    version: 1
    status: FROZEN
    frozen_by: C002
    path: contracts/gameview-spec/VIEW-MINING-001.yaml
    sha256: 238b04a7b710b356dd8e38febe4f7ca7873c1aa60200af785ab7d72c26cff9a7
