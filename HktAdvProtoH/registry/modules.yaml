# Module Registry — Cycle 사이에서 공유되는 완료 Capability (§12.2)
# 규칙:
#   - 새 Capability 착수 전 반드시 이 파일을 조회한다. provides 가 있으면 Reuse (Rule 10).
#   - 재사용 대상은 status: FROZEN 만이다.
#   - FROZEN Module 은 직접 수정 금지. path+sha256 을 verify.mjs frozen 이 강제한다.
#   - 변경은 Extension Module 우선, 최후에만 migration_request 로 Version Migration (§34).
#   - C001 DRY_RUN 항목은 C002 (첫 실제 Cycle, Mining) 에서 실구현으로 대체·승격되었다.
modules:
  mining-world-v1:
    type: WORLD_CAPABILITY
    version: 1
    status: FROZEN
    frozen_by: C002
    path: modules/world/mining/v1
    sha256: 8cf1add9dd7a561721d60b4f3fdd262c57886c8a9038ac997a787244b7275b65
    requires:
      - Actor
      - Position
      - Inventory
      - Knowledge
      - Actor.CurrentAction
      - Tool
      - Tool.Capability
      - ResourceDeposit
      - ResourceDeposit.ResourceAmount
      - InteractionRange
      - MoveSpeed
    provides:
      possibilities:
        - ApproachDeposit
        - MineStone
      rules:
        - RULE-MOVE-001
        - RULE-MINE-001
      commands:
        - CMD-MOVE-V1
        - CMD-MINE-V1
      observables:
        - OBS-MINING-V1
  mining-view-v1:
    type: GAMEVIEW
    version: 1
    status: FROZEN
    frozen_by: C002
    path: modules/gameview/mining/v1
    sha256: ec5e0327dd809b4ec7b281b50381df247f80f01b73f16f5e4608f2fb30ffabd0
    consumes:
      - OBS-MINING-V1
    implements:
      - VIEW-MINING-001
