<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HktAdvProtoC — 세계 시뮬레이터</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 64rem; }
      #status { white-space: pre-line; padding: 1rem; background: #f2f2f2; border-radius: 6px; min-height: 4rem; }
      #world { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8rem; line-height: 1.5; margin-top: 1rem; }
      .row { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
      button { padding: 0.4rem 0.8rem; }
      textarea { width: 100%; font-family: inherit; font-size: 0.85rem; }
      fieldset { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1.5rem; }
      #generation { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8rem; line-height: 1.5; }
      #generation details { margin: 0.2rem 0 0.2rem 1.5rem; }
      #generation pre { background: #f7f7f7; padding: 0.5rem; overflow-x: auto; max-height: 20rem; }
      #player { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8rem; line-height: 1.5; }
      #player button { font-family: inherit; font-size: 0.75rem; padding: 0.15rem 0.4rem; margin: 0.1rem 0; }
      #player details { margin: 0.2rem 0 0.2rem 0.5rem; }
      .fail { color: #b00; }
    </style>
  </head>
  <body>
    <h1>HktAdvProtoC — 세계 생성과 시뮬레이션</h1>

    <!-- §36.1 세계 생성 화면 -->
    <fieldset>
      <legend>세계 생성 (§4 입력 → §5 15단계 컴파일)</legend>
      <label for="themes">세계관 주제 (한 줄에 하나)</label>
      <textarea id="themes" rows="5"></textarea>
      <label for="experiences">원하는 경험</label>
      <textarea id="experiences" rows="3"></textarea>
      <label for="prohibited">제외하고 싶은 요소</label>
      <textarea id="prohibited" rows="3"></textarea>
      <div class="row">
        <label for="gen-seed">세계 시드</label>
        <input id="gen-seed" type="number" value="42" />
        <button id="generate">세계를 생성한다</button>
        <button id="use-generated" disabled>생성된 세계로 시뮬레이션 시작</button>
      </div>
      <div id="generation"></div>
    </fieldset>

    <div class="row">
      <label for="seed">세계 시드</label>
      <input id="seed" type="number" value="42" />
      <button id="init">수동 세계로 시작</button>
      <button id="init-player">개입 세계로 시작 (§30·§32 층 포함)</button>
    </div>
    <div class="row">
      <button id="advance-hour" disabled>+1시간</button>
      <button id="advance-day" disabled>+1일</button>
      <button id="advance-week" disabled>+7일</button>
    </div>
    <div id="status"></div>

    <!-- §31 플레이어 개입 — 조작 중에는 화면이 "아는 것"만 그린다 (§36.3) -->
    <fieldset>
      <legend>플레이어 개입 (§30 개입 기회 · §31 동일 행동 체계)</legend>
      <div class="row">
        <label for="player-agent">조작할 주체</label>
        <input id="player-agent" type="text" value="agent.kael" size="24" />
        <button id="attach" disabled>이 주체를 조작한다</button>
        <button id="detach" disabled>조작을 놓는다</button>
      </div>
      <div id="player"></div>
    </fieldset>

    <div id="world"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
