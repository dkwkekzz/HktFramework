<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HktSplatEnv — 환경(정적) 무대</title>
<style>
	html, body { margin: 0; height: 100%; background: #06070f; color: #cdd3e0; font: 13px/1.5 system-ui, sans-serif; overflow: hidden; }
	/* 무대(Spark) 캔버스는 stage.js 가 body 최하단에 삽입한다 (id=stage, inset:0) */
	#view { position: absolute; inset: 0; z-index: 1; touch-action: none; } /* 오빗 입력 오버레이 */
	#ui { position: absolute; left: 12px; top: 12px; z-index: 2; max-width: 46%; pointer-events: none; }
	#ui h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
	#ui p { margin: 0; opacity: 0.72; }
	#fps { position: absolute; right: 12px; top: 12px; z-index: 2; opacity: 0.7; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="view"></div>
<div id="ui">
	<h1>HktSplatEnv — 환경(정적) 무대</h1>
	<p>Spark(WebGL2) 단독. 절차 지형·수면·하늘·Bake 식생을 타일 스트리밍으로 로드한다.<br>
	생명(캐릭터)은 없다 — 무대는 로드/생성한다.<br>
	좌드래그 회전 · 우/Shift드래그 이동 · 휠 줌 · <code>?seed=N</code></p>
</div>
<div id="fps"></div>
<script src="js/math.js"></script>
<script src="js/terrain-gen.js"></script>
<script src="js/world-profile.js"></script>
<script src="js/scatter.js"></script>
<script src="js/vegetation.js"></script>
<script src="js/clouds.js"></script>
<script src="js/env-app.js"></script>
<script type="importmap">
{
	"imports": {
		"three": "./vendor/spark/three.module.min.js",
		"three/addons/postprocessing/Pass.js": "./vendor/spark/Pass.js",
		"@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
	}
}
</script>
<script type="module" src="js/stage.js"></script>
</body>
</html>
