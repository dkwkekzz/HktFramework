<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HktSplatGenesis 에디터</title>
<style>
	html, body { margin: 0; height: 100%; background: #06070f; color: #cfd4e8;
		font: 13px/1.5 system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
	#editor { display: grid; height: 100%;
		grid-template: 'toolbar toolbar toolbar' 42px 'outliner viewport inspector' 1fr
			'timeline timeline timeline' 48px / 216px 1fr 268px; }

	/* ── 툴바 ── */
	#toolbar { grid-area: toolbar; display: flex; align-items: center; gap: 8px; padding: 0 12px;
		background: #0d1020; border-bottom: 1px solid #262a44; }
	#toolbar b { color: #fff; font-size: 13px; margin-right: 4px; }
	#toolbar .sep { width: 1px; height: 22px; background: #262a44; margin: 0 4px; }
	#toolbar #status { margin-left: auto; font-size: 11.5px; color: #9aa3c7; }
	#fps { color: #8be9a8; font-variant-numeric: tabular-nums; font-size: 11.5px; white-space: nowrap; }

	button, select { background: #1b2038; color: #dfe4ff; border: 1px solid #303757;
		border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
	button:hover { background: #262d4e; }
	button.on { background: #33406f; color: #fff; border-color: #5a6cb4; }
	input[type=range] { width: 100%; accent-color: #7a8cff; height: 14px; }
	input[type=number], input[type=text] { background: #1b2038; color: #dfe4ff; border: 1px solid #303757;
		border-radius: 6px; padding: 3px 6px; font-size: 12px; width: 62px; }
	input[type=color] { width: 38px; height: 22px; border: none; background: none; padding: 0; cursor: pointer; }

	/* ── 좌: 아웃라이너 ── */
	#outliner { grid-area: outliner; background: rgba(12, 14, 26, .92); border-right: 1px solid #262a44;
		padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
	.paneTitle { font-size: 11px; color: #9aa3c7; text-transform: uppercase; letter-spacing: .08em; margin: 2px 0 6px; }
	#tree { flex: 1; }
	#tree .item { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 6px;
		cursor: pointer; border: 1px solid transparent; }
	#tree .item:hover { background: #161a30; }
	#tree .item.on { background: #232b52; border-color: #3d466f; }
	#tree .item .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#tree .item .sub { font-size: 10.5px; color: #9aa3c7; }
	#tree .item .del { border: none; background: none; color: #9aa3c7; padding: 0 3px; font-size: 13px; }
	#tree .item .del:hover { color: #ff8f8f; }

	/* ── 중: 뷰포트 ── */
	#viewport { grid-area: viewport; position: relative; overflow: hidden; }
	#gpu { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
	#viewport.place #gpu { cursor: crosshair; }
	#hud { position: absolute; left: 12px; bottom: 10px; pointer-events: none;
		font-size: 11px; color: #9aa3c7; text-shadow: 0 1px 3px #000; line-height: 1.55; }
	#markers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
	.marker { position: absolute; transform: translate(-50%, -50%); pointer-events: auto;
		width: 14px; height: 14px; border-radius: 50%; border: 2px solid #7a8cff;
		background: rgba(122, 140, 255, .18); cursor: grab; box-shadow: 0 0 6px #0009; }
	.marker.on { border-color: #ffb45e; background: rgba(255, 180, 94, .25); }
	.marker.ghost { pointer-events: none; border-style: dashed; border-color: #8be9a8;
		background: rgba(139, 233, 168, .18); width: 18px; height: 18px; }
	.marker.ghost .tag { color: #8be9a8; }
	.marker .tag { position: absolute; left: 16px; top: -4px; font-size: 10.5px; color: #dfe4ff;
		white-space: nowrap; text-shadow: 0 1px 3px #000; pointer-events: none; }

	/* ── 우: 디테일(인스펙터) ── */
	#inspector { grid-area: inspector; background: rgba(12, 14, 26, .92); border-left: 1px solid #262a44;
		padding: 10px 12px; overflow-y: auto; }
	#inspector h2 { font-size: 12px; margin: 12px 0 6px; color: #9aa3c7; }
	#inspector h2:first-child { margin-top: 0; }
	.row { display: grid; grid-template-columns: 84px 1fr 36px; align-items: center; gap: 6px; margin: 3px 0; }
	.row label { opacity: .8; font-size: 11.5px; }
	.row .val { text-align: right; font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
	.inline { display: flex; align-items: center; gap: 8px; margin: 5px 0; flex-wrap: wrap; }
	.inline label { opacity: .8; font-size: 11.5px; }
	.note { margin-top: 8px; font-size: 11px; color: #9aa3c7; opacity: .85; line-height: 1.5; }
	.note b { color: #8be9a8; }
	#drop { margin-top: 8px; border: 1.5px dashed #3d466f; border-radius: 9px; padding: 10px;
		text-align: center; font-size: 11.5px; color: #9aa3c7; cursor: pointer; line-height: 1.5; }
	#drop.hot { border-color: #ff9d6e; background: rgba(255, 157, 110, .08); color: #dfe4ff; }

	/* ── 하: 타임라인 ── */
	#timeline { grid-area: timeline; display: flex; align-items: center; gap: 10px; padding: 0 12px;
		background: #0d1020; border-top: 1px solid #262a44; }
	#timeline .lbl { font-size: 11px; color: #9aa3c7; white-space: nowrap; }
	#tlScrub { flex: 1; }
	#tlTime { font-variant-numeric: tabular-nums; font-size: 11.5px; color: #8be9a8; width: 46px; }
	#tlSpeed { width: 90px; }

	#overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
		background: rgba(4, 5, 12, .92); font-size: 15px; padding: 40px; text-align: center; z-index: 10; }
</style>
</head>
<body>
<div id="editor">
	<div id="toolbar">
		<b>HktSplatGenesis 에디터</b>
		<span class="sep"></span>
		<button id="modeSelect" class="on" title="좌클릭: 마커 선택 · 마커 드래그로 이동">선택</button>
		<button id="modePlace" title="좌클릭: 유령 프리뷰 지점에 팔레트 개체 배치 (Esc = 선택 모드)">배치</button>
		<select id="palette" title="배치 팔레트"></select>
		<span class="sep"></span>
		<select id="count" title="스플랫 풀 크기">
			<option value="32768">32k</option>
			<option value="65536" selected>64k</option>
			<option value="131072">128k</option>
			<option value="262144">256k</option>
		</select>
		<button id="reseed" title="장면 재초기화 (성장 시계 리셋)">재시드</button>
		<span id="status"></span>
		<span id="fps">— fps</span>
	</div>

	<div id="outliner">
		<div class="paneTitle">아웃라이너</div>
		<div id="tree"></div>
		<button id="addObj">+ 팔레트 개체 추가</button>
	</div>

	<div id="viewport">
		<canvas id="gpu"></canvas>
		<div id="markers"></div>
		<div id="hud">좌클릭 드래그 = 회전 · 우클릭(또는 Shift+좌클릭) 드래그 = 이동 · 휠 = 줌 · Alt+드래그 = 끌어당기기<br>
			좌클릭: 마커 = 선택 · 마커 드래그 = 개체 이동 · 배치 모드에서 지형 클릭 = 개체 추가 · Del = 삭제</div>
	</div>

	<div id="inspector">
		<div class="paneTitle">디테일</div>
		<div id="detail"><div class="note">아웃라이너에서 지형 / 스켈레톤 / 개체를 선택하세요.</div></div>
	</div>

	<div id="timeline">
		<button id="tlRewind" title="처음으로 (t=0)">⏮</button>
		<button id="tlPlay" title="재생/일시정지">⏸</button>
		<span id="tlTime">0.0s</span>
		<input type="range" id="tlScrub" min="0" max="60" step="0.05" value="0">
		<span class="lbl">클립</span>
		<select id="tlClip">
			<option value="walk" selected>걷기</option>
			<option value="idle">숨쉬기</option>
			<option value="wave">인사</option>
			<option value="external" id="extOpt" disabled>Mixamo 클립</option>
		</select>
		<span class="lbl">클립 속도</span>
		<input type="range" id="tlSpeed" min="0" max="2.5" step="0.05" value="1">
	</div>
</div>

<div id="overlay"></div>

<!-- vendor: FBX 드롭 전용 (three 는 뼈대 FK 입력만 담당 — 렌더/시뮬은 자체 WebGPU) -->
<script src="vendor/three.min.js"></script>
<script src="vendor/fflate.min.js"></script>
<script src="vendor/FBXLoader.js"></script>
<script src="js/math.js"></script>
<script src="js/heightfield.js"></script>
<script src="js/terrain-gen.js"></script>
<script src="js/genome.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/presets.js"></script>
<script src="js/wgsl.js"></script>
<script src="js/engine.js"></script>
<script src="js/editor.js"></script>
<!-- S 트랙 무대: Spark(WebGL2) + three r180 ESM — vendor/spark/ 로 격리, 전역 THREE(r147)와 혼용 금지 -->
<script type="importmap">
{
	"imports": {
		"three": "./vendor/spark/three.module.min.js",
		"three/addons/postprocessing/Pass.js": "./vendor/spark/Pass.js",
		"@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
	}
}
</script>
<script type="module" src="js/stage.js"></script>
</body>
</html>
