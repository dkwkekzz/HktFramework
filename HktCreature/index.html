<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HktCreature — 코드 리그 + 절차 살 + Mixamo 그대로</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #1a1d24; color: #e6e9ef;
      font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    .panel { position: fixed; top: 12px; left: 12px; width: 232px; max-height: calc(100% - 24px);
      overflow: auto; background: rgba(24,27,34,.82); backdrop-filter: blur(8px);
      border: 1px solid #333a48; border-radius: 12px; padding: 14px; }
    .panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .2px; }
    .panel .sub { font-size: 11px; color: #8c94a6; margin: 0 0 12px; }
    .grp { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase;
      letter-spacing: .6px; color: #7f889c; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button { font: inherit; color: #d6dbe6; background: #262b36; border: 1px solid #3a4150;
      border-radius: 8px; padding: 5px 10px; cursor: pointer; }
    button:hover { background: #2f3542; }
    button.on { background: #3d6cff; border-color: #4f7bff; color: #fff; }
    label.slider { display: grid; grid-template-columns: 44px 1fr 34px; align-items: center;
      gap: 8px; margin: 5px 0; font-size: 12px; }
    label.slider span { color: #aeb6c6; }
    label.slider b { text-align: right; color: #cfd6e4; font-weight: 600; }
    input[type=range] { width: 100%; accent-color: #3d6cff; }
    #dropzone { margin-top: 12px; border: 1px dashed #3a4150; border-radius: 10px;
      padding: 12px; text-align: center; font-size: 11px; color: #8c94a6; }
    #dropzone.hot { border-color: #3d6cff; color: #cfd6e4; background: rgba(61,108,255,.1); }
    #hud { position: fixed; left: 12px; bottom: 12px; padding: 7px 12px;
      background: rgba(24,27,34,.82); border: 1px solid #333a48; border-radius: 999px;
      font-size: 12px; color: #aeb6c6; }
    #hud b { color: #e6e9ef; }
    .foot { position: fixed; right: 12px; bottom: 12px; font-size: 11px; color: #5f677a; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="panel">
    <h1>HktCreature</h1>
    <p class="sub">코드로 지은 스켈레톤 · 절차 살 · Mixamo 그대로</p>

    <div class="grp">애니메이션 (Mixamo)</div>
    <div class="row" id="clips"></div>

    <div class="grp">게놈 — 뼈 비율</div>
    <div id="genome"></div>

    <div class="grp">살</div>
    <div id="flesh"></div>

    <div class="grp">재생</div>
    <div id="speed"></div>

    <div class="grp">표시</div>
    <div class="row">
      <button id="t-flesh">살</button>
      <button id="t-bones">본</button>
      <button id="t-pause">일시정지</button>
    </div>

    <div id="dropzone">Mixamo 애니메이션 FBX 를<br>여기로 드롭 → 그대로 재생</div>
  </div>

  <div id="hud"></div>
  <div class="foot">drag: 회전 · scroll: 줌</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
