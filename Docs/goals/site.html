<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Goal Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    --pillar: #fde68a; --constraint: #fca5a5; --active: #86efac;
    --proposed: #fcd34d; --achieved: #93c5fd;
    --abandoned: #6b7280; --superseded: #c4b5fd;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Noto Sans CJK KR", sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr 420px; height: 100vh; }
  @media (max-width: 1100px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 50vh 50vh; height: auto; }

  .pane { overflow: auto; border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  .pane h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); padding: 12px 14px 4px; margin: 0; }
  #filters { padding: 8px 12px; }
  #filters input, #filters select {
    width: 100%; box-sizing: border-box; margin-bottom: 6px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 8px; border-radius: 4px; font: inherit; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 6px 14px; cursor: pointer; border-left: 3px solid transparent;
    border-bottom: 1px solid var(--line); }
  ul.list li:hover { background: var(--panel); }
  ul.list li.selected { background: var(--panel); border-left-color: var(--accent); }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent);
    margin-right: 6px; }
  .status { display: inline-block; padding: 1px 6px; border-radius: 10px;
    font-size: 11px; margin-left: 6px; background: var(--line); }
  .status.active { background: var(--active); color: #052e16; }
  .status.proposed { background: var(--proposed); color: #422006; }
  .status.achieved { background: var(--achieved); color: #082f49; }
  .status.abandoned { background: var(--abandoned); color: #f9fafb; }
  .status.superseded { background: var(--superseded); color: #2e1065; }
  #graph-pane { background: var(--panel); position: relative; }
  #graph { padding: 16px; min-height: 100%; }
  #graph svg { max-width: 100%; height: auto; }
  #graph .clickable { cursor: pointer; }
  #detail { padding: 14px; }
  #detail h1 { font-size: 18px; margin: 0 0 4px; }
  #detail .meta { color: var(--muted); margin-bottom: 12px; font-size: 12px; }
  #detail .tag { display: inline-block; background: var(--line); color: var(--muted);
    padding: 1px 6px; border-radius: 3px; margin: 2px 4px 2px 0; font-size: 11px; }
  #detail h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 16px 0 6px; border-bottom: 1px solid var(--line);
    padding-bottom: 4px; }
  #detail .actions { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
  #detail button { background: var(--accent); color: #0c4a6e; border: 0;
    padding: 6px 10px; border-radius: 4px; cursor: pointer; font: inherit;
    font-weight: 600; }
  #detail button.secondary { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); }
  #detail a { color: var(--accent); text-decoration: none; word-break: break-all; }
  #detail a:hover { text-decoration: underline; }
  #detail pre { background: var(--panel); padding: 8px; border-radius: 4px;
    white-space: pre-wrap; word-break: break-word; }
  #detail ul { padding-left: 18px; }
  #detail .copied { color: var(--active); font-weight: 600; margin-left: 8px; }
  .header { padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; }
  .header span { color: var(--muted); font-size: 12px; }
</style>
</head>

  <div class="pane" id="graph-pane">

  </div>
</div>

, {"id": "G-0030", "title": "LLM 기반 게임플레이 월드 제작 — 컨셉 입력에서 지형/스토리/에셋 자동 생성", "status": "active", "tags": ["pillar:authoring"], "parents": [], "children": ["G-0118", "G-0119", "G-0120", "G-0121", "G-0122", "G-0123", "G-0124"], "constraints": [], "superseded_by": null, "intent": "게임 컨셉 텍스트 1회 입력으로 지형 / 스토리 / 캐릭터 / 아이템 / VFX / 텍스처 / 스프라이트 / Paper2D 어셋을 자동 생성. 기획자·아티스트 인력 부담 감소, 빠른 프로토타이핑 가능.\n\n8-step pipeline 을 MCP 서버 경유로 UE5 에디터에서 실행 (`HktGameplayGenerator/CLAUDE.md` §Generator Pipeline):\n\n```\nconcept_design → feature_design → [parallel Worker Agents per feature]\n                                       ├── story_generation\n                                       ├── asset_discovery\n                                       └── char/item/vfx/texture-gen\nconcept_design → map_generation  (parallel with feature_design)\n```\n\n스텝 간 데이터는 `.hkt_steps/{project_id}/{step_type}/output.json` 파일을 통해 전달되고, feature 단위 작업은 `features/{feature_id}/work.json` 으로 충돌을 방지한다.\n\n런타임 통신 흐름: LLM 클라이언트 → JSON-RPC(stdio) → Python MCP 서버(`hkt_mcp.server`) → Remote Control API / WebSocket → UE5 에디터. 별도 Monolith MCP 프록시(`monolith_client.py`) 의 도구는 동적 병합되며, 연결 실패 시 무시한다.\n\n생성 어셋의 출력 경로는 Convention Path 규칙(`HktGameplayGenerator/CLAUDE.md` §Tag 시스템) 으로 결정되며, 런타임 로딩은 GameplayTag → DataAsset 비동기 로드(`UHktAssetSubsystem::LoadAssetAsync`) 로 분리한다 (G-0020 의존).", "success_criteria": [{"description": "8-step pipeline 이 컨셉 입력 1회로 완주 (각 step output.json 산출)", "measurable": true, "measure": "`.hkt_steps/{project_id}/manifest.json` 의 모든 step status=done, feature 별 stories/assets 완료 수가 FeatureStatus 와 일치"}, {"description": "생성된 HktMap JSON 이 HktMapGenerator 빌드 통과 (Landscape/Spawner/Region 구성 산출)", "measurable": false, "measure": "수동 — 빌드 후 UE5 에디터에서 Landscape / Spawner / Region 액터 확인"}, {"description": "생성된 Story JSON Schema 2 가 V2 동등성 테스트 통과", "measurable": true, "measure": "HktAutomationTests `HktCore.Story.V2.*.Equivalent` 카테고리 전 항목 pass"}, {"description": "`UHktGeneratorRouter` 가 Tag prefix 별 Generator 핸들 FunctionLibrary — 베이킹 진입점"}, {"path": "HktGameplay/Source/HktVoxelSkin/Public/HktVoxelSkinLayerAsset.h", "role": "캐릭터 파츠 레이어 DataAsset"}, {"path": "HktGameplay/Source/HktVoxelSkin/Public/HktVoxelPalette.h", "role": "팔레트 (인덱스 → 색)"}, {"path": "HktGameplay/Source/HktVoxelSkin/Private/HktVoxelMeshVoxelizer.h", "role": "외부 메시 → 보크셀화"}, {"path": "HktGameplay/Source/HktVoxelSkin/HktVoxelSkin.Build.cs", "role": "bBuildEditor 가드 — UnrealEd Editor-only"}], "related_docs": ["Docs/SkeletalDeconstructGuide.md", "Docs/Design-SkeletalDeconstruct.md"], "rationale": "", "alternatives_considered": []}, {"id": "G-0113", "title": "2D 스프라이트 렌더 품질 — PostProcess/AA + 텍스처 임포트 파이프라인 규격", "status": "active", "tags": ["layer:rendering"], "parents": ["G-0020"], "children": [], "constraints": [], "superseded_by": null, "intent": "스프라이트 외곽선·픽셀 무결성을 깨뜨리는 두 부류의 엔진 기본값을 일관된 정책으로 고정한다 — (1) 카메라 이동 시 픽셀이 뭉개지는 PostProcess/Anti-Aliasing 동작, (2) 알파 외곽선에 찌꺼기를 만드는 텍스처 압축·밉맵 동작.\n\n본 프로젝트의 기준 톤은 **일러스트/카툰** (Filter=Bilinear) 이며, atlas 단위 픽셀 무결성 + 일정한 톤을 보증한다. 정책은 (a) 콘텐츠 측 수입 자산, (b) `HktSpriteGenerator` 자동 생성 자산 양쪽에 동일하게 적용 — 두 진입점 정책 분기 0.\n\n1. **Anti-Aliasing 정책** — TSR 누적 블렌딩 잔상 제거. `r.AntiAliasingMethod=0` (또는 동등 대안) 을 `Config/DefaultEngine.ini [SystemSettings]` 에 고정.\n2. **PostProcess Volume Manual 고정** — 기본 PPV 가 `AutoExposureMethod=AEM_Manual` + `AutoExposureBias=0` + ColorGrading `Saturation=1.0, Gain=1.0`. SystemSettings 단독은 톤매퍼 차단 불완전 — PPV 와 병행.\n3. **Tonemapper Linear Passthrough** — `r.TonemapperFilm=0`. HDR 디스플레이 / 포스트 LUT 사용 포기 (트레이드오프 명시).\n4. **텍스처 압축 정책** — 스프라이트 atlas 는 `UserInterface2D(RGBA)` 또는 `BC7`. Default(DXT1/5) 0.\n5. **밉맵 정책** — atlas 는 `MipGenSettings=NoMipmaps`.\n6. **필터·텍스처 그룹** — 기본 `Filter=TF_Bilinear` + `TextureGroup=TEXTUREGROUP_Pixels2D`. 픽셀아트 자산은 자산 단위 `TF_Nearest` 오버라이드 허용.\n7. **Generator ↔ 콘텐츠 정책 동등성** — `HktSpriteGeneratorFunctionLibrary` 가 atlas 자동 생성 시 동일 정책 적용. 현재 `TF_Nearest` 박혀있어 정책 (Bilinear 기본) 과 어긋남 — 봉사 작업으로 정합화 필요.", "success_criteria": [{"description": "r.AntiAliasingMethod=0 (또는 동등 대안) 권장값이 본 플러그인 README 에 안내됨 — 외부 프로젝트가 Config/DefaultEngine.ini 에 박는 것이 정책", "measurable": true, "measure": "grep -n 'r\\.AntiAliasingMethod' HktGameplay/README.md → \"2D 렌더 품질 설정 (G-0113)\" 섹션에 명시. 외부 프로젝트 측 실제 적용 여부는 본 저장소 자동 측정 영역 외"}, {"description": "r.TonemapperFilm=0 권장값이 본 플러그인 README 에 안내됨 — 외부 프로젝트 박기 정책", "measurable": true, "measure": "grep -n 'r\\.TonemapperFilm' HktGameplay/README.md → 0 명시. 외부 프로젝트 측 실제 적용은 본 저장소 측정 영역 외"}, {"description": "기본 게임모드/레벨 PPV 가 Manual Exposure + ColorGrading 1.0", "measurable": false, "measure": "자산 리뷰 — 기본 PPV 자산에 AutoExposureMethod=AEM_Manual, AutoExposureBias=0, ColorGrading.Saturation=1.0, ColorGrading.Gain=1.0"}, {"description": "스프라이트 atlas 텍스처 압축이 UserInterface2D 또는 BC7 — Default(DXT1/5) 0", "measurable": true, "measure": "HktGameplay/Content 내 atlas 텍스처의 CompressionSettings ∈ {TC_EditorIcon, TC_BC7} — Editor 검증 스크립트 (미구현)"}, {"description": "스프라이트 atlas 텍스처 MipGenSettings=TMGS_NoMipmaps", "measurable": true, "measure": "동일 자산 메타 — Editor 검증 스크립트 (미구현)"}, {"description": "스프라이트 atlas 텍스처 기본 Filter=TF_Bilinear + LODGroup=TEXTUREGROUP_Pixels2D", "measurable": true, "measure": "동일 자산 메타 (자산 단위 TF_Nearest 오버라이드는 허용·기록) — Editor 검증 스크립트 (미구현)"}, {"description": "HktSpriteGenerator 자동 생성 atlas 의 임포트 정책이 콘텐츠 정책과 동일", "measurable": true, "measure": "HktSpriteGeneratorFunctionLibrary.cpp 에서 CompressionSettings=TC_EditorIcon, Filter=TF_Bilinear, MipGenSettings=TMGS_NoMipmaps, LODGroup=TEXTUREGROUP_Pixels2D — 코드 리뷰 (현재 Filter=TF_Nearest, 정합화 필요)"}, {"description": "텍스처 임포트 정책이 자동 적용되는 진입점 (Import Preset / UAssetImportData 후처리) 존재", "measurable": false, "measure": "코드 리뷰 — 신규 atlas 임포트 시 위 항목이 자동 적용·경고되는 메커니즘 (수작업 의존 0)"}], "realizes": [{"path": "HktGameplay/README.md", "role": "2D 렌더 품질 설정 (G-0113) 섹션 — 외부 프로젝트 측 ini / PPV 권장값 + 본 플러그인 텍스처 정책 안내"}, {"path": "HktGameplay/Source/HktSpriteCore", "role": "스프라이트 캐릭터 atlas 텍스처 임포트 정책 적용 대상"}, {"path": "HktGameplay/Source/HktSpriteTerrain", "role": "스프라이트 지형 atlas 텍스처 임포트 정책 적용 대상"}, {"path": "HktGameplayGenerator/Source/HktSpriteGenerator/Private/HktSpriteGeneratorFunctionLibrary.cpp", "role": "자동 생성 atlas 의 임포트 정책 적용 진입점 (CompressionSettings / Filter / MipGen / LODGroup)"}], "related_docs": [], "rationale": "", "alternatives_considered": []}, {"id": "G-0117", "title": "Sprite 기반 지형 렌더링 — TerrainSubsystem 청크에서 top-surface 만 추출하여 단일 HISM 인스턴싱", "status": "active", "tags": ["layer:terrain", "layer:rendering", "perf"], "parents": ["G-0020"], "children": [], "constraints": ["G-0006"], "superseded_by": null, "intent": "Voxel 메싱 파이프라인 (G-0109) 은 GPU 직접 업로드 + Greedy 병합으로 성능이 좋지만 셰이더·머티리얼·LOD 인프라가 무겁다. **Sprite-only 배포 / 모바일 / 디버그 / iso 카메라** 환경에서는 청크당 1 인스턴스 빌보드가 더 적합 — Voxel 의존 없이 단독 동작.\n\n핵심 구조.\n\n1. **TerrainSubsystem 단일 출처 경유** — `UHktTerrainSubsystem::AcquireChunk` 로 청크 voxel 버퍼 획득. baked-first → Generator 폴백 (G-0006). `FHktTerrainGenerator` 직접 인스턴스화 0.\n2. **HktVoxelCore 의존 0** — `FHktVoxelRenderCache` / Greedy meshing 우회. `FHktTerrainVoxel[32768]` 직접 스캔.\n3. **단일 HISM, 청크당 1 인스턴스** — top-most non-empty voxel 만 추출 (`FHktSpriteTerrainSurfaceCell`). Diff 기반 Add/Update/Remove 로 카메라 이동 시 점진 갱신.\n4. **공유 ChunkLoader** — `IHktTerrainChunkLoader` (Legacy / Proximity) 를 Voxel 경로와 동일하게 사용.\n5. **머티리얼 측 빌보드** — `M_HktSpriteTerrainBillboard` (Z-up quad, 지면 평면). HktSpriteCore 의 캐릭터 빌보드 (`M_HktSpriteYBillboard`, Y-axis) 와 별개.\n6. **ComponentZBias 로 Crowd 와 정렬** — Terrain = 0 (베이스라인), Crowd = +1cm. 머티리얼 WPO 가 cm 단위로 카메라 쪽 밀어내며 depth-buffer 반영.", "success_criteria": [{"description": "HktSpriteTerrain.Build.cs 가 HktVoxelCore 미의존", "measurable": true, "measure": "grep '\"HktVoxelCore\"' HktGameplay/Source/HktSpriteTerrain/HktSpriteTerrain.Build.cs → 0"}, {"description": "청크 voxel 획득이 UHktTerrainSubsystem::AcquireChunk 단일 경로", "measurable": true, "measure": "G-0006 success_criteria 재사용 — grep -rE 'FHktTerrainGenerator[^A-Za-z_]' HktGameplay/Source/HktSpriteTerrain → 0"}, {"description": "청크당 1 HISM 인스턴스 — top-surface cell 만 추출  "rationale": "", "alternatives_considered": []}, {"id": "G-0118", "title": "MCP 서버 ↔ UE5 에디터/런타임 브릿지 — LLM 에이전트 통신 인프라", "status": "active", "tags": ["system:authoring"], "parents": ["G-0030"], "children": [], "constraints": [], "superseded_by": null, "intent": "LLM 에이전트와 UE5 에디터/런타임 사이의 통신 인프라. 에이전트는 JSON-RPC(stdio) 로 Python MCP 서버에 도구를 호출하고, 서버는 두 채널 — Remote Control API(에디터) / WebSocket(런타임) — 으로 UE5 측에 위임한다. 외부 Monolith MCP 프록시가 살아 있으면 도구가 동적으로 병합되며, 죽어 있어도 무시한다 (선택 의존).\n\nC++ 측 브릿지는 두 모듈로 분리: `HktMcpBridge` 는 런타임 최소 표면 (WebSocket 서버 + RPC 처리), `HktMcpBridgeEditor` 는 에디터 전용 어셋 레지스트리 / 생성 상태 (`EHktGenerationStatus`) 노출. 데이터 구조 (`FMcpRpcRequest/Response`, `FHktAssetInfo`, `FHktActorInfo`) 는 UE5 ↔ Python JSON 페이로드 계약.\n\n이 목표는 G-0030 의 통신 계층 — 상위 파이프라인 (G-0119) 및 어셋 Generator (G-0120) 가 의존한다.", "success_criteria": [{"description": "MCP 서버 부팅 시 50+ 도구 등록 완료", "measurable": true, "measure": "`python -m hkt_mcp.server` stdout 의 도구 등록 로그 카운트 ≥ 50"}, {"description": "McpServer 단위 테스트 통과", "measurable": true, "measure": "`cd McpServer && pytest` 종료 코드 0"}, {"description": "UE5 에디터에서 Remote Control 호출이 성공적으로 라우팅", "measurable": false, "measure": "수동 — `UHktMcpEditorSubsystem` 로그로 요청/응답 페어 확인"}, {"description": "Monolith 프록시 미가용 시 서버는 정상 기동 (연결 실패 무시)", "measurable": true, "measure": "`MONOLITH_URL` 미설정 / 포트 닫힘 상태에서 `pytest` 의 monolith 통합 테스트 skip 처리 + 서버 부팅 stderr 무경고"}], "realizes": [{"path": "HktGameplayGenerator/McpServer", "role": "Python MCP 서버 패키지 (`hkt_mcp`)"}, {"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/server.py", "role": "진입점 — 50+ MCP 도구 등록, JSON-RPC stdio 핸들링"}, {"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/config.py", "role": "환경변수 기반 `McpConfig` (UE_PROJECT_PATH / HKT_STEPS_DIR / SD_WEBUI_URL / MONOLITH_URL)"}, {"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/bridge/editor_bridge.py", "role": "Remote Control API 클라이언트 — UE5 에디터 호출"}, {"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/bridge/runtime_bridge.py", "role": "WebSocket 런타임 게 Store` 가 manifest + 모든 step output.json 을 atomic 으로 영속", "measurable": true, "measure": "McpServer `pytest` 의 store 테스트 (StepStore.create_project / mark_step_complete) 통과"}, {"description": "8 step 이 컨셉 입력 1회로 모두 status=completed 도달", "measurable": true, "measure": "`.hkt_steps/{project_id}/manifest.json` 의 모든 step `StepStatus=completed`, FeatureStatus 의 stories/assets 카운트가 expected 와 일치"}, {"description": "feature 단위 Worker 가 `work.json` 으로 충돌 없이 병렬 실행", "measurable": false, "measure": "수동 — `full-pipeline` 으로 2+ feature 병렬 실행 후 `features/{id}/work.json` 의 lock/timestamp 검증"}, {"description": "스텝 실패가 정확히 manifest 에 기록", "measurable": true, "measure": "강제 실패 케이스에서 `manifest.steps[type].status=failed` + `error_message` 기록 확인"}], "realizes": [{"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/steps/models.py", "role": "`StepType` / `StepStatus` enum, `STEP_SCHEMAS`, `StepManifest` / `StepResult` dataclass"}, {"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/steps/store.py", "role": "`StepStore` — `.hkt_steps/` 파일 기반 영속 (manifest CRUD + atomic JSON write)"}, {"path": "HktGameplayGenerator/McpServer/src/hkt_mcp/tools/step_tools.py", "role": "스텝 시작/완료/실패 MCP 도구 (`step_start` / `step_complete` / `step_fail`)"}, {"path": "HktGameplayGenerator/.claude/skills/concept-design", "role": "1단계 — 컨셉 텍스트 → terrain_spec + feature_outlines"}, {"path": "HktGameplayGenerator/.claude/skills/feature-design", "role": "2단계 — feature_outlines 상세화 (스토리/예상 에셋/맵 요구사항)"}, {"path": "HktGameplayGenerator/.claude/skills/feature-worker", "role": "feature 단위 Worker 에이전트 — story → asset_discovery → asset 생성"}, {"path": "HktGameplayGenerator/.claude/skills/full-pipeline", "role": "전체 파이프라인 오케스트레이션 — Worker 병렬 스폰"}, {"path": "HktGameplayGenerator/.claude/skills/story-gen", "role": "feature 별 Story JSON 생성·빌드 스텝"}, {"path": "HktGameplayGenerator/.claude/skills/asset-discovery", "role": "Story 결과에서 캐릭터/아이템/VFX 명세 도출"}, {"path": "HktGameplayGenerator/.claude/skills/char-gen", "role": "캐릭터 메시 + 애니메이션 =Cs` / `✅ ALL PASSED (iters=N, fixed_files=[...])` 또는 `⚠️ STOPPED at iter N` 준수"}, {"description": "동일 실패 2 회 연속 반복 시 자동 중단", "measurable": false, "measure": "수동 — 의도적으로 미해결 실패를 두고 max_iterations=10 호출, 2 iter 만에 중단되는지 확인"}, {"description": "환경 설정 미설정 시 사용자 안내 후 즉시 종료", "measurable": true, "measure": "test-fix.md §1 환경 검증 단계 — `.hkt-test.env` 부재 시 안내 메시지 출력 후 exit 1"}], "realizes": [{"path": "HktGameplayDeveloper/.claude/commands/test-fix.md", "role": "/test-fix 슬래시 커맨드 — 인자 (filter / max_iter), 실행 절차, 종료 조건 명세"}], "related_docs": ["HktGameplayDeveloper/Tools/README.md"], "rationale": "", "alternatives_considered": []}, {"id": "G-1000", "title": "스프라이트 애니 상태기계 — Paper / Crowd 가 동일 결정 함수를 공유한다", "status": "active", "tags": ["layer:character"], "parents": ["G-0108"], "children": [], "constraints": ["G-0003", "G-0004"], "superseded_by": null, "intent": "세 렌더 경로 (Paper / HISM / Niagara) 가 동일 캐릭터에 동일 시각 결과를 산출하려면 애니 의사결정이 한 곳에 모여야 한다. 결정 함수가 두 벌이면 시간이 가며 분기되고 캐릭터별 검수가 두 배가 된다.\n\n핵심 분리.\n\n1. **Processor 는 캐릭터 데이터 미의존** — 입력은 `FHktSpriteAnimFragment` (POD) 만, 출력은 `(AnimTag, PlayRate)`. CharacterTemplate (Sprite/Paper) 헤더 미참조. 두 경로가 동일 결정 함수 호출.\n2. **태그 계층 우선순위 고정** — `Anim.Montage.* > Anim.UpperBody.* > Anim.FullBody.* > Locomotion 합성`. `UHktAnimInstance` 와 동일 규약.\n3. **권위는 서버 VM** — `AnimStartTick` 은 서버 VM 이 `PropertyId::AnimStartTick` 으로 권위 기록. 클라 Fragment 미저장. Crowd Host 가 `LastAuthoritativeAnimStartTick` 로 변화 감지 → `AnimStartLocalMs` 캡처 (G-0003).\n4. **카메라 yaw 합성은 클라** — Facing 은 매 프레임 `(atan2(LastMoveDirXY), CameraYaw)` 로 재산출. 카메라 회전에 자연스러움.", "success_criteria": [{"description": "HktSpriteAnimProcessor 가 CharacterTemplate 헤더 미의존", "measurable": true, "measure": "grep -E '#include.*(HktSpriteCharacterTemplate|HktPaperCharacterTemplate)' HktGameplay/Source/HktSpriteCore/Public/HktSpriteAnimProcessor.h HktGameplay/Source/HktSpriteCore/Private/HktSpriteAnimProcessor.cpp → 0"}, {"description": "클라 FHktSpriteAnimFragment 가 AnimStartTick 미보유 — 서버 VM 권위", "measurable": tru <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
(() => {
  const dataEl = document.getElementById("goal-data");
  const DATA = JSON.parse(dataEl.textContent);
  const goalsById = Object.fromEntries(DATA.goals.map(g => [g.id, g]));
  const allTags = [...new Set(DATA.goals.flatMap(g => g.tags))].sort();

  // --- 필터 UI 초기화 ---
  const tagSelect = document.getElementById("tag-filter");
  for (const t of allTags) {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    tagSelect.appendChild(o);
  }

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const qEl = document.getElementById("q");
  const statusEl = document.getElementById("status-filter");

  let selectedId = null;

  function passes(g) {
    const q = qEl.value.trim().toLowerCase();
    if (q && !(g.id.toLowerCase().includes(q)
              || g.title.toLowerCase().includes(q)
              || (g.intent || "").toLowerCase().includes(q))) return false;
    if (statusEl.value && g.status !== statusEl.value) return false;
    if (tagSelect.value && !g.tags.includes(tagSelect.value)) return false;
    return true;
  }

  function renderList() {
    const filtered = DATA.goals.filter(passes);
    countEl.textContent = `${filtered.length} / ${DATA.goals.length}`;
    listEl.innerHTML = "";
    for (const g of filtered) {
      const li = document.createElement("li");
      li.dataset.id = g.id;
      if (g.id === selectedId) li.className = "selected";
      li.innerHTML = `<span class="id">${g.id}</span>${escape(g.title)}`
                   + ` <span class="status ${g.status}">${g.status}</span>`;
      li.addEventListener("click", () => select(g.id));
      listEl.appendChild(li);
    }
  }

  function escape(s) {
    return (s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function goalLink(id) {
    const g = goalsById[id];
    const title = g ? g.title : "(없음)";
    return `<a href="#" data-goto="${id}">${id}</a> ${escape(title)}`;
  }

  function renderDetail(g) {
    const detail = document.getElementById("detail");
    if (!g) {
      detail.innerHTML = `<p style="color:var(--muted);padding:20px">선택 없음.</p>`;
      return;
    }
    const sc = (g.success_criteria || []).map(c => {
      const mark = (c.achieved || c.met) ? "✓" : "·";
      return `<li><strong>[${mark}]</strong> ${escape(c.description || "")}`
           + (c.measure ? `<br><small style="color:var(--muted)">측정: ${escape(c.measure)}</small>` : "")
           + `</li>`;
    }).join("") || "<li><em>(없음)</em></li>";

    const realizes = (g.realizes || []).map(r => {
      const path = escape(r.path || "");
      const role = r.role ? `<small style="color:var(--muted)"> — ${escape(r.role)}</small>` : "";
      return `<li><code>${path}</code>${role}</li>`;
    }).join("") || "<li><em>(없음)</em></li>";

    const tags = (g.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join("");
    const linkRow = (label, ids) => {
      if (!ids || !ids.length) return "";
      return `<p><strong>${label}:</strong> ${ids.map(goalLink).join(" · ")}</p>`;
    };

    detail.innerHTML = `
      <h1>${g.id} <span style="color:var(--muted)">·</span> ${escape(g.title)}</h1>
      <div class="meta">
        <span class="status ${g.status}">${g.status}</span> ${tags}
      </div>
      <div class="actions">
        <button data-copy="serve">/goal serve ${g.id}</button>
        <button data-copy="show" class="secondary">/goal show ${g.id}</button>
        <button data-copy="prompt" class="secondary">자연어 프롬프트 복사</button>
        <span id="copied-msg" class="copied" style="display:none">복사됨</span>
      </div>
      ${linkRow("parents", g.parents)}
      ${linkRow("children", g.children)}
      ${linkRow("constraints", g.constraints)}
      <h2>Intent</h2>
      <pre>${escape(g.intent || "(미작성)")}</pre>
      <h2>Success Criteria</h2>
      <ul>${sc}</ul>
      <h2>Realizes</h2>
      <ul>${realizes}</ul>
      ${g.rationale ? `<h2>Rationale</h2><pre>${escape(g.rationale)}</pre>` : ""}
    `;

    detail.querySelectorAll("[data-goto]").forEach(el => {
      el.addEventListener("click", e => {
        e.preventDefault();
        select(el.dataset.goto);
      });
    });
    detail.querySelectorAll("[data-copy]").forEach(btn => {
      btn.addEventListener("click", () => copyHandoff(g, btn.dataset.copy));
    });
  }

  function copyHandoff(g, kind) {
    let text;
    if (kind === "serve") {
      text = `/goal serve ${g.id}`;
    } else if (kind === "show") {
      text = `/goal show ${g.id}`;
    } else {
      // 자연어 프롬프트 — Goal ID + intent 요약을 LLM 에 한 번에 던짐
      const intent = (g.intent || "").trim().split(/\n+/).slice(0, 3).join(" ");
      text = `${g.id} (${g.title}) 봉사 작업 시작해줘. `
           + `Goal 본문은 Docs/goals/${g.id}.md 를 참조하고, `
           + `serve-context 로 constraints 와 realizes 를 먼저 로드해줘.`
           + (intent ? `\n\n의도: ${intent}` : "");
    }
    navigator.clipboard.writeText(text).then(() => {
      const m = document.getElementById("copied-msg");
      if (m) {
        m.style.display = "inline";
        setTimeout(() => { m.style.display = "none"; }, 1200);
      }
    });
  }

  function select(id) {
    selectedId = id;
    renderList();
    renderDetail(goalsById[id]);
    highlightGraph(id);
  }

  function highlightGraph(id) {
    const svg = document.querySelector("#graph svg");
    if (!svg) return;
    svg.querySelectorAll(".node").forEach(n => {
      n.style.outline = "";
      n.style.filter = "";
    });
    const target = svg.querySelector(`.node[id^="flowchart-${id.replace("-","")}-"]`);
    if (target) {
      target.style.filter = "drop-shadow(0 0 6px var(--accent))";
      target.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
    }
  }

  // --- 필터 이벤트 ---
  qEl.addEventListener("input", renderList);
  statusEl.addEventListener("change", renderList);
  tagSelect.addEventListener("change", renderList);

  // --- Mermaid 렌더 ---
  mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
  mermaid.render("graph-svg", DATA.mermaid).then(({ svg, bindFunctions }) => {
    document.getElementById("graph").innerHTML = svg;
    if (bindFunctions) bindFunctions(document.getElementById("graph"));
    // 노드 클릭 → select
    document.querySelectorAll("#graph .node").forEach(n => {
      n.classList.add("clickable");
      n.addEventListener("click", () => {
        // Mermaid id 패턴: flowchart-{nodeId}-{n}, nodeId = G0107 형태
        const m = n.id.match(/flowchart-(G\d+)-/);
        if (!m) return;
        const raw = m[1];
        const goalId = "G-" + raw.slice(1).padStart(4, "0");
        if (goalsById[goalId]) select(goalId);
      });
    });
  }).catch(err => {
    document.getElementById("graph").innerHTML =
      `<p style="color:var(--muted);padding:20px">그래프 로딩 실패 (오프라인일 수 있음). 좌측 목록과 우측 본문은 동작합니다.<br><small>${escape(err.message || err)}</small></p>`;
  });

  // --- 초기 렌더 ---
  renderList();
  if (DATA.goals.length) select(DATA.goals[0].id);
})();
</script>
