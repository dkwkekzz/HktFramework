<!doctype html>
<!-- MR step 뷰어 — 설계: site.md. 단일 파일, 의존성 0.
     step 발견: GitHub API 자동 + FALLBACK_STEPS 폴백 (step을 닫을 때 폴백에 한 줄 추가). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MR — emergent world steps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="github-repo" content="dkwkekzz/HktFramework">
<style>
  :root {
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent-deep:#0c4a6e;
    --ok:#86efac; --warn:#fcd34d; --topbar-h:48px;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
         "Noto Sans CJK KR", sans-serif;
  }
  body { height:100vh; display:flex; flex-direction:column; }
  a { color:var(--accent); }

  /* topbar */
  #topbar {
    height:var(--topbar-h); flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:0 12px; border-bottom:1px solid var(--line);
  }
  #topbar .brand { font-weight:600; cursor:pointer; white-space:nowrap; }
  #topbar .brand .sub { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px; }
  #topbar .spacer { flex:1; }
  #src-indicator { font-size:11px; color:var(--muted); white-space:nowrap; }
  #src-indicator.live { color:var(--ok); }
  #topbar a.gh { font-size:12px; text-decoration:none; color:var(--muted); }
  #topbar a.gh:hover { color:var(--text); }

  /* landing */
  #landing { flex:1; overflow-y:auto; padding:20px; }
  #landing .head { max-width:980px; margin:0 auto 16px; }
  #landing .head h1 { font-size:18px; margin:0 0 6px; }
  #landing .head p { color:var(--muted); margin:0; line-height:1.5; font-size:13px; }
  #cards {
    max-width:980px; margin:0 auto; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  }
  .step-card {
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:6px;
    transition:border-color .12s, transform .12s, box-shadow .12s;
  }
  .step-card:hover {
    border-color:var(--accent); transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .step-card .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .step-card .sid {
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    color:var(--accent); font-weight:600; font-size:13px;
  }
  .badge {
    font-size:10px; padding:1px 6px; border-radius:8px;
    background:var(--line); color:var(--muted);
  }
  .badge.demo { background:var(--accent-deep); color:var(--accent); }
  .badge.doc { background:#14532d; color:var(--ok); }
  .step-card h2 { font-size:14px; margin:0; line-height:1.4; font-weight:600; }
  .step-card .sum {
    color:var(--muted); font-size:12px; line-height:1.5; margin:0;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* viewer */
  #viewer { flex:1; min-height:0; display:flex; flex-direction:column; }
  #viewer-bar {
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  #viewer-bar button {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    padding:5px 12px; border-radius:4px; cursor:pointer; font:inherit; font-size:12px;
  }
  #viewer-bar button:hover:not(:disabled) { background:var(--panel2); }
  #viewer-bar button.active { border-color:var(--accent); background:var(--accent-deep); }
  #viewer-bar button:disabled { opacity:.35; cursor:not-allowed; }
  #viewer-bar .vtitle {
    font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; min-width:0; flex:1;
  }
  #viewer-bar .vtitle .sid { color:var(--accent); font-weight:600; margin-right:6px;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  #viewer-bar .nav { display:flex; gap:4px; }
  #demo-frame { flex:1; min-height:0; border:0; width:100%; background:#fff; }
  #doc-pane { flex:1; min-height:0; overflow-y:auto; padding:20px; }
  #doc-pane .md { max-width:860px; margin:0 auto; line-height:1.65; }
  .md h1 { font-size:20px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .md h2 { font-size:17px; margin-top:28px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .md h3 { font-size:15px; margin-top:22px; }
  .md blockquote {
    margin:12px 0; padding:8px 14px; border-left:3px solid var(--accent);
    background:var(--panel); color:var(--muted); border-radius:0 4px 4px 0;
  }
  .md blockquote p { margin:4px 0; }
  .md code {
    background:var(--panel); padding:1px 5px; border-radius:3px; font-size:12.5px;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .md pre {
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:12px; overflow-x:auto; font-size:12.5px; line-height:1.5;
  }
  .md pre code { background:transparent; padding:0; }
  .md table { border-collapse:collapse; margin:12px 0; font-size:13px; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--line); padding:5px 10px; text-align:left; }
  .md th { background:var(--panel); }
  .md hr { border:0; border-top:1px solid var(--line); margin:24px 0; }
  .md a { text-decoration:none; border-bottom:1px dashed transparent; }
  .md a:hover { border-bottom-color:var(--accent); }
  .md a[target="_blank"]::after { content:' ↗'; font-size:10px; color:var(--muted); }
  .md ul, .md ol { padding-left:24px; }
  .md li { margin:3px 0; }
  .center-msg {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--muted); text-align:center; padding:24px;
  }
  [hidden] { display:none !important; }
  @media (max-width:800px) {
    #landing { padding:14px; }
    #viewer-bar .vtitle { display:none; }
  }
</style>
</head>
<body>
  <header id="topbar">
    <span class="brand" id="brand">MR<span class="sub">emergent world steps</span></span>
    <span class="spacer"></span>
    <span id="src-indicator"></span>
    <a class="gh" id="gh-link" target="_blank" rel="noopener">GitHub ↗</a>
  </header>

  <main id="landing">
    <div class="head">
      <h1>장(field) + 법칙 + 에너지 흐름으로 세계가 떠오르는가</h1>
      <p>entity를 설계하지 않고 세계가 emergent하게 떠오르게 하는 단계별 설계·검증.
         카드를 누르면 시연(브라우저 시뮬레이션)과 문서를 볼 수 있다.</p>
    </div>
    <div id="cards"></div>
  </main>

  <section id="viewer" hidden>
    <div id="viewer-bar">
      <button id="btn-home" title="목록으로">← 목록</button>
      <button id="tab-demo">▶ 시연</button>
      <button id="tab-doc">📝 문서</button>
      <span class="vtitle" id="vtitle"></span>
      <span class="nav">
        <button id="btn-prev" title="이전 step">◀</button>
        <button id="btn-next" title="다음 step">▶</button>
        <a id="v-gh" target="_blank" rel="noopener"><button>GitHub ↗</button></a>
      </span>
    </div>
    <iframe id="demo-frame" hidden></iframe>
    <div id="doc-pane" hidden><div class="md" id="doc-md"></div></div>
  </section>

<script>
(() => {
'use strict';

const REPO = (document.querySelector('meta[name="github-repo"]') || {}).content || '';
const BRANCH = 'main';
const DIR = 'Docs/MR';
const API_URL = `https://api.github.com/repos/${REPO}/contents/${DIR}?ref=${BRANCH}`;
const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${DIR}/`;
const BLOB_BASE = `https://github.com/${REPO}/blob/${BRANCH}/${DIR}/`;
const TREE_BASE = `https://github.com/${REPO}/tree/${BRANCH}/${DIR}/`;

// ── 폴백 매니페스트 — step을 닫을 때 한 줄 추가 (온라인에서는 API가 우선) ──
const FALLBACK_STEPS = [
  { id:'step-0001', html:true,  md:true, title:'무엇을 만들려는가', sum:'세계를 6요소(장·양·법칙·에너지 흐름·항상성·재귀)로 설계하고 1차 검증 질문을 못박는다.' },
  { id:'step-0002', html:true,  md:true, title:'떠오름을 눈으로 확인한다', sum:'tick 루프를 HTML+JS로 구현 — 기울기를 주면 자기유지 구조가 떠오르는가를 수치와 화면으로 확인.' },
  { id:'step-0003', html:true,  md:true, title:'행동과 재귀: 생명이 움직이고, 그 위에 사회가 떠오른다', sum:'행동의 떠오름(A ← ρ + wE·E)과 재귀 2층(승급) 구현·측정.' },
  { id:'step-0004', html:true,  md:true, title:'다양성의 조건과 사회의 손길', sum:'다양성×행동, wBack 하향 결합, 사회 간 상호작용(부정의 결과) — 코어 변경 0.' },
  { id:'step-0005', html:false, md:true, title:'하향 에너지 채널: 재앙은 기둥으로 내린다', sum:'거시 발화가 영역 미시에 T를 주입하는 하향 에너지 채널 — wBack(조향)의 대칭.' },
];

const $ = id => document.getElementById(id);
const cardsEl = $('cards'), landingEl = $('landing'), viewerEl = $('viewer');
const demoFrame = $('demo-frame'), docPane = $('doc-pane'), docMd = $('doc-md');
const srcEl = $('src-indicator');

$('gh-link').href = TREE_BASE.replace(/\/$/, '');
let steps = [];           // [{id, html, md, title, sum}] — id 오름차순
let cur = null, curTab = 'demo';
const mdCache = Object.create(null);

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ── step 발견: GitHub API → 실패 시 FALLBACK_STEPS ─────────────────────────
async function discover() {
  try {
    const res = await fetch(API_URL, { headers:{ Accept:'application/vnd.github+json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const items = await res.json();
    const map = Object.create(null);
    for (const it of items) {
      const m = /^(step-\d{4})\.(html|md)$/.exec(it.name);
      if (!m) continue;
      const s = map[m[1]] || (map[m[1]] = { id:m[1], html:false, md:false, title:'', sum:'' });
      s[m[2]] = true;
    }
    const list = Object.values(map).sort((a, b) => a.id.localeCompare(b.id));
    if (!list.length) throw new Error('empty');
    // 폴백의 제목·요약을 시드로 깔고, md 헤더에서 갱신 시도
    for (const s of list) {
      const fb = FALLBACK_STEPS.find(f => f.id === s.id);
      if (fb) { s.title = fb.title; s.sum = fb.sum; }
    }
    srcEl.textContent = '● live (GitHub API)';
    srcEl.classList.add('live');
    enrichTitles(list); // 비동기 — 카드는 먼저 그린다
    return list;
  } catch (e) {
    srcEl.textContent = '○ 내장 목록 (오프라인/제한)';
    return FALLBACK_STEPS.slice();
  }
}

async function fetchMd(id) {
  if (mdCache[id] != null) return mdCache[id];
  for (const url of [id + '.md', RAW_BASE + id + '.md']) {
    try {
      const res = await fetch(url);
      if (res.ok) return (mdCache[id] = await res.text());
    } catch (e) { /* file:// 상대 fetch 차단 등 — 다음 후보 */ }
  }
  return null;
}

function headOfMd(text) {
  // 첫 헤딩 "# step-NNNN — 제목" → 제목, 첫 일반 문단 → 요약
  let title = '', sum = '';
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (!title && line.startsWith('#')) {
      title = line.replace(/^#+\s*/, '').replace(/^step-\d{4}\s*[-—–]\s*/, '');
      continue;
    }
    if (title && !line.startsWith('>') && !line.startsWith('#') && !line.startsWith('```')) {
      sum = line.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*`]/g, '');
      break;
    }
  }
  return { title, sum };
}

async function enrichTitles(list) {
  await Promise.all(list.map(async s => {
    if (!s.md) return;
    const text = await fetchMd(s.id);
    if (!text) return;
    const h = headOfMd(text);
    if (h.title) s.title = h.title;
    if (h.sum) s.sum = h.sum;
  }));
  renderCards();
}

// ── 랜딩 카드 ───────────────────────────────────────────────────────────────
function renderCards() {
  cardsEl.innerHTML = '';
  for (const s of steps) {
    const card = document.createElement('article');
    card.className = 'step-card';
    card.innerHTML =
      `<div class="row"><span class="sid">${esc(s.id)}</span>`
      + (s.html ? `<span class="badge demo">시연</span>` : '')
      + (s.md ? `<span class="badge doc">문서</span>` : '')
      + `</div><h2>${esc(s.title || '(제목 없음)')}</h2>`
      + `<p class="sum">${esc(s.sum || '')}</p>`;
    card.addEventListener('click', () => { location.hash = '#' + s.id; });
    cardsEl.appendChild(card);
  }
}

// ── 미니 마크다운 렌더러 ────────────────────────────────────────────────────
function resolveHref(href) {
  if (!href) return null;
  if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return { url: href, ext: true };
  if (href.startsWith('#')) return null;
  let m = /^(step-\d{4})\.md(#.*)?$/.exec(href);
  if (m) return { url: '#' + m[1] + '/doc', ext: false };
  m = /^(step-\d{4})\.html$/.exec(href);
  if (m) return { url: '#' + m[1] + '/demo', ext: false };
  // 그 외 상대경로 → GitHub blob/tree
  const isFile = /\.[A-Za-z0-9]+(#.*)?$/.test(href);
  const base = isFile ? BLOB_BASE : TREE_BASE;
  return { url: base + href.split('/').map(encodeURIComponent).join('/'), ext: true };
}

function inlineMd(text) {
  let out = '', i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (ch === '[') {
      const close = text.indexOf('](', i + 1);
      if (close !== -1) {
        const paren = text.indexOf(')', close + 2);
        if (paren !== -1) {
          const label = text.slice(i + 1, close);
          const r = resolveHref(text.slice(close + 2, paren).trim());
          out += r
            ? `<a href="${esc(r.url)}"${r.ext ? ' target="_blank" rel="noopener"' : ''}>${inlineMd(label)}</a>`
            : inlineMd(label);
          i = paren + 1; continue;
        }
      }
    }
    if (ch === '`') {
      const close = text.indexOf('`', i + 1);
      if (close !== -1) { out += `<code>${esc(text.slice(i + 1, close))}</code>`; i = close + 1; continue; }
    }
    if (ch === '*' && text[i + 1] === '*') {
      const close = text.indexOf('**', i + 2);
      if (close !== -1) { out += `<strong>${inlineMd(text.slice(i + 2, close))}</strong>`; i = close + 2; continue; }
    }
    if (ch === '*') {
      const close = text.indexOf('*', i + 1);
      if (close !== -1 && close > i + 1) { out += `<em>${inlineMd(text.slice(i + 1, close))}</em>`; i = close + 1; continue; }
    }
    out += esc(ch); i++;
  }
  return out;
}

function mdToHtml(src) {
  const lines = src.split('\n');
  let html = '', i = 0;
  const para = [];
  const flushPara = () => {
    if (para.length) { html += `<p>${inlineMd(para.join(' '))}</p>`; para.length = 0; }
  };
  while (i < lines.length) {
    const line = lines[i];
    const t = line.trim();
    // 코드펜스
    if (t.startsWith('```')) {
      flushPara();
      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) buf.push(lines[i++]);
      i++; html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    if (!t) { flushPara(); i++; continue; }
    // 헤딩
    let m = /^(#{1,6})\s+(.*)$/.exec(t);
    if (m) { flushPara(); html += `<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`; i++; continue; }
    // hr
    if (/^([-*_])\1{2,}$/.test(t)) { flushPara(); html += '<hr>'; i++; continue; }
    // 인용 (연속 줄 병합)
    if (t.startsWith('>')) {
      flushPara();
      const buf = [];
      while (i < lines.length && lines[i].trim().startsWith('>'))
        buf.push(lines[i++].trim().replace(/^>\s?/, ''));
      html += `<blockquote>${buf.map(l => `<p>${inlineMd(l)}</p>`).join('')}</blockquote>`;
      continue;
    }
    // 표: |…| 이고 다음 줄이 구분선
    if (t.startsWith('|') && i + 1 < lines.length
        && /^\|?[\s:|-]+\|?$/.test(lines[i + 1].trim()) && lines[i + 1].includes('-')) {
      flushPara();
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(t); i += 2;
      let body = '';
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        body += `<tr>${cells(lines[i++].trim()).map(c => `<td>${inlineMd(c)}</td>`).join('')}</tr>`;
      }
      html += `<table><thead><tr>${head.map(c => `<th>${inlineMd(c)}</th>`).join('')}</tr></thead>`
            + `<tbody>${body}</tbody></table>`;
      continue;
    }
    // 목록 (1단계 + 들여쓴 연속 줄은 같은 항목으로)
    m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (m) {
      flushPara();
      const ordered = /\d/.test(m[2][0]);
      const tag = ordered ? 'ol' : 'ul';
      let items = '';
      while (i < lines.length) {
        const lm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (!lm || (/\d/.test(lm[2][0])) !== ordered) break;
        let item = lm[3]; i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^(\s*)([-*]|\d+\.)\s/.test(lines[i]))
          item += ' ' + lines[i++].trim();
        items += `<li>${inlineMd(item)}</li>`;
      }
      html += `<${tag}>${items}</${tag}>`; continue;
    }
    para.push(t); i++;
  }
  flushPara();
  return html;
}

// ── 뷰어 ────────────────────────────────────────────────────────────────────
function showLanding() {
  cur = null;
  viewerEl.hidden = true; landingEl.hidden = false;
  demoFrame.src = 'about:blank';
  document.title = 'MR — emergent world steps';
}

async function showStep(id, tab) {
  const s = steps.find(x => x.id === id);
  if (!s) { showLanding(); return; }
  if (!tab) tab = s.html ? 'demo' : 'doc';
  if (tab === 'demo' && !s.html) tab = 'doc';
  if (tab === 'doc' && !s.md) tab = 'demo';
  cur = s; curTab = tab;
  landingEl.hidden = true; viewerEl.hidden = false;
  document.title = `${s.id} — ${s.title || 'MR'}`;

  $('vtitle').innerHTML = `<span class="sid">${esc(s.id)}</span>${esc(s.title || '')}`;
  $('tab-demo').disabled = !s.html;
  $('tab-doc').disabled = !s.md;
  $('tab-demo').classList.toggle('active', tab === 'demo');
  $('tab-doc').classList.toggle('active', tab === 'doc');
  const idx = steps.indexOf(s);
  $('btn-prev').disabled = idx <= 0;
  $('btn-next').disabled = idx >= steps.length - 1;
  $('v-gh').href = BLOB_BASE + s.id + (tab === 'doc' && s.md ? '.md' : '.html');

  if (tab === 'demo') {
    docPane.hidden = true; demoFrame.hidden = false;
    const want = s.id + '.html';
    if (!demoFrame.src.endsWith(want)) demoFrame.src = want; // 상대경로 — Pages·로컬 모두 동작
  } else {
    demoFrame.hidden = true; demoFrame.src = 'about:blank';
    docPane.hidden = false;
    docMd.innerHTML = `<p style="color:var(--muted)">문서 로딩 중…</p>`;
    const text = await fetchMd(s.id);
    if (cur !== s || curTab !== 'doc') return; // 그 사이 이동함
    docMd.innerHTML = text ? mdToHtml(text)
      : `<div class="center-msg"><div>문서를 가져올 수 없습니다 (오프라인 / file:// fetch 제한).</div>`
        + `<div><a href="${esc(BLOB_BASE + s.id + '.md')}" target="_blank" rel="noopener">GitHub에서 보기 ↗</a></div></div>`;
    docPane.scrollTop = 0;
  }
}

// ── 해시 라우팅: '' | #step-NNNN | #step-NNNN/demo|doc ──────────────────────
function route() {
  const m = /^#(step-\d{4})(?:\/(demo|doc))?$/.exec(location.hash);
  if (m) showStep(m[1], m[2] || null);
  else showLanding();
}

$('brand').addEventListener('click', () => { location.hash = ''; });
$('btn-home').addEventListener('click', () => { location.hash = ''; });
$('tab-demo').addEventListener('click', () => { if (cur) location.hash = `#${cur.id}/demo`; });
$('tab-doc').addEventListener('click', () => { if (cur) location.hash = `#${cur.id}/doc`; });
$('btn-prev').addEventListener('click', () => {
  const i = steps.indexOf(cur); if (i > 0) location.hash = '#' + steps[i - 1].id;
});
$('btn-next').addEventListener('click', () => {
  const i = steps.indexOf(cur); if (i < steps.length - 1) location.hash = '#' + steps[i + 1].id;
});
window.addEventListener('hashchange', route);

(async () => {
  steps = await discover();
  renderCards();
  route();
})();

// 헤드리스 검증용 노출 (verify-site.js)
if (typeof module !== 'undefined' && module.exports)
  module.exports = { headOfMd, mdToHtml, inlineMd, resolveHref, FALLBACK_STEPS };
})();
</script>
