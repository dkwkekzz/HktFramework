<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Intent Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="github-repo" content="dkwkekzz/HktFramework">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --accent-deep: #0c4a6e;
    --root: #fde68a; --active: #86efac;
    --proposed: #fcd34d; --realized: #93c5fd;
    --abandoned: #6b7280;
    --topbar-h: 48px;
    --card-w: 420px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Noto Sans CJK KR", sans-serif;
    overscroll-behavior: none;
  }
  body { height: 100vh; display: flex; flex-direction: column; }

  /* --- Top bar --- */
  #topbar {
    height: var(--topbar-h); flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px; background: var(--bg);
    border-bottom: 1px solid var(--line); z-index: 30;
  }
  #topbar button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 4px; cursor: pointer; font: inherit;
    line-height: 1; min-width: 34px; flex: 0 0 auto;
  }
  #topbar button:hover:not(:disabled) { background: var(--panel2); }
  #topbar button:disabled { opacity: 0.35; cursor: not-allowed; }
  #breadcrumb {
    flex: 1 1 auto; display: flex; gap: 2px; overflow-x: auto;
    align-items: center; min-width: 0;
    scrollbar-width: thin; padding: 2px 0;
  }
  #breadcrumb::-webkit-scrollbar { height: 4px; }
  #breadcrumb .crumb {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--muted); font-size: 11px; cursor: pointer;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: inherit;
  }
  #breadcrumb .crumb:hover { background: var(--panel2); color: var(--text); }
  #breadcrumb .crumb.tip {
    color: var(--text); border-color: var(--accent);
    background: var(--panel2);
  }
  #breadcrumb .crumb .id { font-size: 11px; margin: 0; }
  #breadcrumb .crumb .ttl {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 160px;
  }
  #breadcrumb .sep { color: var(--muted); font-size: 11px; flex: 0 0 auto; padding: 0 2px; }
  #loading-indicator { color: var(--muted); font-size: 11px; flex: 0 0 auto; }
  #error-indicator { color: #f87171; font-size: 11px; flex: 0 0 auto; }

  /* --- Drawer (검색·필터·전체 리스트) --- */
  #drawer-scrim {
    position: fixed; inset: var(--topbar-h) 0 0 0;
    background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease-out; z-index: 25;
  }
  #drawer-scrim.show { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
    width: 320px; max-width: 92vw; background: var(--bg);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.18s ease-out;
    z-index: 26;
  }
  #drawer.open { transform: translateX(0); box-shadow: 4px 0 16px rgba(0,0,0,0.4); }
  #drawer .drawer-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  #drawer .drawer-head .muted { color: var(--muted); font-size: 12px; }
  #drawer .drawer-head .close-btn {
    background: transparent; color: var(--muted); border: 0; cursor: pointer;
    font-size: 22px; padding: 0 4px; line-height: 1;
  }
  #filters { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #filters input, #filters select {
    width: 100%; margin-bottom: 6px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 7px 9px; border-radius: 4px; font: inherit;
  }
  #drawer .drawer-body { overflow-y: auto; flex: 1; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    padding: 7px 14px; cursor: pointer; border-left: 3px solid transparent;
    border-bottom: 1px solid var(--line); line-height: 1.35;
  }
  ul.list li:hover { background: var(--panel); }
  ul.list li.in-stack { background: var(--panel); border-left-color: var(--accent); }
  ul.list li.tip { background: var(--panel2); border-left-color: var(--active); }

  /* --- Stack of cards --- */
  #stack {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: row;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
    scroll-behavior: smooth;
    background: var(--bg);
  }
  .card {
    flex: 0 0 var(--card-w); width: var(--card-w);
    height: 100%; overflow-y: auto;
    border-right: 1px solid var(--line);
    background: var(--panel);
    scroll-snap-align: start;
    transition: filter 0.2s ease-out, background 0.2s ease-out;
    position: relative;
  }
  .card.tip {
    background: var(--panel2);
    box-shadow: -10px 0 24px -8px rgba(0,0,0,0.5);
    z-index: 2;
  }
  .card-head {
    position: sticky; top: 0; z-index: 3;
    padding: 12px 16px 10px; background: inherit;
    border-bottom: 1px solid var(--line);
  }
  .card-head .row1 {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .card-head h1 {
    font-size: 16px; margin: 4px 0 4px; line-height: 1.3; font-weight: 600;
  }
  .card-head .tags { margin-top: 4px; }

  .card-body { padding: 14px 16px 36px; }
  .card-body .actions { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .card-body .actions button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 3px; cursor: pointer; font: inherit;
    font-size: 12px;
  }
  .card.tip .card-body .actions button { background: var(--bg); }
  .card-body .actions button:hover { border-color: var(--accent); }
  .card-body .actions .copied { color: var(--active); font-size: 11px; font-weight: 600; }
  .card-body h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 16px 0 6px; font-weight: 600;
    border-bottom: 1px solid var(--line); padding-bottom: 4px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card-body h2 .arrow { color: var(--accent); margin-right: 4px; }
  .card-body h2 .count { font-size: 11px; color: var(--muted); font-weight: 400; }
  .card-body pre {
    background: var(--panel); padding: 10px; border-radius: 4px;
    white-space: pre-wrap; word-break: break-word; margin: 0; font: inherit;
    font-size: 13px; line-height: 1.5;
  }
  .card.tip .card-body pre { background: var(--bg); }
  .card-body ul.linked { padding-left: 18px; margin: 6px 0; }
  .card-body ul.linked li { margin-bottom: 4px; line-height: 1.4; }
  .card-body code {
    background: var(--panel); padding: 1px 5px; border-radius: 3px;
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .card.tip .card-body code { background: var(--bg); }
  .card-body ul.rel { list-style: none; padding: 0; margin: 4px 0; }
  .card-body ul.rel li {
    padding: 6px 8px; margin: 2px 0; cursor: pointer;
    border-left: 3px solid transparent; border-radius: 3px;
    background: var(--panel); transition: background 0.1s, border-color 0.1s;
    line-height: 1.35;
  }
  .card.tip .card-body ul.rel li { background: var(--bg); }
  .card-body ul.rel li:hover { background: var(--panel2); border-left-color: var(--accent); }
  .card-body ul.rel li.in-stack { border-left-color: var(--accent); }
  .card-body ul.rel li.tip { border-left-color: var(--active); background: var(--panel2); }
  .card-body ul.rel li.missing { color: var(--muted); cursor: not-allowed; }
  .card-body .none {
    color: var(--muted); font-style: italic; font-size: 12px; padding: 4px 0;
  }
  .card-body .toggle-more {
    color: var(--accent); cursor: pointer; padding: 6px 0; font-size: 12px;
    display: inline-block;
  }
  .card-body .toggle-more:hover { text-decoration: underline; }

  /* --- shared chips --- */
  .id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent); margin-right: 4px; font-weight: 600;
  }
  .status {
    display: inline-block; padding: 1px 6px; border-radius: 10px;
    font-size: 11px; background: var(--line);
  }
  .status.active { background: var(--active); color: #052e16; }
  .status.proposed { background: var(--proposed); color: #422006; }
  .status.realized { background: var(--realized); color: #082f49; }
  .status.abandoned { background: var(--abandoned); color: #f9fafb; }
  .pill {
    display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: var(--line); color: var(--muted);
  }
  .pill.root { background: var(--root); color: #422006; }
  .pill.leaf { background: var(--realized); color: #082f49; }
  .tag {
    display: inline-block; background: var(--line); color: var(--muted);
    padding: 1px 6px; border-radius: 3px; margin: 2px 4px 2px 0; font-size: 11px;
  }

  .empty-hint { color: var(--muted); padding: 24px 14px; text-align: center; }
  .full-status {
    flex: 1 1 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; gap: 12px; text-align: center;
  }
  .full-status .title { font-size: 15px; font-weight: 600; }
  .full-status .detail { color: var(--muted); font-size: 13px; max-width: 480px; line-height: 1.5; }
  .full-status.error .title { color: #f87171; }

  /* --- Mobile (≤ 800px) --- */
  @media (max-width: 800px) {
    :root { --card-w: 100vw; }
    #stack {
      flex-direction: column;
      overflow-x: hidden; overflow-y: auto;
      scroll-snap-type: none;
    }
    .card {
      flex: 0 0 auto; width: 100%; height: auto;
      min-height: 100%; border-right: 0;
      border-bottom: 1px solid var(--line);
      overflow-y: visible;
      display: none;
      box-shadow: none;
    }
    .card.tip { display: block; }
    #drawer { width: 100%; max-width: 100%; }
    .card-body { padding-bottom: 60px; }
  }

  /* --- Edit UI (Phase 1) --- */
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:20px; min-width:340px; max-width:620px; width:90vw; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 12px; font-size:15px; }
  dialog label { display:block; font-size:12px; color:var(--muted); margin-bottom:10px; }
  dialog label > input, dialog label > textarea, dialog label > select {
    display:block; width:100%; margin-top:4px;
    background:var(--bg); color:var(--text); border:1px solid var(--line);
    padding:7px 9px; border-radius:4px; font:inherit;
  }
  dialog label > textarea { resize:vertical; min-height:100px; }
  .modal-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .modal-actions button {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:7px 14px; border-radius:4px; cursor:pointer; font:inherit;
  }
  .modal-actions button:hover { border-color:var(--accent); }
  .modal-actions button.primary { background:var(--accent-deep); border-color:var(--accent); }
  .modal-actions button.danger { color:#f87171; border-color:#f87171; }
  .modal-errors { color:#f87171; font-size:12px; margin-top:8px; white-space:pre-line; }
  .badge-unsaved { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:600; background:#d97706; color:#fff; }
  #toast-wrap { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast { background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:10px 18px; border-radius:6px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.4); animation:toast-in .2s ease-out; pointer-events:auto; }
  .toast.error { border-color:#f87171; }
  .toast.success { border-color:var(--active); }
  @keyframes toast-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .btn-edit { background:transparent; border:1px solid var(--line); color:var(--muted); padding:2px 6px; border-radius:3px; cursor:pointer; font:inherit; font-size:11px; }
  .btn-edit:hover { color:var(--text); border-color:var(--accent); }
  .multi-sel { border:1px solid var(--line); border-radius:4px; max-height:140px; overflow-y:auto; background:var(--bg); margin-top:4px; }
  .multi-sel label { padding:4px 8px; cursor:pointer; color:var(--text); display:flex; align-items:center; gap:6px; margin-bottom:0; font-size:13px; }
  .multi-sel label:hover { background:var(--panel); }
  /* `dialog label > input` 룰이 .multi-sel 내부 체크박스까지 잡아 너비/패딩이 깨지므로 reset. */
  .multi-sel label > input[type="checkbox"] { width:auto; padding:0; margin:0; flex:0 0 auto; display:inline-block; }
  .btn-add-child { background:transparent; border:1px solid var(--line); color:var(--accent); padding:0 6px; border-radius:3px; cursor:pointer; font:inherit; font-size:11px; line-height:1.4; margin-left:6px; }
  .btn-add-child:hover { background:var(--panel); }
  #auth-indicator { font-size:11px; color:var(--muted); flex:0 0 auto; }
  #auth-indicator.ok { color:var(--active); }
  /* --- Pending(예약) 표시 — 다크 배경에서도 한눈에 보이도록 좌측 보더 + 강한 배경 --- */
  .card.pending-create, .card.pending-update {
    background:rgba(252,211,77,0.10);
    box-shadow: inset 4px 0 0 var(--proposed);
  }
  .card.pending-create.tip, .card.pending-update.tip {
    background:rgba(252,211,77,0.22);
    box-shadow: inset 4px 0 0 var(--proposed), -10px 0 24px -8px rgba(0,0,0,0.5);
  }
  .card.pending-delete {
    background:rgba(239,68,68,0.10);
    box-shadow: inset 4px 0 0 #f87171;
  }
  .card.pending-delete.tip {
    background:rgba(239,68,68,0.22);
    box-shadow: inset 4px 0 0 #f87171, -10px 0 24px -8px rgba(0,0,0,0.5);
  }
  .pending-chip { display:inline-block; background:var(--proposed); color:#422006; padding:1px 6px; border-radius:10px; font-size:10px; font-weight:600; margin-left:4px; }
  .pending-chip.delete { background:#f87171; color:#450a0a; }
  ul.list li.pending-create, ul.list li.pending-update { background:rgba(252,211,77,0.12); }
  ul.list li.pending-delete { background:rgba(239,68,68,0.12); text-decoration:line-through; opacity:0.7; }
  ul.rel li.pending-create, ul.rel li.pending-update { background:rgba(252,211,77,0.12) !important; }
  ul.rel li.pending-delete { background:rgba(239,68,68,0.12) !important; text-decoration:line-through; opacity:0.7; }

  /* --- Inline relation editing (Obsidian-style) --- */
  ul.rel li { position:relative; padding-right:30px; }
  .btn-unlink {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:0; color:var(--muted); cursor:pointer;
    padding:2px 6px; font-size:14px; line-height:1; border-radius:3px;
    opacity:0; transition:opacity .12s, color .12s, background .12s;
  }
  ul.rel li:hover .btn-unlink, .btn-unlink:focus { opacity:1; }
  .btn-unlink:hover { color:#f87171; background:rgba(239,68,68,0.15); opacity:1; }
  /* 터치 디바이스에서는 hover 가 없으므로 항상 노출 */
  @media (hover: none) {
    .btn-unlink { opacity:1; color:var(--muted); }
  }
  .btn-link-rel {
    background:transparent; border:1px solid var(--line); color:var(--accent);
    padding:0 6px; border-radius:3px; cursor:pointer; font:inherit; font-size:11px;
    line-height:1.4; margin-left:6px;
  }
  .btn-link-rel:hover { background:var(--panel); border-color:var(--accent); }

  /* --- Quick switcher popover --- */
  #link-popover {
    position:absolute; z-index:60; width:340px; max-width:92vw;
    max-height:380px; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--accent); border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #link-popover[hidden] { display:none; }
  #link-popover .popover-head {
    padding:6px 10px 4px; font-size:11px; color:var(--muted);
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between;
  }
  #link-popover .popover-input {
    background:var(--bg); color:var(--text); border:0;
    padding:9px 10px; font:inherit; outline:none;
    border-bottom:1px solid var(--line);
  }
  #link-popover .popover-list { overflow-y:auto; flex:1; padding:2px 0; min-height:40px; }
  #link-popover .popover-item {
    padding:6px 10px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; gap:6px;
    border-left:3px solid transparent;
    white-space:nowrap; overflow:hidden;
  }
  #link-popover .popover-item .ttl {
    flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
  }
  #link-popover .popover-item:hover,
  #link-popover .popover-item.active {
    background:var(--panel2); border-left-color:var(--accent);
  }
  #link-popover .popover-empty {
    padding:14px 10px; color:var(--muted); font-style:italic;
    font-size:12px; text-align:center;
  }
  #link-popover .popover-create {
    padding:8px 10px; border-top:1px solid var(--line);
    color:var(--accent); cursor:pointer; font-size:12px;
    display:flex; align-items:center; gap:4px;
  }
  #link-popover .popover-create:hover { background:var(--panel2); }
  #link-popover .popover-create.disabled {
    color:var(--muted); cursor:not-allowed; opacity:.5;
  }

  /* --- Multi-select with filter (edit modal) --- */
  .multi-sel-filter {
    width:100%; background:var(--bg); color:var(--text);
    border:0; border-bottom:1px solid var(--line);
    padding:6px 9px; font:inherit; font-size:12px;
    outline:none; border-radius:0;
  }
  .multi-sel-list { max-height:120px; overflow-y:auto; }
  .multi-sel-empty {
    padding:8px 10px; color:var(--muted); font-style:italic;
    font-size:12px; text-align:center;
  }
  /* `dialog label > input` 룰이 .multi-sel-filter 까지 잡아 너비/패딩이 깨지므로 reset. */
  dialog .multi-sel-filter { margin:0; }
</style>
<script type="application/json" id="validation-rules">{
  "version": "1",
  "id_pattern": "^I-\\d{4}$",
  "required_fields": ["id", "title", "status"],
  "valid_statuses": ["active", "proposed", "realized", "abandoned"],
  "max_title_length": 200,
  "checks": {
    "dag_no_cycle": true,
    "parent_child_bidirectional": true,
    "refs_exist": true
  }
}
</script>
<script src="store/intent-store.js"></script>
<script src="store/validator.js"></script>
<script src="store/github.js"></script>
</head>
<body>
  <header id="topbar">
    <button id="btn-menu" title="목록 (/) " aria-label="목록">≡</button>
    <button id="btn-back" title="뒤로 (Backspace)" aria-label="뒤로" disabled>←</button>
    <button id="btn-new" title="새 Intent 추가" hidden>＋</button>
    <span id="unsaved-badge" class="badge-unsaved" hidden>Unsaved</span>
    <button id="btn-save" hidden disabled>저장</button>
    <button id="btn-create-pr" hidden>PR 생성</button>
    <nav id="breadcrumb" aria-label="navigation stack"></nav>
    <button id="btn-settings" title="GitHub 설정">⚙</button>
    <span id="auth-indicator"></span>
    <span id="loading-indicator" class="muted">로딩 중…</span>
    <span id="error-indicator" hidden></span>
  </header>
  <div id="drawer-scrim"></div>
  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><strong>Intents</strong> <span class="muted" id="count"></span></div>
      <button id="btn-close-drawer" class="close-btn" aria-label="닫기">×</button>
    </div>
    <div id="filters">
      <input type="search" id="q" placeholder="ID/제목/의도 검색...">
      <select id="status-filter">
        <option value="">모든 status</option>
        <option value="active">active</option>
        <option value="proposed">proposed</option>
        <option value="realized">realized</option>
        <option value="abandoned">abandoned</option>
      </select>
      <select id="tag-filter"><option value="">모든 tag</option></select>
    </div>
    <div class="drawer-body"><ul id="list" class="list"></ul></div>
  </aside>
  <main id="stack" aria-live="polite"></main>
  <div id="toast-wrap"></div>
  <dialog id="token-modal">
    <h3>GitHub 연결 설정</h3>
    <p style="font-size:12px;color:var(--muted);margin:0 0 12px">fine-grained PAT (Contents: read+write) — IndexedDB 에만 저장</p>
    <label>Owner / Repo<input id="ti-repo" placeholder="owner/repo" autocomplete="off"></label>
    <label>Token<input id="ti-token" type="password" placeholder="ghp_..." autocomplete="off"></label>
    <div class="modal-actions">
      <button id="ti-save" class="primary">저장</button>
      <button id="ti-cancel">취소</button>
      <button id="ti-clear" class="danger">토큰 지우기</button>
    </div>
  </dialog>
  <dialog id="edit-modal">
    <h3 id="em-heading">Intent 편집</h3>
    <label>제목<input id="em-title" type="text" maxlength="200"></label>
    <label>Status
      <select id="em-status">
        <option value="active">active</option>
        <option value="proposed">proposed</option>
        <option value="realized">realized</option>
        <option value="abandoned">abandoned</option>
      </select>
    </label>
    <label>Intent 본문<textarea id="em-intent" rows="7"></textarea></label>
    <label>Parents<div class="multi-sel" id="em-parents"></div></label>
    <label>Children<div class="multi-sel" id="em-children"></div></label>
    <label>Tags (쉼표 구분)<input id="em-tags" placeholder="tag1, tag2"></label>
    <div class="modal-errors" id="em-errors" hidden></div>
    <div class="modal-actions">
      <button id="em-ok" class="primary">저장 예약</button>
      <button id="em-cancel">취소</button>
      <button id="em-delete" class="danger">삭제</button>
    </div>
  </dialog>
  <div id="link-popover" hidden role="dialog" aria-label="Intent 연결">
    <div class="popover-head"><span id="lp-title">연결할 Intent</span><span id="lp-hint">↑↓ 이동 · Enter 선택 · Esc 닫기</span></div>
    <input class="popover-input" id="lp-input" type="search" placeholder="ID 또는 제목 검색..." autocomplete="off">
    <div class="popover-list" id="lp-list"></div>
    <div class="popover-create" id="lp-create" hidden></div>
  </div>
  <dialog id="confirm-modal">
    <h3 id="cm-msg">삭제하시겠습니까?</h3>
    <div class="modal-actions">
      <button id="cm-ok" class="danger">확인</button>
      <button id="cm-cancel">취소</button>
    </div>
  </dialog>

<script>
// ─── Phase 1 SPA — single async IIFE ───────────────────────────────────────
// 임베드된 데이터 없음. GitHub API 로 라이브 페치.
//   • 인증 없음(공개 저장소): 60 req/h IP 제한 — 캐주얼 열람용. main 브랜치만 읽기.
//   • PAT 설정됨: 5000 req/h. intents/draft 브랜치 읽기/쓰기 + PR 생성.
(() => {
  'use strict';

  // ── DOM 핸들 ────────────────────────────────────────────────────────────────
  const stackEl       = document.getElementById('stack');
  const breadcrumbEl  = document.getElementById('breadcrumb');
  const drawerEl      = document.getElementById('drawer');
  const scrimEl       = document.getElementById('drawer-scrim');
  const listEl        = document.getElementById('list');
  const countEl       = document.getElementById('count');
  const qEl           = document.getElementById('q');
  const statusEl      = document.getElementById('status-filter');
  const tagSelect     = document.getElementById('tag-filter');
  const btnBack       = document.getElementById('btn-back');
  const btnMenu       = document.getElementById('btn-menu');
  const btnCloseDrawer= document.getElementById('btn-close-drawer');
  const btnNew        = document.getElementById('btn-new');
  const btnSave       = document.getElementById('btn-save');
  const btnPR         = document.getElementById('btn-create-pr');
  const btnSettings   = document.getElementById('btn-settings');
  const unsavedBadge  = document.getElementById('unsaved-badge');
  const authIndicator = document.getElementById('auth-indicator');
  const loadingEl     = document.getElementById('loading-indicator');
  const errorEl       = document.getElementById('error-indicator');
  const tokenModal    = document.getElementById('token-modal');
  const editModal     = document.getElementById('edit-modal');
  const confirmModal  = document.getElementById('confirm-modal');
  const toastWrap     = document.getElementById('toast-wrap');

  // ── 데이터 상태 (라이브) ────────────────────────────────────────────────────
  // baseIntents: 서버에서 마지막으로 가져온 진본
  // DATA.intents: baseIntents + pendingChanges 머지된 view (UI 가 읽음)
  const DATA = { intents: [] };
  const intentsById = Object.create(null);
  let baseIntents = [];
  const baseIntentsById = Object.create(null);
  let store = null;
  let pendingChanges = [];
  let editTarget = null;
  let stackIds = [];
  // 데이터 변경 버전 — applyView 에서 증가시켜 renderStack 의 prefix-preserve
  // 최적화를 무효화하고 현재 화면의 카드를 강제 재렌더링한다. 순수 네비게이션은
  // 버전을 건드리지 않으므로 기존 카드/스크롤 위치가 보존된다.
  let viewVersion = 0;

  // 외부 스코프(Edit IIFE 와 디버깅) 와의 호환성 — 기존 site.html 의 노출 면 유지.
  window.DATA = DATA;
  window.intentsById = intentsById;

  // ── 유틸 ────────────────────────────────────────────────────────────────────
  function escape(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  function isRoot(it) { return !(it.parents || []).length; }
  function isLeaf(it) { return !(it.children || []).length; }
  function pillHtml(it) {
    if (isRoot(it)) return `<span class="pill root">root</span>`;
    if (isLeaf(it)) return `<span class="pill leaf">leaf</span>`;
    return '';
  }
  function isMobile() {
    return window.matchMedia && window.matchMedia('(max-width: 800px)').matches;
  }

  // ── 그래프 도우미 ───────────────────────────────────────────────────────────
  function ancestorsOf(id) {
    const out = new Set();
    const work = [id];
    while (work.length) {
      const cur = work.pop();
      const it = intentsById[cur];
      if (!it) continue;
      for (const p of it.parents || []) {
        if (out.has(p) || p === id) continue;
        out.add(p); work.push(p);
      }
    }
    return [...out];
  }
  function descendantsOf(id) {
    const out = new Set();
    const work = [id];
    while (work.length) {
      const cur = work.pop();
      const it = intentsById[cur];
      if (!it) continue;
      for (const c of it.children || []) {
        if (out.has(c) || c === id) continue;
        out.add(c); work.push(c);
      }
    }
    return [...out];
  }
  function siblingsOf(id) {
    const it = intentsById[id]; if (!it) return [];
    const out = new Set();
    for (const p of it.parents || []) {
      const parent = intentsById[p]; if (!parent) continue;
      for (const c of parent.children || []) {
        if (c !== id && intentsById[c]) out.add(c);
      }
    }
    return [...out].sort();
  }

  // ── 인라인 관계 편집 ──────────────────────────────────────────────────────
  // 한쪽 방향 클릭으로 양쪽(parent.children, child.parents) 모두 pending 처리.
  // store 의 양방향 미러 로직과 idempotent — 같은 상태면 no-op.

  /**
   * id 에 대한 pending update 를 보장한다. 기존 pending change(create/update) 가
   * 있으면 그 intent 를 직접 변형, 없으면 base 의 사본으로 update 항목 생성.
   * delete pending 이거나 base 가 없으면 null 을 반환한다.
   */
  function ensurePendingChange(id, mutator) {
    for (const ch of pendingChanges) {
      if (ch.intent.id !== id) continue;
      if (ch.type === 'delete') return null;
      mutator(ch.intent);
      return ch;
    }
    const base = baseIntentsById[id];
    if (!base) return null;
    const draft = {
      ...base,
      parents: [...(base.parents || [])],
      children: [...(base.children || [])],
      tags: [...(base.tags || [])],
    };
    mutator(draft);
    const ch = { type: 'update', intent: draft, baseVersion: base.baseVersion };
    pendingChanges.push(ch);
    return ch;
  }

  /** 변경 없는 pending update 는 제거 — 사용자가 토글한 끝에 원상복귀 시. */
  function pruneNoopPending(id) {
    const idx = pendingChanges.findIndex(c => c.intent.id === id && c.type === 'update');
    if (idx === -1) return;
    const base = baseIntentsById[id];
    if (!base) return;
    const ch = pendingChanges[idx];
    const norm = v => Array.isArray(v) ? [...v].slice().sort().join('\x1f') : (v == null ? '' : String(v));
    const same = ['title','status','intent','parents','children','tags']
      .every(f => norm(ch.intent[f]) === norm(base[f]));
    if (same) pendingChanges.splice(idx, 1);
  }

  function linkParentChild(parentId, childId) {
    if (!parentId || !childId || parentId === childId) {
      showToast('자기 자신과 연결할 수 없습니다', 'error');
      return false;
    }
    const parent = intentsById[parentId];
    const child = intentsById[childId];
    if (!parent || !child) {
      showToast('대상 Intent 가 존재하지 않습니다', 'error');
      return false;
    }
    if (parent._pending === 'delete' || child._pending === 'delete') {
      showToast('삭제 예약된 Intent 는 연결할 수 없습니다', 'error');
      return false;
    }
    const alreadyLinked = (parent.children || []).includes(childId)
                       && (child.parents || []).includes(parentId);
    if (alreadyLinked) return false;
    // 순환 방지: parent 가 child 의 자손이면 cycle 발생.
    if (descendantsOf(childId).includes(parentId)) {
      showToast('순환 참조가 발생하여 연결할 수 없습니다', 'error');
      return false;
    }
    ensurePendingChange(parentId, p => {
      p.children = p.children || [];
      if (!p.children.includes(childId)) p.children.push(childId);
    });
    ensurePendingChange(childId, c => {
      c.parents = c.parents || [];
      if (!c.parents.includes(parentId)) c.parents.push(parentId);
    });
    pruneNoopPending(parentId);
    pruneNoopPending(childId);
    applyView();
    if (pendingChanges.length) markUnsaved(); else clearUnsaved();
    rebuildTagFilter();
    renderList();
    renderStack();
    showToast(`연결됨: ${parentId} → ${childId}`, 'success');
    return true;
  }

  function unlinkParentChild(parentId, childId) {
    if (!parentId || !childId) return false;
    ensurePendingChange(parentId, p => {
      p.children = (p.children || []).filter(c => c !== childId);
    });
    ensurePendingChange(childId, c => {
      c.parents = (c.parents || []).filter(pp => pp !== parentId);
    });
    pruneNoopPending(parentId);
    pruneNoopPending(childId);
    applyView();
    if (pendingChanges.length) markUnsaved(); else clearUnsaved();
    rebuildTagFilter();
    renderList();
    renderStack();
    showToast(`연결 해제됨: ${parentId} ↛ ${childId}`);
    return true;
  }

  // ── 토스트 ──────────────────────────────────────────────────────────────────
  function showToast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    toastWrap.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  // ── 확인 다이얼로그 ─────────────────────────────────────────────────────────
  let _confirmResolve = null;
  document.getElementById('cm-ok').addEventListener('click', () => {
    confirmModal.close(); _confirmResolve && _confirmResolve(true);
  });
  document.getElementById('cm-cancel').addEventListener('click', () => {
    confirmModal.close(); _confirmResolve && _confirmResolve(false);
  });
  function confirm$(msg) {
    return new Promise(res => {
      _confirmResolve = res;
      document.getElementById('cm-msg').textContent = msg;
      confirmModal.showModal();
    });
  }

  // ── 스택 / 네비게이션 상태 ──────────────────────────────────────────────────
  function inStack(id) { return stackIds.includes(id); }
  function isTip(id) { return stackIds[stackIds.length - 1] === id; }

  // ── 렌더링: breadcrumb ──────────────────────────────────────────────────────
  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = '';
    stackIds.forEach((id, i) => {
      const it = intentsById[id];
      const tip = i === stackIds.length - 1;
      const crumb = document.createElement('button');
      crumb.type = 'button';
      crumb.className = 'crumb' + (tip ? ' tip' : '');
      crumb.title = it ? it.title : '(missing)';
      crumb.dataset.idx = String(i);
      crumb.innerHTML = `<span class="id">${escape(id)}</span>`
                     + `<span class="ttl">${escape(it ? it.title : '(missing)')}</span>`;
      crumb.addEventListener('click', () => navigateToIndex(i));
      breadcrumbEl.appendChild(crumb);
      if (i < stackIds.length - 1) {
        const sep = document.createElement('span');
        sep.className = 'sep'; sep.textContent = '›';
        breadcrumbEl.appendChild(sep);
      }
    });
    requestAnimationFrame(() => {
      const last = breadcrumbEl.lastElementChild;
      if (last) last.scrollIntoView({ inline: 'end', block: 'nearest' });
    });
  }

  // ── 렌더링: 카드 ────────────────────────────────────────────────────────────
  function renderRelationSection(arrow, label, ids, ownerCardIdx, limit, opts) {
    opts = opts || {};
    const total = ids.length;
    const headerBtns = [];
    if (opts.linkOf) {
      headerBtns.push(
        `<button class="btn-link-rel" data-link-rel-of="${escape(opts.linkOf)}"`
        + ` data-link-rel-kind="${escape(opts.kind || '')}"`
        + ` title="기존 Intent 연결 (검색)">🔗</button>`
      );
    }
    if (opts.createChildOf) {
      headerBtns.push(
        `<button class="btn-add-child" data-add-child-of="${escape(opts.createChildOf)}"`
        + ` title="새 자식 Intent 생성">＋</button>`
      );
    }
    let html = `<h2><span><span class="arrow">${arrow}</span>${escape(label)}${headerBtns.join('')}</span>`
             + `<span class="count">${total}</span></h2>`;
    if (total === 0) return html + `<div class="none">(없음)</div>`;
    const useLimit = limit > 0 && total > limit;
    const items = ids.map((id, i) => {
      const overflow = useLimit && i >= limit;
      const it = intentsById[id];
      if (!it) {
        const unlinkMissing = opts.editable && opts.linkOf
          ? `<button class="btn-unlink" data-unlink-owner="${escape(opts.linkOf)}"`
            + ` data-unlink-target="${escape(id)}" data-unlink-kind="${escape(opts.kind)}"`
            + ` title="끊긴 참조 제거">×</button>`
          : '';
        return `<li class="missing${overflow ? ' overflow' : ''}"${overflow ? ' hidden' : ''}>`
             + `<span class="id">${escape(id)}</span> <span class="meta">(없음)</span>${unlinkMissing}</li>`;
      }
      const cls = [];
      if (overflow) cls.push('overflow');
      if (inStack(id)) cls.push(isTip(id) ? 'tip' : 'in-stack');
      if (it._pending) cls.push('pending-' + it._pending);
      const unlinkBtn = opts.editable && opts.linkOf
        ? `<button class="btn-unlink" data-unlink-owner="${escape(opts.linkOf)}"`
          + ` data-unlink-target="${escape(id)}" data-unlink-kind="${escape(opts.kind)}"`
          + ` title="연결 해제">×</button>`
        : '';
      return `<li class="${cls.join(' ')}"${overflow ? ' hidden' : ''}`
           + ` data-goto="${escape(id)}" data-from="${ownerCardIdx}"`
           + ` title="${escape(it.title)}">`
           + `<span class="id">${escape(it.id)}</span>${escape(it.title)} `
           + `<span class="status ${escape(it.status)}">${escape(it.status)}</span>`
           + `${pillHtml(it)}${unlinkBtn}</li>`;
    }).join('');
    html += `<ul class="rel">${items}</ul>`;
    if (useLimit) {
      html += `<div class="toggle-more">+ ${total - limit}개 더 보기</div>`;
    }
    return html;
  }

  function renderCard(id, idx) {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = id;
    card.dataset.idx = String(idx);

    const it = intentsById[id];
    if (!it) {
      card.innerHTML = `<div class="empty-hint"><span class="id">${escape(id)}</span><br>데이터에 없는 ID 입니다.</div>`;
      return card;
    }

    if (it._pending) card.classList.add('pending-' + it._pending);
    const pendingChip = it._pending
      ? (it._pending === 'delete'
         ? `<span class="pending-chip delete">삭제 예약</span>`
         : `<span class="pending-chip">${it._pending === 'create' ? '추가' : '수정'} 예약</span>`)
      : '';

    const tags = (it.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join('');
    const goalsHtml = (it.goals || []).map(gid =>
      `<li><code>${escape(gid)}</code> <small style="color:var(--muted)">→ Docs/goals/${escape(gid)}.md</small></li>`
    ).join('') || `<li><em style="color:var(--muted)">(연결된 Goal 없음 — 아직 측정 가능 단계 아님)</em></li>`;

    const ancestors = ancestorsOf(it.id).filter(a => !(it.parents || []).includes(a)).sort();
    const descendants = descendantsOf(it.id).filter(d => !(it.children || []).includes(d)).sort();
    const siblings = siblingsOf(it.id);

    card.innerHTML = `
      <header class="card-head">
        <div class="row1">
          <span class="id">${escape(it.id)}</span>
          <span class="status ${escape(it.status)}">${escape(it.status)}</span>
          ${pillHtml(it)}
          ${pendingChip}
          <button class="btn-edit" data-edit-id="${escape(it.id)}" title="편집">✎</button>
        </div>
        <h1>${escape(it.title)}</h1>
        <div class="tags">${tags}</div>
      </header>
      <section class="card-body">
        <div class="actions">
          <button data-copy="show">경로 복사</button>
          <button data-copy="prompt">자연어 프롬프트</button>
          <span class="copied" hidden>복사됨</span>
        </div>
        <h2><span><span class="arrow">📝</span>Intent</span><span class="count"></span></h2>
        <pre>${escape(it.intent || '(미작성)')}</pre>
        <h2><span><span class="arrow">🎯</span>Linked Goals</span>`
        + `<span class="count">${(it.goals || []).length}</span></h2>`
        + `<ul class="linked">${goalsHtml}</ul>`
        + renderRelationSection('↑', 'parents', it.parents || [], idx, 0,
            { linkOf: it.id, kind: 'parent', editable: true })
        + renderRelationSection('↑↑', 'ancestors (전이)', ancestors, idx, 8)
        + renderRelationSection('↔', 'siblings (부모 공유)', siblings, idx, 10)
        + renderRelationSection('↓', 'children', it.children || [], idx, 0,
            { linkOf: it.id, kind: 'child', editable: true, createChildOf: it.id })
        + renderRelationSection('↓↓', 'descendants (전이)', descendants, idx, 12)
      + `</section>`;
    return card;
  }

  function attachCardHandlers(card) {
    card.querySelectorAll('[data-goto]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.dataset.goto;
        const from = parseInt(el.dataset.from, 10);
        navigateToChild(id, from);
      });
    });
    card.querySelectorAll('.toggle-more').forEach(el => {
      el.addEventListener('click', () => {
        const ul = el.previousElementSibling;
        if (ul && ul.classList.contains('rel')) {
          ul.querySelectorAll('li.overflow').forEach(li => { li.hidden = false; });
        }
        el.remove();
      });
    });
    card.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = card.dataset.id;
        const it = intentsById[id];
        if (!it) return;
        copyHandoff(it, btn.dataset.copy, card);
      });
    });
  }

  function copyHandoff(it, kind, card) {
    let text;
    if (kind === 'show') {
      text = `Docs/intents/${it.id}.md`;
    } else {
      const intent = (it.intent || '').trim().split(/\n+/).slice(0, 3).join(' ');
      text = `${it.id} (${it.title}) 의도를 더 작은 leaf 의도로 분해해줘. `
           + `Intent 본문은 Docs/intents/${it.id}.md 를 참조.`
           + (intent ? `\n\n의도: ${intent}` : '');
    }
    navigator.clipboard.writeText(text).then(() => {
      const m = card.querySelector('.copied');
      if (m) {
        m.hidden = false;
        setTimeout(() => { m.hidden = true; }, 1200);
      }
    });
  }

  function renderStack() {
    // 스택의 prefix 가 그대로면 기존 카드들을 유지 — 스크롤 위치 보존, 깜빡임 제거.
    // 단, viewVersion 이 바뀌었으면(편집/링크/언링크/새로고침 등) 데이터가 갱신되었으므로
    // dataset.id 가 같아도 강제 재렌더링하여 자식·부모 목록 등이 즉시 반영되도록 한다.
    const v = String(viewVersion);
    let i = 0;
    while (i < stackEl.children.length
           && i < stackIds.length
           && stackEl.children[i].dataset.id === stackIds[i]
           && stackEl.children[i].dataset.v === v) {
      i++;
    }
    while (stackEl.children.length > i) stackEl.lastElementChild.remove();
    for (let j = i; j < stackIds.length; j++) {
      const card = renderCard(stackIds[j], j);
      card.dataset.v = v;
      stackEl.appendChild(card);
      attachCardHandlers(card);
    }
    const tipIdx = stackEl.children.length - 1;
    for (let k = 0; k < stackEl.children.length; k++) {
      stackEl.children[k].classList.toggle('tip', k === tipIdx);
    }
    refreshMarkers();
    btnBack.disabled = stackIds.length <= 1;
    requestAnimationFrame(scrollToTip);
  }

  function refreshMarkers() {
    for (const card of stackEl.children) {
      card.querySelectorAll('ul.rel li[data-goto]').forEach(li => {
        const id = li.dataset.goto;
        li.classList.remove('in-stack', 'tip');
        if (inStack(id)) li.classList.add(isTip(id) ? 'tip' : 'in-stack');
      });
    }
  }

  function scrollToTip() {
    const last = stackEl.lastElementChild;
    if (!last) return;
    if (isMobile()) {
      stackEl.scrollTop = 0;
    } else {
      last.scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
    }
  }

  // ── 네비게이션 ──────────────────────────────────────────────────────────────
  function syncHistory(replace) {
    const url = '#' + stackIds.join('/');
    const stateObj = { stack: [...stackIds] };
    if (replace) {
      history.replaceState(stateObj, '', url);
    } else if (location.hash !== url || !history.state || !history.state.stack) {
      history.pushState(stateObj, '', url);
    } else {
      history.replaceState(stateObj, '', url);
    }
  }

  function navigateToChild(id, fromIdx) {
    if (!intentsById[id]) return;
    if (typeof fromIdx !== 'number' || fromIdx < 0) fromIdx = stackIds.length - 1;
    const nextStack = stackIds.slice(0, fromIdx + 1);
    const existing = nextStack.indexOf(id);
    if (existing !== -1) {
      stackIds = nextStack;
      syncHistory(false);
      renderBreadcrumb();
      renderListSelection();
      renderStack();
      requestAnimationFrame(() => {
        const card = stackEl.children[existing];
        if (card) card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
      return;
    }
    nextStack.push(id);
    stackIds = nextStack;
    syncHistory(false);
    renderBreadcrumb();
    renderListSelection();
    renderStack();
  }

  function navigateToIndex(idx) {
    if (idx < 0 || idx >= stackIds.length) return;
    if (idx === stackIds.length - 1) { scrollToTip(); return; }
    stackIds = stackIds.slice(0, idx + 1);
    syncHistory(false);
    renderBreadcrumb();
    renderListSelection();
    renderStack();
  }

  function setRoot(id) {
    if (!intentsById[id]) return;
    stackIds = [id];
    syncHistory(false);
    renderBreadcrumb();
    renderListSelection();
    renderStack();
  }

  function back() {
    if (stackIds.length > 1) history.back();
  }

  window.addEventListener('popstate', e => {
    let next = null;
    if (e.state && Array.isArray(e.state.stack)) {
      next = e.state.stack.filter(id => intentsById[id]);
    } else {
      next = parseHash();
    }
    if (!next.length && DATA.intents.length) next = [DATA.intents[0].id];
    stackIds = next;
    renderBreadcrumb();
    renderListSelection();
    renderStack();
  });

  function parseHash() {
    return location.hash.replace(/^#/, '')
      .split('/').map(decodeURIComponent)
      .filter(s => s && intentsById[s]);
  }

  // ── Drawer / 검색 ───────────────────────────────────────────────────────────
  function passes(it) {
    const q = qEl.value.trim().toLowerCase();
    if (q && !(it.id.toLowerCase().includes(q)
              || it.title.toLowerCase().includes(q)
              || (it.intent || '').toLowerCase().includes(q))) return false;
    if (statusEl.value && it.status !== statusEl.value) return false;
    if (tagSelect.value && !(it.tags || []).includes(tagSelect.value)) return false;
    return true;
  }
  function renderList() {
    const filtered = DATA.intents.filter(passes);
    countEl.textContent = `${filtered.length} / ${DATA.intents.length}`;
    listEl.innerHTML = '';
    for (const it of filtered) {
      const li = document.createElement('li');
      li.dataset.id = it.id;
      if (inStack(it.id)) li.classList.add(isTip(it.id) ? 'tip' : 'in-stack');
      if (it._pending) li.classList.add('pending-' + it._pending);
      const liChip = it._pending
        ? (it._pending === 'delete'
           ? `<span class="pending-chip delete">삭제</span>`
           : `<span class="pending-chip">${it._pending === 'create' ? '추가' : '수정'}</span>`)
        : '';
      li.innerHTML = `<span class="id">${escape(it.id)}</span>${escape(it.title)} `
                   + `<span class="status ${escape(it.status)}">${escape(it.status)}</span>`
                   + `${pillHtml(it)}${liChip}`;
      li.addEventListener('click', () => {
        setRoot(it.id);
        if (window.matchMedia('(max-width: 800px)').matches) closeDrawer();
      });
      listEl.appendChild(li);
    }
  }
  function renderListSelection() {
    listEl.querySelectorAll('li').forEach(li => {
      li.classList.remove('in-stack', 'tip');
      if (inStack(li.dataset.id)) {
        li.classList.add(isTip(li.dataset.id) ? 'tip' : 'in-stack');
      }
    });
  }
  function rebuildTagFilter() {
    const allTags = [...new Set(DATA.intents.flatMap(i => i.tags || []))].sort();
    const cur = tagSelect.value;
    tagSelect.innerHTML = '<option value="">모든 tag</option>';
    for (const t of allTags) {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      tagSelect.appendChild(o);
    }
    if (allTags.includes(cur)) tagSelect.value = cur;
  }

  function openDrawer() {
    drawerEl.classList.add('open');
    drawerEl.setAttribute('aria-hidden', 'false');
    scrimEl.classList.add('show');
    setTimeout(() => qEl.focus(), 50);
  }
  function closeDrawer() {
    drawerEl.classList.remove('open');
    drawerEl.setAttribute('aria-hidden', 'true');
    scrimEl.classList.remove('show');
  }

  btnMenu.addEventListener('click', () => {
    drawerEl.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  btnCloseDrawer.addEventListener('click', closeDrawer);
  scrimEl.addEventListener('click', closeDrawer);
  btnBack.addEventListener('click', back);

  qEl.addEventListener('input', renderList);
  statusEl.addEventListener('change', renderList);
  tagSelect.addEventListener('change', renderList);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (drawerEl.classList.contains('open')) {
        closeDrawer(); e.preventDefault();
      }
      return;
    }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Backspace' || (e.key === 'ArrowLeft' && (e.altKey || e.metaKey))) {
      e.preventDefault(); back();
    } else if (e.key === '/' || e.key === 's') {
      e.preventDefault(); openDrawer();
    }
  });

  // ── 인증 / 토큰 모달 ─────────────────────────────────────────────────────────
  function updateAuthUI(ok) {
    authIndicator.textContent = ok ? '● 연결됨' : '';
    authIndicator.className = ok ? 'ok' : '';
    [btnNew, btnSave, btnPR].forEach(b => { b.hidden = !ok; });

  btnSettings.addEventListener('click', async () => {
    const cfg = await GitHubStore.loadConfig().catch(() => null);

    document.getElementById('ti-repo').value = cfg ? cfg.owner + '/' + cfg.repo : metaRepo;

  document.getElementById('ti-cancel').addEventListener('click', () => tokenModal.close());
  document.getElementById('ti-save').addEventListener('click', async () => {
    const raw = document.getElementById('ti-repo').value.trim();

  // ── 편집 모달 ───────────────────────────────────────────────────────────────
  function buildMultiSel(containerId, excludeId, initialSelected) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    // 필터로 인해 항목이 사라져도 선택 상태가 유지되도록 Set 으로 별도 보관.
    const selected = new Set(initialSelected || []);
    container._selected = selected;

    const filter = document.createElement('input');
    filter.type = 'search';
    filter.className = 'multi-sel-filter';
    filter.placeholder = 'ID/제목 검색...';
    filter.autocomplete = 'off';
    container.appendChild(filter);

    const listEl = document.createElement('div');
    listEl.className = 'multi-sel-list';
    container.appendChild(listEl);

    function renderItems() {
      const q = filter.value.trim().toLowerCase();
      const tokens = q.split(/\s+/).filter(Boolean);
      listEl.innerHTML = '';
      let shown = 0;
      for (const it of DATA.intents) {
        if (it.id === excludeId) continue;
        if (it._pending === 'delete') continue;
        const hay = (it.id + ' ' + it.title).toLowerCase();
        const matches = !tokens.length || tokens.every(t => hay.includes(t));
        // 필터에 매치하지 않더라도 이미 선택된 항목은 항상 노출 — 실수 해제 방지.
        if (!matches && !selected.has(it.id)) continue;
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = it.id;
        if (selected.has(it.id)) cb.checked = true;
        cb.addEventListener('change', () => {
          if (cb.checked) selected.add(it.id); else selected.delete(it.id);
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + it.id + ' ' + it.title.slice(0, 40)));
        listEl.appendChild(label);
        shown++;
      }
      if (!shown) {
        const empty = document.createElement('div');
        empty.className = 'multi-sel-empty';
        empty.textContent = '일치하는 Intent 없음';
        listEl.appendChild(empty);
      }
    }
    filter.addEventListener('input', renderItems);
    renderItems();
  }
  function getChecked(containerId) {
    const container = document.getElementById(containerId);
    return container && container._selected ? [...container._selected] : [];
  }
  function showFormError(msg) {
    const el = document.getElementById('em-errors');
    el.textContent = msg; el.hidden = false;
  }

  function openEditModal(intent, isNew) {
    editTarget = { intent: Object.assign({}, intent), isNew };
    document.getElementById('em-heading').textContent = isNew ? '새 Intent' : '편집: ' + intent.id;
    document.getElementById('em-title').value = intent.title || '';
    document.getElementById('em-status').value = intent.status || 'proposed';
    document.getElementById('em-intent').value = intent.intent || '';
    document.getElementById('em-tags').value = (intent.tags || []).join(', ');
    document.getElementById('em-errors').hidden = true;
    document.getElementById('em-delete').style.display = isNew ? 'none' : '';
    buildMultiSel('em-parents', isNew ? null : intent.id, intent.parents || []);
    buildMultiSel('em-children', isNew ? null : intent.id, intent.children || []);
    editModal.showModal();
  }
  document.getElementById('em-cancel').addEventListener('click', () => editModal.close());

  document.getElementById('em-ok').addEventListener('click', () => {
    const title = document.getElementById('em-title').value.trim();
    if (!title) { showFormError('제목을 입력하세요'); return; }
    const patch = {
      title,
      status: document.getElementById('em-status').value,
      intent: document.getElementById('em-intent').value.trim(),
      parents: getChecked('em-parents'),
      children: getChecked('em-children'),
      tags: document.getElementById('em-tags').value.split(',').map(s => s.trim()).filter(Boolean),
    };

    // 동작 분류: 신규(브랜드뉴) / 예약된 create 편집 / 일반 update (실/예약)
    const ed = editTarget;
    const editingPendingCreate = !ed.isNew && ed.intent._pending === 'create';
    const isCreate = ed.isNew || editingPendingCreate;

    // 새 ID 결정 — 예약된 create 편집은 기존 ID 유지, 브랜드뉴는 다음 가용 ID.
    let myId;
    if (editingPendingCreate) myId = ed.intent.id;
    else if (ed.isNew) myId = nextAvailableId();
    else myId = ed.intent.id;

    // 검증용 테스트 리스트 — 부모/자식 양방향을 미러링해 양방향 일관성 false positive 방지.
    let testList;
    if (isCreate) {
      const parentSet = new Set(patch.parents);
      const childSet = new Set(patch.children);
      testList = baseIntents.map(x => {
        let copy = { ...x };
        if (parentSet.has(x.id)) copy.children = [...(copy.children || []), myId];
        if (childSet.has(x.id)) copy.parents = [...(copy.parents || []), myId];
        return copy;
      });
      testList.push(Object.assign({ id: myId }, patch));
    } else {
      testList = baseIntents.map(x => x.id === myId ? Object.assign({}, x, patch) : x);
    }
    const errs = IntentValidator.validate(testList);
    const relevant = errs.filter(e => e.id === myId);
    if (relevant.length) { showFormError(relevant.map(e => '[' + e.field + '] ' + e.message).join('\n')); return; }

    if (isCreate) {
      // 기존 동일 ID 의 예약된 create 가 있으면 제거 후 재추가.
      pendingChanges = pendingChanges.filter(c => !(c.type === 'create' && c.intent.id === myId));
      pendingChanges.push({ type: 'create', intent: Object.assign({ id: myId }, patch) });
    } else {
      pendingChanges = pendingChanges.filter(c => !(c.type !== 'create' && c.intent.id === myId));
      const baseIt = baseIntentsById[myId] || ed.intent;
      pendingChanges.push({ type: 'update', intent: Object.assign({}, baseIt, patch, { id: myId }), baseVersion: baseIt.baseVersion });
    }

    // 양방향 미러 — 이웃의 parents/children 도 pending update 로 반영하여
    // 저장 전에도 UI 가 일관되게 보이도록 한다. (인라인 편집과 동일한 동작)
    //   "old" 는 모달 오픈 시점의 효과적(merged) 상태 = 인라인 편집 결과까지 포함.
    //   ed.intent 는 openEditModal 에서 DATA.intents (merged view) 의 사본을 잡아둔 것.
    let oldParents, oldChildren;
    if (ed.isNew) {
      oldParents = new Set();
      oldChildren = new Set();
    } else {
      oldParents = new Set(ed.intent.parents || []);
      oldChildren = new Set(ed.intent.children || []);
    }
    const newParents = new Set(patch.parents);
    const newChildren = new Set(patch.children);
    const affected = new Set();
    for (const pid of newParents) if (!oldParents.has(pid)) {
      ensurePendingChange(pid, p => {
        p.children = p.children || [];
        if (!p.children.includes(myId)) p.children.push(myId);
      });
      affected.add(pid);
    }
    for (const pid of oldParents) if (!newParents.has(pid)) {
      ensurePendingChange(pid, p => {
        p.children = (p.children || []).filter(c => c !== myId);
      });
      affected.add(pid);
    }
    for (const cid of newChildren) if (!oldChildren.has(cid)) {
      ensurePendingChange(cid, c => {
        c.parents = c.parents || [];
        if (!c.parents.includes(myId)) c.parents.push(myId);
      });
      affected.add(cid);
    }
    for (const cid of oldChildren) if (!newChildren.has(cid)) {
      ensurePendingChange(cid, c => {
        c.parents = (c.parents || []).filter(p => p !== myId);
      });
      affected.add(cid);
    }
    for (const id of affected) pruneNoopPending(id);

    applyView();
    editModal.close();
    if (pendingChanges.length) markUnsaved(); else clearUnsaved();
    rebuildTagFilter();
    renderList();
    renderStack();
    showToast('변경 예약됨. [저장] 을 눌러 커밋하세요');
  });

  document.getElementById('em-delete').addEventListener('click', async () => {
    const intent = editTarget.intent;
    const hasChildren = DATA.intents.some(x =>
      x.id !== intent.id && (x.parents || []).includes(intent.id) && x._pending !== 'delete'
    );
    if (hasChildren) { showFormError('자식 Intent 가 있어 삭제할 수 없습니다'); return; }
    editModal.close();
    const ok = await confirm$('"' + intent.id + '" 를 삭제하시겠습니까?');
    if (!ok) return;
    // 삭제 대상의 이웃에서 참조 제거를 pending update 로 미러링 (UI 즉시 반영).
    const neighborParents = new Set(intent.parents || []);
    const neighborChildren = new Set(intent.children || []);
    if (intent._pending === 'create') {
      // 아직 서버에 없는 예약된 create — 그냥 예약을 취소.
      pendingChanges = pendingChanges.filter(c => !(c.type === 'create' && c.intent.id === intent.id));
    } else {
      pendingChanges = pendingChanges.filter(c => c.intent.id !== intent.id);
      const baseIt = baseIntentsById[intent.id] || intent;
      pendingChanges.push({ type: 'delete', intent: baseIt, baseVersion: baseIt.baseVersion });
    }
    const affectedDel = new Set();
    for (const pid of neighborParents) {
      ensurePendingChange(pid, p => {
        p.children = (p.children || []).filter(c => c !== intent.id);
      });
      affectedDel.add(pid);
    }
    for (const cid of neighborChildren) {
      ensurePendingChange(cid, c => {
        c.parents = (c.parents || []).filter(p => p !== intent.id);
      });
      affectedDel.add(cid);
    }
    for (const id of affectedDel) pruneNoopPending(id);
    applyView();
    if (pendingChanges.length === 0) clearUnsaved(); else markUnsaved();
    rebuildTagFilter();
    renderList();
    // 스택에서 삭제된 ID 정리.
    stackIds = stackIds.filter(id => intentsById[id]);
    if (!stackIds.length && DATA.intents.length) stackIds = [DATA.intents[0].id];
    renderBreadcrumb();
    renderStack();
    showToast(intent._pending === 'create' ? '추가 예약 취소됨' : '삭제 예약됨. [저장] 을 눌러 커밋하세요');
  });

  // ── Unsaved / Save ─────────────────────────────────────────────────────────
  function markUnsaved() {
    unsavedBadge.hidden = false;
    btnSave.disabled = false;
  }
  function clearUnsaved() {
    unsavedBadge.hidden = true;
    btnSave.disabled = true;
    pendingChanges = [];
  }
  btnSave.addEventListener('click', () => doSave());

  async function doSave() {
    if (!store || !store.token) { showToast('GitHub 토큰을 먼저 설정하세요', 'error'); return; }
    if (!pendingChanges.length) return;
    const origText = btnSave.textContent;
    btnSave.textContent = '저장 중…'; btnSave.disabled = true;
    const snapshot = pendingChanges.slice();
    const norm = v => Array.isArray(v) ? [...v].slice().sort().join('\x1f') : (v == null ? '' : String(v));
    const equalForSave = (a, b) => ['title','status','intent','parents','children','tags']
      .every(f => norm(a[f]) === norm(b[f]));
    try {
      for (const ch of snapshot) {
        if (ch.type === 'create') {
          const created = await store.create(ch.intent);
          showToast(created.id + ' 생성됨', 'success');
        } else if (ch.type === 'update') {
          // 인라인 관계 편집은 양쪽(부모/자식) 모두 pending 으로 기록한다.
          // store.update 의 미러 로직이 한쪽 커밋에서 다른 쪽까지 함께 갱신하므로,
          // 두번째 커밋이 빈 커밋으로 만들어지지 않도록 server 상태와 일치하면 skip.
          const live = await store.get(ch.intent.id).catch(() => null);
          if (live && equalForSave(live, ch.intent)) continue;
          // 배치 커밋에서 앞선 커밋 성공 후 store._headSha 가 갱신되므로 항상 최신 HEAD 사용.
          await store.update(ch.intent.id, ch.intent, store._headSha);
        } else if (ch.type === 'delete') {
          await store.remove(ch.intent.id, store._headSha);
        }
      }
      clearUnsaved();
      showToast('저장 완료', 'success');
      await refreshFromGitHub();
    } catch (e) {
      if (e.name === 'StaleError') {
        showToast('외부에서 변경됨 — 새로고침 후 다시 시도하세요', 'error');
      } else {
        showToast('저장 실패: ' + e.message, 'error');
        btnSave.disabled = false;
      }
    } finally {
      btnSave.textContent = origText;
      if (pendingChanges.length) btnSave.disabled = false;
    }
  }

  // ── PR 생성 ─────────────────────────────────────────────────────────────────
  btnPR.addEventListener('click', async () => {
    if (!store || !store.token) { showToast('GitHub 토큰을 먼저 설정하세요', 'error'); return; }
    if (pendingChanges.length) { showToast('먼저 [저장]을 완료하세요', 'error'); return; }
    try {
      const url = await store.createPR('intent: 의도 편집', 'intents/draft → main\n\n자동 생성된 PR');
      showToast('PR 생성됨', 'success');
      window.open(url, '_blank');
    } catch (e) { showToast('PR 생성 실패: ' + e.message, 'error'); }
  });

  // ── ＋ 버튼 ────────────────────────────────────────────────────────────────
  btnNew.addEventListener('click', () => {
    if (!store || !store.token) { tokenModal.showModal(); return; }
    openEditModal({ id: '', title: '', status: 'proposed', intent: '', parents: [], children: [], tags: [], baseVersion: null }, true);
  });

  // ── Quick switcher 팝오버 (Obsidian-style 연결) ───────────────────────────
  const linkPopover  = document.getElementById('link-popover');
  const lpInput      = document.getElementById('lp-input');
  const lpList       = document.getElementById('lp-list');
  const lpTitle      = document.getElementById('lp-title');
  const lpCreate     = document.getElementById('lp-create');
  let popoverState = null; // { ownerId, kind, activeIdx, candidates }

  function popoverCandidates(filter) {
    if (!popoverState) return [];
    const owner = intentsById[popoverState.ownerId];
    if (!owner) return [];
    const linked = new Set(popoverState.kind === 'parent'
      ? (owner.parents || []) : (owner.children || []));
    // 순환 차단:
    //   부모로 연결 → owner 의 자손은 부모가 될 수 없음
    //   자식으로 연결 → owner 의 조상은 자식이 될 수 없음
    const forbiddenCycle = new Set(popoverState.kind === 'parent'
      ? descendantsOf(popoverState.ownerId)
      : ancestorsOf(popoverState.ownerId));
    const q = (filter || '').trim().toLowerCase();
    const tokens = q.split(/\s+/).filter(Boolean);
    return DATA.intents.filter(it => {
      if (it.id === popoverState.ownerId) return false;
      if (linked.has(it.id)) return false;
      if (forbiddenCycle.has(it.id)) return false;
      if (it._pending === 'delete') return false;
      if (!tokens.length) return true;
      const hay = (it.id + ' ' + it.title).toLowerCase();
      return tokens.every(t => hay.includes(t));
    }).slice(0, 80);
  }

  function renderPopoverList() {
    const cands = popoverCandidates(lpInput.value);
    popoverState.candidates = cands;
    if (popoverState.activeIdx >= cands.length) popoverState.activeIdx = 0;
    lpList.innerHTML = '';
    if (!cands.length) {
      lpList.innerHTML = `<div class="popover-empty">일치하는 Intent 가 없습니다</div>`;
    } else {
      cands.forEach((it, i) => {
        const el = document.createElement('div');
        el.className = 'popover-item' + (i === popoverState.activeIdx ? ' active' : '');
        el.dataset.idx = String(i);
        const pendingChip = it._pending
          ? `<span class="pending-chip">${it._pending === 'create' ? '추가' : '수정'}</span>`
          : '';
        el.innerHTML = `<span class="id">${escape(it.id)}</span>`
                     + `<span class="ttl">${escape(it.title)}</span>`
                     + `<span class="status ${escape(it.status)}">${escape(it.status)}</span>`
                     + pendingChip;
        el.addEventListener('mousedown', (ev) => { ev.preventDefault(); commitPopover(it.id); });
        el.addEventListener('mouseenter', () => {
          popoverState.activeIdx = i;
          updatePopoverActive();
        });
        lpList.appendChild(el);
      });
    }
    // 자식 추가 시 "새로 만들기" 옵션 — 부모로 연결할 땐 의미 불명확이라 생략.
    if (popoverState.kind === 'child') {
      const filter = lpInput.value.trim();
      lpCreate.hidden = false;
      lpCreate.textContent = filter
        ? `＋ "${filter}" 새 자식 Intent 생성`
        : '＋ 새 자식 Intent 생성';
      lpCreate.classList.remove('disabled');
    } else {
      lpCreate.hidden = true;
    }
  }

  function updatePopoverActive() {
    const items = lpList.querySelectorAll('.popover-item');
    items.forEach((el, i) => el.classList.toggle('active', i === popoverState.activeIdx));
    const active = items[popoverState.activeIdx];
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function openLinkPopover(ownerId, kind, anchorEl) {
    popoverState = { ownerId, kind, activeIdx: 0, candidates: [] };
    lpInput.value = '';
    lpTitle.textContent = kind === 'parent'
      ? `${ownerId} 의 부모로 연결할 Intent`
      : `${ownerId} 의 자식으로 연결할 Intent`;
    linkPopover.hidden = false;
    // 임시 표시 후 위치 계산 (display:none 일 때 rect 가 0).
    const popRect = linkPopover.getBoundingClientRect();
    const anchorRect = anchorEl.getBoundingClientRect();
    const top = anchorRect.bottom + 6;
    const maxLeft = window.innerWidth - popRect.width - 8;
    const left = Math.max(8, Math.min(maxLeft, anchorRect.left));
    linkPopover.style.top  = `${top + window.scrollY}px`;
    linkPopover.style.left = `${left + window.scrollX}px`;
    renderPopoverList();
    setTimeout(() => lpInput.focus(), 0);
  }

  function closeLinkPopover() {
    if (!popoverState) return;
    popoverState = null;
    linkPopover.hidden = true;
  }

  function commitPopover(targetId) {
    if (!popoverState) return;
    const { ownerId, kind } = popoverState;
    closeLinkPopover();
    if (kind === 'parent') linkParentChild(targetId, ownerId);
    else                   linkParentChild(ownerId, targetId);
  }

  lpInput.addEventListener('input', () => {
    if (!popoverState) return;
    popoverState.activeIdx = 0;
    renderPopoverList();
  });
  lpInput.addEventListener('keydown', (e) => {
    if (!popoverState) return;
    if (e.key === 'Escape')      { e.preventDefault(); closeLinkPopover(); return; }
    if (e.key === 'ArrowDown')   { e.preventDefault();
      popoverState.activeIdx = Math.min((popoverState.candidates.length - 1), popoverState.activeIdx + 1);
      updatePopoverActive(); return;
    }
    if (e.key === 'ArrowUp')     { e.preventDefault();
      popoverState.activeIdx = Math.max(0, popoverState.activeIdx - 1);
      updatePopoverActive(); return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const cand = popoverState.candidates[popoverState.activeIdx];
      if (cand) commitPopover(cand.id);
      else if (popoverState.kind === 'child') lpCreate.click();
      return;
    }
  });
  lpCreate.addEventListener('mousedown', (e) => {
    e.preventDefault();
    if (!popoverState || popoverState.kind !== 'child') return;
    const owner  = popoverState.ownerId;
    const filter = lpInput.value.trim();
    closeLinkPopover();
    openEditModal({ id: '', title: filter, status: 'proposed', intent: '',
      parents: [owner], children: [], tags: [], baseVersion: null }, true);
  });
  document.addEventListener('mousedown', (e) => {
    if (!popoverState) return;
    if (linkPopover.contains(e.target)) return;
    if (e.target.closest('[data-link-rel-of]')) return;
    closeLinkPopover();
  });
  window.addEventListener('resize', closeLinkPopover);

  // ── ✎ / × / 🔗 / ＋ 버튼 (이벤트 위임) ────────────────────────────────────
  stackEl.addEventListener('click', e => {
    // × 연결 해제
    const unlinkBtn = e.target.closest('[data-unlink-owner]');
    if (unlinkBtn) {
      e.stopPropagation(); e.preventDefault();
      if (!store || !store.token) { tokenModal.showModal(); return; }
      const ownerId  = unlinkBtn.dataset.unlinkOwner;
      const targetId = unlinkBtn.dataset.unlinkTarget;
      const kind     = unlinkBtn.dataset.unlinkKind;
      if (kind === 'parent') unlinkParentChild(targetId, ownerId);
      else                   unlinkParentChild(ownerId, targetId);
      return;
    }
    // 🔗 기존 Intent 연결 (팝오버)
    const linkBtn = e.target.closest('[data-link-rel-of]');
    if (linkBtn) {
      e.stopPropagation();
      if (!store || !store.token) { tokenModal.showModal(); return; }
      const ownerId = linkBtn.dataset.linkRelOf;
      const kind    = linkBtn.dataset.linkRelKind;
      if (popoverState && popoverState.ownerId === ownerId && popoverState.kind === kind) {
        closeLinkPopover();
      } else {
        closeLinkPopover();
        openLinkPopover(ownerId, kind, linkBtn);
      }
      return;
    }
    // ＋ 새 자식 Intent 생성 (기존 동작)
    const addBtn = e.target.closest('[data-add-child-of]');
    if (addBtn) {
      e.stopPropagation();
      if (!store || !store.token) { tokenModal.showModal(); return; }
      const parentId = addBtn.dataset.addChildOf;
      openEditModal({ id: '', title: '', status: 'proposed', intent: '',
        parents: [parentId], children: [], tags: [], baseVersion: null }, true);
      return;
    }
    // ✎ 편집
    const btn = e.target.closest('[data-edit-id]');
    if (!btn) return;
    e.stopPropagation();
    const id = btn.dataset.editId;
    if (!store || !store.token) { tokenModal.showModal(); return; }
    const it = DATA.intents.find(x => x.id === id);
    if (!it) return;
    openEditModal(it, false);
  });

  // ── 데이터 로드 ─────────────────────────────────────────────────────────────
  function setLoading(msg) {
    loadingEl.hidden = false;
    loadingEl.textContent = msg || '로딩 중…';
    errorEl.hidden = true;
  }
  function clearLoading() {
    loadingEl.hidden = true;
  }
  function setError(msg) {
    loadingEl.hidden = true;
    errorEl.hidden = false;
    errorEl.textContent = msg;
  }

  function showFullError(title, detail) {
    stackEl.innerHTML = `<div class="full-status error">`
      + `<div class="title">${escape(title)}</div>`
      + `<div class="detail">${escape(detail || '')}</div>`
      + `</div>`;
  }

  function applyIntents(intents) {
    DATA.intents.length = 0;
    for (const it of intents) DATA.intents.push(it);
    for (const k of Object.keys(intentsById)) delete intentsById[k];
    for (const it of intents) intentsById[it.id] = it;
  }

  function setBaseIntents(intents) {
    baseIntents = intents.slice();
    for (const k of Object.keys(baseIntentsById)) delete baseIntentsById[k];
    for (const it of baseIntents) baseIntentsById[it.id] = it;
    applyView();
  }

  /** baseIntents 위에 pendingChanges 를 머지하여 DATA.intents 를 갱신한다. */
  function applyView() {
    viewVersion++;
    const map = new Map();
    for (const it of baseIntents) map.set(it.id, { ...it });
    for (const ch of pendingChanges) {
      if (ch.type === 'create') {
        map.set(ch.intent.id, { ...ch.intent, _pending: 'create', baseVersion: null });
      } else if (ch.type === 'update') {
        const cur = map.get(ch.intent.id);
        if (cur) {
          map.set(ch.intent.id, { ...cur, ...ch.intent, _pending: 'update' });
        }
      } else if (ch.type === 'delete') {
        const cur = map.get(ch.intent.id);
        if (cur) map.set(ch.intent.id, { ...cur, _pending: 'delete' });
      }
    }
    const merged = [...map.values()].sort((a, b) => a.id.localeCompare(b.id));
    applyIntents(merged);
  }

  /** 다음 사용 가능한 I-NNNN ID — baseIntents + pending creates 를 모두 회피. */
  function nextAvailableId(excludeId) {
    const used = new Set();
    for (const it of baseIntents) used.add(it.id);
    for (const ch of pendingChanges) {
      if (ch.type === 'create' && ch.intent.id !== excludeId) used.add(ch.intent.id);
    }
    let n = 1;
    while (used.has(`I-${String(n).padStart(4, '0')}`)) n++;
    return `I-${String(n).padStart(4, '0')}`;
  }

  function diagnoseFetchError(err) {
    const msg = (err && err.message) ? String(err.message) : String(err);
    if (msg.includes('404')) {
      return store && store.token
        ? '브랜치 또는 디렉토리를 찾을 수 없습니다. 저장소·브랜치 설정을 확인하세요.'
        : '저장소를 찾을 수 없습니다 — 공개 저장소인지 확인하세요.';
    }
    if (msg.includes('401')) return '토큰이 만료되었습니다 — ⚙ 설정에서 갱신하세요.';
    if (msg.includes('403')) return 'GitHub API 요청 한도 초과 또는 권한 부족 — ⚙ 설정에서 PAT 를 등록하면 한도가 늘어납니다.';
    return msg;
  }

  async function refreshFromGitHub() {
    if (!store) return;
    try {
      const intents = await store.list();
      setBaseIntents(intents);
      // 스택 정합성 — 사라진 ID 는 제거.
      stackIds = stackIds.filter(id => intentsById[id]);
      if (!stackIds.length && DATA.intents.length) stackIds = [DATA.intents[0].id];
      rebuildTagFilter();
      renderList();
      renderBreadcrumb();
      renderStack();
      clearLoading();
    } catch (e) {
      console.warn('refreshFromGitHub 실패:', e);
      setError(diagnoseFetchError(e));
    }
  }

  async function bootstrap() {
    setLoading('GitHub 에서 Intent 로딩 중…');
    const metaRepo = (document.querySelector('meta[name="github-repo"]') || {}).content || '';
    const cfg = await GitHubStore.loadConfig().catch(() => null);

    let owner, repo, token, branch;
    if (cfg && cfg.owner && cfg.repo) {
      owner = cfg.owner; repo = cfg.repo; token = cfg.token || undefined;
      branch = cfg.branch || (token ? 'intents/draft' : 'main');
    } else if (metaRepo) {
      const parts = metaRepo.split('/');
      if (parts.length >= 2 && parts[0] && parts[1]) {
        owner = parts[0]; repo = parts.slice(1).join('/'); token = undefined; branch = 'main';
      }
    }

    if (!owner || !repo) {
      clearLoading();
      showFullError('저장소가 설정되지 않았습니다', '⚙ 설정 버튼을 눌러 owner/repo 를 입력하세요.');
      updateAuthUI(false);
      return;
    }

    store = new GitHubStore({ owner, repo, token, branch });
    updateAuthUI(!!token);

    try {
      const intents = await store.list();
      setBaseIntents(intents);
      rebuildTagFilter();
      renderList();

      // 초기 스택 — URL hash 가 있으면 우선, 없으면 첫 Intent.
      let initial = parseHash();
      if (!initial.length && DATA.intents.length) initial = [DATA.intents[0].id];
      if (initial.length) {
        stackIds = [initial[0]];
        history.replaceState({ stack: [...stackIds] }, '', '#' + stackIds.join('/'));
        for (let i = 1; i < initial.length; i++) {
          stackIds.push(initial[i]);
          history.pushState({ stack: [...stackIds] }, '', '#' + stackIds.join('/'));
        }
      } else {
        stackIds = [];
      }
      renderBreadcrumb();
      renderListSelection();
      renderStack();
      clearLoading();

      // 외부 변경 폴링 — pendingChanges 가 비어 있을 때만 자동 새로고침.
      store.subscribe(async () => {
        if (pendingChanges.length) return;
        await refreshFromGitHub();
      });
    } catch (e) {
      console.error('bootstrap 실패:', e);
      const detail = diagnoseFetchError(e);
      clearLoading();
      setError(detail);
      showFullError('로딩 실패', detail);
    }
  }

  // 디버깅용 노출 — 콘솔에서 window.refreshFromGitHub() 호출 가능.
  window.refreshFromGitHub = refreshFromGitHub;
  window.renderList = renderList;
  window.renderBreadcrumb = renderBreadcrumb;
  window.renderStack = renderStack;

  bootstrap();
})();
</script>
</body>
</html>
