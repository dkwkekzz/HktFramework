<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HWR Viewer — 원소로 굴러가는 세계</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0c10; color: #c8d0dc; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display: flex; height: 100%; }
  #panel { width: 264px; flex: none; padding: 14px; border-right: 1px solid #1c2230; overflow: auto; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #cv { display: block; width: 100%; height: 100%; cursor: crosshair; }
  h1 { font-size: 14px; margin: 0 0 2px; color: #e6ecf5; }
  .sub { color: #6b778a; margin: 0 0 14px; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { width: 88px; color: #8a96a8; }
  button { background: #18202e; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 5px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #212c3e; }
  button.primary { background: #1f3a5c; border-color: #2f5688; }
  input[type=number], input[type=text] { background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  input[type=number] { width: 64px; }
  input[type=text] { width: 150px; }
  select { background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .stat { color: #8a96a8; font-size: 11px; margin-top: 12px; border-top: 1px solid #1c2230; padding-top: 10px; }
  .stat b { color: #c8d0dc; font-weight: 600; }
  .note { color: #5b6678; font-size: 10px; margin-top: 10px; }
  .err { color: #e0707a; font-size: 11px; margin-top: 8px; white-space: pre-wrap; }
  hr { border: 0; border-top: 1px solid #1c2230; margin: 12px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>HWR — 뷰어</h1>
    <p class="sub">원소로 굴러가는 세계</p>

    <div class="row"><label>규칙 경로</label><input id="rulePath" type="text" placeholder="../rules/rule_0001/rule_0001.js" /></div>
    <div class="row"><label>시나리오</label><input id="scnPath" type="text" placeholder="(선택) ../rules/.../scenario.js" /></div>
    <div class="row"><button id="load" class="primary">규칙 로드</button><button id="useDemo">내장 데모</button></div>
    <div id="loadErr" class="err"></div>

    <hr/>

    <div class="row">
      <button id="play" class="primary">▶ 재생</button>
      <button id="stepBtn">스텝</button>
      <button id="reset">리셋</button>
    </div>
    <div class="row"><label>스텝/프레임</label><input id="speed" type="number" min="1" max="50" step="1" value="1" /></div>
    <div class="row"><label>배속</label>
      <select id="speedMult">
        <option value="0.25">×0.25</option>
        <option value="0.5">×0.5</option>
        <option value="1" selected>×1</option>
        <option value="2">×2</option>
        <option value="4">×4</option>
        <option value="8">×8</option>
      </select>
    </div>
    <div class="row"><button id="capture">📷 캡처(PNG)</button></div>

    <div class="stat">
      <div>규칙: <b id="s-rule">—</b></div>
      <div>tick: <b id="s-tick">0</b></div>
      <div>원소 수: <b id="s-n">0</b></div>
    </div>

    <p class="note">스테이지를 클릭하면 원소를 더한다. 드래그하면 속도를 준다.<br/>규칙 코드 계약은 <code>hwr-task/SKILL.md</code> 참조.</p>
  </div>

  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<script type="module">
// ── 내장 데모 규칙 ───────────────────────────────────────────────
// 규칙이 하나도 없어도 "세계와 원소를 그리는 것"이 동작하도록 하는 최소 규칙.
// rules/rule_NNNN/rule_NNNN.js 가 따라야 할 계약(SKILL.md §규칙 코드 계약)의 실례이기도 하다.
const demoRule = {
  id: 'demo',
  name: '내장 데모 — 자유 원소 드리프트',
  defaults: { count: 60, speed: 1.2, radius: 4 },
  setup(params) {
    const w = 800, h = 600;
    // 시드 의사난수 — 결정론(같은 시드 → 같은 세계). Math.random 금지.
    let s = 1234567;
    const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const els = [];
    for (let i = 0; i < params.count; i++) {
      const a = rnd() * Math.PI * 2;
      els.push({
        x: rnd() * w, y: rnd() * h,
        vx: Math.cos(a) * params.speed, vy: Math.sin(a) * params.speed,
        r: params.radius, hue: Math.floor(rnd() * 360),
      });
    }
    return { width: w, height: h, tick: 0, elements: els };
  },
  step(world, params) {
    const { width: w, height: h } = world;
    for (const e of world.elements) {
      e.x += e.vx; e.y += e.vy;
      // 경계와 상호작용 — 벽에서 반사(보존되는 속력)
      if (e.x < e.r) { e.x = e.r; e.vx = -e.vx; }
      else if (e.x > w - e.r) { e.x = w - e.r; e.vx = -e.vx; }
      if (e.y < e.r) { e.y = e.r; e.vy = -e.vy; }
      else if (e.y > h - e.r) { e.y = h - e.r; e.vy = -e.vy; }
    }
    world.tick++;
  },
};

// ── 뷰어 상태 ────────────────────────────────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let rule = demoRule;
let scenario = null;
let params = { ...demoRule.defaults };
let world = null;
let playing = false;
let acc = 0;

const $ = id => document.getElementById(id);

function buildWorld() {
  const src = scenario && scenario.setup ? scenario : rule;
  world = src.setup({ ...params });
  if (!world || !Array.isArray(world.elements)) {
    world = { width: 800, height: 600, tick: 0, elements: [] };
  }
  acc = 0;
  syncStats();
}

function syncStats() {
  $('s-rule').textContent = rule.name || rule.id || '—';
  $('s-tick').textContent = world ? world.tick : 0;
  $('s-n').textContent = world ? world.elements.length : 0;
}

// ── 렌더 ─────────────────────────────────────────────────────────
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
}
window.addEventListener('resize', resize);

function draw() {
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!world) return;
  // 세계 → 화면: 종횡비 유지하며 맞춤
  const sx = cv.width / world.width, sy = cv.height / world.height;
  const sc = Math.min(sx, sy);
  const ox = (cv.width - world.width * sc) / 2;
  const oy = (cv.height - world.height * sc) / 2;
  // 세계 경계
  ctx.strokeStyle = '#1c2230';
  ctx.strokeRect(ox, oy, world.width * sc, world.height * sc);
  // 원소
  for (const e of world.elements) {
    const r = Math.max(1, (e.r || 3) * sc);
    ctx.beginPath();
    ctx.arc(ox + e.x * sc, oy + e.y * sc, r, 0, Math.PI * 2);
    ctx.fillStyle = e.color || `hsl(${e.hue ?? 200} 70% 60%)`;
    ctx.fill();
  }
  // 좌표 변환 보관(인터랙션용)
  draw._sc = sc; draw._ox = ox; draw._oy = oy;
}

// ── 루프 ─────────────────────────────────────────────────────────
function tick() {
  if (playing && world) {
    const mult = parseFloat($('speedMult').value);
    const perFrame = parseInt($('speed').value, 10) || 1;
    acc += perFrame * mult;
    while (acc >= 1) { rule.step(world, params); acc -= 1; }
    syncStats();
  }
  draw();
  requestAnimationFrame(tick);
}

// ── 인터랙션 ─────────────────────────────────────────────────────
let dragStart = null;
cv.addEventListener('mousedown', ev => {
  if (!world) return;
  const rect = cv.getBoundingClientRect();
  dragStart = { sx: ev.clientX - rect.left, sy: ev.clientY - rect.top };
});
window.addEventListener('mouseup', ev => {
  if (!world || !dragStart) return;
  const rect = cv.getBoundingClientRect();
  const ex = ev.clientX - rect.left, ey = ev.clientY - rect.top;
  const sc = draw._sc || 1, ox = draw._ox || 0, oy = draw._oy || 0;
  // 화면 → 세계 좌표
  const wx = (dragStart.sx - ox) / sc, wy = (dragStart.sy - oy) / sc;
  const vx = (ex - dragStart.sx) / sc * 0.08, vy = (ey - dragStart.sy) / sc * 0.08;
  world.elements.push({
    x: wx, y: wy, vx, vy,
    r: params.radius || 4, hue: (world.tick * 37) % 360,
  });
  dragStart = null;
  syncStats();
});

// ── 컨트롤 ───────────────────────────────────────────────────────
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ 일시정지' : '▶ 재생'; };
$('stepBtn').onclick = () => { if (world) { rule.step(world, params); syncStats(); } };
$('reset').onclick = () => buildWorld();
$('useDemo').onclick = () => { rule = demoRule; scenario = null; params = { ...demoRule.defaults }; $('loadErr').textContent = ''; buildWorld(); };
$('capture').onclick = () => {
  const a = document.createElement('a');
  a.download = `hwr-${rule.id || 'world'}-t${world ? world.tick : 0}.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
};

$('load').onclick = async () => {
  $('loadErr').textContent = '';
  const rp = $('rulePath').value.trim();
  const sp = $('scnPath').value.trim();
  if (!rp) { $('loadErr').textContent = '규칙 경로를 입력하세요.'; return; }
  try {
    const rmod = await import(/* @vite-ignore */ rp + (rp.includes('?') ? '' : `?t=${performance.now()}`));
    rule = rmod.default || rmod;
    if (!rule || typeof rule.step !== 'function') throw new Error('규칙에 step(world, params) 가 없습니다.');
    scenario = null;
    if (sp) {
      const smod = await import(/* @vite-ignore */ sp + (sp.includes('?') ? '' : `?t=${performance.now()}`));
      scenario = smod.default || smod;
    }
    params = { ...(rule.defaults || {}) };
    buildWorld();
  } catch (e) {
    $('loadErr').textContent = '로드 실패: ' + (e && e.message ? e.message : e)
      + '\n(브라우저 보안상 ES 모듈 로드는 http 서버에서 동작합니다. 예: python3 -m http.server)';
  }
};

// ── 시작 ─────────────────────────────────────────────────────────
resize();
buildWorld();
requestAnimationFrame(tick);
</script>
</body>
</html>
