<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HktAssetGeneratorA — Sword Generator</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1d21; color: #ddd;
      font: 13px/1.5 system-ui, sans-serif; overflow: hidden; }
    #app { display: flex; height: 100%; }
    #viewport { flex: 1; position: relative; }
    #viewport canvas { display: block; }
    #panel { width: 320px; overflow-y: auto; padding: 12px 14px; box-sizing: border-box;
      background: #24262b; border-left: 1px solid #333; }
    #panel h3 { margin: 14px 0 6px; font-size: 12px; color: #9ab; text-transform: uppercase; }
    .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .row label { flex: 0 0 110px; color: #aaa; }
    .row input[type=range] { flex: 1; }
    .row select, .row input[type=number] { background: #1b1d21; color: #ddd;
      border: 1px solid #444; border-radius: 3px; padding: 2px 4px; }
    .row .val { flex: 0 0 52px; text-align: right; color: #8fc; font-variant-numeric: tabular-nums; }
    button { background: #35507a; color: #fff; border: 0; border-radius: 4px;
      padding: 6px 10px; margin: 4px 4px 0 0; cursor: pointer; }
    button:hover { background: #416397; }
    #uv-preview { width: 100%; aspect-ratio: 1; background: #17181c;
      border: 1px solid #333; margin-top: 6px; }
    #stats { margin-top: 8px; color: #8a8; white-space: pre-line; }
    /* Operation 로그 (Phase 4) */
    .op-list { border: 1px solid #333; border-radius: 4px; background: #1b1d21;
      max-height: 190px; overflow-y: auto; padding: 3px; }
    .op-row { display: flex; align-items: center; gap: 4px; padding: 2px 3px; }
    .op-row:nth-child(odd) { background: #202227; }
    .op-text { flex: 1; font-size: 11px; color: #cbd; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .op-empty { color: #667; font-size: 11px; padding: 4px; }
    .op-btn { padding: 2px 6px; margin: 0; font-size: 11px; }
    .op-form { margin-top: 6px; }
    .op-bounds { display: flex; gap: 3px; flex: 1; }
    .op-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    /* 참조 맞춤 (Phase 5) */
    .ref-annotator { position: absolute; inset: 0; background: rgba(12,13,16,0.96); z-index: 10; }
    .ref-toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 6px; height: 26px;
      background: #1f2126; border-bottom: 1px solid #333; }
    .ref-toolbar button { padding: 3px 8px; margin: 0; font-size: 11px; background: #3a3d45; }
    .ref-toolbar button.active { background: #35507a; }
    .ref-toolbar select { background: #1b1d21; color: #ddd; border: 1px solid #444;
      border-radius: 3px; font-size: 11px; }
    .ref-anno-canvas { display: block; cursor: crosshair; }
    .ref-canvas { width: 100%; background: #17181c; border: 1px solid #333; margin-top: 6px; display: block; }
    .ref-status { margin-top: 6px; color: #9ab; white-space: pre-line; font-size: 12px; }
    button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>
    <div id="panel"></div>
  </div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
