<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>HktFeature — 오픈월드 MMORPG 규칙 시뮬레이션</title>
  <style>
    body { margin: 0; background: #06080b; color: #dbe4ec; font-family: sans-serif;
           display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 15px; font-weight: 600; margin: 12px 0 8px; color: #9db2c4; }
    canvas { border: 1px solid #1c2330; border-radius: 4px; }
    /* 제어 UI (feature-0010) — 표적 클릭 지목(step4) + 욕망 버튼(단축키 1·2·0 과 동일 동작) */
    #desirehint { margin: 10px 0 2px; font-size: 12px; color: #9db2c4; max-width: 900px; text-align: center; line-height: 1.5; }
    #desirehint b { color: #ffd76e; }
    #desirebar { display: flex; gap: 8px; align-items: center; margin: 4px 0 4px; font-size: 13px; }
    #desirebar .lbl { color: #7a8aa0; margin-right: 2px; }
    #desirebar button { cursor: pointer; border: 1px solid #2a3648; border-radius: 6px;
      background: #121826; color: #cdd8e6; padding: 6px 14px; font-size: 13px; font-family: inherit;
      transition: background .12s, border-color .12s; }
    #desirebar button:hover { background: #1a2334; }
    #desirebar button.active[data-desire="forage"] { background: #17492f; border-color: #78dc96; color: #b6f5cc; }
    #desirebar button.active[data-desire="eat"]    { background: #4a3616; border-color: #f0b45a; color: #f7dcae; }
    #desirebar button.active[data-desire="hunt"]   { background: #4a2018; border-color: #e6785a; color: #f6c3b2; }
    #desirebar button.active[data-desire="craft"]  { background: #2f2650; border-color: #b496eb; color: #ddd0f7; }
    #desirebar button.active[data-desire="none"]   { background: #3a3116; border-color: #ffd76e; color: #ffe9b0; }
    #desirebar kbd { color: #5f7285; font-size: 11px; }
  </style>
</head>
<body>
  <h1>HktFeature — 규칙을 정의하고 시뮬레이션한다 (관측 뷰어)</h1>
  <div id="desirehint">내 생명체는 <b>스스로 산다</b>(feature-0018 욕구 시스템) — 굶주리면 채집·사냥, 배부르면 제조, 위협엔 회피. 머리 위 배지가 지금의 <b>동기</b>(🍖허기·🛡안전·⚙질서), HUD 가 지금 수행 중 <b>전략</b>. 아래 버튼이나 <b>표적 클릭</b>으로 <b>명령</b>하면 자율을 우회하고, 다 하면 스스로 자율로 돌아온다.</div>
  <div id="desirebar">
    <span class="lbl">명령 →</span>
    <button data-desire="forage">🌿 채집 <kbd>1</kbd></button>
    <button data-desire="hunt">⚔ 사냥 <kbd>2</kbd></button>
    <button data-desire="eat">🍚 식사 <kbd>3</kbd></button>
    <button data-desire="craft">🔨 제조 <kbd>4</kbd></button>
    <button data-desire="none">✋ 대기 <kbd>0</kbd></button>
  </div>
  <canvas id="game" width="960" height="640"></canvas>
  <script type="module" src="/client/main.js"></script>
</body>
</html>
