id: S3
name: subject-instance
purpose: >
  종·문화·역할 위에 이력과 성격을 얹어 개별 주체를 낳고, 그 주체의 모든 값이 어디서 왔는지를 댈 수 있게 한다.

inputs: [SpeciesArchetype, CultureArchetype, RoleArchetype, PastEvent, Trait]
outputs: [SubjectInstance, Provenance, InstanceViolation]

writes:                         # S3 도 시뮬레이션을 돌리지 않는다 — 개체가 태어날 때의 첫 값을 정한다.
  - SubjectInstance
  - State                       # 과거가 지금 남긴 값 (relational.grudge, informational.knows, …)

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2]

subtasks:                       # 상태 원소 4종 · 검증 장면 다수 → WORKFLOW §3 분할
  - id: S3-a
    name: past-event
    purpose: 지나간 사건이 지금의 자리에 남긴 값으로만 개체에 걸리게 한다 — 흔적 없는 과거는 과거가 아니다.
    status: DONE
  - id: S3-b
    name: trait
    purpose: 성격이 이미 있는 값을 흔들 뿐 새 자리를 만들지 못하게 한다.
    status: DONE
  - id: S3-c
    name: instance
    purpose: 종·문화·역할·이력·성격을 한 개체로 합치고 모든 값에 유래를 붙인다.
    status: PLANNED
  - id: S3-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 개별 주체 카드로 S3 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - s3-same-culture-diverges    # 정상: 같은 문화의 둘이 이력·성격으로 갈리고 모든 값이 유래를 댄다
  - s3-broken-instances-rejected # 실패: 설 수 없는 이력·성격·개체가 각자의 사유로 거부된다
  - s3-boundary                 # 경계: 이력 없음 · 성격 없음 · 배수의 양끝 · 유래 완결

elements:
  - name: SubjectInstance
    ontology: Subject           # S0 SubjectProfile 을 확장한다 — 필드를 빼지 않고 더한다
    renderer: diff
  - name: PastEvent
    ontology: Event             # 실제로 일어난 일 — 상태를 바꾸지 않으면 사건이 아니다 (O1)
    renderer: diff
  - name: Residue
    ontology: State             # 과거가 지금 남긴 값 — O2 의 실재하는 자리에만 적힌다
    renderer: diff
  - name: Trait
    ontology: Rule              # "이 개체에게서는 이 값이 이렇게 흔들린다" 는 서술
    renderer: diff

lab: /lab/s3                    # 개별 주체 카드 (값마다 유래 배지) + 같은 문화 두 개체 대조 + 거부 사유

status: IN_PROGRESS
