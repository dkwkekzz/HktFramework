# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# 단계 3(M3 충돌하는 주체)의 다섯째 모듈이다. R3 이 증거로 닫혔으므로 착수를 막는 게이트는 없다.

id: R4
name: belief
purpose: >
  주체가 실제가 아닌 **믿는 세계**를 형성하게 한다 — 읽은 것에서 무엇이 일어났는지를 짐작한다.

inputs: [Percept, PerceptField, WorldPhenomenon, SubjectInstance]
outputs: [Belief, BeliefGraph, BeliefViolation]

writes: []                      # 믿음은 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P3, R0, R1, R2, R3]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - r4-same-percept-different-beliefs
  - r4-groundless-belief-rejected
  - r4-boundary

elements:
  - name: Belief
    ontology: Claim             # 착수 시 확정한다 — O1 `Claim` 이 "주체가 참이라 여기는 것" 을
                                # 이미 열어 두었다. P3-b `ContextFact` 의 기억 축(stale)도 재료다.
    renderer: diff              # 실제 세계 vs 믿음 diff (MODULES.md R4 행)

lab: /lab/r4

status: PLANNED

# R3 이 R4 에 넘긴 자리:
#   - 지각에는 진실이 실리지 않는다 — 무엇이 일어났는지를 짐작하는 것이 R4 의 첫 일이다.
#   - 애매함(`Percept.ambiguity`)이 클수록 짐작이 갈린다. 그 값은 R2 가 이미 세어 두었다.
#   - 보고 통로는 났을 뿐 아직 퍼지지 않는다 — 거치는 주체가 왜곡 지점이라는 것이 R4 다 (S0-b).
#   - 같은 흔적을 두 번 읽는 일(반복 관측으로 확신이 오르는 것)도 R4 의 몫이다.
#   - P3-b 가 이미 열어 둔 자리: 기억은 실재를 요구하지 않되 지금과 어긋나면 stale 이다.
