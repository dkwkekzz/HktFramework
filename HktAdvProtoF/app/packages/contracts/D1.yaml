id: D1
name: dependency-graph-schema
purpose: >
  확정된 의존 대상 열한 종을 노드로 세우고, 그 노드들을 무엇으로 잇는지(관계 7종)를 확정한다.

inputs: [DependencyKind, KindGrounding, StateSchema, Band]
outputs: [DependencyNode, DependencyEdge, DependencyGraph, GraphViolation]

writes: []                      # D1 도 세계를 바꾸지 않는다 — 그래프의 모양만 확정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0]

subtasks:                       # 노드·간선·조립은 검사기가 다르고, 그래프 뷰는 공용 렌더러다 → WORKFLOW §3
  - id: D1-a
    name: dependency-node
    purpose: 종마다 정해진 자리에서만 조건을 읽게 하고, D0 대상 관문을 그대로 지나게 한다.
    status: DONE
  - id: D1-b
    name: dependency-edge
    purpose: 관계 7종이 D0 의 성격(소모·가리킴)과 어긋나면 거부한다.
    status: DONE
  - id: D1-c
    name: dependency-graph
    purpose: 뿌리에서 닿지 않는 노드·순환·끊긴 참조를 막고 그래프 해시를 고정한다.
    status: DONE
  - id: D1-d
    name: graph-renderer
    purpose: 공용 그래프 뷰를 세운다 — 노드 색은 종, 간선은 관계, 굵기는 강도 (WORKFLOW §6-2).
    status: DONE
  - id: D1-e
    name: eye-check
    purpose: 시나리오 3종과 Lab 그래프로 D1 을 눈으로 확인한다.
    status: DONE

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - d1-winter-food-graph        # 정상: 뿌리 하나에서 뻗은 그래프가 서고, 같은 그래프는 같은 해시가 된다
  - d1-broken-graphs-rejected   # 실패: 소모할 수 없는 것을 소모하거나 닿지 않는 노드·순환이 거부된다
  - d1-boundary                 # 경계: 노드 하나짜리 그래프 · 시간 노드의 틱 조건 · 수치의 양끝

elements:
  - name: DependencyGraph
    ontology: Dependency        # 노드 하나하나가 O1 Dependency 로 선다
    renderer: graph

lab: /lab/d1                    # 그래프 뷰(노드=종 색, 간선=관계) + 노드·간선 표 + 거부 사유

status: VERIFIED
evidence: evidence/D1.json
