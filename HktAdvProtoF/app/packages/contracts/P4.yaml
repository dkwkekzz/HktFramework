# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.

id: P4
name: goal-selection
purpose: >
  펴 놓은 가능성 중 실제로 추구할 목적 하나를 고르고, 매 틱 흔들리지 않게 관성을 준다.

inputs: [PossibilitySubgraph, PressureReport, SubjectInstance, ExpansionContext]
outputs: [ActiveGoal, GoalScore, GoalViolation]

writes: []                      # P4 도 세계를 바꾸지 않는다 — 무엇을 좇을지만 정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P1, P2, P3]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - p4-picks-under-pressure
  - p4-broken-selection-rejected
  - p4-boundary

elements:
  - name: ActiveGoal
    ontology: Possibility       # 고른 목적은 그 가능성 자체다 — 새 타입을 만들지 않는다
    renderer: gauge             # 후보별 점수표 + 선택 마크 (MODULES.md P4 행)

lab: /lab/p4

status: PLANNED
