id: P0
name: action-atom
purpose: >
  가능성을 구성하는 최소 행동을 16원자로 확정하고, 각 원자가 무엇을 요구하고 세계의 어느 자리를
  바꾸며 무엇을 치르는지를 못박는다.

inputs: [ActionAtoms, StateSchema, DependencyKind, Affordance]
outputs: [ActionAtomSpec, AtomResolution, AtomGrounding, ActionProposal, ActionFit, ActionAtomViolation]

writes: []                      # P0 도 세계를 바꾸지 않는다 — 무엇을 바꿀 수 있는지의 문법만 확정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4]

subtasks:                       # 목록 확정·세계 걸림·요청 문법은 검사기가 다르다 → WORKFLOW §3
  - id: P0-a
    name: atom-reconciliation
    purpose: 원문이 흩어 적은 행동(P1 방향 7 · P2 예시 15)이 16원자로 남김없이 환원되는지 대조한다.
    status: DONE
  - id: P0-b
    name: atom-grounding
    purpose: 원자마다 무엇을 읽고 어느 자리를 바꾸고 무엇을 치르는지를 O2 실재 자리로 못박고, 접히는 원자·채울 수 없는 종을 드러낸다.
    status: DONE
  - id: P0-c
    name: action-grammar
    purpose: O1 이 열어 둔 `Affordance.action` 자리를 16종으로 닫고, 원자가 열지 않은 변경·대가 없는 행동·보지 않고 하는 조작을 거부한다.
    status: DONE
  - id: P0-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 원자표로 P0 를 눈으로 확인한다.
    status: DONE

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - p0-sixteen-atoms            # 정상: 원문이 흩어 적은 행동이 16원자로 환원되고, 굶주림 하나 앞에 원자가 갈린다
  - p0-broken-actions-rejected  # 실패: 16종 밖의 행동·대가 없는 요청·보지 않은 조작이 각자의 사유로 거부된다
  - p0-boundary                 # 경계: 아무 원자도 채우지 못하는 종(시간·규칙) · 짝 없는 원자 · 동의 축의 양끝

elements:
  - name: ActionAtom
    ontology: Affordance        # 원자는 O1 Affordance 의 `action` 자리를 채우는 이름표다
    renderer: diff

lab: /lab/p0                    # 원자 16표(축·자리·대가) + 원문 환원 대조 + 굶주림 앞의 열여섯 + 거부 사유

status: VERIFIED
evidence: evidence/P0.json
