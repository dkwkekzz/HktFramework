# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# 단계 4(E 계층 — 충돌과 콘텐츠 사건)의 첫 모듈이다. R6 가 증거로 닫혔으므로 착수를 막는
# 게이트는 없다. 앞 계층이 여기로 넘긴 자리:
#   - D5 가 남긴 한 줄: "누가 누구와 싸우는지는 서로를 봐야 알고, 상황으로 묶는 것은 E0 다."
#     D5 는 "이 대상 앞에 이들이 함께 서 있다" 까지이고 주체끼리는 잇지 않았다.
#   - R1 이 남긴 한 줄: "같은 틱에 같은 자리를 다투는 사건 둘의 판정은 D5·E0 의 몫이다."
#   - R6 가 남긴 한 줄: 의도는 한 주체의 것이다 — 여럿의 의도가 같은 자리에 걸리는 것을
#     보는 눈이 아직 없다.

id: E0
name: situation-clustering
purpose: >
  같은 공간·자원·대상에 걸린 목적과 의도들을 하나의 **상황**으로 묶는다.

inputs: [ActionIntent, ActiveGoal, DependencyConflict, Relationship]
outputs: [Situation]

writes: []                      # 상황은 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, D5, P0, P1, P2, P3, P4, P5, R0, R1, R2, R3, R4, R5, R6]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - e0-intents-cluster-into-situation
  - e0-groundless-situation-rejected
  - e0-boundary

elements:
  - name: Situation
    ontology: Event             # 착수 시 확정한다 — D5 `Contest` 가 이미 "이 대상 앞에 이들이
                                # 함께 서 있다" 를 갖고 있고, E0 는 거기에 의도를 얹는다.
    renderer: graph             # 상황 클러스터 맵 — MODULES.md E0 행

lab: /lab/e0

status: PLANNED
