# 단계 4(E 계층 — 충돌과 콘텐츠 사건)의 첫 모듈. R6 가 증거로 닫혔으므로 착수를 막는 게이트는 없다.
#
# 앞 계층이 여기로 넘긴 자리:
#   - D5 가 남긴 한 줄: "누가 누구와 싸우는지는 서로를 봐야 알고, 상황으로 묶는 것은 E0 다."
#     D5 는 "이 대상 앞에 이들이 함께 서 있다" 까지이고 주체끼리는 잇지 않았다.
#   - R1 이 남긴 한 줄: "같은 틱에 같은 자리를 다투는 사건 둘의 판정은 D5·E0 의 몫이다."
#     → E0 는 그 자리를 **세우는** 데까지 갚는다. 판정 자체는 E3 다 (아래 "뒤에 넘기는 자리").
#   - R6 가 남긴 한 줄: 의도는 한 주체의 것이다 — 여럿의 의도가 같은 자리에 걸리는 것을
#     보는 눈이 아직 없다.
#
# E0 가 새로 정하는 것은 **둘뿐**이고 둘 다 결과를 갖는다 (R6 가 세운 설계 시험 그대로 —
# "그래서 무엇이 달라지는가" 를 한 줄로 못 대는 규칙은 세우지 않는다).
#
#   ① **혼자 걸린 자리는 상황이 아니다.**   → 세계의 대부분은 상황이 아니다. 상황이 흔해지면
#                                             아무 뜻도 갖지 못한다 (D5 "겹친다고 다툼은 아니다").
#   ② **겹쳤다고 서로를 아는 것은 아니다.** → 같은 상황 안에서도 **서로 겨눈 쌍**과 **한쪽만
#                                             겨눈 쌍**과 **아무도 겨누지 않은 쌍**이 갈리고,
#                                             겨누는 자를 상대가 아는지까지 갈린다(매복).
#                                             그 값이 E3 판정의 정보 표면 입력이 된다.
#
# 읽어 오는 것 (E0 는 다시 재지 않는다):
#   무엇을 겨누는가        R6 `ActionIntent.aim` · `proposal.changes` · `proposal.targetIds`
#   무엇을 좇는가          P4 `ActiveGoal.nodeId`
#   무엇을 다투는가        D5 `DependencyConflict`(자리·대상 축) — 급함도 D5 severity 그대로
#   누구를 아는가          R6 `knownCounterparts` (R5 지목 + 세계에 적힌 사이)
#
# 북극성 기여 (CLAUDE.md — 새 계층의 첫 계약이므로 한 줄씩):
#   ① 능력 — 상황 안의 `awareness` 가 E3 능력 충돌 판정의 **정보 표면** 입력을 미리 값으로 세운다.
#            "정보 상태만 바꿔 승패가 뒤집히는 장면" 이 서려면 그 정보가 먼저 상황 안에 있어야 한다.
#   ② 세계관 — 같은 자리에 걸린 것을 묶는 눈이 E5 **제도 무대**(무대 안 Situation 재해석)의 전제다.

id: E0
name: situation-clustering
purpose: >
  같은 공간·자원·대상·사람에 걸린 목적과 의도들을 하나의 **상황**으로 묶고,
  그 안에서 **누가 누구를 알아보는가**를 값으로 세운다.

inputs: [ActionIntent, ActiveGoal, DependencyConflict, Memory, WorldState]
outputs: [SituationStake, Situation, SituationPair, SituationField, SituationViolation]

writes: []                      # 상황은 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, D5, P0, P1, P2, P3, P4, P5, R0, R1, R2, R3, R4, R5, R6]

subtasks:                       # 검증 장면이 셋을 넘는다 → WORKFLOW §3
  - id: E0-a
    name: stake
    purpose: 의도·목적·다툼이 어느 자리에 걸리는가를 한 이름으로 편다 — 사람 축이 처음 열린다.
    status: DONE
  - id: E0-b
    name: cluster
    purpose: 둘 이상 걸린 자리만 상황이 되고, 그 안의 쌍마다 겨눔과 앎이 갈린다.
    status: DONE
  - id: E0-c
    name: field
    purpose: 상황장·감사 — 빠뜨린 상황은 걸리고, 혼자 걸린 자리는 사실로 남는다.
    status: IN_PROGRESS
  - id: E0-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 상황 클러스터 맵으로 E0 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - e0-recognized-contest        # 정상: 넷의 겨눔이 한 상황으로 묶이고, 아는 자와 모르는 자가 갈린다
  - e0-groundless-situation-rejected # 실패: 혼자뿐인 상황·자기 쌍·결과를 적은 상황·빠뜨린 상황
  - e0-boundary                  # 경계: 빈 재료 · 걸린 자리가 하나뿐 · 같은 주체 안의 겹침

elements:
  - name: SituationStake
    ontology: null              # 걸림은 세계에 적히는 것이 아니라 의도·다툼에서 읽히는 것이다 —
                                # D5 `DependencyClaim` 과 같은 처지다.
    renderer: graph             # 상황 클러스터 맵의 재료 — MODULES.md E0 행
  - name: Situation
    ontology: null              # **O1 12타입에 없고, 없는 것이 옳다.** D5 `DependencyConflict` 가
                                # 든 이유 그대로다 — 상황은 세계에 적히는 것이 아니라 여럿의 의도
                                # 사이에서 읽히는 것이고, 세계에 적히는 것은 그것이 사건으로
                                # **확정될 때**이며 그것은 E3 다.
    renderer: graph             # 상황 클러스터 맵 (주체↔주체 간선) — MODULES.md E0 행

lab: /lab/e0

status: IN_PROGRESS

# E0 가 뒤에 넘기는 자리:
#   - **이기는 자를 정하지 않는다.** 상황이 섰다는 것과 그 안에서 누가 누구를 알아보는가까지다 —
#     결과를 확정하는 것은 E3 다 (D5 가 세운 못을 그대로 진다).
#   - **무엇을 하자고 하는가는 정하지 않는다.** 요청인지 협박인지 거래인지를 고르는 것은 E1 이고,
#     E0 는 그 선택이 놓일 자리(상황과 그 안의 앎)까지다.
#   - **다대다 겨눔은 쌍으로만 편다.** 한 의도가 여럿을 한꺼번에 겨누는 일은 아직 없다 —
#     상황 안의 쌍이 그것을 대신하고, 진짜 다대다는 E3·E4 의 자리다.
