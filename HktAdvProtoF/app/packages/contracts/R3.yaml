id: R3
name: perception
purpose: >
  주체가 감각과 위치에 따라 현상을 감지하게 한다 — 같은 흔적을 놓고 보는 자와 못 보는 자가 갈린다.

# R3 이 새로 정하는 것은 **거리와 차폐를 세계에서 읽는 규칙** 하나뿐이다.
#   통로 6종          O1 `PHENOMENON_CHANNELS`
#   통로별 문턱·거리   S0-b `PerceptionProfile` — 판정(`perceives`)까지 이미 있다
#   종별 감각          S1 `SenseSpec` (개체 배정은 S3)
#   무엇이 났는가      R2 `WorldPhenomenon`
#   선 곳·차폐         O2 `physical.region` · `physical.cover`
# S0-b 가 남긴 한 줄("어디서 났는지를 거리로 바꾸는 일은 위치를 아는 R3 의 몫이다")을 갚는다.

inputs: [WorldPhenomenon, PhenomenonField, PerceptionProfile, WorldState]
outputs: [Percept, PerceptField, PerceptViolation]

writes: []                      # 감지는 세계를 바꾸지 않는다 — 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, R0, R1, R2]

subtasks:                       # 검증 장면이 셋을 넘는다 → WORKFLOW §3
  - id: R3-a
    name: reach
    purpose: 자리를 거리로 바꾸고 차폐를 통로별 감쇠로 옮긴다.
    status: DONE
  - id: R3-b
    name: percept
    purpose: 감지를 판정하고 Percept 를 세운다 — 진실은 실리지 않는다.
    status: DONE
  - id: R3-c
    name: percept-field
    purpose: 주체별 지각장과 감사 — 아무도 보지 못한 흔적을 값으로 짚는다.
    status: DONE
  - id: R3-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 감지 대조로 R3 을 눈으로 확인한다.
    status: DONE

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - r3-same-trace-different-eyes  # 정상: 같은 열다섯 흔적 앞에서 다섯 종이 서로 다른 세계에 산다
  - r3-unsensed-phenomenon-rejected  # 실패: 진실이 실린 지각·없는 통로·세계 밖의 주체 등이 거부된다
  - r3-boundary                 # 경계: 아무도 보지 못한 흔적 · 차폐가 죽인 빛 · 적히지 않은 거리

elements:
  - name: Percept
    ontology: Percept           # **O1 12타입에 없고, 없는 것이 옳다.** O1 은 세계에 적히는 것을 세고
                                # 지각은 세계가 아니라 주체 안에 있다. 세계에 적히는 것은 R2 흔적까지,
                                # 주체가 갖는 것은 R4 BeliefGraph 다 — Percept 는 그 사이의 통과물이다.
    renderer: diff              # 같은 현상, 주체별 감지 비교 (MODULES.md R3 행)

lab: /lab/r3

status: VERIFIED
evidence: evidence/R3.json

# R2 가 R3 에 넘긴 자리:
#   - R2 는 세계에 무엇이 났는지까지만 안다 — 감각 프로파일·거리·차폐로 거르는 것은 R3 다.
#   - 통로 6종은 감각의 갈래가 아니라 **전달의 갈래**다 — 촉각·추론으로의 분해는 R3 프로필이 맡는다.
#   - 애매함(`WorldPhenomenon.ambiguity`)은 났을 뿐 아직 해석되지 않았다 — 무엇으로 읽는가는 R4 다.
