# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# 단계 3(M3 충돌하는 주체)의 넷째 모듈이다. R2 가 증거로 닫혔으므로 착수를 막는 게이트는 없다.

id: R3
name: perception
purpose: >
  주체가 감각과 위치에 따라 현상을 감지하게 한다 — 같은 흔적을 보는 자와 못 보는 자가 갈린다.

inputs: [WorldPhenomenon, PhenomenonField, SubjectInstance, WorldState]
outputs: [Percept, PerceptionProfile, PerceptViolation]

writes: []                      # 감지는 세계를 바꾸지 않는다 — 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P3, R0, R1, R2]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - r3-same-trace-different-eyes
  - r3-unsensed-phenomenon-rejected
  - r3-boundary

elements:
  - name: Percept
    ontology: Percept           # 착수 시 확정한다 — O1 12타입에 Percept 는 없다. 감지된 것을
                                # Claim(주체가 참이라 여기는 것)으로 세울지, R2 가 WorldPhenomenon
                                # 으로 그랬듯 O1 밖의 파생 타입으로 세울지가 R3-a 의 첫 판단이다.
    renderer: diff              # 같은 현상, 주체별 감지 비교 (MODULES.md R3 행)

lab: /lab/r3

status: PLANNED

# R2 가 R3 에 넘긴 자리:
#   - R2 는 세계에 무엇이 났는지까지만 안다 — 감각 프로파일·거리·차폐로 거르는 것은 R3 다.
#   - 통로 6종은 감각의 갈래가 아니라 **전달의 갈래**다 — 촉각·추론으로의 분해는 R3 지각 프로파일이 맡는다.
#   - 애매함(`WorldPhenomenon.ambiguity`)은 났을 뿐 아직 해석되지 않았다 — 무엇으로 읽는가는 R4 다.
