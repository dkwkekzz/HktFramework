# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# 단계 3(M3 충돌하는 주체)의 마지막 모듈이다. R5 가 증거로 닫혔으므로 착수를 막는 게이트는 없다.
#
# R6 가 갚을 자리는 앞 계층이 하나씩 적어 두었다:
#   - P5 가 남긴 한 줄: "계획은 아직 요청이 아니다" — `ActionPlan` 을 세계에 내보내는 통로가 없다.
#     형식은 P0-c `ActionProposal` 이 이미 갖고 있고, 그것을 세계에 얹는 것은 R1 이다.
#   - R4 가 남긴 한 줄: "믿음은 아직 목적을 바꾸지 않는다" — P3-b `ContextFact` 자리에 믿음이
#     들어가면 주체는 실제가 아니라 **믿음으로** 행동한다 (원문 §6.4·§19). 그때 오해가 사건이 된다.
#   - R5 가 남긴 한 줄: "기억이 목적을 바꾸는 것은 R6 다" — P4-b 가 평균으로 읽던 사이 자리에
#     R5 `Relationship`(지목해 읽은 값)이 들어가는 자리다.

id: R6
name: action-intent
purpose: >
  활성 목적과 계획을 실제 세계 행동으로 제출한다 — 그리고 **믿음과 기억으로** 그것을 고른다.

inputs: [ActiveGoal, ActionPlan, BeliefGraph, MemoryLedger, Relationship]
outputs: [ActionIntent]

writes: []                      # 의도는 아직 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, D5, P0, P1, P2, P3, P4, P5, R0, R1, R2, R3, R4, R5]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - r6-belief-drives-action
  - r6-groundless-intent-rejected
  - r6-boundary

elements:
  - name: ActionIntent
    ontology: Affordance        # 착수 시 확정한다 — P0-c `ActionProposal` 이 이미 형식을 갖고 있다.
    renderer: timeline          # 틱별 의도 큐 — MODULES.md R6 행

lab: /lab/r6

status: PLANNED
