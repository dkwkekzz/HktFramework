# 단계 3(M3 충돌하는 주체)의 마지막 모듈. R5 가 증거로 닫혔으므로 착수를 막는 게이트는 없었다.
#
# R6 가 새로 정하는 것은 **둘뿐**이고 둘 다 결과를 갖는다.
#   ① 겨눌 수 있는 것은 아는 상대뿐이다   → 지목 없는 자는 남을 겨누지 못하고, 지목이 틀린 자는
#                                          엉뚱한 사람을 겨눈다 (오해가 사건이 된다)
#   ② 누구를 겨누는가는 사이가 고른다     → 같은 계획인데 사이가 다르면 다른 사람을 겨눈다
#
# 읽어 오는 것:
#   요청의 형식            P0-c `ActionProposal` (§19 WorldChangeRequest 가 이미 여기 있다)
#   상대가 필요한 원자      P0-b `touches: 'between'` 여섯 — 나머지 열은 자리·물건을 겨눈다
#   등지는가 내미는가       P0-b `consent` (P4-b 가 쓴 그 축 그대로)
#   낼 순서                P5 `ActionPlan.steps`
#   무엇을 좇는가          P4 `ActiveGoal`
#   낼 수 있는가           P2 `PossibilityGrammar.allowed`
#   누구를 아는가          R5 `Relationship` · `Memory.attribution`
#   사건으로 세우는 것      R1 `mintEvent` / `applyEvent`
#
# 이번 계층의 설계 시험 한 줄 (R5 기억 조건 지적에서 배운 것):
#   **규칙마다 "그래서 무엇이 달라지는가" 를 한 줄로 못 대면 그 규칙은 세우지 않는다.**
#   값은 만드는데 아무 데도 닿지 않는 객체를 내는 규칙은 규율을 만족시킬 뿐 세계를 굴리지 않는다.

id: R6
name: action-intent
purpose: >
  활성 목적과 계획을 실제 세계 행동으로 제출한다 — 그리고 **겨눌 상대를 사이가 고르게 한다**.

inputs: [ActionPlan, ActiveGoal, Relationship, Memory, PossibilityGrammar, WorldState]
outputs: [ActionIntent, ActionProposal, IntentViolation]

writes: []                      # 의도는 아직 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, D5, P0, P1, P2, P3, P4, P5, R0, R1, R2, R3, R4, R5]

subtasks:                       # 검증 장면이 셋을 넘는다 → WORKFLOW §3
  - id: R6-a
    name: intent
    purpose: 계획의 걸음 하나가 요청이 된다 · 상대가 필요한 원자는 여섯뿐이다.
    status: IN_PROGRESS
  - id: R6-b
    name: aim
    purpose: 사이가 상대를 고른다 — 원한은 등지는 손을, 신뢰는 내미는 손을 부른다.
    status: PLANNED
  - id: R6-c
    name: queue
    purpose: 의도장·감사와 고리 닫기 — 의도가 사건이 되고 흔적이 나 다시 읽힌다.
    status: PLANNED
  - id: R6-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 의도 큐로 R6 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - r6-grudge-becomes-action     # 정상: 원한이 04 를 겨눈 요청이 되고 그것이 사건·흔적으로 돌아온다
  - r6-groundless-intent-rejected # 실패: 아는 상대 없이 겨눈 의도·낼 수 없는 원자·빈 계획이 거부된다
  - r6-boundary                   # 경계: 겨눌 상대가 없는 걸음 · 자기 자신 · 빈 의도장

elements:
  - name: ActionIntent
    ontology: Affordance        # O1 `Affordance` 를 그대로 쓴다 — "누가 무엇에 무엇을 할 수 있는가"
                                # 가 이미 열려 있고 `action` 은 P0-c 가 16종으로 닫아 두었다.
                                # R6 는 겨눈 상대·고른 사유·요청서를 더할 뿐이다.
    renderer: timeline          # 틱별 의도 큐 — MODULES.md R6 행

lab: /lab/r6

status: IN_PROGRESS
