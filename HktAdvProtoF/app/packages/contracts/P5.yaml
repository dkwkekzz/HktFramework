# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.

id: P5
name: action-planning
purpose: >
  고른 목적을 실제 행동 단위까지 분해한다 — 원자 하나가 아니라 순서열이 되는 자리다.

inputs: [ActiveGoal, AtomPrerequisite, PayabilityReport, PossibilitySubgraph]
outputs: [ActionPlan, PlanStep, PlanViolation]

writes: []                      # P5 도 세계를 바꾸지 않는다 — 무엇을 어떤 순서로 낼지만 정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P1, P2, P3, P4]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - p5-plans-the-chain
  - p5-broken-plan-rejected
  - p5-boundary

elements:
  - name: ActionPlan
    ontology: Possibility       # 계획은 아직 일어나지 않은 것이다 — 세계에 적히는 것은 R 계층부터
    renderer: timeline          # 계획 단계 목록 (MODULES.md P5 행) — 새 공용 렌더러가 필요하다

lab: /lab/p5

status: PLANNED

# P4 가 P5 에 넘긴 자리 (착수 시 카드로 옮긴다):
#   - 갈래를 낼 원자는 P4 가 가장 나은 하나로 접었다. 순서열로 펴는 것은 여기다.
#   - 선행 사슬은 아직 한 칸이다(P3-c). 긴 사슬(찾기 → 만들기 → 빼앗기)이 여기서 선다.
#   - 재료 선행의 "먼저 낼 원자"(PayabilityReport.blockedBy)가 계획의 앞칸이 된다.
