id: P5
name: action-planning
purpose: >
  고른 목적을 실제 행동 단위까지 분해한다 — 원자 하나가 아니라 순서열이 되는 자리다.

# 계획의 순서는 P5 가 정하지 않는다 — 아래 입력이 이미 "먼저" 를 지고 있다.
#   원자 사이의 먼저=AtomPrerequisite(P3-a) · 세계와 맞댄 먼저 낼 원자=PayabilityReport(P4-a)
#   무엇을 좇는가=ActiveGoal(P4) · 지금 무엇이 보이는가=ExpansionContext(P3-b)
inputs: [ActiveGoal, AtomPrerequisite, PayabilityReport, ExpansionContext, WorldState]
outputs: [PlanStep, ActionPlan, ChainResolution, ChainReport, PlanViolation]

writes: []                      # P5 도 세계를 바꾸지 않는다 — 무엇을 어떤 순서로 낼지만 정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P1, P2, P3, P4]

subtasks:                       # 검증 장면이 넷이고 새 상태 원소가 3종을 넘는다 → WORKFLOW §3
  - id: P5-a
    name: plan-chain
    purpose: 고른 목적 하나에서 뒤로 거슬러 지금 낼 수 있는 원자까지 사슬을 세운다.
    status: DONE
  - id: P5-b
    name: chain-reconciliation
    purpose: 원문 P5 가 든 일곱 단계가 16원자를 지나 이 사슬에서 도출되는지 대조한다.
    status: IN_PROGRESS
  - id: P5-c
    name: timeline-renderer
    purpose: 공용 렌더러 5종 중 넷째(타임라인)를 세운다 — 순서가 있는 것을 순서대로 그린다.
    status: PLANNED
  - id: P5-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 타임라인으로 P5 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - p5-plans-the-chain          # 정상: 한 걸음처럼 보이던 목적이 세계에 따라 다른 길이로 펴진다
  - p5-broken-plan-rejected     # 실패: 끊긴 사슬·순서가 뒤집힌 걸음·자기를 딛는 걸음이 거부된다
  - p5-boundary                 # 경계: 지금 바로 낼 수 있으면 사슬은 한 칸이고, 닿지 못해도 던지지 않는다

elements:
  - name: PlanStep
    ontology: Possibility       # 걸음 하나도 아직 일어나지 않은 것이다
    renderer: timeline
  - name: ActionPlan
    ontology: Possibility       # 계획은 아직 일어나지 않은 것이다 — 세계에 적히는 것은 R 계층부터
    renderer: timeline          # 계획 단계 목록 (MODULES.md P5 행) — P5-c 가 세우는 렌더러다
  - name: ChainResolution
    ontology: Rule              # 원문 이름 하나가 원자로 접히는 규칙 (P0 환원표와 같은 모양)
    renderer: diff

lab: /lab/p5

status: IN_PROGRESS

# P4 가 P5 에 넘긴 자리 (착수 시 카드로 옮긴다):
#   - 갈래를 낼 원자는 P4 가 가장 나은 하나로 접었다. 순서열로 펴는 것은 여기다.
#   - 선행 사슬은 아직 한 칸이다(P3-c). 긴 사슬(찾기 → 만들기 → 빼앗기)이 여기서 선다.
#   - 재료 선행의 "먼저 낼 원자"(PayabilityReport.blockedBy)가 계획의 앞칸이 된다.
