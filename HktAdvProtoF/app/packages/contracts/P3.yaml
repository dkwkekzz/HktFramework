id: P3
name: lazy-possibility-expansion
purpose: >
  모든 가능성을 미리 만들지 않고, 지금 보이는 것·기억·관계에 걸린 부분만 펼친다.

inputs: [NarrowedTree, PossibilityGrammar, AtomGrounding, Percept, Memory, Relationship, Capability]
outputs: [AtomPrerequisite, PrerequisiteReport, PossibilitySubgraph, ExpansionTrace, PossibilityGraphViolation]

writes: []                      # P3 도 세계를 바꾸지 않는다 — 무엇을 펼칠지만 정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P1, P2]

subtasks:                       # 검증 장면이 넷이고 새 상태 원소가 3종을 넘는다 → WORKFLOW §3
  - id: P3-a
    name: atom-prerequisite
    purpose: 원자 사이의 선행 관계를 손으로 적지 않고 P0 걸림(reads/writes/pays)에서 계산한다.
    status: DONE
  - id: P3-b
    name: expansion-context
    purpose: 지금 보이는 것·기억·관계·능력을 확장의 근거 하나로 세운다.
    status: PLANNED
  - id: P3-c
    name: subgraph-assembly
    purpose: 근거에 걸린 가능성만 펼쳐 활성 부분 그래프를 세우고 preconditionIds 를 채운다.
    status: PLANNED
  - id: P3-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 부분 그래프(전체 회색·활성 발광)로 P3 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — P3-d 에서 확정한다
  - p3-expands-relevant-only
  - p3-broken-expansion-rejected
  - p3-boundary

elements:
  - name: AtomPrerequisite
    ontology: Rule              # 원자 사이에 걸린 규칙 — 세계가 아니라 문법에 선다
    renderer: graph
  - name: PossibilitySubgraph
    ontology: Possibility
    renderer: graph             # 전체 회색, 활성 부분 발광 (MODULES.md P3 행)

lab: /lab/p3

status: IN_PROGRESS
evidence: null
