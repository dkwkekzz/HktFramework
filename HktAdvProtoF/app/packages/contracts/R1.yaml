id: R1
name: event-sourced-mutation
purpose: >
  세계의 모든 상태 변화를 사건으로만 허용한다 — 사건 없이 담긴 칸은 원장 감사에서 걸린다.

# R1 도 새 문법을 지어내지 않는다. 무엇을 바꿀 수 있는지는 P0-b 걸림이, 요청이 설 수 있는지는
# P0-c `fitAction` 이, 사건이 무엇으로 이루어지는지는 O1 `Event` 가, 담기는 규칙은 R0 이 이미 정했다.
# R1 이 더하는 것은 **통로**다: 세계를 바꾸는 길이 사건 하나뿐이 되게 하는 것.
inputs: [ActionProposal, WorldStateStore, WorldState, Tick]
outputs: [WorldEvent, EventEffect, EventLog, ApplyResult, EventViolation, CommitResult]

writes: []                      # 사건이 바꾸는 자리는 P0-b 가 원자마다 못박은 자리뿐이다 — R1 은 그 밖을 열지 않는다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, R0]

subtasks:                       # 검증 장면이 셋이다 → WORKFLOW §3
  - id: R1-a
    name: event-shape
    purpose: 행동 요청 하나를 세계에 낼 수 있는 사건으로 세운다.
    status: DONE
  - id: R1-b
    name: event-application
    purpose: 사건을 R0 원장에 적용하고, 사건 없이 담긴 칸을 찾아낸다.
    status: DONE
  - id: R1-c
    name: eye-check
    purpose: 시나리오 3종과 Lab 사건 로그로 R1 을 눈으로 확인한다.
    status: DONE

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - r1-events-move-the-world    # 정상: 겨울이 사건으로 다시 서고, 모든 칸이 사건 id 를 가리킨다
  - r1-silent-change-rejected   # 실패: 원자 밖의 변경·낡은 전제·되돌릴 수 없는 것의 되돌림·사건 없는 칸이 거부된다
  - r1-boundary                 # 경계: 바닥난 창고에서 먹는 사건 · 자연 발생(유예) · 사건 하나짜리 로그

elements:
  - name: WorldEvent
    ontology: Event             # O1 이 이미 연 자리를 채운다 — 새 타입을 만들지 않는다
    renderer: timeline          # 사건 로그 (MODULES.md R1 행) — P5-c 가 세운 공용 렌더러 ④

lab: /lab/r1

status: VERIFIED
evidence: evidence/R1.json

# R1 이 뒤 계층에 넘기는 자리:
#   - 자연 발생 사건(actorId null)은 유예다 — 규칙이 실체화(W2)되어야 근거를 댈 수 있다.
#   - 사건이 남기는 관찰 가능한 흔적(Phenomenon)은 R2 의 몫이다 — R1 은 사건까지만 만든다.
#   - 같은 틱에 같은 자리를 다투는 사건 둘의 판정은 D5·E0 의 몫이다.
