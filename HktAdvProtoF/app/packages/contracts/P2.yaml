id: P2
name: possibility-grammar
purpose: >
  같은 결핍 앞에서도 주체 유형과 문화에 따라 다른 갈래가 나오게 한다 — 낼 손이 있는가,
  낼 수 있어도 하지 않는가.

inputs: [SubjectKind, SpeciesArchetype, CultureArchetype, RoleArchetype, ActionAtom, AtomGrounding, StrategyTree]
outputs: [KindFooting, AccessRule, AbilityGrant, AtomBan, PossibilityGrammar, NarrowedTree, ExampleReport, GrammarViolation]

writes: []                      # P2 도 세계를 바꾸지 않는다 — 누가 무엇을 낼 수 있는지의 문법만 확정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P1]

subtasks:                       # 접근 격자·문화 겹침·적용은 검사기가 다르다 → WORKFLOW §3
  - id: P2-a
    name: kind-access
    purpose: S0 경계 4종을 접근 4종(직접·구성원·의념·막힘)으로 번역해 유형 × 원자 격자를 계산한다.
    status: DONE
  - id: P2-b
    name: culture-overlay
    purpose: 능력이 대가를 의념으로 옮기고 금기가 원자를 닫는 겹침을 세우고, 거짓 인용을 거부한다.
    status: DONE
  - id: P2-c
    name: narrow-and-reconcile
    purpose: 문법으로 P1 갈래를 좁히고(닫기만 한다), 원문 P2 다섯 줄이 격자에서 도출되는지 대조한다.
    status: DONE
  - id: P2-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 격자·대조표로 P2 를 눈으로 확인한다.
    status: DONE

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - p2-five-grammars            # 정상: 유형 다섯이 다른 손으로 내고, 원문 다섯 줄이 도출되며, 같은 종의 셋이 갈린다
  - p2-broken-grammars-rejected # 실패: 몸 없는 자의 직접 행동·없는 능력·아무도 열지 않은 금기가 거부된다
  - p2-boundary                 # 경계: 능력이 열지 못하는 자리 · 문화가 걸러 내는 원자 · 좁히기의 한 방향

elements:
  - name: PossibilityGrammar
    ontology: Rule              # 문법은 그 주체에게 걸린 규칙이다 — 문화·역할과 같은 자리에 선다
    renderer: diff

lab: /lab/p2                    # 유형 × 원자 격자 80칸 + 원문 다섯 줄 대조 + 같은 종 셋의 갈림

status: VERIFIED
evidence: evidence/P2.json
