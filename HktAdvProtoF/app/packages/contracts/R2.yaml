id: R2
name: phenomenon-emission
purpose: >
  사건이 관찰 가능한 현상으로 나타나게 한다 — 주체는 세계의 상태를 직접 읽지 못하고 현상만 감지한다.

# R2 도 새 문법을 지어내지 않는다.
#   통로가 몇 가지인가   O1 `PHENOMENON_CHANNELS` 6종이 이미 고정했다
#   흔적이 왜 필요한가   O0 `observable-trace`(흔적 없는 것은 아무도 알 수 없다) ·
#                        `caused-persistence`(원인 없는 지속적 결과는 없다)
#   무엇이 움직였는가    R1 `WorldEvent.effects` (from → to)
#   그 자리가 잴 수 있나  O2 스키마 범위 + P4-a `MEASURABLE_SPAN`
#   흔적이 남는가        P0-b `reversible`
# R2 가 더하는 것은 **표면**이다: 세계의 변화가 어느 통로로 새는지, 그리고 무엇이 새지 않는지.

inputs: [WorldEvent, EventLog, WorldState]
outputs: [WorldPhenomenon, PhenomenonField, PhenomenonViolation]

writes: []                      # 현상은 사건의 흔적이다 — 세계 상태를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P4, R0, R1]

subtasks:                       # 검증 장면이 셋을 넘는다 → WORKFLOW §3
  - id: R2-a
    name: leak-channels
    purpose: 자리마다 어느 통로로 새는지를 선언하고, 새지 않는 자리를 예외로 못박는다.
    status: DONE
  - id: R2-b
    name: phenomenon-emission
    purpose: 사건 하나가 남기는 현상을 세기·수명·자리·애매함까지 세운다.
    status: PLANNED
  - id: R2-c
    name: phenomenon-field
    purpose: 현상장 — 틱마다 무엇이 아직 남아 있는가, 그리고 흔적 없이 지나간 사건은 무엇인가.
    status: PLANNED
  - id: R2-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 현상 타임라인으로 R2 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - r2-events-leave-traces      # 정상: 다섯 사건이 흔적으로 갈리고, 앎은 새지 않는다
  - r2-causeless-phenomenon-rejected  # 실패: 원인 없는 현상·로그 밖의 원인·새지 않는 자리의 현상 등이 거부된다
  - r2-boundary                 # 경계: 흔적 없이 지나가는 사건 · 사라지지 않는 흔적 · 잴 수 없는 자리의 세기

elements:
  - name: Phenomenon
    ontology: Phenomenon        # O1 이 통로 6종(빛·소리·흔적·냄새·의념 잔향·보고서)까지 이미 고정했다
    renderer: timeline          # 현상 수명 (MODULES.md R2 행은 3D+타임라인 — 3D 는 X 계층에서 붙는다)

lab: /lab/r2

status: IN_PROGRESS

# R2 가 뒤 계층에 넘기는 자리:
#   - **누가 그것을 감지하는가는 R3 의 몫이다.** R2 는 세계에 무엇이 났는지까지만 안다 —
#     감각 프로파일·거리·차폐로 걸러 내는 것은 R3 다.
#   - **현상의 세기는 값이 움직인 폭에서만 온다.** 능력이 낸 현상의 세기(G6 강도)는 G 계층이 갚는다.
#   - **보고서 통로는 아직 저절로 퍼지지 않는다.** 관계·제도가 남기는 report 현상은 났을 뿐이고,
#     그것이 누구를 거쳐 어디까지 가는지는 R4(소문·믿음)의 몫이다.
#   - **자연 발생 사건의 현상은 여전히 유예다** — R1 이 그 사건 자체를 유예했다 (W2).
