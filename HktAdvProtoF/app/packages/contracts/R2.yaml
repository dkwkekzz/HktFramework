# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# 단계 3(M3 충돌하는 주체)의 셋째 모듈이다. R1 이 증거로 닫혔으므로 착수를 막는 게이트는 없다.

id: R2
name: phenomenon-emission
purpose: >
  사건이 관찰 가능한 현상으로 나타나게 한다 — 주체는 상태를 직접 보지 못하고 현상만 감지한다.

inputs: [WorldEvent, EventLog, WorldStateSnapshot]
outputs: [Phenomenon, PhenomenonViolation]

writes: []                      # 현상은 사건의 흔적이다 — 세계 상태를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, R0, R1]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - r2-events-leave-traces
  - r2-causeless-phenomenon-rejected
  - r2-boundary

elements:
  - name: Phenomenon
    ontology: Phenomenon        # O1 이 통로 6종(빛·소리·흔적·냄새·의념 잔향·보고서)까지 이미 고정했다
    renderer: timeline          # 현상 위치·수명 (MODULES.md R2 행은 3D+타임라인 — 3D 는 X 계층에서 붙는다)

lab: /lab/r2

status: PLANNED

# R1 이 R2 에 넘긴 자리:
#   - 사건은 섰지만 아무도 그것을 보지 못한다 — 흔적을 남기는 것이 R2 의 첫 일이다.
#   - O1 `Phenomenon` 은 원인 사건 id 를 요구한다(`causeEventId`) — 원인 없는 현상은 없다.
