# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# E0 가 증거로 닫혔으므로 착수를 막는 게이트는 없다. E0 가 여기로 넘긴 자리:
#   - **무엇을 하자고 하는가는 E0 가 정하지 않는다.** 요청인지 협박인지 거래인지를 고르는 것이
#     E1 이고, E0 는 그 선택이 놓일 자리(상황과 그 안의 앎)까지였다.
#   - E0 가 세운 `SituationPair` 가 E1 의 선택 기준 여섯 중 둘을 이미 값으로 갖고 있다:
#     **정보 비대칭**(`ambush`·`awareness`)과 **긴급도**(`Situation.urgency` — D5·P4 가 잰 값).
#     나머지 넷(관계·힘 차·도덕 비용·성공률)이 E1 이 채울 자리다.

id: E1
name: social-interaction
purpose: >
  상황에서 사회적 상호작용 8종(요청·거래·협박·기만·동맹·고용·배신·복종) 중 하나를 고르게 한다.

inputs: [Situation, SituationPair, Relationship, PossibilityGrammar, WorldState]
outputs: [SocialInteraction]

writes: []                      # 고른다는 것은 아직 세계가 아니다 — 세계를 바꾸는 것은 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, D5, P0, P1, P2, P3, P4, P5, R0, R1, R2, R3, R4, R5, R6, E0]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - e1-same-situation-splits-hands
  - e1-groundless-interaction-rejected
  - e1-boundary

elements:
  - name: SocialInteraction
    ontology: null              # 착수 시 확정한다 — 고른 것은 아직 세계에 적히지 않는다.
    renderer: gauge             # 선택 기준 점수표 — MODULES.md E1 행

lab: /lab/e1

status: PLANNED
