# 선등록(PLANNED) — 아직 착수하지 않은 모듈의 계약이다.
# 레지스트리의 "착수 가능" 목록은 **등록된 미완료 모듈** 중에서 계산된다. 계약이 없으면
# 다음에 할 일이 계산되지 않으므로, 다음 모듈은 착수 전에 PLANNED 로 미리 등록한다 (#663).
# 착수하면 이 파일을 IN_PROGRESS → VERIFIED 로 올리고 나머지 필드를 실물에 맞춘다.
#
# 단계 3(M3 충돌하는 주체)의 여섯째 모듈이다. R4 가 증거로 닫혔으므로 착수를 막는 게이트는 없다.
# D5(의존 충돌 탐지)도 이 단계에 붙는다 — 둘 중 어느 쪽을 먼저 낼지는 착수 시 정한다.

id: R5
name: memory-and-relationship
purpose: >
  과거 사건과 대상 관계가 이후 판단에 영향을 주게 한다 — 그리고 **남의 말이 근거가 되게 한다**.

inputs: [Event, Percept, Belief, BeliefGraph, SubjectInstance]
outputs: [Memory, Relationship]

writes: []                      # 기억은 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P2, P3, R0, R1, R2, R3, R4]

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1) — 착수 시 확정한다
  - r5-memory-shapes-judgement
  - r5-groundless-memory-rejected
  - r5-boundary

elements:
  - name: Memory
    ontology: Claim             # 착수 시 확정한다 — P3-b `ContextFact` 의 기억 축(stale)이 이미 재료다.
    renderer: timeline          # 관계망(그래프) + 기억(타임라인) — MODULES.md R5 행

lab: /lab/r5

status: PLANNED

# R4 가 R5 에 넘긴 자리:
#   - **소문이 여기서 선다.** R4 는 제 지각만 근거로 받는다(`foreign-belief`) — 남의 말이 근거가
#     되는 것과 거치는 주체가 왜곡 지점이 되는 것이 R5 의 일이다 (S0-b · 원문 §20).
#   - **가치관이 확신을 흔드는 일**(믿고 싶은 것을 믿는 것)의 재료가 여기서 선다 — R4 의 요소 셋은
#     전부 밖에서 잰 것이다(좁힘·세기·반복).
#   - 삭은 자국 위에 남는 믿음(R4-c `staleBeliefs`)이 기억이 되는 자리다.
