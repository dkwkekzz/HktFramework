# 단계 3(M3 충돌하는 주체)의 일곱째 모듈. R4·D5 가 증거로 닫혔으므로 착수를 막는 게이트는 없었다.
#
# R5 가 새로 정하는 것은 **셋뿐**이다. 나머지는 전부 앞 계층에서 읽어 온다.
#   ① 다시 볼 수 없게 된 믿음이 기억이다      R4-c `staleBeliefs` 가 그 목록을 이미 갖고 있다
#   ② 겪은 자만 누구인지 안다                 R4 는 `actorId` 를 싣지 않는다 — 지목은 짐작에서 나오지 않는다
#   ③ 말은 흔적이 된다                        듣는 자는 **제 귀로** 읽는다 (R4 `foreign-belief` 벽은 그대로)
#
# 읽어 오는 것:
#   소문이 옅어지는 것    R3 거리·차폐 (`perceives` 가 이미 깎는다 — R5 는 감쇠를 정하지 않는다)
#   소문이 왜곡되는 것    R4 `narrowByGrammar` (듣는 자가 낼 수 없는 일은 그의 이야기에서 빠진다)
#   사이의 축             O2 `relational` 여섯 (R5 는 축을 만들지 않는다)
#   사이를 미는 방향      P0-b `AtomGrounding` (그 원자가 그 자리를 **세우는가**(writes) **치르는가**(pays))
#   사이의 크기           R4 `Belief.confidence`
#
# 유예로 선언하는 것 하나: 말을 **세계를 바꾸는 사건**으로 세우는 일(`informational.rumorSpread.{claim}`
# 자리를 움직이는 원자)은 P0 열여섯에 없다 — 여기서 원자를 더하면 P0 최소 집합이 깨진다
# (P5 가 "접근 권한 확보는 W2" 로 유예한 것과 같은 자리). 그래서 소문은 세계의 현상장이 아니라
# **R5 의 소문장**(`RumorField`)에 서고 R5 의 감사가 그 뿌리를 검사한다 — 말이 세계를 바꾸는 것은
# W2·E1 의 몫이다. R2-a 는 그 자리의 통로를 이미 적어 두었다("퍼지는 중인 말은 들린다").

id: R5
name: memory-and-relationship
purpose: >
  과거 사건과 대상 관계가 이후 판단에 영향을 주게 한다 — 그리고 **남의 말이 근거가 되게 한다**.

inputs: [Event, Percept, Belief, BeliefGraph, WorldPhenomenon, PossibilityGrammar, WorldState]
outputs: [Memory, Relationship, Telling, MemoryViolation]

writes: []                      # 기억은 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.
                                # 세계의 `relational` 자리는 세계의 장부이고, R5 가 내는 것은
                                # **주체가 지닌 사이**다. 둘은 갈릴 수 있고 갈리는 재료가 기억이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4, P0, P2, P3, R0, R1, R2, R3, R4]

subtasks:                       # 검증 장면이 셋을 넘는다 → WORKFLOW §3
  - id: R5-a
    name: memory
    purpose: 삭은 믿음이 기억이 된다 · 겪은 자만 지목한다 · 설 수 없는 기억이 걸린다.
    status: IN_PROGRESS
  - id: R5-b
    name: regard
    purpose: 기억이 사이를 민다 — 축은 O2, 방향은 P0-b, 크기는 R4 확신. 적힌 사이와 갈린다.
    status: PLANNED
  - id: R5-c
    name: rumor
    purpose: 말이 흔적이 되고 거치며 갈린다 · 기억장과 감사 — 틀린 지목은 위반이 아니다.
    status: PLANNED
  - id: R5-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 관계망·전달 사슬로 R5 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - r5-hearsay-carries-blame      # 정상: 당한 자만 지목하고, 그 지목이 말을 타고 퍼지며 내용만 갈린다
  - r5-groundless-memory-rejected # 실패: 근거 없는 기억·짐작에서 나온 지목·바랜 확신·못 들은 말이 거부된다
  - r5-boundary                   # 경계: 아무도 듣지 못한 말 · 제 손으로 한 일 · 먼 곳의 말 · 빈 기억장

elements:
  - name: Memory
    ontology: Claim             # O1 `Claim` 을 그대로 쓴다 — "주체가 참이라 여기는 것" 이고
                                # `sourceIds` 가 이미 "현상·**전언**·다른 주장" 을 열어 두었다.
                                # R5 는 굳은 틱·지목·거쳐 온 입을 더할 뿐이다 (R4 가 넷을 더한 것과 같다).
    renderer: timeline          # 기억·전달 사슬 (MODULES.md R5 행)
  - name: Relationship
    ontology: Claim             # 지닌 사이도 주장이다 — 세계의 `relational` 장부와 갈릴 수 있다.
    renderer: graph             # 관계망 (MODULES.md R5 행)

lab: /lab/r5

status: IN_PROGRESS

# R5 가 뒤에 넘기는 자리:
#   - **거짓말은 아직 없다.** 말하는 자는 제 기억을 그대로 말한다 — 제 기억과 다른 것을 말하는 일
#     (기만)은 E1 의 자리다. R5 가 여는 것은 "거쳐 오면 갈린다" 까지다.
#   - **기억이 목적을 바꾸는 것은 R6 다.** R5 는 사이를 값으로 세우고 P4 가 평균으로 읽던 자리와
#     나란히 놓아 보이기까지 한다 — 그것을 실제로 먹이는 것은 R6·E 계층이다.
#   - **기억은 바래지 않는다.** 굳는 순간의 확신을 그대로 진다 — 잊음의 시간 축은 선언하지 않았다
#     (원문이 주지 않았다). 세계가 움직여 어긋나는 것은 이미 값으로 선다.
#   - **말을 세계를 바꾸는 사건으로 세우는 것은 W2·E1 이다** (위 유예 참조).
