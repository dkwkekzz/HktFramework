# 단계 3(M3 충돌하는 주체)에서 붙는 D 계층의 마지막 모듈. 원문 §18 대로 **다주체가 선 뒤**에
# 붙인다 — 혼자 서 있는 세계에는 다툼이 없다.
#
# D5 가 새로 정하는 것은 **다툼의 조건** 셋뿐이다(양립 불가 · 나뉘지 않음 · 모자람). 나머지는 전부
# 앞 계층에서 읽어 온다.
#   무엇을 요구하는가     D1 `DependencyNode.condition` (자리·대역) · `target`
#   얼마나 급한가         D1 `DependencyEdge.urgency` · D4 `NodePressure.pressure`
#   대신할 수 있는가       D1 `DependencyEdge.substitutability`
#   세계에 얼마나 있는가   D4 `WorldSnapshot` (모자람을 재는 데만 본다)
#
# D2 가 명시적으로 남긴 한 줄("한 몸이 두 곳에 있을 수 없다는 다툼은 D5 가 볼 일이다")을 갚는다.

id: D5
name: dependency-conflict
purpose: >
  주체 내부·주체 간 의존 충돌을 찾는다 — 같은 것을 원한다고 다 다툼은 아니고,
  **여기서 콘텐츠의 기본 압력이 만들어진다**.

inputs: [DependencyGraph, PressureReport, WorldSnapshot]
outputs: [DependencyClaim, DependencyConflict, ConflictField, ConflictViolation]

writes: []                      # 충돌은 세계가 아니다 — 세계를 바꾸는 것은 여전히 R1 뿐이다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4]

subtasks:                       # 검증 장면이 셋을 넘는다 → WORKFLOW §3
  - id: D5-a
    name: claim
    purpose: 노드 하나가 세계의 무엇을 요구하는가 — 시간은 요구가 아니다.
    status: DONE
  - id: D5-b
    name: conflict
    purpose: 겹침 두 축과 다툼 두 조건 — 겹친다고 다툼은 아니다 (셋째는 유예).
    status: DONE
  - id: D5-c
    name: conflict-field
    purpose: 충돌장·감사·주체↔경합 대상 이분 그래프.
    status: IN_PROGRESS
  - id: D5-d
    name: eye-check
    purpose: 시나리오 3종과 Lab 이분 그래프로 D5 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - d5-same-target-different-conflicts  # 정상: 겹침 중 다툼이 되는 것만 갈린다
  - d5-groundless-conflict-rejected     # 실패: 근거 없는 충돌·한쪽뿐인 다툼 등이 거부된다
  - d5-boundary                         # 경계: 창고가 비는 걸음 · 시간 · 대체 가능한 요구

elements:
  - name: DependencyConflict
    ontology: null              # **O1 12타입에 없고, 없는 것이 옳다.** 충돌은 세계에 적히는 것이
                                # 아니라 그래프들 사이에서 읽히는 것이다 — R3 `Percept` 와 같은 처지다.
                                # 세계에 적히는 것은 그 다툼이 사건이 될 때이고, 그것은 E0·E3 다.
    renderer: graph             # 주체↔경합 대상 이분 그래프 (MODULES.md D5 행)

lab: /lab/d5

status: IN_PROGRESS

# D5 가 뒤에 넘기는 자리:
#   - **배타적 점유는 유예다.** "이 대상은 한 번에 한 요구만 받는다"(한 짝이 넷의 등을 동시에
#     맡을 수는 없다)를 판정하려면 세계에 수용량을 적을 자리가 있어야 하는데 O2 에 없다.
#     여기서 지어내면 D5 가 정하는 것이 늘어나므로 W 계층이 갚도록 선언으로 남겼다
#     (P5-b 접근 권한 W2 유예 · R1-a 자연 발생 사건 유예와 같은 자리).
#   - **D5 는 이기는 자를 정하지 않는다.** 다툼이 났다는 것과 얼마나 급한지까지다 —
#     상황으로 묶는 것은 E0, 결과를 확정하는 것은 E3 다.
#   - **다투는 자를 서로 알아보는 것은 아직 아니다.** P1 `rivals` 는 여기서 계산되지만, 그것을
#     주체가 아는지는 R3·R4 가 정한다 (본 적 없는 겨루는 자는 갈래를 열지 못한다 — P1 장면).
