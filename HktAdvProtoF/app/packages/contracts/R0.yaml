id: R0
name: world-state-store
purpose: >
  정식화된 세계의 실제 상태를 원장 하나에 담고 시간을 가로질러 조회한다 — 지금까지 세계는
  값으로만 있었고 주인이 없었다.

# R0 은 세계를 새로 만들지 않는다. 조립 관문은 O2(`assembleWorld`)가, 스냅샷의 모양은
# D4(`WorldSnapshot`)가 이미 세웠고, 시간은 V1 TickClock 이 준다. R0 이 더하는 것은
# **주인과 열**이다: 담는 것(원장) · 지우지 않는 것(사슬 해시) · 시간을 가로질러 읽는 것(조회).
inputs: [State, StateSchema, Tick, CommitCause]
outputs: [WorldStateSnapshot, WorldStateStore, CommitResult, SnapshotQuery, SlotReading, SlotHistoryEntry, LedgerDiff, StoreViolation]

writes: []                      # R0 은 담을 뿐이다 — 세계를 바꾸는 것은 R1 사건이고, 그 자리(cause.eventIds)를 비워 둔다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3, D0, D1, D2, D3, D4]

subtasks:                       # 검증 장면이 셋이다 → WORKFLOW §3
  - id: R0-a
    name: ledger-commit
    purpose: 세계를 담을 주인을 세우고, 담을 수 없는 커밋을 거부한다.
    status: DONE
  - id: R0-b
    name: time-queries
    purpose: 원장 위에서 임의의 틱·자리·구간을 읽는다.
    status: DONE
  - id: R0-c
    name: eye-check
    purpose: 시나리오 3종과 Lab 상태 브라우저로 R0 를 눈으로 확인한다.
    status: PLANNED

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - r0-keeps-the-ledger         # 정상: 열 틱을 담으면 여섯이 남고, 시간을 가로질러 읽히며, 다시 세워도 같은 지문이다
  - r0-broken-commit-rejected   # 실패: 뒤로 가는 틱·같은 틱·근거 없는 커밋·어긴 값·손댄 과거가 각자의 사유로 거부된다
  - r0-boundary                 # 경계: 빈 세계의 genesis · 첫 스냅샷 이전 조회 · 한 번도 바뀌지 않은 자리의 역사

elements:
  - name: WorldStateSnapshot
    ontology: State             # 스냅샷은 그 틱에 선 State 들의 묶음이다 (O2 왕복 성질을 그대로 쓴다)
    renderer: diff              # 상태 브라우저 (MODULES.md R0 행)

lab: /lab/r0

status: IN_PROGRESS

# R0 이 R1 에 넘기는 자리:
#   - `CommitCause.eventIds` 는 비어 있다 — R0 은 근거의 **자리**만 열고, 사건 id 로 채우는 것은 R1 이다.
#   - R0 은 세계를 바꾸지 않는다. 커밋은 밖에서 들어온 세계를 담을 뿐이고, 무엇이 바뀌었는지는
#     O2 `worldDiff` 가 말한다 — 변경을 만드는 문법은 R1·R2 의 몫이다.
