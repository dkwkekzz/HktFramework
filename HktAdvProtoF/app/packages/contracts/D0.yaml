id: D0
name: dependency-kind
purpose: >
  주체가 기댈 수 있는 대상을 11종으로 확정하고, 각 종이 세계의 무엇으로 서고 어느 자리에서
  충족을 읽는지를 못박는다.

inputs: [DependencyKinds, OntologyKind, StateDomain, StateSchema]
outputs: [DependencyKindSpec, KindResolution, KindGrounding, TargetFit, DependencyKindViolation]

writes: []                      # D0 은 세계를 바꾸지 않는다 — 분류만 확정한다.

depends: [V1, V2, V0, V3, V4, O1, O2, O0, S0, S1, S2, S3]

subtasks:                       # 원문 대조와 세계 걸림은 검사기가 다르다 → WORKFLOW §3 분할
  - id: D0-a
    name: kind-reconciliation
    purpose: 원문이 두 곳에 다르게 적은 의존 대상 목록(D0 11 · D1 9)을 11종으로 남김없이 해소한다.
    status: DONE
  - id: D0-b
    name: kind-grounding
    purpose: 각 종의 대상이 O1 의 무엇이고 충족을 O2 어느 자리에서 읽는지 못박고, 선언한 종과 실제 대상이 어긋나면 거부한다.
    status: DONE
  - id: D0-c
    name: eye-check
    purpose: 시나리오 3종과 Lab 분류표로 D0 를 눈으로 확인한다.
    status: DONE

scenarios:                      # 정상 1 + 실패 1 + 경계 1 (WORKFLOW §5.1)
  - d0-one-rule-three-kinds     # 정상: 같은 원소가 기대는 방식에 따라 여러 종으로 서고, 11종이 9영역을 덮는다
  - d0-broken-kinds-rejected    # 실패: 자리 없는 종·어긋난 대상·해소되지 않은 원문 이름이 각자의 사유로 거부된다
  - d0-boundary                 # 경계: 대상 없는 종(시간) · 어느 종도 받지 않는 원소 · 대조표의 양끝

elements:
  - name: DependencyKind
    ontology: Dependency        # O1 이 이름표로 고정한 11종에 근거와 성격 축이 붙는다
    renderer: diff

lab: /lab/d0                    # 분류표 (11종 × 성격 축) + 원문 대조 + 같은 원소가 갈리는 자리 + 거부 사유

status: VERIFIED
evidence: evidence/D0.json
