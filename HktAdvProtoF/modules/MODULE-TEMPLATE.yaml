# 모듈 계약 서식 — WORKFLOW.md §4 참조.
# 구현 착수 시 app/packages/contracts/<모듈ID>.yaml 로 복사해 작성한다.
# V0 레지스트리가 검사하는 규칙:
#   - purpose 없는 모듈 등록 불가
#   - inputs 또는 outputs 없는 처리 모듈 등록 불가
#   - depends 순환 등록 불가
#   - scenarios 없는 모듈은 status: VERIFIED 불가

id: D4                          # MODULES.md 의 모듈 ID
name: dependency-evaluator      # kebab-case 영문 이름
purpose: >                      # 한 문장. 두 문장이 되면 모듈(작업)을 분할할 것
  현재 세계 상태에서 각 의존 노드의 압력을 계산해 5단계 충족 상태를 판정한다.

inputs: [DependencyGraph, WorldStateSnapshot]   # core 의 TS 타입 이름
outputs: [PressureReport]

writes:                         # 이 모듈이 변경할 수 있는 상태 범위 (그 외 변경 금지)
  - DependencyNode.pressure
  - DependencyNode.fulfillment

depends: [V1, V2, D1, D2]       # 전부 VERIFIED 여야 착수 가능

scenarios:                      # 최소 3종 — 정상 1 + 실패 1 + 경계 1
  - d4-hunger-rise              # 정상: 재고 감소 → 압력 단조 증가
  - d4-satiation-fall           # 정상: 재고 충분 → 목적 미생성
  - d4-boundary-zero            # 경계: 재고 0 / 압력 최대치

elements:                       # 이 모듈이 정의·변경하는 최소 세계 상태 원소
  - name: DependencyNode.pressure
    ontology: State             # O1 존재론 12타입 중 하나
    renderer: gauge             # graph | gauge | timeline | diff | scene3d
  - name: DependencyNode.fulfillment
    ontology: State
    renderer: gauge

lab: /lab/d4                    # V3 Lab 페이지 경로

layer: 1                        # 이 계약이 다루는 콘텐츠 깊이 (WORKFLOW §12) — status 는 Layer 한정
status: PLANNED                 # PLANNED | IN_PROGRESS | IMPLEMENTED | VERIFIED
evidence: null                  # VERIFIED 시 evidence/<id>.json 경로 (V4)
