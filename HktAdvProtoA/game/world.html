<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상흔계 아벨리온 — 살아있는 지도</title>
<link rel="icon" href="data:,">
<style>
  /* Design-MMO §2 게임 클라이언트 1단계(관찰자 모드) — 의존성 없는 단일 파일.
     불변 6: 화면 = f(스냅샷, 표현 데이터, 보간 시각). 이 파일에는 세계 쓰기 경로가 없다
     (디버그 방아쇠는 simulate --force 대응의 명시적 디버그 경로). */
  :root {
    --bg: #0d1117; --panel: #161d27; --panel2: #1c2532; --line: #2b3648;
    --fg: #d6dde8; --dim: #8494ab; --accent: #6fb3d8; --gold: #d8b46f; --red: #d87a6f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; color: var(--gold); letter-spacing: .5px; }
  header .tick { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 70px; }
  button, select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #0d1117; border-color: var(--accent); }
  .spacer { flex: 1; }
  .trigger-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .trigger-bar .lbl { color: var(--dim); font-size: 11px; }
  .trigger-bar button { font-size: 11px; padding: 2px 8px; border-color: #4a3b2b; color: var(--gold); }
  .trigger-bar button.fired { opacity: .35; pointer-events: none; }
  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  aside { width: 380px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: none; border-radius: 0; background: none; padding: 8px 0; color: var(--dim); }
  .tabs button.on { color: var(--fg); background: var(--panel2); }
  .tabbody { flex: 1; overflow-y: auto; padding: 10px 12px; min-height: 0; }
  .chron-line { padding: 4px 6px; border-left: 2px solid var(--line); margin-bottom: 4px; color: var(--fg); }
  .chron-line .t { color: var(--dim); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .chron-line.obj { border-left-color: var(--gold); }
  .chron-line.act { border-left-color: var(--accent); }
  .chron-line.clock { border-left-color: #8b6fd8; color: var(--dim); }
  .gauge { margin-bottom: 10px; }
  .gauge .name { display: flex; justify-content: space-between; color: var(--fg); }
  .gauge .name span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  .gauge .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .gauge .bar i { display: block; height: 100%; background: var(--gold); transition: width .6s; }
  .objrow { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted var(--line); }
  .objrow .st { color: var(--dim); } .objrow .st.done { color: var(--gold); } .objrow .st.run { color: var(--accent); }
  h3 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; }
  h3:first-child { margin-top: 0; }
  .card-title { font-size: 15px; color: var(--gold); margin-bottom: 2px; }
  .card-sub { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  .varrow { padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 5px; background: var(--panel2); cursor: pointer; }
  .varrow .head { display: flex; justify-content: space-between; }
  .varrow .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .varrow .detail { display: none; margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--line); color: var(--dim); font-size: 12px; }
  .varrow.open .detail { display: block; }
  .varrow .detail b { color: var(--fg); font-weight: 600; }
  .subject-card { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; background: var(--panel2); }
  .subject-card .sname { color: var(--gold); margin-bottom: 3px; }
  .kv { display: flex; justify-content: space-between; color: var(--dim); }
  .kv span:last-child { color: var(--fg); }
  .hint { color: var(--dim); font-size: 12px; }
  #fatal { position: absolute; inset: 0; display: none; place-items: center; background: var(--bg); z-index: 9; text-align: center; padding: 30px; }
  #fatal code { color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>상흔계 아벨리온</h1>
  <span class="tick" id="tickview">t 0</span>
  <button id="btnPlay" class="on">⏸ 일시정지</button>
  <button id="btnStep">1틱 ▸</button>
  <select id="speed">
    <option value="2000">0.5×</option>
    <option value="1000" selected>1× (1틱=1초)</option>
    <option value="250">4×</option>
    <option value="60">16×</option>
  </select>
  <span class="spacer"></span>
  <div class="trigger-bar" id="triggers">
    <span class="lbl">디버그 방아쇠(--force):</span>
  </div>
  <button id="btnReset" title="초기 스냅샷으로 재시작">⟲ 초기화</button>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="fatal"><div>
      <p style="font-size:16px;margin-bottom:10px">데이터를 불러오지 못했습니다.</p>
      <p class="hint">이 페이지는 <code>data/*.json</code> 을 fetch 하므로 HTTP 서버로 열어야 합니다.<br>
      저장소 루트에서: <code>python3 -m http.server 8000</code> →
      <code>http://localhost:8000/HktAdvProtoA/game/world.html</code></p>
      <p class="hint" id="fatalmsg" style="margin-top:8px"></p>
    </div></div>
  </div>
  <aside>
    <div class="tabs">
      <button data-tab="chron" class="on">연대기</button>
      <button data-tab="events">사건·목적</button>
      <button data-tab="inspect">인스펙터</button>
    </div>
    <div class="tabbody" id="tab-chron"><p class="hint">세계가 굴러가면 발화가 여기 서사로 기록됩니다. 지도 위 지역을 클릭하면 인스펙터가 열립니다.</p></div>
    <div class="tabbody" id="tab-events" style="display:none"></div>
    <div class="tabbody" id="tab-inspect" style="display:none"><p class="hint">지도에서 지역을 클릭하세요.</p></div>
  </aside>
</main>

<script type="module">
import { buildInitial, recomputeDerived, newCtx, tick, indexVars, evalPred }
  from "../data/state-engine.mjs";

// ── 데이터 로드 — 표현층은 스냅샷과 표현 데이터만 읽는다 (불변 6) ─────────
const DATA = "../data/";
let graph, state, map, visual;
try {
  [graph, state, map, visual] = await Promise.all(
    ["objective-graph.json", "world-state.json", "world-map.json", "world-visual.json"]
      .map((f) => fetch(DATA + f).then((r) => { if (!r.ok) throw new Error(f + " " + r.status); return r.json(); })));
} catch (err) {
  document.getElementById("fatal").style.display = "grid";
  document.getElementById("fatalmsg").textContent = String(err);
  throw err;
}

// ── 색인 ────────────────────────────────────────────────────────────────
const nodeTitle = new Map(graph.nodes.map((n) => [n.id, n.title || n.id]));
const varIdx = indexVars(state);
const regions = new Map(map.regions.map((r) => [r.id, r]));
const river = (map.features || []).find((f) => f.id === "RIVER");
const ventries = visual.vars;
const byRegion = new Map();           // 지역 → 사전 항목들
for (const e of ventries) {
  if (e.region && e.region !== "@ref" && regions.has(e.region)) {
    if (!byRegion.has(e.region)) byRegion.set(e.region, []);
    byRegion.get(e.region).push(e);
  }
}
const refActors = ventries.filter((e) => e.region === "@ref");
const hudEntries = ventries.filter((e) => e.channel === "hud");
const gaugeEV = ventries.filter((e) => e.channel === "gauge" && /^EV_/.test(e.var));
const gaugeG = ventries.filter((e) => e.channel === "gauge" && /\.진행$/.test(e.var));
// 변수 ↔ 법칙·행동 교차 색인 (인스펙터의 '설명 가능한 세계')
function predVars(p, acc) {
  if (!p) return acc;
  if (p.all) p.all.forEach((x) => predVars(x, acc));
  else if (p.any) p.any.forEach((x) => predVars(x, acc));
  else if (p.not) predVars(p.not, acc);
  else { if (p.var) acc.add(p.var); if (p.value?.var) acc.add(p.value.var); }
  return acc;
}
const readers = new Map(), writers = new Map();
const touch = (m, v, id) => { if (!m.has(v)) m.set(v, []); m.get(v).push(id); };
for (const r of state.rules || []) {
  for (const v of predVars(r.when, new Set())) touch(readers, v, r.id);
  for (const e of r.then || []) touch(writers, e.var, r.id);
}
for (const a of state.actions || []) {
  for (const v of predVars(a.when, new Set())) touch(readers, v.replace("{actor}", "*"), a.id);
  for (const e of [...(a.then || []), ...(a.cost || [])]) touch(writers, e.var.replace("{actor}", "*"), a.id);
}
for (const v of state.vars || []) if (v.derived) for (const s of predVars(v.formula, new Set())) touch(readers, s, v.id + " (파생)");

// ── 세계 구동 — 엔진은 그대로, 클라는 틱을 돌리고 스냅샷을 읽기만 한다 ────
let snap, ctx, playing = true, timer = null, chron = [], fxq = [];
function boot() {
  snap = buildInitial(state);
  recomputeDerived(snap, varIdx);
  ctx = newCtx(state);
  chron = []; fxq = [];
  renderChron(); renderEvents();
  document.querySelectorAll("#triggers button").forEach((b) => b.classList.remove("fired"));
  tickview.textContent = "t 0";
}

const CLASS = { rule: "", objective: "obj", action: "act", clock: "clock" };
function regionOfId(id) {
  const fx = visual.fx?.[id];
  if (fx && fx.region !== "global") return fx.region;
  const src = (state.rules || []).find((r) => r.id === id) || (state.actions || []).find((a) => a.id === id);
  for (const e of src?.then || []) {
    const ent = ventries.find((x) => x.var === e.var);
    if (ent?.region && ent.region !== "@ref") return ent.region;
  }
  return null;
}
const lastLog = new Map();             // 반복 법칙(every)의 서사 스로틀 — 같은 문장 도배 방지
function pushChron(t, kind, id, text) {
  if (!text) return;
  if (kind === "rule") {
    const last = lastLog.get(id);
    if (last !== undefined && t - last < 12) return;   // 상태는 매번 변하지만 서사는 12틱에 한 번
    lastLog.set(id, t);
  }
  chron.unshift({ t, kind, id, text, region: regionOfId(id) });
  if (chron.length > 300) chron.length = 300;
}
function translateFired(t, fired) {
  for (const c of fired.clocks) {
    const [id, phase] = c.split(":");
    pushChron(t, "clock", id, visual.chronicle.clocks?.[id]?.[phase]);
  }
  for (const id of fired.rules) pushChron(t, "rule", id, visual.chronicle.rules?.[id]);
  for (const o of fired.objectives) {
    const [id, phase] = o.split(":");
    pushChron(t, "objective", id, visual.chronicle.objectives?.[id]?.[phase]);
  }
  for (const aRaw of fired.actions) {
    const landed = aRaw.endsWith("→효과");
    const [id, actor] = aRaw.replace("→효과", "").split("@");
    const act = (state.actions || []).find((x) => x.id === id);
    let text = visual.chronicle.actions?.[id];
    if (!text) continue;
    text = text.replace("{actor}", nodeTitle.get(actor) || actor || "누군가");
    if ((act?.duration ?? 0) > 0 && !landed) text = "[착수] " + text.replace(/했다|켰다|섰다|았다|었다/, "하려 한다");
    pushChron(t, "action", id, text);
  }
  // fx 큐 — 발화 연출 (표현 전용, 상태에 영향 없음)
  for (const id of [...fired.rules, ...fired.actions.map((a) => a.split("@")[0])]) {
    const fx = visual.fx?.[id];
    if (fx) fxq.push({ ...fx, at: performance.now(), dur: fx.kind === "flash" || fx.kind === "war" ? 3000 : 2000 });
  }
}
function step() {
  const fired = tick(snap, state, ctx);
  translateFired(ctx.t, fired);
  tickview.textContent = "t " + ctx.t;
  renderChron(); renderEvents();
  if (inspected) renderInspect(inspected);
}
function setTimer() {
  clearInterval(timer);
  if (playing) timer = setInterval(step, Number(speed.value));
}

// ── 지도 렌더 (60fps 는 보간·연출 전용 — 불변 7) ─────────────────────────
const cv = document.getElementById("map"), g = cv.getContext("2d");
const TERRAIN = {
  ice: "#a9c8dd", cave: "#7d7260", rift: "#8b6fd8", sky: "#9db1e8", ruin: "#8d8271",
  cliff: "#647585", facility: "#a8a08c", spring: "#5fb7cc", forest: "#4d7d49", city: "#c2a15a",
  plain: "#a89a3e", volcano: "#b05c3a", coast: "#c4a878", forge: "#7a6455", sea: "#2b567e",
};
const ACTOR_GLYPH = {
  "E_카르마.서식": "🌱", "F_청동수문회.세력": "🚩", "E_심해포식자.위치": "🦈",
  "E_아르카론.생존": "☀", "E_아르카론.심장핵": "♦", "E_고대생명체.활성": "👁",
  "E_별빛종족.활성": "✨", "E_남하조류.위치": "🐦",
};
const MARKER_GLYPH = {
  "L_제어탑.가동": "⚙", "L_제어탑.발견": "◎", "R_심연유리.채굴금지": "⛔",
  "R_심연유리.수요": "▲", "R_백야혈청.공개": "✚", "X_늑대공격.활성": "⚠",
  "F_유리잠수단.관계.F_상인연합": "⚔",
};
const DENSITY_DOT = {
  "E_회색등늑대.개체수": "#b9c2cc", "E_초식동물.개체수": "#c9a86e", "E_늪생명체.서식": "#6e9e78",
  "R_식량.공급": "#e0c168", "R_심연유리.공급": "#8fd8e8", "E_그림자산호.서식": "#d88fb0",
  "E_유리벌레.서식": "#a8e0c0", "E_백야초.군락": "#e8f0f8", "E_설원곤충.개체수": "#98b8d8",
  "L_굶주린평원.해충": "#8a9a40",
};
function ratioOf(id) {                 // 값 → 0..1 건강/충만 비율
  const v = varIdx.get(id), val = snap[id];
  if (v?.kind === "level") return (val ?? 0) / Math.max(1, (v.levels?.length ?? 2) - 1);
  if (v?.kind === "flag") return val ? 1 : 0;
  if (v?.kind === "count") return Math.min(1, (val ?? 0) / 40);
  return 1;
}
function levelLabel(id) {
  const v = varIdx.get(id), val = snap[id];
  if (v?.kind === "level" && v.levels) return `${v.levels[val] ?? val}`;
  if (v?.kind === "flag") return val ? "예" : "아니오";
  if (v?.kind === "ref") return val ? (nodeTitle.get(val) || val) : "—";
  return String(val);
}
function seeded(str) {                 // 고정 시드 절차 배치 (§3.1)
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
function mix(c1, c2, k) {
  const p = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const [a, b] = [p(c1), p(c2)];
  return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * k)).join(",")})`;
}
let W = 0, H = 0, S = 1, OX = 0, OY = 0;
function resize() {
  const dpr = devicePixelRatio || 1, r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = r.width; H = r.height;
  S = Math.min(W, H) / 105; OX = (W - 100 * S) / 2; OY = (H - 100 * S) / 2;
}
addEventListener("resize", resize); resize();
const px = ([x, y]) => [OX + x * S, OY + y * S];

function draw(now) {
  g.clearRect(0, 0, W, H);
  // 바다·땅
  g.fillStyle = "#0e1a2b"; g.fillRect(0, 0, W, H);
  g.beginPath();
  const land = px([50, 42]);
  g.ellipse(land[0], land[1], 54 * S, 46 * S, -0.12, 0, Math.PI * 2);
  g.fillStyle = "#18202c"; g.fill();
  // 인접 길
  g.strokeStyle = "#2b3648"; g.lineWidth = 1;
  for (const r of map.regions) for (const adj of r.adjacent) if (r.id < adj) {
    const [x1, y1] = px(r.pos), [x2, y2] = px(regions.get(adj).pos);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
  // 강 — S_강흐름.단계가 폭·색 (표현 사전 tone/RIVER)
  if (river) {
    const flow = ratioOf("S_강흐름.단계");
    g.beginPath();
    river.path.forEach((p, i) => { const [x, y] = px(p); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.strokeStyle = flow === 0 ? "#3a4250" : mix("#3d5a70", "#5fb7e8", flow);
    g.lineWidth = 1 + flow * 4; g.setLineDash(flow === 0 ? [4, 5] : []);
    g.lineCap = "round"; g.stroke(); g.setLineDash([]);
  }
  // 지역
  for (const r of map.regions) {
    const [x, y] = px(r.pos), rad = r.size * S * 0.9;
    const tones = (byRegion.get(r.id) || []).filter((e) => e.channel === "tone");
    const health = tones.length ? tones.reduce((s, e) => s + (e.var === "S_토양침식.활성" ? 1 - ratioOf(e.var) : ratioOf(e.var)), 0) / tones.length : 0.8;
    // 지형 폴리곤 (고정 시드 요철)
    const rnd = seeded(r.id);
    g.beginPath();
    for (let i = 0; i <= 14; i++) {
      const a = (i / 14) * Math.PI * 2, rr = rad * (0.82 + rnd() * 0.3);
      const [vx, vy] = [x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.86];
      i ? g.lineTo(vx, vy) : g.moveTo(vx, vy);
    }
    g.closePath();
    g.fillStyle = mix("#4a4640", TERRAIN[r.terrain] || "#888", 0.25 + health * 0.55);
    g.globalAlpha = 0.85; g.fill(); g.globalAlpha = 1;
    g.strokeStyle = "#0d1117"; g.lineWidth = 1.5; g.stroke();
    // 군집 밀도 점
    for (const e of (byRegion.get(r.id) || []).filter((e) => e.channel === "density")) {
      const v = varIdx.get(e.var), val = snap[e.var] ?? 0;
      const n = v.kind === "count" ? Math.min(18, Math.ceil(val / 3)) : val * 3;
      const drnd = seeded(r.id + e.var);
      g.fillStyle = DENSITY_DOT[e.var] || "#aaa";
      for (let i = 0; i < n; i++) {
        const a = drnd() * Math.PI * 2, d = (0.25 + drnd() * 0.6) * rad;
        g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8, 1.6, 0, 7); g.fill();
      }
    }
    // 액터·표지
    let iy = y - rad - 4;
    for (const e of (byRegion.get(r.id) || []).filter((e) => e.channel === "actor")) {
      const alive = varIdx.get(e.var).kind === "flag" ? snap[e.var] : ratioOf(e.var) > 0;
      g.font = "13px serif"; g.textAlign = "center";
      g.globalAlpha = alive ? 1 : 0.3;
      g.fillText(alive ? (ACTOR_GLYPH[e.var] || "●") : "☠", x + rad * 0.55, y - rad * 0.4);
      g.globalAlpha = 1; iy -= 0;
    }
    const markers = (byRegion.get(r.id) || []).filter((e) => e.channel === "marker");
    let mx = x - (markers.length - 1) * 7;
    for (const e of markers) {
      const v = varIdx.get(e.var), val = snap[e.var];
      const on = v.kind === "flag" ? !!val : v.kind === "level" ? (e.var.includes("관계") ? val === 0 : val >= 2) : !!val;
      g.font = "12px serif"; g.textAlign = "center";
      g.globalAlpha = on ? 1 : 0.22;
      g.fillStyle = on ? "#e8d8a8" : "#8494ab";
      g.fillText(MARKER_GLYPH[e.var] || "◆", mx, iy);
      g.globalAlpha = 1; mx += 14;
    }
    // ref 액터 (위치를 따라다니는 존재)
    for (const e of refActors) if (snap[e.var] === r.id) {
      g.font = "15px serif"; g.textAlign = "center";
      g.fillText(ACTOR_GLYPH[e.var] || "◉", x - rad * 0.5, y + rad * 0.55);
    }
    // 이름
    g.font = "11px system-ui"; g.textAlign = "center";
    g.fillStyle = "#d6dde8"; g.globalAlpha = 0.9;
    g.fillText(nodeTitle.get(r.id) || r.id, x, y + rad + 12);
    g.globalAlpha = 1;
  }
  drawOverlays(now);
  drawFx(now);
  requestAnimationFrame(draw);
}
function drawOverlays(now) {
  // 전역 오버레이 — overlay 채널 변수의 함수
  if (snap["S_영원한겨울.활성"]) {
    const gr = g.createLinearGradient(0, 0, 0, H * 0.5);
    gr.addColorStop(0, "rgba(190,220,245,.28)"); gr.addColorStop(1, "rgba(190,220,245,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H * 0.5);
  }
  if (snap["S_과잉별빛.활성"]) {
    const rnd = seeded("stars" + Math.floor(now / 700));
    g.fillStyle = "rgba(180,150,255,.7)";
    for (let i = 0; i < 26; i++) { g.globalAlpha = 0.25 + rnd() * 0.5; g.beginPath(); g.arc(rnd() * W, rnd() * H * 0.4, 1.1, 0, 7); g.fill(); }
    g.globalAlpha = 1;
  }
  if (snap["S_별빛통로북방.활성"]) {
    const [x, y] = px(regions.get("L_북방빙원").pos);
    const gr = g.createLinearGradient(x, 0, x, y);
    gr.addColorStop(0, "rgba(200,180,255,.5)"); gr.addColorStop(1, "rgba(200,180,255,0)");
    g.fillStyle = gr; g.fillRect(x - 16, 0, 32, y);
  }
  if (snap["S_남부대홍수.활성"]) {
    const gr = g.createLinearGradient(0, H, 0, H * 0.55);
    gr.addColorStop(0, "rgba(80,140,220,.35)"); gr.addColorStop(1, "rgba(80,140,220,0)");
    g.fillStyle = gr; g.fillRect(0, H * 0.55, W, H * 0.45);
  }
  if (snap["X_별빛폭풍.활성"]) {
    const rnd = seeded("storm" + Math.floor(now / 120));
    g.strokeStyle = "rgba(200,190,255,.5)"; g.lineWidth = 1;
    for (let i = 0; i < 14; i++) {
      const x = rnd() * W, y = rnd() * H;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - 14, y + 9); g.stroke();
    }
  }
  if (snap["S_일식.활성"]) { g.fillStyle = "rgba(4,4,14,.5)"; g.fillRect(0, 0, W, H); }
  // 상태 아이콘 줄 (좌상단)
  let ix = 14;
  const icon = (txt, on, title) => { if (!on) return; g.font = "14px serif"; g.textAlign = "left"; g.fillStyle = "#d6dde8"; g.fillText(txt, ix, 22); ix += 22; };
  icon("❄", snap["S_영원한겨울.활성"]);
  icon("✦", snap["S_과잉별빛.활성"]);
  icon("🌑", snap["S_일식.활성"]);
  icon("⚡", snap["X_별빛폭풍.활성"]);
  icon("🌊", snap["S_남부대홍수.활성"]);
  icon("〰", snap["S_기후불안정.활성"]);
  const plague = snap["X_검은태양병.강도"] ?? 0;
  if (plague > 0) { g.font = "14px serif"; g.fillStyle = "#3a3140"; g.beginPath(); g.arc(ix + 6, 17, 7, 0, 7); g.fill(); g.fillStyle = "#d87a6f"; g.font = "10px system-ui"; g.fillText(String(plague), ix + 3, 21); ix += 24; }
  if (snap["S_외부관측.활성"]) { g.font = "16px serif"; g.textAlign = "right"; g.fillStyle = "rgba(220,220,255,.8)"; g.fillText("👁", W - 14, 26); }
}
function drawFx(now) {
  fxq = fxq.filter((f) => now - f.at < f.dur);
  for (const f of fxq) {
    const k = (now - f.at) / f.dur;
    let cx, cy;
    if (f.region === "global") { cx = W / 2; cy = H / 2; }
    else if (f.region === "RIVER" && river) [cx, cy] = px(river.path[Math.floor(river.path.length / 2)]);
    else if (regions.has(f.region)) [cx, cy] = px(regions.get(f.region).pos);
    else continue;
    g.globalAlpha = 1 - k;
    if (f.kind === "flash" || f.kind === "war") {
      g.strokeStyle = f.kind === "war" ? "#d87a6f" : "#e8d8a8"; g.lineWidth = 2.5;
      g.beginPath(); g.arc(cx, cy, 8 + k * 46, 0, 7); g.stroke();
      if (f.kind === "war") { g.font = "16px serif"; g.textAlign = "center"; g.fillText("⚔", cx, cy - 14 - k * 10); }
    } else if (f.kind === "spawn" || f.kind === "despawn") {
      g.strokeStyle = f.kind === "spawn" ? "#8fd8a8" : "#8494ab"; g.lineWidth = 1.5;
      g.beginPath(); g.arc(cx, cy, f.kind === "spawn" ? 30 - k * 22 : 8 + k * 22, 0, 7); g.stroke();
    } else if (f.kind === "shift") {
      g.strokeStyle = "#6fb3d8"; g.lineWidth = 2;
      g.beginPath(); g.arc(cx, cy, 10 + k * 26, 0, Math.PI * 1.4); g.stroke();
    } else if (f.kind === "weather") {
      g.fillStyle = "rgba(180,200,255,.12)"; g.fillRect(0, 0, W, H);
    }
    g.globalAlpha = 1;
  }
}
requestAnimationFrame(draw);

// ── 사이드 패널 ────────────────────────────────────────────────────────
const tickview = document.getElementById("tickview"), speed = document.getElementById("speed");
const tabs = { chron: document.getElementById("tab-chron"), events: document.getElementById("tab-events"), inspect: document.getElementById("tab-inspect") };
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  for (const [k, el] of Object.entries(tabs)) el.style.display = k === b.dataset.tab ? "" : "none";
});
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function renderChron(regionFilter) {
  const list = regionFilter ? chron.filter((c) => c.region === regionFilter) : chron;
  tabs.chron.innerHTML = list.length
    ? list.slice(0, 120).map((c) => `<div class="chron-line ${CLASS[c.kind]}"><span class="t">t${c.t}</span>${esc(c.text)}</div>`).join("")
    : `<p class="hint">아직 기록이 없습니다. 세계가 굴러가기 시작하면 발화가 서사로 쌓입니다.</p>`;
}
function renderEvents() {
  let h = "<h3>사건 사슬</h3>";
  for (const e of gaugeEV) {
    const val = snap[e.var] ?? 0, max = e.max ?? 6;
    h += `<div class="gauge"><div class="name"><span>${esc(e.label)}</span><span>${val} / ${max}</span></div>
          <div class="bar"><i style="width:${(val / max) * 100}%"></i></div></div>`;
  }
  h += "<h3>목적</h3>";
  for (const e of gaugeG) {
    const v = varIdx.get(e.var), val = snap[e.var] ?? 0, lbl = v.levels?.[val] ?? val;
    const cls = val === 3 ? "done" : val === 2 ? "run" : "";
    h += `<div class="objrow"><span>${esc(e.label)}</span><span class="st ${cls}">${lbl}</span></div>`;
  }
  h += "<h3>주체</h3>";
  const groups = {};
  for (const e of hudEntries) {
    const owner = e.var.split(".")[0];
    (groups[owner] = groups[owner] || []).push(e);
  }
  for (const [owner, list] of Object.entries(groups)) {
    h += `<div class="subject-card"><div class="sname">${esc(nodeTitle.get(owner) || owner)}</div>`;
    for (const e of list) h += `<div class="kv"><span>${esc(e.label)}</span><span>${esc(levelLabel(e.var))}</span></div>`;
    h += `</div>`;
  }
  h += `<h3>지식·주기</h3>`;
  h += `<div class="kv"><span>아르카론의 정체</span><span>${snap["S_아르카론정체.발견됨"] ? "밝혀짐" : "미지"}</span></div>`;
  h += `<div class="kv"><span>일식 누적</span><span>${snap["S_일식.누적횟수"] ?? 0}회</span></div>`;
  tabs.events.innerHTML = h;
}
let inspected = null;
const openVars = new Set();            // 매 틱 재렌더에도 펼친 카드 유지
function renderInspect(rid) {
  if (inspected !== rid) openVars.clear();
  inspected = rid;
  const r = regions.get(rid);
  const entries = (byRegion.get(rid) || []).concat(refActors.filter((e) => snap[e.var] === rid));
  let h = `<div class="card-title">${esc(nodeTitle.get(rid) || rid)}</div>
    <div class="card-sub">${esc(map.meta.terrains[r.terrain] || r.terrain)} · ${esc(r.basis)}</div>`;
  h += "<h3>상태</h3>";
  for (const e of entries) {
    const rd = readers.get(e.var) || [], wr = writers.get(e.var) || [];
    const v = varIdx.get(e.var);
    h += `<div class="varrow${openVars.has(e.var) ? " open" : ""}" data-var="${esc(e.var)}"><div class="head"><span>${esc(e.label)}</span><span class="val">${esc(levelLabel(e.var))}</span></div>
      <div class="detail"><b>${esc(e.var)}</b>${v.derived ? " · 파생축" : ""}<br>근거: ${esc(v.basis || "—")}<br>
      ${wr.length ? `쓰는 법칙·행동: ${esc(wr.join(", "))}<br>` : ""}${rd.length ? `읽는 법칙·행동: ${esc(rd.join(", "))}` : ""}</div></div>`;
  }
  if (!entries.length) h += `<p class="hint">이 지역에 앵커된 상태 변수가 없습니다.</p>`;
  const recent = chron.filter((c) => c.region === rid).slice(0, 15);
  h += "<h3>지역 연대기</h3>";
  h += recent.length ? recent.map((c) => `<div class="chron-line ${CLASS[c.kind]}"><span class="t">t${c.t}</span>${esc(c.text)}</div>`).join("")
    : `<p class="hint">이 지역에서 발화한 기록이 아직 없습니다.</p>`;
  tabs.inspect.innerHTML = h;
  tabs.inspect.querySelectorAll(".varrow").forEach((el) => el.onclick = () => {
    el.classList.toggle("open");
    el.classList.contains("open") ? openVars.add(el.dataset.var) : openVars.delete(el.dataset.var);
  });
}
function showTab(name) {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === name));
  for (const [k, el] of Object.entries(tabs)) el.style.display = k === name ? "" : "none";
}
cv.addEventListener("click", (ev) => {
  const rect = cv.getBoundingClientRect(), mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  let best = null, bd = 1e9;
  for (const r of map.regions) {
    const [x, y] = px(r.pos), d = Math.hypot(mx - x, my - y);
    if (d < r.size * S + 8 && d < bd) { best = r.id; bd = d; }
  }
  if (best) { renderInspect(best); showTab("inspect"); }
});

// ── 컨트롤 ─────────────────────────────────────────────────────────────
const btnPlay = document.getElementById("btnPlay");
btnPlay.onclick = () => {
  playing = !playing;
  btnPlay.textContent = playing ? "⏸ 일시정지" : "▶ 재생";
  btnPlay.classList.toggle("on", playing);
  setTimer();
};
document.getElementById("btnStep").onclick = () => { if (!playing) step(); };
speed.onchange = setTimer;
document.getElementById("btnReset").onclick = () => { boot(); setTimer(); };

// 디버그 방아쇠 — simulate-state.mjs --force 와 동일한 실증 진입점 (progress/world-laws.md).
// 정상 경로가 아닌 명시적 디버그 쓰기이며, 실제 게임플레이 개입은 3단계의 행동 발화 요청이다.
const TRIGGERS = [
  ["사건1 강의 귀환", "L_제어탑.가동", true],
  ["사건2 늑대 멸종", "E_회색등늑대.개체수", 3],
  ["사건3 유리 호황", "G3.2.1.진행", 2],
  ["사건4 혈청 공개", "R_백야혈청.공개", 3],
  ["사건5 신의 죽음", "E_아르카론.심장핵", false],
];
const tbar = document.getElementById("triggers");
for (const [label, varName, value] of TRIGGERS) {
  const b = document.createElement("button");
  b.textContent = label;
  b.title = `--force ${varName}=${value}`;
  b.onclick = () => {
    snap[varName] = value;
    recomputeDerived(snap, varIdx);
    b.classList.add("fired");
    pushChron(ctx.t, "clock", "debug", `[디버그] ${varName} = ${value}`);
    renderChron();
  };
  tbar.appendChild(b);
}

boot();
setTimer();
</script>
</body>
</html>
