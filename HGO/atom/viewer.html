<!DOCTYPE html>
<!-- viewer.html — 단일 뷰어. step 선택기로 장면을 골라 결정론적으로 돌린다.
     step 마다 복제하지 않는다(SPINE §6.1) — engine/scenes.js 의 장면 한 항을 읽을 뿐.
     색=속도(운동에너지=온도)·크기=질량(Z+N) — 둘 다 물리량 읽기지 author 아님. -->
<meta charset="utf-8">
<title>HGO viewer — atom</title>
<style>
  body { margin: 0; background: #0a0c12; color: #cdd6f4; font: 13px/1.5 ui-monospace, monospace; }
  header { padding: 10px 14px; border-bottom: 1px solid #1e2230; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  select, button { background: #181b27; color: #cdd6f4; border: 1px solid #313547; border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #585b70; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  #wrap { display: flex; gap: 14px; padding: 14px; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #05060a; border: 1px solid #1e2230; border-radius: 6px; }
  #side { max-width: 360px; }
  #desc { color: #9399b2; margin: 0 0 10px; }
  #watch { white-space: pre-wrap; background: #11131c; border: 1px solid #1e2230; border-radius: 6px; padding: 10px; }
  .k { color: #89b4fa; } .legend { color: #7f849c; margin-top: 10px; }
</style>

<header>
  <label>장면 <select id="scene"></select></label>
  <button id="play">▶ play</button>
  <button id="stepBtn">step</button>
  <button id="reset">reset</button>
  <label>dt <input id="dt" type="range" min="0.1" max="2" step="0.1" value="1"><span id="dtv">1.0</span></label>
  <label>seed <input id="seed" type="number" value="42" style="width:6em"></label>
  <span id="tick" class="k"></span>
</header>

<div id="wrap">
  <canvas id="cv" width="560" height="560"></canvas>
  <div id="side">
    <h3 id="title" style="margin:.2em 0"></h3>
    <p id="desc"></p>
    <div id="watch"></div>
    <div class="legend">● 크기 = 질량(Z+N) · 색 = 속도(파랑 느림 → 빨강 빠름 = 운동에너지/온도)<br>색·형태를 author 하지 않는다 — 물리량을 읽을 뿐(SPINE §6.1).</div>
  </div>
</div>

<script src="engine/hgo-kernel.js"></script>
<script src="engine/hgo-laws.js"></script>
<script src="engine/hgo-sim.js"></script>
<script src="engine/scenes.js"></script>
<script>
const { kernel: K, sim: S, scenes: SC } = HGO;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let sim, scene, playing = false;

function buildSceneList() {
  const sel = $('scene');
  for (const id of Object.keys(SC.SCENES)) { const o = document.createElement('option'); o.value = id; o.textContent = id; sel.appendChild(o); }
  const fromHash = location.hash.slice(1);
  sel.value = SC.SCENES[fromHash] ? fromHash : Object.keys(SC.SCENES)[0];
}

function reset() {
  scene = SC.SCENES[$('scene').value];
  location.hash = scene.id;
  const seed = parseInt($('seed').value, 10) >>> 0;
  sim = S.createSim(scene.init(K.mulberry32(seed), K));
  sim.knobs.dt = parseFloat($('dt').value);
  $('title').textContent = scene.title;
  $('desc').textContent = scene.desc;
  draw();
}

function speedColor(a) {
  const s = Math.min(Math.hypot(a.vx, a.vy) / 1.6, 1);   // 0..1
  const hue = 240 - 240 * s;                              // 파랑→빨강
  return `hsl(${hue},80%,60%)`;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const sx = cv.width / sim.W, sy = cv.height / sim.H;
  for (const a of sim.atoms) {
    const r = 2 + Math.sqrt(K.mass(a));
    ctx.beginPath();
    ctx.arc(a.rx * sx, a.ry * sy, r, 0, 6.2832);
    ctx.fillStyle = speedColor(a);
    ctx.globalAlpha = a.Z === a.e ? 0.9 : 1;               // 이온(전하≠0)은 또렷이
    ctx.fill();
    if (a.Z !== a.e) { ctx.lineWidth = 1; ctx.strokeStyle = '#f9e2af'; ctx.stroke(); } // 이온 테두리
  }
  ctx.globalAlpha = 1;
  $('tick').textContent = `tick ${sim.tick}`;
  const w = scene.watch(sim, K);
  $('watch').innerHTML = Object.entries(w).map(([k, v]) => `<span class="k">${k}</span> = ${v}`).join('\n');
}

function loop() { if (playing) { S.step(sim); draw(); } requestAnimationFrame(loop); }

$('scene').onchange = reset;
$('seed').onchange = reset;
$('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '❚❚ pause' : '▶ play'; };
$('stepBtn').onclick = () => { S.step(sim); draw(); };
$('reset').onclick = reset;
$('dt').oninput = e => { $('dtv').textContent = (+e.target.value).toFixed(1); if (sim) sim.knobs.dt = +e.target.value; };
window.onhashchange = () => { const h = location.hash.slice(1); if (SC.SCENES[h] && h !== $('scene').value) { $('scene').value = h; reset(); } };

buildSceneList();
reset();
loop();
</script>
