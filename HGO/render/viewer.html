<!DOCTYPE html>
<!-- render/viewer.html — 렌더 트랙 단일 뷰어. atom 트랙 스냅샷을 *읽기만* 한다(SPINE §7 불가침).
     렌즈 L-λ: 시뮬이 내보낸 광자(sim.photons[].lambda)를 스펙트럼 색으로 번역 — 색을 author 하지 않는다.
     원자는 어둑한 *광원*으로, 광자는 색 있는 *빛 섬광*으로 그린다. 형태·위치는 sim (rx,ry) 그대로. -->
<meta charset="utf-8">
<title>HGO viewer — render (빛)</title>
<style>
  body { margin: 0; background: #05060a; color: #cdd6f4; font: 13px/1.5 ui-monospace, monospace; }
  header { padding: 10px 14px; border-bottom: 1px solid #1e2230; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  select, button { background: #181b27; color: #cdd6f4; border: 1px solid #313547; border-radius: 5px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #585b70; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  #wrap { display: flex; gap: 14px; padding: 14px; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #000; border: 1px solid #1e2230; border-radius: 6px; }
  #side { max-width: 360px; }
  #desc { color: #9399b2; margin: 0 0 10px; }
  #watch { white-space: pre-wrap; background: #11131c; border: 1px solid #1e2230; border-radius: 6px; padding: 10px; }
  .k { color: #89b4fa; } .legend { color: #7f849c; margin-top: 10px; }
  #strip { margin-top: 10px; border: 1px solid #1e2230; border-radius: 4px; }
</style>

<header>
  <label>장면 <select id="scene"></select></label>
  <button id="play">▶ play</button>
  <button id="stepBtn">step</button>
  <button id="reset">reset</button>
  <span id="knobs"></span>
  <label>seed <input id="seed" type="number" value="42" style="width:6em"></label>
  <span id="tick" class="k"></span>
</header>

<div id="wrap">
  <canvas id="cv" width="560" height="560"></canvas>
  <div id="side">
    <h3 id="title" style="margin:.2em 0"></h3>
    <p id="desc"></p>
    <div id="watch"></div>
    <canvas id="strip" width="340" height="22"></canvas>
    <div class="legend">렌즈 <b>L-λ</b>: 색 = 방출 광자의 파장 λ=hc/ΔE (보라=고에너지 짧은 λ → 빨강=저에너지 긴 λ).<br>
      위 띠 = 이번 런에서 측정된 스펙트럼선. 색을 author 하지 않는다 — 시뮬 λ 를 실제 가시광 곡선으로 읽을 뿐(RENDER.md §3).</div>
  </div>
</div>

<!-- atom 트랙 엔진을 읽기 전용으로 로드(SPINE §7 — 렌더는 스냅샷을 읽기만) -->
<script src="../atom/engine/hgo-kernel.js"></script>
<script src="../atom/engine/hgo-laws.js"></script>
<script src="../atom/engine/hgo-sim.js"></script>
<script src="../atom/engine/scenes.js"></script>
<script src="engine/spectral.js"></script>
<script>
const { kernel: K, sim: S, scenes: SC } = HGO;
const SP = HGORender.spectral;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const strip = document.getElementById('strip'), sctx = strip.getContext('2d');
const $ = id => document.getElementById(id);
let sim, scene, playing = false;
let flashes = [], seenPhotons = 0;   // 렌더 전용(스냅샷 비변경): 새 광자를 섬광으로 추적

function buildSceneList() {
  const sel = $('scene');
  for (const id of Object.keys(SC.SCENES)) { const o = document.createElement('option'); o.value = id; o.textContent = id; sel.appendChild(o); }
  const fromHash = location.hash.slice(1);
  sel.value = SC.SCENES[fromHash] ? fromHash : 'step-0002';   // 빛이 있는 장면 우선
}

function buildKnobs() {
  const box = $('knobs'); box.innerHTML = '';
  for (const k of Object.keys(sim.knobs)) {
    const v = sim.knobs[k], max = Math.max(1, v * 2), step = +(max / 100).toPrecision(2);
    const lab = document.createElement('label'), val = document.createElement('span');
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = 0; inp.max = max; inp.step = step; inp.value = v;
    val.textContent = (+v).toFixed(2);
    inp.oninput = e => { sim.knobs[k] = +e.target.value; val.textContent = (+e.target.value).toFixed(2); };
    lab.append(k + ' ', inp, val);
    box.appendChild(lab);
  }
}

function reset() {
  scene = SC.SCENES[$('scene').value];
  location.hash = scene.id;
  const raw = parseInt($('seed').value, 10);
  const seed = (Number.isFinite(raw) ? raw : 42) >>> 0;
  sim = S.createSim(scene.init(K.mulberry32(seed), K));
  flashes = []; seenPhotons = 0;
  $('title').textContent = scene.title;
  $('desc').textContent = scene.desc;
  buildKnobs();
  draw();
}

// 시뮬을 한 tick 전진시키되, 새로 쌓인 광자를 렌더 전용 섬광 목록에 옮긴다(스냅샷 비변경).
function advance() {
  S.step(sim);
  for (let i = seenPhotons; i < sim.photons.length; i++) {
    const p = sim.photons[i];
    flashes.push({ rx: p.rx, ry: p.ry, lambda: p.lambda, born: sim.tick });
  }
  seenPhotons = sim.photons.length;
}

const LIFE = 28;   // 섬광 수명(tick)

function draw() {
  const sx = cv.width / sim.W, sy = cv.height / sim.H;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);

  // 원자 = 어둑한 광원(빛의 하류 — 형태는 sim 위치 그대로, 색은 author 안 함)
  for (const a of sim.atoms) {
    const r = 1.5 + Math.sqrt(K.mass(a));
    ctx.beginPath();
    ctx.arc(a.rx * sx, a.ry * sy, r, 0, 6.2832);
    ctx.fillStyle = (a.x | 0) > 0 ? '#39405a' : '#20242f';   // 들뜬 원자는 약간 밝게(읽기: x>0)
    ctx.fill();
  }

  // 광자 = 색 있는 빛(가법 합성). 색 = λ → 스펙트럼(측정 범위 정규화)
  const range = SP.measureRange(sim.photons) || { lo: 1, hi: 2 };
  ctx.globalCompositeOperation = 'lighter';
  for (let i = flashes.length - 1; i >= 0; i--) {
    const fl = flashes[i];
    const age = sim.tick - fl.born;
    if (age > LIFE) { flashes.splice(i, 1); continue; }
    const k = 1 - age / LIFE;                       // 1→0 페이드
    const [r, g, b] = SP.photonColor(fl.lambda, range);
    const x = fl.rx * sx, y = fl.ry * sy, rad = 3 + 16 * k;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, `rgba(${r},${g},${b},${0.9 * k})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  drawStrip(range);
  $('tick').textContent = `tick ${sim.tick}`;
  const w = scene.watch ? scene.watch(sim, K) : {};
  $('watch').innerHTML = Object.entries(w).map(([k, v]) => `<span class="k">${k}</span> = ${v}`).join('\n');
}

// 스펙트럼 띠: 이번 런의 *측정된* 전이선들을 색으로(=실제 스펙트럼선의 창발)
function drawStrip(range) {
  sctx.fillStyle = '#05060a'; sctx.fillRect(0, 0, strip.width, strip.height);
  const lines = new Map();   // 'from→to' → lambda
  for (const p of sim.photons) lines.set(p.from + '→' + p.to, p.lambda);
  for (const [, lambda] of lines) {
    const nm = SP.lambdaToNm(lambda, range.lo, range.hi);
    const x = ((nm - 400) / 300) * strip.width;
    const [r, g, b] = SP.wavelengthToRGB(nm);
    sctx.fillStyle = `rgb(${r},${g},${b})`;
    sctx.fillRect(x - 2, 0, 4, strip.height);
  }
}

function loop() { if (playing) { advance(); draw(); } requestAnimationFrame(loop); }

$('scene').onchange = reset;
$('seed').onchange = reset;
$('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '❚❚ pause' : '▶ play'; };
$('stepBtn').onclick = () => { advance(); draw(); };
$('reset').onclick = reset;
window.onhashchange = () => { const h = location.hash.slice(1); if (SC.SCENES[h] && h !== $('scene').value) { $('scene').value = h; reset(); } };

buildSceneList();
reset();
loop();
</script>
