<html lang="ko">
<head>
<meta charset="utf-8">
<title>HktInfra step-0004 — 전송 현실화: 타이밍↔내용 분리 관찰</title>
<style>
  :root { color-scheme: dark; }
  body { background: #1e1e2e; color: #cdd6f4; font: 14px ui-monospace, "SF Mono", Menlo, monospace; margin: 0; padding: 22px 26px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #9399b2; font-size: 12px; margin-bottom: 18px; max-width: 980px; line-height: 1.5; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 16px; padding: 12px 14px; background: #181825; border-radius: 8px; }
  .ctl { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .ctl .lbl { color: #bac2de; min-width: max-content; }
  .ctl .val { color: #f9e2af; min-width: 26px; text-align: right; }
  input[type=range] { width: 116px; accent-color: #89b4fa; }
  canvas.tl { display: block; background: #181825; border-radius: 8px; padding: 6px; margin-bottom: 14px; max-width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 22px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #313244; padding: 3px 0; }
  .stat .k { color: #9399b2; }
  .stat .v { color: #cdd6f4; } .stat .v.good { color: #a6e3a1; } .stat .v.bad { color: #f38ba8; }
  .note { color: #9399b2; font-size: 12px; max-width: 980px; line-height: 1.5; }
  a { color: #89b4fa; }
</style>
</head>
<body>
  <h1>step-0004 — 전송 현실화: <b>타이밍은 토폴로지의 함수, 내용만 시드의 함수</b></h1>
  <div class="sub">
    같은 입력열을 흘리고 전송(지연·손실·재정렬)을 흔들 때, <b>스케줄(논리-tick)</b>은 권위·추종자가 매 tick 일치하고
    내용 기준(전송 OFF)과도 비트 동일하게 유지되지만 — <b>naive(도착-즉시)</b>는 타이밍이 내용으로 새어 갈린다.
    초록=일치, 빨강=갈림. 슬라이더로 지연·손실을 올려 <b>흡수 예산(INPUT_DELAY−1)을 넘기면 SCHED 도 무너지는 절벽</b>을 직접 확인하세요.
    상세: <a href="step-0004.md">step-0004.md</a>.
  </div>
