<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTJ Viewer — 에너지 흐름(열역학 제2법칙)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0c10; color: #c8d0dc; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display: flex; height: 100%; }
  #panel { width: 248px; flex: none; padding: 14px; border-right: 1px solid #1c2230; overflow: auto; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #cv { display: block; width: 100%; height: 100%; }
  h1 { font-size: 14px; margin: 0 0 2px; color: #e6ecf5; }
  .sub { color: #6b778a; margin: 0 0 14px; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { width: 72px; color: #8a96a8; }
  button { background: #18202e; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 5px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #212c3e; }
  button.primary { background: #1f3a5c; border-color: #2f5688; }
  input[type=number] { width: 64px; background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  select { background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .stat { color: #8a96a8; font-size: 11px; margin-top: 12px; border-top: 1px solid #1c2230; padding-top: 10px; }
  .stat b { color: #c8d0dc; font-weight: 600; }
  .note { color: #5b6678; font-size: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1 id="title">HTJ — 뷰어</h1>
    <p class="sub" id="sub">step 선택</p>

    <div class="row"><label>step</label><select id="step"></select></div>
    <div class="row"><label>N (격자)</label><input id="N" type="number" min="4" max="48" step="1" value="24" /></div>

    <div id="dyn">
      <div class="row"><label>α (확산율)</label><input id="alpha" type="number" min="0" max="0.166" step="0.01" value="0.14" /></div>
      <div class="row" id="row-rate"><label>방출율</label><input id="rate" type="number" min="0" max="1" step="0.005" value="0.02" /></div>
      <div class="row" id="row-crit"><label>점화 임계</label><input id="crit" type="number" min="0" step="50" value="300" /></div>
      <div class="row" id="row-radiate"><label>복사율(sink)</label><input id="radiate" type="number" min="0" max="1" step="0.02" value="0.2" /></div>
      <div class="row"><label>확산속도</label><input id="speed" type="number" min="1" max="50" step="1" value="6" /></div>
      <div class="row"><label>장(field)</label><select id="brushField"></select></div>
      <div class="row"><label>붓 반경</label><input id="brushR" type="number" min="0" max="6" step="1" value="1" /></div>
      <div class="row"><label>열량</label><input id="brushAmt" type="number" min="1" step="50" value="800" /></div>
      <div class="row">
        <button id="play" class="primary">▶ 흐름</button>
        <button id="step-btn">스텝</button>
      </div>
    </div>

    <div class="row"><label>색 기준</label>
      <select id="colorScale"><option value="relative">상대(평균)</option><option value="absolute">절대(고정)</option></select>
    </div>
    <div class="row" id="row-colormax"><label>색 최대E</label><input id="colorMax" type="number" min="0" step="50" value="1000" /></div>

    <div class="row">
      <button id="reset">리셋</button>
      <button id="capture">📷 캡처(PNG)</button>
    </div>

    <div class="stat">
      <div>tick: <b id="s-tick">0</b></div>
      <div id="s-pot-row">잠재력: <b id="s-pot">0</b> <span style="color:#5b6678">(↓ 풀림)</span></div>
      <div>총 에너지: <b id="s-total">0</b> <span style="color:#5b6678">(↑ 탄생)</span></div>
      <div id="s-rad-row">복사 누적: <b id="s-rad">0</b> <span style="color:#5b6678">(→ 우주)</span></div>
      <div>엔트로피: <b id="s-entropy">0</b> nats <span style="color:#5b6678">(↑)</span></div>
      <div>점유 셀: <b id="s-occ">0</b> / <span id="s-cells">0</span></div>
      <div>최대 E: <b id="s-max">0</b></div>
    </div>
    <p class="note" id="note">드래그=회전 · 휠=줌 · 우드래그=이동.</p>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<!-- 세계(법칙)는 engine/, 그리기는 viewer/ — viewer 는 engine 을 *읽기만* 한다(단방향). -->
<script src="engine/htj-world.js"></script>
<script src="engine/htj-energy.js"></script>
<script src="engine/htj-potential.js"></script>
<script src="engine/htj-radiate.js"></script>
<script src="viewer/htj-render.js"></script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const cam = HTJRender.defaultCamera();
  let world = null, tick = 0, surf = 0, playing = false, mode = 'energy';

  // ── step 레지스트리 — 각 step 의 장면(초기화)·렌더 모드·동역학 유무·설명 ──
  //   드롭다운으로 선택해 step 별 세계를 본다. 동역학 없는 step 은 인터랙션 컨트롤을 숨긴다.
  const STEPS = {
    '0001': {
      label: 'step_0001 — 기반 무대', title: 'HTJ — 기반 무대', sub: '격자 + 장(정적 데모 공)',
      mode: 'cells', dynamics: false,
      init(w) { HTJWorld.seedBall(w, { seed: 42 }); },       // 정물 공(법칙 없음)
      note: '드래그=회전 · 휠=줌 · 우드래그=이동.<br />법칙(동역학)은 없다 — 격자와 그 관찰 가능성만 세운 무대. 가운데 정물 공을 3D voxel 로 본다.'
    },
    '0002': {
      label: 'step_0002 — 에너지 흐름', title: 'HTJ — 에너지 흐름', sub: '열역학 제2법칙 = 확산',
      mode: 'energy', dynamics: true, release: false,
      defaults: { alpha: 0.14, view: 'energy' },
      init(w) { HTJEnergy.seedHotSpot(w, { E0: 1000, half: 0 }); },     // 가운데 단일 열원(클릭으로 더 둘 수 있다)
      advance(w, p) { HTJEnergy.diffuseEnergy(w, p.alpha); },     // 법칙: 확산만
      note: '<b>클릭</b>=열 주입(선택한 장) · 드래그=회전 · 휠=줌 · 우드래그=이동.<br />가운데 열원이 하나 놓여 있다 — <b>▶ 흐름</b>에서 확산된다(클릭으로 더 둘 수 있다). 총량 *보존*·엔트로피 *증가* → 퍼져 균일(열적 죽음). 색=평균 대비 밀도(청→적).'
    },
    '0003': {
      label: 'step_0003 — 에너지의 탄생', title: 'HTJ — 에너지의 탄생', sub: '잠재력 방출(potential→energy)',
      mode: 'energy', dynamics: true, release: true,
      defaults: { alpha: 0.14, rate: 0.02, view: 'potential' },
      init(w) { HTJPotential.seedPotential(w, { P0: 1000, r: w.N * 0.18 }); },  // 중앙 잠재력 저장고(에너지=0)
      advance(w, p) { HTJPotential.releaseEnergy(w, p.rate); HTJEnergy.diffuseEnergy(w, p.alpha); },  // 법칙: 방출+확산
      note: '시작 화면 = <b>potential</b> 장(빨간 잠재력 저장고). ▶ 흐름을 누르면 저장고가 *풀리며 줄어든다*(↓).<br /><b>장(field)</b>을 energy 로 바꾸면 거기서 *태어난* 에너지(↑)가 확산되는 게 보인다. 잠재력↓+에너지↑ 이지만 *총합 보존* — 생성은 형태 변환일 뿐.'
    },
    '0004': {
      label: 'step_0004 — 별의 점화', title: 'HTJ — 별의 점화', sub: '임계 방출(밀도 게이트)',
      mode: 'energy', dynamics: true, release: true, ignite: true,
      defaults: { alpha: 0, rate: 0.05, crit: 300, view: 'potential', autoEnergyView: true },
      init(w) { HTJPotential.seedStarField(w, { core: 1000, background: 50, r: w.N * 0.25 }); },  // 별밭(코어+가스)
      advance(w, p) { HTJPotential.releaseEnergy(w, p.rate, { crit: p.crit }); HTJEnergy.diffuseEnergy(w, p.alpha); },  // 법칙: 임계 방출+확산
      note: '시작 화면 = <b>potential</b>(연료 분포: 밀집한 코어 + 옅은 가스). <b>▶ 흐름</b>을 누르면 화면이 <b>energy</b> 로 바뀌며 *임계 넘긴 코어만* 빨갛게 점화한다(=별) — 가스는 어둡다.<br />기본 α=0(확산 꺼짐)이라 별이 또렷이 보인다. <b>α</b>를 올리면 별빛이 가스로 퍼지고, <b>점화 임계</b>를 올리면 별이 작아지고/안 켜진다 → "별 = 임계 위 영역".'
    },
    '0005': {
      label: 'step_0005 — 빛나는 별', title: 'HTJ — 빛나는 별', sub: '경계 복사(sink) → 영구 그래디언트',
      mode: 'energy', dynamics: true, release: true, ignite: true, radiate: true,
      defaults: { alpha: 0.14, rate: 0.02, crit: 300, radiate: 0.2, colorScale: 'absolute', colorMax: 4000, view: 'potential', autoEnergyView: true },
      init(w) { HTJPotential.seedStarField(w, { core: 1e7, background: 0, r: w.N * 0.16 }); },  // 큰 연료 저장고
      advance(w, p) { HTJPotential.releaseEnergy(w, p.rate, { crit: p.crit }); HTJEnergy.diffuseEnergy(w, p.alpha); HTJRadiate.radiate(w, p.radiate); },  // 법칙: 점화+확산+복사
      note: '시작 화면 = <b>potential</b>(큰 연료 저장고). <b>▶ 흐름</b>을 누르면 화면이 <b>energy</b> 로 바뀐다 — 코어가 *계속* 점화(=별) → 에너지가 확산으로 흐르고 <b>경계에서 우주로 빠져나간다</b>(sink). 중심은 *꾸준히 밝고* 바깥은 어둡다 = 영구 그래디언트.<br /><b>색 기준=절대</b>라 에너지가 빠져나가며 *전체가 어두워지는 것*도 보인다. 복사율을 0 으로 하면 닫힌 상자처럼 균일해진다(안 빛남).'
    }
  };
  function currentStep() { return document.getElementById('step').value || '0003'; }

  function resize() {
    const r = cv.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, (r.width * dpr) | 0);
    cv.height = Math.max(2, (r.height * dpr) | 0);
    render();
  }

  function readN() { return Math.max(4, Math.min(48, parseInt(document.getElementById('N').value, 10) || 24)); }
  function readAlpha() { return Math.max(0, Math.min(HTJEnergy.ALPHA_MAX, parseFloat(document.getElementById('alpha').value) || 0)); }
  function readSpeed() { return Math.max(1, Math.min(50, parseInt(document.getElementById('speed').value, 10) || 1)); }
  function readRate() { return Math.max(0, Math.min(1, parseFloat(document.getElementById('rate').value) || 0)); }
  function readCrit() { return Math.max(0, parseFloat(document.getElementById('crit').value) || 0); }
  function readRadiate() { return Math.max(0, Math.min(1, parseFloat(document.getElementById('radiate').value) || 0)); }
  function readColorMax() { return Math.max(0, parseFloat(document.getElementById('colorMax').value) || 0); }
  function advanceParams() { return { alpha: readAlpha(), rate: readRate(), crit: readCrit(), radiate: readRadiate() }; }
  function readBrushR() { return Math.max(0, Math.min(6, parseInt(document.getElementById('brushR').value, 10) || 0)); }
  function readBrushAmt() { return Math.max(0, parseFloat(document.getElementById('brushAmt').value) || 0); }
  function brushField() { return document.getElementById('brushField').value || 'energy'; }

  // 인터랙션 대상 장 드롭다운을 world.fields 에서 채운다(장이 늘면 자동 반영).
  function refreshFieldOptions() {
    const sel = document.getElementById('brushField'), prev = sel.value;
    sel.innerHTML = '';
    for (const name of Object.keys(world.fields)) {
      const o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o);
    }
    if (prev && world.fields[prev]) sel.value = prev;
  }

  // 리셋 — 현재 step 의 장면으로 세계를 다시 만든다.
  function reset() {
    const st = STEPS[currentStep()];
    mode = st.mode;
    world = HTJWorld.createWorld(readN());
    st.init(world);
    tick = 0;
    refreshFieldOptions();
    render();
    updateStats();
  }

  // step 전환 — 헤더·설명·컨트롤 가시성을 바꾸고 장면을 리셋한다.
  function applyStep() {
    setPlaying(false);
    const st = STEPS[currentStep()];
    document.getElementById('title').textContent = st.title;
    document.getElementById('sub').textContent = st.sub + ' (step_' + currentStep() + ')';
    document.getElementById('note').innerHTML = st.note;
    document.getElementById('dyn').style.display = st.dynamics ? '' : 'none';
    document.getElementById('row-rate').style.display = st.release ? '' : 'none';   // 방출율은 방출 step 에서만
    document.getElementById('row-crit').style.display = st.ignite ? '' : 'none';    // 점화 임계는 점화 step 에서만
    document.getElementById('row-radiate').style.display = st.radiate ? '' : 'none'; // 복사율은 sink step 에서만
    // step별 *관찰하기 좋은* 기본 노브 적용(α·방출율·임계·복사율·색 기준).
    const d = st.defaults || {};
    if (d.alpha != null) document.getElementById('alpha').value = d.alpha;
    if (d.rate != null) document.getElementById('rate').value = d.rate;
    if (d.crit != null) document.getElementById('crit').value = d.crit;
    if (d.radiate != null) document.getElementById('radiate').value = d.radiate;
    document.getElementById('colorScale').value = d.colorScale || 'relative';
    if (d.colorMax != null) document.getElementById('colorMax').value = d.colorMax;
    document.getElementById('row-colormax').style.display = document.getElementById('colorScale').value === 'absolute' ? '' : 'none';
    reset();
    // 시작 시 보여줄 장(검은 화면 방지 등).
    if (d.view && world.fields[d.view]) { document.getElementById('brushField').value = d.view; render(); }
  }

  function updateStats() {
    const hasPot = !!world.fields.potential, hasRad = world.radiated != null;
    document.getElementById('s-tick').textContent = tick;
    document.getElementById('s-pot-row').style.display = hasPot ? '' : 'none';
    if (hasPot) document.getElementById('s-pot').textContent = world.total('potential').toFixed(2);
    document.getElementById('s-rad-row').style.display = hasRad ? '' : 'none';
    if (hasRad) document.getElementById('s-rad').textContent = world.radiated.toFixed(2);
    document.getElementById('s-total').textContent = world.total('energy').toFixed(2);
    document.getElementById('s-entropy').textContent = HTJEnergy.entropy(world).toFixed(4);
    document.getElementById('s-occ').textContent = world.count('energy', 1e-9);
    document.getElementById('s-cells').textContent = world.fields.energy.length;
    document.getElementById('s-max').textContent = world.max('energy').toFixed(3);
  }

  function render() {
    if (!world) return;
    let name = brushField();
    if (!world.fields[name]) name = world.fields.energy ? 'energy' : Object.keys(world.fields)[0];  // 선택 장이 없으면 폴백
    if (!name) return;
    // 색 기준 두 가지:
    //  · 상대(평균): max = 평균*2 → "평균 대비" 분포를 본다(퍼지면 균일 색). 절대 총량은 색에 안 나타남.
    //  · 절대(고정): max = 색최대E 고정값 → 같은 에너지는 늘 같은 색. *에너지가 빠져나가 어두워지는 것*·
    //    별이 *계속 밝게* 유지되는 것이 보인다. (max=0 이면 draw 가 자동 폴백.)
    let max;
    if (document.getElementById('colorScale').value === 'absolute') max = readColorMax();
    else { const mean = world.total(name) / world.fields[name].length; max = mean > 0 ? mean * 2 : 0; }
    surf = HTJRender.draw(ctx, world, cam, {
      field: name, colormap: mode === 'cells' ? 'palette' : 'heat', max
    });
  }

  // 열 주입 — 클릭 지점의 셀을 픽해, 붓 반경의 구(球) 안 셀에 열량을 더한다(선택한 장).
  //   동역학 없는 step(무대 등)에선 주입하지 않는다.
  function injectAt(sx, sy) {
    if (!STEPS[currentStep()].dynamics) return;
    const cell = HTJRender.pick(ctx, world, cam, sx, sy);
    if (!cell) return;
    const name = brushField(), r = readBrushR(), amt = readBrushAmt();
    const [cx, cy, cz] = cell;
    for (let dz = -r; dz <= r; dz++)
      for (let dy = -r; dy <= r; dy++)
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy + dz * dz > r * r + 0.5) continue;   // 구 안만
          const x = cx + dx, y = cy + dy, z = cz + dz;
          if (world.inBounds(x, y, z)) world.set(name, x, y, z, world.get(name, x, y, z) + amt);
        }
    render(); updateStats();
  }

  // 스텝 — 현재 step 의 법칙을 1회 굴린다(0002=확산 / 0003=방출+확산). 동역학 step 에서만.
  // 별 step(autoEnergyView)은 로드 시 연료(potential)를 보여주다가, 동역학이 시작되면
  //   결과가 보이는 energy 장으로 자동 전환한다(까만 화면 방지 + 별이 켜지는 걸 바로 보이게).
  function maybeAutoEnergyView() {
    const d = STEPS[currentStep()].defaults || {};
    const bf = document.getElementById('brushField');
    if (d.autoEnergyView && bf.value === 'potential' && world.fields.energy) bf.value = 'energy';
  }

  function stepOnce() { const st = STEPS[currentStep()]; if (!st.dynamics) return; maybeAutoEnergyView(); st.advance(world, advanceParams()); tick++; render(); updateStats(); }

  // 흐름 — 법칙을 연속 재생(시점 회전이 아니라 *세계의 동역학*).
  let raf = 0;
  function loop() {
    if (!playing) return;
    const st = STEPS[currentStep()], p = advanceParams(), s = readSpeed();
    for (let k = 0; k < s; k++) { st.advance(world, p); tick++; }   // 프레임당 여러 스텝 → 변화가 눈에 보이게
    render(); updateStats();
    raf = requestAnimationFrame(loop);
  }
  function setPlaying(on) {
    playing = on;
    document.getElementById('play').textContent = on ? '⏸ 멈춤' : '▶ 흐름';
    if (on) { maybeAutoEnergyView(); raf = requestAnimationFrame(loop); } else cancelAnimationFrame(raf);
  }

  // 클릭 화면좌표 → 캔버스 픽셀좌표(CSS 크기·dpr 보정).
  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height)];
  }

  // ── 오빗 + 클릭 주입 ──
  //   좌버튼: 시작점에서 거의 안 움직이면(≤3px) 클릭=열 주입 / 움직이면 회전. 우버튼: 이동.
  let drag = null;
  cv.addEventListener('mousedown', e => {
    drag = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, b: e.button, moved: false };
    e.preventDefault();
  });
  window.addEventListener('mouseup', e => {
    if (drag && drag.b === 0 && !drag.moved) { const [px, py] = toCanvas(e); injectAt(px, py); }
    drag = null;
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 3) drag.moved = true;
    if (drag.b === 2) { cam.panX += dx; cam.panY += dy; render(); }
    else if (drag.moved) { cam.yaw += dx * 0.01; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.01)); render(); }
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { cam.zoom = Math.max(0.2, Math.min(5, cam.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); render(); e.preventDefault(); }, { passive: false });

  // step 드롭다운 채우기.
  (function () {
    const sel = document.getElementById('step');
    for (const key of Object.keys(STEPS)) {
      const o = document.createElement('option'); o.value = key; o.textContent = STEPS[key].label; sel.appendChild(o);
    }
    sel.value = '0005';                       // 기본 = 현재 step
  })();

  // ── 버튼 ──
  document.getElementById('step').onchange = applyStep;
  document.getElementById('play').onclick = () => setPlaying(!playing);
  document.getElementById('step-btn').onclick = stepOnce;
  document.getElementById('reset').onclick = () => { setPlaying(false); reset(); };
  document.getElementById('N').onchange = () => { setPlaying(false); reset(); };
  document.getElementById('brushField').onchange = render;
  document.getElementById('colorScale').onchange = () => {
    document.getElementById('row-colormax').style.display = document.getElementById('colorScale').value === 'absolute' ? '' : 'none';
    render();
  };
  document.getElementById('colorMax').onchange = render;
  document.getElementById('capture').onclick = () => {
    const a = document.createElement('a');
    a.download = 'htj-' + currentStep() + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', resize);

  // 헤드리스 캡처/검증용 전역 훅 — capture.js 가 이 핸들로 세계를 굴리고 그린다.
  window.HTJViewer = {
    get world() { return world; }, cam,
    setSize(w, h) { cv.width = w; cv.height = h; },
    // 에너지 모드(step_0002) — 중앙 핫스팟 초기화.
    energyInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJEnergy.seedHotSpot(world, opts || { E0: 1000, half: 0 });
      tick = 0;
    },
    diffuse(alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    entropy() { return HTJEnergy.entropy(world); },
    totalEnergy() { return world.total('energy'); },
    maxEnergy() { return world.max('energy'); },
    // 탄생 모드(step_0003) — 중앙 잠재력 저장고(에너지=0)로 초기화.
    potentialInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJPotential.seedPotential(world, opts || { P0: 1000, r: (N | 0) * 0.18 });
      tick = 0;
    },
    // 방출+확산을 steps 회 굴린다(세계의 동역학).
    release(rate, alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJPotential.releaseEnergy(world, rate); HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    // 별 모드(step_0004) — 별밭 초기화(코어+가스).
    starInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJPotential.seedStarField(world, opts || { core: 1000, background: 50, r: (N | 0) * 0.25 });
      tick = 0;
    },
    // 임계 방출+확산을 steps 회 굴린다(별의 점화).
    igniteRun(rate, crit, alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJPotential.releaseEnergy(world, rate, { crit }); HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    // 점화+확산+복사(sink)를 steps 회 굴린다(빛나는 별, step_0005).
    steadyRun(rate, crit, alpha, rad, steps) { for (let t = 0; t < (steps || 1); t++) { HTJPotential.releaseEnergy(world, rate, { crit }); HTJEnergy.diffuseEnergy(world, alpha); HTJRadiate.radiate(world, rad); tick++; } },
    radiated() { return world.radiated || 0; },
    totalField(name) { return world.total(name); },
    maxField(name) { return world.max(name); },
    // 특정 장을 그린다(capture 가 골라 캡처). absMax>0 면 절대 색 스케일, 아니면 평균*2 상대.
    drawField(name, absMax) {
      const max = absMax > 0 ? absMax : (() => { const mn = world.total(name) / world.fields[name].length; return mn > 0 ? mn * 2 : 0; })();
      surf = HTJRender.draw(ctx, world, cam, { field: name, colormap: 'heat', max });
    },
    // 기반 무대 모드(step_0001 회귀 호환) — 'energy' 장에 데모 공(팔레트 렌더).
    reseed(N, seed) {
      mode = 'cells';
      world = HTJWorld.createWorld(N | 0);
      HTJWorld.seedBall(world, { seed: (seed >>> 0) });
      tick = 0; surf = 0;
    },
    setCamera(c) { Object.assign(cam, c); },
    render, get surf() { return surf; },
  };

  applyStep();   // 헤더·설명·컨트롤 가시성 + 장면 초기화
  resize();
})();
</script>
</body>
</html>
