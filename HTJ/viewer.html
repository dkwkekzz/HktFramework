<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTJ Viewer — 에너지 흐름(열역학 제2법칙)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0c10; color: #c8d0dc; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display: flex; height: 100%; }
  #panel { width: 248px; flex: none; padding: 14px; border-right: 1px solid #1c2230; overflow: auto; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #cv { display: block; width: 100%; height: 100%; }
  h1 { font-size: 14px; margin: 0 0 2px; color: #e6ecf5; }
  .sub { color: #6b778a; margin: 0 0 14px; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { width: 72px; color: #8a96a8; }
  button { background: #18202e; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 5px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #212c3e; }
  button.primary { background: #1f3a5c; border-color: #2f5688; }
  input[type=number] { width: 64px; background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  select { background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .stat { color: #8a96a8; font-size: 11px; margin-top: 12px; border-top: 1px solid #1c2230; padding-top: 10px; }
  .stat b { color: #c8d0dc; font-weight: 600; }
  .note { color: #5b6678; font-size: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1 id="title">HTJ — 뷰어</h1>
    <p class="sub" id="sub">step 선택</p>

    <div class="row"><label>step</label><select id="step"></select></div>
    <div class="row"><label>N (격자)</label><input id="N" type="number" min="4" max="48" step="1" value="24" /></div>

    <div id="dyn">
      <div class="row"><label>α (확산율)</label><input id="alpha" type="number" min="0" max="0.166" step="0.01" value="0.14" /></div>
      <div class="row" id="row-rate"><label>방출율</label><input id="rate" type="number" min="0" max="1" step="0.005" value="0.02" /></div>
      <div class="row" id="row-crit"><label>점화 임계</label><input id="crit" type="number" min="0" step="50" value="300" /></div>
      <div class="row" id="row-radiate"><label>복사율(sink)</label><input id="radiate" type="number" min="0" max="1" step="0.02" value="0.2" /></div>
      <div class="row" id="row-pressure"><label>반발(K)</label><input id="kpress" type="number" min="0" max="2" step="0.01" value="0.2" /></div>
      <div class="row" id="row-thermp"><label>열압력(Kth)</label><input id="kthermo" type="number" min="0" max="2" step="0.05" value="0.5" /></div>
      <div class="row" id="row-visc"><label>점성(Kvisc)</label><input id="kvisc" type="number" min="0" max="4" step="0.1" value="0.8" /></div>
      <div class="row" id="row-fusion"><label>발열률(rate)</label><input id="frate" type="number" min="0" max="5" step="0.5" value="2" /></div>
      <div class="row"><label>스텝/프레임</label><input id="speed" type="number" min="1" max="50" step="1" value="6" /></div>
      <div class="row"><label>배속</label>
        <select id="speedMult">
          <option value="0.25">×0.25</option>
          <option value="0.5">×0.5</option>
          <option value="1" selected>×1</option>
          <option value="2">×2</option>
          <option value="4">×4</option>
          <option value="8">×8</option>
          <option value="16">×16</option>
        </select>
      </div>
      <div class="row"><label>장(field)</label><select id="brushField"></select></div>
      <div class="row"><label>붓 반경</label><input id="brushR" type="number" min="0" max="6" step="1" value="1" /></div>
      <div class="row"><label>열량</label><input id="brushAmt" type="number" min="1" step="50" value="800" /></div>
      <div class="row">
        <button id="play" class="primary">▶ 흐름</button>
        <button id="step-btn">스텝</button>
      </div>
    </div>

    <div class="row"><label>색 기준</label>
      <select id="colorScale"><option value="relative">상대(평균)</option><option value="absolute">절대(고정)</option></select>
    </div>
    <div class="row" id="row-colormax"><label>색 최대E</label><input id="colorMax" type="number" min="0" step="50" value="1000" /></div>

    <div class="row">
      <button id="reset">리셋</button>
      <button id="capture">📷 캡처(PNG)</button>
    </div>

    <div class="stat">
      <div>tick: <b id="s-tick">0</b></div>
      <div id="s-pot-row">잠재력: <b id="s-pot">0</b> <span style="color:#5b6678">(↓ 풀림)</span></div>
      <div>총 에너지: <b id="s-total">0</b> <span style="color:#5b6678">(↑ 탄생)</span></div>
      <div id="s-rad-row">복사 누적: <b id="s-rad">0</b> <span style="color:#5b6678">(→ 우주)</span></div>
      <div>엔트로피: <b id="s-entropy">0</b> nats <span style="color:#5b6678">(↑)</span></div>
      <div>점유 셀: <b id="s-occ">0</b> / <span id="s-cells">0</span></div>
      <div>최대 E: <b id="s-max">0</b></div>
    </div>
    <p class="note" id="note">드래그=회전 · 휠=줌 · 우드래그=이동.</p>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<!-- 세계(법칙)는 engine/, 그리기는 viewer/ — viewer 는 engine 을 *읽기만* 한다(단방향). -->
<script src="engine/htj-world.js"></script>
<script src="engine/htj-energy.js"></script>
<script src="engine/htj-potential.js"></script>
<script src="engine/htj-radiate.js"></script>
<script src="engine/htj-inertia.js"></script>
<script src="engine/htj-gravity.js"></script>
<script src="engine/htj-pressure.js"></script>
<script src="engine/htj-thermal.js"></script>
<script src="engine/htj-viscosity.js"></script>
<script src="engine/htj-fusion.js"></script>
<script src="engine/htj-cooling.js"></script>
<script src="engine/htj-cluster.js"></script>
<script src="engine/htj-sparse.js"></script>
<script src="engine/htj-vacuum.js"></script>
<script src="engine/htj-activity.js"></script>
<script src="engine/htj-promote.js"></script>
<script src="engine/htj-entity.js"></script>
<script src="engine/htj-hybrid.js"></script>
<script src="engine/htj-sph.js"></script>
<script src="engine/htj-shapedna.js"></script>
<script src="engine/htj-terrain.js"></script>
<script src="viewer/htj-render.js"></script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const cam = HTJRender.defaultCamera();
  let world = null, tick = 0, surf = 0, playing = false, mode = 'energy';

  // ── step 레지스트리 — 각 step 의 장면(초기화)·렌더 모드·동역학 유무·설명 ──
  //   드롭다운으로 선택해 step 별 세계를 본다. 동역학 없는 step 은 인터랙션 컨트롤을 숨긴다.
  const STEPS = {
    '0001': {
      label: 'step_0001 — 기반 무대', title: 'HTJ — 기반 무대', sub: '격자 + 장(정적 데모 공)',
      mode: 'cells', dynamics: false,
      init(w) { HTJWorld.seedBall(w, { seed: 42 }); },       // 정물 공(법칙 없음)
      note: '드래그=회전 · 휠=줌 · 우드래그=이동.<br />법칙(동역학)은 없다 — 격자와 그 관찰 가능성만 세운 무대. 가운데 정물 공을 3D voxel 로 본다.'
    },
    '0002': {
      label: 'step_0002 — 에너지 흐름', title: 'HTJ — 에너지 흐름', sub: '열역학 제2법칙 = 확산',
      mode: 'energy', dynamics: true, release: false,
      defaults: { alpha: 0.14, view: 'energy' },
      init(w) { HTJEnergy.seedHotSpot(w, { E0: 1000, half: 0 }); },     // 가운데 단일 열원(클릭으로 더 둘 수 있다)
      advance(w, p) { HTJEnergy.diffuseEnergy(w, p.alpha); },     // 법칙: 확산만
      note: '<b>클릭</b>=열 주입(선택한 장) · 드래그=회전 · 휠=줌 · 우드래그=이동.<br />가운데 열원이 하나 놓여 있다 — <b>▶ 흐름</b>에서 확산된다(클릭으로 더 둘 수 있다). 총량 *보존*·엔트로피 *증가* → 퍼져 균일(열적 죽음). 색=평균 대비 밀도(청→적).'
    },
    '0003': {
      label: 'step_0003 — 에너지의 탄생', title: 'HTJ — 에너지의 탄생', sub: '잠재력 방출(potential→energy)',
      mode: 'energy', dynamics: true, release: true,
      defaults: { alpha: 0.14, rate: 0.02, view: 'potential' },
      init(w) { HTJPotential.seedPotential(w, { P0: 1000, r: w.N * 0.18 }); },  // 중앙 잠재력 저장고(에너지=0)
      advance(w, p) { HTJPotential.releaseEnergy(w, p.rate); HTJEnergy.diffuseEnergy(w, p.alpha); },  // 법칙: 방출+확산
      note: '시작 화면 = <b>potential</b> 장(빨간 잠재력 저장고). ▶ 흐름을 누르면 저장고가 *풀리며 줄어든다*(↓).<br /><b>장(field)</b>을 energy 로 바꾸면 거기서 *태어난* 에너지(↑)가 확산되는 게 보인다. 잠재력↓+에너지↑ 이지만 *총합 보존* — 생성은 형태 변환일 뿐.'
    },
    '0004': {
      label: 'step_0004 — 별의 점화', title: 'HTJ — 별의 점화', sub: '임계 방출(밀도 게이트)',
      mode: 'energy', dynamics: true, release: true, ignite: true,
      defaults: { alpha: 0, rate: 0.05, crit: 300, view: 'potential', autoEnergyView: true },
      init(w) { HTJPotential.seedStarField(w, { core: 1000, background: 50, r: w.N * 0.25 }); },  // 별밭(코어+가스)
      advance(w, p) { HTJPotential.releaseEnergy(w, p.rate, { crit: p.crit }); HTJEnergy.diffuseEnergy(w, p.alpha); },  // 법칙: 임계 방출+확산
      note: '시작 화면 = <b>potential</b>(연료 분포: 밀집한 코어 + 옅은 가스). <b>▶ 흐름</b>을 누르면 화면이 <b>energy</b> 로 바뀌며 *임계 넘긴 코어만* 빨갛게 점화한다(=별) — 가스는 어둡다.<br />기본 α=0(확산 꺼짐)이라 별이 또렷이 보인다. <b>α</b>를 올리면 별빛이 가스로 퍼지고, <b>점화 임계</b>를 올리면 별이 작아지고/안 켜진다 → "별 = 임계 위 영역".'
    },
    '0005': {
      label: 'step_0005 — 빛나는 별', title: 'HTJ — 빛나는 별', sub: '경계 복사(sink) → 영구 그래디언트',
      mode: 'energy', dynamics: true, release: true, ignite: true, radiate: true,
      defaults: { alpha: 0.14, rate: 0.02, crit: 300, radiate: 0.2, colorScale: 'absolute', colorMax: 4000, view: 'potential', autoEnergyView: true },
      init(w) { HTJPotential.seedStarField(w, { core: 1e7, background: 0, r: w.N * 0.16 }); },  // 큰 연료 저장고
      advance(w, p) { HTJPotential.releaseEnergy(w, p.rate, { crit: p.crit }); HTJEnergy.diffuseEnergy(w, p.alpha); HTJRadiate.radiate(w, p.radiate); },  // 법칙: 점화+확산+복사
      note: '시작 화면 = <b>potential</b>(큰 연료 저장고). <b>▶ 흐름</b>을 누르면 화면이 <b>energy</b> 로 바뀐다 — 코어가 *계속* 점화(=별) → 에너지가 확산으로 흐르고 <b>경계에서 우주로 빠져나간다</b>(sink). 중심은 *꾸준히 밝고* 바깥은 어둡다 = 영구 그래디언트.<br /><b>색 기준=절대</b>라 에너지가 빠져나가며 *전체가 어두워지는 것*도 보인다. 복사율을 0 으로 하면 닫힌 상자처럼 균일해진다(안 빛남).'
    },
    '0006': {
      label: 'step_0006 — 관성', title: 'HTJ — 관성', sub: '질량(=에너지)의 탄도 이류(뉴턴 1법칙)',
      mode: 'energy', dynamics: true,
      defaults: { colorScale: 'relative', view: 'energy' },
      // energy = 질량(E=mc²). 균일 속도를 실은 덩어리(한쪽에서 출발) — 힘 없이 직진.
      init(w) { HTJInertia.seedMovingBlob(w, { cx: w.N * 0.25, vx: 0.5, M0: 1000, sigma: w.N * 0.1 }); },
      advance(w) { HTJInertia.advect(w, 0.5); },   // 법칙: 탄도 이류(힘 없음 → 등속 직진)
      note: '이제 <b>energy = 질량</b>(E=mc²). 덩어리에 *운동량*을 실었다. <b>▶ 흐름</b>: 확산처럼 퍼지는 게 아니라 <b>통째로 직진</b>한다 — 힘이 없으니 *제 속도를 지킨 채* 등속(뉴턴 1법칙). 질량·운동량 *보존*, 질량중심이 등속 이동. 벽(닫힌 경계)에 닿으면 쌓인다. 다음 step 에서 이 운동량을 *질량이 만든 퍼텐셜*로 가속하면 중력이 창발한다.'
    },
    '0007': {
      label: 'step_0007 — 보편중력', title: 'HTJ — 보편중력', sub: '자기중력(Poisson) → 질량이 뭉친다',
      mode: 'energy', dynamics: true,
      defaults: { colorScale: 'relative', view: 'energy' },
      // 넓게 퍼진 질량 구름 — 자기중력이 *수축*시킨다(확산의 거울상).
      init(w) { HTJGravity.seedTwoMasses(w, { sep: 0, sigma: w.N * 0.16, M0: 1000 }); },
      advance(w) { HTJGravity.applyGravity(w, 0.3, { G: 0.15, iters: 50 }); HTJInertia.advect(w, 0.3); },  // 법칙: 중력 가속 + 이류
      note: '<b>모든 질량이 모든 질량을 끌어당긴다</b>(만유인력). 질량(=energy)이 퍼텐셜 Φ(∇²Φ=ρ−ρ̄)를 만들고, 그 기울기가 운동량을 가속한다. <b>▶ 흐름</b>: 넓게 퍼진 구름이 *스스로 수축*해 고밀 코어로 뭉친다 — <b>확산(0002)의 정확한 거울상</b>(퍼짐↔모임). 균일은 무력(대비만 끌림), 질량·운동량 보존. *반발이 없어* 끝내 한 점으로 붕괴한다 — 다음 step 의 단거리 반발/포화가 이걸 멈춰 지속 입자·접촉을 만든다.'
    },
    '0008': {
      label: 'step_0008 — 단거리 반발', title: 'HTJ — 단거리 반발(압력)', sub: '중력 ↔ 압력 균형 → 유한 크기 코어',
      mode: 'energy', dynamics: true, pressure: true,
      defaults: { colorScale: 'relative', view: 'energy', kpress: 0.2 },
      // 과밀 구름 — 중력은 모으고, 압력 P=K·ρ^γ 은 민다. 둘이 균형 잡는 밀도에서 *유한 코어*가 선다.
      init(w) { HTJPressure.seedBlob(w, { sigma: w.N * 0.16, M0: 1000 }); },
      advance(w, p) { HTJGravity.applyGravity(w, 0.3, { G: 0.2, iters: 50 }); HTJPressure.applyPressure(w, 0.3, { K: p.kpress, gamma: 2 }); HTJInertia.advect(w, 0.3); },  // 법칙: 중력 + 반발 + 이류
      note: '<b>밀집을 거부하는 단거리 반발(압력)</b> — 중력의 거울짝. 압력 P=K·ρ^γ(γ>4/3)의 기울기가 운동량을 *밀어내* 중력 붕괴를 멈춘다. <b>▶ 흐름</b>: 구름이 수축하다 *유한 크기에서 멈춰* 퍼진 코어로 선다(중력↓ ↔ 반발↑ 균형) = <b>지속하는 덩어리(입자·물체의 씨앗)</b>. <b>반발(K)</b>을 0 으로 내리면 step_0007 처럼 한 점으로 붕괴(곧 발산)하고, 키우면 코어가 더 크고 옅게 부푼다. 균일 무력·질량·운동량 보존.'
    },
    '0009': {
      label: 'step_0009 — 내부에너지(온도)', title: 'HTJ — 내부에너지(온도)', sub: '압축은 데우고 팽창은 식힌다(열역학 제1법칙)',
      mode: 'energy', dynamics: true, pressure: true,
      defaults: { colorScale: 'relative', view: 'temperature', kpress: 0.2 },
      // 균일 온도 구름 — 중력↔반발이 수축시키면 *코어가 압축→가열*(T=u/ρ↑) = 뜨거운 코어가 창발.
      init(w) { HTJThermal.seedWarmBlob(w, { sigma: w.N * 0.16, M0: 1000, T0: 1 }); updateTemperature(w); },
      advance(w, p) { HTJGravity.applyGravity(w, 0.3, { G: 0.2, iters: 50 }); HTJPressure.applyPressure(w, 0.3, { K: p.kpress, gamma: 2 }); HTJInertia.advect(w, 0.3, { scalars: ['therm'] }); HTJThermal.applyHeating(w, 0.3, { gamma: 5 / 3 }); updateTemperature(w); },  // 법칙: 중력 + 반발 + 이류(+내부E 수송) + 압축 가열
      note: '이제 <b>물질은 온도를 가진다</b> — 새 장 <b>내부에너지 u</b>(온도 T=u/ρ). <b>압축 가열</b> 법칙: 모이는(수렴) 흐름은 *데우고*, 퍼지는 흐름은 *식힌다*(열역학 제1법칙 dU=−P dV → 단열 T∝ρ^(γ−1)). <b>▶ 흐름</b>: 구름이 중력으로 수축하며 코어가 <b>압축→가열</b>돼 *뜨거운 코어*가 창발한다(시작 화면 = temperature 장, 처음엔 균일 파랑 → 코어가 빨갛게). <b>장(field)</b>을 therm/energy 로 바꿔 비교해 보라. <b>반발(K)</b>로 수축 세기를 바꾸면 가열량도 바뀐다. *아직* 열압력이 되밀진 않는다(수동 온도) — 다음 step 에서 P_th 가 운동량을 밀어 별이 *열압력으로* 선다.'
    },
    '0010': {
      label: 'step_0010 — 열압력 되먹임', title: 'HTJ — 열압력 되먹임(능동 압력)', sub: '열이 물질을 민다 — KE↔내부E 가역 교환',
      mode: 'energy', dynamics: true, thermP: true,
      defaults: { colorScale: 'relative', view: 'energy', kthermo: 0.5 },
      // 작고 뜨거운 압축 덩어리 — 열압력 P_th=Kth(γ−1)u 가 *능동적으로* 밀어 팽창(내부E→운동E).
      init(w) { HTJThermal.seedWarmBlob(w, { sigma: w.N * 0.10, M0: 1000, T0: 3 }); updateTemperature(w); },

      note: '이제 온도가 *능동*이다 — <b>열압력 P_th=(γ−1)u 가 운동량을 되민다</b>(g←g−dt·∇P_th), 그 한 일은 내부에너지로 회계된다(PdV) → <b>KE↔내부E 가역 교환</b>(총E 보존). <b>▶ 흐름</b>: 작고 뜨거운 덩어리가 *제 열로 밀려* 팽창한다(내부E→운동E, 식으며 퍼짐). <b>열압력(Kth)</b>을 0 으로 내리면 안 밀린다(불활성). 이로써 step_0007 의 "사라진 에너지"가 *열로* 닫힌다(보존). 단 이 교환은 *가역*(단열)이라 진동을 **감쇠하진 않는다** — 별이 *정착*하려면 비가역 소산(충격/점성 가열·복사 냉각)이 필요하다(다음 step). <b>장(field)</b>을 therm/temperature 로 바꿔 식는 걸 보라.'
    },
    '0011': {
      label: 'step_0011 — 비가역 소산(점성)', title: 'HTJ — 비가역 소산(인공 점성)', sub: '진동이 정착한다 — bulk KE → 열 일방 전환',
      mode: 'energy', dynamics: true, thermP: true, visc: true,
      defaults: { colorScale: 'relative', view: 'energy', kthermo: 0.4, kvisc: 0.8 },
      // 정지 뜨거운 덩어리 — 중력↔열압력으로 진동(breathing), 인공 점성이 bulk KE 를 열로 일방 빼 *정착*시킨다.
      init(w) { HTJThermal.seedWarmBlob(w, { sigma: w.N * 0.16, M0: 1000, T0: 1 }); updateTemperature(w); },

      note: 'step_0010 의 가역 열압력은 진동을 *못 멈춘다*(무감쇠 — 빌려준 운동E를 그대로 돌려받음). 이 step 은 <b>인공 bulk 점성 q=Kvisc·ρ·(∇·v)²</b>(압축 ∇·v&lt;0 에서만)을 더한다 — 압축 흐름을 감속(g←g−dt·∇q)하고 그 일을 열로 적재(u←u−dt·q·∇·v). 열압력과 구조는 같되 <b>q 가 압축에서만 켜져 *식히는 법이 없다*</b> → <b>운동E가 열로 *일방* 빠진다</b>(엔트로피↑=비가역) → 진동 감쇠. <b>▶ 흐름</b>: 뜨거운 덩어리가 중력↔열압력으로 출렁이다, 점성이 그 운동E를 열로 떼어가 *코어가 가만히 선다*(정착). <b>점성(Kvisc)</b>을 0 으로 내리면 영영 출렁인다(무감쇠 — step_0008 의 CFL 발산으로 가는 길). 이것이 별을 *정착*시키는 비가역 부품이다.'
    },
    '0012': {
      label: 'step_0012 — 내부 발열(별의 점화)', title: 'HTJ — 내부 발열(별의 점화)', sub: '같은 법칙에서 별과 돌이 임계로 갈린다',
      mode: 'energy', dynamics: true, pressure: true, thermP: true, visc: true, fusion: true,
      defaults: { colorScale: 'relative', view: 'temperature', kpress: 0.12, kthermo: 0.3, kvisc: 0.6, frate: 2 },
      // 무거운 덩어리 — 중력 압축으로 ρ·T 가 임계를 넘어 점화 → 자기발열하는 *별*. 발열률 0 으로 내리면 *돌*.
      init(w) { HTJThermal.seedWarmBlob(w, { sigma: w.N * 0.16, M0: Math.max(2500, w.N * w.N * w.N * 0.5), T0: 1 }); updateTemperature(w); },
      advance(w, p) {
        HTJGravity.applyGravity(w, 0.2, { G: 0.15, iters: 40 });                  // 끌어모음(압축 가열의 동력)
        HTJPressure.applyPressure(w, 0.2, { K: p.kpress, gamma: 2 });             // 단거리 반발(점 붕괴 방지)
        HTJThermal.applyThermalPressure(w, 0.2, { Kth: p.kthermo, gamma: 5 / 3 });// 열압력(압축 가열 PdV)
        HTJViscosity.applyViscosity(w, 0.2, { Kvisc: p.kvisc });                  // 비가역 소산(정착)
        HTJFusion.applyFusion(w, 0.2, { rate: p.frate, rhoCrit: 6, tCrit: 3 });   // 내부 발열(점화): 무겁고 뜨거운 코어만
        HTJInertia.advect(w, 0.2, { scalars: ['therm'] });
        updateTemperature(w);
      },
      note: '드디어 <b>별</b>이다. 새 법칙 <b>내부 발열 applyFusion</b>: 코어가 충분히 무겁고 뜨거우면(ρ≥ρ_crit ∧ T≥T_crit) 스스로 열을 만든다 — <b>u ← u + dt·rate·ρ</b>(핵융합 점화). <b>질량(energy)은 안 건드린다</b> → 별이 빛내도 질량 보존(step_0005 의 질량 소실 모순을 닫는다). <b>▶ 흐름</b>: 무거운 덩어리가 중력으로 압축·가열되다 임계를 넘어 <b>점화 → 자기발열하는 뜨거운 별</b>(장(field)을 temperature 로 보면 코어가 타오른다). <b>발열률(rate)</b>을 0 으로 내리면 점화가 꺼져 *차가운 돌*이 된다. 핵심: <b>별과 돌을 따로 만들지 않았다</b> — 같은 법칙에 질량(또는 발열률)만 달리하면 하나는 별, 하나는 돌이 된다(author 안 함). N 을 줄여 가벼운 덩어리로 만들면 점화 임계를 못 넘어 돌로 남는다.'
    },
    '0013': {
      label: 'step_0013 — 복사 냉각(빛으로 식는 별)', title: 'HTJ — 복사 냉각(빛으로 식는 별)', sub: '식어야 별이 뭉친 채 빛난다 — 안 식으면 제 열로 흩어진다',
      mode: 'energy', dynamics: true, pressure: true, thermP: true, visc: true, fusion: true, radiate: true,
      defaults: { colorScale: 'relative', view: 'temperature', kpress: 0.12, kthermo: 0.3, kvisc: 0.6, frate: 2, radiate: 0.06 },
      // 무거운 별 — 발열(0012)에 *복사 냉각*을 더한다. 냉각율(복사 슬라이더)을 0 으로 내리면 과열로 부풀어 흩어진다(=0012).
      init(w) { HTJThermal.seedWarmBlob(w, { sigma: w.N * 0.16, M0: Math.max(2500, w.N * w.N * w.N * 0.5), T0: 1 }); updateTemperature(w); },
      advance(w, p) {
        HTJGravity.applyGravity(w, 0.2, { G: 0.15, iters: 40 });                  // 끌어모음(압축 가열의 동력)
        HTJPressure.applyPressure(w, 0.2, { K: p.kpress, gamma: 2 });             // 단거리 반발(점 붕괴 방지)
        HTJThermal.applyThermalPressure(w, 0.2, { Kth: p.kthermo, gamma: 5 / 3 });// 열압력(압축 가열 PdV)
        HTJViscosity.applyViscosity(w, 0.2, { Kvisc: p.kvisc });                  // 비가역 소산(정착)
        HTJFusion.applyFusion(w, 0.2, { rate: p.frate, rhoCrit: 6, tCrit: 3 });   // 내부 발열(점화)
        HTJCooling.applyCooling(w, 0.2, { coolRate: p.radiate });                 // 복사 냉각(열→빛, 질량 보존)
        HTJInertia.advect(w, 0.2, { scalars: ['therm'] });
        updateTemperature(w);
      },
      note: '별이 *계속* 빛나려면 열을 내버려야 한다. 새 법칙 <b>복사 냉각 applyCooling</b>: 모든 셀이 제 열을 빛으로 방출 — <b>u ← u·(1−dt·coolRate)</b>, 빠진 열은 <b>world.radiated</b>(빛 장부)에 쌓인다. <b>질량(energy)은 안 건드린다</b> → 빛은 *열*에서 나온다(step_0005 의 질량 소실 모순을 therm 으로 옮겨 닫음, 발열의 거울짝: 발열=u source·복사=u sink). <b>▶ 흐름</b>: 별이 점화한 뒤, <b>냉각율(복사 슬라이더)</b>을 0 으로 두면 제 발열로 <b>부풀어 흩어진다</b>(=step_0012, peakρ↓). 0.06 쯤 올리면 과열을 빛으로 버려 <b>조밀하게 뭉친 채 점화를 지속</b>한다(peakρ 30×↑, 우하단 radiated 가 쌓이는 = 별이 빛난다). 발열↔복사 균형의 평형온도 <b>T*=rate/coolRate</b>(밀도 무관)에서 별이 안정적으로 빛난다 — 0012 의 무한 가열(runaway)이 닫힌다. 발열률(rate)을 0 으로 내리면 발열 없는 <b>돌</b>이 남은 열을 복사하고 *완전히 식는다*.'
    },
    '0014': {
      label: 'step_0014 — 덩어리 검출(별 → 구체)', title: 'HTJ — 덩어리 검출(안정 덩어리 → 개체/구체)', sub: '같은 별이 수천 셀이 아니라 *구체 하나*로 보인다',
      mode: 'energy', dynamics: true, pressure: true, thermP: true, visc: true, fusion: true, radiate: true,
      render: 'spheres',   // 셀 voxel 대신 검출 덩어리를 구체로 렌더

      // 0013 과 같은 별을 붕괴시키되 — *렌더*만 다르다(검출된 덩어리를 구체로). 검출은 읽기 전용(세계 불변).

      note: '<b>관찰 연산자</b>(동역학 법칙 아님): 안정된 덩어리를 <b>개체로 환원</b>한다 — { 중심(CoM)·질량 Σρ·반지름(점유 볼륨 등가 구)·평균온도 Σu/Σρ·정점밀도 }. 검출 = ρ&gt;eps 셀의 <b>연결 성분</b>(6-이웃 flood fill) — 떨어진 두 별은 두 개체, 붙으면 한 개체. <b>▶ 무엇이 보이나</b>: 0013 과 똑같은 별이 붕괴하지만, 화면엔 수천 voxel 이 아니라 <b>구체 하나</b>가 뜬다 — 같은 세계의 다른 *표현*이다(검출은 세계를 안 건드린다, 읽기 전용=회귀 0). <b>왜 중요한가</b>(design/scalability.md §0): ① <b>렌더</b> — 수만 셀 대신 구체 1개로 그린다(보여지는 단위=덩어리). ② <b>시뮬</b> — (다음 step) 같은 환원 산출물을 *승격*해 덩어리를 개체 단위로 굴린다(비용=흐르는 물질만). 질량은 개체로 <b>정확히 보존</b>되어 위층으로 상속된다(Σ개체질량=Σρ). 이 step 은 ①(+검출 기계)까지 — ②(승격)의 토대.'

    // ── 확장성 인프라 통합 오버레이(step_0016~0025) — 같은 별 위에 8³ 블록 상태를 본다 ──
    //   0016~0025 는 거동이 0014 와 (거의) 같은 *확장성 인프라*라 개별 장면이 없었다(드롭다운 0014 까지).
    //   이 장면은 그 인프라가 *실제로 무엇을 하는지*를 한 화면에서 보여준다: 진공 희소화로 빈 블록이 사라지고
    //   (0016/0017/0024), 활성 집합이 도는 블록을 추리고(0018~0022), 활동도 추적기가 *변화 멎은* 블록을
    //   동결(쉼)로 가른다(0025). 법칙은 0014 와 동일하게 돌리고(거동 동일), 희소/활성/동결 층은 *관찰자*로 얹어
    //   와이어프레임으로 덧그린다 — 주황=도는(활성) 블록, 파랑=쉬는(동결) 블록, 빈 블록은 안 그림(희소화).
    'scal': {
      label: 'step_0016~0025 — 확장성 오버레이(활성/동결 블록)', title: 'HTJ — 확장성 인프라 오버레이(S2·S3)',
      sub: '같은 별 붕괴 위에 8³ 블록 상태: 주황=도는(활성)·파랑=쉬는(동결). 블록은 거의 안 비워짐(=0024 천장)',
      mode: 'energy', dynamics: true, pressure: true, thermP: true, visc: true, fusion: true, radiate: true,
      render: 'scalability',
      defaults: { colorScale: 'relative', view: 'energy', kpress: 0.12, kthermo: 0.3, kvisc: 0.6, frate: 2, radiate: 0.06 },
      init(w) {
        HTJThermal.seedWarmBlob(w, { sigma: w.N * 0.16, M0: Math.max(2500, w.N * w.N * w.N * 0.5), T0: 1 });
        for (const nm of ['mom_x', 'mom_y', 'mom_z']) w.fields[nm] || w.addField(nm, { type: Float64Array });
        updateTemperature(w);
        const bs = 8;
        w.__scal = {
          bs, hold: 3, thr: 0.05,
          set: HTJSparse.createActiveSet(w.N, bs).rebuildFromField(w.fields.energy),
          tracker: HTJActivity.createActivityTracker(w.N, bs)
        };
        w.__scal.tracker.measure(w.fields.energy, w.__scal.set.origins(), { threshold: w.__scal.thr });  // 첫 스냅샷
      },
      advance(w, p) {
        const S = w.__scal, bs = S.bs;
        // 법칙은 0014 와 동일(조밀) — 거동을 안 바꾼다(오버레이는 관찰자).
        HTJGravity.applyGravity(w, 0.2, { G: 0.15, iters: 40 });
        HTJPressure.applyPressure(w, 0.2, { K: p.kpress, gamma: 2 });
        HTJThermal.applyThermalPressure(w, 0.2, { Kth: p.kthermo, gamma: 5 / 3 });
        HTJViscosity.applyViscosity(w, 0.2, { Kvisc: p.kvisc });
        HTJFusion.applyFusion(w, 0.2, { rate: p.frate, rhoCrit: 6, tCrit: 3 });
        HTJCooling.applyCooling(w, 0.2, { coolRate: p.radiate });
        HTJInertia.advect(w, 0.2, { scalars: ['therm'] });
        HTJVacuum.applyVacuum(w, { eps: 1e-2, scalars: ['mom_x', 'mom_y', 'mom_z', 'therm'] });  // 0017/0024 희소화
        // 관찰자 층: 활성 집합 갱신(0018~0022) + 활동도/동결 측정(0025).
        S.set.rebuildFromField(w.fields.energy);
        S.tracker.measure(w.fields.energy, S.set.origins(), { threshold: S.thr });
        updateTemperature(w);
      },
      note: '<b>확장성 인프라(S2·S3) 통합 오버레이</b> — step_0016~0025 는 거동이 0014 와 (거의) 같은 *인프라*라 개별 장면이 없었다. 여기선 그 인프라가 <b>실제로 무엇을 하는지</b>를 한 화면에서 본다. 법칙은 0014 와 동일하게 돌리고(거동 동일·질량 보존), 희소·활성·동결 층을 <b>관찰자</b>로 얹어 8³ 블록을 와이어프레임으로 덧그린다: <span style="color:#fa963c">주황=도는(활성) 블록</span> · <span style="color:#4a8cfa">파랑=쉬는(동결) 블록</span>. <b>▶ 무엇이 보이나</b>: ① 처음 잔잔할 땐 많은 블록이 파랑(동결)이다가, ② 별이 붕괴하며 전부 깨어 주황(활성)이 되고, ③ 다시 정착하면 출렁임이 멎은 블록부터 파랑으로 굳는다(<b>0025</b> 동결=시간 LOD/안정 판정). 주황 블록이 <b>법칙이 실제로 돌 곳</b>(0018~0022 활성 순회). <b>▶ 정직한 한계(0024 천장)</b>: 가우시안 별의 옅은 꼬리가 <b>모든 블록에 한 톨씩</b> 남아 — 진공 희소화(0016/0017/0024)를 켜도 — 통째로 *빈* 블록은 거의 안 생긴다(블록 점유 ~100%). 그래서 셀은 희소화돼도 블록 단위 절감엔 천장이 있다. <b>왜 중요한가</b>: 그 천장이 곧 다음 단계의 이유다 — 동결(파랑)=안정 신호로 <b>S5 승격</b>이 별을 격자에서 통째로 빼내 개체 1개로 굴려야 비용이 진짜 준다.'
    },

    // ── step_0027 — 승격된 개체의 탄도 운동(자유 강체 드리프트) ──
    //   조밀한 구를 격자에서 *승격*해 개체 1개로 빼낸 뒤(격자 비움), 그 개체를 *개체-공간에서* 굴린다.
    //   힘이 없으니 제 속도(v=P/질량)를 지킨 채 등속 직진 — 개체판 뉴턴 1법칙. 격자는 한 칸도 안 돈다(위치
    //   몇 숫자만 적분). 토러스 wrap. 구체는 drawClumps 로 그린다(개체 = {cx,cy,cz,radius,peak} 형태).
    '0027': {
      label: 'step_0027 — 개체 탄도 운동(승격된 별의 드리프트)', title: 'HTJ — 개체 탄도 운동(자유 강체 드리프트)',
      sub: '승격된 개체가 격자 순회 없이 제 속도로 등속 직진(개체판 뉴턴 1법칙) — 토러스 wrap',
      mode: 'energy', dynamics: true, render: 'entity',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        for (const nm of ['mom_x', 'mom_y', 'mom_z']) w.fields[nm] || w.addField(nm, { type: Float64Array });
        w.fields.therm || w.addField('therm');
        // 조밀한 균일 구(반지름 ~N/8) + bulk 속도 → 승격하면 그 속도로 드리프트한다.
        const N = w.N, cx0 = N * 0.2, cy0 = (N - 1) / 2, cz0 = (N - 1) / 2, rad = Math.max(2, N * 0.12), rho0 = 4, vx0 = 0.5;
        for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const dx = x - cx0, dy = y - cy0, dz = z - cz0;
          if (dx * dx + dy * dy + dz * dz <= rad * rad) { const i = (z * N + y) * N + x; w.fields.energy[i] = rho0; w.fields.mom_x[i] = rho0 * vx0; w.fields.therm[i] = rho0 * 0.5; }
        }
        // 구 전체를 한 개체로 승격(격자 비움) — 이후 격자는 안 돌고 개체만 굴린다.
        const clumps = HTJCluster.detectClumps(w, { eps: 1e-9, minCells: 2, collectCells: true });
        w.__entity = clumps.length ? HTJPromote.promote(w, clumps[0].cellList) : null;
        updateTemperature(w);
      },
      advance(w) { if (w.__entity) HTJEntity.stepEntity(w.__entity, 0.3, { N: w.N }); },  // 법칙: 자유 탄도 드리프트(힘 없음)
      note: '<b>승격된 개체를 *개체-공간에서* 굴린다</b>(S5-b 첫 단위). step_0026 이 안정 덩어리를 격자에서 빼내 개체 1개로 *환원*했다면(이관), 이 step 은 그 개체를 <b>법칙으로 움직인다</b>. 시작 시 조밀한 구를 <b>승격</b>해 격자에서 통째로 빼낸다(격자는 텅 빔 — 셀 순회 0) → 화면엔 voxel 수백 개가 아니라 <b>구체 1개</b>가 뜬다. <b>▶ 흐름</b>: 힘이 없으니 개체는 제 속도(v=운동량/질량)를 지킨 채 <b>등속 직진</b>한다(개체판 뉴턴 1법칙·step_0006 격자 advect 의 개체-공간 거울짝). 경계에 닿으면 반대편으로 <b>감긴다</b>(토러스). <b>왜 중요한가</b>(design/scalability.md §0 목적 ②): 비용이 *부피*가 아니라 *개체 수*에 묶인다 — 별 하나를 굴리는 데 수천 셀이 아니라 위치 몇 숫자만 적분한다(O(개체)). 질량·운동량·에너지는 드리프트 내내 *정확 보존*(위치만 변함). <b>정직한 한계</b>: 아직 *힘이 없다*(자유 드리프트뿐) — 중력 가속(개체에 작용)·각운동량 보존 회전(스핀)·개체끼리 상호작용·자동 트리거(동결→승격)는 후속 step.'
    },

    // ── step_0028 — 개체간 중력(직접 합산 N-body) ──
    //   두 개체를 승격해 격자에서 빼낸 뒤(격자 텅 빔), 개체끼리 끌어당기게 한다 — 자유 직진(0027)이 *휘는
    //   궤적*이 된다. step_0007 격자 자기중력의 개체-공간 거울짝. 쌍힘 equal-opposite → 순 운동량 정확 보존.
    '0028': {
      label: 'step_0028 — 개체간 중력(두 별이 끌어 휜다)', title: 'HTJ — 개체간 중력(직접 합산 N-body)',
      sub: '승격된 개체끼리 서로 끌어 *휘는 궤적* — 자유 직진(0027)의 다음, step_0007 의 개체-공간 거울짝',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        for (const nm of ['mom_x', 'mom_y', 'mom_z']) w.fields[nm] || w.addField(nm, { type: Float64Array });
        w.fields.therm || w.addField('therm');
        const N = w.N, c = (N - 1) / 2, sep = N * 0.28, rad = Math.max(2, N * 0.1), rho0 = 4, vt = 0.45;
        // 두 조밀 구(접선 속도 ±vt) — 승격해 개체 2개로. 서로 끌려 곡선으로 감긴다.
        const seed = (cx, cy, vy) => {
          const cells = [];
          for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
            const dx = x - cx, dy = y - cy, dz = z - c;
            if (dx * dx + dy * dy + dz * dz <= rad * rad) { const i = (z * N + y) * N + x; w.fields.energy[i] = rho0; w.fields.mom_y[i] = rho0 * vy; w.fields.therm[i] = rho0 * 0.5; cells.push(i); }
          }
          return HTJPromote.promote(w, cells);
        };
        w.__entities = [seed(c - sep, c, vt), seed(c + sep, c, -vt)];
        w.__gopt = { G: 1.2, soft: Math.max(1.5, N * 0.08) };
        updateTemperature(w);
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.05, w.__gopt);  // 개체간 중력(휨)
        HTJEntity.stepEntities(w.__entities, 0.05, { N: w.N });      // 위치 적분(토러스)
      },
      note: '<b>승격된 개체끼리 중력으로 끌어당긴다</b>(S5-b 둘째 단위). 0027 이 개체를 *힘 없이* 직진시켰다면, 이 step 은 <b>개체간 중력</b>을 더한다 — 쌍마다 F=G·m_i·m_j·r̂/(r²+soft²) 로 서로 끌어, <b>자유 직진이 휘는 궤적</b>이 된다(step_0007 격자 자기중력의 *개체-공간* 거울짝, 격자 보간 없이 개체끼리 직접 합산). <b>▶ 흐름</b>: 두 별(승격된 구체)이 격자에서 빠진 텅 빈 공간에서 서로 끌려 <b>곡선으로 감긴다</b>. <b>왜 중요한가</b>: ① 0027 직진 + 이 step 의 휨 = 개체 동역학이 *힘 받는 강체*로 — 비용이 개체 수에 묶인 채(격자 셀 0개) 궤도·낙하가 창발. ② 쌍힘이 크기 같고 방향 반대(뉴턴 3법칙)라 <b>순 운동량이 정확히 보존</b>된다(우상단 ΣP 불변). <b>정직한 한계</b>: ① 개체↔격자 유체 결합 중력은 아직 없다(개체끼리만) — 유체 셀+개체를 한 트리에 넣는 통합 중력은 <b>S6</b>(Barnes-Hut). ② 직접 합산이라 O(개체²)·각운동량 보존 회전(스핀)·자동 트리거(동결→승격)는 후속.'
    },

    // ── step_0030 — 자동 승격(동결→개체) 하이브리드: 안정 별=개체로 시뮬·나머지 가스=유체 ──
    //   별이 붕괴·정착하면 활동도 추적기(0025)가 코어 블록을 *동결*로 판정 → autoPromoteStable 이 코어를
    //   격자에서 빼내 개체(구체)로 올린다(0026). 유체(가스)는 격자에서 계속 흐르고, 개체는 개체-공간에서 굴린다.
    //   = 사용자가 본 그 장면. 유체 voxel(draw) 위에 개체 구체(drawEntities) 오버레이.
    '0030': {
      label: 'step_0030 — 자동 승격 하이브리드(안정 별→개체)', title: 'HTJ — 자동 승격(동결→개체) 하이브리드',
      sub: '안정 별=구체 개체로 시뮬 · 나머지 가스=유체. 동결(0025)→자동 승격(0026)·격자 셀 급감',
      mode: 'energy', dynamics: true, pressure: true, thermP: true, visc: true,
      render: 'hybrid',
      defaults: { colorScale: 'relative', view: 'energy', kpress: 0.3, kthermo: 0.2, kvisc: 1.5 },
      init(w) {
        for (const nm of ['mom_x', 'mom_y', 'mom_z']) w.fields[nm] || w.addField(nm, { type: Float64Array });
        const N = w.N, cen = (N - 1) / 2, rad = Math.max(2, N * 0.11);
        // 차갑고 조밀한 중앙 별(승격 대상) + 옅은 가스 헤일로(유체로 남음).
        for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const dx = x - cen, dy = y - cen, dz = z - cen, d2 = dx * dx + dy * dy + dz * dz, i = (z * N + y) * N + x;
          if (d2 <= rad * rad) { w.fields.energy[i] = 12; w.fields.therm[i] = 2; }
          else if (d2 <= (rad + 3) * (rad + 3)) { w.fields.energy[i] = 0.5; w.fields.therm[i] = 0.2; }
        }
        updateTemperature(w);
        const bs = 8;
        w.__hyb = { bs, hold: 3, set: HTJSparse.createActiveSet(w.N, bs), tracker: HTJActivity.createActivityTracker(w.N, bs), entities: [] };
      },
      advance(w) {
        const H = w.__hyb;
        // 코어는 차갑고 조밀해 거의 안 변함 → 동결 판정 → 자동 승격(코어만·eps 높게 가스 제외).
        H.set.rebuildFromField(w.fields.energy);
        H.tracker.measure(w.fields.energy, H.set.origins(), { threshold: 0 });
        const res = HTJHybrid.autoPromoteStable(w, H.tracker, { hold: H.hold, eps: 5 });
        for (const e of res.entities) H.entities.push(e);
        // 승격 후: 가스가 개체(별)의 중력을 느껴 흘러든다(통합 중력 0033) + 가스 이류 + 개체 드리프트.
        if (H.entities.length) {
          HTJHybrid.applyUnifiedGravity(w, H.entities, { G: 0.5, soft: 3, theta: 0.5, bs: H.bs, dt: 0.2 });
          HTJInertia.advect(w, 0.2, { scalars: ['therm'] });
          HTJHybrid.stepEntities(H.entities, { dt: 0.2, G: 0, N: w.N });
        }
        updateTemperature(w);
      },
      note: '<b>자동 승격 하이브리드</b>(S5-c) — 부품을 *잇는다*: 검출(0014)·동결=안정 판정(0025)·보존 이관(0026/0029)·개체 동역학(0027/0028)·통합 중력(0033). <b>▶ 흐름</b>: 처음엔 조밀한 별(차가운 코어)이 <b>복셀</b>로 보이고 둘레에 옅은 가스가 있다. 활동도 추적기가 코어를 <b>동결</b>(안정)로 판정하면 <b>자동 승격</b>이 코어를 격자에서 통째로 빼내 <b>구체(개체)</b>로 올린다(0026 explicit 승격이 *자동 트리거*로) — 코어 자리가 비고, 둘레 <b>가스는 유체(voxel)로 남아 구체 쪽으로 흘러든다</b>(0033 개체↔유체 결합 중력). = <b>"안정 별=구체로 시뮬·나머지 가스만 유체로"</b>. <b>왜 중요한가</b>(design §0 목적 ②·§5): 레버2 가 비용을 *흐르는 유체*에만 묶는다(별=개체 1개·O(개체)). <b>정직한 한계</b>: ① 단일 자기중력 별의 *emergent 붕괴*는 거친 격자에서 미세 진동/흩어져 exact-quiet 동결이 안 걸린다 → 이 장면은 *이미 조밀한 차가운 코어*를 시드해 안정 판정을 또렷이 보인다(승격 mechanism 은 동일). 여러 별이 동시에 승격되어 *서로 상호작용*하는 장면은 <b>step_0035</b>. ② 점유 셀 위 강등(병합)은 후속.'
    },

    // ── step_0035 — 다체 하이브리드: 복셀 별들이 구체로 승격되어 서로 상호작용(가스 사라짐) ──
    //   여러 조밀 덩어리(복셀)가 동결→자동 승격으로 *전부* 구체(개체)가 되고(격자 비움=복셀 사라짐),
    //   구체들이 서로 중력으로 끌려 궤도·상호작용한다 = 사용자가 본 "복셀 안 보이고 구체로 표현되어 상호작용".
    '0035': {
      label: 'step_0035 — 다체 하이브리드(복셀→구체→상호작용)', title: 'HTJ — 다체 하이브리드: 별들이 구체로 승격되어 상호작용',
      sub: '복셀 덩어리들이 전부 구체(개체)로 승격(가스 사라짐) → 구체들이 서로 끌려 궤도·상호작용',
      mode: 'energy', dynamics: true, render: 'hybrid',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        for (const nm of ['mom_x', 'mom_y', 'mom_z']) w.fields[nm] || w.addField(nm, { type: Float64Array });
        w.fields.therm || w.addField('therm');     // 내부E 장 — 없으면 아래 therm 시드가 죽어 장면이 안 뜬다(필수)
        const N = w.N, cen = (N - 1) / 2, R = N * 0.3, rad = Math.max(2, N * 0.09), nb = 6, spin = 0.5;
        for (let k = 0; k < nb; k++) {
          const a = k * 2 * Math.PI / nb, bcx = cen + R * Math.cos(a), bcy = cen + R * Math.sin(a);
          // 클러스터 중심 둘레 접선 속도(z축 회전) → 승격 후 구체들이 궤도.
          const vx = -spin * (bcy - cen) / 8, vy = spin * (bcx - cen) / 8;
          for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
            const dx = x - bcx, dy = y - bcy, dz = z - cen;
            if (dx * dx + dy * dy + dz * dz <= rad * rad) { const i = (z * N + y) * N + x; w.fields.energy[i] = 10; w.fields.therm[i] = 3; w.fields.mom_x[i] = 10 * vx; w.fields.mom_y[i] = 10 * vy; }
          }
        }
        updateTemperature(w);
        const bs = 8;
        w.__hyb = { bs, hold: 2, set: HTJSparse.createActiveSet(w.N, bs), tracker: HTJActivity.createActivityTracker(w.N, bs), entities: [] };
      },
      advance(w) {
        const H = w.__hyb;
        // 덩어리는 정적(차갑고 조밀) → 곧 동결 → 자동 승격(복셀 사라짐).
        H.set.rebuildFromField(w.fields.energy);
        const mean = w.total('energy') / w.fields.energy.length;
        H.tracker.measure(w.fields.energy, H.set.origins(), { threshold: 0 });
        const res = HTJHybrid.autoPromoteStable(w, H.tracker, { hold: H.hold, eps: Math.max(mean * 3, 1e-9) });
        for (const e of res.entities) H.entities.push(e);
        // 승격된 구체들: 서로 중력으로 끌려 궤도·상호작용(개체 N체).
        if (H.entities.length >= 2) HTJEntity.applyEntityGravity(H.entities, 0.2, { G: 0.8, soft: 3 });
        HTJEntity.stepEntities(H.entities, 0.2, { N: w.N });
        updateTemperature(w);
      },
      note: '<b>여러 별이 구체로 승격되어 서로 상호작용</b> — 사용자가 본 그 장면. <b>▶ 흐름</b>: 처음엔 조밀한 별 덩어리들이 <b>복셀</b>로 보인다(파란 큐브). 곧 활동도 추적기가 이들을 <b>동결</b>(안정)로 판정 → <b>자동 승격</b>이 *전부* 격자에서 빼내 <b>구체(개체)</b>로 올린다 → <b>복셀이 사라지고 구체만 남는다</b>(격자 비움). 그 다음 구체들이 <b>서로 중력으로 끌려 궤도를 돌고 뭉치고 흩어진다</b>(개체 N체 동역학·0028). <b>왜 중요한가</b>(design §0 목적 ②): 존재가 수천 셀(복셀)이 아니라 <b>소수 파라미터 개체(구체)</b>로 표현·시뮬되고, 그 개체들끼리 상호작용한다 — 비용이 부피가 아니라 *개체 수*에 묶인다. 질량·운동량 정확 보존. <b>정직한 한계</b>: 접선 속도(회전)를 줘 구체들이 한 점으로 안 뭉치고 궤도하게 했다·충돌 시 자동 강등(유체 복원·0031)은 이 장면엔 안 켬(구체 상호작용을 보이려고).'
    },

    // ── step_0036 — 구체 합치기(강착): 작은 구체들이 닿으면 합쳐져 큰 구체로(수박·SW1) ──
    //   구체 세계의 첫 벽돌. 작은 구체 떼가 중력으로 끌려 닿고(느리면) 하나의 큰 구체로 붙는다 — N↓ +
    //   창발 물리(강착=행성 형성). 질량·운동량·각운동량·총E 정확 보존(궤도 L→스핀·잃은 KE→강착열).
    '0036': {
      label: 'step_0036 — 구체 합치기(강착·작은 구체→큰 구체)', title: 'HTJ — 구체 합치기(강착): 작은 구체들이 합쳐져 큰 구체로',
      sub: '작은 구체 떼가 중력으로 끌려 닿으면(느리면) 큰 구체 하나로 — 수박/강착·구체 세계 SW1. 보존: 질량·운동량·각운동량·총E',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(8, Math.round(N * N * 0.018)), spc = Math.max(3, N * 0.19), tang = 0.03;   // 접선 속도 약하게 — 세야 궤도만 돌고 안 합쳐짐(0.06→0.03: 9→1 강착)
        const ents = [];
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
          const cx = cen - spc + c * spc, cy = cen - spc + r * spc;
          const m = cells * 4, vx = -tang * (cy - cen), vy = tang * (cx - cen);   // 약한 접선 속도(궤도)
          ents.push({ cx, cy, cz: cen, mass: m, px: m * vx, py: m * vy, pz: 0, Lx: 0, Ly: 0, Lz: 0,
            KEcm: 0.5 * m * (vx * vx + vy * vy), internalKE: 0, internalE: cells * 0.5, energy: 0,
            cells, radius: eqR(cells), temp: 0, peak: 1 });
        }
        for (const e of ents) e.energy = e.KEcm + e.internalE;
        w.__entities = ents;
        w.__gopt = { G: 0.6, soft: Math.max(2, N * 0.1) };
        w.__mopt = { vstick: 0.9, pad: 0.6 };
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.3, w.__gopt);          // 서로 끌어 닿게(0028)
        HTJEntity.stepEntities(w.__entities, 0.3, { N: w.N });              // 위치 적분(토러스)
        w.__entities = HTJEntity.mergeEntities(w.__entities, w.__mopt).entities;  // 닿고 느리면 합침(강착)
      },
      note: '<b>작은 구체들이 합쳐져 큰 구체가 된다</b>(구체 세계 SW1·수박/강착). <b>▶ 흐름</b>: 처음엔 작은 구체 9개가 흩어져 있다. 서로 <b>중력으로 끌려</b>(0028) 가까워지고, <b>닿고 느리면</b>(CoM 거리 ≤ r_a+r_b+pad, 상대 속도 ≤ vstick) <b>하나의 큰 구체로 붙는다</b>(강착) — 우상단 "개체 N" 이 줄고 구체가 커진다. 빠르게 스치면 안 붙는다(임계가 author 안 하고 가른다·빠르면 깨지는 쪽은 SW3). <b>왜 중요한가</b>(design/sphere-world.md §6): ① <b>성능</b> — N 개가 적은 큰 구체로 줄어 N체 중력·충돌 비용↓(적응 LOD 의 Lagrangian 형태). ② <b>창발 물리</b> — 이게 곧 <b>강착=행성이 만들어지는 방식</b>(미행성→행성). <b>보존(합산이라 정확)</b>: 질량·운동량·각운동량(원점 기준)·총E 불변(우상단 ΣP 불변). 합칠 때 <b>궤도 각운동량이 합쳐진 구체의 스핀</b>으로 옮겨가고, 잃은 CoM 운동E 는 <b>강착열</b>(internalE↑)로 — 합쳐지면 데워진다(비탄성). <b>정직한 한계</b>: 접촉 반발·소산(겹침 거부·정착)은 아직 없다(SW2)·쪼개기(빠른 충돌→파편)는 SW3·적응 합치기 LOD 는 SW4. 여기선 *합치기 한 법칙*만.'
    },

    // ── step_0037 — 접촉(반발 + 소산): 작은 구체들이 큰 구체(지면) 위로 떨어져 쌓인다(DEM·SW2) ──
    //   합치기(SW1)가 닿고 느린 구체를 *하나로* 붙였다면, 접촉은 겹친 구체를 *합치지 않고 떠받친다* —
    //   반발(Hooke 쌍힘=운동량 보존)이 겹침을 거부해 쌓이고·표면이 서고, 감쇠(법선 소산→열)가 바운스를
    //   죽여 멈춘다. "선 캐릭터 = 중력↓ + 접촉 반발↑ 균형"의 접촉 쪽.
    '0037': {
      label: 'step_0037 — 접촉(반발+소산·구체들이 쌓여 표면)', title: 'HTJ — 접촉(반발 + 소산): 작은 구체들이 큰 구체 위로 떨어져 쌓인다',
      sub: '작은 구체들이 큰 구체(지면) 위로 떨어져 — 반발(겹침 거부)로 쌓이고·표면이 서고, 감쇠(소산→열)로 멈춘다. 구체 세계 SW2(DEM). 보존: 운동량(쌍힘)·총E(반발=가역·감쇠=KE→열 비가역)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const ents = [];
        // 지면 = 큰 구체(질량 거대 → 거의 안 움직임)·중심.
        const groundR = N * 0.26, groundCells = (4 * Math.PI / 3) * groundR * groundR * groundR;
        ents.push({ cx: cen, cy: cen, cz: cen, mass: 6e4, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: groundCells, radius: groundR, temp: 0, peak: 0.2 });
        // 작은 구체들 — 지면 둘레 껍질(반지름 shellR)에 결정론적으로 흩뿌려 떨어뜨린다.
        const small = 12, smallR = N * 0.07, smallM = 70, shellR = N * 0.40;
        const gold = Math.PI * (3 - Math.sqrt(5));                 // 황금각 — 균등 분포(결정론)
        for (let i = 0; i < small; i++) {
          const yfrac = 1 - (i + 0.5) / small * 2;                 // [1,-1) — 위→아래
          const r = Math.sqrt(Math.max(0, 1 - yfrac * yfrac)), th = gold * i;
          const dx = Math.cos(th) * r, dy = yfrac, dz = Math.sin(th) * r;
          ents.push({ cx: cen + dx * shellR, cy: cen + dy * shellR, cz: cen + dz * shellR,
            mass: smallM, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
            KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: (4 * Math.PI / 3) * smallR * smallR * smallR,
            radius: smallR, temp: 0, peak: 1 });
        }
        w.__entities = ents;
        w.__gopt = { G: 8e-4, soft: Math.max(2, N * 0.08) };       // 지면이 작은 구체를 끈다(부드럽게)
        w.__copt = { k: 12, cDamp: 40 };                          // 반발(떠받침) + 강한 감쇠(빨리 멈춤)
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.25, w.__gopt);   // 중력↓ — 지면 쪽으로(0028)
        HTJEntity.applyEntityContact(w.__entities, 0.25, w.__copt);   // 접촉↑ — 겹침 거부(반발) + 감쇠(소산→열)
        HTJEntity.stepEntities(w.__entities, 0.25);                   // 위치 적분(자유 공간·중력이 가둠)
      },
      note: '<b>작은 구체들이 큰 구체(지면) 위로 떨어져 쌓여 표면을 이룬다</b>(구체 세계 SW2·DEM). <b>▶ 흐름</b>: 중앙에 큰 구체(지면)가 있고, 둘레에 작은 구체 12개가 떠 있다. 작은 구체들이 <b>중력으로 끌려</b>(0028) 지면으로 떨어진다. 닿으면 <b>합쳐지지 않고</b>(SW1과 다름) <b>반발</b>(겹침 overlap>0 이면 F=k·overlap 쌍힘)이 <b>겹침을 거부</b>해 지면 위에·서로 위에 <b>쌓이고 표면이 선다</b>. 동시에 <b>감쇠</b>(접촉 법선 상대 운동을 소산→열)가 튕김을 죽여 <b>멈춘다</b> — 우상단 잔류 속도가 0 으로 잦아든다. <b>왜 중요한가</b>(design/sphere-world.md §6): 이게 "<b>선 캐릭터 = 중력(무게)↓ + 접촉 반발(떠받침)↑ 균형</b>"의 접촉 쪽 — 지면은 *아주 큰 구체*. 반발이 있어야 쌓이고·표면이 서고·선다, 소산이 있어야 멈춘다. <b>보존</b>: 반발·감쇠 모두 equal-opposite 쌍힘 → <b>운동량 정확 보존</b>(ΣP). 총E = Σenergy + 탄성 U_contact 보존 — 반발은 KE↔탄성 PE 가역, 감쇠는 <b>KE→열(internalE) 비가역</b>(엔트로피↑·구체가 멈추며 데워진다). <b>정직한 한계</b>: 쪼개기(강한 충돌→파편)는 SW3·적응 합치기 LOD 는 SW4·구체 유체(SPH)는 SW5. 여기선 *접촉 한 법칙*만.'
    },

    // ── step_0038 — 쪼개기(파편화): 큰 구체 둘이 빠르게 충돌해 작은 구체들로(SW3) ──
    //   합치기(SW1)의 거울 — 닿고 *빠르면*(상대 운동E ≥ 결합E 임계) 합쳐지지 않고 작은 구체들로 깨진다.
    //   질량·운동량·각운동량(원점)·총E 정확 보존(쪼갠 합=원본). 분산 KE 는 부모 internalE(결합열)에서.
    '0038': {
      label: 'step_0038 — 쪼개기(파편화·충돌→작은 구체들)', title: 'HTJ — 쪼개기(파편화): 큰 구체 둘이 빠르게 충돌해 작은 구체들로',
      sub: '큰 구체 둘이 빠르게 충돌(상대 운동E ≥ 임계)하면 합쳐지지 않고 작은 구체들로 깨진다 — 합치기(SW1)의 거울. 구체 세계 SW3. 보존: 질량·운동량·각운동량·총E(쪼갠 합=원본)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(120, Math.round(N * N * 0.55)), m = 400, v = N * 0.034;   // 마주보고 접근하는 속도
        const ents = [];
        // 큰 구체 2개 — 결합열(internalE) 크게(분산 재료). 마주보고 접근(상대 운동E 큼 → 임계 넘음).
        for (const sgn of [-1, 1]) {
          const vx = -sgn * v;
          ents.push({ cx: cen + sgn * N * 0.28, cy: cen, cz: cen, mass: m, px: m * vx, py: 0, pz: 0,
            Lx: 0, Ly: 0, Lz: 0, KEcm: 0.5 * m * vx * vx, internalKE: 0, internalE: 300,
            energy: 0.5 * m * vx * vx + 300, cells, radius: eqR(cells), temp: 0, peak: 1 });
        }
        w.__entities = ents;
        // 임계: 큰-큰 충돌은 넘기고(깸), 조각-조각은 μ↓ 로 못 넘게(재파편 폭주 차단).
        w.__fopt = { shatterKE: 200, n: 6, dispersalFrac: 0.4, pad: 0.6 };
        w.__copt = { k: 14, cDamp: 6 };
      },
      advance(w) {
        if (!w.__entities) return;
        w.__entities = HTJEntity.fragmentOnImpact(w.__entities, w.__fopt).entities;  // 빠른 충돌 → 파편화
        HTJEntity.applyEntityContact(w.__entities, 0.5, w.__copt);                   // 파편 겹침 거부(반발+감쇠)
        HTJEntity.stepEntities(w.__entities, 0.5, { N: w.N });                       // 이동(토러스)
      },
      note: '<b>큰 구체 둘이 빠르게 충돌하면 작은 구체들로 깨진다</b>(구체 세계 SW3·파편화). <b>▶ 흐름</b>: 온전한 큰 구체 2개가 마주보고 접근한다. 닿을 때 <b>상대 운동E 가 결합E 임계(shatterKE)를 넘으면</b> 합쳐지지 않고(SW1 과 반대) 각자 <b>작은 구체 6개로 깨진다</b>(2→12) — 우상단 "개체 N" 이 늘고 구체가 작아진다. 파편은 <b>흩어진다</b>(분산). 천천히 부딪히면 안 깨지고(SW1 이 합침·SW2 가 떠받침) <b>빠르면 깨진다</b> — 임계가 author 안 하고 가른다. <b>재파편 폭주 없음</b>: 조각은 질량↓ → 환산질량 μ↓ → 조각끼리 상대 운동E 가 임계 아래 = 더 안 깨짐(N 12 에 머묾). <b>왜 중요한가</b>(design/sphere-world.md §6): 합치기(SW1)↔쪼개기(SW3) <b>왕복</b>이 완성된다 — 미행성이 모여 행성이 되고(강착), 큰 충돌로 다시 부서진다. 0031("충돌→유체")의 구체-세계 판. <b>보존(쪼갠 합 = 원본·mergeGroup 의 역)</b>: 질량·운동량·각운동량(원점)·총E 정확(우상단 ΣP 불변). 부모 <b>스핀이 조각들에 나뉘고</b>(L/n 씩), 분산(폭발) 운동E 는 부모 <b>결합열(internalE)에서</b> 꺼낸다 — 합치기의 "잃은 KE→열" 의 <b>역</b>("결합열→분산 KE"). <b>정직한 한계</b>: 분산 KE 는 충돌 운동E 가 아니라 부모 internalE 에서(보존 단순화)·조각 수 n 고정·적응 합치기 LOD 는 SW4·구체 유체는 SW5. 여기선 *쪼개기 한 법칙*만.'
    },

    // ── step_0039 — 적응 LOD: 관찰자 멀면 합치고(coarse) 가까이서 쪼갠다(fine)(SW4) ──
    //   0034 격자 LOD 의 Lagrangian 판 — 같은 보존 합산/분배(SW1 mergeGroup·SW3 fragmentEntity)를 *거리 임계*로
    //   재사용. 관찰자(흰 점·초록 near 링)가 오가면 먼 블록은 1 개로 합쳐지고(N↓)·다가온 곳은 fine 으로 복원.
    //   비용이 세계 크기가 아니라 관찰 영역에 묶인다. 합치고 쪼개도 질량·운동량 정확 보존(벌크 불변·모양만 LOD).
    '0039': {
      label: 'step_0039 — 적응 LOD(멀면 합치고 가까이서 쪼갬)', title: 'HTJ — 적응 LOD: 관찰자 멀면 합치고 가까이서 쪼갠다',
      sub: '관찰자(흰 점·초록 near 링)가 오가면 먼 구체는 블록당 1 개로 합쳐지고(coarse·비용↓)·다가온 곳은 fine 으로 되쪼개진다 — 구체 세계 SW4(0034 격자 LOD 의 Lagrangian 판). 보존: 질량·운동량·각운동량·총E(벌크 불변·모양만 LOD)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(4, Math.round(N * N * 0.012));
        const ents = [];
        // 세계 전역에 작은 구체 떼를 흩뿌린다 — 격자(블록) 간격으로 무리지어.
        const bs = Math.max(4, Math.round(N / 5));
        for (let bx = 0; bx < N; bx += bs) for (let by = 0; by < N; by += bs) {
          for (let i = 0; i < 5; i++) {
            const cx = bx + 1 + (i % 3) * 1.2, cy = by + 1 + ((i / 3) | 0) * 1.4;
            if (cx >= N - 1 || cy >= N - 1) continue;
            const m = cells * 2;
            ents.push({ cx, cy, cz: (N - 1) / 2, mass: m, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
              KEcm: 0, internalKE: 0, internalE: cells * 0.4, energy: cells * 0.4,
              cells, radius: eqR(cells), temp: 0, peak: 1, lodMembers: 1 });
          }
        }
        w.__entities = ents;
        w.__lodopt = { blockSize: bs, nearRadius: Math.max(5, N * 0.22) };
        w.__obsT = 0;                                  // 관찰자 위상(원궤도로 세계를 훑음)
      },
      advance(w) {
        if (!w.__entities) return;
        const N = w.N, cen = (N - 1) / 2, R = N * 0.32;
        w.__obsT += 0.12;
        const obs = [cen + R * Math.cos(w.__obsT), cen + R * Math.sin(w.__obsT), cen];   // 관찰자 원궤도
        w.__obs = obs;                                 // 렌더가 표식할 수 있게
        const r = HTJEntity.adaptLOD(w.__entities, Object.assign({ observer: obs }, w.__lodopt));
        w.__entities = r.entities;                     // 먼 곳 합치고·가까운 곳 쪼갬(매 틱 재평가)
      },
      note: '<b>관찰자가 보는 곳만 정밀, 멀수록 거칠게</b>(구체 세계 SW4·적응 LOD). <b>▶ 흐름</b>: 세계 전역에 작은 구체 떼가 흩어져 있다. <b>관찰자</b>(흰 점·둘레 초록 링 = near 반경)가 원을 그리며 세계를 훑는다. <b>관찰자서 먼 블록</b>의 구체들은 <b>블록당 큰 구체 1개로 합쳐지고</b>(coarse·N↓), 관찰자가 <b>다가온 곳</b>은 그 큰 구체가 다시 <b>작은 구체들로 쪼개진다</b>(fine·디테일 복원) — 우상단 "개체 N" 이 관찰자 위치 따라 <b>숨쉬듯</b> 늘었다 줄었다 한다. <b>왜 중요한가</b>(design/sphere-world.md §6 SW4·§4): <b>비용이 세계 크기가 아니라 관찰되는 디테일에 묶인다</b> — 먼 구체를 아무리 늘려도(세계를 키워도) 합쳐져 블록 수에 묶이므로 near 예산은 일정(scalability.md 레버3 의 Lagrangian 판·0034 격자 LOD 의 구체 버전). 새 법칙이 아니라 <b>같은 보존 합산/분배의 재사용</b>: 합치기(SW1·mergeGroup)·쪼개기(SW3·fragmentEntity)를 <b>물리 임계 대신 거리 임계</b>로 트리거할 뿐. <b>보존(합산/분배라 정확)</b>: 질량·운동량·각운동량(원점)·총E 가 coarsen·refine·왕복 모두 불변(우상단 ΣP 불변) — <b>벌크는 정확, 모양만 LOD 손실</b>(coarse 는 내부 배열을 잃고 refine 은 평면 고리로 근사 복원·design §5 난점 1·약한 결정론). <b>정직한 한계</b>: 모양 복원은 근사(원래 배열 아님)·블록 버킷은 고정 격자(옥트리 다단계 아님)·구체 유체(SPH)는 SW5. 여기선 *적응 LOD 한 법칙*만.'
    },

    // ── step_0040 — SPH 밀도 추정: 구체 떼의 국소 밀도를 색으로(SW5 첫 벽돌) ──
    //   유체를 구체(SPH 입자)로 옮기는 SW5 의 토대 = 밀도 ρ_i=Σ_j m_j·W(r,h). 약한 중력(0028)으로 구름이
    //   수축하면 sphDensity 가 그 모임을 *밀도*로 읽어낸다(중심 밝게). 수동 측정 — 힘은 안 만든다(회귀 0).
    '0040': {
      label: 'step_0040 — SPH 밀도 추정(구체 떼의 국소 밀도)', title: 'HTJ — SPH 밀도 추정: 구체 떼의 국소 밀도를 색으로',
      sub: '구름이 약한 중력으로 수축하면 SPH 커널 밀도 ρ=Σ m·W(r,h)가 그 모임을 읽어낸다(중심 밝게) — 유체를 구체로 옮기는 구체 세계 SW5 의 첫 벽돌. 밀도는 수동 측정(아직 힘 없음)·압력은 후속',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(4, Math.round(N * N * 0.01));
        let seed = 12345; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 70; i++) {
          const r = N * 0.12 + rnd() * N * 0.22, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const m = cells * 2;
          ents.push({ cx: cen + r * Math.sin(ph) * Math.cos(th), cy: cen + r * Math.sin(ph) * Math.sin(th), cz: cen + r * Math.cos(ph),
            mass: m, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
            KEcm: 0, internalKE: 0, internalE: cells * 0.3, energy: cells * 0.3,
            cells, radius: eqR(cells), temp: 0, peak: 1 });
        }
        w.__entities = ents;
        w.__gopt = { G: 0.5, soft: Math.max(2, N * 0.07) };
        w.__sphH = Math.max(2.5, N * 0.12);
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.4, w.__gopt);     // 약한 중력으로 구름 수축(0028)
        HTJEntity.stepEntities(w.__entities, 0.4, { N: w.N });
        HTJSPH.sphDensity(w.__entities, { h: w.__sphH });              // 모임을 SPH 밀도로 측정(수동)
        // 밀도를 peak 에 실어 렌더가 색으로 — 모일수록 밝게(힘은 아님).
        let mx = 0; for (const e of w.__entities) if (e.density > mx) mx = e.density;
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * e.density / mx : 1;
      },
      note: '<b>구체 떼의 "어디에 얼마나 모였는지"를 밀도로 잰다</b>(구체 세계 SW5·SPH 의 첫 벽돌). <b>▶ 흐름</b>: 흩어진 작은 구체 구름이 <b>약한 중력으로 천천히 수축</b>한다(0028 재사용). 매 틱 <b>SPH 커널 밀도</b> ρ_i = Σ_j m_j·W(|r_i−r_j|, h) 를 잰다 — 각 구체 둘레로 <b>부드러운 커널 W</b>(3D 3차 B-스플라인·지지반경 2h)를 씌워 이웃 질량을 가중 합산한다. 구체 색이 <b>밀도</b>를 나타낸다 — 중심에 모일수록 <b>밝아진다</b>(어두움=옅음·밝음=밀집). <b>왜 중요한가</b>(design/sphere-world.md §6 SW5·§3): 유체·가스를 격자가 아니라 <b>작은 구체 떼(SPH)</b>로 표현하면 — 세계가 *한 원소(자유 구체)만으로* 굴러간다(격자 은퇴). 그 SPH 의 <b>토대가 밀도</b>다: 압력·점성·확산 등 모든 SPH 힘이 이 밀도 위에 선다(0009 의 온도가 수동으로 먼저 도입돼 0010 압력의 토대가 된 것과 같은 정신). <b>성질</b>: 커널 정규화 ∫W dV=1 → 균일 분포면 ρ→참 밀도(m·n₀)·모이면 ρ↑·평행이동 불변(국소 양). <b>이 단위는 수동 측정</b> — 밀도는 *재기만* 하고 <b>아직 아무 힘도 안 만든다</b>(회귀 0·중력만 움직임). <b>정직한 한계</b>: 압력 힘(∇W 쌍힘·운동량 보존)·점성·열은 후속 SW5 step·이웃 탐색은 O(N²)(0032 Barnes-Hut 류 가속은 후속)·격자 유체 은퇴는 SW5 마지막. 여기선 *밀도 추정 한 법칙*만.'
    },

    // ── step_0041 — SPH 압력 힘: 중력↔압력 균형으로 유한 가스 공(SW5 둘째 벽돌) ──
    //   밀도(0040) 위에 상태식 P=k·ρ^γ 와 ∇W 대칭 쌍힘(운동량 보존). 중력만이면 구름이 한 점으로 붕괴하지만,
    //   SPH 압력을 켜면 밀도↑→압력↑로 떠받쳐 *유한한 가스 공*에서 멈춰 숨쉰다(0008 중력↔반발 균형의 SPH 판).
    '0041': {
      label: 'step_0041 — SPH 압력 힘(중력↔압력 = 유한 가스 공)', title: 'HTJ — SPH 압력 힘: 중력↔압력 균형으로 유한 가스 공',
      sub: '밀도(0040) 위에 상태식 P=k·ρ^γ 와 ∇W 대칭 쌍힘을 얹어 구체 떼를 밀어낸다 — 중력만이면 한 점으로 붕괴하지만 SPH 압력을 켜면 유한한 가스 공에서 멈춰 숨쉰다(0008 중력↔반발의 SPH 판). 운동량 정확 보존·구체 세계 SW5',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(4, Math.round(N * N * 0.009));
        let seed = 5; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 50; i++) {
          const r = N * 0.08 + rnd() * N * 0.2, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const m = cells * 2;
          ents.push({ cx: cen + r * Math.sin(ph) * Math.cos(th), cy: cen + r * Math.sin(ph) * Math.sin(th), cz: cen + r * Math.cos(ph),
            mass: m, px: 0, py: 0, pz: 0, KEcm: 0, internalE: cells * 0.3, energy: cells * 0.3,
            cells, radius: eqR(cells) });
        }
        w.__entities = ents;
        w.__gopt = { G: 0.3, soft: Math.max(1.5, N * 0.05) };
        w.__sphH = Math.max(2.5, N * 0.1);
        w.__popt = { stiffness: 8, gamma: 2, h: w.__sphH };
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.2, w.__gopt);     // 안으로 끌고(0028)
        HTJSPH.sphPressureForce(w.__entities, 0.2, w.__popt);          // 밖으로 떠받침(SPH 압력·밀도 자동 갱신)
        HTJEntity.stepEntities(w.__entities, 0.2, { N: w.N });
        // 밀도를 peak 에 실어 색으로(중심 밝게) — 힘은 압력이 이미 적용됨.
        let mx = 0; for (const e of w.__entities) if (e.density > mx) mx = e.density;
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * (e.density || 0) / mx : 1;
      },
      note: '<b>중력으로 끌리는 가스가 압력으로 떠받쳐져 유한한 공이 된다</b>(구체 세계 SW5·SPH 압력). <b>▶ 흐름</b>: 작은 구체 구름이 <b>중력으로 안으로 끌린다</b>(0028). 동시에 <b>SPH 압력</b>이 민다 — 밀도(0040)에서 상태식 <b>P = k·ρ^γ</b> 로 압력을 만들고, <b>커널 기울기 ∇W</b> 로 대칭 쌍힘 a_i = −Σ_j m_j(P_i/ρ_i²+P_j/ρ_j²)∇_i W_ij 를 줘 빽빽한 곳을 밀어낸다. <b>중력만이면 한 점으로 붕괴</b>하지만 압력이 떠받쳐 <b>유한한 가스 공에서 멈춰 숨쉰다</b>(수축↔팽창 진동) — 중심이 밝다(밀도↑). <b>왜 중요한가</b>(design/sphere-world.md §6 SW5): 이게 <b>0008(중력↔단거리 반발 균형으로 유한 코어)·0010(열압력)의 SPH 판</b> — 구체 떼가 *가스/별처럼* 거동한다. "선 캐릭터"의 지면도 결국 이런 <b>압력으로 떠받쳐진 큰 구체</b>다. <b>보존(대칭 쌍힘·뉴턴3)</b>: F_ij=−F_ji(∇_jW=−∇_iW) → <b>순 운동량 정확 보존</b>(우상단 ΣP 불변). 균일하면 압력 힘 ≈ 0(기울기 0), 밀도 차가 있어야 민다. <b>정직한 한계</b>: 압력은 *힘*만(운동량 보존) — 압력 일↔내부에너지 닫힘(KE↔u)은 후속 SPH 열 벽돌(0008→0010 순서와 동형)·점성(끈적함)·적응 평활길이 h·격자 유체 은퇴는 후속. 여기선 *압력 힘 한 법칙*만.'
    },

    // ── step_0042 — SPH 에너지 닫힘: 압축이 데우고 팽창이 식힌다(SW5 셋째 벽돌) ──
    //   0041 압력이 한 일이 이제 내부에너지로 닫힌다(총E 정확 보존·KE↔u). du/dt=½Σ m(P/ρ²+P/ρ²)v_ij·∇W —
    //   안으로 무너지는 가스가 *압축되며 데워진다*(코어 밝아짐). 색=온도. 0009(수동 온도)·0010(닫힘)의 SPH 판.
    '0042': {
      label: 'step_0042 — SPH 에너지 닫힘(압축 데움·팽창 식힘)', title: 'HTJ — SPH 에너지 닫힘: 압축이 데우고 팽창이 식힌다',
      sub: '0041 압력이 한 일을 내부에너지로 되돌려 총E를 정확히 보존한다 — 안으로 무너지는 가스 구름이 압축되며 데워지고(코어 밝게) 되튀어 식는다(KE↔u 가역). 색=온도. 0010 열압력 닫힘의 SPH 판·구체 세계 SW5',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(4, Math.round(N * N * 0.009));
        let seed = 5; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 50; i++) {
          const r = N * 0.16 + rnd() * N * 0.14, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const ux = Math.sin(ph) * Math.cos(th), uy = Math.sin(ph) * Math.sin(th), uz = Math.cos(ph);
          const m = cells * 2, vin = -0.6;                                  // 안쪽 속도(붕괴 → 압축 데움)
          ents.push({ cx: cen + r * ux, cy: cen + r * uy, cz: cen + r * uz,
            mass: m, px: m * vin * ux, py: m * vin * uy, pz: m * vin * uz,
            KEcm: 0.5 * m * vin * vin, internalE: cells * 0.3, energy: cells * 0.3 + 0.5 * m * vin * vin,
            cells, radius: eqR(cells) });
        }
        w.__entities = ents;
        w.__gopt = { G: 0.3, soft: Math.max(1.5, N * 0.05) };
        w.__sphH = Math.max(2.5, N * 0.1);
        w.__popt = { stiffness: 8, gamma: 2, h: w.__sphH };
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.2, w.__gopt);     // 안으로 끌고(0028)
        HTJSPH.sphThermalEnergy(w.__entities, 0.2, w.__popt);          // 압력 일 → 내부E(열·사전 속도·p 불변)
        HTJSPH.sphPressureForce(w.__entities, 0.2, w.__popt);          // 밖으로 떠받침(같은 사전 속도라 총E 닫힘)
        HTJEntity.stepEntities(w.__entities, 0.2, { N: w.N });
        // 온도(internalE/mass)를 peak 에 실어 색으로 — 압축되면 밝게(데움)·팽창하면 어둡게(식힘).
        let mx = 0; for (const e of w.__entities) { const t = (e.internalE || 0) / (e.mass || 1); if (t > mx) mx = t; }
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * ((e.internalE || 0) / (e.mass || 1)) / mx : 1;
      },
      note: '<b>압력이 한 일이 열로 닫힌다 — 압축이 데우고 팽창이 식힌다</b>(구체 세계 SW5·SPH 에너지 닫힘). <b>▶ 흐름</b>: 가스 구름이 <b>안쪽 속도로 무너진다</b>(중력+초기 붕괴). 빽빽해질수록 0041 <b>압력</b>이 밀어내는데(KE 를 깎음), 이제 그 깎인 운동에너지가 <b>사라지지 않고 내부에너지(열)로 들어간다</b> — <b>du_i/dt = ½ Σ_j m_j(P_i/ρ_i²+P_j/ρ_j²)(v_i−v_j)·∇_i W_ij</b>. 구체 색이 <b>온도</b>(internalE/질량)다 — 코어가 <b>압축되며 밝아지고</b>(데움) 되튀어 팽창하면 <b>어두워진다</b>(식힘). 우상단 총E(KE+u)는 <b>거의 불변</b>. <b>왜 중요한가</b>(design/sphere-world.md §6 SW5·§5): 0041 은 "압력이 *implicit 열저장고*에서 일을 꺼낸다"는 정직한 한계를 남겼다 — 이 step 이 그 저장고를 <b>실제 내부에너지로 만들어 총E 를 정확히 닫는다</b>(<b>KE↔u 가역</b>·순간 전력 균형이 기계 정밀도로 정확). 이게 <b>0009(수동 온도 T∝ρ^(γ−1))·0010(KE↔내부E 가역 닫힘)의 SPH 판</b> — 별이 *수축으로 데워져 빛나는* 그 메커니즘이다. <b>궤적은 0041 과 불변</b>: EOS P=k·ρ^γ 가 barotropic 이라 u 가 *아직 힘에 되먹지 않는다* — 이 단위는 <b>에너지 책</b>만 정직하게 닫는다(0009 가 수동 온도였던 것과 같은 정신). <b>정직한 한계</b>: 열→압력 되먹임(P=(γ−1)ρu·압축 데움이 더 세게 떠받침)은 후속 벽돌(0010 의 능동 열압력 판)·점성(충격 소산)·격자 유체 은퇴는 SW5 마지막. 여기선 *에너지 닫힘 한 법칙*만.'
    },

    // ── step_0043 — 강착 세계: 중력+소산 접촉+합치기 조립 → 작은 구체 구름이 몇 천체로 합쳐진다(SW1+SW2) ──
    //   새 엔진 법칙 없음(0035 "새 engine 없음" 선례) — 가진 부품(중력 0028 + 접촉 반발·소산 0037 + 합치기 0036)을
    //   *한 세계*에서 함께 굴린다. 그동안 합치기·접촉·중력이 따로 놀아 "공이 겹쳐 비비기만" 했던 공백을 메운다:
    //   작은 구체 40개가 무너지며 충돌·소산으로 식고 느려진 접촉이 합쳐져 *몇 개의 큰 천체로 강착*(미행성→행성).
    '0043': {
      label: 'step_0043 — 강착 세계(구름 → 몇 천체로 합쳐짐)', title: 'HTJ — 강착 세계: 중력+소산 접촉+합치기 조립 → 작은 구체 구름이 몇 천체로 합쳐진다',
      sub: '가진 부품(중력+접촉 반발·소산+합치기)을 한 세계에서 함께 굴린다 — 작은 구체 40개 구름이 무너지며 충돌·소산으로 식고, 느려진 접촉이 합쳐져 몇 개의 큰 천체로 강착한다(미행성→행성). 새 엔진 법칙 없음(조립=창발 무대)·구체 세계 SW1+SW2. 질량·운동량 정확 보존·소산 단조↑',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const cells = Math.max(4, Math.round(N * N * 0.01));
        let seed = 11; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 40; i++) {
          const dx = (rnd() - 0.5) * N * 0.62, dy = (rnd() - 0.5) * N * 0.62, dz = (rnd() - 0.5) * N * 0.62;
          const m = cells * 4, tang = 0.04;                              // 약한 접선 속도(각운동량) → 궤도 천체
          ents.push({ cx: cen + dx, cy: cen + dy, cz: cen + dz,
            mass: m, px: m * -tang * dy, py: m * tang * dx, pz: 0, Lx: 0, Ly: 0, Lz: 0,
            KEcm: 0, internalE: cells * 0.5, energy: cells * 0.5, cells, radius: eqR(cells), temp: 0, peak: 1 });
        }
        w.__entities = ents;
        w.__gopt = { G: 0.5, soft: Math.max(2, N * 0.085) };
        w.__copt = { stiffness: 4, damping: 25, pad: 0.3 };              // 반발(겹침 거부)+감쇠(소산→열)
        w.__mopt = { vstick: 3.0, pad: 0.6 };                           // 식어 느려진 접촉 → 합침
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.1, w.__gopt);      // 서로 끌어 모음(0028)
        HTJEntity.applyEntityContact(w.__entities, 0.1, w.__copt);      // 겹침 거부(반발)+낙하 식힘(소산→열)
        HTJEntity.stepEntities(w.__entities, 0.1, { N: w.N });
        w.__entities = HTJEntity.mergeEntities(w.__entities, w.__mopt).entities;  // 느려진 접촉 → 합침(강착)
        // 온도(internalE/mass)를 peak 에 실어 색으로 — 강착할수록 밝게(낙하E→열).
        let mx = 0; for (const e of w.__entities) { const t = (e.internalE || 0) / (e.mass || 1); if (t > mx) mx = t; }
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * ((e.internalE || 0) / (e.mass || 1)) / mx : 1;
      },
      note: '<b>작은 구체 구름이 무너지며 합쳐져 몇 개의 큰 천체가 된다</b>(구체 세계 SW1+SW2·강착=행성 형성). <b>▶ 흐름</b>: 작은 구체 40개가 흩어져 있다(파랑=차가움). 서로 <b>중력으로 끌려</b>(0028) 무너지고, 부딪치면 <b>접촉</b>이 <b>겹침을 거부</b>(반발)하면서 <b>낙하 에너지를 열로 식힌다</b>(감쇠·소산). 식어서 <b>느려진 접촉은 하나로 합쳐진다</b>(0036 강착·vstick 임계) — 우상단 "개체 N" 이 <b>40 → 몇 개로 뚝뚝 떨어지고</b> 남은 천체가 <b>커지고 밝아진다</b>(노랑=강착열↑). <b>왜 중요한가</b>(design/sphere-world.md §0·§6): 이게 사용자가 말한 <b>"모여서 커지면 하나로 합쳐 단순화"</b> 의 실현 — ① <b>창발 물리</b>: 미행성이 충돌·합체로 행성이 되는 그 방식 ② <b>성능</b>: N 개가 적은 큰 구체로 줄어 비용↓(적응 LOD 의 Lagrangian 형태). <b>새 엔진 법칙이 없다</b> — 이미 가진 중력·접촉·합치기를 <b>한 세계에서 같이 굴린 것</b>(0035 "새 engine 없음" 과 같은 *조립=창발 무대*). 그동안 비어 보였던 건 이 셋이 <b>한 장면에 같이 돈 적이 없어서</b>다. <b>보존(쌍 보존·합산)</b>: 질량·운동량 <b>기계 정밀도로 정확 불변</b>(우상단 ΣP). <b>소산 = 시간의 화살</b>: 내부에너지(열)가 <b>단조 증가</b> — 낙하 운동E 가 접촉 감쇠+강착열로 비가역 전환(다시 안 흩어짐). <b>정직한 한계</b>: 각운동량 때문에 <b>한 점이 아니라 몇 천체로</b> 정착해 서로 궤도를 돈다(물리적으로 옳음·한 덩어리로 안 뭉침)·합쳐진 큰 천체끼리는 더는 안 닿아 추가 소산이 멈춘다(궤도 N체)·빠른 정면충돌은 SW3 로 깨질 수도(여기선 소산이 식혀 합침 우세). 새 법칙 없는 *조립 step*.'
    },

    // ── step_0044 — 강착↔파편 왕복: 임계가 합침/깨짐을 가른다(SW3 조립·새 엔진 없음) ──
    //   강착 세계(0043)에 쪼개기(0038 fragmentOnImpact)를 더한다: advance = 중력→접촉→적분→fragment(빠름→파편)→
    //   merge(느림→합침). 고속 충돌체가 뜨거운 천체에 박혀 *파편으로 폭발*(N↑)하고, 파편이 중력+소산으로 식어
    //   *다시 합쳐진다*(N↓·재강착). 임계가 author 없이 행동을 가른다 — 새 법칙 없는 조립(0043 처럼).
    '0044': {
      label: 'step_0044 — 강착↔파편 왕복(부수고 다시 모임)', title: 'HTJ — 강착↔파편 왕복: 임계가 합침/깨짐을 가른다',
      sub: '강착 세계(0043)에 쪼개기(0038)를 더한다 — 고속 충돌체가 뜨거운 천체에 박혀 파편으로 폭발하고(빠름→깨짐), 파편이 중력+소산으로 식어 다시 합쳐진다(느림→합침·재강착). 임계가 author 없이 가른다. 새 엔진 법칙 없음·구체 세계 SW3. 질량·운동량 정확 보존',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        const big = Math.max(40, Math.round(N * N * 0.14)), small = Math.max(4, Math.round(N * N * 0.018));
        const body = (cx, cy, cells, vx, vy, intE) => { const m = cells * 4; return { cx, cy, cz: cen, mass: m, px: m * vx, py: m * vy, pz: 0, Lx: 0, Ly: 0, Lz: 0, KEcm: 0.5 * m * (vx * vx + vy * vy), internalE: intE, energy: 0, cells, radius: eqR(cells), temp: 0, peak: 1 }; };
        let seed = 7; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [body(cen + N * 0.04, cen, big, 0, 0, 600), body(cen - N * 0.38, cen, small * 1.7, 5.5, 0, 3)];   // 뜨거운 천체 + 고속 충돌체
        for (let i = 0; i < 8; i++) { const dx = (rnd() - 0.5) * N * 0.2 + N * 0.12, dy = (rnd() - 0.5) * N * 0.45; ents.push(body(cen + dx, cen + dy, small, -0.04 * dy, 0.02 * dx, 3)); }
        for (const e of ents) e.energy = e.KEcm + e.internalE;
        w.__entities = ents;
        w.__gopt = { G: 0.3, soft: Math.max(2, N * 0.1) };
        w.__copt = { stiffness: 5, damping: 10, pad: 0.3 };
        w.__fopt = { shatterKE: 40, n: 6, dispersalFrac: 0.85, spread: 1.3, pad: 0.4 };   // 빠름 → 파편
        w.__mopt = { vstick: 1.2, pad: 0.6 };                                            // 느림 → 합침
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.08, w.__gopt);     // 끌어 모음(0028)
        HTJEntity.applyEntityContact(w.__entities, 0.08, w.__copt);     // 반발+소산(0037)
        HTJEntity.stepEntities(w.__entities, 0.08, { N: w.N });
        w.__entities = HTJEntity.fragmentOnImpact(w.__entities, w.__fopt).entities;   // 빠른 충돌 → 파편(0038)
        w.__entities = HTJEntity.mergeEntities(w.__entities, w.__mopt).entities;      // 느려진 접촉 → 합침(0036)
        // 온도(internalE/mass)를 peak 에 실어 색으로 — 깨지면 흩어진 파편·식어 합치면 큰 천체.
        let mx = 0; for (const e of w.__entities) { const t = (e.internalE || 0) / (e.mass || 1); if (t > mx) mx = t; }
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * ((e.internalE || 0) / (e.mass || 1)) / mx : 1;
      },
      note: '<b>고속 충돌은 부수고·느린 접촉은 합친다 — 임계가 author 없이 가른다</b>(구체 세계 SW3·강착↔파편 왕복). <b>▶ 흐름</b>: 뜨거운 큰 천체(노랑=강착열) 둘레에 작은 구체들이 있고, 왼쪽에서 <b>고속 충돌체</b>가 날아온다. 박히는 순간 상대 운동E 가 임계(shatterKE)를 넘어 천체가 <b>파편으로 폭발</b>한다(우상단 "개체 N" 이 <b>확 늘어남</b>·0038 fragmentEntity 의 보존 분배). 흩어진 파편은 중력으로 다시 끌리고 접촉 소산으로 식어, <b>느려지면(vstick 아래) 다시 합쳐진다</b>(0036 강착) — N 이 <b>폭발↑ 했다가 재강착↓</b>. <b>왜 중요한가</b>(design/sphere-world.md §6 SW3·§4): <b>"상대 속도가 임계를 넘으면 깨지고, 못 넘으면 붙는다 — author 하지 않고 임계가 가른다"</b>. 같은 두 법칙(합치기·쪼개기)이 <b>한 세계에서</b> 충돌 속도에 따라 갈려 — 합치기↔쪼개기 <b>왕복이 닫힌다</b>(소행성 충돌 cascade·충돌 강착의 양면). <b>새 엔진 법칙 없음</b> — 0043 강착에 0038 쪼개기를 <b>같이 굴린 조립</b>(0035 정신). <b>보존(쌍 보존·분배)</b>: 깨질 때도 합칠 때도 질량·운동량 <b>기계 정밀도로 정확 불변</b>(우상단 ΣP). <b>임계 분리</b>: 파편 분산 속도 > vstick 라야 <i>깨자마자 재합침(flicker)</i> 없이 왕복이 닫힌다. <b>정직한 한계</b>: 파편 분산E 는 부모 internalE(결합열)에서(충돌 운동E 직접 소비 아님·0038 한계 계승)·조각 수 n 고정·재강착은 중력+소산에 의존(파라미터 영역). 새 법칙 없는 *왕복 조립 step*.'
    },

    // ── step_0045 — SW5 능동 열압력: P=(γ−1)ρu 되먹임으로 단열 가스 공이 되튄다 ──
    //   0041(barotropic·u 무관)·0042(에너지 닫힘·u 가 힘에 안 먹임)의 *되먹임* 판. 압축이 u 를 데우고 → 데운 u 가
    //   P 를 키워 더 세게 떠받친다. 찬 가스가 무너지며 데워지고, 열압력이 붕괴를 멈춰 되튄다(별 코어의 단열 지지).
    '0045': {
      label: 'step_0045 — SW5 능동 열압력(P=(γ−1)ρu·단열 되튐)', title: 'HTJ — SW5 능동 열압력: 데운 가스가 더 세게 떠받쳐 단열 공이 되튄다',
      sub: '압력이 내부에너지에서 나온다(P=(γ−1)ρu) — 찬 가스가 중력으로 무너지며 압축으로 데워지고, 데운 u 가 압력을 키워 붕괴를 멈춰 되튄다(단열 지지). 0009→0010(수동 온도→능동 열압력)의 SPH 판·구체 세계 SW5. 운동량·총E 정확 보존',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        let seed = 9; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 60; i++) {
          const r = N * 0.1 + rnd() * N * 0.12, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const ux = Math.sin(ph) * Math.cos(th), uy = Math.sin(ph) * Math.sin(th), uz = Math.cos(ph), m = 1, vin = -0.4;   // 안쪽 속도(붕괴)
          ents.push({ cx: cen + r * ux, cy: cen + r * uy, cz: cen + r * uz, mass: m, px: m * vin * ux, py: m * vin * uy, pz: m * vin * uz,
            KEcm: 0.5 * m * vin * vin, internalE: 0.2, energy: 0.2 + 0.5 * m * vin * vin, cells: 5, radius: eqR(5) });
        }
        w.__entities = ents;
        w.__gopt = { G: 0.25, soft: Math.max(2, N * 0.12) };
        w.__topt = { gamma: 5 / 3, h: Math.max(2.5, N * 0.14) };
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.14, w.__gopt);     // 안으로 끌고(0028)
        HTJSPH.sphThermalPressureForce(w.__entities, 0.14, w.__topt);   // 열압력(P=(γ−1)ρu·되먹임·밀도 자동 갱신)
        HTJEntity.stepEntities(w.__entities, 0.14, { N: w.N });
        // 온도(internalE/mass)를 peak 에 실어 색으로 — 압축되면 밝게(데움)·되튀면 식음.
        let mx = 0; for (const e of w.__entities) { const t = (e.internalE || 0) / (e.mass || 1); if (t > mx) mx = t; }
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * ((e.internalE || 0) / (e.mass || 1)) / mx : 1;
      },
      note: '<b>압력이 내부에너지에서 나온다 — 데운 가스가 더 세게 떠받친다</b>(구체 세계 SW5·능동 열압력). <b>▶ 흐름</b>: 찬 가스 구름(어두움)이 <b>중력으로 무너진다</b>(0028). 빽빽해지며 압력 일이 <b>내부에너지(열)로 닫히고</b>(0042), 이제 그 <b>데운 u 가 압력을 키운다</b> — 상태식 <b>P = (γ−1)·ρ·u</b>. 그래서 압축될수록 <b>더 세게 떠받쳐</b>, 중력 붕괴가 한 점으로 찌부러지지 않고 <b>핫코어(노랑)에서 멈춰 되튄다</b>(rms 가 줄었다 다시 늚=단열 숨쉬기). <b>왜 중요한가</b>(design/sphere-world.md §6 SW5): 이게 <b>0009(수동 온도 T∝ρ^(γ−1))→0010(능동 열압력 되먹임)의 SPH 판</b> — 0041 은 압력이 밀도만 따랐고(barotropic·u 무관), 0042 는 u 를 닫았지만 힘에 안 먹였다. 이 step 이 <b>u→P 되먹임</b>을 닫아, 가스가 <b>별 코어처럼 단열로 스스로 지탱</b>한다(압축 데움→압력↑→지지). 같은 밀도라도 <b>뜨거운 가스가 찬 가스보다 더 센 압력</b>(verify: u 10배→힘 10배). <b>보존</b>: 운동량 <b>기계 정밀도 정확</b>(대칭 쌍힘·우상단 ΣP)·압력 일↔내부E <b>총E 닫힘</b>(순간 전력 균형 −S+S=0·중력 PE 제외). u≤0 → P=0(음압 없음). <b>정직한 한계</b>: 점성(충격 감쇠) 없음 — 단열 진동이 안 식음·평활길이 h 고정·이웃 O(N²)·격자 유체 은퇴는 SW5 마지막. 여기선 *열압력 되먹임 한 법칙*만.'
    },

    // ── step_0046 — SW5 점성: 단열 진동이 점성으로 식어 정착한다(SW5 다섯째 벽돌) ──
    //   0041~0045 압력은 가역(데움↔식힘)이라 단열 진동이 영원히 안 식음. Monaghan 인공 점성 Π_ij 가 *접근하는*
    //   쌍의 bulk KE 를 열로 일방 소산 → 진동이 잦아들며 정착. 0011(비가역 점성 소산)·0037(DEM 감쇠)의 SPH 판.
    '0046': {
      label: 'step_0046 — SW5 점성(단열 진동을 식혀 정착)', title: 'HTJ — SW5 점성: 인공 점성이 단열 진동을 식혀 가스 공이 정착한다',
      sub: '인공 점성(Monaghan Π_ij)이 접근하는 입자 쌍의 bulk 운동E를 열로 일방 소산한다 — 0045 까지의 가역 압력은 단열 진동이 안 식지만, 점성을 켜면 진동이 잦아들며 정착한다(접근에만·시간의 화살). 0011(비가역 점성 소산)·0037(DEM 감쇠)의 SPH 판·구체 세계 SW5. 운동량·총E 정확 보존',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        let seed = 9; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 60; i++) {
          const r = N * 0.1 + rnd() * N * 0.12, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const ux = Math.sin(ph) * Math.cos(th), uy = Math.sin(ph) * Math.sin(th), uz = Math.cos(ph), m = 1, vin = -0.4;   // 안쪽 속도(붕괴)
          ents.push({ cx: cen + r * ux, cy: cen + r * uy, cz: cen + r * uz, mass: m, px: m * vin * ux, py: m * vin * uy, pz: m * vin * uz,
            KEcm: 0.5 * m * vin * vin, internalE: 0.2, energy: 0.2 + 0.5 * m * vin * vin, cells: 5, radius: eqR(5) });
        }
        w.__entities = ents;
        w.__gopt = { G: 0.25, soft: Math.max(2, N * 0.12) };
        w.__topt = { gamma: 5 / 3, h: Math.max(2.5, N * 0.14) };
        w.__vopt = { alpha: 1.5, beta: 3, gamma: 5 / 3, h: Math.max(2.5, N * 0.14) };
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.14, w.__gopt);     // 안으로 끌고(0028)
        HTJSPH.sphThermalPressureForce(w.__entities, 0.14, w.__topt);   // 가역 열압력(0045·밀도 자동 갱신)
        HTJSPH.sphViscosity(w.__entities, 0.14, w.__vopt);             // 비가역 점성(이 step·접근 쌍 KE→열)
        HTJEntity.stepEntities(w.__entities, 0.14, { N: w.N });
        let mx = 0; for (const e of w.__entities) { const t = (e.internalE || 0) / (e.mass || 1); if (t > mx) mx = t; }
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * ((e.internalE || 0) / (e.mass || 1)) / mx : 1;
      },
      note: '<b>점성이 단열 진동을 식혀 가스 공이 정착한다</b>(구체 세계 SW5·인공 점성). <b>▶ 흐름</b>: 찬 가스 구름(보라)이 <b>중력으로 무너지며</b> 압축으로 데워진다(핫코어 노랑·0042/0045). 0045 까지의 <b>압력은 가역</b>(압축 데움↔팽창 식힘)이라 무너진 가스가 <b>영원히 숨쉰다</b>(안 식음). 이 step 의 <b>인공 점성</b>(Monaghan)이 그걸 식힌다 — <b>접근하는</b>(v_ij·r_ij&lt;0) 입자 쌍에만 소산 압력 <b>Π_ij = (−α c̄ μ_ij + β μ_ij²)/ρ̄</b> 를 줘 상대운동을 깎고 그 <b>bulk 운동E를 내부E(열)로 일방 전환</b>한다(μ_ij = h v_ij·r_ij/(r²+0.01h²)). 그래서 <b>진동이 잦아들며 따뜻한 공으로 정착</b>한다(rms 가 줄어드는 진폭으로 숨쉬다 멎음). <b>왜 중요한가</b>(design/sphere-world.md §6 SW5·§5 난점 2): 이게 <b>0011(비가역 점성 소산 bulk KE→열·엔트로피↑·별 정착)·0037(DEM 접촉 감쇠)의 SPH 판</b> — 소산이 있어야 세계가 *멈춘다*("선 캐릭터"의 정착도 결국 소산). <b>두 보존·한 비가역</b>: 운동량 <b>기계 정밀도 정확</b>(대칭 쌍힘 ∇_jW=−∇_iW·뉴턴3·우상단 ΣP)·점성 일↔내부E <b>총E 닫힘</b>(순간 전력 균형 −S+S=0). 그러나 Π≥0 이고 접근 쌍의 v_ij·∇_iW&gt;0 라 <b>ΔU≥0 — 오직 데움(단방향·시간의 화살)</b> = 0045 가역 압력과의 결정적 차이(<b>멀어지는 쌍은 점성 0</b>). 음속은 0045 열 EOS 와 정합 <b>c=√(γ(γ−1)u)</b>(뜨거우면 더 끈적). <b>정직한 한계</b>: 평활길이 h 고정·이웃 O(N²)·격자 유체 은퇴는 SW5 마지막(측정된 필요 후). 여기선 *점성 한 법칙*만.'
    },

    // ── step_0047 — SW5 이웃 탐색 가속: 셀 리스트로 O(N²)→O(N)(큰 가스 구름) ──
    //   SPH 합은 지지반경 2h 안 이웃만 기여 → 셀 크기 2h 격자로 27 이웃 셀만 훑어 가속. 물리는 brute 와 비트 동일
    //   (verify) — 새 물리 없음. payoff = 더 큰 가스 구름(200개)을 가속 경로로 굴린다(중력+열압력+점성 한 무대).
    '0047': {
      label: 'step_0047 — SW5 이웃 탐색 가속(O(N²)→O(N)·큰 구름)', title: 'HTJ — SW5 이웃 탐색 가속: 셀 리스트로 큰 가스 구름을 빠르게',
      sub: '공간 격자(셀 리스트)로 SPH 이웃 탐색을 O(N²)→O(N) 가속한다 — 셀 크기를 지지반경 2h 로 잡아 27 이웃 셀만 훑는다. 같은 쌍을 같은 순서로 봐 결과는 brute 와 비트 동일(새 물리 없음). payoff = 더 큰 가스 구름(200개)을 가속 경로로 굴려 중력+열압력+점성을 한 무대에. 0032 Barnes-Hut 의 SPH·근거리 판·구체 세계 SW5',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, eqR = (n) => HTJEntity.equivalentRadius(n);
        let seed = 17; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 200; i++) {                       // 큰 구름 — 가속이 여는 규모
          const r = N * 0.12 + rnd() * N * 0.18, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const ux = Math.sin(ph) * Math.cos(th), uy = Math.sin(ph) * Math.sin(th), uz = Math.cos(ph), m = 1, vin = -0.3;
          ents.push({ cx: cen + r * ux, cy: cen + r * uy, cz: cen + r * uz, mass: m, px: m * vin * ux, py: m * vin * uy, pz: m * vin * uz,
            KEcm: 0.5 * m * vin * vin, internalE: 0.2, energy: 0.2 + 0.5 * m * vin * vin, cells: 4, radius: eqR(4) });
        }
        w.__entities = ents;
        const h = Math.max(2.5, N * 0.13);
        w.__gopt = { G: 0.18, soft: Math.max(2, N * 0.12) };
        w.__topt = { gamma: 5 / 3, h, accelerate: true };     // 가속 경로(셀 리스트·brute 와 비트 동일)
        w.__vopt = { alpha: 1.2, beta: 2.4, gamma: 5 / 3, h, accelerate: true };
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.12, w.__gopt);     // 안으로 끌고(0028)
        HTJSPH.sphThermalPressureForce(w.__entities, 0.12, w.__topt);   // 가속 열압력(0045)
        HTJSPH.sphViscosity(w.__entities, 0.12, w.__vopt);             // 가속 점성(0046)
        HTJEntity.stepEntities(w.__entities, 0.12, { N: w.N });
        let mx = 0; for (const e of w.__entities) { const t = (e.internalE || 0) / (e.mass || 1); if (t > mx) mx = t; }
        for (const e of w.__entities) e.peak = mx > 0 ? 0.2 + 2.5 * ((e.internalE || 0) / (e.mass || 1)) / mx : 1;
      },
      note: '<b>이웃 탐색을 O(N²)→O(N) 로 가속한다 — 더 큰 가스 구름이 열린다</b>(구체 세계 SW5). <b>▶ 무엇</b>: SPH 합(밀도·압력·점성)은 <b>지지반경 2h 안의 이웃만</b> 기여한다 — 멀리 있는 입자는 커널 <b>W=0·∇W=0</b>(정확). 그런데 기본 경로는 <b>O(N²)</b> 모든 쌍을 본다. 셀 크기를 <b>지지반경 2h</b> 로 잡아 입자를 버킷에 담으면, 한 입자의 이웃은 <b>자기 셀+인접 26 셀(3×3×3)</b> 안에만 있다(분리 ≤2h → 셀 인덱스 차 ≤1). 균일 밀도면 셀당 입자 수가 일정 → 이웃 탐색이 <b>O(N)</b>. <b>왜 중요한가</b>(design/sphere-world.md §6 SW5): 이게 <b>0032 Barnes-Hut(중력 O(N log N))의 SPH·근거리 판</b> — 더 큰 세계 = 더 풍부한 창발을 연다(여기 화면은 <b>입자 200개</b> 가스 구름이 무너지며 데워짐). <b>물리는 불변</b>: 가속은 <b>같은 쌍을 같은 순서로</b> 방문하므로(이웃 오름차순 정렬·먼 쌍은 0 기여) <b>brute 와 비트 동일</b>(0016/0018 "조밀과 비트 동일"의 SPH 판·verify: 밀도·압력·점성·열압력 네 함수 모두 가속=brute). <b>보존</b>: 운동량·총E 가속해도 그대로(같은 쌍힘·우상단 ΣP). <b>정직한 한계</b>: 균일 밀도 가정(국소 과밀이면 한 셀에 몰림)·평활길이 h 고정(적응 h 는 후속)·격자 유체 은퇴는 SW5 마지막(측정된 필요 후). 여기선 *이웃 탐색 가속 한 가지*만 — 새 물리 없음.'
    },

    // ── step_0048 — SW5 적응 평활길이 h: 분해능이 밀도를 따라간다 ──
    //   h_i=η(m_i/ρ_i)^⅓ 를 자기일관(고정점)으로 푼다 — 조밀하면 좁은 h, 희박하면 넓은 h(이웃 수 일정). 수동 측정(힘 없음).
    //   그리는 반지름 = h_i 로 둬 평활길이를 눈에 보인다: 무너지는 구름의 코어가 조밀해지며 커널이 줄어든다. 색=밀도.
    '0048': {
      label: 'step_0048 — SW5 적응 평활길이 h(분해능이 밀도를 따라감)', title: 'HTJ — SW5 적응 평활길이 h: h_i=η(m_i/ρ_i)^⅓ 자기일관',
      sub: '입자마다 평활길이 h_i 를 국소 밀도에 묶는다 — h_i=η(m_i/ρ_i)^⅓ 를 자기일관(고정점 반복)으로 푼다. 조밀한 코어는 좁은 h(촘촘히 분해)·희박한 헤일로는 넓은 h → 이웃 수가 일정. SW4 적응 LOD(분해능이 물질을 따라감)의 SPH·연속판. 그리는 원 반지름 = h_i 라 평활길이가 눈에 보인다(무너지는 코어의 커널이 줄어듦)·색=밀도. 수동 측정(힘 없음)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        let seed = 11; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        for (let i = 0; i < 150; i++) {
          const r = N * 0.05 + rnd() * N * 0.22, th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1);
          const ux = Math.sin(ph) * Math.cos(th), uy = Math.sin(ph) * Math.sin(th), uz = Math.cos(ph), m = 1, vin = -0.35;
          ents.push({ cx: cen + r * ux, cy: cen + r * uy, cz: cen + r * uz, mass: m, px: m * vin * ux, py: m * vin * uy, pz: m * vin * uz,
            KEcm: 0.5 * m * vin * vin, internalE: 0.15, energy: 0.15 + 0.5 * m * vin * vin, cells: 4, radius: 1 });
        }
        w.__entities = ents;
        const h = Math.max(2.5, N * 0.13);
        w.__gopt = { G: 0.4, soft: Math.max(2, N * 0.06) };
        w.__topt = { gamma: 5 / 3, h };                        // 운동: 고정-h 열압력(적응-h 힘은 후속)
        w.__h = h;
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.1, w.__gopt);      // 중력으로 무너지고
        HTJSPH.sphThermalPressureForce(w.__entities, 0.1, w.__topt);    // 약한 열압력 지지
        HTJEntity.stepEntities(w.__entities, 0.1, { N: w.N });
        HTJSPH.sphAdaptiveH(w.__entities, { eta: 1.3, h0: w.__h });     // 적응 h 측정(따뜻한 시작)
        let rmax = 0; for (const e of w.__entities) if ((e.density || 0) > rmax) rmax = e.density;
        for (const e of w.__entities) { e.peak = rmax > 0 ? 0.2 + 2.5 * (e.density || 0) / rmax : 1; e.radius = Math.max(0.4, Math.min(6, e.h || 1)); }
      },
      note: '<b>입자마다 분해능(평활길이 h)을 국소 밀도에 묶는다 — 분해능이 물질을 따라간다</b>(구체 세계 SW5·SW4 적응 LOD 의 SPH 연속판). <b>▶ 무엇</b>: 지금까지 SPH 의 평활길이 h 는 <b>전 입자 공통 상수</b>였다. 그런데 가스가 무너지면 밀도가 <b>자릿수로</b> 변한다 — 고정 h 는 조밀 코어를 <b>과평활</b>(뭉개고)하거나 희박부를 <b>못 분해</b>한다. 표준 SPH 해법: h_i 를 국소 밀도에 묶어 <b>이웃 수를 일정</b>하게 — 3D 에서 <b>h_i = η·(m_i/ρ_i)^⅓</b>(η=이웃 수 노브·여기 1.3). ρ_i 가 h_i 에 의존하니 <b>자기일관</b>으로 푼다(고정점 반복: ρ 재고 h 갱신을 수렴까지·잔차 1.4e-5). <b>왜 중요한가</b>(design §4·§6 SW5): 이게 <b>SW4 적응 LOD</b>(멀면 합치고 가까이 쪼개 분해능을 관찰/물질에 맞춤)의 <b>SPH·연속판</b> — 비용·정밀도가 *디테일이 있는 곳*에 묶인다. <b>그림으로 보기</b>: 원 반지름 = h_i 라 <b>평활 커널 자체가 보인다</b> — 무너지는 구름의 코어가 조밀해지면 거기 <b>h 가 줄어(작은 커널 촘촘)</b>·바깥 희박 헤일로는 <b>큰 커널</b>(코어 최소 h 3.4→0.8 예리화·h 범위 2.9→7.0 분화). 색 = 밀도(뜨거울수록 조밀). <b>0040 밀도처럼 수동 측정</b>: a.h·a.density 만 써넣고 <b>힘은 안 만든다</b>(신규 함수·호출처 없음 → 회귀 0). 운동은 중력+<b>고정-h</b> 열압력이 만들고, 적응 h 는 그 위에서 분해능을 <b>잰다</b>. <b>정직한 한계</b>: <b>적응-h 힘</b>(대칭 커널·grad-h Ω 보정으로 에너지까지 일관)은 <b>다음 벽돌</b> — 이 step 은 측정만. 외톨이 입자는 분해 척도가 없어 h 발산(이웃 없음·물리적). 격자 유체 은퇴는 SW5 마지막(측정된 필요 후). 여기선 *적응 평활길이 한 가지*만.'
    },

    // ── step_0049 — SW5 열전도: 온도 차를 평형화(0002 확산의 SPH 판) ──
    //   du_i/dt=Σ_j m_j(κ_i+κ_j)/(ρ_iρ_j)(u_i−u_j)(r·∇W)/(r²+ε) — 대칭 쌍 교환 → 총 내부E 보존·열 hot→cold·엔트로피↑.
    //   평면 원반(위치 고정)·중심 뜨겁게: 핫코어가 바깥으로 확산해 균일 미지근으로. 색=온도(절대). CFL 서브스텝으로 안정(0012).
    '0049': {
      label: 'step_0049 — SW5 열전도(온도 확산·0002 의 SPH 판)', title: 'HTJ — SW5 열전도: 뜨거운 코어가 바깥으로 확산',
      sub: 'SPH 열전도 — 이웃 쌍 사이로 비열E(온도)를 흘려 온도 차를 평형화한다. 0046 점성이 bulk 운동을 식혔다면 이건 온도 차를 식힌다 = 0002 확산(열역학 제2법칙)의 SPH 판. 라플라시안 SPH 근사(Brookshaw)·대칭 쌍 교환 → 총 내부E 정확 보존·열 hot→cold·온도 분산 단조↓(엔트로피↑). 평면 원반(위치 고정)·중심 뜨겁게: 핫코어가 바깥으로 확산해 균일 미지근으로. 색=온도(절대 스케일). 운동량·KE 불변(U 만 재분배)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'absolute', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, R = N * 0.42, SP = Math.max(1.6, N * 0.05);
        const ents = [];
        for (let x = -R; x <= R; x += SP) for (let y = -R; y <= R; y += SP) {   // 평면 원반(z=0)
          const r = Math.sqrt(x * x + y * y); if (r > R) continue;
          const u = r < R / 2.4 ? 10 : 0.5;                  // 중심 뜨겁게·바깥 차갑게
          ents.push({ cx: cen + x, cy: cen + y, cz: cen, mass: 1, px: 0, py: 0, pz: 0, KEcm: 0, internalE: u, energy: u, radius: 1.2 });
        }
        w.__entities = ents;
        w.__h = Math.max(2.5, N * 0.11);
      },
      advance(w) {
        if (!w.__entities) return;
        HTJSPH.sphThermalConduction(w.__entities, 0.4, { kappa: 0.06, h: w.__h });   // 전도만 — 위치 고정(운동 없음)
        for (const e of w.__entities) e.peak = Math.min(1, (e.internalE / e.mass) / 10) * 3;   // 절대 온도 색(초기 코어=10)
      },
      note: '<b>이웃 사이로 열을 흘려 온도 차를 평형화한다 — 0002 확산(열역학 제2법칙)의 SPH 판</b>(구체 세계 SW5 "압력·<b>확산</b>"). <b>▶ 무엇</b>: 0046 점성이 <b>bulk 운동</b>을 식혔다면, 이건 <b>온도 차</b>를 식힌다. 라플라시안의 SPH 근사(Brookshaw): <b>du_i/dt = Σ_j m_j(κ_i+κ_j)/(ρ_iρ_j)·(u_i−u_j)·(r_ij·∇_iW)/(r²+ε)</b>. r_ij·∇_iW &lt; 0(커널 단조 감소)이라 i 가 더 뜨거우면(u_i&gt;u_j) <b>i 는 식고 j 는 데움 = 열이 hot→cold 로</b> 흐른다. <b>화면</b>: 평면 원반(위치 고정·운동 없음)·중심을 뜨겁게(노랑) 바깥을 차갑게(파랑) 줬다 — 핫코어가 <b>바깥으로 확산</b>해 점점 <b>균일한 미지근(보라)</b>으로(코어 u 10→2.4·껍질 0.5→2.2·온도 분산 13.4→0.01). 색 = 온도(절대 스케일). <b>두 보존·한 비가역</b>: 쌍 계수 K_ij 가 <b>i↔j 대칭</b>(질량가중 교환 Σ m_i du_i=0) → <b>총 내부E 정확 보존</b>(319.00 불변·재분배만). 운동량·KE 는 <b>안 건드림</b>(전도는 열↔열·운동 무관) → 총E=Σ(KE+u) 자동 보존. 그러나 열은 <b>hot→cold 한 방향</b>뿐 → <b>온도 분산 단조↓ = 엔트로피↑·시간의 화살</b>(섞이기만·안 풀림·0002·0046 정신). <b>안정성</b>: explicit 확산은 조건부 안정 — dt·확산률 크면 발산 → <b>0012 advect 처럼 CFL 서브스텝</b>으로 감싸 어떤 dt 에도 안정(보존 불변). <b>왜 중요한가</b>: 격자 0002(확산)가 SPH 로 옮겨오면 <b>격자 유체가 하던 일을 구체가 대신</b>할 수 있다 — 격자 은퇴(SW5 최후)의 한 벽돌. <b>정직한 한계</b>: κ 등방·상수(이방·온도의존 전도 아님)·고정 h(적응-h 전도는 후속). 여기선 *열전도 한 가지*만.'
    },

    // ── step_0052 — SW5 복사 냉각: 가스가 제 열을 빛으로 내보내 식는다(계의 첫 sink) ──
    //   u_i ← u_floor+(u_i−u_floor)(1−dt·coolRate)·radiated += 잃은 열. 0005/0013 의 SPH 판. 핫코어가 *제자리에서* 어두워짐
    //   (전도 0049 처럼 안 퍼지고 *사라짐* = 에너지가 빛으로 계를 떠남). 위치 고정 평면 원반·색=온도(절대).
    '0052': {
      label: 'step_0052 — SW5 복사 냉각(열의 출구=빛·계의 첫 sink)', title: 'HTJ — SW5 복사 냉각: 가스가 제 열을 빛으로 내보내 식는다',
      sub: 'SPH 복사 냉각 — 각 입자가 제 내부E 일부를 회색 복사(빛)로 방출해 식는다 = 0005/0013(열의 출구=빛·질량 보존)의 SPH 판. 압력·점성·전도는 에너지를 *재분배*만 하지만(KE↔U·U↔U), 이건 계 밖으로 *내보내는* 첫 sink. 핫코어가 전도(0049)처럼 퍼지지 않고 제자리서 어두워진다(에너지가 빛으로 계를 떠남). 위치 고정 평면 원반·색=온도(절대)·열+빛 합 일정·질량 불변',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'absolute', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, R = N * 0.42, SP = Math.max(1.6, N * 0.05);
        const ents = [];
        for (let x = -R; x <= R; x += SP) for (let y = -R; y <= R; y += SP) {   // 평면 원반(z=0)
          const r = Math.sqrt(x * x + y * y); if (r > R) continue;
          const u = r < R / 2.2 ? 10 : 2;                    // 중심 뜨겁게·바깥 미지근
          ents.push({ cx: cen + x, cy: cen + y, cz: cen, mass: 1, px: 0, py: 0, pz: 0, KEcm: 0, internalE: u, energy: u, radiated: 0, radius: 1.3 });
        }
        w.__entities = ents;
      },
      advance(w) {
        if (!w.__entities) return;
        HTJSPH.sphRadiativeCooling(w.__entities, 0.2, { coolRate: 0.5, floor: 0.3 });   // 복사만 — 위치 고정·O(N)
        for (const e of w.__entities) e.peak = Math.min(1, (e.internalE / e.mass) / 10) * 3;   // 절대 온도 색(초기 코어=10)
      },
      note: '<b>가스가 제 열을 빛으로 내보내 식는다 — 계의 첫 에너지 sink</b>(구체 세계 SW5·0005/0013 의 SPH 판). <b>▶ 무엇</b>: 지금까지 SPH 의 압력(0041)·점성(0046)·전도(0049)는 에너지를 <b>재분배만</b> 했다 — KE↔내부E, 내부E↔내부E. 계 밖으로 <b>나갈 출구가 없어</b> 붕괴열이 갇힌다(점성·전도는 열을 *옮길* 뿐 못 버린다). 이 법칙은 그 출구 = <b>빛</b>: 광학적으로 얇은 회색 복사로 각 입자가 제 내부E 일부를 방출한다 — <b>u_i ← u_floor + (u_i−u_floor)·(1−dt·coolRate)</b>, 잃은 열은 <b>radiated 장부</b>(빛)로 쌓인다. <b>화면</b>: 평면 원반(위치 고정)·중심을 뜨겁게(노랑) 줬다 — 핫코어가 <b>제자리에서 어두워진다</b>(코어 u 10→0.4). <b>전도(0049)와 대비</b>: 전도는 열을 바깥으로 *퍼뜨려* 균일하게 만들었지만, 복사는 <b>안 퍼지고 그냥 사라진다</b>(에너지가 빛으로 계를 떠남). <b>보존</b>: 빛은 <b>열에서</b> 나오지 질량 아님(0005 질량소실 닫음) → ρ(질량)·운동량·KE <b>불변</b>, 총E=KE+u 만 줄어든다(빛이 계를 떠나). <b>열+빛 합 일정</b>(계 내부E 816→71 + 방출 빛 0→745 = 816 불변·회계). u_floor(바닥 복사장·CMB 류) 아래론 안 식는다. <b>왜 중요한가</b>: <b>0013 이 0012 runaway 를 닫았듯</b>, 이 sink 가 있어야 가스가 *진짜로 식어 정착*한다 — 격자의 별-탄생 파이프라인(붕괴→가열→<b>복사→정착</b>)을 구체가 온전히 대신하는 한 벽돌(격자 은퇴). <b>정직한 한계</b>: 회색 복사(주파수 무관·광학적으로 얇음=흡수 없음)·점화(발열 source)는 후속(0004 의 SPH 판). 여기선 *복사 냉각 한 가지*만.'
    },

    // ── step_0053 — SW5 점화: 충분히 뜨거우면 불붙어 빛난다(별 vs 별 아님·0004 의 SPH 판) ──
    //   u≥uCrit & fuel>0 → burn=min(fuel,rate·m·dt)·internalE += burn. 0052 복사와 짝지어 발열↔복사 균형=정상상태 별.
    //   위치 고정 원반·따뜻한 코어(u≥uCrit) 불붙어 노랑·찬 가장자리(u<uCrit) 어두움. 색=온도.
    '0053': {
