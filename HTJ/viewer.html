<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTJ Viewer — 에너지 흐름(열역학 제2법칙)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0c10; color: #c8d0dc; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display: flex; height: 100%; }
  #panel { width: 248px; flex: none; padding: 14px; border-right: 1px solid #1c2230; overflow: auto; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #cv { display: block; width: 100%; height: 100%; }
  h1 { font-size: 14px; margin: 0 0 2px; color: #e6ecf5; }
  .sub { color: #6b778a; margin: 0 0 14px; font-size: 11px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { width: 72px; color: #8a96a8; }
  button { background: #18202e; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 5px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #212c3e; }
  button.primary { background: #1f3a5c; border-color: #2f5688; }
  input[type=number] { width: 64px; background: #11151d; color: #c8d0dc; border: 1px solid #2a3344; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .stat { color: #8a96a8; font-size: 11px; margin-top: 12px; border-top: 1px solid #1c2230; padding-top: 10px; }
  .stat b { color: #c8d0dc; font-weight: 600; }
  .note { color: #5b6678; font-size: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>HTJ — 에너지 흐름</h1>
    <p class="sub">열역학 제2법칙 = 확산 (step_0002)</p>

    <div class="row"><label>N (격자)</label><input id="N" type="number" min="4" max="48" step="1" value="24" /></div>
    <div class="row"><label>α (확산율)</label><input id="alpha" type="number" min="0" max="0.166" step="0.01" value="0.14" /></div>
    <div class="row"><label>핫반폭</label><input id="half" type="number" min="0" max="6" step="1" value="0" /></div>
    <div class="row">
      <button id="play" class="primary">▶ 흐름</button>
      <button id="step">스텝</button>
      <button id="reset">리셋</button>
    </div>
    <div class="row">
      <button id="capture">📷 캡처(PNG)</button>
    </div>

    <div class="stat">
      <div>tick: <b id="s-tick">0</b></div>
      <div>총 에너지: <b id="s-total">0</b> <span style="color:#5b6678">(보존)</span></div>
      <div>엔트로피: <b id="s-entropy">0</b> nats <span style="color:#5b6678">(↑)</span></div>
      <div>점유 셀: <b id="s-occ">0</b> / <span id="s-cells">0</span></div>
      <div>최대 E: <b id="s-max">0</b></div>
    </div>
    <p class="note">드래그=회전 · 휠=줌 · 우클릭 드래그=이동.<br />
      중앙에 모은 에너지가 이웃으로 흐른다. 총량은 *보존*되고 엔트로피는 *증가* — 뜨거운 덩어리가 식으며 퍼져 결국 균일(열적 죽음)로 간다. 색=에너지 밀도(청=차가움→적=뜨거움).</p>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<!-- 세계(법칙)는 engine/, 그리기는 viewer/ — viewer 는 engine 을 *읽기만* 한다(단방향). -->
<script src="engine/htj-world.js"></script>
<script src="engine/htj-energy.js"></script>
<script src="viewer/htj-render.js"></script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const cam = HTJRender.defaultCamera();
  let world = null, tick = 0, surf = 0, playing = false, mode = 'energy';

  function resize() {
    const r = cv.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, (r.width * dpr) | 0);
    cv.height = Math.max(2, (r.height * dpr) | 0);
    render();
  }

  function readN() { return Math.max(4, Math.min(48, parseInt(document.getElementById('N').value, 10) || 24)); }
  function readAlpha() { return Math.max(0, Math.min(HTJEnergy.ALPHA_MAX, parseFloat(document.getElementById('alpha').value) || 0)); }
  function readHalf() { return Math.max(0, Math.min(6, parseInt(document.getElementById('half').value, 10) || 0)); }

  // 리셋 — 중앙에 에너지를 모은 초기조건(최소 엔트로피 출발).
  function reset() {
    world = HTJWorld.createWorld(readN());
    HTJEnergy.seedHotSpot(world, { E0: 1000, half: readHalf() });
    tick = 0;
    render();
    updateStats();
  }

  function updateStats() {
    document.getElementById('s-tick').textContent = tick;
    document.getElementById('s-total').textContent = world.total('energy').toFixed(2);
    document.getElementById('s-entropy').textContent = HTJEnergy.entropy(world).toFixed(4);
    document.getElementById('s-occ').textContent = world.count('energy', 1e-9);
    document.getElementById('s-cells').textContent = world.fields.energy.length;
    document.getElementById('s-max').textContent = world.max('energy').toFixed(3);
  }

  function render() {
    if (!world) return;
    // energy 모드 = 히트 램프(확산 흐름) / cells 모드 = 팔레트(무대 데모 공). 둘 다 'energy' 장.
    surf = HTJRender.draw(ctx, world, cam, mode === 'energy'
      ? { field: 'energy', colormap: 'heat' }
      : { field: 'energy', colormap: 'palette' });
  }

  // 스텝 — 확산 1회(에너지가 이웃으로 흐른다). 이것이 세계를 굴리는 법칙.
  function stepOnce() { HTJEnergy.diffuseEnergy(world, readAlpha()); tick++; render(); updateStats(); }

  // 흐름 — 확산을 연속 재생(시점 회전이 아니라 *세계의 동역학*).
  let raf = 0;
  function loop() {
    if (!playing) return;
    HTJEnergy.diffuseEnergy(world, readAlpha()); tick++;
    render(); updateStats();
    raf = requestAnimationFrame(loop);
  }
  function setPlaying(on) {
    playing = on;
    document.getElementById('play').textContent = on ? '⏸ 멈춤' : '▶ 흐름';
    if (on) raf = requestAnimationFrame(loop); else cancelAnimationFrame(raf);
  }

  // ── 오빗 컨트롤 ──
  let drag = null;
  cv.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, b: e.button }; e.preventDefault(); });
  window.addEventListener('mouseup', () => drag = null);
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2) { cam.panX += dx; cam.panY += dy; }
    else { cam.yaw += dx * 0.01; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.01)); }
    render();
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { cam.zoom = Math.max(0.2, Math.min(5, cam.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); render(); e.preventDefault(); }, { passive: false });

  // ── 버튼 ──
  document.getElementById('play').onclick = () => setPlaying(!playing);
  document.getElementById('step').onclick = stepOnce;
  document.getElementById('reset').onclick = () => { setPlaying(false); reset(); };
  document.getElementById('N').onchange = () => { setPlaying(false); reset(); };
  document.getElementById('half').onchange = () => { setPlaying(false); reset(); };
  document.getElementById('capture').onclick = () => {
    const a = document.createElement('a');
    a.download = 'htj-energy.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', resize);

  // 헤드리스 캡처/검증용 전역 훅 — capture.js 가 이 핸들로 세계를 굴리고 그린다.
  window.HTJViewer = {
    get world() { return world; }, cam,
    setSize(w, h) { cv.width = w; cv.height = h; },
    // 에너지 모드(step_0002) — 중앙 핫스팟 초기화.
    energyInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJEnergy.seedHotSpot(world, opts || { E0: 1000, half: 0 });
      tick = 0;
    },
    diffuse(alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    entropy() { return HTJEnergy.entropy(world); },
    totalEnergy() { return world.total('energy'); },
    maxEnergy() { return world.max('energy'); },
    // 기반 무대 모드(step_0001 회귀 호환) — 데모 공(uint8 cells).
    reseed(N, seed) {
      mode = 'cells';
      world = HTJWorld.createWorld(N | 0);
      HTJWorld.seedBall(world, { seed: (seed >>> 0) });
      tick = 0; surf = 0;
    },
    setCamera(c) { Object.assign(cam, c); },
    render, get surf() { return surf; },
  };

  reset();
  resize();
})();
</script>
</body>
</html>
