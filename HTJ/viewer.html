      label: 'step_0053 — SW5 점화(별 vs 별 아님·핵융합 발열)', title: 'HTJ — SW5 점화: 충분히 뜨거우면 불붙어 빛난다',
      sub: 'SPH 점화 — 충분히 뜨거운(u≥uCrit) 입자가 연료를 태워 데운다(핵융합 발열 source) = 0004(임계 방출=별)·0003(potential→energy)의 SPH 판. 0052 복사(sink)와 짝지으면 발열↔복사가 균형 잡아 별이 virial 정상상태에서 빛난다. 위치 고정 원반: 따뜻한 코어(u≥uCrit)는 불붙어 노랑으로 빛나고, 찬 가장자리(u<uCrit)는 점화 못 해 복사로 어두워진다 = 별과 별 아닌 것의 경계. 연료↔열 보존·질량/운동량 불변',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'absolute', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, R = N * 0.42, SP = Math.max(1.6, N * 0.05);
        const ents = [];
        for (let x = -R; x <= R; x += SP) for (let y = -R; y <= R; y += SP) {   // 평면 원반(z=0)
          const r = Math.sqrt(x * x + y * y); if (r > R) continue;
          const u = r < R / 2.2 ? 2.0 : 0.4;                 // 코어 따뜻(≥uCrit)·가장자리 차가움(<uCrit)
          ents.push({ cx: cen + x, cy: cen + y, cz: cen, mass: 1, px: 0, py: 0, pz: 0, KEcm: 0, internalE: u, energy: u, fuel: 1e6, radius: 1.3 });
        }
        w.__entities = ents;
      },
      advance(w) {
        if (!w.__entities) return;
        HTJSPH.sphIgnition(w.__entities, 0.1, { rate: 1.5, uCrit: 1.5 });        // 점화(이 step)
        HTJSPH.sphRadiativeCooling(w.__entities, 0.1, { coolRate: 0.2, floor: 0.2 });   // 복사(0052) 균형
        for (const e of w.__entities) e.peak = Math.min(1, (e.internalE / e.mass) / 8) * 3;   // 절대 온도 색
      },
      note: '<b>충분히 뜨거우면 불붙어 빛난다 — 별과 별 아닌 것의 경계</b>(구체 세계 SW5·0004 의 SPH 판). <b>▶ 무엇</b>: 0052 복사는 열의 *출구*(sink)였다. 이 법칙은 열의 <b>입구(source) = 점화</b>: 별은 코어가 <b>충분히 뜨거우면</b>(u≥uCrit) 핵융합으로 불붙어 <b>연료를 열로</b> 바꾼다 — u≥uCrit & fuel&gt;0 → <b>burn = min(fuel, rate·m·dt)</b>, internalE += burn·fuel −= burn. 이게 <b>0004(임계 방출=별)·0003(potential→energy)의 SPH 판</b>. <b>화면</b>: 평면 원반(위치 고정)·코어를 따뜻하게(u=2≥uCrit) 가장자리를 차갑게(u=0.4&lt;uCrit) 줬다 — <b>코어는 불붙어 노랑으로 밝아지고</b>(u 2→6.7) <b>가장자리는 점화 못 해 복사로 어두워진다</b>(u 0.4→0.23). 임계 하나가 별과 가스를 가른다. <b>점화↔복사 정상상태</b>: 0052 복사와 짝지으면 <b>발열(점화)↔복사(0052)가 균형</b> 잡아 코어가 <b>runaway 도 cold 도 아닌 정상상태</b>(u* = rate(1−dt·c)/c)에서 빛난다 = <b>0013 이 0012 runaway 를 닫고 만든 virial 별</b>의 SPH 판. <b>보존</b>: 연료↔열 <b>Σ(fuel+internalE) 정확 보존</b>(연료가 열로 바뀔 뿐)·질량·운동량·KE 불변(0005 질량소실 닫음). <b>연료 유한</b> → 다 타면 꺼진다(무한 발열 없음). <b>왜 중요한가</b>: 이로써 격자 별-탄생 파이프라인(붕괴→가열→<b>점화</b>→복사→virial 정착)이 *구체로 완성*된다 — 격자의 signature 현상이 SPH 로 옮겨졌다(격자 은퇴). <b>정직한 한계</b>: 점화 조건은 온도 임계(밀도 임계는 옵션)·전체 붕괴→virial 별은 열압력 되먹임 균형이 섬세(여기선 위치 고정으로 점화 임계만 격리). 여기선 *점화 한 가지*만.'
    },

    // ── step_0054 — SW5 적응-h 압력 힘: 0048 측정의 힘 연동(대칭 평균 커널·SPH 물리 마무리) ──
    //   입자별 h_i 를 압력 힘에 쓴다. h_i≠h_j 면 ∇W̄_ij=½(∇W(h_i)+∇W(h_j)) 대칭 평균 → ∇_jW̄=−∇_iW̄ → 운동량 정확 보존.
    //   변밀도 구름: 코어=작은 커널(고분해)·헤일로=큰 커널(저분해) 공존·그림 r=h_i·색=분해능. 가변 h 여도 보존.
    '0054': {
      label: 'step_0054 — SW5 적응-h 압력 힘(분해능 연동·SPH 물리 마무리)', title: 'HTJ — SW5 적응-h 압력 힘: 분해능이 물질을 따라가며 힘이 보존된다',
      sub: '0048 이 측정만 한 입자별 h_i=η(m_i/ρ_i)^⅓ 를 압력 힘에 연동한다. 쌍 h_i≠h_j 면 ∇W 가 비대칭이라 운동량 보존이 깨질 위험 → 대칭 평균 커널 ∇W̄_ij=½(∇W(r,h_i)+∇W(r,h_j))로 막는다(W̄ 대칭 → ∇_jW̄=−∇_iW̄ → 순 운동량 정확 보존). 균일 h 면 0041 과 비트 동일(포섭). 변밀도 구름: 조밀 코어=작은 커널(고분해)·희박 헤일로=큰 커널(저분해)이 공존하며 힘이 운동량 보존. 그림 반지름=h_i·색=분해능',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'absolute', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        let seed = 5; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const ents = [];
        const shell = (n, rmin, rmax) => { for (let i = 0; i < n; i++) { const r = rmin + rnd() * (rmax - rmin), th = rnd() * 2 * Math.PI, ph = Math.acos(2 * rnd() - 1); const ux = Math.sin(ph) * Math.cos(th), uy = Math.sin(ph) * Math.sin(th), uz = Math.cos(ph); ents.push({ cx: cen + r * ux, cy: cen + r * uy, cz: cen + r * uz, mass: 1, px: 0, py: 0, pz: 0, KEcm: 0, internalE: 1, energy: 1, h: 3, density: 0, radius: 1 }); } };
        shell(110, 0, N * 0.08); shell(70, N * 0.13, N * 0.22);
        w.__entities = ents;
      },
      advance(w) {
        if (!w.__entities) return;
        HTJSPH.sphAdaptiveH(w.__entities, { eta: 1.3, h0: 3 });                  // 입자별 h_i·ρ_i 재적응(0048)
        HTJEntity.applyEntityGravity(w.__entities, 0.08, { G: 0.25, soft: 3 });    // 중력으로 묶고
        HTJSPH.sphPressureForceVarH(w.__entities, 0.08, { stiffness: 0.5, gamma: 2 });   // 적응-h 압력(이 step)
        HTJEntity.stepEntities(w.__entities, 0.08, { N: w.N });
        let hmin = Infinity, hmax = 0; for (const e of w.__entities) { if (e.h < hmin) hmin = e.h; if (e.h > hmax) hmax = e.h; }
        for (const e of w.__entities) { e.peak = hmax > hmin ? (1 - (e.h - hmin) / (hmax - hmin)) * 3 : 1.5; e.radius = Math.max(0.6, Math.min(3.5, e.h)); }   // 색=분해능·반지름=h_i
      },
      note: '<b>0048 이 *측정*만 한 입자별 분해능 h_i 를 이제 압력 힘이 *쓴다* — 분해능이 물질을 따라가며 힘이 보존된다</b>(구체 세계 SW5·SPH 물리 마무리). <b>▶ 무엇</b>: 0041 압력은 <b>고정 h</b> 였다. 0048 은 입자별 <b>h_i = η(m_i/ρ_i)^⅓</b> 를 자기일관으로 *재기만* 했다(조밀하면 좁은 h·희박하면 넓은 h). 이 법칙은 그 h_i 를 <b>압력 힘에 연동</b>한다. <b>난점</b>: 쌍 (i,j) 의 h_i≠h_j 면 ∇W(r,h_i)≠∇W(r,h_j) 라 <b>커널이 비대칭</b> → 뉴턴3(운동량 보존)이 깨질 위험. <b>해법 = 대칭 평균 커널</b>: <b>∇W̄_ij = ½(∇W(r,h_i)+∇W(r,h_j))</b>. W̄ 가 i↔j 대칭이라 <b>∇_jW̄_ji = −∇_iW̄_ij</b> → 쌍힘 +F/−F → <b>순 운동량 정확 보존</b>(가변 h 여도·verify 1.6e-14). <b>포섭</b>: 모든 h 동일이면 ∇W̄=∇W → <b>0041 과 비트 동일</b>(고정-h SPH 를 특수경우로 포함). <b>화면</b>: 변밀도 구름(중력으로 묶음)·그림 <b>반지름 = h_i</b>(커널이 보임)·색 = 분해능 — <b>조밀 코어엔 작은 커널 촘촘(노랑·고분해)·희박 헤일로엔 큰 커널(보라·저분해)</b>이 한 무대에 공존하며 적응-h 압력이 운동량을 정확 보존(h 범위 코어 0.4 ~ 헤일로 8.8 = ×20 가변). <b>왜 중요한가</b>(design §4·§6 SW5): 이게 <b>SW4 적응 LOD(분해능이 물질·관찰을 따라감)의 SPH 힘-레벨 완성</b> — 측정(0048)+힘(이 step)으로 SPH 솔버가 *가변 분해능*을 일관되게 다룬다. <b>SPH 물리 스택이 이로써 마무리</b>(밀도·압력·에너지·열압력·점성·전도·복사·점화·가속·적응-h). <b>정직한 한계</b>: grad-h Ω 보정(에너지 일관)은 생략(운동량엔 대칭만으로 충분)·점성/전도의 적응-h 도 같은 대칭-커널 패턴으로 확장(기계적 후속). 여기선 *적응-h 압력 한 가지*만.'
    },

    // ── step_0055 — SW5 격자 은퇴 자동 이주 트리거: 밀집 격자 영역 → SPH 입자 *이동*(격자에서 빠짐=은퇴) ──
    //   격자 유체가 붕괴하다 *충분히 밀집한*(ρ>trig) 셀이 SPH 입자로 옮겨가고 그 셀은 격자에서 비워진다(은퇴).
    //   복셀(붕괴하는 헤일로) + 구체(이주된 코어 SPH 입자) 공존 = 0035 autoPromote 의 *유체* 판. 이동이라 총량 보존.
    '0055': {
      label: 'step_0055 — SW5 자동 이주 트리거(밀집 격자 영역→SPH·격자 은퇴)', title: 'HTJ — SW5 자동 이주: 밀집 격자 유체가 SPH 입자로 옮겨가 격자가 은퇴한다',
      sub: '격자 유체가 자기중력으로 붕괴하다 충분히 밀집한(ρ>trig) 셀이 SPH 입자로 *이동*하고 그 셀은 격자에서 비워진다(은퇴) — 0035 autoPromote(동결 덩어리→구체)의 *유체* 판·0051 복사와 달리 *이동*이라 (격자+입자) 총량 정확 보존. 붕괴하는 복셀 헤일로 + 이주된 SPH 코어 입자가 공존하며 격자가 점차 은퇴',
      mode: 'energy', dynamics: true, render: 'hybrid',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        for (const nm of ['mom_x', 'mom_y', 'mom_z']) w.fields[nm] || w.addField(nm, { type: Float64Array });
        w.fields.therm || w.addField('therm');
        const N = w.N, cen = (N - 1) / 2, sig = N * 0.16;
        for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const d2 = (x - cen) ** 2 + (y - cen) ** 2 + (z - cen) ** 2, i = (z * N + y) * N + x;
          const r = 2.0 * Math.exp(-d2 / (2 * sig * sig)); w.fields.energy[i] = r; w.fields.therm[i] = r * 0.3;
        }
        updateTemperature(w);
        w.__hyb = { entities: [], trig: 3.2 };     // entities = 이주된 SPH 입자(hybrid 렌더가 읽음)·trig = 이주 임계 밀도
      },
      advance(w) {
        const H = w.__hyb, N = w.N, rho = w.fields.energy;
        // ① 격자 유체: 자기중력 붕괴 → 코어가 밀집(조건 충족 향해 감).
        HTJGravity.applyGravity(w, 0.2, { G: 0.25, iters: 40 });
        HTJThermal.applyThermalPressure(w, 0.2, { Kth: 0.3, gamma: 5 / 3 });
        HTJInertia.advect(w, 0.2, { scalars: ['therm'] });
        // ② 자동 이주 트리거: 충분히 밀집한(ρ>trig) 셀을 SPH 입자로 *이동*(격자에서 비움=은퇴).
        const res = HTJSPH.migrateRegionToSPH(w, { region: (x, y, z) => rho[(z * N + y) * N + x] > H.trig, threshold: H.trig });
        for (const p of res.particles) { p.h = 2.2; H.entities.push(p); }
        // ③ 이주된 SPH 입자: 서로 중력 + 열압력으로 자유 붕괴(격자가 못 하던 Lagrangian 거동).
        if (H.entities.length >= 1) {
          HTJEntity.applyEntityGravity(H.entities, 0.12, { G: 0.25, soft: 2.5 });
          HTJSPH.sphThermalPressureForce(H.entities, 0.12, { gamma: 5 / 3, h: 2.2 });
          HTJEntity.stepEntities(H.entities, 0.12, { N });
        }
        updateTemperature(w);
      },
      note: '<b>밀집한 격자 유체가 SPH 입자로 옮겨가고 그 자리의 격자는 비워진다 — 격자가 점차 은퇴한다</b>(구체 세계 SW5·격자 은퇴 엮기의 첫 live 장면). <b>▶ 무엇</b>: SW5 의 최종 목적지는 <b>격자 유체를 구체(SPH)로 옮겨 격자를 은퇴</b>시키는 것(design §6). 0051 은 그 *이주 메커니즘*을 격자장을 <b>읽어 복사</b>로 보였다(격자·입자 중복). 이 step 은 그 <b>*이동* 판 = 자동 이주 트리거</b>: 격자 유체가 자기중력으로 붕괴하다 <b>충분히 밀집한 셀</b>(ρ&gt;trig)이 <b>SPH 입자로 옮겨가고, 그 셀은 격자에서 비워진다</b>(rho·운동량·내부E=0). 이게 <b>0035 autoPromote(동결 덩어리를 격자에서 빼내 구체로)의 *유체* 판</b> — 조건(동결 대신 <b>밀집</b>) 충족 영역이 격자에서 빠져나간다. <b>화면</b>: 처음엔 가우시안 블롭이 <b>복셀</b>(격자)로 보인다 → 중력으로 붕괴해 코어가 밀집 → 코어가 임계를 넘는 순간부터 <b>구체(SPH 입자)로 옮겨가고 격자엔 구멍이 생긴다</b> → 옮겨간 입자는 <b>SPH 압력+중력으로 자유 붕괴</b>(Eulerian 격자가 못 하던 Lagrangian 거동)·바깥 헤일로는 아직 격자(복셀)로 남아 흐른다 = <b>두 표현 공존·격자 점진 은퇴</b>. <b>왜 *이동*인가</b>(0051 복사와의 차이): 복사는 (격자+입자) 합이 <b>배가</b>되지만(이중 계산), 이동은 물질이 한 표현에서 다른 표현으로 *옮겨가* <b>(남은 격자 + 입자) 총량이 정확 불변</b> — 이게 "은퇴"의 핵심(이중 표현 방지). 질량·운동량·내부E·KE 정확 보존(verify Δ≈1e-13). <b>왜 중요한가</b>(design §5 난점 3·4): 격자는 *임시 비계*였다 — 구체가 승격돼 나오면 은퇴한다. 이 트리거가 그 은퇴를 <b>자동·가법적</b>으로 굴린다(big-bang 재작성 회피). <b>정직한 한계</b>: 일방(SPH→격자 역이주는 없음·0031 자동 강등의 SPH 판은 후속)·이주된 입자는 격자 중력과 결합 안 함(개체끼리만·통합 중력 0033 의 SPH 판은 후속)·밀집 임계는 장면 노브(결정론 임계 아님). 여기선 *밀집→이주 트리거 한 가지*만.'
    },

    // ── step_0056 — TW1 산 = 딛는 지형 표면: 기복 정적 앵커 위에 작은 구체가 떨어져 정착(환경 트랙 첫 벽돌) ──
    //   design/environment.md §3 TW1. 지면(중력원·큰 앵커) + 산(저질량 앵커 = 고체 돌출). 작은 구체가 떨어져
    //   반발+감쇠(0037)로 표면 위에 정착. 마찰 없어(SW2 한계) 경사면선 낮은 데로 굴러내림(창발). 앵커는 정적(고정).
    '0056': {
      label: 'step_0056 — TW1 산=딛는 지형 표면(구체가 지형 위에 정착)', title: 'HTJ — TW1 산 = 딛는 지형 표면: 작은 구체가 기복 지형 위에 떨어져 선다',
      sub: '환경 트랙(오픈월드)의 첫 벽돌 — 기복 있는 정적 앵커 지형(지면 + 산 = 모양은 구체 배열에 담김) 위에 작은 구체(캐릭터 대리)가 떨어져 중력↓+접촉 반발↑ 균형으로 정착(딛기). 새 엔진 법칙 0 = 중력(0028)+접촉(0037) 조립. 지형=정적 앵커(질량 무한 극한·외부 경계, 지구처럼). 마찰 없어(SW2 한계) 경사면선 낮은 데로 굴러내림(창발)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const groundR = N * 0.26, mountR = N * 0.10, smallR = N * 0.05;
        const mk = (cx, cy, cz, mass, r, anchored) => ({ cx, cy, cz, mass, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: (4 * Math.PI / 3) * r * r * r, radius: r, temp: 0, peak: 0.15, anchored: !!anchored });
        const ents = [];
        ents.push(mk(cen, cen, cen, 6e4, groundR, true));                                  // 지면(중력원·큰 앵커)
        ents.push(mk(cen, cen, cen + groundR + mountR * 0.8, 1, mountR, true));             // 산 1(저질량 앵커=고체 돌출)
        ents.push(mk(cen + groundR * 0.7, cen, cen + groundR * 0.62, 1, mountR * 0.85, true)); // 산 2(옆 봉우리)
        // 작은 구체들 — +z 반구 위에 황금각으로 흩뿌려 떨어뜨림(표면을 덮는 층으로 정착).
        const gold = Math.PI * (3 - Math.sqrt(5)), nSmall = 16, dropR = N * 0.46;
        for (let i = 0; i < nSmall; i++) {
          const zf = 0.2 + 0.75 * (i + 0.5) / nSmall, rr = Math.sqrt(Math.max(0, 1 - zf * zf)), th = gold * i;
          ents.push(mk(cen + Math.cos(th) * rr * dropR, cen + Math.sin(th) * rr * dropR * 0.6, cen + zf * dropR + 2, 70, smallR, false));
        }
        w.__entities = ents;
        w.__saved = ents.map(e => ({ cx: e.cx, cy: e.cy, cz: e.cz }));
        w.__gopt = { G: 8e-4, soft: N * 0.08 };       // 지면이 작은 구체를 끈다(중력↓)
        w.__copt = { k: 14, cDamp: 42 };              // 반발(떠받침) + 강한 감쇠(빨리 정착)
      },
      advance(w) {
        if (!w.__entities) return;
        HTJEntity.applyEntityGravity(w.__entities, 0.25, w.__gopt);   // 중력↓(0028)
        HTJEntity.applyEntityContact(w.__entities, 0.25, w.__copt);   // 접촉↑ 반발+감쇠(0037)
        HTJEntity.stepEntities(w.__entities, 0.25);
        // 정적 앵커 고정 — 지형은 힘 받아도 위치 불변(질량 무한 극한·environment §4). engine 은 안 건드림.
        const es = w.__entities, sv = w.__saved;
        for (let i = 0; i < es.length; i++) if (es[i].anchored) { es[i].cx = sv[i].cx; es[i].cy = sv[i].cy; es[i].cz = sv[i].cz; es[i].px = es[i].py = es[i].pz = 0; es[i].KEcm = 0; }
        // 색 = 속도(빠름=뜨겁게·느림=차갑게) → 정착하며 식어 보임. 앵커는 어둡게(지형).
        let vmax = 0; for (const e of es) if (!e.anchored) { const v = Math.hypot(e.px, e.py, e.pz) / e.mass; if (v > vmax) vmax = v; }
        for (const e of es) e.peak = e.anchored ? 0.15 : (vmax > 0 ? Math.min(1, (Math.hypot(e.px, e.py, e.pz) / e.mass) / vmax) : 0);
      },
      note: '<b>작은 구체(캐릭터 대리)가 기복 있는 지형 위에 떨어져 딛고 선다</b>(환경 트랙 = 오픈월드의 첫 벽돌). <b>▶ 무엇</b>(design/environment.md §3 TW1): 오픈월드 MMORPG 의 본질은 <b>딛고 다닐 광활한 환경</b>이다. 그 첫 조각 = <b>산·지면</b>. sphere-world 의 접촉(0037)이 *단일* 큰 구체 위 쌓임을 보였다면, 이건 그 <b>환경 스케일 판</b>: 지면(큰 앵커) + 산(돌출 앵커)으로 <b>기복 있는 지형</b>을 만들고(모양은 *구체 배열*에 담긴다·sphere-world §3 "지형 디테일") 그 위에 작은 구체를 떨어뜨린다. <b>새 엔진 법칙은 0</b> — 중력(0028)+접촉 반발·소산(0037)을 *조립*해 새 무대에서 굴렸다(0035·0043 류). <b>화면</b>: 작은 구체들이 위에서 떨어져(파랑=빠름) → 지형 표면에 닿아 <b>반발로 떠받쳐지고 감쇠로 멈춘다</b>(노랑→식어 정착) → 표면 위에 <b>딛고 선다</b> = "선 캐릭터 = 중력(무게)↓ + 접촉 반발(떠받침)↑ 균형". <b>지형은 정적 앵커</b>: 힘을 받아도 위치 불변(질량 무한 극한·<b>외부 경계</b>로서 충격 흡수 — 지구처럼, 점프해도 지구는 안 밀린다). 큰 질량 구체끼리의 비현실적 중력 폭발도 이 극한이 피한다. <b>창발 + 정직한 한계</b>: <b>마찰이 없어</b>(SW2 는 법선 접촉만) 경사면에선 못 서고 <b>낮은 데(골)로 굴러내려 모인다</b> — 이건 물리적으로 옳고, 동시에 "<b>딛는 표면엔 마찰이 필요하다</b>"를 드러낸다(다음 환경 벽돌의 씨앗·바다 TW2·강 TW3·광활 LOD TW4 와 함께). <b>왜 중요한가</b>: 이게 동역학(궤도·강착)만 있던 구체 세계에 처음으로 <b>딛고 다닐 환경</b>을 들이는 첫 걸음 — 산도 캐릭터도 *같은 구체*, 크기·배열·정적/자유만 다르다.'
    },

    // ── step_0057 — TW1 마찰: 접촉의 접선 저항(Coulomb + 구름) → 안식각(구가 더미로 쌓인다) ──
    //   0056 이 드러낸 격차("마찰 없어 경사면 못 서고 골로 미끄러짐")를 메우는 새 엔진 법칙. 마찰의 진짜 효과
    //   = 안식각: 마찰 없으면 구가 액체처럼 퍼지고, 있으면 쌓여 더미(딛는 표면이 모양 유지). 접촉점 작용→각운동량 보존.
    '0057': {
      label: 'step_0057 — TW1 마찰(접선 저항·구름 → 안식각·더미로 쌓임)', title: 'HTJ — TW1 마찰: 구가 더미로 쌓인다(안식각) — 딛는 표면이 모양을 유지',
      sub: '접촉(0037)의 *법선* 반발/감쇠가 못 막는 접선 상대 운동에 저항(Coulomb 마찰 |F_t|≤μ·F_n + 구름). 0056 격차("마찰 없어 경사면 못 서고 골로 미끄러짐") 메움. 진짜 효과 = 안식각: 마찰 없으면 구가 액체처럼 퍼지고, 있으면 *쌓여 더미*. 올바른 마찰은 접촉점에 작용해 스핀(구름)으로 각운동량을 넘긴다 → 운동량·각운동량·총E 정확 보존',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const R = N * 1.1, sr = N * 0.024, gold = Math.PI * (3 - Math.sqrt(5));
        const topZ = cen + N * 0.16;                                       // 지면 꼭대기(국소 평평)
        const mk = (cx, cy, cz, mass, r, anchored) => ({ cx, cy, cz, mass, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: (4 * Math.PI / 3) * r * r * r, radius: r, temp: 0, peak: 0.15, anchored: !!anchored });
        const ents = [mk(cen, cen, topZ - R, 1e6, R, true)];              // 지면 = 큰 앵커(꼭대기 평평·중력원)
        // 작은 구체들 — 꼭대기에 좁은 기둥으로 떨궈 쌓는다(마찰이 더미로 잡음).
        for (let i = 0; i < 26; i++) {
          const rr = Math.sqrt(i / 26) * N * 0.05, th = gold * i;
          ents.push(mk(cen + Math.cos(th) * rr, cen + Math.sin(th) * rr, topZ + N * 0.08 + i * sr * 0.8, 50, sr, false));
        }
        w.__entities = ents;
        w.__saved = ents.map(e => ({ cx: e.cx, cy: e.cy, cz: e.cz }));
        w.__gopt = { G: 0.28 * R * R / 1e6, soft: N * 0.06 };             // 꼭대기 가속 ≈0.28(아래로)
        w.__copt = { k: 22, cDamp: 22 };
        w.__fopt = { k: 22, mu: 0.9 };                                    // 마찰(접선 저항·구름)
      },
      advance(w) {
        if (!w.__entities) return;
        const es = w.__entities;
        HTJEntity.applyEntityGravity(es, 0.25, w.__gopt);    // 중력↓(0028)
        HTJEntity.applyEntityContact(es, 0.25, w.__copt);    // 접촉↑ 반발+법선 감쇠(0037)
        HTJEntity.applyEntityFriction(es, 0.25, w.__fopt);   // 마찰↗ 접선 저항+구름(0057·신규)
        HTJEntity.stepEntities(es, 0.25);
        const sv = w.__saved;                                // 정적 앵커 고정(지면)
        for (let i = 0; i < es.length; i++) if (es[i].anchored) { es[i].cx = sv[i].cx; es[i].cy = sv[i].cy; es[i].cz = sv[i].cz; es[i].px = es[i].py = es[i].pz = 0; es[i].KEcm = 0; es[i].Lx = es[i].Ly = es[i].Lz = 0; }
        let vmax = 0; for (const e of es) if (!e.anchored) { const v = Math.hypot(e.px, e.py, e.pz) / e.mass; if (v > vmax) vmax = v; }
        for (const e of es) e.peak = e.anchored ? 0.15 : (vmax > 0 ? Math.min(1, (Math.hypot(e.px, e.py, e.pz) / e.mass) / vmax) : 0);
      },
      note: '<b>마찰이 구를 더미로 쌓는다 — 딛는 표면이 모양을 유지한다</b>(안식각·angle of repose). <b>▶ 무엇</b>(design/environment.md §3 TW1): 0056 이 드러낸 격차 — 접촉(0037)은 <b>법선</b> 반발·감쇠만이라 <b>접선 방향(미끄럼)</b>을 못 막아, 구가 경사에서 골로 미끄러져 모였다("딛는 표면엔 마찰이 필요"). 이 step 이 그 <b>마찰</b>을 새 엔진 법칙으로 더한다. <b>Coulomb 마찰</b>: 접선력 |F_t| ≤ μ·F_n(F_n=반발력) — 미끄럼이 크면 동마찰(점성, μ·F_n 상한)로 <b>KE→열</b> 소산, 작으면 접선 운동을 0 까지만 잡아 <b>구름</b>(rolling)으로 넘긴다. <b>왜 접촉점인가</b>: 접선력을 *중심*에 걸면 각운동량이 깨진다 — 올바른 마찰은 <b>접촉점</b>에 작용해 구를 <b>스핀</b>(ω=L/I, I=⅖mr²)시킨다. 단일 접촉점으로 양 구의 지렛대를 맞추면 ΔL_total=0 → <b>각운동량 정확 보존</b>. <b>화면</b>: 작은 구체들이 꼭대기에 좁은 기둥으로 떨어져 → 마찰이 서로·바닥을 <b>붙잡아</b> 옆으로 흘러내리지 않고 <b>더미로 쌓인다</b>(색=속도, 식어 정착). <b>대조</b>(capture.png): 같은 더미를 <b>마찰 없이</b> 떨구면 액체처럼 <b>퍼져 팬케이크</b>(수평 반경 RMS 18.7)가 되지만, <b>마찰 있으면</b> 좁은 <b>더미</b>(9.5·51%)로 머문다. 이게 "<b>딛는 표면이 모양을 유지</b>"의 핵심 — 모래·흙·바위가 산·언덕으로 *쌓이는* 이유. <b>보존</b>: 운동량(equal-opposite 쌍힘)·각운동량(접촉점 단일화)·총E(잃은 병진 KE→internalE, merge 규약 계승·스핀 KE 도 internalE 에 lump) 정확 보존. <b>왜 중요한가</b>: 마찰은 강체 구가 <b>경사에 못 서는</b>(늘 구름) 물리적 진실 위에서, 알갱이들이 <b>더미·경사를 이루게</b> 하는 법칙 — 지형이 평평하게 무너지지 않고 <b>산·언덕의 모양을 유지</b>하게 한다. <b>정직한 한계</b>: 스핀 KE 를 internalE 에 lump(별도 회전E 장 없음·merge 와 동일 규약)·단일 μ(정/동마찰 구분 없음·속도 무관)·구름 저항(rolling resistance) 없음(굴러가면 안 멈춤)·점착(cohesion) 없음. 다음 환경 벽돌: 바다 TW2(SPH 수면)·강 TW3(흐름)·광활 LOD TW4.'
    },

    // ── step_0058 — TW1 구름 저항: 굴러가다 멈춰 가파른 안식각(진짜 산 더미가 솟는다) ──
    //   0057 마찰은 미끄럼만 막아 구가 굴러 퍼져 더미가 완만했다(10°). 구름 저항이 *구름 자체*를 막아 가파른 산(28°).
    //   상대 구름 ω_rel 에 반대 토크 쌍 → 총 각운동량 보존·운동량 불변·총E 보존. design/environment.md §3 TW1.
    '0058': {
      label: 'step_0058 — TW1 구름 저항(굴러가다 멈춰 산이 솟는다)', title: 'HTJ — TW1 구름 저항: 구체가 가파른 산으로 쌓인다(딛는 지형 창발)',
      sub: '마찰(0057)은 미끄럼을 막아도 구체는 자유로이 굴러 비탈을 흘러내려 안식각이 완만했다(납작한 더미·10°). 구름 저항은 그 구름 자체에 저항(상대 구름 각속도 ω_rel 에 반대 토크 쌍)해 굴러가다 멈추게 한다 → 가파른 안식각(28°·진짜 산). 토크 쌍이라 총 각운동량 정확 보존·운동량 불변·총E 보존(스핀 KE 는 internalE 에 lump)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const R = N * 0.85, sr = N * 0.022, gold = Math.PI * (3 - Math.sqrt(5));
        const topZ = cen - N * 0.30 + R;                                  // 바닥 곡선이 화면에 보이게(꼭대기 약간 위)
        const mk = (cx, cy, cz, mass, r, anc) => ({ cx, cy, cz, mass, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: (4 * Math.PI / 3) * r * r * r, radius: r, temp: 0, peak: 0.1, anchored: !!anc });
        const ents = [mk(cen, cen, topZ - R, 1e9, R, true)];             // 바닥 = 큰 앵커(중력원·정적)
        for (let i = 0; i < 90; i++) {                                    // 꼭대기에 뭉쳐 떨궈 산을 쌓는다
          const rr = Math.sqrt(i / 90) * N * 0.13, th = gold * i;
          ents.push(mk(cen + Math.cos(th) * rr, cen + Math.sin(th) * rr * 0.4, topZ + N * 0.06 + (i % 22) * sr * 0.8, 1, sr, false));
        }
        w.__entities = ents; w.__R = R; w.__topZ = topZ;
        w.__saved = ents.map(e => ({ cx: e.cx, cy: e.cy, cz: e.cz }));
        w.__gopt = { G: 0.3 * R * R / 1e9, soft: N * 0.06 };
        w.__copt = { k: 20, cDamp: 18 }; w.__fopt = { k: 20, mu: 0.9 }; w.__ropt = { k: 20, muRoll: 1.0 };
      },
      advance(w) {
        if (!w.__entities) return;
        const es = w.__entities;
        HTJEntity.applyEntityGravity(es, 0.25, w.__gopt);          // 중력↓(0028)
        HTJEntity.applyEntityContact(es, 0.25, w.__copt);          // 접촉↑ 반발+법선 감쇠(0037)
        HTJEntity.applyEntityFriction(es, 0.25, w.__fopt);         // 마찰↗ 접선 저항+구름(0057)
        HTJEntity.applyEntityRollingResistance(es, 0.25, w.__ropt);// 구름 저항 — 굴러가다 멈춤(0058·신규)
        HTJEntity.stepEntities(es, 0.25);
        const sv = w.__saved;                                      // 정적 앵커 고정(바닥)
        for (let i = 0; i < es.length; i++) if (es[i].anchored) { es[i].cx = sv[i].cx; es[i].cy = sv[i].cy; es[i].cz = sv[i].cz; es[i].px = es[i].py = es[i].pz = 0; es[i].KEcm = 0; es[i].Lx = es[i].Ly = es[i].Lz = 0; }
        // 색 = 높이(바닥 위) → 봉우리=뜨겁게(지형 윤곽이 읽힌다)·바닥 앵커=어둡게.
        const R = w.__R; let hmax = 1e-9;
        for (const e of es) if (!e.anchored) { const h = Math.hypot(e.cx - es[0].cx, e.cy - es[0].cy, e.cz - es[0].cz) - R; if (h > hmax) hmax = h; }
        for (const e of es) e.peak = e.anchored ? 0.1 : Math.max(0.12, Math.min(1, (Math.hypot(e.cx - es[0].cx, e.cy - es[0].cy, e.cz - es[0].cz) - R) / hmax));
      },
      note: '<b>구체가 굴러가다 멈춰 가파른 산으로 쌓인다 — 딛는 지형(언덕·산)이 창발한다</b>(안식각의 완성). <b>▶ 무엇</b>(design/environment.md §3 TW1): 0057 마찰은 <b>미끄럼</b>을 막았지만 구체는 여전히 <b>자유로이 굴러</b> 비탈을 데굴데굴 흘러내려, 더미가 <b>완만</b>했다(안식각 ~10°·납작). 진짜 산·언덕은 가파르다 — 빠진 건 <b>구름 저항</b>(rolling resistance). 이 step 이 그것을 새 엔진 법칙으로 더한다: 겹친 두 구의 <b>상대 구름 각속도</b> ω_rel=ω_a−ω_b(ω=L/I)에 <b>반대하는 토크 쌍</b>(a 에 −M·b 에 +M)이 <b>구름 자체를 멈춘다</b> → 굴러가다 서고, 안식각이 <b>가팔라진다</b>(~28°·진짜 산). <b>화면</b>: 작은 구체들이 꼭대기에 떨어져 → 마찰(0057)이 미끄럼을 잡고 <b>구름 저항</b>이 구름을 잡아, 옆으로 안 흘러내리고 <b>봉우리로 솟는다</b>(색=높이, 노랑=정상). <b>대조</b>(capture.png): 같은 구체를 구름 저항 <b>없이</b> 떨구면 굴러 <b>퍼져 팬케이크</b>(안식각 12°)지만, <b>있으면</b> 가파른 <b>산</b>(28°·바닥 위로 솟은 언덕)이 된다. <b>왜 토크 쌍인가</b>: 스핀끼리 주고받아(a 감속·b 가속) <b>순 각운동량 변화 0</b> → <b>총 각운동량 정확 보존</b>·운동량은 안 건드림(순수 토크). <b>보존</b>: 각운동량(토크 쌍)·운동량(불변)·총E(스핀 KE 는 internalE 에 lump·구름이 줄면 열로 재분류 → KEcm·internalE 불변=총E 보존) 정확. <b>왜 중요한가</b>: 마찰(0057)+구름 저항(0058)으로 알갱이가 <b>가파른 산·언덕을 이루고 유지</b>한다 = "<b>딛는 지형이 손 안 대고 창발</b>"(author 가 아니라 구체 법칙이 쌓은 산). 산도 모래도 같은 구체 — 법칙이 쌓는다. <b>정직한 한계</b>: 28° 입상 안식각(가파른 암벽엔 점착 cohesion 필요)·낮은 둔덕 규모(스케일·연속 표면은 TW4 LOD)·단일 μ_r(속도 무관)·스핀 KE 를 internalE 에 lump. 다음 환경 벽돌: 바다 TW2(SPH 수면)·강 TW3(흐름)·광활 LOD TW4.'
    },

    // ── step_0059 — TW1 펼쳐진 지형: 높이장 봉우리·계곡 위에 대량 구체가 정착·계곡에 모인다 ──
    //   0056~0058(딛는 지형 물리)을 *펼쳐진 연속 지형*으로 키운 장면 step(새 엔진 법칙 0). 골격=바닥 구+높이장
    //   봉우리 앵커 카펫(seed)·그 위 구체 정착·계곡 모임=창발. design/environment.md §3 TW1.
    '0059': {
      label: 'step_0059 — TW1 펼쳐진 지형(산맥·계곡 위에 구체가 정착·계곡에 모임)', title: 'HTJ — TW1 펼쳐진 지형: 높이장 봉우리·계곡 위에 대량 구체가 정착한다',
      sub: '0056~0058(딛는 지형의 물리=정착·마찰·구름 저항)을 *펼쳐진 연속 지형*으로 키운다. 골격 = 큰 바닥 구(중력원·가둠) 위에 높이장으로 얹은 봉우리 앵커 카펫(여러 봉우리·계곡·seed). 그 위에 대량 구체가 떨어져 표면에 정착하고, 봉우리서 굴러내려 계곡(낮은 데)에 모인다 = 지형 위 거동이 구체 법칙으로 창발. 새 엔진 법칙 0(중력+접촉+마찰+구름 저항 조립)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const Rf = N * 1.4, AR = N * 0.10, sr = N * 0.026, SPC = N * 0.08, Wt = N * 0.40;
        const hf = (x, y) => N * 0.09 * Math.sin(0.36 / (N / 40) * x) * Math.cos(0.3 / (N / 40) * y) + N * 0.06 * Math.sin((0.24 * x + 0.2 * y) / (N / 40));
        const mk = (cx, cy, cz, mass, r, anc) => ({ cx, cy, cz, mass, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: (4 * Math.PI / 3) * r * r * r, radius: r, temp: 0, peak: 0.12, anchored: !!anc });
        // 바닥 구(중력원·가둠)는 화면 아래에 두고, 그 +z 극에 높이장 봉우리 카펫을 깐다.
        const topZ = cen + N * 0.18;                                     // 지형 표면이 화면 가운데쯤
        const ents = [mk(cen, cen, topZ - Rf, 1e9, Rf, true)];
        for (let gx = -Wt; gx <= Wt; gx += SPC) for (let gy = -Wt; gy <= Wt; gy += SPC)
          ents.push(mk(cen + gx, cen + gy, topZ + hf(gx, gy), 1, AR, true));   // 봉우리(저질량=고체·중력 영향 없음)
        const gold = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < 110; i++) { const rr = Math.sqrt((i + 0.5) / 110) * Wt * 0.7, th = gold * i;
          ents.push(mk(cen + Math.cos(th) * rr, cen + Math.sin(th) * rr, topZ + N * 0.28 + (i % 10) * sr * 0.6, 50, sr, false)); }
        w.__entities = ents; w.__saved = ents.map(e => ({ cx: e.cx, cy: e.cy, cz: e.cz })); w.__topZ = topZ;
        w.__gopt = { G: 0.2 * Rf * Rf / 1e9, soft: N * 0.06 };
        w.__copt = { k: 40, cDamp: 25 }; w.__fopt = { k: 40, mu: 0.9 }; w.__ropt = { k: 40, muRoll: 1.5 };
      },
      advance(w) {
        if (!w.__entities) return;
        const es = w.__entities;
        HTJEntity.applyEntityGravity(es, 0.12, w.__gopt);          // 방사 중력(바닥 구가 끈다·가둠)
        HTJEntity.applyEntityContact(es, 0.12, w.__copt);          // 접촉 반발+감쇠(0037)
        HTJEntity.applyEntityFriction(es, 0.12, w.__fopt);         // 마찰(0057)
        HTJEntity.applyEntityRollingResistance(es, 0.12, w.__ropt);// 구름 저항(0058)
        HTJEntity.stepEntities(es, 0.12);
        const sv = w.__saved;                                      // 지형 앵커 고정(정적)
        for (let i = 0; i < es.length; i++) if (es[i].anchored) { es[i].cx = sv[i].cx; es[i].cy = sv[i].cy; es[i].cz = sv[i].cz; es[i].px = es[i].py = es[i].pz = 0; es[i].Lx = es[i].Ly = es[i].Lz = 0; }
        // 색 = 높이(바닥 위) → 봉우리=뜨겁게·계곡=차갑게(지형 윤곽). 앵커는 어둡게.
        const topZ = w.__topZ; let hmin = 1e9, hmax = -1e9;
        for (const e of es) if (!e.anchored) { const h = e.cz - topZ; if (h < hmin) hmin = h; if (h > hmax) hmax = h; }
        for (const e of es) e.peak = e.anchored ? 0.12 : Math.max(0.15, Math.min(1, ((e.cz - topZ) - hmin) / (hmax - hmin + 1e-9)));
      },
      note: '<b>펼쳐진 연속 지형(여러 봉우리·계곡)이 만들어지고, 그 위에 대량 구체가 떨어져 표면에 정착·계곡에 모인다</b> — "이게 지형이다". <b>▶ 무엇</b>(design/environment.md §3 TW1): 0056~0058 로 딛는 지형의 <b>물리</b>(정착·마찰·구름 저항=안식각)는 섰지만, 보여줄 <b>지형 그 자체</b>는 author 한 구 2~3 개뿐이었다. 이 step 은 그것을 <b>펼쳐진 연속 지형</b>으로 키운다(새 엔진 법칙 0 = 중력·접촉·마찰·구름 저항 *조립* 장면). <b>골격</b>: 큰 바닥 구(중력원·구체를 가둠) 위에 <b>높이장</b>(사인 합)으로 얹은 <b>봉우리 앵커 카펫</b> — 여러 봉우리·계곡의 연속 표면(seed·environment §2 "큰 골격은 author"). <b>창발</b>: 그 위에 대량 구체가 떨어져 → 접촉(0037)으로 표면에 <b>정착</b>(딛기) → 마찰(0057)+구름 저항(0058)이 미끄럼·구름을 잡되, <b>봉우리(높은 데)서 굴러내려 계곡(낮은 데)에 모인다</b>(색=높이, 봉우리=노랑·계곡=파랑). 정착 구체 평균 지형높이 &lt;0 = <b>계곡 선호</b>(물·흙·돌이 낮은 데로 모이는 자연 거동). <b>왜 중요한가</b>: 지형의 큰 골격은 seed 하되, 그 위 <b>거동(정착·굴러내림·계곡 모임)은 구체 법칙이 굴러간 결과로 창발</b>한다 = "법칙은 author·구조는 창발"(environment §2 층위 하이브리드). 비로소 <b>딛고 다닐 펼쳐진 땅</b>의 첫 장면. <b>정직한 한계</b>: 봉우리 골격은 손수 배치한 높이장(절차 생성/무한 광활 아님)·바닥 구 방사 중력으로 국소 평지 근사(진짜 평지 아님)·아직 <b>작은 패치 규모</b>(km 지형·끝없이 펼침 = 스케일 분리는 TW4 LOD 의 몫)·지형은 정적 앵커(깎임·침식 없음). 다음 환경 벽돌: 바다 TW2(분지를 SPH 떼로 채워 수면)·강 TW3(경사 따라 흐름)·광활 LOD TW4.'
    },

    // ── step_0060 — TW2 바다: 물(SPH 입자)이 지형 분지에 고여 수평 수면(environment.md §3 TW2) ──
    //   새 엔진 법칙 sphBoundaryForce(물↔정적 지형 앵커 경계). 물이 지형을 통과하지 않고 분지에 갇혀,
    //   중력(아래)+SPH 압력(0041)이 물을 *수평 표면(등z)*으로 가라앉힌다. 지형=정적 앵커(0056/0059).
    '0060': {
      label: 'step_0060 — TW2 바다(물이 분지에 고여 수평 수면)', title: 'HTJ — TW2 바다: 물(SPH 입자)이 지형 분지에 고여 수평 수면을 이룬다',
      sub: '물(SPH 입자 떼)이 지형(정적 앵커) 분지에 떨어져 — 새 경계 법칙 sphBoundaryForce 로 지형을 통과하지 않고 갇히고, 중력(아래)+SPH 압력(0041)이 물을 수평 표면(등z·등퍼텐셜)으로 가라앉힌다. 환경 트랙 TW2. 보존: 질량·낙하 KE→열 소산·앵커=무한질량 외부 경계',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const Rf = N * 1.4, rimR = N * 0.30, hillR = N * 0.085, BR = N * 3;
        const topZ = cen + N * 0.10;                                   // 분지 바닥 표면(화면 가운데쯤)
        const floor = { cx: cen, cy: cen, cz: topZ - Rf, mass: 1e9, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: 0, radius: Rf, temp: 0, peak: 0.1 };
        // 보이는 분화구 테(rim) = 링 앵커(우물 벽 느낌·렌더+경계).
        const rim = [], NR = 14;
        for (let i = 0; i < NR; i++) { const a = i / NR * 2 * Math.PI;
          rim.push({ cx: cen + Math.cos(a) * rimR, cy: cen + Math.sin(a) * rimR, cz: topZ + hillR * 0.5, mass: 1e9, px: 0, py: 0, pz: 0,
            Lx: 0, Ly: 0, Lz: 0, KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: 0, radius: hillR, temp: 0, peak: 0.08 }); }
        // 진짜 가둠 = 큰 벽 구 4개(표면만 우물 경계·중심은 화면 밖 → 렌더 안 함·경계 물리만).
        const walls = [
          { cx: cen - (BR + rimR), cy: cen, cz: topZ, mass: 1e9, radius: BR }, { cx: cen + (BR + rimR), cy: cen, cz: topZ, mass: 1e9, radius: BR },
          { cx: cen, cy: cen - (BR + rimR), cz: topZ, mass: 1e9, radius: BR }, { cx: cen, cy: cen + (BR + rimR), cz: topZ, mass: 1e9, radius: BR },
        ];
        // 물 = SPH 입자 떼(분지 위에 쏟아 붓는다).
        let seed = 12345; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
        const water = [], n = Math.round(N * N * 0.16), wr = N * 0.035;
        for (let i = 0; i < n; i++) water.push({ cx: cen + (rnd() - 0.5) * rimR * 1.6, cy: cen + (rnd() - 0.5) * rimR * 1.6, cz: topZ + N * 0.22 + rnd() * N * 0.40,
          mass: 1, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0, KEcm: 0, internalKE: 0, internalE: 0, energy: 0, cells: 0, radius: wr, temp: 0, peak: 0.5 });
        w.__water = water;
        w.__terrain = [floor].concat(rim, walls);                     // 경계 물리(앵커는 읽기만)
        w.__entities = [floor].concat(rim, water);                    // 렌더(큰 벽 구는 화면 밖이라 제외)
        w.__topZ = topZ; w.__N = N;
        const h = N * 0.09;
        w.__popt = { stiffness: N * 2, h, gamma: 2 }; w.__vopt = { alpha: 1.5, beta: 2, h, gamma: 2 };
        w.__bopt = { stiffness: N * 4, damp: N * 0.8, skin: N * 0.025 }; w.__grav = N * 0.012;
      },
      advance(w) {
        if (!w.__water) return;
        const wat = w.__water;
        HTJSPH.sphPressureForce(wat, 0.12, w.__popt);                 // 물↔물 압력(퍼짐·0041)
        HTJSPH.sphViscosity(wat, 0.12, w.__vopt);                    // 슬로싱 소산(정착·0046)
        for (const p of wat) p.pz -= p.mass * w.__grav * 0.12;        // 균일 중력(아래·분지가 가둠)
        HTJSPH.sphBoundaryForce(wat, w.__terrain, 0.12, w.__bopt);    // 물↔지형 경계(이 step)
        HTJEntity.stepEntities(wat, 0.12);                            // 위치 적분
        // 색 = 깊이(표층=밝은 파랑·바닥=어두움) → 수면이 드러난다. 지형은 어둡게 고정.
        const topZ = w.__topZ; let zmin = 1e9, zmax = -1e9;
        for (const p of wat) { if (p.cz < zmin) zmin = p.cz; if (p.cz > zmax) zmax = p.cz; }
        for (const p of wat) p.peak = 0.35 + 0.55 * (p.cz - zmin) / (zmax - zmin + 1e-9);
      },
      note: '<b>물(SPH 입자 떼)이 지형 분지에 떨어져 고여 *수평 수면*을 이룬다</b> — 환경 트랙 TW2(바다). <b>▶ 무엇</b>(design/environment.md §3 TW2): 0026~ 동역학·0040~ SPH 물리 스택(밀도·압력·점성…)은 섰지만, <b>물이 *지형*(정적 앵커·0056/0059)을 느끼는 결합</b>이 없어 물이 지형을 그냥 통과했다. 이 step 의 <b>새 엔진 법칙 sphBoundaryForce</b> 가 그 *유일하게 빠진 벽돌* = <b>SPH↔앵커 경계</b>: 물 입자가 앵커 구 표면 안으로 파고들면 <b>바깥으로 반발</b>(Hooke)하고, 파고드는 법선 운동은 <b>감쇠→열</b>(낙하 KE 가 식음). <b>창발</b>: 그러면 <b>중력</b>(아래)+<b>SPH 압력</b>(0041·물끼리 밀어 퍼짐)이 물을 분지(바닥+테 앵커) 안에 <b>고여 수평 표면(등z=등퍼텐셜)</b>으로 평형시킨다 — author 한 건 분지 골격뿐, *수면이 평평해지는 건 법칙이 굴러간 결과*. <b>왜 중요한가</b>: "선 캐릭터=중력↓+접촉↑"의 <b>접촉</b>을 고체(0037)에서 <b>유체(물)</b>로 옮긴 것 — 지형 위에 비로소 <b>물</b>이 얹힌다(딛는 땅 다음 = 바다·호수). <b>앵커=무한 질량 외부 경계</b>(environment §1·0056 정신): 충격을 흡수하고 위치 불변(지구처럼) → 물의 운동량은 그 경계로 빠진다(닫힌계의 *예외 아닌 극한*). <b>보존</b>: 질량 불변·낙하 KE→internalE(열) 비가역 소산(엔트로피↑)·앵커 표면 밖 입자=완전 불변(항등). <b>정직한 한계</b>: 분지 골격은 손수 배치(절차 생성 아님)·작은 패치 규모(끝없는 바다 = TW4 LOD)·물↔지형 일방 결합(지형 정적·침식/깎임 없음)·SPH 표면이 입자 스케일로 울퉁(연속 수면 근사). 다음 환경 벽돌: 강 TW3(경사 따라 흐름·경로 창발)·광활 LOD TW4.'
    },

    // ── step_0061 — M1 신뢰성 병합: 정착한 알맹이들이 한 개체로 coalesce(수박게임·merge-dna.md §4 M1) ──
    //   새 엔진 법칙 coalesceSettled(정착 게이트 병합). 닿아 가라앉은(느림·동결) 인접 개체를 연결 성분 통째로
    //   한 개체로 합친다(mergeGroup 재사용·4 보존량 정확·앵커 제외). 접촉(0037)이 못 합치던 복잡 클러스터 정리.
    '0061': {
      label: 'step_0061 — M1 신뢰성 병합(정착한 알맹이들이 한 개체로·수박게임)', title: 'HTJ — M1: 닿아 정착한 알맹이들이 확실히 한 개체로 coalesce',
      sub: '지면(앵커) 위 작은 구체들이 떨어져 쌓이고, 가라앉아 정착(지속적으로 느림=동결)하면 새 법칙 coalesceSettled 가 인접 덩어리를 한 개체로 합친다(수박게임). 병합·형태 DNA 트랙 M1. 보존: 질량·운동량·각운동량·총E(mergeGroup 0036 재사용)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const GR = N * 0.26, sr = N * 0.05;
        const mk = (cx, cy, cz, m, r, anc) => ({ cx, cy, cz, mass: m, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 5, energy: 5, cells: (4 * Math.PI / 3) * r * r * r, radius: r, temp: 0, peak: 0.15, anchored: !!anc });
        const ents = [mk(cen, cen, cen, 6e4, GR, true)];        // 지면(앵커)
        const gold = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < 14; i++) { const yf = 1 - (i + 0.5) / 14 * 2, rr = Math.sqrt(Math.max(0, 1 - yf * yf)), th = gold * i;
          ents.push(mk(cen + Math.cos(th) * rr * N * 0.40, cen + yf * N * 0.40, cen + Math.sin(th) * rr * N * 0.40, 70, sr)); }
        w.__entities = ents; w.__saved = ents.map(e => ({ cx: e.cx, cy: e.cy, cz: e.cz })); w.__sr = sr;
        w.__gopt = { G: 8e-4, soft: Math.max(2, N * 0.08) }; w.__copt = { k: 15, cDamp: 40 }; w.__fopt = { k: 15, mu: 0.9 };
        w.__mopt = { dwell: 30, vSettle: N * 0.012, vstick: N * 0.03, pad: N * 0.04 };
      },
      advance(w) {
        if (!w.__entities) return;
        let es = w.__entities;
        HTJEntity.applyEntityGravity(es, 0.25, w.__gopt);         // 지면 쪽으로(0028)
        HTJEntity.applyEntityContact(es, 0.25, w.__copt);         // 접촉 반발+감쇠(0037)
        HTJEntity.applyEntityFriction(es, 0.25, w.__fopt);        // 마찰(0057)
        HTJEntity.stepEntities(es, 0.25);
        es = HTJEntity.coalesceSettled(es, 0.25, w.__mopt).entities;  // 정착한 인접 덩어리 → 한 개체(이 step·M1)
        w.__entities = es;
        const sv = w.__saved;                                    // 지면 앵커 고정(정적·앵커는 병합 제외)
        for (let i = 0; i < es.length; i++) if (es[i].anchored) { es[i].cx = sv[i].cx; es[i].cy = sv[i].cy; es[i].cz = sv[i].cz; es[i].px = es[i].py = es[i].pz = 0; }
        // 색 = 크기 tier(작은 알=어두움·합친 큰 개체=밝음) → 수박게임 병합이 색으로 보인다.
        for (const e of es) e.peak = e.anchored ? 0.12 : Math.max(0.18, Math.min(1, (e.radius - w.__sr) / (2.4 * w.__sr) * 0.82 + 0.18));
      },
      note: '<b>닿아 정착한 작은 알맹이들이 확실히 한 개체로 합쳐진다</b>(수박게임) — 병합·형태 DNA 트랙 M1. <b>▶ 무엇</b>(design/merge-dna.md §4 M1): 세계가 커지면 원소를 하나하나 다 굴릴 수 없어 <b>뭉친 건 한 개체로 병합</b>해야 한다. 그런데 기존 합치기(0036)는 *순간* 상대속도(vstick)로만 판정해, 접촉(0037 반발)이 떼어놓고 잔여 진동이 있는 인접 덩어리는 <b>닿아만 있고 안 합쳐졌다</b>(같은 종류라도 복잡한 알맹이 클러스터로 남음). 이 step 의 <b>새 엔진 법칙 coalesceSettled</b> 는 판정을 <b>지속 정착</b>으로 바꾼다: 개체마다 "느린 step 연속 수(settle)"를 세고, 두 개체가 <b>둘 다 충분히 오래 정착(settle≥dwell)</b>하고 닿아 있고 상대운동이 느릴 때만 묶어 <b>연결 성분 통째로</b> 합친다(=0025 활동도/동결 판정의 개체 병합 판). <b>흐름</b>: 지면 위로 14알이 떨어져 → 접촉으로 쌓이고 → 가라앉아 멈추면(정착) → 한 개체로 합쳐진다(반경↑·색이 밝아짐=수박게임 tier). <b>왜 이렇게</b>: 붕괴 도중 순간적으로 느려진 쌍을 *성급히* 안 합치고(dwell 대기), 정말 가라앉은 덩어리만 합쳐 <b>안정적으로 한 개체</b>가 된다. <b>보존</b>: 병합 산술은 mergeGroup(0036) 재사용 → <b>질량·운동량·각운동량(원점)·총E 정확 보존</b>. <b>정적 앵커(지면)는 병합 제외</b>(지형은 안 합쳐짐). <b>왜 중요한가</b>: 이게 "뭉치면 한 개체"(확장성)의 토대 — 다음 M2 에서 합친 개체에 <b>형태 hash(DNA)</b>를 붙여, 큰 원이 아니라 *원래 모양*을 세계 형태 사전에서 복원하게 한다(M3 렌더). <b>정직한 한계</b>: 정착 판정이 <b>절대속도</b> 기준(세계 정지계·자유 공간 comoving 덩어리엔 상대속도 판정이 맞음·후속)·합친 개체는 아직 <b>민둥 구</b>(모양 보존은 M2~M3 형태 DNA)·dwell·vSettle 은 장면 노브.'
    },

    // ── step_0063 — M3 DNA 로 렌더: 합친 개체를 shapeHash→사전→원래 윤곽으로 그림(merge-dna.md §4 M3) ──
    //   engine 불변(렌더 트랙). 합친 개체(0061)+shapeHash(0062)를 reconstructShape 로 *민둥 구가 아니라* 구성원
    //   배치(윤곽)로 펼쳐 그린다 = "큰 원이 지형 모양으로 돌아온다". 같은 모양=같은 윤곽·같은 색(DNA).
    '0063': {
      label: 'step_0063 — M3 DNA 로 렌더(합친 개체가 원래 윤곽으로·큰 원 아님)', title: 'HTJ — M3: 합친 개체를 shapeHash 로 원래 윤곽(L·직선·삼각)으로 그린다',
      sub: '클러스터(L·직선·삼각)가 정착·병합하면, 합친 개체를 shapeHash 로 세계 형태 사전에서 꺼내 *민둥 구가 아니라 원래 윤곽*으로 그린다(reconstructShape). 같은 모양=같은 윤곽·같은 색(DNA). 병합·형태 DNA 트랙 M3. engine·물리 불변(렌더만)',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2, SS = N * 0.06, sr = N * 0.028;
        const L = [[0, 0], [1, 0], [2, 0], [2, 1]], LINE = [[0, 0], [1, 0], [2, 0], [3, 0]], TRI = [[0, 0], [1, 0], [0.5, 1]];
        const mk = (x, y) => ({ cx: x, cy: y, cz: cen, mass: 100, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0,
          KEcm: 0, internalKE: 0, internalE: 5, energy: 5, cells: (4 * Math.PI / 3) * sr * sr * sr, radius: sr, temp: 0, peak: 0.15 });
        const clu = (shape, ox, oy) => shape.map(([x, y]) => mk(ox + x * SS, oy + y * SS));
        const ents = [].concat(
          clu(L, N * 0.16, N * 0.66), clu(L, N * 0.44, N * 0.66), clu(L, N * 0.72, N * 0.66),
          clu(LINE, N * 0.18, N * 0.42), clu(LINE, N * 0.54, N * 0.42),
          clu(TRI, N * 0.22, N * 0.18), clu(TRI, N * 0.58, N * 0.18));
        w.__entities = ents; w.__shapeDict = {}; w.__sr = sr;
        w.__ropt = { quantum: 0.25, spread: 1.1, subScale: 0.62 };          // 윤곽 복원 노브(reconstructShape)
        w.__mopt = { dwell: 14, vSettle: N * 0.01, vstick: N * 0.03, pad: N * 0.03,
          tagMerge: (mem) => HTJShapeDNA.registerShape(w.__shapeDict, mem) };  // 합칠 때 형태 DNA 등록(0062)
      },
      advance(w) {
        if (!w.__entities) return;
        w.__entities = HTJEntity.coalesceSettled(w.__entities, 0.1, w.__mopt).entities;   // 정착→병합+DNA 태깅
        // 색 = 형태 DNA(같은 모양=같은 색) · 병합 전 알 = 어두움.
        for (const e of w.__entities) e.peak = (typeof e.shapeHash === 'string') ? 0.35 + 0.6 * HTJShapeDNA.hashToUnit(e.shapeHash) : 0.15;
      },
      note: '<b>합친 개체가 *민둥 구가 아니라* 원래 윤곽(L·직선·삼각)으로 그려진다</b> — 병합·형태 DNA 트랙 M3. <b>▶ 무엇</b>(design/merge-dna.md §4 M3): M1(0061)으로 뭉친 알맹이가 한 개체로 합쳐지고, M2(0062)로 합친 개체가 <b>형태 코드(shapeHash·DNA)</b>를 들고 세계 <b>형태 사전</b>이 모양을 K종 공유하게 됐다. 그러나 합친 개체를 <b>그릴</b> 땐 여전히 큰 원 하나였다(사용자 지적: "큰 원이 지형 모양이 안 됨"). 이 step 은 그 코드를 <b>발현</b>한다: viewer 가 <b>reconstructShape(개체, 사전)</b> 로 shapeHash → 사전의 canonical 형태를 꺼내, 개체 위치·반경에 맞춰 <b>구성원 점 무리(원래 윤곽)</b>로 펼쳐 그린다. <b>흐름</b>: 클러스터(L 3·직선 2·삼각 2)가 제자리서 정착·병합 → 합친 개체가 <b>원래 윤곽으로</b> 나타난다(L 은 L·직선은 직선·삼각은 삼각). <b>같은 모양 = 같은 hash = 같은 윤곽·같은 색</b>(DNA). <b>왜 중요한가</b>: 물리적으로는 <b>개체 하나(코드 하나)</b>지만, 그림은 <b>원래 모양</b>이다 = "큰 원이 지형 모양으로 돌아온다". 수십만 개체가 K종 형태를 <b>공유</b>해 지형을 이루는 길(원소는 hash 만·형태는 사전이 발현). <b>세계↔확인용 단방향</b>: reconstructShape 는 *어디에 그릴지*(점 위치)만 계산하고 픽셀은 viewer 가 그린다 — engine·물리는 <b>불변</b>(렌더만 바뀜). <b>정직한 한계</b>: 회전 미정규화(회전한 같은 모양→다른 hash·다른 윤곽·PCA 정렬은 후속)·윤곽은 *대략*(양자화 격자 해상도 quantum)·아직 점 무리(메시/표면 아님)·DNA 색은 heatColor 라 형태종류 많으면 색 겹칠 수 있음(윤곽이 주 신호). 다음(선택) M4: 가까이선 윤곽 복원·물리 footprint 공유.'
    },

    // ── step_0064 — TW3 강: 물이 기울인 지형 램프를 *흘러내려* 하류 댐에 고인다(environment.md §3 TW3) ──
    //   새 엔진 법칙 sphBedFriction(바닥 접선 항력). 0060(법선 반발/감쇠)은 *파고드는* 운동만 막아 경사면 물이
    //   끝없이 가속(탄도)했다. 이 step 은 접촉 입자의 *접선 슬립*을 속도비례로 소산→열 → 종단속도(유한)로 정상
    //   흐름(강). 상류(우)서 흘러 들어와 하류(좌) 댐에 고이고, 재순환(통과 흐름)으로 계속 흐른다.
    '0064': {
      label: 'step_0064 — TW3 강(물이 경사 램프를 흘러내려 댐에 고임)', title: 'HTJ — TW3 강: SPH bed friction 으로 물이 경사를 흘러내려 하류 댐에 고인다',
      sub: '기울인 지형 램프(우측 高→좌측 低) 위로 물(SPH 입자)이 *흘러내린다* — 새 법칙 sphBedFriction(바닥 접선 항력)이 종단속도를 줘서 끝없는 가속(탄도) 대신 *일정 속도로 흘러* 하류 댐에 고인다. 환경 트랙 TW3. 잃은 접선 KE→열·앵커=무한질량 외부 경계·재순환=통과 흐름',
      mode: 'energy', dynamics: true, render: 'entities',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const Rf = N * 6, cxF = cen + N * 1.777, czF = -N * 5.193;     // 램프 바닥 = 오른쪽-위 큰 구(우리 패치가 내리막 좌)
        const floorZ = (x) => czF + Math.sqrt(Math.max(0, Rf * Rf - (x - cxF) * (x - cxF)));
        const Cw = N * 0.40, xL = cen - Cw, xR = cen + Cw, BRw = N * 3, Hwy = N * 0.12;
        // 지형 = 정적 앵커(읽기만): 램프 바닥 + 댐(좌·하류) + 상류 back(우) + y 벽(채널 좁힘). 중심은 화면 밖 → 렌더 안 함.
        const terrain = [
          { cx: cxF, cy: cen, cz: czF, mass: 1e9, radius: Rf },
          { cx: xL - BRw, cy: cen, cz: floorZ(xL), mass: 1e9, radius: BRw }, { cx: xR + BRw, cy: cen, cz: floorZ(xR), mass: 1e9, radius: BRw },
          { cx: cen, cy: cen - (BRw + Hwy), cz: floorZ(cen), mass: 1e9, radius: BRw }, { cx: cen, cy: cen + (BRw + Hwy), cz: floorZ(cen), mass: 1e9, radius: BRw },
        ];
        // 보이는 강바닥 마커(렌더 전용·물리 아님) — 내리막 램프 + 댐 윤곽.
        const marks = [];
        for (let x = xL; x <= xR + 1e-9; x += (xR - xL) / 26) marks.push({ cx: x, cy: cen, cz: floorZ(x), radius: N * 0.020, temp: 0, peak: 0.12 });
        for (let z = N * 0.04; z <= N * 0.30; z += N * 0.04) marks.push({ cx: xL, cy: cen, cz: floorZ(xL) + z, radius: N * 0.020, temp: 0, peak: 0.12 });   // 댐(좌·세로벽)
        // 물 = SPH 입자 떼(재순환으로 인구 일정).
        let seed = 12345; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
        const wr = N * 0.035, SRC = Math.round(N * N * 0.045), water = [];
        for (let i = 0; i < SRC; i++) { const x = xR - 1 - rnd() * 4; water.push({ cx: x, cy: cen + (rnd() - 0.5) * Hwy * 1.2, cz: floorZ(x) + N * 0.07 + rnd() * N * 0.04,
          mass: 1, px: 0, py: 0, pz: 0, Lx: 0, Ly: 0, Lz: 0, KEcm: 0, internalKE: 0, internalE: 0, energy: 0, density: 0, cells: 0, radius: wr, temp: 0, peak: 0.6 }); }
        w.__water = water; w.__terrain = terrain; w.__entities = marks.concat(water);
        w.__floorZ = floorZ; w.__cen = cen; w.__xL = xL; w.__xR = xR; w.__Cw = Cw; w.__Hwy = Hwy; w.__seed = seed;
        const h = N * 0.09;
        w.__popt = { stiffness: N * 2, h, gamma: 2 }; w.__vopt = { alpha: 1.5, beta: 2, h, gamma: 2 };
        w.__bopt = { stiffness: N * 4, damp: N * 0.8, skin: N * 0.025 }; w.__grav = N * 0.012; w.__drag = 0.6;
      },
      advance(w) {
        if (!w.__water) return;
        const wat = w.__water, fz = w.__floorZ, xR = w.__xR, Hwy = w.__Hwy, N = w.N, cen = w.__cen;
        let seed = w.__seed; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
        // 재순환: 하류(좌) 댐에 닿은 물을 상류(우)로 되돌림 = *통과 흐름*(강이 흘러 들어와 빠져나감)·count 보존.
        for (const p of wat) if (p.cx < w.__xL + w.__Cw * 0.18) {
          const x = xR - 1 - rnd() * 4; p.cx = x; p.cy = cen + (rnd() - 0.5) * Hwy * 1.2; p.cz = fz(x) + N * 0.07 + rnd() * N * 0.04;
          p.px = 0; p.py = 0; p.pz = 0; p.internalE = 0; p.KEcm = 0; p.energy = 0;
        }
        w.__seed = seed;
        HTJSPH.sphPressureForce(wat, 0.12, w.__popt);                 // 물↔물 압력(0041)
        HTJSPH.sphViscosity(wat, 0.12, w.__vopt);                    // 슬로싱 소산(0046)
        for (const p of wat) p.pz -= p.mass * w.__grav * 0.12;        // 수직 중력(기울기는 램프 바닥에)
        HTJSPH.sphBoundaryForce(wat, w.__terrain, 0.12, w.__bopt);   // 법선 경계(0060)
        HTJSPH.sphBedFriction(wat, w.__terrain, 0.12, { drag: w.__drag, skin: w.__bopt.skin });   // 접선 바닥 항력(이 step)
        HTJEntity.stepEntities(wat, 0.12);                           // 위치 적분
        // 색 = 흐름 속도(빠른 흐름=밝은 파랑·고인 물=어두움) → 강줄기가 드러난다.
        for (const p of wat) p.peak = 0.28 + 0.6 * Math.min(1, (Math.hypot(p.px, p.py, p.pz) / p.mass) / (N * 0.03));
      },
      note: '<b>물이 기울인 지형 램프를 *흘러내려* 하류 댐에 고인다 — 강</b>(환경 트랙 TW3). <b>▶ 무엇</b>(design/environment.md §3 TW3): TW2(0060 sphBoundaryForce)는 물을 지형에 *얹었지만*(법선 반발+법선 감쇠) <b>경사면을 따라 미끄러지는(접선) 운동엔 저항이 0</b> 이었다 → 기울인 바닥 위 물은 중력 접선 성분에 <b>끝없이 가속</b>한다(종단속도 없음 = 강이 아니라 탄도 추락). 이 step 의 <b>새 엔진 법칙 sphBedFriction</b> 이 그 빠진 벽돌 = <b>바닥 접선 항력</b>: 접촉(파고든) 입자의 <b>접선 슬립을 속도에 비례해 소산→열</b>. 속도비례(점성형)라 경사에서 중력 접선(g·sinθ)과 <b>균형 = 종단속도</b>(유한)에 이른다 → 물이 <b>일정 속도로 흘러</b> 강이 된다. <b>흐름</b>: 상류(오른쪽 높은 곳)에서 물이 흘러 들어와, 램프를 <b>일정 속도로 흘러내려</b>(밝은 파랑 = 빠른 흐름), 하류(왼쪽) <b>댐에 고인다</b>(어두운 = 고인 물). 재순환(댐 도달 물을 상류로 되돌림)으로 *통과 흐름*이 계속된다(강이 흘러 들어와 빠져나감). <b>왜 중요한가</b>: TW1(0057)에서 <b>마찰</b>이 알갱이를 경사에 *서게* 했듯, 여기선 <b>바닥 항력</b>이 물을 *흐르게*(종단속도) 한다 — Coulomb(속도무관) 마찰은 멈추거나 무한 가속뿐이라 강을 못 만든다. 이것은 <b>0046(입자↔입자 점성 소산)의 바닥↔입자 판</b>이자 <b>0057(접촉 접선 마찰)의 SPH↔앵커 판</b>. <b>보존</b>: 잃은 접선 KE→internalE(열·비가역·시간의 화살)·법선 운동 불변(접선만)·질량 불변·앵커=무한질량 외부 경계(잃은 운동량은 경계로). drag=0 → 0060 단독으로 회귀(가법·회귀0). <b>정직한 한계</b>: 램프 골격은 손수 배치(절차 생성/무한 광활 아님·TW4 LOD)·작은 패치 규모·지형 정적(침식·깎임 없음·물↔지형 일방)·viewer 재순환은 *확인용* 통과-흐름 연출(engine·verify·capture 는 정직한 일방 물리). 다음 환경 벽돌: 광활 LOD TW4·물↔지형 왕복(침식).'
    },

    // ── step_0065 — T1 지형 표면 발현: 높이장 앵커 카펫을 *연속 음영 표면*으로(점→면·merge-dna.md §5 T1) ──
    //   렌더 트랙(engine 물리 불변). 0059 형 지형 앵커(민둥 구로 그리던)를 terrainSurface 로 환원해 drawSurface 로
    //   *법선 음영 연속 표면*으로 그린다 = "지형이 안 자연스럽다"의 가시적 답(점 무리→땅).
    '0065': {
      label: 'step_0065 — T1 지형 표면 발현(앵커 카펫이 연속 음영 표면으로·점→면)', title: 'HTJ — T1: 지형 높이장 앵커를 민둥 구가 아니라 연속 음영 표면으로 발현',
      sub: '지형(TW1·0059 의 높이장 봉우리 앵커 카펫)을 viewer 가 *민둥 구 점 무리*로 그리던 것을, terrainSurface(앵커→조밀 연속 높이장+법선)로 환원해 drawSurface 로 *법선 음영 연속 표면*으로 그린다(점→면). engine·물리 불변(렌더 트랙) — 형태(높이·법선)는 engine(htj-terrain)이 들고 픽셀·음영은 viewer 가 입힌다(단방향). merge-dna.md §5 T1',
      mode: 'energy', dynamics: false, render: 'terrain',
      defaults: { colorScale: 'relative', view: 'energy' },
      init(w) {
        const N = w.N, cen = (N - 1) / 2;
        const SPC = N * 0.08, Wt = N * 0.40;
        const hf = (x, y) => N * 0.10 * Math.sin(0.36 / (N / 40) * x) * Math.cos(0.3 / (N / 40) * y) + N * 0.07 * Math.sin((0.24 * x + 0.2 * y) / (N / 40));
        const topZ = cen + N * 0.10;
        // 0059 형 봉우리 앵커 카펫(정규 격자) — 여기선 *표면 발현*만(자유 구체·동역학 없음).
        const anchors = [];
        for (let gx = -Wt; gx <= Wt; gx += SPC) for (let gy = -Wt; gy <= Wt; gy += SPC)
          anchors.push({ cx: cen + gx, cy: cen + gy, cz: topZ + hf(gx, gy) });
        // terrainSurface = engine(htj-terrain) 형태 환원 — 성긴 앵커 점 → 조밀 연속 높이장 + 정점 법선(점→면).
        w.__surface = HTJTerrain.terrainSurface(anchors, { up: 4 });
        let hMax = -Infinity; for (const h of w.__surface.heights) if (h > hMax) hMax = h; w.__hMax = hMax;
      },
      advance() { /* 정적 표면 발현 — 동역학 없음(렌더 트랙) */ },
      note: '<b>지형(높이장 앵커 카펫)이 *민둥 구 점 무리*가 아니라 *연속 음영 표면(땅)*으로 발현된다</b> — 병합·형태 DNA 트랙 T1(지형 발현). <b>▶ 무엇</b>(design/merge-dna.md §5 T1): 동역학(0026~)·환경 물리(TW1~3·정착·마찰·바다·강)·병합 DNA(M1~M3)는 다 섰는데도 사용자가 "지형이 안 자연스럽다"고 한 까닭 = <b>두 격차</b>: ① <b>배선</b> — 지형은 정적 앵커 카펫이라 병합/형태 DNA(0061~0063) 경로를 안 탄다(coalesce 가 앵커 제외) ② <b>표현</b> — viewer 가 그 앵커를 *하나하나 민둥 구*로 그려 "공 무더기"지 "땅"이 아니다. 이 step 은 그중 <b>②(표현)를 점→면</b>으로 올린다: <b>terrainSurface</b>(engine·htj-terrain)가 성긴 앵커 점 격자를 <b>조밀한 연속 높이장 + 정점 법선</b>으로 환원하고(bilinear 업샘플·×12.8 정점), viewer 의 <b>drawSurface</b>가 그 표면을 <b>법선 음영(n·L)</b>으로 채워 그린다. <b>흐름</b>(capture 4 패널): ① 앵커 점(민둥 구·old) → ② 표면 정점(조밀) → ③ 표면 채움(면) → ④ 법선 음영(기운 면이 밝기 차 = 자연스러운 땅). <b>왜 중요한가</b>: "발현은 점이 아니라 표면"(§5 원칙 3) — 같은 지형 데이터가 *공 무더기*에서 *이어진 땅*으로 보인다. <b>세계↔확인용 단방향</b>: engine(htj-terrain)은 표면의 <b>형태(높이·법선)</b>만 들고(읽기 전용·순수·물리량 안 건드림·detectClumps/reconstructShape 부류), 픽셀·음영색은 viewer 가 입힌다 → engine·물리는 <b>불변</b>(렌더 트랙·회귀0 구조적). <b>정직한 한계</b>: ①(배선)은 아직 — 지형 청크를 registerShape 로 사전 등록·hash·dedup(K≪N)는 <b>T2</b>·거리 LOD 는 <b>T3</b>(TW4 합류). 표면은 손수 높이장 골격(절차 생성/무한 광활 아님)·정적(침식 없음)·단일 패치(끝없는 펼침=TW4). 색은 heatColor(높이)·법선 음영 — 흙/풀 재질은 후속. 다음: T2 지형 형태 DNA 배선(K≪N) 또는 T3 거리 LOD(TW4).'
    }
  };
  function currentStep() { return document.getElementById('step').value || '0003'; }

  // 파생 온도 장 갱신 — T=u/ρ 를 'temperature' 장에 복사(렌더가 고를 수 있게). 법칙 아님(측정·표시).
  function updateTemperature(w) {
    if (!w.fields.therm) return;
    if (!w.fields.temperature) w.addField('temperature');
    w.fields.temperature.set(HTJThermal.temperature(w));
  }

  function resize() {
    const r = cv.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, (r.width * dpr) | 0);
    cv.height = Math.max(2, (r.height * dpr) | 0);
    render();
  }

  function readN() { return Math.max(4, Math.min(48, parseInt(document.getElementById('N').value, 10) || 24)); }
  function readAlpha() { return Math.max(0, Math.min(HTJEnergy.ALPHA_MAX, parseFloat(document.getElementById('alpha').value) || 0)); }
  function readSpeed() { return Math.max(1, Math.min(50, parseInt(document.getElementById('speed').value, 10) || 1)); }
  function readSpeedMult() { return Math.max(0.05, parseFloat(document.getElementById('speedMult').value) || 1); }   // 배속 배수(분수=느린재생, 정수=빨리감기)
  function readRate() { return Math.max(0, Math.min(1, parseFloat(document.getElementById('rate').value) || 0)); }
  function readCrit() { return Math.max(0, parseFloat(document.getElementById('crit').value) || 0); }
  function readRadiate() { return Math.max(0, Math.min(1, parseFloat(document.getElementById('radiate').value) || 0)); }
  function readKpress() { return Math.max(0, Math.min(2, parseFloat(document.getElementById('kpress').value) || 0)); }
  function readKthermo() { return Math.max(0, Math.min(2, parseFloat(document.getElementById('kthermo').value) || 0)); }
  function readKvisc() { return Math.max(0, Math.min(4, parseFloat(document.getElementById('kvisc').value) || 0)); }
  function readFrate() { return Math.max(0, Math.min(5, parseFloat(document.getElementById('frate').value) || 0)); }
  function readColorMax() { return Math.max(0, parseFloat(document.getElementById('colorMax').value) || 0); }
  function advanceParams() { return { alpha: readAlpha(), rate: readRate(), crit: readCrit(), radiate: readRadiate(), kpress: readKpress(), kthermo: readKthermo(), kvisc: readKvisc(), frate: readFrate() }; }
  function readBrushR() { return Math.max(0, Math.min(6, parseInt(document.getElementById('brushR').value, 10) || 0)); }
  function readBrushAmt() { return Math.max(0, parseFloat(document.getElementById('brushAmt').value) || 0); }
  function brushField() { return document.getElementById('brushField').value || 'energy'; }

  // 인터랙션 대상 장 드롭다운을 world.fields 에서 채운다(장이 늘면 자동 반영).
  function refreshFieldOptions() {
    const sel = document.getElementById('brushField'), prev = sel.value;
    sel.innerHTML = '';
    for (const name of Object.keys(world.fields)) {
      const o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o);
    }
    if (prev && world.fields[prev]) sel.value = prev;
  }

  // 리셋 — 현재 step 의 장면으로 세계를 다시 만든다.
  function reset() {
    const st = STEPS[currentStep()];
    mode = st.mode;
    world = HTJWorld.createWorld(readN());
    st.init(world);
    tick = 0;
    refreshFieldOptions();
    render();
    updateStats();
  }

  // step 전환 — 헤더·설명·컨트롤 가시성을 바꾸고 장면을 리셋한다.
  function applyStep() {
    setPlaying(false);
    const st = STEPS[currentStep()];
    document.getElementById('title').textContent = st.title;
    document.getElementById('sub').textContent = st.sub + ' (step_' + currentStep() + ')';
    document.getElementById('note').innerHTML = st.note;
    document.getElementById('dyn').style.display = st.dynamics ? '' : 'none';
    document.getElementById('row-rate').style.display = st.release ? '' : 'none';   // 방출율은 방출 step 에서만
    document.getElementById('row-crit').style.display = st.ignite ? '' : 'none';    // 점화 임계는 점화 step 에서만
    document.getElementById('row-radiate').style.display = st.radiate ? '' : 'none'; // 복사율은 sink step 에서만
    document.getElementById('row-pressure').style.display = st.pressure ? '' : 'none'; // 반발(K)은 압력 step 에서만
    document.getElementById('row-thermp').style.display = st.thermP ? '' : 'none';     // 열압력(Kth)은 능동 열압력 step 에서만
    document.getElementById('row-visc').style.display = st.visc ? '' : 'none';         // 점성(Kvisc)은 소산 step 에서만
    document.getElementById('row-fusion').style.display = st.fusion ? '' : 'none';     // 발열률(rate)은 점화 step 에서만
    // step별 *관찰하기 좋은* 기본 노브 적용(α·방출율·임계·복사율·반발·색 기준).
    const d = st.defaults || {};
    if (d.alpha != null) document.getElementById('alpha').value = d.alpha;
    if (d.rate != null) document.getElementById('rate').value = d.rate;
    if (d.crit != null) document.getElementById('crit').value = d.crit;
    if (d.radiate != null) document.getElementById('radiate').value = d.radiate;
    if (d.kpress != null) document.getElementById('kpress').value = d.kpress;
    if (d.kthermo != null) document.getElementById('kthermo').value = d.kthermo;
    if (d.kvisc != null) document.getElementById('kvisc').value = d.kvisc;
    if (d.frate != null) document.getElementById('frate').value = d.frate;
    document.getElementById('colorScale').value = d.colorScale || 'relative';
    if (d.colorMax != null) document.getElementById('colorMax').value = d.colorMax;
    document.getElementById('row-colormax').style.display = document.getElementById('colorScale').value === 'absolute' ? '' : 'none';
    reset();
    // 시작 시 보여줄 장(검은 화면 방지 등).
    if (d.view && world.fields[d.view]) { document.getElementById('brushField').value = d.view; render(); }
  }

  function updateStats() {
    const hasPot = !!world.fields.potential, hasRad = world.radiated != null;
    document.getElementById('s-tick').textContent = tick;
    document.getElementById('s-pot-row').style.display = hasPot ? '' : 'none';
    if (hasPot) document.getElementById('s-pot').textContent = world.total('potential').toFixed(2);
    document.getElementById('s-rad-row').style.display = hasRad ? '' : 'none';
    if (hasRad) document.getElementById('s-rad').textContent = world.radiated.toFixed(2);
    document.getElementById('s-total').textContent = world.total('energy').toFixed(2);
    document.getElementById('s-entropy').textContent = HTJEnergy.entropy(world).toFixed(4);
    document.getElementById('s-occ').textContent = world.count('energy', 1e-9);
    document.getElementById('s-cells').textContent = world.fields.energy.length;
    document.getElementById('s-max').textContent = world.max('energy').toFixed(3);
  }

  function render() {
    if (!world) return;
    // 덩어리 구체 렌더 step(0014) — 셀 voxel 대신 검출 개체를 구체로 그린다(읽기 전용 환원).
    const stCur = STEPS[currentStep()];
    if (stCur && stCur.render === 'spheres' && typeof HTJCluster !== 'undefined') {
      const mean = world.total('energy') / world.fields.energy.length;
      const eps = mean > 0 ? Math.max(mean * 1.5, 1e-9) : 1e-9;   // 본체 임계(평균 위) — 헤일로 제외
      const clumps = HTJCluster.detectClumps(world, { eps, minCells: 2 });
      surf = HTJRender.drawClumps(ctx, world, cam, clumps);
      return;
    }
    // 개체 드리프트(0027): 격자는 비어 있고 승격된 개체 1개를 구체로 그린다(위치만 바뀌며 직진).
    if (stCur && stCur.render === 'entity') {
      const e = world.__entity;
      const clumps = e ? [{ cx: e.cx, cy: e.cy, cz: e.cz, radius: e.radius, peak: e.peak || e.temp || 1 }] : [];
      surf = HTJRender.drawClumps(ctx, world, cam, clumps);
      const lab = document.getElementById('s-occ'); if (lab && e) lab.textContent = `개체 1 @ (${e.cx.toFixed(1)},${e.cy.toFixed(1)},${e.cz.toFixed(1)}) v=(${(e.px / e.mass).toFixed(2)},${(e.py / e.mass).toFixed(2)},${(e.pz / e.mass).toFixed(2)})`;
      return;
    }
    // 자동 승격 하이브리드(0030): 유체 voxel(draw) 위에 승격 개체(drawEntities)를 오버레이.
    if (stCur && stCur.render === 'hybrid' && world.__hyb) {
      const mean = world.total('energy') / world.fields.energy.length, max = mean > 0 ? mean * 2 : 0;
      surf = HTJRender.draw(ctx, world, cam, { field: 'energy', colormap: 'heat', max, eps: 1e-9 });
      HTJRender.drawEntities(ctx, world, cam, world.__hyb.entities);
      const lab = document.getElementById('s-occ'); if (lab) lab.textContent = `${world.count('energy', 1e-9)} 유체칸 · 개체 ${world.__hyb.entities.length}개(승격)`;
      return;
    }
    // 개체간 중력(0028): 격자는 비어 있고 여러 개체를 구체로 그린다(서로 끌려 휘는 궤적).
    if (stCur && stCur.render === 'entities') {
      const es = world.__entities || [];
      const dict = world.__shapeDict;                          // (M3) 형태 DNA 사전(있으면 합친 개체를 윤곽으로)
      const clumps = [];
      for (const e of es) {
        const shape = dict ? HTJShapeDNA.reconstructShape(e, dict, world.__ropt) : null;   // shapeHash→원래 윤곽(점 무리)
        if (shape) { const peak = e.peak || 1; for (const p of shape) clumps.push({ cx: p.cx, cy: p.cy, cz: p.cz, radius: p.r, peak }); }
        else clumps.push({ cx: e.cx, cy: e.cy, cz: e.cz, radius: e.radius, peak: e.peak || e.temp || 1 });   // DNA 없음 → 단일 구(기존)
      }
      surf = HTJRender.drawClumps(ctx, world, cam, clumps);
      const lab = document.getElementById('s-occ'); if (lab) { let P = [0, 0, 0]; for (const e of es) { P[0] += e.px; P[1] += e.py; P[2] += e.pz; } lab.textContent = `개체 ${es.length} · ΣP=(${P[0].toFixed(2)},${P[1].toFixed(2)},${P[2].toFixed(2)})`; }
      return;
    }
    // 지형 표면(0065·T1): 높이장 앵커 카펫을 terrainSurface 로 환원해 *연속 음영 표면*으로 그린다(점→면).
    if (stCur && stCur.render === 'terrain' && world.__surface) {
      surf = HTJRender.drawSurface(ctx, world, cam, world.__surface, { heightMax: world.__hMax });
      const lab = document.getElementById('s-occ'); if (lab) lab.textContent = `지형 표면 ${world.__surface.count} 정점(앵커 ${world.__surface.anchorCount} → 면) · 사각형 ${surf}`;
      return;
    }
    // 확장성 오버레이(scal): 별 voxel 위에 8³ 블록 상태(활성/동결)를 와이어프레임으로 덧그린다.
    if (stCur && stCur.render === 'scalability' && world.__scal) {
      const mean = world.total('energy') / world.fields.energy.length, max = mean > 0 ? mean * 2 : 0;
      surf = HTJRender.draw(ctx, world, cam, { field: 'energy', colormap: 'heat', max, eps: 1e-9 });
      const S = world.__scal, origins = S.set.origins(), bs = S.bs, nbx = Math.ceil(world.N / bs);
      const fk = new Set(S.tracker.frozenOrigins(origins, S.hold).map(o => ((o[2] / bs | 0) * nbx + (o[1] / bs | 0)) * nbx + (o[0] / bs | 0)));
      const blocks = origins.map(o => ({ ox: o[0], oy: o[1], oz: o[2], bs, state: fk.has(((o[2] / bs | 0) * nbx + (o[1] / bs | 0)) * nbx + (o[0] / bs | 0)) ? 'frozen' : 'active' }));
      const cnt = HTJRender.drawBlocks(ctx, world, cam, blocks);
      const lab = document.getElementById('s-occ'); if (lab) lab.textContent = `${world.count('energy', 1e-9)} (블록 활성 ${cnt.nActive}·동결 ${cnt.nFrozen})`;
      return;
    }
    let name = brushField();
    if (!world.fields[name]) name = world.fields.energy ? 'energy' : Object.keys(world.fields)[0];  // 선택 장이 없으면 폴백
    if (!name) return;
    // 색 기준 두 가지:
    //  · 상대(평균): max = 평균*2 → "평균 대비" 분포를 본다(퍼지면 균일 색). 절대 총량은 색에 안 나타남.
    //  · 절대(고정): max = 색최대E 고정값 → 같은 에너지는 늘 같은 색. *에너지가 빠져나가 어두워지는 것*·
    //    별이 *계속 밝게* 유지되는 것이 보인다. (max=0 이면 draw 가 자동 폴백.)
    let max;
    if (document.getElementById('colorScale').value === 'absolute') max = readColorMax();
    else { const mean = world.total(name) / world.fields[name].length; max = mean > 0 ? mean * 2 : 0; }
    surf = HTJRender.draw(ctx, world, cam, {
      field: name, colormap: mode === 'cells' ? 'palette' : 'heat', max
    });
  }

  // 열 주입 — 클릭 지점의 셀을 픽해, 붓 반경의 구(球) 안 셀에 열량을 더한다(선택한 장).
  //   동역학 없는 step(무대 등)에선 주입하지 않는다.
  function injectAt(sx, sy) {
    if (!STEPS[currentStep()].dynamics) return;
    const cell = HTJRender.pick(ctx, world, cam, sx, sy);
    if (!cell) return;
    const name = brushField(), r = readBrushR(), amt = readBrushAmt();
    const [cx, cy, cz] = cell;
    for (let dz = -r; dz <= r; dz++)
      for (let dy = -r; dy <= r; dy++)
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy + dz * dz > r * r + 0.5) continue;   // 구 안만
          const x = cx + dx, y = cy + dy, z = cz + dz;
          if (world.inBounds(x, y, z)) world.set(name, x, y, z, world.get(name, x, y, z) + amt);
        }
    render(); updateStats();
  }

  // 스텝 — 현재 step 의 법칙을 1회 굴린다(0002=확산 / 0003=방출+확산). 동역학 step 에서만.
  // 별 step(autoEnergyView)은 로드 시 연료(potential)를 보여주다가, 동역학이 시작되면
  //   결과가 보이는 energy 장으로 자동 전환한다(까만 화면 방지 + 별이 켜지는 걸 바로 보이게).
  function maybeAutoEnergyView() {
    const d = STEPS[currentStep()].defaults || {};
    const bf = document.getElementById('brushField');
    if (d.autoEnergyView && bf.value === 'potential' && world.fields.energy) bf.value = 'energy';
  }

  function stepOnce() { const st = STEPS[currentStep()]; if (!st.dynamics) return; maybeAutoEnergyView(); st.advance(world, advanceParams()); tick++; render(); updateStats(); }

  // 흐름 — 법칙을 연속 재생(시점 회전이 아니라 *세계의 동역학*).
  //   프레임당 스텝 수 = 스텝/프레임 × 배속. 누산기(stepAccum)로 분수 배속(느린 재생)도 매끄럽게 —
  //   ×0.25 면 4프레임마다 한 묶음이 굴러간다. 정수 배속은 빨리감기.
  let raf = 0, stepAccum = 0;
  function loop() {
    if (!playing) return;
    const st = STEPS[currentStep()], p = advanceParams();
    stepAccum += readSpeed() * readSpeedMult();
    const n = Math.floor(stepAccum); stepAccum -= n;
    for (let k = 0; k < n; k++) { st.advance(world, p); tick++; }   // 변화가 눈에 보이게 묶어서
    if (n > 0) { render(); updateStats(); }
    raf = requestAnimationFrame(loop);
  }
  function setPlaying(on) {
    playing = on;
    document.getElementById('play').textContent = on ? '⏸ 멈춤' : '▶ 흐름';
    if (on) { stepAccum = 0; maybeAutoEnergyView(); raf = requestAnimationFrame(loop); } else cancelAnimationFrame(raf);
  }

  // 클릭 화면좌표 → 캔버스 픽셀좌표(CSS 크기·dpr 보정).
  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height)];
  }

  // ── 오빗 + 클릭 주입 ──
  //   좌버튼: 시작점에서 거의 안 움직이면(≤3px) 클릭=열 주입 / 움직이면 회전. 우버튼: 이동.
  let drag = null;
  cv.addEventListener('mousedown', e => {
    drag = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, b: e.button, moved: false };
    e.preventDefault();
  });
  window.addEventListener('mouseup', e => {
    if (drag && drag.b === 0 && !drag.moved) { const [px, py] = toCanvas(e); injectAt(px, py); }
    drag = null;
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 3) drag.moved = true;
    if (drag.b === 2) { cam.panX += dx; cam.panY += dy; render(); }
    else if (drag.moved) { cam.yaw += dx * 0.01; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.01)); render(); }
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { cam.zoom = Math.max(0.2, Math.min(5, cam.zoom * (e.deltaY < 0 ? 1.1 : 0.9))); render(); e.preventDefault(); }, { passive: false });

  // step 드롭다운 채우기.
  (function () {
    const sel = document.getElementById('step');
    for (const key of Object.keys(STEPS)) {
      const o = document.createElement('option'); o.value = key; o.textContent = STEPS[key].label; sel.appendChild(o);
    }
    sel.value = '0054';                       // 기본 = 현재 step
  })();

  // ── 버튼 ──
  document.getElementById('step').onchange = applyStep;
  document.getElementById('play').onclick = () => setPlaying(!playing);
  document.getElementById('step-btn').onclick = stepOnce;
  document.getElementById('reset').onclick = () => { setPlaying(false); reset(); };
  document.getElementById('N').onchange = () => { setPlaying(false); reset(); };
  document.getElementById('brushField').onchange = render;
  document.getElementById('colorScale').onchange = () => {
    document.getElementById('row-colormax').style.display = document.getElementById('colorScale').value === 'absolute' ? '' : 'none';
    render();
  };
  document.getElementById('colorMax').onchange = render;
  document.getElementById('capture').onclick = () => {
    const a = document.createElement('a');
    a.download = 'htj-' + currentStep() + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', resize);

  // 헤드리스 캡처/검증용 전역 훅 — capture.js 가 이 핸들로 세계를 굴리고 그린다.
  window.HTJViewer = {
    get world() { return world; }, cam,
    setSize(w, h) { cv.width = w; cv.height = h; },
    // 에너지 모드(step_0002) — 중앙 핫스팟 초기화.
    energyInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJEnergy.seedHotSpot(world, opts || { E0: 1000, half: 0 });
      tick = 0;
    },
    diffuse(alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    entropy() { return HTJEnergy.entropy(world); },
    totalEnergy() { return world.total('energy'); },
    maxEnergy() { return world.max('energy'); },
    // 탄생 모드(step_0003) — 중앙 잠재력 저장고(에너지=0)로 초기화.
    potentialInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJPotential.seedPotential(world, opts || { P0: 1000, r: (N | 0) * 0.18 });
      tick = 0;
    },
    // 방출+확산을 steps 회 굴린다(세계의 동역학).
    release(rate, alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJPotential.releaseEnergy(world, rate); HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    // 별 모드(step_0004) — 별밭 초기화(코어+가스).
    starInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJPotential.seedStarField(world, opts || { core: 1000, background: 50, r: (N | 0) * 0.25 });
      tick = 0;
    },
    // 임계 방출+확산을 steps 회 굴린다(별의 점화).
    igniteRun(rate, crit, alpha, steps) { for (let t = 0; t < (steps || 1); t++) { HTJPotential.releaseEnergy(world, rate, { crit }); HTJEnergy.diffuseEnergy(world, alpha); tick++; } },
    // 점화+확산+복사(sink)를 steps 회 굴린다(빛나는 별, step_0005).
    steadyRun(rate, crit, alpha, rad, steps) { for (let t = 0; t < (steps || 1); t++) { HTJPotential.releaseEnergy(world, rate, { crit }); HTJEnergy.diffuseEnergy(world, alpha); HTJRadiate.radiate(world, rad); tick++; } },
    radiated() { return world.radiated || 0; },
    // 관성 모드(step_0006) — 움직이는 질량 덩어리 초기화.
    inertiaInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJInertia.seedMovingBlob(world, opts || { cx: (N | 0) * 0.25, vx: 0.5, M0: 1000, sigma: (N | 0) * 0.1 });
      tick = 0;
    },
    // 탄도 이류를 steps 회 굴린다(질량이 운동량을 싣고 직진).
    inertiaRun(dt, steps) { for (let t = 0; t < (steps || 1); t++) { HTJInertia.advect(world, dt); tick++; } },
    centerOfMass() { return HTJInertia.centerOfMass(world); },
    // 중력 모드(step_0007) — 질량 구름/덩어리 초기화.
    gravityInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJGravity.seedTwoMasses(world, opts || { sep: 0, sigma: (N | 0) * 0.16, M0: 1000 });
      tick = 0;
    },
    // 중력 가속 + 이류를 steps 회 굴린다(질량이 뭉친다).
    gravityRun(G, dt, iters, steps) { for (let t = 0; t < (steps || 1); t++) { HTJGravity.applyGravity(world, dt, { G, iters }); HTJInertia.advect(world, dt); tick++; } },
    // 반발 모드(step_0008) — 과밀 구름 초기화.
    pressureInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJPressure.seedBlob(world, opts || { sigma: (N | 0) * 0.16, M0: 1000 });
      tick = 0;
    },
    // 중력 + 반발(압력) + 이류를 steps 회 굴린다(유한 코어가 선다).
    pressureRun(G, K, dt, iters, steps) { for (let t = 0; t < (steps || 1); t++) { HTJGravity.applyGravity(world, dt, { G, iters }); HTJPressure.applyPressure(world, dt, { K, gamma: 2 }); HTJInertia.advect(world, dt); tick++; } },
    // 온도 모드(step_0009) — 균일 온도 과밀 구름 초기화.
    thermalInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJThermal.seedWarmBlob(world, opts || { sigma: (N | 0) * 0.16, M0: 1000, T0: 1 });
      tick = 0;
    },
    // 중력 + 반발 + 이류(+내부E 수송) + 압축 가열을 steps 회 굴린다(뜨거운 코어가 창발).
    thermalRun(G, K, dt, iters, steps) { for (let t = 0; t < (steps || 1); t++) { HTJGravity.applyGravity(world, dt, { G, iters }); HTJPressure.applyPressure(world, dt, { K, gamma: 2 }); HTJInertia.advect(world, dt, { scalars: ['therm'] }); HTJThermal.applyHeating(world, dt, { gamma: 5 / 3 }); tick++; } },
    coreTemperature() { const T = HTJThermal.temperature(world), N = world.N, c = (N - 1) / 2 | 0; return T[(c * N + c) * N + c]; },
    // 능동 열압력 모드(step_0010) — 작고 뜨거운 압축 덩어리 초기화.
    thermPressInit(N, opts) {
      mode = 'energy';
      world = HTJWorld.createWorld(N | 0);
      HTJThermal.seedWarmBlob(world, opts || { sigma: (N | 0) * 0.10, M0: 1000, T0: 3 });
      tick = 0;
    },
    // 열압력 푸시+PdV(KE↔u) + 이류를 steps 회 굴린다(열이 물질을 민다).
    thermPressRun(Kth, dt, steps) { for (let t = 0; t < (steps || 1); t++) { HTJThermal.applyThermalPressure(world, dt, { Kth, gamma: 5 / 3 }); HTJInertia.advect(world, dt, { scalars: ['therm'] }); tick++; } },
    kineticEnergy() { return HTJThermal.kineticEnergy(world); },
    internalEnergy() { return HTJThermal.totalInternal(world); },
    maxField2(name) { return world.max(name); },
    totalField(name) { return world.total(name); },
    maxField(name) { return world.max(name); },
    // 특정 장을 그린다(capture 가 골라 캡처). absMax>0 면 절대 색 스케일, 아니면 평균*2 상대.
    drawField(name, absMax) {
      const max = absMax > 0 ? absMax : (() => { const mn = world.total(name) / world.fields[name].length; return mn > 0 ? mn * 2 : 0; })();
      surf = HTJRender.draw(ctx, world, cam, { field: name, colormap: 'heat', max });
    },
    // 기반 무대 모드(step_0001 회귀 호환) — 'energy' 장에 데모 공(팔레트 렌더).
    reseed(N, seed) {
      mode = 'cells';
      world = HTJWorld.createWorld(N | 0);
      HTJWorld.seedBall(world, { seed: (seed >>> 0) });
      tick = 0; surf = 0;
    },
    setCamera(c) { Object.assign(cam, c); },
    render, get surf() { return surf; },
  };

  applyStep();   // 헤더·설명·컨트롤 가시성 + 장면 초기화
  resize();
})();
</script>
</body>
</html>
