name: Intent Validate

on:
  push:
    paths:
      - 'Docs/intents/I-*.md'
      - 'Tools/intent-system/**'
  pull_request:
    paths:
      - 'Docs/intents/I-*.md'
      - 'Tools/intent-system/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml
        working-directory: Tools/intent-system

      - name: Validate intents
        id: validate
        run: python -m intentsys validate --intents-dir ../../Docs/intents
        working-directory: Tools/intent-system
