name: Intent Validate

on:
  push:
    paths:
      - 'Docs/intents/I-*.md'
      - 'Tools/intent-system/**'
  pull_request:
    paths:
      - 'Docs/intents/I-*.md'
      - 'Tools/intent-system/**'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml
        working-directory: Tools/intent-system

      - name: Validate intents
        id: validate
        run: python -m intentsys validate --intents-dir ../../Docs/intents
        working-directory: Tools/intent-system

      - name: Create issue on failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Intent validation failed on ${sha}`,
              body: `Intent validation failed on commit [${context.sha}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}).\n\nSee the [workflow run](${runUrl}) for details.`,
              labels: ['intent-validation'],
            });
