name: Intent Sync Draft

# main 푸시 직후 intents/draft 브랜치를 main 으로 fast-forward 한다.
# draft 브랜치는 토큰 미설정 사이트(Docs/intents/site.html)가 읽는 기본 ref 이며,
# main 정리/머지 이후에도 stale 한 intent 파일이 노출되는 것을 막기 위해 동기화한다.
#
# FF 전용: draft 에 main 에 없는 커밋이 있으면 일부러 실패시켜 사람이 확인하도록 한다.
# (force push 금지)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intentsys-sync-draft
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward intents/draft to main
        run: git push origin "${GITHUB_SHA}:refs/heads/intents/draft"
